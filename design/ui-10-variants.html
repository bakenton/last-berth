<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LAST BERTH — 10 вариантов интерфейса</title>
<style>
:root{--bg:#0B0B0C;--pan:#17171A;--ink:#F2F1EC;--mid:#9C9B95;--dim:#5E5D58;--red:#FF2A1A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 ui-monospace,Consolas,Menlo,monospace;padding:20px 16px 60px}
h1{font-size:18px;margin:0 0 4px;letter-spacing:.08em}
.sub{color:var(--mid);margin:0 0 16px}
.dict{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 12px;border:1px solid var(--dim);margin-bottom:22px}
.dict span{display:inline-flex;align-items:center;gap:6px;color:var(--mid);font-size:12px}
.dict svg{width:22px;height:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:26px 22px}
.card h2{font-size:15px;margin:0 0 2px;letter-spacing:.06em}
.card h2 b{color:var(--red);margin-right:8px}
.card .idea{color:var(--mid);margin:0 0 8px;font-size:13px}
.card svg.m{display:block;width:100%;height:auto;border:1px solid var(--dim);background:var(--bg)}
ol{list-style:none;margin:8px 0 6px;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:3px 14px;font-size:13px}
ol li{display:flex;gap:7px;align-items:baseline}
ol li i{flex:none;font-style:normal;background:var(--ink);color:#000;font-weight:700;font-size:11px;width:17px;height:17px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;transform:translateY(2px)}
.pm{font-size:12.5px;color:var(--mid);margin:0}
.pm .p{color:#3DDC84}.pm .n{color:#FF8A1F}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-metal" viewBox="-9 -9 18 18" overflow="visible"><path d="M-7 5L-4 -5H4L7 5Z" fill="currentColor"/></symbol>
<symbol id="i-food" viewBox="-9 -9 18 18" overflow="visible"><path d="M0 7C-9 1-5-7 0-7C5-7 9 1 0 7Z" fill="currentColor"/><path d="M0 7V-2" stroke="#0B0B0C" stroke-width="1.3"/></symbol>
<symbol id="i-fuel" viewBox="-9 -9 18 18" overflow="visible"><path d="M0-8C6 0 6 4 0 7C-6 4-6 0 0-8Z" fill="currentColor"/></symbol>
<symbol id="i-parts" viewBox="-9 -9 18 18" overflow="visible"><circle r="5" fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="2.6 2.63"/><circle r="3.6" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
<symbol id="i-people" viewBox="-9 -9 18 18" overflow="visible"><circle cy="-4.5" r="3" fill="currentColor"/><path d="M-6 7C-6-2 6-2 6 7Z" fill="currentColor"/></symbol>
<symbol id="i-night" viewBox="-9 -9 18 18" overflow="visible"><path d="M3-7A7.5 7.5 0 1 0 3 7A9 9 0 0 1 3-7Z" fill="currentColor"/></symbol>
<symbol id="i-ark" viewBox="-13 -9 26 18" overflow="visible"><path d="M-12 0L-6-5H8L12 0L8 5H-6Z" fill="currentColor"/><path d="M-3-5V5M3-5V5" stroke="#0B0B0C" stroke-width="1.2"/></symbol>
<symbol id="s-c" viewBox="-9 -9 18 18" overflow="visible"><path d="M-6-3.5L6 0L-6 3.5L-3.5 0Z" fill="currentColor"/></symbol>
<symbol id="s-t" viewBox="-9 -9 18 18" overflow="visible"><path d="M-6-4H1L6 0L1 4H-6Z" fill="currentColor"/></symbol>
<symbol id="s-f" viewBox="-11 -9 22 18" overflow="visible"><path d="M-10-4H5L10 0L5 4H-10Z" fill="currentColor"/><path d="M-5-4V4M0-4V4" stroke="#0B0B0C" stroke-width="1.2"/></symbol>
<symbol id="w-mine" viewBox="-9 -9 18 18" overflow="visible"><circle r="6" fill="currentColor"/></symbol>
<symbol id="w-farm" viewBox="-9 -9 18 18" overflow="visible"><rect x="-5.5" y="-5.5" width="11" height="11" fill="currentColor"/></symbol>
<symbol id="w-well" viewBox="-9 -9 18 18" overflow="visible"><path d="M0-7L7 0L0 7L-7 0Z" fill="currentColor"/></symbol>
<symbol id="w-works" viewBox="-9 -9 18 18" overflow="visible"><path d="M0-7L7 5.5H-7Z" fill="currentColor"/></symbol>
<symbol id="o-mine" viewBox="-9 -9 18 18" overflow="visible"><circle r="5.5" fill="#0B0B0C" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2.5 2"/></symbol>
<symbol id="o-farm" viewBox="-9 -9 18 18" overflow="visible"><rect x="-5" y="-5" width="10" height="10" fill="#0B0B0C" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2.5 2"/></symbol>
<symbol id="o-well" viewBox="-9 -9 18 18" overflow="visible"><path d="M0-6.5L6.5 0L0 6.5L-6.5 0Z" fill="#0B0B0C" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2.5 2"/></symbol>
<symbol id="o-works" viewBox="-9 -9 18 18" overflow="visible"><path d="M0-6.5L6.5 5H-6.5Z" fill="#0B0B0C" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2.5 2"/></symbol>
<symbol id="i-warn" viewBox="-9 -9 18 18" overflow="visible"><path d="M0-7L8 6H-8Z" fill="currentColor"/><path d="M0-2.5V2M0 3.6V4.6" stroke="#0B0B0C" stroke-width="1.6"/></symbol>
<symbol id="i-plus" viewBox="-9 -9 18 18" overflow="visible"><path d="M0-6V6M-6 0H6" stroke="currentColor" stroke-width="2.6"/></symbol>
<symbol id="i-x" viewBox="-9 -9 18 18" overflow="visible"><path d="M-5-5L5 5M5-5L-5 5" stroke="currentColor" stroke-width="2.6"/></symbol>
<symbol id="i-play" viewBox="-9 -9 18 18" overflow="visible"><path d="M-4-6L6 0L-4 6Z" fill="currentColor"/></symbol>
<symbol id="i-earth" viewBox="-9 -9 18 18" overflow="visible"><circle r="7" fill="currentColor"/><path d="M-7 0H7M0-7C-4-3-4 3 0 7C4 3 4-3 0-7" stroke="#0B0B0C" stroke-width="1.1" fill="none"/></symbol>
</defs></svg>

<h1>LAST BERTH — 10 ВАРИАНТОВ ИНТЕРФЕЙСА</h1>
<p class="sub">Схемы, не макеты. Цифр нет намеренно: уровень — полоска, срок — дуга, беда — красное.</p>
<div class="dict" id="dict"></div>
<div class="grid" id="grid"></div>

<script>
const C={metal:'#C9CFD6',food:'#3DDC84',fuel:'#FF8A1F',parts:'#F2F1EC',people:'#FFD23F',red:'#FF2A1A',ark:'#B48CFF',earth:'#4FA3FF',ink:'#F2F1EC',dim:'#5E5D58',mid:'#9C9B95',bg:'#0B0B0C',pan:'#17171A',pan2:'#232327'};
const RES=['metal','food','fuel','parts','people'];
const KC={mine:C.metal,farm:C.food,well:C.fuel,works:C.parts};
const f=n=>(+n).toFixed(1);
const u=(id,x,y,s=1,col=C.ink,rot=0,op=1)=>`<use href="#${id}" x="-9" y="-9" width="18" height="18" style="color:${col}" opacity="${op}" transform="translate(${f(x)} ${f(y)}) rotate(${rot}) scale(${s})"/>`;
const P=(cx,cy,r,a)=>[cx+r*Math.cos((a-90)*Math.PI/180),cy+r*Math.sin((a-90)*Math.PI/180)];
const arc=(cx,cy,r,a0,a1,col,w=4,op=1,dash='')=>{const [x0,y0]=P(cx,cy,r,a0),[x1,y1]=P(cx,cy,r,a1);return `<path d="M${f(x0)} ${f(y0)}A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${f(x1)} ${f(y1)}" fill="none" stroke="${col}" stroke-width="${w}" opacity="${op}" ${dash?`stroke-dasharray="${dash}"`:''}/>`};
const ln=(x1,y1,x2,y2,col=C.dim,w=1,dash='',op=1)=>`<path d="M${f(x1)} ${f(y1)}L${f(x2)} ${f(y2)}" stroke="${col}" stroke-width="${w}" opacity="${op}" fill="none" ${dash?`stroke-dasharray="${dash}"`:''}/>`;
const box=(x,y,w,h,fill=C.pan,stroke='none',rx=4,extra='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" stroke="${stroke}" ${extra}/>`;
const circ=(x,y,r,fill='none',stroke='none',w=1,extra='')=>`<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${w}" ${extra}/>`;
const bar=(x,y,n,of,col,w=5,h=8,g=2)=>{let s='';for(let i=0;i<of;i++)s+=`<rect x="${x+i*(w+g)}" y="${y}" width="${w}" height="${h}" fill="${i<n?col:C.pan2}"/>`;return s};
const vbar=(x,y,n,of,col,w=8,h=4,g=2)=>{let s='';for(let i=0;i<of;i++)s+=`<rect x="${x}" y="${y-i*(h+g)}" width="${w}" height="${h}" fill="${i<n?col:C.pan2}"/>`;return s};
const pin=(n,x,y)=>`<circle cx="${x}" cy="${y}" r="9" fill="${C.ink}" stroke="#000" stroke-width="1.5"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="11" font-weight="700" fill="#000" font-family="ui-monospace,Consolas,monospace">${n}</text>`;
const stub=(x,y,w,col=C.dim,h=4)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${col}"/>`;
const wm=(k,x,y,s=1,on=1,op=1)=>u((on?'w-':'o-')+k,x,y,s,on?KC[k]:C.mid,0,op);

const W=[['mine',0,20,1],['farm',0,140,1],['well',0,255,1],['works',1,70,1],['mine',1,190,1],['farm',1,305,0],['well',2,30,0],['mine',2,110,1],['farm',2,222,0],['works',2,332,0]];
const RR=[.4,.7,1];
const wp=(cx,cy,R,i)=>P(cx,cy,R*RR[W[i][1]],W[i][2]);
function map(cx,cy,R,o={}){
  const op=o.op||1,sc=o.s||Math.max(.6,R/165);let s=`<g opacity="${op}">`;
  RR.forEach(r=>s+=circ(cx,cy,R*r,'none',C.dim,1,'stroke-dasharray="1 4"'));
  W.forEach((w,i)=>{const [x,y]=wp(cx,cy,R,i);
    if(w[3]&&!o.noLines){s+=ln(cx,cy,x,y,KC[w[0]],o.lw||1.4,'',.55);
      if(!o.noShips){const t=.35+.08*i,a=Math.atan2(y-cy,x-cx)*180/Math.PI;s+=u(i%3==0?'s-f':i%3==1?'s-t':'s-c',cx+(x-cx)*t,cy+(y-cy)*t,.8*sc,C.ink,i%2?a:a+180)}}
    s+=wm(w[0],x,y,1.1*sc,w[3]);});
  s+=u('i-earth',cx,cy,1.5*sc,C.earth);
  return s+'</g>';
}

const M=[];

/* 1 — всё на карте */
M.push({t:'ВСЁ НА КАРТЕ',idea:'Панелей нет. Земля — прибор, мир — меню.',
 leg:['Кольцо запасов вокруг Земли','Приказы веером у мира','Обод — время до Ночи','Беда мигает там, где случилась'],
 plus:'глаз не уходит с карты',minus:'тесно, когда миров два десятка',
 draw(){const cx=320,cy=200;let s=map(cx,cy,165);
  s+=circ(cx,cy,33,C.bg,'none');
  const lv=[.8,.3,.6,.5,.9];RES.forEach((k,i)=>{const a=i*72+6;s+=arc(cx,cy,26,a,a+60,C.pan2,6)+arc(cx,cy,26,a,a+60*lv[i],i==1?C.red:C[k],6);const [x,y]=P(cx,cy,43,a+30);s+=circ(x,y,8,C.bg)+u('i-'+k,x,y,.7,i==1?C.red:C[k])});
  s+=u('i-earth',cx,cy,1.6,C.earth);
  s+=arc(cx,cy,190,0,359.9,C.pan2,4)+arc(cx,cy,190,0,248,C.red,4);const [nx,ny]=P(cx,cy,190,248);s+=circ(nx,ny,10,C.bg,C.red,1.5)+u('i-night',nx,ny,.8,C.red);
  const [ax,ay]=wp(cx,cy,165,4);s+=circ(ax,ay,13,'none',C.ink,1.5);
  [['i-plus',-150,C.ink],['s-f',-100,C.ink],['i-parts',-50,C.parts],['i-people',0,C.people]].forEach(m=>{const [x,y]=P(ax,ay,34,m[1]+10);s+=circ(x,y,12,C.pan,C.mid,1)+u(m[0],x,y,.8,m[2])});
  const [bx,by]=wp(cx,cy,165,7);s+=circ(bx,by,14,'none',C.red,2)+circ(bx,by,21,'none',C.red,1,'opacity=".5"')+u('i-warn',bx+20,by-18,.8,C.red);
  s+=pin(1,cx+50,cy-30)+pin(2,ax-62,ay+4)+pin(3,nx-24,ny-8)+pin(4,bx+38,by+8);return s}});

/* 2 — пульт */
M.push({t:'ПУЛЬТ',idea:'Железо диспетчера: стрелки, лампы, рычаг.',
 leg:['Экран — карта','Стрелка в красном = мало','Лампы вместо списка советника','Рычаг темпа'],
 plus:'сильный образ, читается без слов',minus:'пульт съедает треть экрана',
 draw(){let s=box(20,12,600,216,C.bg,C.mid,8)+map(320,120,98);
  s+=`<path d="M4 244H636L620 392H20Z" fill="${C.pan}" stroke="${C.dim}"/>`;
  const lv=[40,-70,10,-20,70];RES.forEach((k,i)=>{const x=62+i*72,y=306;s+=circ(x,y,28,C.bg,C.dim,1)+arc(x,y,21,-120,-60,C.red,5)+arc(x,y,21,-60,120,C.pan2,5);
    const [nx,ny]=P(x,y,20,lv[i]);s+=ln(x,y,nx,ny,C.ink,2)+circ(x,y,3,C.ink)+u('i-'+k,x,y+50,.95,C[k])});
  const lamps=[['i-food',C.red,1],['i-night',C.dim,0],['s-c',C.people,1],['i-parts',C.dim,0],['i-people',C.dim,0],['i-ark',C.dim,0]];
  lamps.forEach((l,i)=>{const x=430+(i%3)*38,y=290+Math.floor(i/3)*40;s+=circ(x,y,14,l[2]?l[1]:C.bg,l[2]?l[1]:C.dim,1)+u(l[0],x,y,l[0]=='i-ark'?.6:.8,l[2]?'#000':C.dim)});
  s+=box(574,268,10,104,C.bg,C.dim,5);[280,306,332,358].forEach(y=>s+=ln(590,y,598,y,C.mid,1.5));s+=box(562,296,34,20,C.ink,'none',4)+u('i-play',604,358,.6,C.mid)+u('i-play',610,280,.6,C.mid)+u('i-play',602,280,.6,C.mid);
  s+=pin(1,40,30)+pin(2,26,290)+pin(3,400,270)+pin(4,548,306);return s}});

/* 3 — схема метро */
M.push({t:'СХЕМА МЕТРО',idea:'Игра про линии — рисуем линии. Земля — вокзал.',
 leg:['Толщина = поток груза','Суда едут по своей линии','Пунктир — свободный мир','Столбцы — кольца'],
 plus:'перегруз и простой видны сразу',minus:'пропадают доли карты и события на них',
 draw(){let s='';RES.forEach((k,i)=>{s+=u('i-'+k,40+i*84,24,.9,C[k])+bar(54+i*84,20,[8,3,6,5,9][i],9,i==1?C.red:C[k],4,8,2)});
  s+=u('i-night',586,24,.9,C.red)+arc(586,24,13,0,250,C.red,2.5)+arc(586,24,13,250,359.9,C.pan2,2.5);
  const X=[250,410,570];[180,330,490].forEach((x,i)=>{s+=ln(x,50,x,388,C.dim,1,'2 5')+`<text x="${x+10}" y="64" font-size="12" fill="${C.dim}" font-family="serif">${['I','II','III'][i]}</text>`});
  const L=[['mine',0,84,8,1,'s-f',2],['farm',0,134,5,1,'s-t',1],['well',1,184,3,1,'s-c',1],['works',1,244,6,1,'s-f',1],['mine',2,294,9,1,'s-f',3],['farm',2,344,0,0,'',0],['well',2,376,0,0,'',0]];
  L.forEach(l=>{const xe=X[l[1]],y=l[2],col=KC[l[0]];const d=`M56 214C120 214 96 ${y} 160 ${y}H${xe}`;
    s+=`<path d="${d}" fill="none" stroke="${l[4]?col:C.dim}" stroke-width="${l[4]?l[3]:1.5}" ${l[4]?'opacity=".8"':'stroke-dasharray="4 5"'}/>`;
    for(let j=0;j<l[6];j++)s+=u(l[5],190+j*(xe-200)/(l[6]+.3),y,.95,C.bg,j%2?180:0)+u(l[5],190+j*(xe-200)/(l[6]+.3),y-(l[3]/2+8),.8,C.ink,j%2?180:0);
    s+=circ(xe,y,11,C.bg,l[4]?col:C.dim,2)+wm(l[0],xe,y,.9,l[4]);
    if(!l[4])s+=circ(xe+28,y,9,C.pan,C.mid,1)+u('i-plus',xe+28,y,.6,C.ink)});
  s+=circ(56,214,22,C.bg,C.ink,3)+u('i-earth',56,214,1.6,C.earth);
  s+=pin(1,300,274)+pin(2,222,58)+pin(3,520,360)+pin(4,198,104);return s}});

/* 4 — лента до ночи */
M.push({t:'ЛЕНТА ДО НОЧИ',idea:'Главный вопрос «успею ли» — внизу, всегда.',
 leg:['Сейчас','Полоса тает — видно, когда кончится','Сроки значками на оси','Ночь'],
 plus:'прогноз вместо метрики',minus:'карта сжата, приказы всё равно на ней',
 draw(){let s=map(320,104,88);
  s+=box(12,206,616,184,C.pan,'none',6);
  const x0=70,xn=150,x1=590;
  const band=(y,k,pts,col)=>u('i-'+k,40,y,.95,col||C[k])+`<path d="M${x0} ${y}${pts.map(p=>`L${p[0]} ${y-p[1]}`).join('')}${pts.slice().reverse().map(p=>`L${p[0]} ${y+p[1]}`).join('')}Z" fill="${col||C[k]}" opacity=".8"/>`;
  s+=band(234,'food',[[x0,7],[xn,9],[260,7],[360,3],[420,0]],C.food)+u('i-x',424,234,.7,C.red);
  s+=band(266,'metal',[[x0,4],[xn,8],[330,10],[480,7],[x1,4]]);
  s+=band(298,'people',[[x0,3],[xn,5],[300,8],[450,10],[x1,11]]);
  s+=box(x0,214,xn-x0,144,C.bg,'none',0,'opacity=".55"');
  s+=ln(x0,350,x1,350,C.mid,1.5);for(let x=x0;x<=x1;x+=40)s+=ln(x,346,x,354,C.dim,1);
  s+=ln(xn,212,xn,366,C.ink,2)+`<path d="M${xn-6} 366h12l-6 10z" fill="${C.ink}"/>`;
  s+=ln(x1,212,x1,366,C.red,3)+circ(x1,372,11,C.bg,C.red,1.5)+u('i-night',x1,372,.8,C.red);
  [[250,'i-parts',C.parts],[540,'i-ark',C.ark]].forEach(m=>s+=ln(m[0],350,m[0],364,C.mid,1)+u(m[1],m[0],374,m[1]=='i-ark'?.7:.8,m[2]));
  [[390,'mine'],[468,'well']].forEach(m=>s+=ln(m[0],350,m[0],364,C.mid,1)+wm(m[1],m[0]-8,374,.75,1)+u('s-c',m[0]+8,374,.75,C.ink,180));
  s+=pin(1,xn+16,222)+pin(2,440,218)+pin(3,366,384)+pin(4,x1-22,222);return s}});

/* 5 — стол с картами */
M.push({t:'СТОЛ С КАРТАМИ',idea:'Мир — карта, судно — фишка. Тащи фишку на карту.',
 leg:['Карта мира: залежь, люди','Гнёзда под суда','Рука — свободные суда','Уголок — состояние'],
 plus:'перенос судов рукой (F-40) сам собой',minus:'нет расстояний и колец — теряется космос',
 draw(){let s=box(14,14,112,300,C.pan,C.earth,6)+u('i-earth',70,50,2.4,C.earth);
  RES.forEach((k,i)=>s+=u('i-'+k,34,104+i*40,.95,C[k])+bar(50,100+i*40,[8,3,6,5,9][i],9,i==1?C.red:C[k],5,9,2));
  const cards=[['mine',7,3,2,4,C.food],['farm',5,2,2,3,C.food],['well',2,2,1,2,C.people],['works',6,3,3,5,C.food],['mine',1,2,0,1,C.red],['farm',9,3,0,0,null]];
  cards.forEach((c,i)=>{const x=138+(i%4)*124,y=14+Math.floor(i/4)*154,free=!c[5];
    s+=box(x,y,114,146,free?C.bg:C.pan,i==4?C.red:C.dim,6,free?'stroke-dasharray="5 4"':'');
    s+=wm(c[0],x+24,y+26,2,!free);if(!free)s+=circ(x+98,y+16,6,c[5]);
    s+=bar(x+12,y+54,c[1],10,free?C.dim:KC[c[0]],7,9,2);
    for(let j=0;j<c[2];j++)s+=box(x+12+j*32,y+76,28,22,C.bg,C.dim,3,j>=c[3]?'stroke-dasharray="3 3"':'')+(j<c[3]?u(j?'s-t':'s-f',x+26+j*32,y+87,.8,C.ink):'');
