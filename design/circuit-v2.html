<title>HELM — плата v2 (прототип)</title>
<!-- Прототип мини-игры «плата Пульта», v2 (26.10.2026, по слову Никиты: настоящая плата, без цифр, «соедини и проведи»).
     Черновик вне игры: work/, лист текстов и Notion не тронуты. Пока плата открыта, игра на паузе.
     Детали стоят на местах, игрок тянет медные дорожки между контактами и щёлкает выключатели.
     Плата — урок: каждая вводит одну деталь и то, как узнать её на настоящей плате (R, C, D, SW, полоска, срез, «+»).
     Цепь считается по смыслу, без чисел: ток идёт из «+» через нагрузку в «−»; без нагрузки — короткое замыкание;
     светодиод без резистора сгорает; диод и светодиод — в одну сторону; конденсатор копит заряд и держит нагрузку,
     когда питание пропало; перепутанный конденсатор вздувается. Цель — таблица «выключатели → что горит»,
     она проверяется на всех строках сразу. ?lv=1..7 — урок. Прогресс — в localStorage (только удобство). -->

var T={

  how:'Тяни от контакта — дорожка. Тап по дорожке — убрать. Тап по выключателю — вкл/выкл. Наведи на деталь — подсказка.',

  names:['ЦЕПЬ','ВЫКЛЮЧАТЕЛЬ','СВЕТОДИОД','ПАРАЛЛЕЛЬНО','ДИОД','КОНДЕНСАТОР','ПУЛЬТ'],
  goal:['Зажги лампу L1.','L1 должна слушаться SW1.','Зажги светодиод D1 и не сожги его.','У каждого выключателя — своя лампа.','SW1 зажигает обе лампы, SW2 — только L2.','Выключили SW1 — L1 ещё горит.','Разбуди Пульт и не дай ему забыть.'],

 en:{tag:'HELM · BOARD',paused:'game paused',reset:'RESET',go:'ENTER',next:'NEXT',again:'AGAIN',back:'BACK TO HELM',

         'A switch is a break you control.',

         'Parallel: each branch has its own path from + to −; branches do not interfere.',
         'A diode is a valve: current flows from + to the stripe and never back.',

         'This is how the Helm keeps its memory when power drops.'],
  lore:['COMMAND WOKE: HELM.MEMORY','Recovered: 1 memory block.','','[placeholder: the block\'s entry, two lines max — Nikita writes it]'],
  part:{bat:['Battery','BAT, + and − marks','The source. Current leaves + and must return to −.'],
        lamp:['Lamp','L','Lights when current flows through it. Either way round.'],
        sw:['Switch','SW, ON mark','Breaks the circuit. Tap to flip.'],
        res:['Resistor','R, colour bands on the body','Holds current back. Goes on an LED\'s path.'],
        led:['LED','D, flat on the rim — minus; + at the long leg','Lights only + to +. Burns out without a resistor.'],
        dio:['Diode','D, stripe on the body — minus','Passes current only from + to the stripe.'],
        cap:['Capacitor','C, light band and hatching — minus','Stores charge and gives it back when power drops. No current straight through. Backwards — it bursts.'],

};
var lang='ru';
function tx(s,o){ return s.replace(/\{(\w)\}/g,function(_,k){ return o&&o[k]!==undefined?o[k]:'{'+k+'}' }) }

// Уроки. Деталь — [имя, тип, контакт a, контакт b] (клетки [столбец, строка]), корпус — клетка между ними.
// a — «+» у батарейки и конденсатора, анод у диодов, VCC у микросхемы.
// rows — цель: при каких выключателях что горит; after — «только что выключили»: конденсаторы, заряженные в этом положении, полны.
var SIDES=[['BAT1','bat',[2,9],[4,9]],['SW1','sw',[1,7],[1,5]],['SW2','sw',[6,7],[6,5]],['L1','lamp',[1,3],[1,1]],['L2','lamp',[6,3],[6,1]]];
var LEVELS=[
 {parts:[['BAT1','bat',[2,8],[4,8]],['L1','lamp',[2,2],[4,2]]],rows:[{want:{L1:1}}],fresh:['bat','lamp']},
 {parts:[['BAT1','bat',[1,8],[3,8]],['SW1','sw',[1,3],[1,5]],['L1','lamp',[3,1],[5,1]]],
  rows:[{sw:{},want:{L1:0}},{sw:{SW1:1},want:{L1:1}}],fresh:['sw']},
 {parts:[['BAT1','bat',[1,8],[3,8]],['D1','led',[4,2],[2,2]],['R1','res',[6,4],[6,6]]],rows:[{want:{D1:1}}],fresh:['led','res']},
 {parts:SIDES,rows:[{sw:{},want:{L1:0,L2:0}},{sw:{SW1:1},want:{L1:1,L2:0}},{sw:{SW2:1},want:{L1:0,L2:1}}],fresh:[]},
 {parts:SIDES.concat([['D1','dio',[2,4],[4,4]]]),rows:[{sw:{},want:{L1:0,L2:0}},{sw:{SW1:1},want:{L1:1,L2:1}},{sw:{SW2:1},want:{L1:0,L2:1}}],fresh:['dio']},
 {parts:[['BAT1','bat',[1,9],[3,9]],['SW1','sw',[1,7],[1,5]],['C1','cap',[3,3],[3,5]],['L1','lamp',[5,3],[5,5]]],
  rows:[{sw:{},want:{L1:0}},{sw:{SW1:1},want:{L1:1}},{sw:{},after:{SW1:1},want:{L1:1}}],fresh:['cap']},
 {parts:[['BAT1','bat',[1,9],[3,9]],['SW1','sw',[1,7],[1,5]],['U1','cmd',[3,2],[3,4]],['C1','cap',[5,2],[5,4]],['R1','res',[7,2],[7,4]],['D1','led',[7,5],[7,7]]],
  rows:[{sw:{},want:{U1:0,D1:0}},{sw:{SW1:1},want:{U1:1,D1:1}},{sw:{},after:{SW1:1},want:{U1:1}}],fresh:['cmd']}
];
var COLS=8, ROWS=10, N=COLS*ROWS;
var NB=[];
for(var i0=0;i0<N;i0++){ var c0=i0%COLS, r0=(i0/COLS)|0, nb=[];
  if(c0>0) nb.push(i0-1); if(c0<COLS-1) nb.push(i0+1); if(r0>0) nb.push(i0-COLS); if(r0<ROWS-1) nb.push(i0+COLS); NB.push(nb) }
function ci(p){ return p[1]*COLS+p[0] }

var G=null, qs=new URLSearchParams(location.search), lv=Math.min(LEVELS.length,Math.max(1,+qs.get('lv')||1));
var prog={}; try{ prog=JSON.parse(localStorage.getItem('lb-circuit-v2')||'{}') }catch(e){ prog={} }
function saveProg(){ try{ localStorage.setItem('lb-circuit-v2',JSON.stringify(prog)) }catch(e){} }

function newBoard(){
  var L=LEVELS[lv-1];
  G={parts:[],cellPart:new Int16Array(N).fill(-1),pad:{},trace:new Uint8Array(N),adj:[],net:null,
     sw:{},burned:{},q:{},smoke:{},live:null,rowsOk:[],won:false,state:'intro',hover:-1,litPrev:{}};
  for(var i=0;i<N;i++) G.adj.push({});
  L.parts.forEach(function(p,k){
    var a=ci(p[2]), b=ci(p[3]), body=(a+b)/2;
    G.parts.push({id:p[0],t:p[1],a:a,b:b,body:body});
    G.cellPart[a]=G.cellPart[b]=G.cellPart[body]=k; G.pad[a]={k:k,end:'a'}; G.pad[b]={k:k,end:'b'};
    if(p[1]==='sw') G.sw[p[0]]=0;
  });
  changed();
}

// ——— цепь ———
function nets(){
  var p=new Int16Array(N), i; for(i=0;i<N;i++) p[i]=i;
  function f(x){ while(p[x]!==x){ p[x]=p[p[x]]; x=p[x] } return x }
  for(i=0;i<N;i++) for(var j in G.adj[i]){ var a=f(i), b=f(+j); if(a!==b) p[a]=b }
  var n=new Int16Array(N); for(i=0;i<N;i++) n[i]=f(i); return n;
}
// Разбор цепи по смыслу. st: {sw, q, burned}. Ответ: lit (яркость 0..1 по имени), short, burn/burst (что сгорит),
// rev (стоит наоборот — подсказка), charging/drain (конденсаторы), hot (сети, где идёт ток).
function analyze(st){
  var net=G.net, E=[], res={lit:{},short:false,burn:{},burst:{},rev:{},charging:{},drain:{},hot:{}};
  G.parts.forEach(function(c,k){
    if(st.burned[c.id]) return;
    var e={k:k,A:net[c.a],B:net[c.b],dir:0,load:0,led:0};
    if(c.t==='res'||c.t==='lamp') e.load=1;
    else if(c.t==='cmd'){ e.load=1; e.dir=1 }
    else if(c.t==='led'){ e.led=1; e.dir=1 }
    else if(c.t==='dio') e.dir=1;
    else if(c.t!=='sw'||!st.sw[c.id]) return;
    if(e.A!==e.B) E.push(e);
  });
  function paths(P,M,rev,cb){
    var seen={}, used=[];
    (function go(n){
      if(n===M){ cb(used.slice()); return }
      seen[n]=1;
      E.forEach(function(e){
        var to=-1, back=false;
        if(e.A===n) to=e.B; else if(e.B===n){ if(e.dir&&!rev) return; to=e.A; back=!!e.dir }
        if(to<0||seen[to]) return;
        used.push({e:e,back:back}); go(to); used.pop();
      });
      seen[n]=0;
    })(P);
  }
  function reach(from,to){ if(from===to) return true; var seen={}, q=[from]; seen[from]=1;
    while(q.length){ var n=q.shift(); for(var x=0;x<E.length;x++){ var e=E[x], m=e.A===n?e.B:(e.B===n&&!e.dir?e.A:-1);
      if(m<0||seen[m]) continue; if(m===to) return true; seen[m]=1; q.push(m) } } return false }
  function feed(P,M,power){
    var f={short:false,act:[],burn:[]};
    paths(P,M,false,function(p){
      var load=p.some(function(x){ return x.e.load }), leds=p.filter(function(x){ return x.e.led });
      if(!load&&!leds.length) f.short=true;
      else if(!load) leds.forEach(function(x){ f.burn.push(x.e.k) });
      else p.forEach(function(x){ f.act.push(x.e) });
    });
    if(f.short) return f;
    f.act.forEach(function(e){ var id=G.parts[e.k].id; res.lit[id]=Math.max(res.lit[id]||0,power); res.hot[e.A]=Math.max(res.hot[e.A]||0,power); res.hot[e.B]=Math.max(res.hot[e.B]||0,power) });
    if(f.act.length){ res.hot[P]=Math.max(res.hot[P]||0,power); res.hot[M]=Math.max(res.hot[M]||0,power) }
    return f;
  }
  var bat=G.parts.filter(function(c){ return c.t==='bat' })[0], P=net[bat.a], M=net[bat.b];
  var f=feed(P,M,1);
  if(f.short){ res.short=true; res.hot[P]=res.hot[M]=-1 }
  f.burn.forEach(function(k){ res.burn[G.parts[k].id]=1 });
  if(!res.short){
    // наоборот: путь с нагрузкой нашёлся бы, если развернуть деталь
    paths(P,M,true,function(p){ if(!p.some(function(x){ return x.e.load||x.e.led })) return;
      p.forEach(function(x){ if(x.back){ var id=G.parts[x.e.k].id; if(!res.lit[id]) res.rev[id]=1 } }) });
    G.parts.forEach(function(c){
      if(c.t!=='cap'||st.burned[c.id]) return; var A=net[c.a], B=net[c.b];
      if(A===B) return;
      if(reach(P,A)&&reach(B,M)) res.charging[c.id]=1;
      else if(reach(P,B)&&reach(A,M)) res.burst[c.id]=1;
    });
  }
  G.parts.forEach(function(c){
    var q=st.q[c.id]||0; if(c.t!=='cap'||st.burned[c.id]||res.charging[c.id]||q<.05) return;
    var g=feed(net[c.a],net[c.b],q); res.drain[c.id]=g.short?2:(g.act.length?1:0);
  });
  return res;
}
function rowState(row){ var sw={}; for(var s in G.sw) sw[s]=row&&row[s]?1:0; return sw }
function evalRows(){
  var L=LEVELS[lv-1];
  G.rowsOk=L.rows.map(function(row){
    var q={};
    if(row.after){ var pre=analyze({sw:rowState(row.after),q:{},burned:G.burned}); for(var c in pre.charging) q[c]=1 }
    var r=analyze({sw:rowState(row.sw),q:q,burned:G.burned});

// Живая цепь: каждый кадр. Сгоревшее остаётся сгоревшим до СБРОСА.
var statusMsg=null;
function tick(dt,now){
  if(!G||!G.net) return;
  var r=analyze({sw:G.sw,q:G.q,burned:G.burned}), fresh=false, id;
  for(id in r.burn) if(!G.burned[id]){ G.burned[id]=1; G.smoke[id]=now; fresh=true; statusMsg=['bad','burnt',id]; pop() }
  for(id in r.burst) if(!G.burned[id]){ G.burned[id]=1; G.smoke[id]=now; fresh=true; statusMsg=['bad','burst',id]; pop() }
  if(fresh){ r=analyze({sw:G.sw,q:G.q,burned:G.burned}); evalRows(); hud() }
  G.parts.forEach(function(c){ if(c.t!=='cap') return; var q=G.q[c.id]||0;
    if(G.burned[c.id]) q=0; else if(r.charging[c.id]) q=Math.min(1,q+dt*2.5);
    else if(r.drain[c.id]===2) q=0; else if(r.drain[c.id]===1) q=Math.max(0,q-dt*.4); else q=Math.max(0,q-dt*.01);
    G.q[c.id]=q });

  G.litPrev=r.lit;
  if(r.short&&!(G.live&&G.live.short)) beep(90,.25,.05,'sawtooth');
  G.live=r;
  status(r);

}

    n+=2; var left=n, out=[];
    lines.forEach(function(l){ if(left<=0) return; var s=l.s.slice(0,left); left-=l.s.length+1;
      out.push('<span class="'+l.cl+'">'+s.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</span>') });
    box.innerHTML=out.join('\n')+(n<total?'<span class="y">▌</span>':'');
    if(n>=total){ clearInterval(loreTimer); btn.style.visibility='visible' }
  },20);
}
function win(){
  if(!G.won) return;
  G.state='done'; show('ovDone'); hud();
  var L=T[lang], last=lv===LEVELS.length, lines=[{cl:'g',s:L.done},{cl:'m',s:L.learned},{cl:'',s:L.learn[lv-1]}];
  if(last){ lines.push({cl:'',s:''}); L.lore.forEach(function(s,ix){ lines.push({cl:ix===0?'y':ix===1?'m':'',s:s}) }) }
  var btn=document.getElementById('bNext'); btn.textContent=last?L.back:L.next;
  typeLines(lines,btn);
}

function step(j){
  if(j<0||j===drag.head) return;
  var h=drag.head, hc=h%COLS, hr=(h/COLS)|0, jc=j%COLS, jr=(j/COLS)|0;
  if(Math.abs(hc-jc)===1&&Math.abs(hr-jr)===1){ // срезал угол — через соседнюю клетку
    var a=hr*COLS+jc, b=jr*COLS+hc, ok=function(x){ return !(G.cellPart[x]>=0&&!G.pad[x]) }, mid=ok(a)?a:b;
    step(mid); if(drag.head!==mid) return; h=mid;
  }
  if(Math.abs(h%COLS-jc)+Math.abs(((h/COLS)|0)-jr)!==1) return;
  drag.moved=true; extend(h,j);
}
var tip=document.getElementById('tip');
function showTip(e){
  var i=cellAt(e.clientX,e.clientY), k=i>=0?G.cellPart[i]:-1;
  if(k<0||drag||G.state!=='play'){ tip.style.display='none'; return }
  var c=G.parts[k], P=T[lang].part[c.t];
  tip.innerHTML='<b></b><br><span></span>'; tip.children[0].textContent=c.id+' · '+P[0]; tip.children[2].textContent=P[2];
  tip.style.display='block';
  var x=Math.min(W-270,e.clientX+14), y=e.clientY+18; if(y>H-80) y=e.clientY-70; tip.style.left=x+'px'; tip.style.top=y+'px';
}
cv.addEventListener('pointerdown',function(e){
  audio(); if(!G||G.state!=='play') return;
  var i=cellAt(e.clientX,e.clientY); if(i<0) return;
  var k=G.cellPart[i];
  if(k>=0&&!G.pad[i]){ var c=G.parts[k]; if(c.t==='sw'){ G.sw[c.id]=G.sw[c.id]?0:1; beep(G.sw[c.id]?1200:700,.04,.04); hud() } return }
  if(!G.trace[i]&&!G.pad[i]){ flash(T[lang].fromPad); return }
  try{ cv.setPointerCapture(e.pointerId) }catch(_){}
  drag={head:i,start:i,moved:false,x:e.clientX,y:e.clientY};
  tip.style.display='none';
});
cv.addEventListener('pointermove',function(e){
  if(!G) return; G.hover=cellAt(e.clientX,e.clientY);
  if(!drag){ if(e.pointerType==='mouse') showTip(e); return }
  var dx=e.clientX-drag.x, dy=e.clientY-drag.y, n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/(S/4)));
  for(var s=1;s<=n;s++) step(cellAt(drag.x+dx*s/n,drag.y+dy*s/n));
  drag.x=e.clientX; drag.y=e.clientY;
});
cv.addEventListener('pointerup',function(){ if(drag&&!drag.moved) cut(drag.start); drag=null });
cv.addEventListener('pointercancel',function(){ drag=null });
cv.addEventListener('pointerleave',function(){ if(G) G.hover=-1; tip.style.display='none' });

function restart(){ clearInterval(loreTimer); statusMsg=null; newBoard(); applyLang(); show('ovIntro') }
document.getElementById('bGo').onclick=function(){ audio(); G.state='play'; show(null); hud() };
document.getElementById('bNext').onclick=function(){ if(lv<LEVELS.length) lv++; restart() };
document.getElementById('reset').onclick=function(){ if(G.state!=='play') return; statusMsg=null; newBoard(); G.state='play'; hud() };
document.getElementById('lang').onclick=function(){ lang=lang==='ru'?'en':'ru'; applyLang(); if(G.state==='done') win() };

addEventListener('resize',resize);
newBoard(); applyLang(); resize();
window.BOARD={get G(){return G},cxy:cxy,cellAt:cellAt,LEVELS:LEVELS}; // для проверки из Playwright
var last=0;
(function frame(now){ var dt=Math.min(.05,(now-(last||now))/1000); last=now;
  if(G&&G.state==='play') tick(dt,Date.now());
  draw(now); requestAnimationFrame(frame) })(0);
})();
</script>
</body>
