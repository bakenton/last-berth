<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LAST BERTH — интерфейс, макет v2</title>
<style>
:root{--bg:#0B0B0C;--pan:#17171A;--ink:#F2F1EC;--mid:#9C9B95;--dim:#5E5D58;--red:#FF2A1A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 ui-monospace,Consolas,Menlo,monospace;padding:20px 16px 60px}
main{max-width:1080px;margin:0 auto}
h1{font-size:18px;margin:0 0 4px;letter-spacing:.08em}
.sub{color:var(--mid);margin:0 0 22px}
.card{margin-bottom:34px}
.card h2{font-size:15px;margin:0 0 2px;letter-spacing:.06em}
.card h2 b{color:var(--red);margin-right:8px}
.card .idea{color:var(--mid);margin:0 0 8px;font-size:13px}
.card svg.m{display:block;width:100%;height:auto;border:1px solid var(--dim);background:var(--bg);font-family:Arial,Helvetica,sans-serif}
ol{list-style:none;margin:8px 0 6px;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:3px 14px;font-size:13px}
ol li{display:flex;gap:7px;align-items:baseline}
ol li i{flex:none;font-style:normal;background:var(--ink);color:#000;font-weight:700;font-size:11px;width:17px;height:17px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;transform:translateY(2px)}
.pm{font-size:12.5px;color:var(--mid);margin:0}
.pm .p{color:#3DDC84}.pm .n{color:#FF8A1F}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-metal" viewBox="-9 -9 18 18" overflow="visible"><path d="M-7 5L-4 -5H4L7 5Z" fill="currentColor"/></symbol>
<symbol id="i-food" viewBox="-9 -9 18 18" overflow="visible"><path d="M0 7C-9 1-5-7 0-7C5-7 9 1 0 7Z" fill="currentColor"/><path d="M0 7V-2" stroke="#0B0B0C" stroke-width="1.3"/></symbol>
<symbol id="i-fuel" viewBox="-9 -9 18 18" overflow="visible"><path d="M0-8C6 0 6 4 0 7C-6 4-6 0 0-8Z" fill="currentColor"/></symbol>
<symbol id="i-parts" viewBox="-9 -9 18 18" overflow="visible"><circle r="5" fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="2.6 2.63"/><circle r="3.6" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
<symbol id="i-people" viewBox="-9 -9 18 18" overflow="visible"><circle cy="-4.5" r="3" fill="currentColor"/><path d="M-6 7C-6-2 6-2 6 7Z" fill="currentColor"/></symbol>
<symbol id="i-night" viewBox="-9 -9 18 18" overflow="visible"><path d="M3-7A7.5 7.5 0 1 0 3 7A9 9 0 0 1 3-7Z" fill="currentColor"/></symbol>

<symbol id="s-c" viewBox="-9 -9 18 18" overflow="visible"><path d="M-6-3.5L6 0L-6 3.5L-3.5 0Z" fill="currentColor"/></symbol>
<symbol id="s-t" viewBox="-9 -9 18 18" overflow="visible"><path d="M-6-4H1L6 0L1 4H-6Z" fill="currentColor"/></symbol>
<symbol id="s-f" viewBox="-11 -9 22 18" overflow="visible"><path d="M-10-4H5L10 0L5 4H-10Z" fill="currentColor"/><path d="M-5-4V4M0-4V4" stroke="#0B0B0C" stroke-width="1.2"/></symbol>
<symbol id="w-mine" viewBox="-9 -9 18 18" overflow="visible"><circle r="6" fill="currentColor"/></symbol>
<symbol id="w-farm" viewBox="-9 -9 18 18" overflow="visible"><rect x="-5.5" y="-5.5" width="11" height="11" fill="currentColor"/></symbol>
<symbol id="w-well" viewBox="-9 -9 18 18" overflow="visible"><path d="M0-7L7 0L0 7L-7 0Z" fill="currentColor"/></symbol>
<symbol id="w-works" viewBox="-9 -9 18 18" overflow="visible"><path d="M0-7L7 5.5H-7Z" fill="currentColor"/></symbol>
<symbol id="o-mine" viewBox="-9 -9 18 18" overflow="visible"><circle r="5.5" fill="#0B0B0C" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2.5 2"/></symbol>
<symbol id="o-farm" viewBox="-9 -9 18 18" overflow="visible"><rect x="-5" y="-5" width="10" height="10" fill="#0B0B0C" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2.5 2"/></symbol>
<symbol id="o-well" viewBox="-9 -9 18 18" overflow="visible"><path d="M0-6.5L6.5 0L0 6.5L-6.5 0Z" fill="#0B0B0C" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2.5 2"/></symbol>
<symbol id="o-works" viewBox="-9 -9 18 18" overflow="visible"><path d="M0-6.5L6.5 5H-6.5Z" fill="#0B0B0C" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2.5 2"/></symbol>
<symbol id="i-warn" viewBox="-9 -9 18 18" overflow="visible"><path d="M0-7L8 6H-8Z" fill="currentColor"/><path d="M0-2.5V2M0 3.6V4.6" stroke="#0B0B0C" stroke-width="1.6"/></symbol>
<symbol id="i-plus" viewBox="-9 -9 18 18" overflow="visible"><path d="M0-6V6M-6 0H6" stroke="currentColor" stroke-width="2.6"/></symbol>
<symbol id="i-x" viewBox="-9 -9 18 18" overflow="visible"><path d="M-5-5L5 5M5-5L-5 5" stroke="currentColor" stroke-width="2.6"/></symbol>
<symbol id="i-play" viewBox="-9 -9 18 18" overflow="visible"><path d="M-4-6L6 0L-4 6Z" fill="currentColor"/></symbol>
<symbol id="i-earth" viewBox="-9 -9 18 18" overflow="visible"><circle r="7" fill="currentColor"/><path d="M-7 0H7M0-7C-4-3-4 3 0 7C4 3 4-3 0-7" stroke="#0B0B0C" stroke-width="1.1" fill="none"/></symbol>
</defs></svg>
<main>
<h1>LAST BERTH — ИНТЕРФЕЙС, МАКЕТ v2</h1>
<p class="sub">Один интерфейс, десять листов. Ручное назначение судов, пять вкладок, флажки и советник разведены. Числа условные.</p>
<div id="grid"></div>
</main>
<script>
const C={metal:'#C9CFD6',food:'#3DDC84',fuel:'#FF8A1F',parts:'#F2F1EC',people:'#FFD23F',red:'#FF2A1A',ark:'#B48CFF',earth:'#4FA3FF',ink:'#F2F1EC',dim:'#5E5D58',mid:'#9C9B95',bg:'#0B0B0C',pan:'#17171A',pan2:'#232327'};
const RES=['metal','food','fuel','parts','people'];
const KC={mine:C.metal,farm:C.food,well:C.fuel,works:C.parts};
const f=n=>(+n).toFixed(1);
const u=(id,x,y,s=1,col=C.ink,rot=0,op=1)=>`<use href="#${id}" x="-9" y="-9" width="18" height="18" style="color:${col}" opacity="${op}" transform="translate(${f(x)} ${f(y)}) rotate(${rot}) scale(${s})"/>`;
const P=(cx,cy,r,a)=>[cx+r*Math.cos((a-90)*Math.PI/180),cy+r*Math.sin((a-90)*Math.PI/180)];
const arc=(cx,cy,r,a0,a1,col,w=4,op=1,dash='')=>{const [x0,y0]=P(cx,cy,r,a0),[x1,y1]=P(cx,cy,r,a1);return `<path d="M${f(x0)} ${f(y0)}A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${f(x1)} ${f(y1)}" fill="none" stroke="${col}" stroke-width="${w}" opacity="${op}" ${dash?`stroke-dasharray="${dash}"`:''}/>`};
const ln=(x1,y1,x2,y2,col=C.dim,w=1,dash='',op=1)=>`<path d="M${f(x1)} ${f(y1)}L${f(x2)} ${f(y2)}" stroke="${col}" stroke-width="${w}" opacity="${op}" fill="none" ${dash?`stroke-dasharray="${dash}"`:''}/>`;
const box=(x,y,w,h,fill=C.pan,stroke='none',rx=4,extra='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" stroke="${stroke}" ${extra}/>`;
const circ=(x,y,r,fill='none',stroke='none',w=1,extra='')=>`<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${w}" ${extra}/>`;
const bar=(x,y,n,of,col,w=5,h=8,g=2)=>{let s='';for(let i=0;i<of;i++)s+=`<rect x="${x+i*(w+g)}" y="${y}" width="${w}" height="${h}" fill="${i<n?col:C.pan2}"/>`;return s};
const vbar=(x,y,n,of,col,w=8,h=4,g=2)=>{let s='';for(let i=0;i<of;i++)s+=`<rect x="${x}" y="${y-i*(h+g)}" width="${w}" height="${h}" fill="${i<n?col:C.pan2}"/>`;return s};
const pin=(n,x,y)=>`<circle cx="${x}" cy="${y}" r="9" fill="${C.ink}" stroke="#000" stroke-width="1.5"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="11" font-weight="700" fill="#000" font-family="ui-monospace,Consolas,monospace">${n}</text>`;
const stub=(x,y,w,col=C.dim,h=4)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${col}"/>`;
const wm=(k,x,y,s=1,on=1,op=1)=>u((on?'w-':'o-')+k,x,y,s,on?KC[k]:C.mid,0,op);

const W=[['mine',0,20,1],['farm',0,140,1],['well',0,255,1],['works',1,70,1],['mine',1,190,1],['farm',1,305,0],['well',2,30,0],['mine',2,110,1],['farm',2,222,0],['works',2,332,0]];
const RR=[.4,.7,1];
const wp=(cx,cy,R,i)=>P(cx,cy,R*RR[W[i][1]],W[i][2]);
function map(cx,cy,R,o={}){
  const op=o.op||1,sc=o.s||Math.max(.6,R/165);let s=`<g opacity="${op}">`;
  RR.forEach(r=>s+=circ(cx,cy,R*r,'none',C.dim,1,'stroke-dasharray="1 4"'));
  W.forEach((w,i)=>{const [x,y]=wp(cx,cy,R,i);
    if(w[3]&&!o.noLines){s+=ln(cx,cy,x,y,KC[w[0]],o.lw||1.4,'',.55);
      if(!o.noShips){const t=.35+.08*i,a=Math.atan2(y-cy,x-cx)*180/Math.PI;s+=u(i%3==0?'s-f':i%3==1?'s-t':'s-c',cx+(x-cx)*t,cy+(y-cy)*t,.8*sc,C.ink,i%2?a:a+180)}}
    s+=wm(w[0],x,y,1.1*sc,w[3]);});
  s+=u('i-earth',cx,cy,1.5*sc,C.earth);
  return s+'</g>';
}

const t=(x,y,str,size=11,col=C.ink,anchor='start',w=400,ls=0)=>`<text x="${x}" y="${y}" font-size="${size}" fill="${col}" text-anchor="${anchor}" font-weight="${w}" ${ls?`letter-spacing="${ls}"`:''}>${str}</text>`;
const lab=(x,y,str,col=C.mid,anchor='start')=>t(x,y,str,8.5,col,anchor,700,'.16em');
const NAMES=['KILN','PALE','WICK','HOLLOW','CINDER','BRINE','GANNET','VESPER','MIRE','ROOK'];
const SEL=4;
function mapL(cx,cy,R,o={}){
  let s=map(cx,cy,R,o);const op=o.op||1;
  if(!o.noNames)W.forEach((w,i)=>{if(!w[3])return;const [x,y]=wp(cx,cy,R,i);s+=`<g opacity="${op}">`+t(x+11,y-8,NAMES[i],8.5,C.ink,'start',700,'.08em')+'</g>'});
  if(o.sel!==undefined){const [x,y]=wp(cx,cy,R,o.sel);s+=ln(cx,cy,x,y,C.ink,2.2)+circ(x,y,15,'none',C.ink,2)+wm(W[o.sel][0],x,y,1.2*Math.max(.6,R/165),1)}
  return s;
}
const TABS=[['EARTH','i-earth',C.earth,''],['YARD','i-parts',C.ink,'2'],['FLEET','s-f',C.ink,'3'],['ARK','i-ark',C.ark,'']];
function chrome(o={}){
  let s=box(0,0,960,600,C.bg,'none',0);
  s+=box(14,16,9,9,C.red,'none',0)+t(30,25,'LAST BERTH',12,C.ink,'start',800,'.2em');
  s+=lab(170,14,'YEAR')+t(170,34,'3005',19,C.ink,'start',800);
  s+=lab(246,14,'NIGHT',C.red)+t(246,34,'3735',19,C.red,'start',800)+t(300,34,'730 years',10,C.mid);
  if(o.adv!==0){const hot=o.adv==='open';s+=box(420,9,170,25,hot?C.people:C.bg,C.people,3)+u('i-warn',436,21.5,.75,hot?'#000':C.people)+t(450,25,'NEEDS A DECISION',9.5,hot?'#000':C.people,'start',700,'.1em')+box(562,13,22,17,hot?'#000':C.people,'none',2)+t(573,25.5,'4',11,hot?C.people:'#000','middle',800)}
  ['❚❚','1×','2×','4×','10×'].forEach((b,i)=>{const on=o.paused?i==0:i==2,x=764+i*38;s+=box(x,8,36,26,on?(o.paused?C.people:C.ink):C.bg,C.dim,0)+t(x+18,25,b,10.5,on?'#000':C.ink,'middle',700)});
  if(o.paused)s+=lab(756,25,'PAUSED',C.people,'end');
  s+=ln(0,42,960,42,C.dim);
  const R=[['METAL','5 731','▼ −40.4/yr'],['RATIONS','27 920','▲ +4.6/yr'],['FUEL','19 194','▲ +28.6/yr'],['PARTS','197','▼ −0.7/yr'],['PEOPLE','2 816','▼ −2.7/yr']];
  RES.forEach((k,i)=>{const x=i*192;s+=u('i-'+k,x+20,56,.7,C[k])+lab(x+31,59,R[i][0])+t(x+14,82,R[i][1],20,C[k],'start',800)+t(x+104,82,R[i][2],9.5,R[i][2][0]=='▼'?C.red:C.food);if(i)s+=ln(x,42,x,90,C.dim)});
  s+=ln(0,90,960,90,C.dim);
  if(o.tabs==='bottom'){TABS.forEach((b,i)=>{const x=250+i*115,on=o.tab===b[0];s+=box(x,552,115,38,on?C.ink:C.pan,C.mid,0)+u(b[1],x+24,571,b[1]=='i-ark'?.7:.9,on?'#000':b[2])+t(x+42,575,b[0],10.5,on?'#000':C.ink,'start',800,'.14em');if(b[3])s+=circ(x+104,558,8,C.people)+t(x+104,562,b[3],10,'#000','middle',800)})}
  else{s+=box(0,90,66,510,C.pan,'none',0)+ln(66,90,66,600,C.dim);TABS.forEach((b,i)=>{const y=90+i*72,on=o.tab===b[0];s+=box(0,y,66,72,on?C.ink:C.pan,'none',0)+ln(0,y+72,66,y+72,C.dim)+u(b[1],33,y+30,b[1]=='i-ark'?1:1.3,on?'#000':b[2])+t(33,y+58,b[0],8.5,on?'#000':C.mid,'middle',800,'.14em');if(b[3])s+=circ(54,y+13,8,C.people)+t(54,y+17,b[3],10,'#000','middle',800)})}
  return s;
}
function panel(x,y,w,h,title,sub,ic){let s=box(x,y,w,h,C.pan,C.ink,0)+box(x+.5,y+.5,w-1,30,C.pan2,'none',0)+ln(x,y+31,x+w,y+31,C.dim);let tx=x+14;if(ic){s+=ic(x+20,y+16);tx=x+38}
  s+=t(tx,y+20.5,title,12.5,C.ink,'start',800,'.08em');if(sub)s+=lab(x+w-36,y+19.5,sub,C.mid,'end');return s+u('i-x',x+w-16,y+16,.6,C.ink)}
const sec=(x,y,w,l,r)=>lab(x,y,l)+(r?lab(x+w,y,r,C.mid,'end'):'')+ln(x,y+6,x+w,y+6,C.dim);
const row=(x,y,w,l,v,col)=>t(x,y,l,10.5,C.mid)+t(x+w,y,v,10.5,col||C.ink,'end',700);
function btn(x,y,w,h,label,kind){const k=kind||'';const fill=k=='pri'?C.ink:C.bg,st=k=='red'?C.red:k=='off'?C.dim:k=='pri'?C.ink:C.mid,tc=k=='pri'?'#000':k=='red'?C.red:k=='off'?C.dim:C.ink;
  return box(x,y,w,h,fill,st,0,k=='off'?'stroke-dasharray="3 3"':'')+t(x+w/2,y+h/2+3.5,label,9.5,tc,'middle',800,'.1em')}
const step=(x,y,n)=>box(x,y,20,20,C.bg,C.mid,0)+t(x+10,y+14.5,'−',12,C.ink,'middle',700)+t(x+33,y+14.5,n,12,C.ink,'middle',800)+box(x+46,y,20,20,C.bg,C.mid,0)+t(x+56,y+14.5,'+',12,C.ink,'middle',700);
const price=(x,y,a,gap=50)=>a.map((p,i)=>u('i-'+p[0],x+i*gap+5,y-3.5,.6,C[p[0]])+t(x+i*gap+13,y,p[1],9.5,p[2]?C.red:C[p[0]],'start',700)).join('');
const prog=(x,y,w,p,col=C.ink)=>box(x,y,w,5,C.pan2,'none',0)+box(x,y,w*p,5,col,'none',0);

/* planet blocks: each returns [svg,height] */
function bState(x,y,w){let s=sec(x,y,w,'WORLD');const R=[['Deposit left','6 170',C.metal],['On the surface','412',C.metal],['World gives','9.4 /yr'],['Line carries','7.1 /yr',C.people],['People','24',C.people],['Last lift','3580 · 575 yrs']];
  R.forEach((r,i)=>s+=row(x,y+24+i*17,w,r[0],r[1],r[2]));return [s,24+R.length*17]}
function bKit(x,y,w){let s=sec(x,y,w,'MACHINES','TIER II');s+=t(x,y+24,'Tier III: 9.4 → 13.1 /yr',10.5,C.mid)+price(x,y+43,[['metal','420'],['parts','60'],['people','8']],54)+btn(x+w-92,y+30,92,20,'UPGRADE','pri');return [s,56]}
function bLine(x,y,w){let s=sec(x,y,w,'SHIPS ON THIS LINE','YARDS KEEP THE COUNT');
  [['s-c','Courier “Hermes”','0'],['s-t','Hauler “Sisyphus”','2'],['s-f','Freighter “Atlas”','1']].forEach((r,i)=>{const yy=y+16+i*26;s+=u(r[0],x+9,yy+10,1,C.ink)+t(x+26,yy+14,r[1],10.5,C.ink)+step(x+w-66,yy,r[2])});
  let yy=y+16+78+8;s+=lab(x,yy,'HULLS',C.dim);
  [['Hauler III no.100','loading here',1],['Hauler III no.88','→ Earth · 4 yrs',0],['Freighter III no.41','→ here · 9 yrs',0]].forEach((r,i)=>{const y2=yy+18+i*19;s+=t(x,y2,r[0],10,C.ink,'start',700)+t(x+118,y2,r[1],10,C.mid);if(r[2])s+=btn(x+w-70,y2-12,70,16,'TAKE OFF')});
  s+=t(x,yy+18+57+2,'Yards are building 1 more hauler · 2 yrs',9.5,C.dim);return [s,16+78+8+18+57+6]}
function bEvac(x,y,w){return [btn(x,y,w,24,'EVACUATE','red')+t(x+w/2,y+38,'Courier no.8 takes all 24 · home before the Night',9.5,C.mid,'middle'),42]}
const pico=(x,y)=>wm('mine',x,y,1.2,1);

const M=[];

M.push({t:'ГЛАВНЫЙ ЭКРАН · КНОПКИ СЛЕВА',idea:'Карта и то, что нужно всегда. Остальное — по нажатию.',
 leg:['Ресурсы с цифрами — как сейчас','Год, Ночь, темп','Советник: значок со счётчиком','Вкладки; на кнопке — что там ждёт (2 строятся, 3 свободны)','Нажал на мир — открылось его меню','Наведение: короткая справка'],
 plus:'карта получает весь экран; верфь и флот не пропадают из виду — счётчик на кнопке',minus:'прогресс верфи теперь не виден без нажатия',
 draw(){let s=chrome()+mapL(513,345,225);const [x,y]=wp(513,345,225,7);
  s+=circ(x,y,14,'none',C.mid,1.5)+box(x+18,y-34,150,44,C.pan,C.mid,0)+t(x+28,y-18,'VESPER',10.5,C.ink,'start',800,'.08em')+lab(x+160,y-19,'MINE',C.mid,'end')+price(x+28,y,[['metal','2 904'],['people','52']],60)+u('s-t',x+148,y-3,.8,C.ink);
  s+=pin(1,100,100)+pin(2,360,22)+pin(3,604,22)+pin(4,33,480)+pin(5,x-26,y+4)+pin(6,x+180,y-34);return s}});

M.push({t:'ГЛАВНЫЙ ЭКРАН · КНОПКИ СНИЗУ',idea:'То же, но вкладки — полосой внизу, как док.',
 leg:['Вкладки под рукой и на телефоне','Карта во всю ширину','Советник — там же, вверху'],
 plus:'привычнее на телефоне; ближе к нынешнему доку верфи',minus:'боковая панель мира и нижняя полоса спорят за место; слева мне кажется чище',
 draw(){let s=chrome({tabs:'bottom'})+mapL(480,318,215);s+=pin(1,236,571)+pin(2,60,318)+pin(3,604,22);return s}});

M.push({t:'МЕНЮ МИРА · А · БОКОВАЯ ПАНЕЛЬ',idea:'Карта видна и живая. Время идёт.',
 leg:['Мир выделен, его линия подсвечена','Метрики мира — цифрами','Техника: что даст следующий ярус и цена','Суда на линии: − / + по классу','Реальные корпуса и где они','Эвакуация и её срок','Другой мир — нажал на карте, панель сменилась'],
