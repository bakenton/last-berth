<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>LAST BERTH × FTL</title>
<style>/*KIT*/</style>
<script>/*KIT*/</script>
<style>
#g{position:absolute;inset:0;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
#left{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column}
#right{flex:none}
#hud{flex:none;display:grid;grid-template-columns:repeat(6,1fr);background:var(--pan);border-bottom:1px solid var(--ln)}
.h{padding:3px 2px 4px 7px;border-right:1px solid var(--ln);min-width:0;white-space:nowrap;overflow:hidden}
.h:last-child{border-right:0}
.h small{display:block;font-size:9px;letter-spacing:.1em;font-weight:600;color:var(--mid)}
.h b{font:600 15px/1.15 var(--n)}
.h i{font:400 10px var(--n);font-style:normal;color:var(--mid);margin-left:2px}
.h.bad b{color:var(--red)}
#hNight.close{background:rgba(255,42,26,.2)}
#mapw{position:relative;flex:1;min-height:0;background:#08080a;overflow:hidden}
#map,#ship{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#alarm{flex:none;display:none;align-items:center;gap:8px;min-height:44px;padding:2px 2px 2px 10px;background:#2a0f0c;border-top:1px solid var(--red);border-bottom:1px solid var(--red)}
#alarm.on{display:flex}
#alarm.calm{background:var(--pan2);border-color:var(--ln)}
#alarmT{flex:1;min-width:0;font:600 12px/1.2 var(--n)}
#alarm button{flex:none;min-height:40px;padding:0 10px;background:var(--ink);color:#000;font-weight:700;font-size:12px;letter-spacing:.03em;max-width:56%}
#shipw{position:relative;flex:0 0 172px;background:var(--bg);overflow:hidden;border-top:1px solid var(--ln)}
#bar{flex:none;display:flex;align-items:stretch;gap:0;min-height:48px;background:var(--pan);border-top:1px solid var(--ln)}
#pause{flex:0 0 52px;font:700 16px var(--n);border-right:1px solid var(--ln)}
#pause.on{background:var(--ppl);color:#000}
#info{flex:1;min-width:0;padding:4px 8px;font-size:12.5px;line-height:1.22;display:flex;flex-direction:column;justify-content:center}
#info b{font-weight:600}
#info span{font:400 11px var(--n);color:var(--mid)}
#act{flex:none;min-width:104px;padding:0 10px;background:var(--ppl);color:#000;font-weight:700;font-size:12.5px;letter-spacing:.06em}
#act.off{background:var(--pan2);color:var(--dim)}
#act.warn{background:var(--red);color:#fff}
#act.none{display:none}
#pow{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--ln);border-top:1px solid var(--ln)}
.pc{display:flex;align-items:stretch;background:var(--pan);min-height:44px;min-width:0}
.pc button{flex:0 0 38px;font:700 16px var(--n);color:var(--ink);background:var(--pan2)}
.pc button:active{background:var(--ln)}
.pc .m{flex:1;min-width:0;text-align:center;padding-top:5px}
.pc small{display:block;font-size:8.5px;letter-spacing:0;font-weight:600;color:var(--mid);white-space:nowrap}
.pips{display:flex;justify-content:center;gap:2px;margin-top:4px}
.pips u{display:block;width:9px;height:11px;background:var(--pan2);border:1px solid var(--dim);text-decoration:none}
.pips u.p{background:var(--ppl);border-color:var(--ppl)}
.pips u.x{background:none;border-color:var(--red)}
.pc.reac{justify-content:center;background:#17140a}
.pc.reac b{font:600 15px var(--n);color:var(--ppl)}
.pc.reac.dn b{color:var(--red)}
#crew{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:1px;background:var(--ln);border-top:1px solid var(--ln)}
.ch{position:relative;display:block;text-align:left;background:var(--pan);min-height:52px;padding:4px 5px 8px;min-width:0;overflow:hidden}
.ch.sel{background:var(--ink);color:#000}
.ch.sel small{color:#333}
.ch b{display:block;font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden}
.ch b.fl{display:none}
.ch small{display:block;font-size:9.5px;color:var(--mid);white-space:nowrap;overflow:hidden}
.ch .hp{position:absolute;left:0;bottom:0;height:4px;background:var(--ppl)}
.ch.low .hp{background:var(--red)}
.ch.wake{text-align:center;color:var(--ppl);font-size:11px;font-weight:600;line-height:1.15}
#right .sec{display:none}
/* события */
.lb-modal .kick{font-size:10px;letter-spacing:.18em;font-weight:700;color:var(--ppl);margin-bottom:6px}
.lb-modal .world{font:600 13px var(--n);letter-spacing:.14em;color:var(--mid);margin-bottom:4px}
.ev .row{flex-direction:column}
.ev .row .btn{flex:none;width:100%;text-transform:none;letter-spacing:0;font-size:14px;justify-content:space-between;text-align:left;height:auto;min-height:48px;padding:7px 12px;gap:12px;background:var(--pan2)}
.ev .row .btn b{font-weight:600}
.ev .row .btn span{font:500 11.5px var(--n);color:var(--ppl);text-align:right}
.ev .row .btn.nope span{color:var(--red)}
.lb-modal ul{margin:0 0 10px;padding-left:18px}.lb-modal li{margin-bottom:5px}
.shopitem{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;min-height:48px;padding:6px 12px;background:var(--pan2);border:1px solid var(--ln);margin-bottom:6px;text-align:left}
.shopitem span{font:500 12px var(--n);color:var(--metal);white-space:nowrap}
.shopitem.off{opacity:.42}
/* голос — над кораблём, нажатия пропускает */
#lb-voice{bottom:auto;top:calc(var(--top) + 39px);pointer-events:none;z-index:45;font-size:12.5px;line-height:1.25;padding:4px 10px}
#lb-voice small{margin:0;font-size:8.5px}
/* итог */
#end{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto;padding:calc(var(--top) + 12px) 16px 24px}
#end .in{max-width:680px;margin:0 auto}
#end .kick{font-size:11px;letter-spacing:.22em;font-weight:700;color:var(--mid)}
#end h1{margin:4px 0 10px;font-size:34px;line-height:1.05;font-weight:600}
#end h1.lost{color:var(--red)}
#end .big{font:600 76px/1 var(--n);color:var(--ppl)}
#end .big.zero{color:var(--red)}
#end .bl{font-size:12px;letter-spacing:.14em;color:var(--mid);margin-bottom:14px}
#end .sayit{border-left:3px solid var(--ppl);padding:6px 12px;margin:12px 0;background:var(--pan)}
#end .sayit small{display:block;font-size:9.5px;letter-spacing:.18em;color:var(--ppl);font-weight:700}
#end .tbl{display:grid;grid-template-columns:1fr auto;gap:2px 16px;font:400 13px var(--n);margin:6px 0 14px}
#end .tbl .r{text-align:right}
#end h3{margin:14px 0 4px;font-size:10px;letter-spacing:.18em;font-weight:700;color:var(--mid)}
#end .gone{margin:0;padding:0;list-style:none}
#end .gone li{padding:3px 0;border-bottom:1px solid var(--ln)}
#end .gone em{font-style:normal;color:var(--mid);font-size:12.5px}
#end .btn{margin-top:14px;width:100%;max-width:280px;min-height:48px}
/* компьютер: карта сверху, корабль снизу, справа реактор и экипаж */
@media (min-width:900px){
 #g{display:grid;grid-template-columns:minmax(0,1fr) 330px;grid-template-rows:auto minmax(0,1fr)}
 #hud{grid-column:1 / 3}
 .h{padding:6px 14px}.h small{font-size:10px}.h b{font-size:20px}.h i{font-size:12px}
 #left{grid-column:1;grid-row:2;min-height:0}
 #right{grid-column:2;grid-row:2;min-height:0;display:flex;flex-direction:column;border-left:1px solid var(--ln);background:var(--pan);overflow:auto}
 #right .sec{display:block;padding:10px 12px 6px;font-size:10px;letter-spacing:.18em;font-weight:600;color:var(--mid)}
 #mapw{flex:1 1 40%}
 #shipw{flex:1 1 54%}
 #pow{grid-template-columns:1fr;background:none;border:0;gap:0;padding:0 12px}
 .pc{border-bottom:1px solid var(--ln)}
 .pc .m{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:0 12px}
 .pc small{font-size:11px}.pips{margin:0}.pips u{width:12px;height:16px}
 .pc button{flex-basis:44px}
 #crew{grid-auto-flow:row;grid-auto-rows:minmax(58px,auto);background:none;border:0;gap:6px;padding:0 12px 12px}
 .ch{border:1px solid var(--ln);padding:7px 10px 10px}
 .ch b{font-size:14px}.ch b.sh{display:none}.ch b.fl{display:block}.ch small{font-size:11px}
 #info{font-size:14px;padding:4px 14px}#info span{font-size:12px}
 #act{min-width:170px;font-size:13px}#pause{flex-basis:64px}
 #alarmT{font-size:14px}#alarm{padding-left:14px}#alarm button{font-size:13px;padding:0 16px}
 #lb-voice{left:auto;right:0;top:auto;bottom:0;transform:none;width:330px;font-size:14px;line-height:1.3;padding:10px 14px}
 #lb-voice small{font-size:9.5px;margin-bottom:2px}
}
body.crisis #hud{box-shadow:0 1px 0 var(--red)}
@media (max-width:899px){
 body.crisis #mapw{flex:0 0 62px}
 body.crisis #shipw{flex:1 1 auto}
}
</style></head><body>
<script>
/* ===================== ЯДРО: без DOM, его гоняют боты ===================== */
var CORE=(function(){

  var SKILL={eng:{n:'инженер',l:'И'},fire:{n:'пожарный',l:'П'},pilot:{n:'пилот',l:'Л'},med:{n:'врач',l:'В'},any:{n:'матрос',l:'М'}};
  var CRISIS={fire:'ПОЖАР',breach:'ПРОБОИНА',flash:'ВСПЫШКА',storm:'ШТОРМ',cold:'ХОЛОД НОЧИ',leak:'УТЕЧКА ТОПЛИВА',pods:'СБОЙ КАПСУЛ',berth:'ПОСЛЕДНИЙ ПРИЧАЛ'};
  var NODE={colony:'КОЛОНИЯ',dead:'МЁРТВЫЙ МИР',convoy:'КОНВОЙ',storm:'ШТОРМ',void:'ПУСТОТА',beacon:'МАЯК',yard:'ВЕРФЬ ПУЛЬТА',exit:'ВЫХОД ИЗ КОЛЬЦА',berth:'ПОСЛЕДНИЙ ПРИЧАЛ',start:'ВХОД'};
  var SECT=['ВНУТРЕННЕЕ КОЛЬЦО','СРЕДНЕЕ КОЛЬЦО','КРАЙ'];
  var FRATE=[.55,.66,.78], MAPCREEP=.012, CRISCREEP=.008;
  var G=null;

  /* --------- события: {x} подставляется, d(v) — цифры до выбора, risk — {p, c}, say — ответ --------- */
  function O(t,d,risk,say){ return {t:t,d:d||function(){return {}},risk:risk,say:say} }
  var EV=[
   {on:'colony',text:'{W}: {n} живых. Просят взять только детей, их {a}. Стариков оставить: так решили сами.',o:[O('Только детей',function(v){return {people:v.a,label:'Дети '+v.W}}),O('Всех, спорить у шлюза',function(v){return {people:v.n,front:.35,label:v.W}}),O('Уйти',0,0,'Они не махали. Смотрели на сопло.')]},
   {on:'colony',text:'{W}. {n} человек стоят у шлюза с вещами. Говорят, вы обещали. Я не знаю, кто обещал.',o:[O('Забрать',function(v){return {people:v.n,front:.2,label:v.W}}),O('Забрать половину',function(v){return {people:v.a,label:v.W}},0,'Я сказала остальным про следующий рейс. Вы слышали.'),O('Уйти',0,0,'Они ещё стоят. Я проверила.')]},

   {on:'colony',text:'{W}: купол треснул. {n} человек в скафандрах. Стыковка пойдёт через пробоину.',o:[O('Стыковаться сейчас',function(v){return {people:v.n,label:v.W}},{p:.75,c:'breach'}),O('Через дальний шлюз',function(v){return {people:v.n,front:.55,label:v.W}}),O('Уйти')]},
   {on:'colony',text:'На {W} горит склад. {n} человек и {r} рационов, если успеть.',o:[O('Людей и склад',function(v){return {people:v.n,rations:v.r,label:v.W}},{p:.7,c:'fire'}),O('Только людей',function(v){return {people:v.n,label:v.W}}),O('Уйти')]},
   {on:'colony',text:'На {W} врач {name} лечит {n} больных. Больным нельзя в капсулы: они будут есть и дышать.',o:[O('Всех, без капсул',function(v){return {awake:v.n,label:'Больные '+v.W}}),O('Только врача',function(v){return {crew:{name:v.name,skill:'med'}}},0,'{name} молчит. Это не согласие.'),O('Уйти')]},

   {on:'dead',text:'Мёртвая линия над {W}. Судно на орбите, экипаж внутри. В баках {f} топлива.',o:[O('Слить баки',function(v){return {fuel:v.f}},{p:.3,c:'fire'}),O('Мимо',0,0,'Я записала номер судна.')]},
   {on:'dead',text:'На {W} работает насос. Его забыли выключить несколько веков назад. В цистернах {f} топлива.',o:[O('Выкачать всё',function(v){return {fuel:v.f,front:.2}}),O('Взять что наверху',function(){return {fuel:1}}),O('Мимо')]},

   {on:'dead',text:'На {W} реактор без людей. Один стержень можно снять. {crew} говорит, что успеет.',o:[O('Снять стержень',function(){return {reactor:1,crewHp:-10}},{p:.6,c:'fire'}),O('Мимо')]},

   {on:'void',text:'Экипаж просит поминальный час за тех, кто остался. Это задержка.',o:[O('Дать',function(){return {crewHp:15,front:.2}},0,'Они читали имена. Я подсказывала.'),O('Нет',function(){return {crewHp:-10}})]},

(function(){ var down=null, mute=0;
  document.addEventListener('pointerdown',function(e){ down=e.pointerType==='touch'&&e.target.closest?e.target.closest('button,a'):null },true);
  document.addEventListener('pointerup',function(e){ if(!down||e.pointerType!=='touch') return; var b=down; down=null; var t=document.elementFromPoint(e.clientX,e.clientY); if(!t||!t.closest||t.closest('button,a')!==b) return; var got=false, h=function(){ got=true }; b.addEventListener('click',h,{once:true,capture:true}); setTimeout(function(){ b.removeEventListener('click',h,true); if(!got&&b.isConnected&&!b.disabled){ b.click(); mute=Date.now()+400 } },120) },true);
  document.addEventListener('click',function(e){ if(e.isTrusted&&Date.now()<mute){ e.stopPropagation(); e.preventDefault() } },true);
})();
UI.init();
</script></body></html>
