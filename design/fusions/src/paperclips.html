<!doctype html>
<html lang="ru"><head><meta charset="utf-8">

<style>
html,body{background:#070708}
body{font-family:var(--n)}
#lb-stage{overflow:hidden;background:#070708}
#lb-voice{pointer-events:none;font-family:var(--h)}

body.bare #lb-stage{top:0}
#g{height:100%;display:grid;grid-template-columns:minmax(290px,330px) minmax(0,1fr) minmax(360px,440px);gap:0 1px}
.col{display:flex;flex-direction:column;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px 18px 22px;scrollbar-width:thin;scrollbar-color:var(--ln) transparent}

#p-clock{order:1}#p-core{order:2}#p-stock{order:3}#p-dose{order:4}#p-stats{order:5}
#p-worlds{order:1;flex:1 1 0;min-height:180px;display:flex;flex-direction:column}#p-worlds>.b{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--ln) transparent;padding-right:6px}

.p{flex:none;margin-bottom:18px;border-top:1px solid var(--ln);padding-top:8px;animation:rev .45s steps(9) backwards}

@keyframes rev{from{clip-path:inset(0 100% 0 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}

.kv{display:flex;align-items:baseline;gap:8px;font-size:13px;line-height:1.7;font-variant-numeric:tabular-nums}

.ppl{color:var(--ppl)}.food{color:var(--food)}.metal{color:var(--metal)}.fuel{color:var(--fuel)}.red{color:var(--red)}.ark{color:var(--ark)}.dimt{color:var(--dim)}.pos{color:var(--food)}.neg{color:var(--red)}

.w1 .rt{min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
.wb{height:2px;background:#17171a;margin:5px 0}.wb i{display:block;height:100%}
.w2{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mid)}

#beg:hover,#beg:active{background:var(--red);color:#000}
.seatbar{height:10px;background:#17171a;margin:8px 0 2px;position:relative}.seatbar i{position:absolute;left:0;top:0;bottom:0;background:var(--ark)}.seatbar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ppl)}
#final{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;animation:rev .6s steps(10) backwards}
#final .ln{font:400 17px/1.4 var(--h);max-width:460px;margin-top:22px;color:var(--ink);min-height:72px}

#black{position:absolute;inset:0;background:#000;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px;letter-spacing:.3em}
#end{position:absolute;inset:0;overflow-y:auto;padding:28px 18px 40px;display:flex;justify-content:center}
#end .in{width:min(620px,100%)}
#end .ti{font-size:11px;letter-spacing:.24em;color:var(--mid);margin-bottom:14px}
#end .sc{font-size:64px;line-height:1;color:var(--ppl);font-variant-numeric:tabular-nums}
#end .scl{font-size:11px;letter-spacing:.2em;color:var(--mid);margin:4px 0 20px}

#end .row3 b{display:block;font-weight:500;font-size:22px;font-variant-numeric:tabular-nums}
#end .row3 small{font-size:10px;letter-spacing:.14em;color:var(--mid)}
#end .pl{font-size:12px;line-height:1.7;color:var(--mid);margin-bottom:16px}
#end .al{font:400 16px/1.45 var(--h);border-left:3px solid var(--ppl);padding-left:12px;margin-bottom:16px}
#end .al small{display:block;font-size:9.5px;letter-spacing:.18em;color:var(--ppl);font-weight:700;margin-bottom:2px}
#end .names{font:400 14px/1.6 var(--h);color:var(--ink);margin-top:6px}
#end .btn{width:100%;min-height:52px;margin-top:8px;font-family:var(--n)}
@media (max-width:860px){
  #lb-stage{overflow-y:auto;overflow-x:hidden}
  #g{display:flex;flex-direction:column;height:auto;min-height:100%;padding:0 16px 104px}
  #g.start{height:100%;padding:0}
  .col{display:contents}
  .p{margin-bottom:14px}
  #alert{order:1;position:sticky;top:60px;z-index:5;margin:0 0 10px}
  #p-clock{order:0;position:sticky;top:0;background:#070708;z-index:4;margin-bottom:8px;border-top:0;padding-top:6px;padding-bottom:6px;border-bottom:1px solid var(--ln)}
  #p-clock>header{display:none}
  #g.dis #p-clock>header{display:flex}
  #p-clock .big{font-size:18px}
  #p-clock>.b{display:flex;align-items:center;gap:8px}
  #clockbig{flex:1;min-width:0;flex-direction:column;align-items:flex-start;gap:0;flex-wrap:nowrap}
  #clockbig small{font-size:10px;white-space:nowrap;letter-spacing:.02em;max-width:100%;overflow:hidden}
  .spd{margin:0;flex:none;gap:3px}
  .spd button{flex:none;width:38px;font-size:11px}
  #g.dis #p-clock{position:static}
  #g.dis #alert{top:0}
  #p-ark{order:2}#p-act{order:3}#p-core{order:4}#p-proj{order:5}#p-stats{order:6}#p-stock{order:7}#p-dose{order:8}#p-worlds{order:9}#p-yard{order:10}
  #g.dis #p-worlds{order:3}
  #p-worlds{min-height:0;display:block;flex:none}#p-worlds>.b{overflow:visible;padding-right:0}
  #c3:has(#p-worlds) #p-log{flex:none}
  #p-log{position:fixed;left:0;right:0;bottom:0;margin:0;height:92px;min-height:0;flex:none;background:#0c0c0e;border-top:1px solid var(--ln);padding:6px 16px 8px;z-index:6}
  #p-log>header{position:absolute;right:16px;top:6px;margin:0;min-height:0;z-index:2}
  #g.dis #logb{padding-right:128px}
  #p-log>header .lbl{display:none}
  #p-log>header .brk{background:#070708}
  #logb{mask-image:linear-gradient(to bottom,transparent 0,#000 18px)}
  .l.a{font-size:13.5px}
  #cards{grid-template-columns:1fr}
  .big{font-size:26px}
  #end .sc{font-size:56px}
}
</style>

<script>
/* ================= ЯДРО: правила без DOM ================= */
var GAME=(function(){
var K={ypsK:.0038,eat:.0125,br:.005,P0:6000,m0:.001,dig:.18,D0:2600,Dg:3,seatM:20,seatP:10,win:1500,fuelDrain:.0007,metalDrain:.0007};
var SH={c:{n:'курьер',g:'Гермес',cls:'courier',cap:10,rt:8,crew:2,m:15,f:.02},h:{n:'тягач',g:'Сизиф',cls:'hauler',cap:40,rt:12,crew:6,m:60,f:.06},f:{n:'грузовоз',g:'Атлант',cls:'freighter',cap:240,rt:18,crew:18,m:300,f:.24}};
var RES={food:'рационы',metal:'металл',fuel:'топливо'};
var FN=['Ана','Това','Мира','Юна','Эда','Нея','Ида','Зоя','Лина','Вера','Тая','Рада','Ольга','Сана','Ника'];
var MN=['Илья','Сол','Лев','Руслан','Киран','Павел','Оскар','Тимур','Арно','Давид','Марк','Глеб','Ян','Роман','Федор'];
var LN=['Ковач','Марен','Рейн','Данек','Осс','Тарн','Векс','Гай','Морн','Лод','Сарт','Хорн','Брант','Вил','Кейн','Ренд','Фосс','Тель','Нойс','Ург'];
var S,R,listF,listM,allNames;
var T={ /* журнал: у Александры всё короче, по ярусам */
 0:['{f} родила. Мальчик, имя: {M}. Я записала.','{m} починил насос и третий день об этом рассказывает. Я слушаю.','{f} спросила, что такое «дом». Я сказала: здесь. Она кивнула.','{m} и {f} теперь живут в одном отсеке. Меня просили быть свидетелем. Я согласилась.','{f} учит детей счёту. Дети спрашивают, кто считает взрослых. Я перевела это как «спасибо».','{m} передаёт вам благодарность за рационы. Не знаю, как это перевести. Перевела.','{f} просит передать: вчера было вкуснее. Передаю.','{m} вырезал на стене отсека дату. Какую, не знает. Просто дату.'],
 1:['{m}, старший смены. Сдал вахту, ушёл спать.','{f} ушла на линию. Дочь осталась дома.','Смена сдала вахту. {f} спросила, кто принимает. Я сказала: её сын.','{m}. Сорок лет на судне. Дома не узнал отсек.','{f}. Родилась в рейсе. Спрашивает, где это: дом.','{m} и {f}. Встретились на линии, разошлись на линии.'],
 2:['{m}. Судно. Не вернулся.','{f}. Шестьдесят один год. Я записала.','{f}, {m}. Вторая палуба.','{m}. Прощание без часа. Я постояла сама.','Детская смена. {f}, двенадцать лет.','{f} спрашивала о вас. Я сказала, что вы считаете.'],
 3:['{F}. {M}. {F}.','Имена: {F}, {M}.','{F}.','{M}.','Я запомнила: {F}.','{M}. {M}.'],
 4:['Записала.','Одна.','Двое.','Я помню.','Ещё один.','Я ещё помню.']};
function name(i){ return allNames[i%allNames.length] }
function fill(s){ var d=function(l){ return l[Math.floor(R()*l.length)] };
  return s.replace(/\{f\}/g,function(){ return d(listF) }).replace(/\{m\}/g,function(){ return d(listM) }).replace(/\{F\}/g,function(){ return d(FN) }).replace(/\{M\}/g,function(){ return d(MN) }) }
function a(t){ S.ev.push({w:'a',t:fill(t)}); S.say=S.ev[S.ev.length-1].t; trim() }
function p(t){ S.ev.push({w:'p',t:'> '+t}); trim() }
function trim(){ if(S.ev.length>400) S.ev.splice(0,200) }
function fm(n){ return LB.fmt(n) }

function newWorlds(){ var names=R.shuffle(LB.WORLDS).map(function(s){ return s.toUpperCase() }),out=[];
  var plan={1:['food','metal'],2:['fuel','food','metal'],3:['food','metal','fuel'],4:['food','food','metal','fuel'],5:['food','metal','fuel','food']};
  for(var r=1;r<=5;r++){ (r===1?plan[r]:R.shuffle(plan[r])).forEach(function(res){
    var dep=K.D0*Math.pow(K.Dg,r-1)*(.8+.4*R())*(r===1&&res==='food'?.75:1);
    out.push({i:out.length,name:names[out.length],res:res,ring:r,dep:dep,dep0:dep,pop:0,ships:{c:0,h:0,f:0},founded:false,dead:false,lift:false,rate:0,raw:0}) }) }
  return out }

function reset(seed){ seed=(seed>>>0)||1; R=LB.rng(seed);
  listF=[];listM=[];var lnames=R.shuffle(LN);
  R.shuffle(FN).forEach(function(n,i){ listF.push(n+' '+lnames[i%20]) }); R.shuffle(MN).forEach(function(n,i){ listM.push(n+' '+lnames[(i+7)%20]) });
  allNames=[]; for(var i=0;i<Math.max(listF.length,listM.length);i++){ allNames.push(listF[i]); allNames.push(listM[i]) }
  R.shuffle(FN.concat(MN)).forEach(function(n,i){ lnames.forEach(function(l,j){ if((i+j)%3===0){ var x=n+' '+l; if(allNames.indexOf(x)<0) allNames.push(x) } }) });
  S={seed:seed,t:0,y:0,yn:3400+R()*500,ev:[],say:'',
    home:40,crew:0,hungry:12,trust:.5,dose:1,outS:.35,food:70,metal:0,fuel:0,
    fed:0,flights:0,flight:0,on:{act:1},got:{},broken:{},coldN:0,names:40,nameShare:1,peak:40,everB:0,everD:0,
    proc:1,mem:1,tacts:0,nodes:0,serv:0,servNext:330,servStep:330,nodeN:0,
    ring:1,cls:'c',tactMul:1,prod:1,eatMul:1,crewMul:1,birthMul:1,deathAdd:0,trustPen:0,cour:0,counts:{c:0,h:0,f:0},
    arkOn:false,arkShare:.6,arkM:0,parts:0,bonus:0,dis:false,last:false,transit:[],lost:0,
    inc:{food:0,metal:0,fuel:0},use:{food:0,metal:0,fuel:0},jT:6,pT:9,tb:0,td:0,yl:0,over:null,winters:0};
  S.W=newWorlds(); S.W[0].flightable=true;
  return S }

function yps(){ return Math.exp(K.ypsK*S.t) }
function app(){ return 1+Math.pow(S.y/2200,1.5) }
function pop(){ var n=S.home+S.crew; S.W.forEach(function(w){ n+=w.pop }); return n }
function colonists(){ var n=0; S.W.forEach(function(w){ n+=w.pop }); return n }
function inflight(){ return S.transit.reduce(function(s,x){ return s+x.n },0) }
function seats(){ return Math.floor(S.arkM/K.seatM+S.parts/K.seatP+S.bonus) }
function tier(){ return Math.max(0,Math.min(4,Math.floor(S.coldN*.55+S.y/1100))) }
function cap(){ return 100*S.mem }
function hands(){ return Math.max(.8,Math.min(1.25,1+(1-S.dose)*.5))*(S.trust<.2?.7:1) }
function shipCount(w){ return w.ships.c+w.ships.h+w.ships.f }
function fleet(){ var n=0; S.W.forEach(function(w){ n+=shipCount(w) }); return n }
function crewNeed(){ var n=0; S.W.forEach(function(w){ if(w.dead) return; n+=w.ships.c*SH.c.crew+w.ships.h*SH.h.crew+w.ships.f*SH.f.crew }); return (n+S.cour*SH.c.crew)*S.crewMul }
function rawRate(w){ var r=w.ring,m=1+.5*(r-1),v=0; for(var c in SH) v+=w.ships[c]*SH[c].cap*m/(SH[c].rt*r); return v }
function fuelRate(w){ var v=0; for(var c in SH) v+=w.ships[c]*SH[c].f; return v*w.ring }
function price(c){ return Math.round(SH[c].m*(1+.012*S.counts[c])) }
function depth(res){ var d=0,live=0; S.W.forEach(function(w){ if(w.res===res&&w.ring<=S.ring&&!w.dead){ d+=w.dep; if(w.founded) live++ } }); var b=Math.max(S.inc[res],S.use[res]); return b>0?d/b:1e9 }

  if(P.ark){ var st=G.seats(); txt($('st'),fm(st)); txt($('hm'),fm(S.home)); var fl=G.inflight(); txt($('tr'),fm(fl)); $('trw').style.display=fl>=1?'':'none'; var mx=Math.max(st,S.home,1); $('sb').style.width=st/mx*100+'%'; $('sbh').style.left=Math.min(99.5,S.home/mx*100)+'%'; $('beg').style.display=S.dis?'none':''; P.ark.querySelector('.b').__a.__u() }

function val(b,key,s,vis){ var d=b['k_'+key]; if(vis===undefined||vis){ d.style.display=''; txt(d.__v,s) } else d.style.display='none' }
function stockRow(b,key,v,net,show){ var d=b['k_'+key]; txt(d.__v,fm(v)); if(show){ var n=net*100; txt(d.__e,(n>=0?'+':'')+fm(n)+'/в'); d.__e.className=n<0?'neg':'' } }
var rowsMax=0;

function worlds(){ var S=G.S,host=$('wr'),sumE=$('sum'); txt(P.worlds.querySelector('.lbl'),S.dis?'РАЗБОРКА · ЛИНИИ И МИРЫ':'МИРЫ');
  if(S.sum&&!S.dis){ sumE.style.display=''; host.style.display='none'; var f=0,n=0,dep=0,dep0=0,rate={food:0,metal:0,fuel:0}; S.W.forEach(function(w){ if(w.founded){ f++; dep+=w.dep; dep0+=w.dep0; rate[w.res]+=w.rate } }); var h='<div class="big">'+f+' <small class="lbl">МИРОВ</small></div><div class="kv"><span>СУДОВ</span><b style="font-weight:500">'+G.fleet()+'</b></div><div class="kv"><span>НА МИРАХ</span><b style="font-weight:500">'+fm(G.colonists())+'</b></div><div class="kv"><span>ЗАЛЕЖЬ</span><b style="font-weight:500">'+Math.round(dep/Math.max(1,dep0)*100)+'%</b></div>'; if(sumE.__h!==h){ sumE.__h=h; sumE.innerHTML=h } return }

    if(!vis){ if(e){ e.remove(); delete rows[w.i] } return }

    e.classList.toggle('dead',w.dead); var n=G.shipCount(w),cl=w.ships.f?'f':w.ships.h?'h':'c',sh=n?(LB.ship(G.SH[cl].cls,16)+'<span>×'+n+'</span>'):''; var sE=e.querySelector('.sh'); if(sE.__h!==sh){ sE.__h=sh; sE.innerHTML=sh } txt(e.querySelector('.rt'),w.founded?(w.dead?'0':('+'+fm(w.rate*100)+'/в')):fm(w.dep)); e.querySelector('.wb i').style.width=(w.dep/w.dep0*100)+'%';
    txt(e.querySelector('.pp'),(w.pop>=1?fm(w.pop)+' чел':'')+(w.lift?' ▲':''));
    var A=e.__a1,B=e.__a2; A.className='btn a1'; B.className='btn a2'; e.__f1=e.__f2=null; var ta='',tb='';
    if(S.dis){ if(n){ ta='СНЯТЬ ЛИНИЮ'; A.classList.add('r'); e.__f1=function(){ return G.act.drop(w.i) } } if(w.pop>=1&&!w.lift){ tb='ПОДНЯТЬ '+fm(w.pop); B.classList.add('y'); e.__f2=function(){ return G.act.lift(w.i) } } }
    else if(!w.founded){ var c=G.foundCost(w); ta='ЗАСЕЛИТЬ '+c.m+' М · '+c.p+' ЧЕЛ'; e.__f1=function(){ return G.act.found(w.i) } }
    else if(w.dead){ if(n){ ta='ПЕРЕВЕСТИ СУДА'; A.classList.add('r'); e.__f1=function(){ return G.act.move(w.i) } } if(w.pop>=1&&!w.lift&&S.cour>0){ tb='ПОДНЯТЬ'; B.classList.add('y'); e.__f2=function(){ return G.act.lift(w.i) } } }
    else if(S.on.yard){ var scl=G.shipCls(); ta='+'+G.SH[scl].n.toUpperCase()+' '+G.price(scl)+' М'; e.__f1=function(){ return G.act.ship(w.i) } }
    A.style.display=ta?'':'none'; txt(A,ta); B.style.display=tb?'':'none'; txt(B,tb) }) }
function alert_(){ var S=G.S,e=$('alert'),T='',B='',F=null; if(!e) return;
  if(!S.broken.stock&&S.on.stock&&S.got.feed){ var net=S.inc.food-S.use.food; if(net<0&&S.food/-net<140){ var yrs=Math.round(S.food/-net); T='РАЦИОНЫ: 0 ЧЕРЕЗ '+yrs+' ЛЕТ'; if(!S.broken.dose&&S.dose>.6&&!S.on.yard){ B='ПАЁК −10%'; F=function(){ return G.act.dose(S.dose-.1) } } else if(!S.dis&&S.on.yard){ var w=S.W.filter(function(x){ return x.res==='food'&&x.founded&&!x.dead })[0]; if(w){ B='+СУДНО: '+w.name; F=function(){ return G.act.ship(w.i) } } else { B='ПАЁК −10%'; F=function(){ return G.act.dose(S.dose-.1) } } } } }
  if(!T&&!S.broken.stock&&S.on.fuel&&!S.dis){ var nf=S.inc.fuel-S.use.fuel; if(nf<0&&S.fuel/-nf<120){ T='ТОПЛИВО: 0 ЧЕРЕЗ '+Math.round(S.fuel/-nf)+' ЛЕТ'; var w2=S.W.filter(function(x){ return x.res==='fuel'&&x.founded&&!x.dead })[0]; if(w2){ B='+СУДНО: '+w2.name; F=function(){ return G.act.ship(w2.i) } } else { var w3=S.W.filter(function(x){ return x.res==='fuel'&&!x.founded&&x.ring<=S.ring })[0]; if(w3){ B='ЗАСЕЛИТЬ '+w3.name; F=function(){ return G.act.found(w3.i) } } } } }
  if(!T&&!S.dis&&S.on.yard){ ['metal','fuel','food'].some(function(r){ if(r==='fuel'&&!S.on.fuel) return false; if(S.W.some(function(x){ return x.res===r&&x.founded&&!x.dead })) return false; var nw=S.W.filter(function(x){ return x.res===r&&!x.founded&&x.ring<=S.ring })[0]; T='НЕТ МИРА: '+G.RES[r].toUpperCase(); if(nw){ B='ЗАСЕЛИТЬ '+nw.name; F=function(){ return G.act.found(nw.i) } } return true }) }
  if(!T&&!S.dis&&S.on.fuel&&!S.broken.proj){ ['food','fuel','metal'].some(function(r){ var dd=G.depth(r); if(dd<320){ T='ЗАЛЕЖЬ, '+G.RES[r].toUpperCase()+': '+Math.round(dd)+' ЛЕТ'; var nr=G.nextRing(); if(nr&&nr.req()){ B=nr.t+' · '+nr.c+' Т'; F=function(){ return G.act.buy(nr.id) } } return true } }) }
  if(!T&&!S.dis&&!S.on.autoship){ var dw=S.W.filter(function(x){ return x.dead&&G.shipCount(x)>0 })[0]; if(dw){ T=dw.name+' ВЫРАБОТАН: '+G.shipCount(dw)+' СУДОВ СТОЯТ'; B='ПЕРЕВЕСТИ'; F=function(){ return G.act.move(dw.i) } } }
  if(!T&&!S.on.date&&S.y>1250&&S.got.ring3){ T='ДАЛЬНИЕ КОЛЬЦА: ДАННЫЕ НЕ СХОДЯТСЯ'; B='РАСЧЁТ ДАТЫ · 700 Т'; F=function(){ return G.act.buy('date') } }
  if(!T&&!S.broken.clock&&S.on.date&&!S.arkOn){ T='КОВЧЕГА НЕТ · НОЧЬ ЧЕРЕЗ '+Math.round(S.yn-S.y)+' ЛЕТ'; B='КОВЧЕГ · 1300 Т · 900 М'; F=function(){ return G.act.buy('ark') } }
  if(!T&&!S.broken.clock&&S.arkOn&&!S.dis&&S.yn-S.y<1000){ T='НОЧЬ ЧЕРЕЗ '+Math.round(S.yn-S.y)+' ЛЕТ · ВНЕ ДОМА '+fm(G.pop()-S.home); B='НАЧАТЬ РАЗБОРКУ'; F=function(){ return G.act.begin() } }
  if(T){ e.classList.add('on'); txt(e.children[0],T); txt(e.children[1],B); e.children[1].style.display=B?'':'none'; e.__fn=F } else e.classList.remove('on') }

  for(;seenEv<S.ev.length;seenEv++){ var x=S.ev[seenEv]; if(box){ var d=document.createElement('div'); d.className='l '+(x.w==='p'?'pu':'a'); d.textContent=x.t; box.insertBefore(d,box.firstChild); while(box.children.length>36) box.removeChild(box.lastChild) } else if(x.w==='a'&&!S.over) LB.voice(x.t,4500) } }

function finalLine(){ var S=G.S,l=$('lastl'); if(!l) return; var n=Math.round(G.inflight()); txt(l,n>=1?('Ещё идут: '+fm(n)+'. Из вас выйдет сорок мест. Столько их было в первый день. Подождите идущих, если можете.'):'Из вас выйдет сорок мест. Столько их было в первый день. Подайте им, пожалуйста, на дорогу.') }

function renderEnd(o){ document.body.classList.remove('bare'); var best=0; try{ best=+localStorage.getItem('lb-paperclips-best')||0; if(o.souls>best) localStorage.setItem('lb-paperclips-best',String(o.souls)) }catch(e){}

  stage.innerHTML='<div id="end">'+h+'</div>'; $('again').onclick=restart }

/* цикл */
var lastT=0,acc=0;
function frame(ts){ var dt=Math.min(.25,(ts-lastT)/1000||0); lastT=ts; var S=G.S;
  if(!S.over&&!G.paused){ var d=dt*G.speed; while(d>0){ var s=Math.min(.25,d); G.step(s); d-=s; if(G.S.over) break } }
  acc+=dt; S=G.S; if(!endShown&&S.over){ showEnd() } else if(S.last&&!finalShown&&!S.over){ setTimeout(function(){ if(G.S.last&&!G.S.over&&finalShown==='wait') showFinal() },650); finalShown='wait' } else if(!endShown&&finalShown===true){ if(acc>.25){ acc=0; finalLine() } } else if(!endShown&&acc>.11&&finalShown!==true){ acc=0; sync(); upd() }
  requestAnimationFrame(frame) }
build(); sync(); upd(); requestAnimationFrame(frame);
