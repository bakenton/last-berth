  ['food','fuel','metal'].forEach(function(k){ var l=CORE.left(G,k); if(l<=3){ var nm=CORE.RES[k].n; if(k==='food') A.push({t:'Рационы кончатся'+(l<1?' в эту смену':' через '+Math.floor(l)+' см.'),b:'Руки на ферму',fn:function(){ var x=G.slots.filter(function(s){ return s.type==='farm'&&s.hands<20 })[0]; if(!x){ LB.toast('Нет фермы с местами: стройте'); return } var why=CORE.setHands(G,x.id,20); if(why) LB.toast(why); UI.sel=x.id; UI.tab='room'; render() },red:l<=1});
      else { var wr=G.worlds.filter(function(w){ return w.res===k&&w.built&&!w.dark&&!w.empty&&w.hands<20 })[0]; A.push({t:(k==='fuel'?'Топливо':'Металл')+' кончится'+(l<1?' в эту смену':' через '+Math.floor(l)+' см.'),b:wr?'Руки на '+wr.name:'Линия',fn:function(){ if(wr){ var why=CORE.setHands(G,wr.id,20); if(why) LB.toast(why); UI.sel=wr.id } else { var nb=G.worlds.filter(function(w){ return w.res===k&&!w.built&&!w.dark })[0]; UI.sel=nb?nb.id:null } UI.tab='room'; render() },red:l<=1}) } } });
  if(G.trust<=20) A.push({t:'Доверие '+Math.round(G.trust)+'. При 0 и Страхе ниже 50 смена не выйдет.',b:'Книга',fn:function(){ UI.tab='book'; render() },red:true});
  if(G.fear<10) A.push({t:'Страх '+Math.round(G.fear)+'. Никто не проверяет наряды: выработка −10%.',b:'Книга',fn:function(){ UI.tab='book'; render() }});
  if(G.fear>=80) A.push({t:'Страх '+Math.round(G.fear)+'. При 100 самосуд и бегство.',b:'Книга',fn:function(){ UI.tab='book'; render() },red:true});
  if(G.pop>=CORE.housing(G)) A.push({t:'Коек нет: '+G.pop+'/'+CORE.housing(G)+'. Рождений почти нет.',b:'Строить',fn:function(){ var e2=G.slots.filter(function(s){ return !s.type })[0]; UI.sel=e2?e2.id:null; UI.tab='room'; render() }});
  A.sort(function(a,b){ return (b.red?1:0)-(a.red?1:0) }); return A.slice(0,window.innerWidth<900?1:4) }
function renderAlerts(){ var box=$('alerts'),A=alerts(); box.innerHTML=''; A.forEach(function(a){ var d=document.createElement('div'); d.className='al'+(a.red?'':' warn'); d.innerHTML='<span>'+e(a.t)+'</span>'; var b=document.createElement('button'); b.textContent=a.b; b.onclick=a.fn; d.appendChild(b); box.appendChild(d) }) }

/* ---- имена ---- */
function namesHtml(){ if(!G.names.length) return '<p class="hint" style="padding:8px 0">Имён пока нет. Я записываю тех, о ком вы решаете.</p>'; return G.names.map(function(n){ return '<div class="nm'+(n.x?' x':'')+'">'+e(n.n)+'<small>'+e(n.note)+' · год '+n.s*CORE.YR+'</small></div>' }).join('') }
function renderMem(){ var live=CORE.liveNames(G),xc=G.names.filter(function(n){ return n.x }).length; $('memh').innerHTML='<span class="lbl" style="margin:0;display:block">Помнит Александра</span><b>'+live+'</b><span>вычеркнуто '+xc+'</span>'; $('names').innerHTML=namesHtml(); $('log').innerHTML=G.log.slice(0,8).map(function(l){ return '<div><b>'+l.s*CORE.YR+'</b> '+e(l.t)+'</div>' }).join('') }

/* ---- панель ---- */
function renderTabs(){ var T=[['room','Отсек'],['book','Книга'+(G.cool?'':' ●')],['mem','Имена '+CORE.liveNames(G)]]; $('tabs').innerHTML=T.map(function(t){ return '<button data-tab="'+t[0]+'" class="'+(t[0]==='mem'?'memtab ':'')+(UI.tab===t[0]?'on':'')+'">'+t[1]+'</button>' }).join('') }
function costStr(c){ var o=[]; for(var k in c) if(c[k]) o.push('<span style="color:'+col(CORE.RES[k].c)+'">'+c[k]+'</span>'); return o.join(' ') }
function renderRoom(){ var id=UI.sel; if(!id){ return '<h3>Смена '+G.s+'</h3><p class="sub">Год '+G.s*CORE.YR+(G.s>=15?' · холод растёт':'')+'</p><p class="hint">'+(HINTS[G.s]||'Нажмите отсек или мир на схеме.')+'</p>'+summary() }
  var x=CORE.target(G,id),f=CORE.calc(G),m=f.m,h='';
  if(x.res){ var RR=CORE.RES[x.res],dead=x.dark||x.empty;
    h+='<h3 style="color:'+col(RR.c)+'">'+x.name+'</h3><p class="sub">'+RR.n+' · кольцо '+x.d+(x.dark?' · погас':x.empty?' · выработан':' · гаснет в смену '+(x.darkAt-1))+'</p>';
    h+='<div class="kv"><span>Залежь</span><span>'+Math.round(x.dep)+'/'+x.depMax+'</span><span>На руку</span><span>'+(x.rate*f.e*m.world).toFixed(1)+'</span><span>Топливо линии</span><span>'+x.up+' за смену</span><span>Гибель</span><span>'+(1.8*x.d*m.lineD).toFixed(1)+'% рук</span></div>';
    if(!x.built&&!x.dark){ var why=CORE.whyBuild(G,id),c=CORE.buildCost(G,null,x); h+='<button class="btn pri wide" data-build="'+id+'" '+(why?'disabled':'')+'>Проложить линию · '+c.metal+' металла, '+c.fuel+' топлива</button>'+(why?'<div class="why">'+e(why)+'</div>':'') }
    else if(x.built) h+=stepper(x,dead)+(x.hands>0&&!M_tf(m)?'<p class="hint">Снятые руки вернутся через смену.</p>':'')+scrapBtn(x);
    return h }
  if(!x.type){ h+='<h3>Пустой отсек</h3><p class="sub">Кольцо '+x.ring+(x.ring===2?' · с 22-й смены вдвое хуже':'')+(G.bAct?' · в эту смену уже строили':'')+'</p><div class="blist">';
    ['farm','house','yard','med'].forEach(function(t){ var T=CORE.TYPES[t],why=CORE.whyBuild(G,id,t),c=CORE.buildCost(G,t); h+='<button class="bo'+(why?' off':'')+'" data-build2="'+t+'"><b>'+T.n+'</b><small>'+(why?'<span style="color:var(--red)">'+e(why)+'</span>':T.d)+'</small><em>'+costStr(c)+'</em></button>' });
    return h+'</div>' }
  var T=CORE.TYPES[x.type]; h+='<h3 style="color:'+col(T.c)+'">'+T.n+'</h3><p class="sub">Кольцо '+x.ring+'</p>';
  if(x.type==='farm') h+='<div class="kv"><span>На руку</span><span>'+(CORE.FARM*f.e).toFixed(1)+' рац.</span></div>';
  if(x.type==='yard') h+='<div class="kv"><span>Качество от доверия</span><span>×'+CORE.yardQ(G).toFixed(2)+'</span><span>Мест за смену</span><span>'+(x.hands*.28*f.e*m.yard*CORE.yardQ(G)).toFixed(1)+'</span><span>Цена места</span><span>'+CORE.seatCost(G).toFixed(1)+' металла</span></div>';
  if(x.type==='med') h+='<div class="kv"><span>Смертность от старости</span><span>−'+Math.round(Math.min(45,x.hands*6))+'%</span></div>';
  if(x.type==='house') h+='<div class="kv"><span>Коек всего</span><span>'+CORE.housing(G)+'</span><span>Людей</span><span>'+G.pop+'</span></div>';
  if(T.cap) h+=stepper(x,false);
  return h+scrapBtn(x) }
function scrapBtn(x){ if(G.s<CORE.SCRAP_FROM||(x.res&&(!x.built||x.dark))) return ''; var why=CORE.whyScrap(G,x.id); return '<button class="btn wide" data-scrap="1" '+(why?'disabled':'')+'>Разобрать · +'+CORE.scrapGain(x)+' металла</button>'+(why?'<div class="why">'+e(why)+'</div>':'') }
function M_tf(m){ return !!m.transitFree }
function summary(){ var f=CORE.calc(G),h='<div class="kv">'; h+='<span>Руки</span><span>'+(CORE.handsTotal(G)-Math.max(0,CORE.handsFree(G)))+'/'+CORE.handsTotal(G)+'</span><span>Выработка</span><span>'+Math.round(f.e*100)+'%</span><span>Отказники</span><span>'+Math.round(G.hate)+'</span><span>Обещанных мест</span><span>'+Math.round(G.promise)+'</span><span>Коек</span><span>'+G.pop+'/'+CORE.housing(G)+'</span><span>Ночь</span><span>через '+(CORE.SH-G.s+1)+' см.</span>'; return h+'</div>' }
function stepper(x,dead){ var cap=CORE.capOf(x),free=CORE.handsFree(G); return '<div class="step"><button data-h="-5" '+(x.hands<=0?'disabled':'')+' aria-label="Минус">−</button><div>'+x.hands+'<small>РУК · СВОБОДНО '+Math.max(0,free)+'</small></div><button data-h="5" '+(dead||x.hands>=cap?'disabled':'')+' aria-label="Плюс">+</button></div>' }
function renderBook(){ var h='<p class="sub" style="margin-bottom:6px">'+(G.cool?'Следующая подпись через '+G.cool+' см.':'Можно подписать один. Не отменяется.')+'</p><div class="book"><div class="bk-h c">СЧЁТ</div><div class="bk-h n">ИМЕНА</div>';
  var pairs={}; CORE.PROTOS.forEach(function(p){ (pairs[p.pair]=pairs[p.pair]||{})[p.b]=p });
  Object.keys(pairs).sort(function(a,b){ return pairs[a].c.from-pairs[b].c.from }).forEach(function(k){ ['c','n'].forEach(function(b){ var p=pairs[k][b],st=CORE.protoState(G,p); h+='<button class="pr '+b+(st==='signed'?' signed':st==='lock'?' lock':st==='soon'?' soon':'')+'" data-p="'+p.id+'">'+e(p.n)+'<small>'+(st==='signed'?'подписан':st==='lock'?'закрыт':st==='soon'?'с '+p.from+'-й смены':'')+'</small></button>' }) });
  return h+'</div>' }
function renderPanel(){ var p=$('panel'),top=p.scrollTop; if(UI.tab==='book') p.innerHTML=renderBook(); else if(UI.tab==='mem') p.innerHTML='<div class="lbl" style="margin-bottom:4px">Помнит Александра: '+CORE.liveNames(G)+'</div>'+namesHtml(); else p.innerHTML=renderRoom(); p.scrollTop=top;
  $('foot').innerHTML='<button class="btn pri" id="endbtn">Сдать смену '+G.s+'</button>' }
function render(){ if(UI.headless||!G) return; renderStrip(); renderMap(); renderAlerts(); renderMem(); renderTabs(); renderPanel(); if(G.stage==='berth') renderBerth(); if(G.stage==='result') renderResult() }

/* ---- подпись протокола ---- */
function openProto(id){ var p=CORE.PBY[id],why=CORE.whySign(G,id),html='<div class="pd"><div class="lbl" style="color:'+(p.b==='c'?'var(--red)':'var(--ppl)')+'">'+(p.b==='c'?'Счёт':'Имена')+'</div><h2>'+e(p.n)+'</h2><p class="say">'+e(p.say)+'</p><p class="gain">'+e(p.gain)+'</p><p class="cost">'+e(p.cost)+'</p>'+(CORE.protoState(G,p)==='open'&&CORE.twoCodes(G,p)?'<p class="cost">Два устава в одной столовой: выработка −5%, отказников +3'+(p.b==='c'?', 2 имени вычеркнуты':'')+'</p>':'')+'<p class="later">Следствие через '+p.late.after+' см. — '+p.late.after*CORE.YR+' лет. Не отменяется.</p>'+(why?'<p class="why">'+e(why)+'</p>':'')+'</div>';
  var st=CORE.protoState(G,p); if(st==='signed') html=html.replace('<p class="why">Подписан</p>','<p class="later">Подписан в силе.</p>');
  LB.modal(html,why?[{t:'Закрыть'}]:[{t:'Подписать',cls:'warn',fn:function(){ var w=CORE.sign(G,id); if(w){ LB.toast(w) } else { LB.beep(180,.25,'sawtooth'); LB.toast('Подписано. Следствие через '+p.late.after*CORE.YR+' лет.',1800) } render(); if(G.stage==='result') renderResult() }},{t:'Не сейчас'}]) }

/* ---- дело и следствия ---- */
function chips(fx){ var o=[],add=function(c,t){ o.push('<span class="ch-'+c+'">'+t+'</span>') }, L={food:'рац.',metal:'мет.',fuel:'топл.'}; ['food','metal','fuel'].forEach(function(k){ if(fx[k]) add(k,sgn(fx[k])+' '+L[k]) }); if(fx.ppl) add('ppl',sgn(fx.ppl)+' чел.'); if(fx.ark) add('ark',sgn(fx.ark)+' мест'); if(fx.trust) add('trust','Доверие '+sgn(fx.trust)); if(fx.fear) add('fear','Страх '+sgn(fx.fear)); if(fx.drain) for(var k in fx.drain) add(k,'−'+fx.drain[k]+' '+L[k]+'/смену'); if(fx.promise) add('p','обещано +'+fx.promise); if(fx.promiseHate) add('p','обещано отказникам'); if(fx.hate) add('p','отказники '+sgn(fx.hate)); if(fx.eff) add('p','выработка +'+Math.round(fx.eff*100)+'%'); if(fx.name||fx.nameAs) add('name','+ имя'); if(fx.cross) add('x','имя'); if(fx.crossR) add('x',fx.crossR+' имени'); if(fx.restore) add('name','вернуть '+fx.restore+' имени'); return o.join('') }
function showNext(){ if(UI.headless||!G) return; var L=$('layer'); if(G.stage!=='shift'||(G.notes&&G.notes.length)||(G.case&&!G.answered)) LB.voice('');
  if(G.stage==='berth'){ renderBerth(); return } if(G.stage==='result'){ renderResult(); return }
  if(G.notes&&G.notes.length){ var n=G.notes[0]; L.className='on'; L.scrollTop=0;
    var body=n.k==='late'?'<div class="note-kind">СЛЕДСТВИЕ ПРОТОКОЛА · '+n.yrs+' ЛЕТ В СИЛЕ</div><div class="who">'+e(n.title)+'</div><div class="say"><small>АЛЕКСАНДРА</small>'+e(n.t)+'</div><div class="chips" style="margin:10px 0"><span class="ch-p">'+e(n.chips||'')+'</span></div>':(n.k==='alarm'?'<div class="note-kind">ТРЕВОГА</div><div class="say"><small>АЛЕКСАНДРА</small>'+e(n.t)+'</div>':'<div class="note-kind" style="color:var(--mid)">ПУЛЬТ</div><div class="say" style="border-color:var(--mid)">'+e(n.t)+'</div>');
    L.innerHTML='<div class="card"><div class="hd"><span>СМЕНА '+G.s+'</span><span>ГОД '+G.s*CORE.YR+'</span></div>'+body+'<button class="btn pri wide" id="noteok">Дальше</button></div>';
    $('noteok').onclick=function(){ G.notes.shift(); showNext() }; return }
  if(G.case&&!G.answered){ var c=G.case; L.className='on'; L.scrollTop=0; LB.beep(330,.05);
    var opts=c.opts.map(function(o,i){ var ch=chips(o.fx); if(o.chip) ch+='<span class="ch-p">'+e(o.chip)+'</span>'; return '<button class="opt" data-o="'+i+'"><b>'+e(o.l)+'</b><div class="chips">'+ch+'</div></button>' }).join('');
    L.innerHTML='<div class="card"><div class="hd"><span>ДЕЛО '+c.n+(c.follow?' · ПОТОМОК':'')+'</span><span>СМЕНА '+G.s+' · ГОД '+G.s*CORE.YR+'</span></div><div class="who">'+(c.self?'':'Александра переводит')+(c.role?(c.self?'':' · ')+e(c.role):'')+'</div><p class="txt">'+e(c.t)+'</p>'+opts+'</div>'; return }
  L.className=''; L.innerHTML=''; hintFor() }
function answerCase(i){ var a=CORE.answer(G,i); LB.beep(220,.08); var L=$('layer'); L.scrollTop=0; if(G.stage==='result'){ render(); return }
  L.innerHTML='<div class="card"><div class="hd"><span>СМЕНА '+G.s+'</span><span>ГОД '+G.s*CORE.YR+'</span></div><div class="say"><small>АЛЕКСАНДРА</small>'+e(a||'Записала.')+'</div><button class="btn pri wide" id="aftok">Дальше</button></div>'; $('aftok').onclick=function(){ showNext(); render() }; renderStrip(); renderMem(); renderTabs() }
var HINTS={1:'Нажмите мир или пустой отсек на схеме. Строить можно один раз за смену.',2:'В книге протоколов: первая подпись ждёт вас. Она не отменяется.',4:'Постройте верфь, пока есть время. Верфь — это места.'};
function hintFor(){ if(HINTS[G.s]&&!UI['h'+G.s]&&innerWidth>=900){ UI['h'+G.s]=1; LB.voice(HINTS[G.s],6000) } }

/* ---- причал ---- */
function renderBerth(){ LB.voice(''); var L=$('layer'),B=G.board,o=CORE.outcome(G),top=L.scrollTop; L.className='on';
  var rows=B.groups.map(function(g){ var c=g.on>=g.c&&g.c>0,ctl; if(B.fam) ctl='<button class="tgl'+(g.on?' on':'')+'" data-g="'+g.id+'" data-all="1">'+(g.on?'На борту':'Взять всех')+'</button>'; else ctl='<button data-g="'+g.id+'" data-d="-5" '+(g.on<=0?'disabled':'')+' aria-label="Меньше">−</button><span>'+g.on+'</span><button data-g="'+g.id+'" data-d="5" '+(g.on>=g.c?'disabled':'')+' aria-label="Больше">+</button>';
    return '<div class="gr'+(g.on===0&&g.id==='prom'?' warnr':'')+'"><div class="nm2">'+e(g.n)+' <em>'+g.c+'</em></div><div class="ef">'+e(g.ef)+'</div><div class="ppl">'+g.who.map(e).join(', ')+'</div><div class="ctl">'+ctl+'</div></div>' }).join('');
  L.innerHTML='<div class="berth"><div class="lbl" style="color:var(--ark)">Год '+CORE.SH*CORE.YR+' · Ночь</div><h2>Последний причал</h2>'+
   (B.out?'<p class="why" style="margin:4px 0 0">На мирах остались '+B.out+': не дома в день Ночи.</p>':'')+
   '<div class="bsum"><div><span class="lbl">Свободно</span><b style="color:var(--ark)">'+o.free+'/'+B.seats+'</b></div><div><span class="lbl">Дома</span><b style="color:var(--ppl)">'+B.home+'</b></div><div><span class="lbl">Дойдёт душ</span><b>'+o.souls+'</b></div><div><span class="lbl">Имён</span><b style="color:var(--ppl)">'+o.names+'</b></div></div>'+
   '<div class="loss">'+(o.why.length?'В перелёте: '+e(o.why.join(' · ')):'')+'</div>'+
   (B.fam?'<p class="hint" style="margin:0 0 8px">Протокол «Семьи не разлучать»: только целые группы.</p>':'')+rows+
   (B.lot?'<button class="btn wide" id="lotbtn">Тянуть жребий</button>':'')+
   '<button class="btn warn wide" id="launchbtn">Поднять трап · '+o.on+' на борту, '+Math.max(0,B.home-o.on)+' остаются</button></div>'; L.scrollTop=top }
function renderResult(){ var L=$('layer'),R=G.res; L.className='on'; L.scrollTop=0; var v=document.getElementById('lb-voice'); if(v) v.remove(); var best=0; try{ best=+localStorage.getItem('lb-frostpunk-best')||0; if(R.souls>best) localStorage.setItem('lb-frostpunk-best',R.souls) }catch(x){}
  var nl=G.names.slice(0,40).map(function(n){ return n.x?'<s>'+e(n.n)+'</s>':'<b>'+e(n.n)+'</b>' }).join(', ');
  L.innerHTML='<div class="res"><div class="ttl" style="color:'+(R.win?'var(--ark)':'var(--red)')+'">'+R.title+' · ГОД '+R.year+'</div><div class="two"><div class="a"><b id="souls">'+R.souls+'</b><span class="lbl">душ на борту</span></div><div class="b"><b id="namesn">'+R.names+'</b><span class="lbl">имён помнит Александра</span></div></div>'+
  '<p class="ln" style="color:var(--mid);font-size:14px">Осталось: '+R.left+(R.lost?' · потеряно в пути: '+R.lost:'')+(best?' · лучший счёт: '+Math.max(best,R.souls):'')+'</p>'+R.lines.map(function(l){ return '<p class="ln">'+e(l)+'</p>' }).join('')+'<p class="q">'+e(R.q)+'</p>'+(nl?'<div class="reslist">'+nl+'</div>':'')+'<button class="btn pri wide" id="again">Заново</button></div>' }

/* ---- нажатия ---- */
$('map').addEventListener('click',function(ev){ var g=ev.target.closest&&ev.target.closest('[data-id]'); if(!g) return; UI.sel=g.getAttribute('data-id'); UI.tab='room'; render() });
$('tabs').addEventListener('click',function(ev){ var t=ev.target.getAttribute('data-tab'); if(t){ UI.tab=t; render() } });
$('panel').addEventListener('click',function(ev){ var b=ev.target.closest('button'); if(!b) return;
  if(b.hasAttribute('data-h')){ var w=CORE.setHands(G,UI.sel,+b.getAttribute('data-h')); if(w) LB.toast(w); render(); return }
  if(b.hasAttribute('data-build')){ var w2=CORE.build(G,b.getAttribute('data-build')); if(w2) LB.toast(w2); LB.beep(520,.05); render(); return }
  if(b.hasAttribute('data-build2')){ var w3=CORE.build(G,UI.sel,b.getAttribute('data-build2')); if(w3) LB.toast(w3); else LB.beep(520,.05); render(); return }
  if(b.hasAttribute('data-scrap')){ var w4=CORE.scrap(G,UI.sel); if(w4) LB.toast(w4); else LB.beep(120,.12,'sawtooth'); render(); return }
  if(b.hasAttribute('data-p')){ openProto(b.getAttribute('data-p')); return } });
$('foot').addEventListener('click',function(ev){ if(!ev.target.closest('#endbtn')) return; if(!G.answered){ showNext(); return } var w=CORE.endShift(G); if(w){ LB.toast(w); return } UI.sel=UI.sel&&CORE.target(G,UI.sel)?UI.sel:null; render(); showNext() });
$('layer').addEventListener('click',function(ev){ var b=ev.target.closest('button'); if(!b) return;
  if(b.hasAttribute('data-o')){ answerCase(+b.getAttribute('data-o')); return }
  if(b.id==='launchbtn'){ var w=CORE.launch(G); if(w) LB.toast(w); else render(); return }
  if(b.id==='lotbtn'){ CORE.drawLots(G); renderBerth(); return }
  if(b.id==='again'){ start(Date.now()%1e9); return }
  if(b.hasAttribute('data-g')){ var id=b.getAttribute('data-g'),g=G.board.groups.filter(function(x){ return x.id===id })[0],why; if(b.hasAttribute('data-all')) why=CORE.setBoard(G,id,g.on?0:g.c); else why=CORE.setBoard(G,id,g.on+(+b.getAttribute('data-d'))); if(why) LB.toast(why); renderBerth(); return } });

/* холодная пыль: тянется к судну, когда начинается Ночь */
(function(){ var c=$('dust'),x=c.getContext('2d'),P=[]; for(var i=0;i<70;i++) P.push({a:Math.random()*6.28,r:Math.random()*1.2,s:.0006+Math.random()*.0016});
  function tick(){ requestAnimationFrame(tick); if(!G) return; var cold=CORE.coldAt(G.s); var W=c.clientWidth,H=c.clientHeight; if(c.width!==W||c.height!==H){ c.width=W; c.height=H } x.clearRect(0,0,W,H); if(!cold) return; var n=Math.min(70,cold*9),R=Math.max(W,H)*.75; x.fillStyle='rgba(180,205,240,.55)'; for(var i=0;i<n;i++){ var p=P[i]; p.r-=p.s*(1+cold*.15); if(p.r<.28) p.r=1.2; x.fillRect(W/2+Math.cos(p.a)*p.r*R,H/2+Math.sin(p.a)*p.r*R,2,2) } }
  tick() })();

window.GAME={CORE:CORE,G:null,get state(){ return G },newGame:function(seed,headless){ UI.headless=!!headless; G=CORE.newGame(seed); this.G=G; if(!headless){ render(); showNext() } return G },
  step:function(force){ var w=CORE.endShift(G,force); if(!UI.headless){ render(); showNext() } return w },
  act:{build:function(id,t){ return CORE.build(G,id,t) },hands:function(id,d){ return CORE.setHands(G,id,d) },sign:function(id){ return CORE.sign(G,id) },answer:function(i){ return CORE.answer(G,i) },board:function(id,n){ return CORE.setBoard(G,id,n) },lots:function(){ return CORE.drawLots(G) },launch:function(){ return CORE.launch(G) }},
  calc:function(){ return CORE.calc(G) },outcome:function(){ return CORE.outcome(G) },redraw:function(){ UI.headless=false; render(); showNext() }};
start(LB.seed);
if(LB.q.get('auto')) UI.ready=true;
