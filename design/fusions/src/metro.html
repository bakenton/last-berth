<script>
/* ===================== ЯДРО ПРАВИЛ (без рисования) ===================== */
var K={
  T:480, LIFT:390, REVEAL:160, GIFT:50, HUNGER:45, RES:50, SEAT0:40, SEATK:2.2, LIFT_V:.55, STARVE:{food:.5,metal:.25,fuel:.25}, MIN_WIN:100,
  START:{food:45,metal:40,fuel:40}, PEOPLE:42, CAP:12,
  R:[105,185,285,400], DEP:[45,62,230,400], RATE:[.5,.7,1,1.4], COST:[3,5,8,13], GROW:[.1,.14,.24,.3],
  BURN:{food:[.35,1.2],metal:[.12,.5],fuel:[.03,.14]}, YEARS:10, Y0:3200
};
var CLS={
  courier:{name:'Курьер',cap:2,v:88,crew:1,metal:5,fuel:.2},
  hauler:{name:'Тягач',cap:4,v:60,crew:2,metal:9,fuel:.4},
  freighter:{name:'Грузовоз',cap:8,v:39,crew:3,metal:16,fuel:.8}
};
var RES=['food','metal','fuel'], RNAME={food:'Рационы',metal:'Металл',fuel:'Топливо'}, RGEN={food:'рационов',metal:'металла',fuel:'топлива'};
var GIFTS={
  line:{t:'Линия',d:'+1 линия'},
  courier:{t:'Курьер',d:'2 места, быстрый, верфь 5 металла'},
  hauler:{t:'Тягач',d:'4 места, верфь 9 металла'},
  freighter:{t:'Грузовоз',d:'8 мест, медленный, верфь 16 металла'},
  engine:{t:'Двигатель',d:'все суда +12% скорости'},
  hold:{t:'Трюмы',d:'+1 место на каждом судне'},
  wake:{t:'Подъём смены',d:'+12 человек на Земле'},
  berth:{t:'Палуба ковчега',d:'+30 мест на борту'}
};

function burn(r,t){ var b=K.BURN[r], u=Math.min(1,t/K.T); return b[0]+b[1]*Math.pow(u,1.5) }
function clamp(v,a,b){ return v<a?a:v>b?b:v }

function newWorlds(seed,asp){
  var r=LB.rng(seed^0x5bd1), names=r.shuffle(LB.WORLDS), w=[{id:0,type:'earth',name:'ЗЕМЛЯ',ring:-1,x:0,y:0,bornAt:0,founded:true,pop:0,dep:0,dep0:0,surf:0}];
  var sa=Math.sqrt(clamp(asp||1,.74,1.9)), ni=0;
  var plan=[
    {types:['food','metal','fuel','food'],born:function(i){ return i<3?0:30 }},
    {types:r.shuffle(['food','metal','fuel','food','metal']),born:function(i){ return 38+i*20 }},
    {types:r.shuffle(['food','metal','fuel','food','metal','fuel']),born:function(i){ return 128+i*20 }},
    {types:r.shuffle(['food','metal','fuel','food','metal','fuel']),born:function(i){ return 245+i*18 }}
  ];
  plan.forEach(function(p,ring){
    var n=p.types.length, base=r()*6.283;
    /* порядок секторов перемешан, чтобы первые миры кольца не лежали рядом */
    var sect=r.shuffle(p.types.map(function(_,i){ return i }));
    p.types.forEach(function(type,i){
      var x,y,tries=0,ok;
      do{ var a=base+(sect[i]+(r()-.5)*.62)*6.283/n, rad=K.R[ring]*(.93+r()*.14);
        x=Math.cos(a)*rad*sa; y=Math.sin(a)*rad/sa; ok=true;
        for(var j=1;j<w.length;j++){ var dx=w[j].x-x,dy=w[j].y-y; if(dx*dx+dy*dy<64*64){ ok=false; break } }
      }while(!ok&&++tries<40);
      var dj=.85+r()*.3;
      w.push({id:w.length,type:type,ring:ring,name:names[ni++].toUpperCase(),x:x,y:y,bornAt:p.born(i),
        dep:Math.round(K.DEP[ring]*dj),dep0:Math.round(K.DEP[ring]*dj),rate:K.RATE[ring],surf:0,acc:0,founded:false,pop:0,dead:false,founder:null,cost:K.COST[ring]});
    });
  });
  return w;
}

function newState(seed,asp){
  return {seed:seed,asp:asp,t:0,phase:'play',worlds:newWorlds(seed,asp),lines:[],ships:[],
    stock:{food:K.START.food,metal:K.START.metal,fuel:K.START.fuel},people:K.PEOPLE,ark:0,seatBonus:0,hunger:0,
    lineCap:3,dock:{courier:{built:1,kit:0},hauler:{built:2,kit:0},freighter:{built:0,kit:0}},
    speed:1,hold:0,nextGift:K.GIFT,shift:0,gift:null,nextId:1,fx:[],ev:[],
    inr:{food:0,metal:0,fuel:0},outr:{food:0,metal:0,fuel:0},_in:{food:0,metal:0,fuel:0},_out:{food:0,metal:0,fuel:0},
    names:LB.rng(seed^0x77).shuffle(LB.PEOPLE),nameI:0,grng:LB.rng(seed^0x9e37),starving:0,stats:{carried:0,founded:0,evac:0,starved:0},result:null};
}

/* ---- геометрия линии: восьминаправленная ломаная со скруглением ---- */
function octi(a,b,out){
  var dx=b.x-a.x,dy=b.y-a.y,ax=Math.abs(dx),ay=Math.abs(dy),sx=dx<0?-1:1,sy=dy<0?-1:1,d=Math.min(ax,ay),st=Math.max(ax,ay)-d;
  var horiz=ax>ay, c;
  if(st<2||d<2){ out.push({x:b.x,y:b.y}); return }
  var sLen=st,dLen=d*1.414;
  if(sLen>dLen){ c=horiz?{x:a.x+sx*st,y:a.y}:{x:a.x,y:a.y+sy*st} }
  else{ c={x:a.x+sx*d,y:a.y+sy*d} }
  var l1=Math.hypot(c.x-a.x,c.y-a.y),l2=Math.hypot(b.x-c.x,b.y-c.y),r=Math.min(18,l1*.5,l2*.5);
  var p0={x:c.x+(a.x-c.x)*r/l1,y:c.y+(a.y-c.y)*r/l1},p2={x:c.x+(b.x-c.x)*r/l2,y:c.y+(b.y-c.y)*r/l2};
  out.push(p0);
  for(var i=1;i<=5;i++){ var u=i/5,v=1-u; out.push({x:v*v*p0.x+2*u*v*c.x+u*u*p2.x,y:v*v*p0.y+2*u*v*c.y+u*u*p2.y}) }
  out.push({x:b.x,y:b.y});
}
function routeLen(S,nodes){ var L=0,o; for(var i=0;i<nodes.length-1;i++){ o=[S.worlds[nodes[i]]]; octi(S.worlds[nodes[i]],S.worlds[nodes[i+1]],o); for(var j=1;j<o.length;j++) L+=Math.hypot(o[j].x-o[j-1].x,o[j].y-o[j-1].y) } return L }
function buildPaths(S){
  var groups={};
  S.lines.forEach(function(L){ for(var i=0;i<L.nodes.length-1;i++){ var a=L.nodes[i],b=L.nodes[i+1],k=Math.min(a,b)+'-'+Math.max(a,b); (groups[k]=groups[k]||[]).push(L.id) } });
  S.lines.forEach(function(L){
    var pts=[],stops=[0],cum=[0];
    function add(p){ var q=pts[pts.length-1]; if(q){ var d=Math.hypot(p.x-q.x,p.y-q.y); if(d<.01) return; cum.push(cum[cum.length-1]+d) } pts.push(p) }
    for(var i=0;i<L.nodes.length-1;i++){
      var a=S.worlds[L.nodes[i]],b=S.worlds[L.nodes[i+1]],lo=a.id<b.id?a:b,hi=a.id<b.id?b:a,k=lo.id+'-'+hi.id,g=groups[k],off=(g.indexOf(L.id)-(g.length-1)/2)*8;
      var nx=-(hi.y-lo.y),ny=hi.x-lo.x,nn=Math.hypot(nx,ny)||1; nx=nx/nn*off; ny=ny/nn*off;
      var A={x:a.x+nx,y:a.y+ny},B={x:b.x+nx,y:b.y+ny},o=[];
      add(A); octi(A,B,o); o.forEach(add);
      stops.push(cum[cum.length-1]);
    }
    L.path=pts; L.cum=cum; L.stops=stops; L.len=cum[cum.length-1];
  });
}
function posAt(L,s){
  var c=L.cum,P=L.path,lo=0,hi=c.length-1; s=clamp(s,0,L.len);
  while(hi-lo>1){ var m=(lo+hi)>>1; if(c[m]<=s) lo=m; else hi=m }
  var f=c[hi]>c[lo]?(s-c[lo])/(c[hi]-c[lo]):0,A=P[lo],B=P[hi];
  return {x:A.x+(B.x-A.x)*f,y:A.y+(B.y-A.y)*f,a:Math.atan2(B.y-A.y,B.x-A.x)};
}
function lineOf(S,id){ for(var i=0;i<S.lines.length;i++) if(S.lines[i].id===id) return S.lines[i]; return null }
function shipCap(S,sh){ return CLS[sh.cls].cap+S.hold }
function segOf(L,s){ var i=0; while(i<L.stops.length-2&&L.stops[i+1]<=s) i++; return i }
function snapshot(S){ S.ships.forEach(function(sh){ var L=lineOf(S,sh.line),i=segOf(L,sh.s),d=L.stops[i+1]-L.stops[i]; var o=posAt(L,sh.s); if(sh.ghost){ var gf0=clamp(sh.ghost.left/sh.ghost.d,0,1); o={x:o.x+(sh.ghost.x-o.x)*gf0,y:o.y+(sh.ghost.y-o.y)*gf0} } sh._m={a:L.nodes[i],b:L.nodes[i+1],f:d>0?clamp((sh.s-L.stops[i])/d,0,1):0,x:o.x,y:o.y} }) }
function restore(S){ S.ships.forEach(function(sh){ var L=lineOf(S,sh.line),m=sh._m,ia=L.nodes.indexOf(m.a),ib=L.nodes.indexOf(m.b);
  if(ia>=0&&ib===ia+1) sh.s=L.stops[ia]+m.f*(L.stops[ib]-L.stops[ia]); else if(ia>=0) sh.s=L.stops[ia]; else sh.s=L.len;
  sh.fromS=sh.s;
  /* судно не телепортируется: летит от прежнего места к новой точке линии, время честное */
  var n=posAt(L,sh.s),gd=Math.hypot(n.x-m.x,n.y-m.y); sh.ghost=gd>25?{x:m.x,y:m.y,d:gd,left:gd}:null;
  delete sh._m }) }

/* ---- суда ---- */
function canLoad(S,sh,w){ if(sh.recall||sh.load.length>=shipCap(S,sh)) return false; return S.phase==='lift'?w.pop>=1:w.surf>=1 }
function nextStop(S,L,sh){
  if(sh.recall) return 0;
  var last=L.nodes.length-1;
  if(sh.dir>0) return last;
  for(var i=last;i>=1;i--){ if(L.stops[i]<sh.s-.01&&canLoad(S,sh,S.worlds[L.nodes[i]])) return i }
  return 0;
}
function depart(S,sh,L){ var f=CLS[sh.cls].fuel*(.5+L.len/300); S.stock.fuel=Math.max(0,S.stock.fuel-f); S._out.fuel+=f }
function addStock(S,r,n){ S._in[r]+=n; if(r==='metal'&&S.stock.metal+n>K.RES){ var over=S.stock.metal+n-K.RES; S.stock.metal=K.RES; S.ark+=over } else S.stock[r]+=n }
function pushFx(S,o){ if(S.fx.length<80) S.fx.push(o) }
function stepShip(S,sh,dt){
  var L=lineOf(S,sh.line); if(!L) return;
  var lf=S.phase==='lift'?K.LIFT_V:1;
  if(sh.ghost){ sh.ghost.left-=CLS[sh.cls].v*S.speed*lf*dt; if(sh.ghost.left>0) return; sh.ghost=null; sh.fromS=sh.s }
  if(sh.wait>0){ sh.wait-=dt; if(sh.wait>0) return; dt=-sh.wait; sh.wait=0; if(sh.s<.01&&!sh.recall) depart(S,sh,L) }
  var ti=nextStop(S,L,sh),ts=L.stops[ti],d=ts-sh.s,ad=Math.abs(d),fromD=Math.abs(sh.s-sh.fromS);
  var f=clamp(Math.min(ad,fromD)/24,.24,1), mv=CLS[sh.cls].v*S.speed*lf*f*dt*(sh.recall?1.15:1);
  if(mv>=ad){ sh.s=ts; sh.fromS=ts; arrive(S,sh,L,ti) } else { sh.s+=d>0?mv:-mv; sh.dirv=d>0?1:-1 }
}
function arrive(S,sh,L,i){
  if(i===0){
    var n=sh.load.length; var p=posAt(L,0);
    sh.load.forEach(function(k){ if(k==='ppl'){ S.people+=1; S.stats.evac++ } else { addStock(S,k,1); S.stats.carried++ } pushFx(S,{k:'in',r:k,x:sh.x||p.x,y:sh.y||p.y}) });
    sh.load=[];
    if(sh.recall){ dockShip(S,sh); return }
    sh.dir=1; sh.wait=.3+n*.09; return;
  }
  var w=S.worlds[L.nodes[i]],got=0;
  if(i===L.nodes.length-1) sh.dir=-1;
  sh.dir=-1;
  while(canLoad(S,sh,w)){
    if(S.phase==='lift'){ w.pop-=1; sh.load.push('ppl'); if(w.pop<1) S.ev.push({k:'cleared',w:w.id}) }
    else { w.surf-=1; sh.load.push(w.type) }
    got++;
  }
  sh.wait=.3+got*(S.phase==='lift'?.12:.09);
}
function dockShip(S,sh){
  var c=CLS[sh.cls]; S.people+=c.crew; S.dock[sh.cls].built++;
  S.ships.splice(S.ships.indexOf(sh),1);
  var L=lineOf(S,sh.line); if(L&&L.removing&&!S.ships.some(function(x){ return x.line===L.id })) deleteLine(S,L);
  if(sh.next){ var nl=lineOf(S,sh.next); if(nl&&!nl.removing) A.deploy(sh.cls,sh.next) }
  else if(S.phase==='lift'){ var bl=bestLiftLine(S,sh.cls); if(bl) A.deploy(sh.cls,bl.id) }
  S.ev.push({k:'docked',cls:sh.cls});
}
function linePop(S,L){ return L.nodes.slice(1).reduce(function(a,id){ return a+Math.floor(S.worlds[id].pop) },0) }
function bestLiftLine(S,cls){ var left=K.T-S.t,best=null,bs=0,v=CLS[cls].v*S.speed*K.LIFT_V;
  S.lines.forEach(function(L){ if(L.removing||L.len*2/v+2>left) return; var cap=S.ships.filter(function(x){ return x.line===L.id&&!x.recall }).reduce(function(a,x){ return a+shipCap(S,x) },0),sc=linePop(S,L)/(cap+1); if(sc>bs){ bs=sc; best=L } });
  return best }

  if(n.length>0){ P=[{x:S.worlds[n[0]].x,y:S.worlds[n[0]].y}]; for(var i=0;i<n.length-1;i++) octi(S.worlds[n[i]],S.worlds[n[i+1]],P) }
  var last=S.worlds[n[n.length-1]],pw=toW(d.px,d.py),near=d.moved;
  polyStroke(P,1,lw+1,col,1);
  if(near){ var o=[{x:last.x,y:last.y}]; octi(last,pw,o); polyStroke(o,1,lw,col,.55); var e=toS(pw.x,pw.y); c.fillStyle=col; c.beginPath(); c.arc(e.x,e.y,lw+3,0,6.2832); c.fill() }
}
function drawDraftTag(d){
  var col=LCOL[d.color],n=d.nodes;
  /* подпись над пальцем: цена и рейс */
  var w=hitWorld({x:d.px,y:d.py},Math.max(26,RW()+12)),len=routeLen(S,n),txt='';
  var trip=Math.round(len*2/CLS.hauler.v/S.speed+1);
  if(n.length>=2) txt='рейс '+trip+' с';
  var cost=draftCost(d); if(cost) txt='−'+cost+' чел · '+txt;
  if(w&&!w.founded&&n.indexOf(w.id)>=0&&w.dep) txt=w.name+' · залежь '+w.dep+' · '+txt;
  if(S.phase==='lift'&&d.fore&&ui.fore) txt='домой '+ui.fore.souls+' → '+d.fore.souls;
  if(txt){ c.font='500 12px "Geist Mono"'; c.textAlign='center'; c.textBaseline='middle'; var tw=c.measureText(txt).width+16,tx=clamp(d.px,tw/2+4,W-tw/2-4),ty=d.py-(d.touch?64:34); if(ty<V.top+16) ty=d.py+(d.touch?56:34); c.fillStyle='#141417'; c.strokeStyle=col; c.lineWidth=1; c.fillRect(tx-tw/2,ty-12,tw,24); c.strokeRect(tx-tw/2,ty-12,tw,24); c.fillStyle='#F2F1EC'; c.fillText(txt,tx,ty+.5) }
}
function drawPull(d,lw){
  if(!d.moved) return; var L=lineOf(S,d.lineId); if(!L) return; var A0=S.worlds[L.nodes[d.seg]],B0=S.worlds[L.nodes[d.seg+1]],pw=toW(d.px,d.py),o=[{x:A0.x,y:A0.y}]; octi(A0,pw,o); octi(pw,B0,o); polyStroke(o,1,lw,LCOL[d.color],.7);
  var w=hitWorld({x:d.px,y:d.py},Math.max(22,RW()+10)); if(w){ var q=toS(w.x,w.y); c.strokeStyle='#F2F1EC'; c.lineWidth=1.5; c.beginPath(); c.arc(q.x,q.y,RW()+8,0,6.2832); c.stroke() }
}
function drawHint(now){
  var w=S.worlds.filter(function(w){ return w.id&&w.ring===0&&w.bornAt<=S.t&&w.type==='food' })[0]||S.worlds[1],A0=toS(0,0),B0=toS(w.x,w.y),u=(now%2200)/2200,e=clamp(u/.75,0,1),x=A0.x+(B0.x-A0.x)*e,y=A0.y+(B0.y-A0.y)*e;
  c.strokeStyle='#F2F1EC'; c.globalAlpha=.3; c.lineWidth=2; c.setLineDash([3,6]); c.beginPath(); c.moveTo(A0.x,A0.y); c.lineTo(B0.x,B0.y); c.stroke(); c.setLineDash([]);
  c.globalAlpha=u>.9?(1-u)*10:1; c.fillStyle='#F2F1EC'; c.beginPath(); c.arc(x,y,7,0,6.2832); c.fill(); c.globalAlpha=1;
  c.font='500 13px Jost'; c.fillStyle='#F2F1EC'; c.textAlign='center'; c.textBaseline='middle'; c.fillText('Тяните от Земли к миру',W/2,V.top+22);
}

/* ===================== СТАРТ И ДОСТУП ДЛЯ БОТОВ ===================== */
S=newState(LB.seed,aspectNow()); S.worlds.forEach(function(w){ if(w.bornAt<=0) w.seen=true });
buildDom();
ui.started=!!LB.q.get('auto');
domTick(true); resize(); V.s=fitScale(); V.cx=W/2; V.cy=V.top+(H-V.top-V.bot)/2;
requestAnimationFrame(frame);
window.GAME={
  K:K,CLS:CLS,RES:RES,
  get S(){ return S },
  reset:function(seed,opts){ return reset(seed,opts) },
  step:function(dt){ step(S,dt||.05) },
  run:function(sec,dt){ dt=dt||.05; for(var i=0,n=Math.round(sec/dt);i<n;i++){ step(S,dt); if(S.gift||S.phase==='over') break } S.ev=[]; S.fx=[] },
  act:A,
  seats:function(){ return seats(S) },
  forecast:function(fn){ return forecast(fn) },
  burn:function(r,t){ return burn(r,t==null?S.t:t) },
  net:function(r){ return netFlow(S,r) },
  timeLeft:function(r){ return timeLeft(S,r) },
  routeLen:function(n){ return routeLen(S,n) },
  freeLines:function(){ return freeLines(S) },
  posAt:posAt,
  pause:function(b){ ui.paused=!!b; dockKey='' },
  view:{ world:function(id){ var w=S.worlds[id],q=toS(w.x,w.y),r=stage.getBoundingClientRect(); return {x:q.x+r.left,y:q.y+r.top} }, ship:function(id){ var sh=S.ships.filter(function(x){ return x.id===id })[0]; if(!sh||sh.rx==null) return null; var q=toS(sh.rx,sh.ry),r=stage.getBoundingClientRect(); return {x:q.x+r.left,y:q.y+r.top} }, line:function(id,sf){ var L=lineOf(S,id),p=posAt(L,L.len*(sf==null?.5:sf)),q=toS(p.x,p.y),r=stage.getBoundingClientRect(); return {x:q.x+r.left,y:q.y+r.top} }, handle:function(id){ var h=handlePos(lineOf(S,id)),r=stage.getBoundingClientRect(); return {x:h.x+r.left,y:h.y+r.top} } }
};
