<script>
/* ===== ЯДРО: только правила, без DOM ===== */
var Core=(function(){
'use strict';
var K={PPL_LOAD:2,SPEED:65,FOOD_CAP:30,TURNS:30,RISE:23,BERTHS:6,EARTH_CAP:30,RANGE:[135,175,220],HOUSE_CAP:15,HOUSE_CAP2:24,GROW:3,GROW2:4,WIN:45,
  START:{food:14,metal:24,fuel:16,parts:4},START_PPL:30,SEATS0:30,SEAT_STEP:35,DEFICIT:3,
  SCRAP:{metal:8,fuel:4,seats:5},
  ARK:[{metal:8,fuel:2,parts:1},{metal:12,fuel:3,parts:2},{metal:16,fuel:4,parts:3},{metal:20,fuel:5,parts:4},{metal:24,fuel:6,parts:5}]};
var GOODS=['food','metal','fuel','parts'];
var GRU={food:'рационы',metal:'металл',fuel:'топливо',parts:'детали',ppl:'люди'};
var TYPES={
  farm:{ru:'ФЕРМА',ppl:1,fuel:1,base:4},
  mine:{ru:'ШАХТА',ppl:2,fuel:1,base:4,good:'metal'},
  well:{ru:'СКВАЖИНА',ppl:2,fuel:1,base:4,good:'fuel'},
  factory:{ru:'ЗАВОД',ppl:3,fuel:2,base:3,good:'parts'},
  house:{ru:'ЖИЛЬЁ',ppl:1,fuel:1},
  relay:{ru:'РЕТРАНСЛЯТОР',ppl:1,fuel:1},
  sleep:{ru:'СПЯЩИЕ',ppl:0,fuel:2},
  earth:{ru:'ЗЕМЛЯ',ppl:0,fuel:0}
};
var TECH={
  range:{ru:'ДВИГАТЕЛЬ',d:['длина линии 135 → 175','длина линии 175 → 220'],lv:[{parts:2,metal:3},{parts:6,metal:8}]},
  wide:{ru:'ШИРОКАЯ ЛИНИЯ',d:['линия везёт вдвое больше'],lv:[{parts:3,metal:4}]},
  berth:{ru:'ПРИЧАЛ',d:['причалов Земли 6 → 7','причалов Земли 7 → 8'],lv:[{parts:6,metal:10},{parts:10,metal:16}]},
  demo:{ru:'РАЗБОРКА',d:['снос вдвое дешевле'],lv:[{parts:2,metal:2}]},
  dense:{ru:'ПЛОТНОЕ ЖИЛЬЁ',d:['жильё: мест 15 → 24, рост 3 → 4'],lv:[{parts:3,metal:4}]}
};
function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y) }
function clone(G){ return JSON.parse(JSON.stringify(G)) }

/* --- карта: случайная, но честная --- */
function gen(seed){
  var r=LB.rng(seed), R=440, N=42, MIND=70, pts=null, tries=0;
  function connected(P,range){ var seen={0:1},st=[0],n=1; while(st.length){ var a=st.pop(); for(var i=0;i<P.length;i++) if(!seen[i]&&dist(P[a],P[i])<=range){ seen[i]=1; n++; st.push(i) } } return n }
  for(;tries<400;tries++){
    var P=[{x:0,y:0}], guard=0;
    /* честный старт: семь миров кольцом у Земли, короткие магистрали есть на всех картах */
    var a0=r()*Math.PI*2; for(var ri=0;ri<7;ri++){ var ang=a0+ri*Math.PI*2/7+(r()-.5)*.35, rd=98+r()*50, pr={x:Math.round(Math.cos(ang)*rd),y:Math.round(Math.sin(ang)*rd)}; var okr=true; for(var i0=1;i0<P.length;i0++) if(dist(pr,P[i0])<MIND) okr=false; if(okr) P.push(pr) }
    if(P.length<7) continue;
    while(P.length<N+1&&guard++<6000){ var a=r()*Math.PI*2, d=Math.sqrt(r())*R, p={x:Math.round(Math.cos(a)*d),y:Math.round(Math.sin(a)*d)};
      if(d<92) continue; var ok=true; for(var i=1;i<P.length;i++) if(dist(p,P[i])<MIND){ ok=false; break } if(ok) P.push(p) }
    if(P.length<N+1) continue;
    pts=P; if(connected(P,K.RANGE[1])===P.length&&connected(P,K.RANGE[0])>=18) break;
  }
  var order=pts.slice(1).sort(function(a,b){ return Math.hypot(a.x,a.y)-Math.hypot(b.x,b.y) });
  var nearBag=['farm','farm','farm','mine','mine','mine','well','well','factory','factory','house','house'];
  var farBag=['farm','farm','farm','farm','farm','farm','farm','farm','mine','mine','mine','mine','mine','mine','well','well','well','well','factory','factory','factory','house','house','house','house','relay','relay','sleep','sleep','sleep'];
  var best=null,bestS=-1,i2;
  for(var t=0;t<300;t++){
    var ty=r.shuffle(nearBag).concat(r.shuffle(farBag)).slice(0,order.length), s=0;
    for(i2=0;i2<order.length;i2++){ var o=order[i2], dd=Math.hypot(o.x,o.y);
      if((ty[i2]==='relay'&&dd<170)||(ty[i2]==='sleep'&&dd<240)){ s-=20 }
      if(ty[i2]==='mine'||ty[i2]==='well'||ty[i2]==='house'){ var fok=false; for(var j=0;j<order.length;j++) if(ty[j]==='farm'&&dist(o,order[j])<=K.RANGE[1]){ fok=true; break } if(fok) s+=2 }
      if(ty[i2]==='factory'){ var mk=false,fk=false; for(var j2=0;j2<order.length;j2++){ if(ty[j2]==='mine'&&dist(o,order[j2])<=K.RANGE[1]) mk=true; if(ty[j2]==='farm'&&dist(o,order[j2])<=K.RANGE[1]) fk=true } if(mk&&fk) s+=2 } }
    /* старт: ферма в досягаемости Земли, рядом с ней шахта и скважина */
    var nearFarm=[]; for(i2=0;i2<order.length;i2++) if(ty[i2]==='farm'&&Math.hypot(order[i2].x,order[i2].y)<=K.RANGE[0]) nearFarm.push(order[i2]);
    var mineOk=false,wellOk=false; nearFarm.forEach(function(f){ for(var q=0;q<order.length;q++){ if(dist(f,order[q])<=K.RANGE[0]){ if(ty[q]==='mine') mineOk=true; if(ty[q]==='well') wellOk=true } } });
    if(nearFarm.length>=2) s+=30; else if(nearFarm.length) s+=12; if(mineOk) s+=20; if(wellOk) s+=12;
    /* завод в первых кольцах: и ферма, и шахта на базовой длине; жильё рядом с фермой */
    var facOk=false,houseOk=false; for(i2=0;i2<order.length;i2++){ var oo=order[i2],rr=Math.hypot(oo.x,oo.y); if(rr>270) continue; var hf=false,hm=false; for(var q2=0;q2<order.length;q2++){ if(q2!==i2&&dist(oo,order[q2])<=K.RANGE[0]){ if(ty[q2]==='farm') hf=true; if(ty[q2]==='mine') hm=true } } if(ty[i2]==='factory'&&hf&&hm) facOk=true; if(ty[i2]==='house'&&hf) houseOk=true }
    if(facOk) s+=40; if(houseOk) s+=15;
    if(s>bestS){ bestS=s; best=ty }
  }
  var names=r.shuffle(LB.WORLDS), people=r.shuffle(LB.PEOPLE);
  var worlds=[{id:0,x:0,y:0,type:'earth',name:'ЗЕМЛЯ',awake:true,dead:false,people:0,q:0,lifted:false,base:0,deposit:0,deposit0:0}];
  order.forEach(function(o,i){ var d=Math.hypot(o.x,o.y), ty=best[i], w={id:i+1,x:o.x,y:o.y,type:ty,awake:false,dead:false,people:0,q:0,lifted:false,
      name:(i<names.length?names[i]:names[i-names.length]+' II').toUpperCase(),elder:people[i%people.length],base:TYPES[ty].base||0,deposit:0,deposit0:0,sleepers:0};
    if(ty==='mine'){ w.deposit=Math.round(30+d*0.1+r.int(0,8)); if(d>280) w.base=5 }
    if(ty==='well'){ w.deposit=Math.round(30+d*0.09+r.int(0,6)); if(d>280) w.base=5 }
    if(ty==='sleep'){ w.sleepers=r.int(12,18) }
    w.deposit0=w.deposit; worlds.push(w) });
  return worlds;
}
function newGame(seed){
  return {tr:{},seed:seed,turn:1,stock:Object.assign({},K.START),earth:K.START_PPL,worlds:gen(seed),lines:[],nextLine:1,tech:{range:0,wide:0,berth:0,demo:0,dense:0},ark:0,deficit:0,events:[],jam:{},lost:{metal:0},maxDeficit:0,over:null,history:[],deadCount:0};
}
function needFood(t){ return 2+Math.floor((t-1)/4) }
function needMetal(t){ return Math.floor((t-1)/5) }
function berths(G){ return K.BERTHS+G.tech.berth }
function usedBerths(G){ return G.lines.filter(function(l){ return l.a===0||l.b===0 }).length }
function seats(G){ return Math.max(0,K.SEATS0+K.SEAT_STEP*G.ark-K.SCRAP.seats*(G.scrap||0)) }
function swap(G,from){ var to=from==='metal'?'fuel':'metal'; if(G.stock[from]<6) return 'Не хватает: '+GRU[from]+' 6 (есть '+Math.floor(G.stock[from])+')'; G.stock[from]-=6; G.stock[to]+=3; return null }
function canScrap(G){ if(seats(G)<K.SCRAP.seats) return {ok:false,why:'Разбирать больше нечего'}; return {ok:true} }
function scrap(G){ var c=canScrap(G); if(!c.ok) return c.why; G.scrap=(G.scrap||0)+1; G.stock.metal+=K.SCRAP.metal; G.stock.fuel+=K.SCRAP.fuel; return null }
function capLen(len){ return len<=110?6:(len<=150?5:(len<=190?4:3)) }
function cap(l){ return capLen(l.len)*(l.wide?2:1) }
/* человек с пожитками занимает на линии два места груза */
function pplCap(l){ return Math.max(1,Math.floor(cap(l)/K.PPL_LOAD)) }
function usable(G,l){ if(l.dead) return false; var a=G.worlds[l.a],b=G.worlds[l.b]; return a.awake&&b.awake&&!a.dead&&!b.dead }
function adjacency(G){ var adj=G.worlds.map(function(){ return [] }); G.lines.forEach(function(l){ if(usable(G,l)){ adj[l.a].push({l:l,to:l.b}); adj[l.b].push({l:l,to:l.a}) } }); return adj }
function hops(G,adj){ adj=adj||adjacency(G); var d=G.worlds.map(function(){ return Infinity }); d[0]=0; var q=[0]; while(q.length){ var a=q.shift(); adj[a].forEach(function(e){ if(d[e.to]===Infinity){ d[e.to]=d[a]+1; q.push(e.to) } }) } return d }
/* мир связан с Землёй живыми линиями (или ему есть на чём сесть: сосед в сети) */
function inNet(G,id,dist){ dist=dist||hops(G); if(dist[id]<Infinity) return true; return G.lines.some(function(l){ return !l.dead&&((l.a===id&&dist[l.b]<Infinity)||(l.b===id&&dist[l.a]<Infinity)) }) }
function afford(G,c){ var miss=[]; GOODS.forEach(function(g){ if(c[g]&&G.stock[g]<c[g]) miss.push(GRU[g]+' '+c[g]+' (есть '+Math.floor(G.stock[g])+')') }); if(c.ppl&&G.earth<c.ppl) miss.push('людей '+c.ppl+' (на Земле '+G.earth+')'); return miss }
function pay(G,c){ GOODS.forEach(function(g){ if(c[g]) G.stock[g]-=c[g] }); if(c.ppl) G.earth-=c.ppl }
function lineCost(G,len){ return {metal:Math.round(1+len/45),fuel:Math.round(len/90),ppl:1} }
function range(G,a,b){ var r=K.RANGE[G.tech.range]; if(a===0||b===0||G.worlds[a].type==='relay'&&G.worlds[a].awake||G.worlds[b].type==='relay'&&G.worlds[b].awake) r=Math.round(r*1.4); return r }
function segCross(p1,p2,p3,p4){ function o(a,b,c){ return (b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x) } var d1=o(p3,p4,p1),d2=o(p3,p4,p2),d3=o(p1,p2,p3),d4=o(p1,p2,p4); return ((d1>0&&d2<0)||(d1<0&&d2>0))&&((d3>0&&d4<0)||(d3<0&&d4>0)) }
function segDist(p,a,b){ var dx=b.x-a.x,dy=b.y-a.y,t=((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy); t=Math.max(0,Math.min(1,t)); return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy) }
function findLine(G,a,b){ for(var i=0;i<G.lines.length;i++){ var l=G.lines[i]; if((l.a===a&&l.b===b)||(l.a===b&&l.b===a)) return l } return null }
function lineById(G,id){ for(var i=0;i<G.lines.length;i++) if(G.lines[i].id===id) return G.lines[i]; return null }
/* проверка линии: {ok, why, code, len, cost, blocker} */
function canLink(G,a,b){
  var A=G.worlds[a],B=G.worlds[b],res={ok:false,len:Math.round(dist(A,B))};
  res.cost=lineCost(G,res.len);
  if(a===b) { res.why='Один и тот же мир'; res.code='same'; return res }
  if(findLine(G,a,b)){ res.why='Линия уже есть'; res.code='dup'; return res }
  if(A.dead||B.dead){ res.why=(A.dead?A.name:B.name)+' мёртв: линию не принять'; res.code='dead'; return res }
  var R=range(G,a,b); res.range=R;
  if(res.len>R){ res.why='Длина '+res.len+', двигатель тянет '+R; res.code='range'; return res }
