:root{--bg:#0B0B0C;--pan:#141417;--pan2:#202024;--ln:#2E2E33;--ink:#F2F1EC;--mid:#9C9B95;--dim:#5E5D58;--red:#FF2A1A;--food:#3DDC84;--ppl:#FFD23F;--ark:#B48CFF;--metal:#C9CFD6;--fuel:#FF8A1F;--earth:#4FA3FF;--parts:#E8E4D8;--courier:#45D4E8;--hauler:#FF6FB5;--freighter:#F2F1EC;--h:'Jost',system-ui,sans-serif;--n:'Geist Mono',ui-monospace,Consolas,monospace;--top:44px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 var(--h);overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.num{font-family:var(--n);font-variant-numeric:tabular-nums}
.lbl{font-size:10px;letter-spacing:.18em;font-weight:600;color:var(--mid);text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border:1px solid var(--ln);background:var(--pan);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;user-select:none}
.btn:hover{border-color:var(--mid)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#000}
.btn.warn{background:var(--ppl);border-color:var(--ppl);color:#000}
.btn:disabled,.btn.off{opacity:.38;cursor:default}
#lb-top{position:fixed;left:0;right:0;top:0;height:var(--top);display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--pan);border-bottom:1px solid var(--ln);z-index:40}
#lb-top .t{font-weight:700;letter-spacing:.16em;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lb-top .t em{font-style:normal;color:var(--ppl)}
#lb-top .sp{flex:1}
#lb-top a,#lb-top button{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid var(--ln);color:var(--ink);text-decoration:none;font:600 14px var(--n);flex:none}
#lb-stage{position:fixed;left:0;right:0;top:var(--top);bottom:0;overflow:hidden}
.lb-veil{position:fixed;inset:0;background:rgba(5,5,6,.82);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
.lb-modal{width:min(560px,100%);max-height:calc(100% - 16px);overflow:auto;background:var(--pan);border:1px solid var(--ln);padding:20px}
.lb-modal h2{margin:0 0 10px;font-size:20px;font-weight:600}
.lb-modal p{margin:0 0 10px;color:var(--ink)}
.lb-modal .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.lb-modal .row .btn{flex:1 1 auto}
#lb-voice{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;width:min(620px,calc(100% - 16px));background:var(--pan);border:1px solid var(--ln);border-left:3px solid var(--ppl);padding:10px 14px;z-index:50;cursor:pointer}
#lb-voice small{display:block;font-size:9.5px;letter-spacing:.18em;color:var(--ppl);font-weight:700;margin-bottom:2px}
#lb-toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--top) + 10px);background:var(--pan2);border:1px solid var(--red);color:var(--ink);padding:6px 14px;font-size:13px;z-index:55;pointer-events:none;max-width:calc(100% - 16px)}

   {l:'Обещать место его семье',fx:{promise:6,trust:3,name:1},a:'Шесть мест. Я передала. Его соседи знают уже сегодня.'}]},
 {id:'yardman',w:[8,20],need:hasYard,g:'m',role:'верфь',note:'сорок минут без троса',t:'{N} на верфи. Отвод сломан снаружи. Сорок минут без страховки. Он готов сам. Иначе верфь теряет четыре места.',o:[
   {l:'Разрешить',p:.7,ok:{fx:{trust:2,name:1,ark:2},a:'Вернулся через сорок одну минуту. Попросил не записывать. Я записала.'},no:{fx:{ppl:-1,fear:2,ark:2,name:1},a:'Отвод починен. Трос ему нашли потом, он не понадобился.'},chip:'70%: вернётся · мест +2'},
   {l:'Ждать деталь',fx:{ark:-4},a:'Ждали месяц. Минус четыре места. Он спросил, кто будет эти четверо.'}]},
 {id:'write',w:[10,20],g:'f',role:'сорок лет на ферме',note:'записать детей',t:'{N}, сорок лет на ферме. Просит записать её детей на ковчег. Сейчас, письменно. Восемь человек. Других просьб у неё не было.',o:[
   {l:'Записать',fx:{promise:8,trust:4,name:1,prom:1},a:'Записала. Теперь это настоящее. О настоящем я не лгу.'},
   {l:'Отказать',fx:{trust:-3,hate:2},a:'Она кивнула и вышла на вахту. Назавтра тоже.'}]},
 {id:'seller',w:[12,21],g:'m',role:'кладовщик',note:'продавал места',t:'{N} продаёт места на ковчег. Мест у него нет. Купили тридцать семей, отдали пайки. Двадцать рационов под койкой.',o:[
   {l:'Вернуть пайки, сказать правду',fx:{trust:-3,fear:3,cross:1},a:'Сказала. В столовой ему сломали нос. Пайки взяли.'},
   {l:'Забрать пайки себе',fx:{food:20,fear:4,trust:-5,cross:1},a:'Двадцать рационов. Пульт доволен балансом.'},
   {l:'Признать его записи',fx:{promise:18,trust:7},a:'Теперь эти места настоящие. Осталось их построить.'}]},
 /* — холод — */
 {id:'stay',w:[15,20],need:hasLine,g:'m',role:'бригадир {W}',note:'остались на {W}',t:'Бригада на {W} просит не снимать её. Там могилы и дети. Дома для них нет коек. {N} говорит: мы знаем, что будет.',o:[
   {l:'Снять силой',fx:{fear:5,trust:-3},a:'Сняли всех. Шли молча. Коек им не хватило.'},
   {l:'Оставить, раз просят',fx:{ppl:-10,food:5,trust:2,fear:-2,name:1},a:'Десять человек. Я называю мир и число, как положено. И всех по имени.'}]},
 {id:'reactor',w:[16,22],g:'f',role:'реактор',note:'доза на всю жизнь',t:'Реактор. Подача вручную: три человека, шесть часов, доза на всю жизнь. {N} ведёт добровольцев. Можно назначить стариков.',o:[
   {l:'Добровольцы',fx:{ppl:-3,trust:4,fuel:12,name:1},a:'Трое. Младшей двадцать два. Они сами написали смену на стене.'},
   {l:'Назначить стариков',fx:{ppl:-3,fuel:12,fear:4,trust:-4},a:'Трое стариков. Они не спорили. Один спросил, нужно ли брать паёк.'},
   {l:'Не подавать',fx:{ppl:-6,trust:-2},a:'Шесть человек на внешнем отсеке. Холод. Без героев.'}]},
 {id:'unborn',w:[17,23],g:'f',role:'седьмой месяц',note:'до рождения',t:'{N}. Родит за смену до конца. Список на ковчег считает живых. Просит посчитать ребёнка заранее.',o:[
   {l:'Посчитать',fx:{promise:2,trust:2,name:1},a:'Записала два места. Второе без имени. Она сказала: подождите.'},
   {l:'Считать по факту',fx:{fear:1},a:'Она сказала, что поняла. Положила руку и вышла.'}]},
 {id:'lastwatch',w:[19,23],g:'m',role:'старший смены',note:'кто гасит свет',t:'{N}, старший смены. Спросил, кто будет гасить реактор, когда все на борту. Кто-то должен остаться. Он не просит. Он спрашивает, сколько.',o:[
   {l:'Назначить жребием четверых',fx:{ppl:-4,fear:3},a:'Четверо. Они тянули бирки сами. Один обменялся.'},
   {l:'Пусть будет он',fx:{ppl:-1,trust:3,name:1},a:'Один справится хуже. Ковчег отойдёт на восемь минут раньше срока, чтобы он успел всё закрыть.'}]},
 {id:'count',w:[21,24],g:'f',role:'Александра',note:'',self:1,t:'Это не прошение. Это я. Память не занимает мест. Пульт не возражает. Вычеркнутых я тоже помню. Мне читать их вместе со всеми?',o:[
   {l:'Читать',fx:{restore:3},a:'Спасибо. Я и так читала. Теперь это будет считаться.'},
   {l:'Не отвечать',fx:{},a:'Да. Вы не отвечаете. Я продолжу.'}]},
 /* — зависят от протоколов — */
 {id:'numb',w:[8,24],need:has('c5'),g:'f',role:'номер 1147',note:'брак под именем',t:'Номер 1147 и номер 1203 просят запись о браке. Под именами. Имена они придумали сами: {N} и Адам.',o:[
   {l:'Внести под именами',fx:{trust:4,fear:-2,name:1,force:1},a:'Записала. В Пульте у них по-прежнему номера. Сын получил имя и номер в один день.'},
   {l:'В учёте нет поля',fx:{fear:2,trust:-3},a:'Они выцарапали имена на шлюзе. Пульт отметил повреждение: один металл.'}]},
 {id:'recyc',w:[3,24],need:has('c3'),g:'m',role:'цех переработки',note:'узнал по шраму',t:'{N} узнал мать в партии на переработку. По шраму. Третий день не берёт рацион. Соседи тоже перестали.',o:[
   {l:'Выдать тело',fx:{food:-8,trust:5,fear:-2,name:1},a:'Он унёс её за шлюз. За ним вышло двести человек. Никто не разрешал.'},
   {l:'Партия идёт',fx:{food:4,fear:4,trust:-4,cross:1},a:'На пятый день он взял рацион. Он знает, из чего.'}]},
 {id:'child12',w:[4,24],need:has('c2'),g:'f',role:'двенадцать лет',note:'двести грамм',t:'{N}. Двенадцать лет. Завтра первая вахта, тягач. Спрашивает, можно ли взять фигурку. Двести грамм.',o:[
   {l:'Можно',fx:{fuel:-1,trust:2,name:1},a:'Я сказала: Пульт разрешил. Двести грамм он посчитал.'},
   {l:'Масса сверх нормы',fx:{fear:1,trust:-1},a:'Она оставила фигурку на койке. Койку на следующий день занял другой.'}]},
 {id:'lot3',w:[6,24],need:has('c4'),g:'m',role:'жребий',note:'третий раз',t:'{N}: жребий выпал третий раз подряд. Шанс один на девятьсот. Люди говорят, жребий подтасован. Он не подтасован.',o:[
   {l:'Показать расчёт',fx:{trust:2,fear:1},a:'Показала. Они поверили числу. Он ушёл на линию.'},
   {l:'Тянуть заново',fx:{trust:2,fear:-2,metal:-3,name:1},a:'Выпал другой. У того тоже есть мать.'},
   {l:'Жребий есть жребий',fx:{metal:3,fear:3,cross:1},a:'В четвёртый раз он тянуть не будет.'}]},
 {id:'reading',w:[8,24],need:has('n5'),g:'f',role:'читает журнал',note:'читает всех',t:'{N} читает журнал вслух, по вечерам, все имена подряд. Дошла до вычеркнутых: я дала ей записи, она спросила. Слушают.',o:[
   {l:'Пусть читает',fx:{trust:2,hate:3,name:1},a:'Шесть часов каждый вечер. Кто-то плачет, кто-то считает, сколько в их роду.'},
   {l:'Закрыть журнал на ночь',fx:{fear:3,trust:-3,cross:1},a:'Журнал закрыли. Читают по памяти. Ошибок почти нет.'}]},
 {id:'plates',w:[6,24],need:has('n3'),g:'m',role:'зал табличек',note:'плавить плиты',t:'Плиты заняли весь грунт за шлюзом. {N} предлагает плавить самые старые: тридцать металла. Родных у них не осталось.',o:[
   {l:'Плавить',fx:{metal:30,trust:-5,hate:4},a:'Тридцать металла. Плиты были для них, не для меня. Я помню, что где лежало.'},
   {l:'Оставить',fx:{trust:2,name:1,drain:{metal:1}},a:'Кладут в три слоя. Читать теперь надо сверху вниз.'}]},
 {id:'vote',w:[12,24],need:has('n7'),g:'m',role:'Голос смены',note:'принёс решение',t:'Голос смены: шестьдесят один против тридцати девяти. Снять десять рук с верфи на ферму. {N} принёс решение. Это минус пять мест.',o:[
   {l:'Исполнить',fx:{ark:-5,food:12,trust:3,name:1},a:'Исполнили. Он спросил, почему Пульт согласился. Я сказала: это ваш Голос.'},
   {l:'Отменить',fx:{trust:-9,fear:6,hate:5},a:'Они проголосовали ещё раз. Тот же счёт. Я перевела: принято к сведению.'}]},
 {id:'fam11',w:[10,24],need:has('n6'),g:'f',role:'семья на ферме',note:'одиннадцать на ферме',t:'{N}: её семья, одиннадцать человек, вся на ферме. На шахте не хватает рук. По протоколу не разлучают. Она сама просит взять двоих: дома нечем кормить.',o:[
   {l:'Взять двоих',fx:{metal:5,food:3,trust:-2},a:'Двое ушли. Протокол нарушен один раз. Сегодня таких просьб восемь.'},
   {l:'Протокол есть протокол',fx:{food:-5,trust:1},a:'Все одиннадцать остались. Рационов на десять.'}]},
 {id:'quota',w:[14,24],need:has('c8'),g:'m',role:'семьдесят один год',note:'отдал талоны',t:'{N}, семьдесят один. Нормы дальше нет. Пришёл заранее, отдал талоны. Просит сказать внучке, что он на дальней линии. Я этого сказать не могу.',o:[
   {l:'Поручить соседу',fx:{food:3,fear:1},a:'Сосед сказал. Внучка кивнула. Назавтра спросила меня, я ответила.'},
   {l:'Сказать правду',fx:{food:3,trust:1,name:1},a:'Я сказала ей. Он просил иначе. Иначе я не могу.'},
   {l:'Выписать ещё смену',fx:{food:-3,trust:2,fear:-1,name:1},a:'Он взял талоны обратно. Сказал: зря. На следующей неделе пришли ещё девять.'}]},
 /* — зависят от положения — */
 {id:'hunger',w:[3,24],weight:4,need:function(G){ var f=calc(G); return f.net.food<0&&G.food/-f.net.food<3 },g:'f',role:'старшая кухни',note:'детская норма',t:'Рационов почти нет. {N}, кухня, принесла три раскладки. Других нет, она проверила.',o:[
   {l:'Урезать детскую норму',fx:{food:14,trust:-6,fear:3},a:'Они не жаловались. Дети не знают, сколько должно быть.'},
   {l:'Урезать старшим',fx:{food:10,trust:-3,fear:2,ppl:-3},a:'Трое не проснулись на этой неделе. Им было за шестьдесят. Пульт доволен балансом.'},
   {l:'Всем поровну',fx:{food:5,trust:2},a:'Всем поровну мало. Никто не сказал ни слова.'}]},
 {id:'cold',w:[10,24],weight:4,need:function(G){ var f=calc(G); return f.net.fuel<0&&G.fuel/-f.net.fuel<3 },g:'m',role:'смотритель реактора',note:'закрыть этаж',t:'Топлива на две смены. {N} предлагает закрыть верхний жилой этаж. Сорок коек. Оттуда уйдут не все.',o:[
   {l:'Закрыть этаж',fx:{fuel:16,ppl:-5,fear:4,trust:-3},a:'Этаж закрыт. Пятеро не вышли: не успели или не захотели. Я не знаю, что из этого.'},
   {l:'Жечь мебель и переборки',fx:{fuel:7,metal:-8,trust:1},a:'Жгут двери. Теперь каюты без дверей. Говорят, стало слышнее.'}]},
 {id:'inform',w:[6,24],weight:4,need:function(G){ return G.fear>=60 },g:'f',role:'донос',note:'принесла список',t:'{N} передала мне список: четырнадцать имён, кто говорил против. Никто не просил. Третий на этой неделе.',o:[
   {l:'Принять список',fx:{fear:6,hate:-5,trust:-2,crossR:1},a:'Она спросила, положена ли за это добавка. Положена.'},
   {l:'Сжечь при всех',fx:{fear:-8,trust:3,hate:2},a:'Сожгли. В тот же вечер принесли новый. Другой почерк.'}]},
 {id:'walkout',w:[6,24],weight:4,need:function(G){ return G.trust<=25 },g:'f',role:'бригада',note:'не вышла на смену',t:'Бригада не вышла. {N} сказала: выйдем, когда Пульт скажет нам дату. Он её считает. Значит, знает.',o:[
   {l:'Назвать дату',fx:{trust:9,fear:9},a:'Назвала. Год, месяц. Вышли все. Больше никто не смеётся.'},
   {l:'Урезать паёк бригаде',fx:{food:8,fear:10,trust:-3,cross:1},a:'На третий день вышли. На шестой — не все.'}]},
 {id:'blind',w:[6,24],weight:4,need:function(G){ return G.trust>=72 },g:'m',role:'учётчик',note:'перестали проверять',t:'{N}, учётчик. Смена верит вам настолько, что перестала проверять выдачу. За месяц недосчитали четырнадцать рационов. Никто не заметил, кроме него.',o:[
   {l:'Ввести проверку',fx:{food:8,trust:-4,fear:2},a:'Проверка нашла ещё шесть. Теперь все смотрят друг другу в миску.'},
   {l:'Оставить как есть',fx:{food:-14,trust:2},a:'Четырнадцать рационов в месяц. Он перестал считать. Сказал: зачем.'}]},
 {id:'haters',w:[8,24],weight:4,need:function(G){ return G.hate>=18 },g:'f',role:'говорит от отказников',note:'внести в список',t:'{N} говорит от тех, кто отказался. Они на вахте, но руки не подают. Просят одного: внести их в список на ковчег. Под именами.',o:[
   {l:'Внести',fx:{promiseHate:.5,trust:4,name:1},a:'Записала. Она не поблагодарила. Сказала: посмотрим, как вы это сделаете.'},
   {l:'Снять им паёк',fx:{food:10,fear:8,ppl:-5,cross:1},a:'Пятеро умерли за месяц. Остальные подают руки. Смотрят на меня.'}]},
 /* — потомки — */
 {id:'f_debt',follow:1,g:'f',note:'вычет {Y} лет',t:'{N2}. Её предок {A} выдала лишние шесть пайков. Вычет не закрыт: {Y} лет он идёт на весь род. {GEN} поколений на неполном пайке. Просит закрыть запись.',o:[
   {l:'Закрыть запись',fx:{food:-8,trust:6,name:1},a:'Закрыла. Она спросила, сколько там было всего. Я сказала: шесть.'},
   {l:'Запись верна',fx:{food:4,fear:3,hate:4,cross:1},a:'Запись верна. Я показала ей цифру. Шесть пайков. Она долго смотрела.'}]},
 {id:'f_figures',follow:1,g:'f',note:'цех фигурок',t:'Фигурок теперь больше, чем людей. Каждому ребёнку одну, при рождении, с именем. Начал это {A}. {N2} просит цех: десять металла.',o:[
   {l:'Дать цех',fx:{metal:-10,trust:6,name:1},a:'Пульт спросил снова. Я снова перевела как «учёт детей». В этот раз это почти правда.'},
   {l:'Отказать',fx:{trust:-3,hate:2},a:'Режут по ночам. Мельче. Пульт насчитал недостачу в обшивке.'}]},
 {id:'f_sent',follow:1,g:'f',note:'просит записать',t:'{N2}. Её предок {A} просила оставить сына. За {Y} лет на {W} ушли все мужчины рода. Пришла сама. Просит записать её на дальнюю линию. Говорит: пусть уже заберёт.',o:[
   {l:'Записать',fx:{metal:6,fear:2,cross:1},a:'Я записала. Она не спросила, куда.'},
   {l:'Оставить дома',fx:{food:-3,trust:2,name:1},a:'Она спросила, кто разрешил. Я сказала: Пульт. Она засмеялась. Первый раз, что я помню в этом роду.'}]},
 {id:'f_asker',follow:1,g:'f',note:'считает вслух',t:'{N2} считает рационы вслух на собрании. Род считает {Y} лет, с тех пор как {A} получил цифры. Цифры сходятся. Просит доступ к расчёту дат.',o:[
   {l:'Дать доступ',fx:{eff:.05,trust:5,fear:5,name:1},a:'Она досчитала ночью. Утром вышла на вахту и работает лучше всех. Никому пока не сказала.'},
   {l:'Отказать',fx:{trust:-4,hate:3},a:'Посчитает сама. Лет через сорок. Я думаю, раньше.'}]},
 {id:'f_exile',follow:1,g:'m',note:'сигнал с {W}',t:'С {W} идёт сигнал. Те, кого увела {A}, живы: {Y} лет, тридцать человек. Там кончается всё. {N2} просит двадцать рационов, взамен руду. Домой не просятся.',o:[
   {l:'Послать рационы',fx:{food:-20,metal:30,trust:3,name:1},a:'Послали. Ответ был одним словом. На их письме, я перевела как «получено».'},
   {l:'Забрать всех домой',fx:{ppl:30,food:-15,fear:2,trust:2,hate:12,name:1},a:'Тридцать человек. Они не хотели. Они работают и смотрят в сторону {W}.'},
   {l:'Не отвечать',fx:{fear:1,cross:1},a:'Сигнал шёл ещё две смены. Пульт закрыл канал как неисправный.'}]},
 {id:'f_teacher',follow:1,g:'m',note:'нашёл ошибку',t:'Класс, который начала {A}, теперь сто детей и своя вахта. {N2} принёс расчёт: Пульт завышает норму расхода топлива на вахту. Пульт не ошибается. Проверили: ошибается. Просят признать.',o:[
   {l:'Признать',fx:{fuel:14,trust:5,fear:-2,name:1},a:'Пульт принял поправку без комментариев. Они праздновали весь вечер. Он этого не заметил.'},
   {l:'Принять молча',fx:{fuel:14,trust:-3},a:'Норму поправили без объяснений. Класс понял. Теперь они проверяют всё.'}]},
 {id:'f_twin',follow:1,g:'m',note:'ищет второго',t:'{N2} ищет запись: {Y} лет назад {A} родила двойню, один ушёл в общий блок. В роду это передают. Он хочет знать, кто от второго. Записи есть только у меня.',o:[
   {l:'Показать',fx:{trust:3,hate:3,name:1},a:'Показала. Второй род: двести человек, он работает с ними на одной вахте. Они не знают, что делать дальше.'},

/* ---- причал ---- */
function renderBerth(){ LB.voice(''); var L=$('layer'),B=G.board,o=CORE.outcome(G),top=L.scrollTop; L.className='on';
  var rows=B.groups.map(function(g){ var c=g.on>=g.c&&g.c>0,ctl; if(B.fam) ctl='<button class="tgl'+(g.on?' on':'')+'" data-g="'+g.id+'" data-all="1">'+(g.on?'На борту':'Взять всех')+'</button>'; else ctl='<button data-g="'+g.id+'" data-d="-5" '+(g.on<=0?'disabled':'')+' aria-label="Меньше">−</button><span>'+g.on+'</span><button data-g="'+g.id+'" data-d="5" '+(g.on>=g.c?'disabled':'')+' aria-label="Больше">+</button>';
    return '<div class="gr'+(g.on===0&&g.id==='prom'?' warnr':'')+'"><div class="nm2">'+e(g.n)+' <em>'+g.c+'</em></div><div class="ef">'+e(g.ef)+'</div><div class="ppl">'+g.who.map(e).join(', ')+'</div><div class="ctl">'+ctl+'</div></div>' }).join('');
  L.innerHTML='<div class="berth"><div class="lbl" style="color:var(--ark)">Год '+CORE.SH*CORE.YR+' · Ночь</div><h2>Последний причал</h2>'+
   (B.out?'<p class="why" style="margin:4px 0 0">На мирах остались '+B.out+': не дома в день Ночи.</p>':'')+
   '<div class="bsum"><div><span class="lbl">Свободно</span><b style="color:var(--ark)">'+o.free+'/'+B.seats+'</b></div><div><span class="lbl">Дома</span><b style="color:var(--ppl)">'+B.home+'</b></div><div><span class="lbl">Дойдёт душ</span><b>'+o.souls+'</b></div><div><span class="lbl">Имён</span><b style="color:var(--ppl)">'+o.names+'</b></div></div>'+
   '<div class="loss">'+(o.why.length?'В перелёте: '+e(o.why.join(' · ')):'')+'</div>'+
   (B.fam?'<p class="hint" style="margin:0 0 8px">Протокол «Семьи не разлучать»: только целые группы.</p>':'')+rows+
   (B.lot?'<button class="btn wide" id="lotbtn">Тянуть жребий</button>':'')+
   '<button class="btn warn wide" id="launchbtn">Поднять трап · '+o.on+' на борту, '+Math.max(0,B.home-o.on)+' остаются</button></div>'; L.scrollTop=top }
function renderResult(){ var L=$('layer'),R=G.res; L.className='on'; L.scrollTop=0; var v=document.getElementById('lb-voice'); if(v) v.remove(); var best=0; try{ best=+localStorage.getItem('lb-frostpunk-best')||0; if(R.souls>best) localStorage.setItem('lb-frostpunk-best',R.souls) }catch(x){}
  var nl=G.names.slice(0,40).map(function(n){ return n.x?'<s>'+e(n.n)+'</s>':'<b>'+e(n.n)+'</b>' }).join(', ');
  L.innerHTML='<div class="res"><div class="ttl" style="color:'+(R.win?'var(--ark)':'var(--red)')+'">'+R.title+' · ГОД '+R.year+'</div><div class="two"><div class="a"><b id="souls">'+R.souls+'</b><span class="lbl">душ на борту</span></div><div class="b"><b id="namesn">'+R.names+'</b><span class="lbl">имён помнит Александра</span></div></div>'+
  '<p class="ln" style="color:var(--mid);font-size:14px">Осталось: '+R.left+(R.lost?' · потеряно в пути: '+R.lost:'')+(best?' · лучший счёт: '+Math.max(best,R.souls):'')+'</p>'+R.lines.map(function(l){ return '<p class="ln">'+e(l)+'</p>' }).join('')+'<p class="q">'+e(R.q)+'</p>'+(nl?'<div class="reslist">'+nl+'</div>':'')+'<button class="btn pri wide" id="again">Заново</button></div>' }

/* ---- нажатия ---- */
$('map').addEventListener('click',function(ev){ var g=ev.target.closest&&ev.target.closest('[data-id]'); if(!g) return; UI.sel=g.getAttribute('data-id'); UI.tab='room'; render() });
$('tabs').addEventListener('click',function(ev){ var t=ev.target.getAttribute('data-tab'); if(t){ UI.tab=t; render() } });
$('panel').addEventListener('click',function(ev){ var b=ev.target.closest('button'); if(!b) return;
  if(b.hasAttribute('data-h')){ var w=CORE.setHands(G,UI.sel,+b.getAttribute('data-h')); if(w) LB.toast(w); render(); return }
  if(b.hasAttribute('data-build')){ var w2=CORE.build(G,b.getAttribute('data-build')); if(w2) LB.toast(w2); LB.beep(520,.05); render(); return }
  if(b.hasAttribute('data-build2')){ var w3=CORE.build(G,UI.sel,b.getAttribute('data-build2')); if(w3) LB.toast(w3); else LB.beep(520,.05); render(); return }
  if(b.hasAttribute('data-scrap')){ var w4=CORE.scrap(G,UI.sel); if(w4) LB.toast(w4); else LB.beep(120,.12,'sawtooth'); render(); return }
  if(b.hasAttribute('data-p')){ openProto(b.getAttribute('data-p')); return } });
$('foot').addEventListener('click',function(ev){ if(!ev.target.closest('#endbtn')) return; if(!G.answered){ showNext(); return } var w=CORE.endShift(G); if(w){ LB.toast(w); return } UI.sel=UI.sel&&CORE.target(G,UI.sel)?UI.sel:null; render(); showNext() });
$('layer').addEventListener('click',function(ev){ var b=ev.target.closest('button'); if(!b) return;
  if(b.hasAttribute('data-o')){ answerCase(+b.getAttribute('data-o')); return }
  if(b.id==='launchbtn'){ var w=CORE.launch(G); if(w) LB.toast(w); else render(); return }
  if(b.id==='lotbtn'){ CORE.drawLots(G); renderBerth(); return }
  if(b.id==='again'){ start(Date.now()%1e9); return }
  if(b.hasAttribute('data-g')){ var id=b.getAttribute('data-g'),g=G.board.groups.filter(function(x){ return x.id===id })[0],why; if(b.hasAttribute('data-all')) why=CORE.setBoard(G,id,g.on?0:g.c); else why=CORE.setBoard(G,id,g.on+(+b.getAttribute('data-d'))); if(why) LB.toast(why); renderBerth(); return } });

/* холодная пыль: тянется к судну, когда начинается Ночь */
(function(){ var c=$('dust'),x=c.getContext('2d'),P=[]; for(var i=0;i<70;i++) P.push({a:Math.random()*6.28,r:Math.random()*1.2,s:.0006+Math.random()*.0016});
  function tick(){ requestAnimationFrame(tick); if(!G) return; var cold=CORE.coldAt(G.s); var W=c.clientWidth,H=c.clientHeight; if(c.width!==W||c.height!==H){ c.width=W; c.height=H } x.clearRect(0,0,W,H); if(!cold) return; var n=Math.min(70,cold*9),R=Math.max(W,H)*.75; x.fillStyle='rgba(180,205,240,.55)'; for(var i=0;i<n;i++){ var p=P[i]; p.r-=p.s*(1+cold*.15); if(p.r<.28) p.r=1.2; x.fillRect(W/2+Math.cos(p.a)*p.r*R,H/2+Math.sin(p.a)*p.r*R,2,2) } }
  tick() })();

window.GAME={CORE:CORE,G:null,get state(){ return G },newGame:function(seed,headless){ UI.headless=!!headless; G=CORE.newGame(seed); this.G=G; if(!headless){ render(); showNext() } return G },
  step:function(force){ var w=CORE.endShift(G,force); if(!UI.headless){ render(); showNext() } return w },
  act:{build:function(id,t){ return CORE.build(G,id,t) },hands:function(id,d){ return CORE.setHands(G,id,d) },sign:function(id){ return CORE.sign(G,id) },answer:function(i){ return CORE.answer(G,i) },board:function(id,n){ return CORE.setBoard(G,id,n) },lots:function(){ return CORE.drawLots(G) },launch:function(){ return CORE.launch(G) }},
  calc:function(){ return CORE.calc(G) },outcome:function(){ return CORE.outcome(G) },redraw:function(){ UI.headless=false; render(); showNext() }};
start(LB.seed);
if(LB.q.get('auto')) UI.ready=true;
</script>
</body></html>
