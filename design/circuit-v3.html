<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HELM — контур (прототип)</title>
<!-- Прототип мини-игры «контур Пульта», v3 (31.10.2026, по слову Никиты: стиль игры, не слишком по-настоящему, механизмы не земные).
     Черновик вне игры: work/, лист текстов и Notion не тронуты. Пока контур открыт, игра на паузе.
     Правила те же, что в circuit-v2 (петля, разрыв, ограничение, одна сторона, запас, пробой), вид и слова другие:
     вместо деталей — механизмы Пульта, плоские фигуры в цветах игры. Сторона читается одинаково у всех:
     закрашенный порт смотрит к выходу истока, полый — к возврату. ?lv=1..7 — урок. Прогресс — в localStorage (только удобство). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0B0C;--pan:#141417;--pan2:#202024;--ln:#2E2E33;--ink:#F2F1EC;--mid:#9C9B95;--dim:#5E5D58;--red:#FF2A1A;--food:#3DDC84;--ppl:#FFD23F;--ark:#B48CFF;--metal:#C9CFD6;--fuel:#FF8A1F;--earth:#4FA3FF;--h:'Jost',system-ui,sans-serif;--n:'Geist Mono',ui-monospace,Consolas,monospace}
html,body{margin:0;height:100%;background:#050506;color:var(--ink);font-family:var(--n);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.bar{position:fixed;left:0;right:0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 10px;padding:12px 16px;font-size:12px;letter-spacing:.06em;pointer-events:none;box-sizing:border-box}
.top{top:0}.bot{bottom:0;padding-bottom:max(12px,env(safe-area-inset-bottom))}
.bar .ttl{font-family:var(--h);font-weight:700;letter-spacing:.22em;font-size:13px}
.bar .m{color:var(--dim)}
#goals{position:fixed;left:0;right:0;top:38px;padding:0 16px;font-size:12px;line-height:1.65;letter-spacing:.03em;pointer-events:none}
#goals .ok{color:var(--food)}#goals .no{color:var(--mid)}
#status{position:fixed;left:16px;right:16px;text-align:center;font-size:12px;letter-spacing:.03em;pointer-events:none;min-height:1.4em}
#status.bad{color:var(--red)}#status.hint{color:var(--ppl)}
.ctl{pointer-events:auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ctl button{background:none;border:1px solid var(--ln);color:var(--mid);font:inherit;font-size:12px;min-width:32px;height:32px;padding:0 8px;cursor:pointer}
.ctl button:hover{border-color:var(--dim);color:var(--ink)}
.ctl button.on{border-color:var(--ppl);color:var(--ppl)}
.ctl button.done{color:var(--food)}
.ctl button.on.done{color:var(--ppl)}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(11,11,12,.94);text-align:center;padding:24px 16px;box-sizing:border-box;overflow:auto}
.ov.hide{display:none}
h1{font-family:var(--h);font-weight:700;letter-spacing:.22em;color:var(--ink);font-size:19px;margin:0;line-height:1.35}
.sub{color:var(--mid);font-size:13px}
.cards{display:flex;flex-direction:column;gap:8px;max-width:520px;width:100%}
.card{display:flex;gap:12px;align-items:center;text-align:left;background:var(--pan);border:1px solid var(--ln);padding:8px 10px}
.card canvas{flex:none;width:112px;height:56px}
.card b{font-family:var(--h);font-weight:600;letter-spacing:.16em;font-size:13px;display:block}
.card .mk{color:var(--ppl);font-size:11px;margin:2px 0}
.card .ds{color:var(--mid);font-size:12px;line-height:1.45}
.how{color:var(--mid);font-size:11px;max-width:520px;line-height:1.6}
.go{background:none;border:1px solid var(--ink);color:var(--ink);font-family:var(--h);font-weight:600;font-size:14px;letter-spacing:.22em;padding:11px 30px;cursor:pointer;margin-top:4px}
.go:hover{background:var(--ink);color:var(--bg)}
.lore{max-width:380px;width:100%;text-align:left;font-size:13px;line-height:1.65;min-height:8em;white-space:pre-wrap}
.lore .y{color:var(--ppl)}.lore .m{color:var(--mid)}.lore .g{color:var(--food)}
#tip{position:fixed;max-width:260px;background:var(--pan);border:1px solid var(--ln);padding:6px 9px;font-size:11px;line-height:1.45;color:var(--mid);pointer-events:none;display:none;z-index:3}
#tip b{color:var(--ink);font-family:var(--h);font-weight:600;letter-spacing:.14em}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="bar top">
  <span><span class="ttl" id="hno"></span> <span class="m">· <span data-k="paused"></span></span></span>
</div>
<div id="goals"></div>
<div id="status"></div>
<div class="bar bot">
  <span class="ctl"><button id="reset" data-k="reset"></button></span>
  <span class="ctl" id="lvls"></span>
  <span class="ctl"><button id="lang">EN</button></span>
</div>
<div id="tip"></div>

<div class="ov" id="ovIntro">
  <h1 id="iTitle"></h1>
  <div class="sub" id="iGoal"></div>
  <div class="cards" id="iCards"></div>
  <div class="how" data-k="how"></div>
  <button class="go" id="bGo" data-k="go"></button>
</div>
<div class="ov hide" id="ovDone">
  <div class="lore" id="lore"></div>
  <button class="go" id="bNext" style="visibility:hidden"></button>
</div>

<script>
(function(){
'use strict';
// Тексты прототипа. В игре они уйдут в лист (texts-add); здесь — только чтобы смотреть.
var T={
 ru:{paused:'игра на паузе',reset:'СБРОС',go:'ВОЙТИ',next:'ДАЛЬШЕ',back:'К ПУЛЬТУ',
  how:'Тяни от порта — жила. Тап по жиле — убрать. Тап по затвору — вкл/выкл. ◉ — работает, ○ — нет.',
  title:'КОНТУР {n} · {s}',done:'КОНТУР ЗАМКНУТ',learned:'Записано:',
  on:'вкл',allOff:'всё выкл',off:'выкл',longOff:'{s} выкл давно',justOff:'{s} только что выкл',
  fromPad:'веди от порта или от жилы',body:'сквозь механизм жилу не провести',
  short:'ПРОБОЙ: поток идёт мимо потребителей. Всё погасло.',
  burnt:'{s} СГОРЕЛА: на её пути нужен гаситель. СБРОС — новая.',
  burst:'{s} ЛОПНУЛ: выход и возврат перепутаны. СБРОС — новый.',
  rev:'{s}: против потока. Закрашенный порт — к выходу истока.',
  names:['ПЕТЛЯ','ЗАТВОР','ИСКРА','ВЕТВИ','КЛАПАН','ЗАПАС','ПУЛЬТ'],
  goal:['Зажги маяк.','Маяк должен слушаться затвора.','Зажги искру и не сожги её.','У каждого затвора — свой маяк.','Затвор I зажигает оба маяка, затвор II — только второй.','Затвор выключен — маяк ещё горит.','Разбуди команду и не дай ей забыть.'],
  learn:['Поток идёт по кругу: из истока через потребителя обратно. Разрыв где угодно — всё гаснет.',
         'Затвор — разрыв, которым можно управлять.',
         'Искра горит только по потоку и без гасителя сгорает.',
         'У каждой ветви свой путь от выхода до возврата. Ветви друг другу не мешают.',
         'Клапан пускает поток в одну сторону и никогда обратно.',
         'Запас копит поток и держит потребителя, когда исток отрезан.',
         'Так Пульт не теряет память, когда пропадает поток.'],
  lore:['КОМАНДА ПРОСНУЛАСЬ: ПУЛЬТ.ПАМЯТЬ','Восстановлено: 1 блок памяти.','','[заглушка: запись блока, до двух строк — пишет Никита]'],
  part:{bat:['ИСТОК','закрашенный порт — выход, полый — возврат','Поток выходит из закрашенного порта и должен вернуться в полый.'],
        lamp:['МАЯК','порты равны','Горит, пока через него идёт поток. Сторона ему не важна.'],
        sw:['ЗАТВОР','планка легла — вкл, поднята — выкл','Разрывает контур. Тап — переключить.'],
        res:['ГАСИТЕЛЬ','сжатая фигура, порты равны','Сдерживает поток. Ставится на пути искры.'],
        led:['ИСКРА','треугольник смотрит по потоку','Горит только по потоку. Без гасителя на пути сгорает.'],
        dio:['КЛАПАН','шевроны смотрят по потоку','Пускает поток только в одну сторону.'],
        cap:['ЗАПАС','закрашенный порт — к выходу истока','Копит поток и отдаёт, когда исток отрезан. Насквозь не пускает. Наоборот — лопнет.'],
        cmd:['КОМАНДА','закрашенный порт — к выходу истока','Просыпается только при верной стороне.']}},
 en:{paused:'game paused',reset:'RESET',go:'ENTER',next:'NEXT',back:'BACK TO HELM',
  how:'Drag from a port — a line. Tap a line — remove. Tap a gate — on/off. ◉ — running, ○ — not.',
  title:'CIRCUIT {n} · {s}',done:'CIRCUIT CLOSED',learned:'Recorded:',
  on:'on',allOff:'all off',off:'off',longOff:'{s} off long ago',justOff:'{s} just switched off',
  fromPad:'start from a port or a line',body:'a line cannot pass through a mechanism',
  short:'BREACH: the flow runs past the consumers. All dark.',
  burnt:'{s} BURNT OUT: its path needs a damper. RESET — a new one.',
  burst:'{s} BURST: outlet and return swapped. RESET — a new one.',
  rev:'{s}: against the flow. Filled port — toward the source outlet.',
  names:['LOOP','GATE','SPARK','BRANCHES','VALVE','RESERVE','HELM'],
  goal:['Light the beacon.','The beacon must obey the gate.','Light the spark without burning it.','Each gate gets its own beacon.','Gate I lights both beacons, gate II only the second.','Gate off — the beacon still lit.','Wake the command and do not let it forget.'],
  learn:['The flow runs in a loop: out of the source, through a consumer, back. A break anywhere — all dark.',
         'A gate is a break you control.',
         'A spark lights only with the flow and burns out without a damper.',
         'Each branch has its own path from outlet to return. Branches do not interfere.',
         'A valve passes the flow one way and never back.',
         'A reserve stores flow and holds the consumer when the source is cut.',
         'This is how the Helm keeps its memory when the flow drops.'],
  lore:['COMMAND WOKE: HELM.MEMORY','Recovered: 1 memory block.','','[placeholder: the block\'s entry, two lines max — Nikita writes it]'],
  part:{bat:['SOURCE','filled port — outlet, hollow — return','The flow leaves the filled port and must return to the hollow one.'],
        lamp:['BEACON','ports are equal','Lit while the flow passes. Either way round.'],
        sw:['GATE','bar down — on, bar up — off','Breaks the circuit. Tap to flip.'],
        res:['DAMPER','pinched shape, ports are equal','Holds the flow back. Goes on a spark\'s path.'],
        led:['SPARK','the triangle points with the flow','Lights only with the flow. Burns out without a damper.'],
        dio:['VALVE','the chevrons point with the flow','Passes the flow one way only.'],
        cap:['RESERVE','filled port — toward the source outlet','Stores flow, gives it back when the source is cut. No flow straight through. Backwards — it bursts.'],
        cmd:['COMMAND','filled port — toward the source outlet','Wakes only the right way round.']}}
};
var lang='ru';
function tx(s,o){ return s.replace(/\{(\w)\}/g,function(_,k){ return o&&o[k]!==undefined?o[k]:'{'+k+'}' }) }

// Уроки. Механизм — [имя, тип, порт a, порт b] (клетки [столбец, строка]), корпус — клетка между ними.
// a — выход у истока; у остальных со стороной — порт к выходу истока. Типы и имена — внутренние, игрок видит T.part.
// rows — цель: при каких затворах что работает; after — «только что выключили»: запасы, заряженные в этом положении, полны.
var SIDES=[['BAT1','bat',[2,9],[4,9]],['SW1','sw',[1,7],[1,5]],['SW2','sw',[6,7],[6,5]],['L1','lamp',[1,3],[1,1]],['L2','lamp',[6,3],[6,1]]];
var LEVELS=[
 {parts:[['BAT1','bat',[2,8],[4,8]],['L1','lamp',[2,2],[4,2]]],rows:[{want:{L1:1}}],fresh:['bat','lamp']},
 {parts:[['BAT1','bat',[1,8],[3,8]],['SW1','sw',[1,3],[1,5]],['L1','lamp',[3,1],[5,1]]],
  rows:[{sw:{},want:{L1:0}},{sw:{SW1:1},want:{L1:1}}],fresh:['sw']},
 {parts:[['BAT1','bat',[1,8],[3,8]],['D1','led',[4,2],[2,2]],['R1','res',[6,4],[6,6]]],rows:[{want:{D1:1}}],fresh:['led','res']},
 {parts:SIDES,rows:[{sw:{},want:{L1:0,L2:0}},{sw:{SW1:1},want:{L1:1,L2:0}},{sw:{SW2:1},want:{L1:0,L2:1}}],fresh:[]},
 {parts:SIDES.concat([['D1','dio',[2,4],[4,4]]]),rows:[{sw:{},want:{L1:0,L2:0}},{sw:{SW1:1},want:{L1:1,L2:1}},{sw:{SW2:1},want:{L1:0,L2:1}}],fresh:['dio']},
 {parts:[['BAT1','bat',[1,9],[3,9]],['SW1','sw',[1,7],[1,5]],['C1','cap',[3,3],[3,5]],['L1','lamp',[5,3],[5,5]]],
  rows:[{sw:{},want:{L1:0}},{sw:{SW1:1},want:{L1:1}},{sw:{},after:{SW1:1},want:{L1:1}}],fresh:['cap']},
 {parts:[['BAT1','bat',[1,9],[3,9]],['SW1','sw',[1,7],[1,5]],['U1','cmd',[3,2],[3,4]],['C1','cap',[5,2],[5,4]],['R1','res',[7,2],[7,4]],['D1','led',[7,5],[7,7]]],
  rows:[{sw:{},want:{U1:0,D1:0}},{sw:{SW1:1},want:{U1:1,D1:1}},{sw:{},after:{SW1:1},want:{U1:1}}],fresh:['cmd']}
];
var COLS=8, ROWS=10, N=COLS*ROWS, ROMAN=['I','II','III'];
function ci(p){ return p[1]*COLS+p[0] }
function polar(t){ return t==='bat'||t==='led'||t==='dio'||t==='cap'||t==='cmd' }

var G=null, qs=new URLSearchParams(location.search), lv=Math.min(LEVELS.length,Math.max(1,+qs.get('lv')||1));
var prog={}; try{ prog=JSON.parse(localStorage.getItem('lb-circuit-v3')||'{}') }catch(e){ prog={} }
function saveProg(){ try{ localStorage.setItem('lb-circuit-v3',JSON.stringify(prog)) }catch(e){} }

function newBoard(){
  var L=LEVELS[lv-1], seen={};
  G={parts:[],cellPart:new Int16Array(N).fill(-1),pad:{},trace:new Uint8Array(N),adj:[],net:null,
     sw:{},burned:{},q:{},live:null,rowsOk:[],won:false,winAt:0,burnAt:{},state:'intro',hover:-1,litPrev:{}};
  for(var i=0;i<N;i++) G.adj.push({});
  L.parts.forEach(function(p,k){
    var a=ci(p[2]), b=ci(p[3]), body=(a+b)/2;
    seen[p[1]]=(seen[p[1]]||0)+1;
    G.parts.push({id:p[0],t:p[1],a:a,b:b,body:body,no:seen[p[1]]-1});
    G.cellPart[a]=G.cellPart[b]=G.cellPart[body]=k; G.pad[a]={k:k,end:'a'}; G.pad[b]={k:k,end:'b'};
    if(p[1]==='sw') G.sw[p[0]]=0;
  });
  G.parts.forEach(function(c){ c.many=seen[c.t]>1 });
  changed();
}
function nameOf(c){ return T[lang].part[c.t][0]+(c.many?' '+ROMAN[c.no]:'') }
function nameId(id){ return nameOf(G.parts.filter(function(c){ return c.id===id })[0]) }

// ——— контур ———
function nets(){
  var p=new Int16Array(N), i; for(i=0;i<N;i++) p[i]=i;
  function f(x){ while(p[x]!==x){ p[x]=p[p[x]]; x=p[x] } return x }
  for(i=0;i<N;i++) for(var j in G.adj[i]){ var a=f(i), b=f(+j); if(a!==b) p[a]=b }
  var n=new Int16Array(N); for(i=0;i<N;i++) n[i]=f(i); return n;
}
// Разбор по смыслу. st: {sw, q, burned}. Ответ: lit (сила 0..1 по имени), short — пробой, burn/burst — что погибнет,
// rev — стоит против потока (подсказка), charging/drain — запасы, hot — сети, где идёт поток.
function analyze(st){
  var net=G.net, E=[], res={lit:{},short:false,burn:{},burst:{},rev:{},charging:{},drain:{},hot:{}};
  G.parts.forEach(function(c,k){
    if(st.burned[c.id]) return;
    var e={k:k,A:net[c.a],B:net[c.b],dir:0,load:0,led:0};
    if(c.t==='res'||c.t==='lamp') e.load=1;
    else if(c.t==='cmd'){ e.load=1; e.dir=1 }
    else if(c.t==='led'){ e.led=1; e.dir=1 }
    else if(c.t==='dio') e.dir=1;
    else if(c.t!=='sw'||!st.sw[c.id]) return;
    if(e.A!==e.B) E.push(e);
  });
  function paths(P,M,rev,cb){
    var seen={}, used=[];
    (function go(n){
      if(n===M){ cb(used.slice()); return }
      seen[n]=1;
      E.forEach(function(e){
        var to=-1, back=false;
        if(e.A===n) to=e.B; else if(e.B===n){ if(e.dir&&!rev) return; to=e.A; back=!!e.dir }
        if(to<0||seen[to]) return;
        used.push({e:e,back:back}); go(to); used.pop();
      });
      seen[n]=0;
    })(P);
  }
  function reach(from,to){ if(from===to) return true; var seen={}, q=[from]; seen[from]=1;
    while(q.length){ var n=q.shift(); for(var x=0;x<E.length;x++){ var e=E[x], m=e.A===n?e.B:(e.B===n&&!e.dir?e.A:-1);
      if(m<0||seen[m]) continue; if(m===to) return true; seen[m]=1; q.push(m) } } return false }
  function feed(P,M,power){
    var f={short:false,act:[],burn:[]};
    paths(P,M,false,function(p){
      var load=p.some(function(x){ return x.e.load }), leds=p.filter(function(x){ return x.e.led });
      if(!load&&!leds.length) f.short=true;
      else if(!load) leds.forEach(function(x){ f.burn.push(x.e.k) });
      else p.forEach(function(x){ f.act.push(x.e) });
    });
    if(f.short) return f;
    f.act.forEach(function(e){ var id=G.parts[e.k].id; res.lit[id]=Math.max(res.lit[id]||0,power); res.hot[e.A]=Math.max(res.hot[e.A]||0,power); res.hot[e.B]=Math.max(res.hot[e.B]||0,power) });
    if(f.act.length){ res.hot[P]=Math.max(res.hot[P]||0,power); res.hot[M]=Math.max(res.hot[M]||0,power) }
    return f;
  }
  var bat=G.parts.filter(function(c){ return c.t==='bat' })[0], P=net[bat.a], M=net[bat.b];
  var f=feed(P,M,1);
  if(f.short){ res.short=true; res.hot[P]=res.hot[M]=-1 }
  f.burn.forEach(function(k){ res.burn[G.parts[k].id]=1 });
  if(!res.short){
    // против потока: путь с потребителем нашёлся бы, если развернуть механизм
    paths(P,M,true,function(p){ if(!p.some(function(x){ return x.e.load||x.e.led })) return;
      p.forEach(function(x){ if(x.back){ var id=G.parts[x.e.k].id; if(!res.lit[id]) res.rev[id]=1 } }) });
    G.parts.forEach(function(c){
      if(c.t!=='cap'||st.burned[c.id]) return; var A=net[c.a], B=net[c.b];
      if(A===B) return;
      if(reach(P,A)&&reach(B,M)) res.charging[c.id]=1;
      else if(reach(P,B)&&reach(A,M)) res.burst[c.id]=1;
    });
  }
  G.parts.forEach(function(c){
    var q=st.q[c.id]||0; if(c.t!=='cap'||st.burned[c.id]||res.charging[c.id]||q<.05) return;
    var g=feed(net[c.a],net[c.b],q); res.drain[c.id]=g.short?2:(g.act.length?1:0);
  });
  return res;
}
function rowState(row){ var sw={}; for(var s in G.sw) sw[s]=row&&row[s]?1:0; return sw }
function evalRows(){
  var L=LEVELS[lv-1];
  G.rowsOk=L.rows.map(function(row){
    var q={};
    if(row.after){ var pre=analyze({sw:rowState(row.after),q:{},burned:G.burned}); for(var c in pre.charging) q[c]=1 }
    var r=analyze({sw:rowState(row.sw),q:q,burned:G.burned});
    if(r.short||Object.keys(r.burn).length||Object.keys(r.burst).length) return false;
    for(var id in row.want) if(((r.lit[id]||0)>.3?1:0)!==row.want[id]) return false;
    return true;
  });
}
function changed(){ G.net=nets(); evalRows(); hud() }

  for(id in r.burst) if(!G.burned[id]){ G.burned[id]=1; G.burnAt[id]=now; fresh=true; statusMsg=['bad','burst',id]; pop() }

function hud(){
  if(!G) return;
  goalsEl.innerHTML=LEVELS[lv-1].rows.map(function(row,ix){ var ok=G.rowsOk[ix];
    return '<div class="'+(ok?'ok':'no')+'">'+(ok?'✓ ':'· ')+rowText(row).replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</div>' }).join('');
  var lb=document.getElementById('lvls');
  if(!lb.children.length){ LEVELS.forEach(function(_,ix){ var b=document.createElement('button'); b.textContent=ix+1; b.onclick=function(){ lv=ix+1; restart() }; lb.appendChild(b) }) }
  [].forEach.call(lb.children,function(b,ix){ b.classList.toggle('on',ix+1===lv); b.classList.toggle('done',!!prog[ix+1]) });
}
function show(id){ ['ovIntro','ovDone'].forEach(function(o){ document.getElementById(o).classList.toggle('hide',o!==id) }) }

var loreTimer=0;
function typeLines(lines,btn){
  var box=document.getElementById('lore'), total=0, n=0;
  lines.forEach(function(l){ total+=l.s.length+1 });
  btn.style.visibility='hidden'; clearInterval(loreTimer);
  loreTimer=setInterval(function(){
    n+=2; var left=n, out=[];
    lines.forEach(function(l){ if(left<=0) return; var s=l.s.slice(0,left); left-=l.s.length+1;
      out.push('<span class="'+l.cl+'">'+s.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</span>') });
    box.innerHTML=out.join('\n')+(n<total?'<span class="y">▌</span>':'');
    if(n>=total){ clearInterval(loreTimer); btn.style.visibility='visible' }
  },20);
}
function win(){
  if(!G.won) return;
  G.state='done'; show('ovDone'); hud();
  var L=T[lang], last=lv===LEVELS.length, lines=[{cl:'g',s:L.done},{cl:'m',s:L.learned},{cl:'',s:L.learn[lv-1]}];
  if(last){ lines.push({cl:'',s:''}); L.lore.forEach(function(s,ix){ lines.push({cl:ix===0?'y':ix===1?'m':'',s:s}) }) }
  var btn=document.getElementById('bNext'); btn.textContent=last?L.back:L.next;
  typeLines(lines,btn);
}

function step(j){
  if(j<0||j===drag.head) return;
  var h=drag.head, hc=h%COLS, hr=(h/COLS)|0, jc=j%COLS, jr=(j/COLS)|0;
  if(Math.abs(hc-jc)===1&&Math.abs(hr-jr)===1){ // срезал угол — через соседнюю клетку
    var a=hr*COLS+jc, b=jr*COLS+hc, ok=function(x){ return !(G.cellPart[x]>=0&&!G.pad[x]) }, m=ok(a)?a:b;
    step(m); if(drag.head!==m) return; h=m;
  }
  if(Math.abs(h%COLS-jc)+Math.abs(((h/COLS)|0)-jr)!==1) return;
  drag.moved=true; extend(h,j);
}
var tip=document.getElementById('tip');
function showTip(e){
  var i=cellAt(e.clientX,e.clientY), k=i>=0?G.cellPart[i]:-1;
  if(k<0||drag||G.state!=='play'){ tip.style.display='none'; return }
  var c=G.parts[k], P=T[lang].part[c.t];
  tip.innerHTML='<b></b><br><span></span>'; tip.children[0].textContent=nameOf(c); tip.children[2].textContent=P[2];
  tip.style.display='block';
  var x=Math.min(W-270,e.clientX+14), y=e.clientY+18; if(y>H-80) y=e.clientY-70; tip.style.left=x+'px'; tip.style.top=y+'px';
}
cv.addEventListener('pointerdown',function(e){
  audio(); if(!G||G.state!=='play') return;
  var i=cellAt(e.clientX,e.clientY); if(i<0) return;
  var k=G.cellPart[i];
  if(k>=0&&!G.pad[i]){ var c=G.parts[k]; if(c.t==='sw'){ G.sw[c.id]=G.sw[c.id]?0:1; beep(G.sw[c.id]?1200:700,.04,.04); hud() } return }
  if(!G.trace[i]&&!G.pad[i]){ flash(T[lang].fromPad); return }
  try{ cv.setPointerCapture(e.pointerId) }catch(_){}
  drag={head:i,start:i,moved:false,x:e.clientX,y:e.clientY};
  tip.style.display='none';
});
cv.addEventListener('pointermove',function(e){
  if(!G) return; G.hover=cellAt(e.clientX,e.clientY);
  if(!drag){ if(e.pointerType==='mouse') showTip(e); return }
  var dx=e.clientX-drag.x, dy=e.clientY-drag.y, n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/(S/4)));
  for(var s=1;s<=n;s++) step(cellAt(drag.x+dx*s/n,drag.y+dy*s/n));
  drag.x=e.clientX; drag.y=e.clientY;
});
cv.addEventListener('pointerup',function(){ if(drag&&!drag.moved) cut(drag.start); drag=null });
cv.addEventListener('pointercancel',function(){ drag=null });
cv.addEventListener('pointerleave',function(){ if(G) G.hover=-1; tip.style.display='none' });

function restart(){ clearInterval(loreTimer); statusMsg=null; newBoard(); applyLang(); show('ovIntro'); resize() }
document.getElementById('bGo').onclick=function(){ audio(); G.state='play'; show(null); hud(); resize() };
document.getElementById('bNext').onclick=function(){ if(lv<LEVELS.length) lv++; restart() };
document.getElementById('reset').onclick=function(){ if(G.state!=='play') return; statusMsg=null; newBoard(); G.state='play'; hud() };
document.getElementById('lang').onclick=function(){ lang=lang==='ru'?'en':'ru'; applyLang(); resize(); if(G.state==='done') win() };

addEventListener('resize',resize);
newBoard(); applyLang(); resize();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(resize);
window.BOARD={get G(){return G},cxy:cxy,cellAt:cellAt,LEVELS:LEVELS}; // для проверки из Playwright
var last=0;
(function frame(now){ var dt=Math.min(.05,(now-(last||now))/1000); last=now;
  if(G&&G.state==='play') tick(dt,Date.now());
  draw(now); requestAnimationFrame(frame) })(0);
})();
</script>
</body>
</html>
