<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LAST BERTH — макет v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Geist+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0B0C;--pan:#141417;--pan2:#202024;--ln:#2E2E33;--ink:#F2F1EC;--mid:#9C9B95;--dim:#5E5D58;--red:#FF2A1A;--food:#3DDC84;--ppl:#FFD23F;--ark:#B48CFF;--h:'Jost',sans-serif;--n:'Geist Mono',monospace}
*{box-sizing:border-box}
html,body{margin:0;background:#050506;color:var(--ink);font:14px/1.4 var(--h)}
.intro{max-width:1280px;margin:0 auto;padding:12px 8px;color:var(--mid);font-size:13px}
.intro b{color:var(--ink)}
#wrap{margin:0 auto;position:relative;overflow:hidden}
#stage{width:1280px;height:760px;position:absolute;left:0;top:0;transform-origin:0 0;background:var(--bg);overflow:hidden;border:1px solid var(--ln)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg.gi{fill:currentColor}
#map svg.gi{pointer-events:none}
.ic{display:inline-block;vertical-align:-3px;flex:none}
/* top */
#top{position:absolute;left:0;top:0;right:0;height:46px;display:flex;align-items:center;gap:22px;padding:0 12px;border-bottom:1px solid var(--ln)}
.logo{font-weight:700;letter-spacing:.22em;font-size:14px;display:flex;align-items:center;gap:10px}.logo i{width:10px;height:10px;background:var(--red)}
.yr small{display:block;font-size:9.5px;letter-spacing:.18em;color:var(--mid);font-weight:600}.yr b{font:600 20px var(--n)}.yr span{font-size:11px;color:var(--mid);margin-left:6px}
.night small,.night b{color:var(--red)}
.adv{display:flex;align-items:center;gap:8px;border:1px solid var(--ppl);color:var(--ppl);padding:5px 8px 5px 10px;font-size:11px;font-weight:600;letter-spacing:.12em}
.adv b{background:var(--ppl);color:#000;padding:0 6px;font:600 12px var(--n)}.adv.on{background:var(--ppl);color:#000}.adv.on b{background:#000;color:var(--ppl)}
.spd{margin-left:auto;display:flex;align-items:center;gap:3px}
.spd button{border:1px solid var(--ln);min-width:36px;height:28px;font:600 12px var(--n);padding:0 8px}
.spd button.on{background:var(--ink);color:#000}.spd button.pzb{background:var(--ppl);border-color:var(--ppl)}
.pz{font-size:10px;letter-spacing:.18em;color:var(--ppl);font-weight:700;margin-right:8px}
#res{position:absolute;left:0;right:0;top:46px;height:54px;display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--ln)}
.rc{padding:5px 14px;border-right:1px solid var(--ln);display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:12px}
.rc small{grid-column:1/-1;font-size:9.5px;letter-spacing:.18em;color:var(--mid);font-weight:600;display:flex;align-items:center;gap:5px}
.rc small em{margin-left:auto;font-style:normal;color:var(--red)}
.rc b{font:600 22px/1.1 var(--n)}.rc span{align-self:end;font:11px var(--n);padding-bottom:3px}.rc .up{color:var(--food)}.rc .dn{color:var(--red)}
/* tabs */
#tabs{position:absolute;left:0;top:100px;bottom:0;width:82px;background:var(--pan);border-right:1px solid var(--ln);z-index:6}
.tab{width:82px;height:82px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-bottom:1px solid var(--ln);position:relative;font-size:10px;letter-spacing:.16em;font-weight:600;color:var(--mid)}
.tab.on{background:var(--ink);color:#000}
.flag{position:absolute;left:88px;top:28px;white-space:nowrap;font-style:normal;letter-spacing:.02em;font-size:12px;font-weight:500;background:var(--pan);border:1px solid;padding:3px 9px;pointer-events:none}
.flag:before{content:'';position:absolute;left:-7px;top:50%;margin-top:-6px;border:6px solid transparent;border-right-color:currentColor;border-left:0}
/* map */
#mapbox{position:absolute;left:82px;top:100px;right:0;bottom:0}
#map{width:100%;height:100%;display:block}
.ring{fill:none;stroke:var(--dim);stroke-dasharray:1 5}.ring.dim{stroke-dasharray:2 8;opacity:.6}
.rn{fill:var(--dim);font:600 9px var(--h);letter-spacing:.16em}
.lobe{fill:var(--food);fill-opacity:.06;stroke:var(--food);stroke-opacity:.45;stroke-dasharray:3 4}
.ln{fill:var(--food);font:600 10px var(--h);letter-spacing:.16em}
.wd{cursor:pointer}.wn{fill:var(--ink);font:600 10.5px var(--h);letter-spacing:.1em}
.wd.sel circle[fill="transparent"]{stroke:var(--ink);stroke-width:2}
.alarm{fill:none;stroke:var(--red);stroke-width:2;animation:al 1.4s infinite}
@keyframes al{50%{stroke-opacity:.15}}
#evbar{position:absolute;left:50%;transform:translateX(-50%);top:10px;display:flex;align-items:center;gap:10px;border:1px solid var(--food);background:var(--pan);padding:6px 14px;font-size:12.5px;white-space:nowrap}
#evbar b{color:var(--food);letter-spacing:.14em;font-size:11px}
#cards{position:absolute;right:12px;top:10px;width:250px;display:flex;flex-direction:column;gap:6px}
.bcard{position:relative;display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:8px;background:rgba(20,20,23,.92);border:1px solid var(--ln);padding:7px 10px 11px;text-align:left;font-size:12px}
.bcard span{color:var(--mid)}.bcard i{font:12px var(--n);font-style:normal}
.bcard u{position:absolute;left:10px;bottom:5px;height:3px;background:var(--ink)}
.more{text-align:right;font-size:10px;letter-spacing:.16em;color:var(--mid);font-weight:600}
#zoom{position:absolute;right:12px;bottom:12px;display:flex;gap:3px}
#zoom button{border:1px solid var(--ln);background:var(--pan);height:30px;min-width:32px;font:600 12px var(--n);padding:0 8px}
#tip{position:absolute;display:none;background:var(--pan);border:1px solid var(--mid);padding:6px 10px;font-size:12px;gap:8px;align-items:center;white-space:nowrap;z-index:5;pointer-events:none}
#tip.on{display:flex}#tip span{color:var(--mid);font-size:10px;letter-spacing:.14em}#tip em{font:11.5px var(--n);font-style:normal;display:flex;gap:3px;align-items:center}
/* side panels */
#side{position:absolute;left:82px;top:100px;bottom:0;width:470px;z-index:4;display:none}
#side.on{display:block}
.side{height:100%;background:var(--pan);border-right:1px solid var(--ink);display:flex;flex-direction:column}
/* windows */
#ovl{position:absolute;left:82px;top:100px;right:0;bottom:0;background:rgba(5,5,6,.72);display:none;align-items:center;justify-content:center;z-index:5}
#ovl.on{display:flex}
.win{position:relative;width:1000px;max-height:640px;background:var(--pan);border:1px solid var(--ink);display:flex;flex-direction:column}
.win.sm{width:520px}.win.wide{width:1060px}
.wh{display:flex;align-items:center;gap:10px;height:42px;padding:0 14px;background:var(--pan2);border-bottom:1px solid var(--ln);flex:none}
.wh b{font-size:17px;font-weight:600;letter-spacing:.1em}.wh small{margin-left:auto;font-size:10px;letter-spacing:.18em;color:var(--mid);font-weight:600}
.x{width:28px;height:28px;display:flex;align-items:center;justify-content:center}
.bd{padding:14px 18px 16px;overflow:auto}
.bd.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:26px}
.bd.two>div:first-child{border-right:1px solid var(--ln);padding-right:24px}
.bd.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
.nav{position:absolute;top:50%;margin-top:-26px;width:38px;height:52px;border:1px solid var(--mid);background:var(--pan);font-size:22px}
.nav.l{left:-52px}.nav.r{right:-52px}
.sec{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.18em;color:var(--mid);font-weight:600;border-bottom:1px solid var(--ln);padding-bottom:5px;margin:14px 0 8px}
.sec:first-child{margin-top:2px}
.rw{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mid);padding:2.5px 0;gap:10px}
.rw span{display:flex;align-items:center;gap:6px}.rw b{color:var(--ink);font:600 13px var(--n);text-align:right}
.lab{font-size:10px;letter-spacing:.18em;color:var(--dim);font-weight:600;margin:10px 0 6px}
.hint{font-size:12px;color:var(--dim);margin:6px 0}.hint.c{text-align:center}
.why{font-size:12.5px;color:var(--red);margin:6px 0}
.alert{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--red);color:var(--red);padding:7px 10px;font-size:12.5px;margin:8px 0}
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--mid);padding:5px 10px;font-size:11px;letter-spacing:.12em;font-weight:600;white-space:nowrap}
.b.pri{background:var(--ink);color:#000;border-color:var(--ink)}
.b.red{border-color:var(--red);color:var(--red)}
.b.off{border-style:dashed;border-color:var(--dim);color:var(--dim);cursor:default}
.bd>.b,.bd>div>.b.red,.bd>div>.b.off,.bd>.b.red{width:100%;margin-top:10px;padding:8px}
.prow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0}
.prow .b{margin-left:auto}
.pr{display:inline-flex;align-items:center;gap:4px;font:600 12px var(--n)}.pr.short{color:var(--red)}
.gen{display:inline-block;border:1px solid var(--mid);font:600 10px var(--n);padding:0 4px;line-height:15px}.gen.old{color:var(--dim);border-color:var(--dim)}
.hr{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--pan2);min-height:40px}
.hr.dis{opacity:.55}
.hn{font-weight:600;font-size:13px;white-space:nowrap}
.hs{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.hst{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ha{display:flex;gap:4px}.ha .b{padding:4px 7px;font-size:10px}
.seg{display:flex;gap:2px}.seg button{border:1px solid var(--ln);padding:2px 8px;font-size:9.5px;letter-spacing:.12em;font-weight:600;color:var(--mid)}.seg button.on{background:var(--ink);color:#000;border-color:var(--ink)}
.seg.wide{padding:10px 14px 4px}.seg.wide button{padding:5px 10px}
.lst{max-height:150px;overflow:auto}.lst.tall{max-height:none;flex:1;padding:0 14px}
.ord{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.oc{border:1px solid var(--ln);background:var(--bg);padding:8px;display:flex;flex-direction:column;gap:5px;align-items:flex-start;font-size:12px}
.oc b{font-size:11.5px;letter-spacing:.08em}.oc .pr{font-size:11px}.oc .b{width:100%;margin-top:auto}
.oc.dis{border-style:dashed;opacity:.8}
.ord.big .oc{padding:12px;gap:4px}.ord.big .oc .rw{width:100%}
.locked{border:1px dashed var(--dim);color:var(--dim);text-align:center;padding:10px;font-size:10px;letter-spacing:.18em;margin:6px 0;font-weight:600}
.big{font-size:18px;font-weight:600;letter-spacing:.06em;display:flex;align-items:center;gap:8px;margin:4px 0}.big.mid{color:var(--mid)}
.radio{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer;font-size:12.5px}.radio i{width:12px;height:12px;border-radius:50%;border:1px solid var(--mid)}.radio.on i{background:var(--ink)}.radio span{color:var(--mid);margin-left:auto}
.trn{display:flex;align-items:center;gap:8px;font-size:13px}.trn span{margin-left:auto;color:var(--mid)}
.bar{height:5px;background:var(--pan2);margin:8px 0;position:relative}.bar u{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.yr2{display:grid;grid-template-columns:44px 150px 170px 1fr 60px;align-items:center;gap:10px;font-size:12.5px;padding:3px 0}.yr2 span{color:var(--mid)}.yr2 i{font:12px var(--n);font-style:normal;text-align:right}.yr2 .bar{margin:0}
.pier{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pc{border:1px solid var(--ln);background:var(--bg);padding:8px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12.5px}.pc.res{border-color:var(--ark)}.pc em{font-style:normal;color:var(--ark);font-size:10px;letter-spacing:.14em;display:flex;gap:4px;align-items:center;margin-left:auto}
.pc>div{width:100%;display:flex;gap:6px}.pc>div .b{flex:1;font-size:10px;padding:4px}
.hero{font:600 30px var(--n);display:flex;align-items:baseline;gap:10px;margin:4px 0 8px}.hero span{font:13px var(--h);color:var(--mid)}
.bd.three .hero:not([style]){font:600 17px var(--h);letter-spacing:.08em;align-items:center}
.chips{display:flex;gap:6px}.chips button{border:1px solid var(--mid);padding:4px 10px;font-size:11px;letter-spacing:.1em;font-weight:600;display:flex;gap:6px;align-items:center}.chips button.on{background:var(--ink);color:#000}
.arktop{display:grid;grid-template-columns:260px 1fr;gap:28px}
.lv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lc{border:1px dashed var(--dim);padding:10px;min-height:104px;display:flex;flex-direction:column;gap:3px;color:var(--dim)}
.lc b{font:600 24px var(--n)}.lc.l2{background:var(--ark);border:1px solid var(--ark);color:#000}.lc.l1{border:1px solid var(--ark);color:var(--ink)}.lc em{font-style:normal;font-size:10px;letter-spacing:.16em;font-weight:700}.lc i{font-style:normal;font-size:11px}.lc .b{margin-top:auto}
.cv{display:flex;gap:22px}.cg{display:flex;gap:8px}
.slot{width:112px;height:72px;border:1px dashed var(--red);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:9.5px;letter-spacing:.1em;color:var(--red);font-weight:600;opacity:.75}
.slot.on{border:1px solid var(--ark);color:var(--mid);opacity:1}
.verdict{border:1px solid var(--red);padding:14px 18px;display:grid;grid-template-columns:1fr auto;gap:2px 20px}.verdict b{font-size:22px;color:var(--red);letter-spacing:.06em}.verdict span{color:var(--mid);font-size:13px}.verdict i{grid-row:1/3;grid-column:2;align-self:center;font-style:normal;font:600 15px var(--n)}
.tbl{padding:4px 14px;overflow:auto;flex:1}
.th,.tr{display:grid;grid-template-columns:1.6fr .5fr 1fr .6fr .7fr 1.5fr;align-items:center;gap:6px}
.th{font-size:9.5px;letter-spacing:.16em;color:var(--mid);font-weight:600;padding:6px 0;border-bottom:1px solid var(--ln)}
.tr{width:100%;text-align:left;padding:8px 0;border-bottom:1px solid var(--pan2);font-size:12.5px}.tr>span{display:flex;align-items:center;gap:6px;white-space:nowrap}.tr b{letter-spacing:.08em}
.tr.red{box-shadow:inset 3px 0 0 var(--red);padding-left:8px}
.tr>span:nth-child(n+2):nth-child(-n+5){font-family:var(--n)}
.tr:hover{background:var(--pan2)}
.lnk{font-size:11px;letter-spacing:.1em;font-weight:600;color:var(--ink)}
/* pops */
#pop{position:absolute;z-index:8;display:none}#pop.on{display:block}
#pop.p-adv{left:360px;top:42px;width:520px}#pop.p-menu{right:12px;top:42px;width:260px}
#pop.p-center{left:0;right:0;top:0;bottom:0;background:rgba(5,5,6,.5);display:flex;align-items:center;justify-content:center}
.advl,.menu,.pick{background:var(--pan);border:1px solid var(--ppl);padding:6px}
.advl button{display:grid;grid-template-columns:4px 1fr auto;grid-template-rows:auto auto;column-gap:12px;width:100%;text-align:left;padding:8px 10px 8px 0;background:var(--bg);margin-bottom:4px}
.advl i{grid-row:1/3;align-self:stretch}.advl b{font-size:13px;font-weight:600}.advl span{grid-column:2;font-size:12px;color:var(--mid)}.advl em{grid-row:1/3;grid-column:3;align-self:center;font-style:normal;font-size:11px;letter-spacing:.12em;font-weight:600;border:1px solid var(--mid);padding:3px 8px}
.menu{border-color:var(--mid)}.menu button{display:flex;gap:10px;align-items:center;width:100%;padding:8px 10px;font-size:13px;text-align:left}.menu button:hover{background:var(--pan2)}.menu b{margin-left:4px}
.pick{border-color:var(--ink);width:360px;padding:10px 14px}.pick button{display:flex;gap:10px;align-items:center;width:100%;padding:7px 4px;border-bottom:1px solid var(--pan2);font-size:13px}.pick button span{margin-left:auto;color:var(--mid);font-size:12px}.pick button.dis{opacity:.4;cursor:default}.pick .cancel{justify-content:center;color:var(--mid);letter-spacing:.14em;font-size:11px;border:0;margin-top:6px}
#toasts{position:absolute;right:12px;bottom:52px;display:flex;flex-direction:column;gap:6px;z-index:9;width:380px}
.toast{background:var(--pan);border:1px solid var(--mid);padding:8px 12px;font-size:12.5px;display:flex;gap:8px;align-items:center;animation:tin .25s}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
#noteL{position:absolute;inset:0;z-index:10;background:rgba(5,5,6,.85);display:none;align-items:center;justify-content:center}#noteL.on{display:flex}
.note{width:560px;border:1px solid var(--red);background:var(--pan);padding:26px 30px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.note b{font-size:28px;color:var(--red);letter-spacing:.06em;font-weight:600}.note p{margin:0;font-size:15px}.note .d{color:var(--mid);font-size:12.5px}.note .b{margin-top:8px;padding:8px 22px}
</style>
</head>
<body>
<div class="intro"><b>LAST BERTH — макет v3, кликабельный.</b> Вкладки слева, миры на карте, стрелки ‹ › в окне мира, советник, ≡, скорость, Skip — всё нажимается. Назначение, перевод, снятие, заказ, резерв, слом и высадка меняют данные макета. Время не идёт: это не игра, числа условные. Шрифт — Jost + Geist Mono.</div>
<div id="wrap"><div id="stage">
<div id="top"></div><div id="res"></div><nav id="tabs"></nav>
<div id="mapbox"><svg id="map" preserveAspectRatio="xMidYMid meet"></svg><div id="evbar"></div><div id="cards"></div><div id="zoom"></div><div id="tip"></div></div>
<div id="side"></div><div id="ovl"></div><div id="pop"></div><div id="toasts"></div><div id="noteL"></div>
</div></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-courier" viewBox="0 0 64 40"><path d="M2 26 L12 34 H50 L60 26 Z"/><path d="M8 26 L14 16 H40 L44 26 Z"/><path d="M28 16 L34 10 H40 V16 Z" opacity=".35"/><path d="M50 30 H64 M54 34 H66" stroke="currentColor" stroke-width="2" fill="none"/></symbol>
<symbol id="i-hauler" viewBox="0 0 64 40"><path d="M2 22 L8 36 H54 L60 22 Z"/><rect x="34" y="10" width="16" height="12"/><rect x="38" y="13" width="8" height="4" opacity=".35"/><rect x="18" y="2" width="3" height="20"/><path d="M20 4 L40 16 M20 4 L6 22" stroke="currentColor" stroke-width="2" fill="none"/></symbol>
<symbol id="i-freighter" viewBox="0 0 64 40"><path d="M0 24 L6 36 H60 L64 24 Z"/><rect x="8" y="16" width="10" height="8"/><rect x="20" y="16" width="10" height="8"/><rect x="32" y="16" width="10" height="8"/><rect x="8" y="8" width="10" height="7"/><rect x="20" y="8" width="10" height="7"/><rect x="32" y="8" width="10" height="7"/><rect x="48" y="4" width="10" height="20"/><rect x="50" y="7" width="6" height="3" opacity=".35"/></symbol>
</defs></svg>
<script>
const C={metal:'#C9CFD6',food:'#3DDC84',fuel:'#FF8A1F',parts:'#F2F1EC',people:'#FFD23F',red:'#FF2A1A',ark:'#B48CFF',earth:'#4FA3FF',ink:'#F2F1EC',mid:'#9C9B95',dim:'#5E5D58'};
const ST='fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"';
const F='fill="currentColor"';
const g=(d,extra='')=>`<path d="${d}" ${extra} ${ST}/>`;
const fp=(d,extra='')=>`<path d="${d}" ${extra} ${F}/>`;
const I={
 hold:g('M3 7 H21 V17 H3 Z')+g('M7.5 7 V17 M12 7 V17 M16.5 7 V17'),
 speed:g('M4 17 A8 8 0 1 1 20 17')+g('M12 16 L16 10'),
 range:g('M12 12 m-2 0 a2 2 0 1 0 4 0 a2 2 0 1 0 -4 0')+g('M12 12 m-6 0 a6 6 0 1 0 12 0 a6 6 0 1 0 -12 0','stroke-dasharray="2.5 2"')+g('M12 12 m-10 0 a10 10 0 1 0 20 0 a10 10 0 1 0 -20 0','stroke-dasharray="1.5 2.5" opacity=".6"'),
 years:g('M12 12 m-9 0 a9 9 0 1 0 18 0 a9 9 0 1 0 -18 0')+g('M12 6 V12 L16 14'),
 lift:g('M6 3 H18 M6 21 H18 M7 3 C7 9 17 9 17 12 C17 15 7 15 7 21 M17 3 C17 9 7 9 7 12')+fp('M9 19 L12 16 L15 19 Z'),

function winWorld(id){const w=WI(id),f=w.f;let L='',R='';

    const can=H.filter(h=>h.st==='pier'&&REACH(h.g)>=w.ring);if(!U.who[id]&&can[0])U.who[id]=can[0].id;

     ${sec('FOUND A COLONY')}${row('Settlers','52 people',C.people)}<div class="lab">WHO GOES</div>${can.length?can.map(h=>`<label class="radio${U.who[id]===h.id?' on':''}" data-a="who" data-v="${id}:${h.id}"><i></i>${ship(h.c,26)}${gen(h.g)}<b>no.${h.id}</b><span>hold ${SPEC[h.c][0]} · arrives in ${w.ring*5} yrs</span></label>`).join(''):`<div class="why">No free hull at Earth reaches ring ${w.ring}.</div>`}
     <div class="prow"><span class="lab">PRICE</span>${price([['metal','180'],['food','240'],['fuel','90'],['people','52']])}</div>${btn('SEND SETTLERS','send',id,can.length?'pri':'off','send')}<div class="hint">After landfall you assign hulls to the line in this same window.</div></div>${nav}</div>`;}
  if(w.st==='settling'||w.st==='landing'){const h=H.find(x=>x.line===id&&x.st==='settlers');

    L+=sec('MACHINES',w.tier?`TIER ${ROM[w.tier]} · RUNNING`:'NONE')+(w.tier?row(`${res('fuel',13)} Burn`,(2.2*w.tier).toFixed(1)+' fuel /yr',C.fuel)+row('Fuel on the world','312 · 71 yrs'):'')+`<div class="hint">Tier ${ROM[w.tier+1]}: ${f.gives} → ${(f.gives*1.4).toFixed(1)} /yr</div><div class="prow">${price([['metal','420'],['parts','60']])}${btn('ORDER TIER '+ROM[w.tier+1],'kitorder',id,'pri','upgrade')}</div><div class="hint">Rides out on a hull of this line · needs hold 240</div>`;}

  R+=sec('OR ORDER A NEW ONE',`YARD · GEN ${ROM[curGen]}`)+`<div class="ord">${['courier','hauler','freighter'].map(c=>{const sh=c==='freighter';return `<div class="oc${sh?' dis':''}">${ship(c,40)}<b>${CLS[c].toUpperCase()} ${ROM[curGen]}</b>${price(PRICE[c].slice(0,3))}${sh?`<div class="why">259 parts short</div>`:btn('BUILD · '+(c==='courier'?6:9)+' YRS','order',`${c}:${id}`,'pri','build')}</div>`}).join('')}</div><div class="hint">A lost hull is not replaced. The advisor names the line.</div>`;
  return `<div class="win">${head(w.n,sub,wmark(w.k,true,16))}<div class="bd two"><div>${L}</div><div>${R}</div></div>${nav}</div>`;
}

  el('ovl').innerHTML=w;el('ovl').className=w?'on':'';
  let p='';if(U.pop==='adv')p=popAdv();else if(U.pop==='menu')p=popMenu();else if(U.pop&&U.pop.startsWith('pick'))p=picker();
  el('pop').innerHTML=p;el('pop').className=U.pop?('on p-'+(U.pop.startsWith('pick')?'center':U.pop)):'';
  el('noteL').innerHTML=U.note?noteWin():'';el('noteL').className=U.note?'on':'';
  document.querySelectorAll('#map .wd').forEach(g=>g.classList.toggle('sel',g.dataset.v===U.win));
}
const ORDER=W.map(w=>w.id);
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t){if(U.pop&&!e.target.closest('#pop')){U.pop=null;render()}return}
  const a=t.dataset.a,v=t.dataset.v;
  if(a==='tab'){U.pop=null;if(['worlds','fleet'].includes(v)){U.tab=U.tab===v?null:v;U.win=null}else{U.win=U.win===v?null:v}}
  else if(a==='world'){U.pop=null;U.win=v;U.scrapArm=null}
  else if(a==='close'){U.win=null;U.scrapArm=null}
  else if(a==='step'){const i=ORDER.indexOf(U.win);U.win=ORDER[(i+(+v)+ORDER.length)%ORDER.length]}
  else if(a==='pop'){U.pop=U.pop===v||!v?null:v}
  else if(a==='spd'){if(v==='0')U.userPause=!U.userPause;else{U.speed=+v;U.userPause=false}}
  else if(a==='skip')toast('Skipped to the next event: year 3011');
  else if(a==='zoom'){U.zoom=v==='0'?1:Math.max(.7,Math.min(3,U.zoom*(v==='+'?1.3:1/1.3)));setZoom()}
  else if(a==='addtab')U.addTab=v;
  else if(a==='filter')U.filter=v;
  else if(a==='assign'){const [hid,wid]=v.split(':'),h=H.find(x=>x.id==hid);const from=h.line;h.line=wid;h.st='toWorld';h.y=WI(wid).ring*4;toast(`${ic('assign',15)}${hname(h)} → ${WI(wid).n}${from?` (from ${WI(from).n})`:''}`);drawMap()}
  else if(a==='takeoff'){const h=H.find(x=>x.id==v);toast(`${ic('takeoff',15)}${hname(h)} comes off ${WI(h.line).n} — free at Earth when it docks`);h.line=null;h.st='pier';h.moveTo=null;drawMap()}
  else if(a==='pick'){U.pop='pick:'+v}
  else if(a==='pickgo'){const [k,hid,wid]=v.split(':'),h=H.find(x=>x.id==hid);if(k==='move'){h.moveTo=wid;toast(`${ic('movesTo',15)}${hname(h)} moves to ${WI(wid).n} when it docks`)}else{h.line=wid;h.st='toWorld';h.y=WI(wid).ring*4;toast(`${ic('assign',15)}${hname(h)} → ${WI(wid).n}`);drawMap()}U.pop=null}
  else if(a==='order'){const [c,wid]=v.split(':');BUILD.push({c,g:curGen,for:wid,p:0,y:c==='courier'?6:9});toast(`${ic('build',15)}${CLS[c]} ${ROM[curGen]} ordered for ${WI(wid).n} · ${c==='courier'?6:9} yrs`)}
  else if(a==='build'){BUILD.push({c:v,g:curGen,for:null,p:0,y:v==='courier'?6:9});toast(`${ic('build',15)}${CLS[v]} ${ROM[curGen]} laid down · free hull`)}
  else if(a==='reserve'){const h=H.find(x=>x.id==v);h.st=h.st==='reserve'?'pier':'reserve';toast(h.st==='reserve'?`${ic('reserve',15,C.ark)}${hname(h)} kept for the ark`:`${hname(h)} released`)}
  else if(a==='scrap'){const id=+v;if(U.scrapArm===id){const h=H.find(x=>x.id===id);H=H.filter(x=>x.id!==id);U.scrapArm=null;toast(`${ic('scrap',15)}${hname(h)} scrapped · +120 metal`)}else U.scrapArm=id}
  else if(a==='evac'){const w=WI(v);toast(`${ic('evac',15,C.people)}Courier I no.7 sent to lift ${w.f.ppl} people off ${w.n}`,C.people)}
  else if(a==='kitorder'){toast(`${ic('upgrade',15)}Machines ordered for ${WI(v).n} — they ride on the next hull of the line`)}
  else if(a==='who'){const [wid,hid]=v.split(':');U.who[wid]=+hid}
  else if(a==='send'){const w=WI(v),h=H.find(x=>x.id===U.who[v]);if(h){h.line=v;h.st='settlers';h.y=w.ring*5;w.st='settling';toast(`${ic('send',15,C.people)}${hname(h)} carries 52 settlers to ${w.n}`,C.people);drawMap()}}
  else if(a==='driveat')U.driveAt=v;
  else if(a==='note'){U.note=true;U.pop=null}
  else if(a==='noteclose')U.note=false;
  render();
});
document.addEventListener('mouseover',e=>{const g=e.target.closest('#map .wd');const tip=el('tip');if(!g||g.dataset.a!=='world'){tip.className='';return}
  const w=WI(g.dataset.v),r=g.querySelector('circle[fill="transparent"]').getBoundingClientRect(),s=el('mapbox').getBoundingClientRect(),sc=el('stage').getBoundingClientRect().width/1280;const n=H.filter(h=>h.line===w.id).length;
  tip.innerHTML=`${wmark(w.k,w.st!=='free')}<b>${w.n}</b><span>${KIND[w.k]}</span>${w.f.dep?`<em>${res(w.k==='farm'?'food':w.k==='mine'?'metal':'fuel',12)}${w.f.dep}</em>`:''}${w.f.ppl?`<em>${res('people',12)}${w.f.ppl}</em>`:''}<em>${ship('hauler',18)}${n}</em>`;
  tip.style.left=((r.right-s.left)/sc+8)+'px';tip.style.top=((r.top-s.top)/sc-6)+'px';tip.className='on';});
function fit(){const s=Math.min(1,(window.innerWidth-8)/1280);el('stage').style.transform=`scale(${s})`;el('wrap').style.height=(760*s)+'px';el('wrap').style.width=(1280*s)+'px'}
window.addEventListener('resize',fit);
drawMap();render();fit();
</script>
