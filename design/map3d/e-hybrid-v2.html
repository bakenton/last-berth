<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>LAST BERTH · map 3D · E · C×D v2</title>
<link rel="stylesheet" href="../../work/web/fonts.css"><link rel="stylesheet" href="common.css">
<style>#cv{cursor:grab}#cv:active{cursor:grabbing}
.scan{position:fixed;inset:0;pointer-events:none;z-index:2;background:repeating-linear-gradient(0deg,rgba(255,210,63,.02) 0 1px,transparent 1px 3px);mix-blend-mode:screen}
.btns button.tg span{display:inline-block;width:9px;height:9px;margin-left:6px;vertical-align:-1px}</style></head><body>
<canvas id="cv"></canvas><div class="scan"></div>
<script src="data-e.js"></script><script src="common.js"></script>
<script>
/* E v2 · C×D (Nikita 06.11, second round):
   - the floor is C's: dark filled hex cells with thin edges over the whole floor, fading to the rim; the wave from Earth is a quiet ring, the yellow muted;
   - lines are still: no running dots; only the hulls move;
   - metal is cold steel (#8297AE: darker and bluer than the game's #C9CFD6, far from Earth's #4FA3FF); the works stay warm white and wear an orbital ring — a station;
   - a hub (a real one: bank bot, seed 5, year 2800) stands on a dashed hexagon; its lines — feeder → hub and hub → Earth — are double and of their own colour (toggle);
   - spheres: wire (D) or solid lit (C) — toggle;
   - HEIGHT = PEOPLE (a proposal), lines on the floor, foot to foot, as in v1. */
(function(){
var C=M3, M=C.M, cam=C.cam, cv=document.getElementById('cv'), x=cv.getContext('2d'), dpr=1;
C.KCOL.mine='#8297AE';   // the panel and the lines take the steel too
var HUBC=[{n:'VIOLET',c:'#B48CFF'},{n:'ICE',c:'#CFE6FF'},{n:'MAGENTA',c:'#E040FB'}], hubI=0, solid=false;
var TICK=25, H0=14, HK=1.0, RS=11, RF=8;
M.worlds.forEach(function(w){ w.h=w.on?H0+w.pop*HK+RS:RF });
var HUBS={}; M.worlds.forEach(function(w){ if(w.hub) HUBS[w.id]=1 });
C.chrome('E · C×D · WORLDS ON STEMS · V2','CANVAS 2D · HEIGHT = PEOPLE · LINES ON THE FLOOR · HUB: '+(Object.keys(HUBS).length?'REAL RUN':'NONE'));
var bt=document.querySelector('.btns');
bt.insertAdjacentHTML('afterbegin','<button class="tg" data-t="sph">SPHERES: WIRE</button><button class="tg" data-t="hub">HUB LINE<span></span></button>');
function labels(){ bt.querySelector('[data-t=sph]').textContent='SPHERES: '+(solid?'SOLID':'WIRE'); var h=bt.querySelector('[data-t=hub]'); h.firstChild.textContent='HUB LINE: '+HUBC[hubI].n; h.querySelector('span').style.background=HUBC[hubI].c }
bt.addEventListener('click',function(e){ var t=e.target.closest('[data-t]'); if(!t) return; if(t.dataset.t==='sph') solid=!solid; else hubI=(hubI+1)%HUBC.length; labels() }); labels();
cam.minPitch=14;
var portrait=innerWidth/innerHeight<0.8; if(portrait){ cam.pitch=70; cam.tz=0 }
/* the whole chart in the frame with room for the names: back off until every world sits LABEL px inside the sides */
function fitAll(){ var W=innerWidth, H=innerHeight, side=W<600?70:120, top=90, bot=W<600?200:110;
  for(var it=0;it<80;it++){ C.update(W,H); var ok=true;
    M.worlds.forEach(function(w){ var s=C.project([w.px,w.h,w.pz]); if(!s||s.x<side||s.x>W-side||s.y<top||s.y>H-bot) ok=false });
    if(ok) break; cam.dist*=1.05 } }
(function(){ var xs=M.worlds.map(function(w){ return w.px }), zs=M.worlds.map(function(w){ return w.pz });   // aim at the middle of the chart, not at Earth: the chart is lopsided
  cam.tx=(Math.min.apply(null,xs)+Math.max.apply(null,xs))/2; cam.tz=(Math.min.apply(null,zs)+Math.max.apply(null,zs))/2 })();
cam.dist=500; fitAll();
function size(){ dpr=Math.min(devicePixelRatio||1,2); cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; floorKey='' } size(); addEventListener('resize',size);
function rgb(h){ return parseInt(h.slice(1,3),16)+','+parseInt(h.slice(3,5),16)+','+parseInt(h.slice(5,7),16) }
function line(pts,close){ x.beginPath(); var on=false; pts.forEach(function(p){ var s=C.project(p); if(!s){ on=false; return } on?x.lineTo(s.x,s.y):x.moveTo(s.x,s.y); on=true }); if(close) x.closePath() }
function ring(cx,cy,cz,rad,n,a0,a1){ var p=[]; a0=a0||0; a1=a1===undefined?Math.PI*2:a1; for(var i=0;i<=n;i++){ var a=a0+(a1-a0)*i/n; p.push([cx+Math.cos(a)*rad,cy,cz+Math.sin(a)*rad]) } return p }
function glow(col,b){ x.shadowColor='rgba('+col+',.9)'; x.shadowBlur=b } function noglow(){ x.shadowBlur=0 }

/* ---- the floor (C's): filled dark cells with thin edges, drawn once per camera onto its own canvas ---- */
var fl=document.createElement('canvas'), fx=fl.getContext('2d'), floorKey='', HX=[], R=26.5, FR=C.OUTER+340;
for(var r=-45;r<=45;r++) for(var q=-45;q<=45;q++){ var hx=Math.sqrt(3)*R*(q+r/2), hz=1.5*R*r, d=Math.hypot(hx,hz); if(d<FR) HX.push([hx,hz,d]) }
function floor(W,H){ var k=[cam.tx,cam.tz,cam.yaw,cam.pitch,cam.dist,W,H].map(function(v){ return v.toFixed(2) }).join(); if(k===floorKey) return; floorKey=k;
  fl.width=cv.width; fl.height=cv.height; fx.setTransform(dpr,0,0,dpr,0,0); fx.fillStyle='#070707'; fx.fillRect(0,0,W,H);
  HX.forEach(function(h){ var f=Math.max(0,Math.min(1,(FR-h[2])/(FR*0.45))); if(f<0.02) return; var pts=[];
    for(var i=0;i<6;i++){ var a=Math.PI/3*i+Math.PI/6, s=C.project([h[0]+Math.cos(a)*R*.94,0,h[1]+Math.sin(a)*R*.94]); if(!s) return; pts.push(s) }
    fx.beginPath(); pts.forEach(function(p,i){ i?fx.lineTo(p.x,p.y):fx.moveTo(p.x,p.y) }); fx.closePath();
    fx.fillStyle='rgba(28,28,31,'+(0.85*f).toFixed(3)+')'; fx.fill(); fx.strokeStyle='rgba(160,158,150,'+(0.30*f).toFixed(3)+')'; fx.lineWidth=1; fx.stroke() });
  // rings and lobes, warm grey with a hint of the Helm's yellow
  fx.setLineDash([2,5]); M.sectors.forEach(function(sc){ fx.beginPath(); ring(0,0,0,sc.r,140).forEach(function(p,i){ var s=C.project(p); if(s) i?fx.lineTo(s.x,s.y):fx.moveTo(s.x,s.y) }); fx.strokeStyle='rgba(235,220,170,.30)'; fx.stroke() });
  for(var i=0;i<6;i++){ var a=-2.0944+i*1.0472, p=C.project([Math.cos(a)*34,0,Math.sin(a)*34]), q=C.project([Math.cos(a)*(C.OUTER+44),0,Math.sin(a)*(C.OUTER+44)]); if(p&&q){ fx.beginPath(); fx.moveTo(p.x,p.y); fx.lineTo(q.x,q.y); fx.strokeStyle='rgba(235,220,170,.16)'; fx.stroke() } }
  fx.setLineDash([]); fx.font='9px "Geist Mono",monospace'; fx.textAlign='center'; fx.fillStyle='rgba(235,220,170,.45)'; var th=cam.yaw*Math.PI/180;
  M.sectors.forEach(function(sc){ var q=C.project([Math.sin(th)*sc.r,0,Math.cos(th)*sc.r]); if(q) fx.fillText(sc.name,q.x,q.y+12) }) }

/* ---- a world's sphere: wire (D) or solid lit toward Earth (C) ---- */
function sphere(w,cx,cy,cz,rad,col,spin,alpha,bl){ var s=C.project([cx,cy,cz]); if(!s) return null; var pr=rad*C.pxPer(s.w);
  if(solid){ var e=C.project([0,0,0]), dx=e?e.x-s.x:0, dy=e?e.y-s.y:-1, dl=Math.hypot(dx,dy)||1; dx/=dl; dy/=dl;
    var g=x.createRadialGradient(s.x+dx*pr*.38-pr*.1,s.y+dy*pr*.38-pr*.25,pr*.08,s.x,s.y,pr);
    g.addColorStop(0,'rgba(255,255,255,'+alpha+')'); g.addColorStop(.22,'rgba('+col+','+alpha+')'); g.addColorStop(.85,'rgba('+col+','+(alpha*.45)+')'); g.addColorStop(1,'rgba(6,6,6,'+alpha+')');
    glow(col,bl*.8); x.beginPath(); x.arc(s.x,s.y,pr,0,7); x.fillStyle=g; x.fill(); noglow() }
  else { glow(col,bl); x.strokeStyle='rgba('+col+','+alpha+')'; x.lineWidth=1;
    [-0.55,0,0.55].forEach(function(la){ line(ring(cx,cy+Math.sin(la*1.2)*rad,cz,Math.cos(la*1.2)*rad,24)); x.stroke() });
    for(var m=0;m<4;m++){ var a0=spin+m*Math.PI/4, pts=[]; for(var i=0;i<=20;i++){ var b=-Math.PI/2+i/20*Math.PI; pts.push([cx+Math.cos(b)*Math.cos(a0)*rad,cy+Math.sin(b)*rad,cz+Math.cos(b)*Math.sin(a0)*rad]) } line(pts); x.stroke() }
    noglow(); x.beginPath(); x.arc(s.x,s.y,pr,0,7); x.fillStyle='rgba(7,7,6,.55)'; x.fill();
    glow(col,bl*1.4); x.strokeStyle='rgba('+col+','+Math.min(1,alpha*1.5)+')'; x.lineWidth=1.4; x.stroke(); noglow() }
  return {x:s.x,y:s.y,r:pr,w:s.w} }
/* the works' orbital ring, tilted: the half behind the sphere is drawn before it, the half in front after it (by depth against the centre) */
function orbit(w,front,col){ var rr=RS*1.75, tilt=0.38, c=C.project([w.px,w.h,w.pz]); if(!c) return; var P=[];
  for(var i=0;i<=40;i++){ var a=Math.PI*2*i/40, ox=Math.cos(a)*rr, oz=Math.sin(a)*rr; P.push(C.project([w.px+ox,w.h+oz*Math.sin(tilt),w.pz+oz*Math.cos(tilt)])) }
  glow(col,6); x.strokeStyle='rgba('+col+',.9)'; x.lineWidth=1.5; x.beginPath();
  for(var i=0;i<40;i++){ var p=P[i], q=P[i+1]; if(!p||!q) continue; if(((p.w+q.w)/2<c.w)!==front) continue; x.moveTo(p.x,p.y); x.lineTo(q.x,q.y) }
  x.stroke(); noglow();
  if(front){ var k=0, best=1e9; P.forEach(function(p,i){ if(p&&p.w<best){ best=p.w; k=i } }); var m=P[(k+10)%40]; if(m&&m.w<c.w){ x.fillStyle='rgba('+col+',1)'; x.fillRect(m.x-2,m.y-2,4,4) } } }
/* a double line on the floor: two strokes a few px apart across the leg */
function dbl(a,b,col,wd){ var p=C.project(a), q=C.project(b); if(!p||!q) return; var dx=q.x-p.x, dy=q.y-p.y, l=Math.hypot(dx,dy)||1, nx=-dy/l*2.2, ny=dx/l*2.2;
  glow(col,6); x.strokeStyle='rgba('+col+',.95)'; x.lineWidth=wd;
  x.beginPath(); x.moveTo(p.x+nx,p.y+ny); x.lineTo(q.x+nx,q.y+ny); x.moveTo(p.x-nx,p.y-ny); x.lineTo(q.x-nx,q.y-ny); x.stroke(); noglow() }

function draw(now){ C.step(now); var W=innerWidth, H=innerHeight; C.update(W,H); var t=now/1000, sel=C.sel(), hubc=rgb(HUBC[hubI].c);
  floor(W,H); x.setTransform(1,0,0,1,0,0); x.drawImage(fl,0,0); x.setTransform(dpr,0,0,dpr,0,0);
  // the quiet wave: one soft ring going out of Earth every 9 s
  var wr=((t%9)/9)*(C.OUTER+200); line(ring(0,0,0,wr,90)); x.strokeStyle='rgba(255,210,63,'+(0.10*(1-wr/(C.OUTER+200))).toFixed(3)+')'; x.lineWidth=6; x.stroke();
  // footprints
  M.worlds.forEach(function(w){ var col=w.on?rgb(C.KCOL[w.kind]):'156,155,149';
    if(w.ghost){ var g=C.project([w.px,0,w.pz]); if(g){ x.font='13px "Geist Mono",monospace'; x.textAlign='center'; x.fillStyle='rgba(94,93,88,.8)'; x.fillText('×',g.x,g.y+4) } return }
    if(!w.on) x.setLineDash([3,3]); glow(col,w.on?6:0); line(ring(w.px,0,w.pz,13,32)); x.strokeStyle='rgba('+col+','+(w.on?.85:.45)+')'; x.lineWidth=1.3; x.stroke();
    if(w.on){ line(ring(w.px,0,w.pz,19,32)); x.strokeStyle='rgba('+col+',.25)'; x.lineWidth=1; x.stroke() } x.setLineDash([]); noglow();
    if(HUBS[w.id]){ var hp=[]; for(var i=0;i<=6;i++){ var a=Math.PI/3*i; hp.push([w.px+Math.cos(a)*27,0,w.pz+Math.sin(a)*27]) } x.setLineDash([5,3]); glow(hubc,8); line(hp); x.strokeStyle='rgba('+hubc+',.95)'; x.lineWidth=1.8; x.stroke(); x.setLineDash([]); noglow() } });
  // lines: still; a hub's lines double and in the hub colour
  C.routes.forEach(function(r){ var a=C.nodePos(r.a), b=C.nodePos(r.b); a=[a[0],0,a[2]]; b=[b[0],0,b[2]]; var L=Math.hypot(b[0]-a[0],b[2]-a[2]);
    var hubLine=HUBS[r.a]||HUBS[r.b], ua=(r.a==='earth'?26:(HUBS[r.a]?27:14))/L, ub=1-(HUBS[r.b]?27:14)/L;
    var A=[a[0]+(b[0]-a[0])*ua,0,a[2]+(b[2]-a[2])*ua], B=[a[0]+(b[0]-a[0])*ub,0,a[2]+(b[2]-a[2])*ub];
    if(hubLine){ dbl(A,B,hubc,1.3); return }
    var col=rgb(C.KCOL[r.kind]); line([A,B]); glow(col,4); x.strokeStyle='rgba('+col+',.45)'; x.lineWidth=1.3; x.stroke(); noglow() });
  M.ships.forEach(function(s){ var a=C.nodePos(s.from), b=C.nodePos(s.to); if(!a||!b) return; var u=C.shipAt(s,t), u2=Math.min(1,u+0.01),
    p=C.project([a[0]+(b[0]-a[0])*u,0,a[2]+(b[2]-a[2])*u]), q=C.project([a[0]+(b[0]-a[0])*u2,0,a[2]+(b[2]-a[2])*u2]); if(!p||!q) return;
    var n=s.cls==='courier'?3:(s.cls==='hauler'?4:6), ang=Math.atan2(q.y-p.y,q.x-p.x), k=Math.max(.5,Math.min(1,C.pxPer(p.w)*1.4)); x.beginPath();   // hulls shrink with the chart, so a far view is not all hulls
    for(var i=0;i<n;i++){ var aa=ang+Math.PI*2*i/n+(n===4?Math.PI/4:0), rr=(i===0&&n===3?7.5:5.5)*k; var px=p.x+Math.cos(aa)*rr, py=p.y+Math.sin(aa)*rr; i?x.lineTo(px,py):x.moveTo(px,py) } x.closePath();
    x.fillStyle='rgba(7,7,6,.8)'; x.fill(); glow(rgb(C.CLSCOL[s.cls]),6); x.strokeStyle=C.CLSCOL[s.cls]; x.lineWidth=1.5; x.stroke(); noglow(); x.fillStyle='#FFD23F'; x.fillRect(p.x+Math.cos(ang)*7*k-1.5,p.y+Math.sin(ang)*7*k-1.5,3,3) });
  // Earth and the worlds, far first
  var boxes=[], lab=[], list=M.worlds.filter(function(w){ return !w.ghost }).map(function(w){ var s=C.project([w.px,w.h,w.pz]); return s?{w:w,s:s}:null }).filter(Boolean);
  var es=C.project([0,22,0]); if(es) list.push({earth:1,s:es}); list.sort(function(a,b){ return b.s.w-a.s.w });
  list.forEach(function(o){
    if(o.earth){ var e=sphere(null,0,22,0,22,'79,163,255',t*0.3,.8,10); if(!e) return; var ef=C.project([0,0,0]);
      line(ring(0,0,0,26,40)); glow('255,210,63',8); x.strokeStyle='rgba(255,210,63,.7)'; x.lineWidth=1.4; x.stroke(); noglow();
      x.font='600 11px "Geist Mono",monospace'; x.textAlign='center'; x.fillStyle='#4FA3FF'; x.fillText('EARTH',e.x,(ef?Math.max(ef.y,e.y+e.r):e.y+e.r)+18);
      boxes.push({x0:e.x-e.r,x1:e.x+e.r,y0:e.y-e.r,y1:e.y+e.r+20}); if(sel==='earth'){ x.beginPath(); x.arc(e.x,e.y,e.r+6,0,7); x.strokeStyle='#FFD23F'; x.lineWidth=2; x.stroke() } return }
    var w=o.w, col=w.on?rgb(C.KCOL[w.kind]):'156,155,149', rad=w.on?RS:RF, works=w.on&&w.kind==='works';
    if(w.on){ glow(col,6); line([[w.px,0,w.pz],[w.px,w.h-rad,w.pz]]); x.strokeStyle='rgba('+col+',.75)'; x.lineWidth=1.6; x.stroke(); noglow();
      for(var k=TICK;k<=w.pop;k+=TICK){ var p=C.project([w.px,H0+k*HK,w.pz]); if(!p) continue; var tk=4*C.pxPer(p.w)+2.5; x.beginPath(); x.moveTo(p.x-tk,p.y); x.lineTo(p.x+tk,p.y); x.strokeStyle='rgba('+col+',.85)'; x.lineWidth=1.2; x.stroke() } }
    if(works) orbit(w,false,col);
    var s=sphere(w,w.px,w.h,w.pz,rad,col,t*0.5+w.seed*6,w.on?.85:.38,w.on?9:0); if(!s) return;
    if(works) orbit(w,true,col);
    if(sel===w){ x.beginPath(); x.arc(s.x,s.y,s.r*(works?1.9:1)+7,0,7); x.strokeStyle='#FFD23F'; x.lineWidth=2; x.stroke() }
    lab.push({w:w,s:s,rr:s.r*(works?1.8:1)}) });
  // names: never over a world, never off the screen, never on each other
  lab.forEach(function(o){ boxes.push({x0:o.s.x-o.rr,x1:o.s.x+o.rr,y0:o.s.y-o.s.r,y1:o.s.y+o.s.r}) });
  x.textAlign='left'; lab.sort(function(a,b){ return (b.w.on-a.w.on)||(a.s.w-b.s.w) }).forEach(function(o){ var w=o.w, s=o.s, nm=w.name.toUpperCase();
    x.font='10.5px "Geist Mono",monospace'; var tw=x.measureText(nm).width+(w.on?x.measureText(' '+w.pop).width:0), g=(sel===w?9:5)+(o.rr-s.r);
    var cs=[[s.x+s.r+g,s.y-3],[s.x-s.r-g-tw,s.y-3],[s.x-tw/2,s.y-s.r-g-2],[s.x-tw/2,s.y+s.r+14]], ok=null;
    for(var i=0;i<cs.length&&!ok;i++){ var b={x0:cs[i][0]-2,x1:cs[i][0]+tw+2,y0:cs[i][1]-10,y1:cs[i][1]+3};
      if(b.x0<2||b.x1>W-2) continue; if(!boxes.some(function(q){ return b.x0<q.x1&&q.x0<b.x1&&b.y0<q.y1&&q.y0<b.y1 })) ok=b }
    if(!ok) return; boxes.push(ok); x.fillStyle=w.on?'#F2F1EC':'#9C9B95'; x.fillText(nm,ok.x0+2,ok.y1-3);
    if(w.on){ x.fillStyle='#FFD23F'; x.fillText(' '+w.pop,ok.x0+2+x.measureText(nm).width,ok.y1-3) } });
  requestAnimationFrame(draw) }
C.bind(cv,{pick:function(px,py){ C.select(C.pick(px,py,12)) }});
window.E2={hubs:HUBS,solid:function(){ return solid },hubColor:function(){ return HUBC[hubI].n }};
requestAnimationFrame(draw);
})();
</script></body></html>
