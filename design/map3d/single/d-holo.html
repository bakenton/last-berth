(function(){
var M=window.MAP;
var COL={metal:'#C9CFD6',food:'#3DDC84',fuel:'#FF8A1F',parts:'#F2F1EC',people:'#FFD23F',red:'#FF2A1A',earth:'#4FA3FF',ink:'#F2F1EC',mid:'#9C9B95',dim:'#5E5D58',bg:'#0B0B0C',yel:'#FFD23F'};

var CLSCOL={courier:'#45D4E8',hauler:'#FF6FB5',freighter:'#F2F1EC'};
var KNAME={mine:'MINE · METAL',farm:'FARM · FOOD',well:'WELL · FUEL',works:'WORKS · PARTS'};
function hash(s){ var h=2166136261; for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619) } return ((h>>>0)%10000)/10000 }

/* ---- layout: circles, pushed apart ---- */
var W=M.worlds.map(function(w){ var R=M.sectors[w.sec].r; return {w:w,x:Math.cos(w.ang)*R,z:Math.sin(w.ang)*R} });
for(var it=0;it<40;it++){ var moved=false;
  for(var i=0;i<W.length;i++) for(var j=i+1;j<W.length;j++){ var a=W[i],b=W[j],dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz)||0.01;

  if(!moved) break }
var BY={}; W.forEach(function(o){ var w=o.w; w.px=o.x; w.pz=o.z; w.h=0; w.seed=hash(w.id); BY[w.id]=w });
var OUTER=M.sectors[M.sectors.length-1].r;
var routes=[]; M.worlds.forEach(function(w){ if(w.on&&w.line) routes.push({a:w.line,b:w.id,kind:w.kind}) });
function nodePos(id){ if(id==='earth') return [0,0,0]; var w=BY[id]; return w?[w.px,w.h,w.pz]:null }

/* ---- matrices (column-major, like GL) ---- */
function persp(fov,asp,n,f){ var t=1/Math.tan(fov/2), nf=1/(n-f); return [t/asp,0,0,0, 0,t,0,0, 0,0,(f+n)*nf,-1, 0,0,2*f*n*nf,0] }

  return [x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0, -dot(x,e),-dot(y,e),-dot(z,e),1] }
function mul(a,b){ var o=new Array(16); for(var c=0;c<4;c++) for(var r=0;r<4;r++){ var s=0; for(var k=0;k<4;k++) s+=a[k*4+r]*b[c*4+k]; o[c*4+r]=s } return o }
function sub(a,b){ return [a[0]-b[0],a[1]-b[1],a[2]-b[2]] } function dot(a,b){ return a[0]*b[0]+a[1]*b[1]+a[2]*b[2] }

var cam={tx:0,tz:30,yaw:0,pitch:52,dist:1700,fov:38,minPitch:12,maxPitch:89.5,minDist:260,maxDist:7000};
/* the whole chart in the frame: a narrow (phone) screen backs the camera off until the outer ring fits across */
function fitDist(base){ var a=innerWidth/innerHeight, th=Math.tan(cam.fov*Math.PI/360)*a; return Math.max(base,(OUTER+90)/th) }
var view={W:1,H:1,V:null,P:null,VP:null,eye:null};
function update(Wd,Ht){ view.W=Wd; view.H=Ht;
  var ph=cam.pitch*Math.PI/180, th=cam.yaw*Math.PI/180;
  var e=[cam.tx+cam.dist*Math.cos(ph)*Math.sin(th), cam.dist*Math.sin(ph), cam.tz+cam.dist*Math.cos(ph)*Math.cos(th)];

  if(cw<=1) return null; return {x:(cx/cw+1)/2*view.W, y:(1-cy/cw)/2*view.H, w:cw} }

var ptrs={}, gest=null, onChange=function(){}, onPick=function(){}, el=null;
function bind(target,o){ el=target; onChange=o.change||onChange; onPick=o.pick||onPick;
  el.addEventListener('contextmenu',function(e){ e.preventDefault() });
  el.addEventListener('wheel',function(e){ e.preventDefault(); zoom(e.deltaY>0?1.12:0.89) },{passive:false});
  el.addEventListener('pointerdown',function(e){ ptrs[e.pointerId]={x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,t:e.target};
    gest={moved:false,pan:e.button===2||e.shiftKey,n:Object.keys(ptrs).length,target:e.target}; pinch0=null });

    if(ids.length>=2){ var a=ptrs[ids[0]], b=ptrs[ids[1]], d=Math.hypot(a.x-b.x,a.y-b.y);

function pick(x,y,rad){ var best=null, bd=1e9;
  M.worlds.forEach(function(w){ var s=project([w.px,w.h,w.pz]); if(!s) return; var d=Math.hypot(s.x-x,s.y-y), lim=Math.max(16,(rad||10)*pxPer(s.w)+8);

<script>
/* D · the Helm's hologram: the chart as the Helm itself would see it — wire spheres, a hex floor and lines of yellow energy, all on a 2D canvas.
   No GPU, no WebGL: the same projection as A–C, drawn as lines. The trade colours stay on the worlds so the chart reads as the game's. */
(function(){
var C=M3, M=C.M, cam=C.cam, cv=document.getElementById('cv'), x=cv.getContext('2d'), dpr=1;
C.chrome('D · THE HELM\'S HOLOGRAM','CANVAS 2D · WIRE SPHERES · ENERGY LINES · NO GPU');
cam.minPitch=14;
function size(){ dpr=Math.min(devicePixelRatio||1,2); cv.width=innerWidth*dpr; cv.height=innerHeight*dpr } size(); addEventListener('resize',size);
var Y='255,210,63', HX=[], R=26.5;
for(var r=-30;r<=30;r++) for(var q=-30;q<=30;q++){ var hx=Math.sqrt(3)*R*(q+r/2), hz=1.5*R*r, d=Math.hypot(hx,hz); if(d<C.OUTER+160) HX.push([hx,hz,d]) }
function line(pts,close){ x.beginPath(); var on=false; pts.forEach(function(p){ var s=C.project(p); if(!s){ on=false; return } on?x.lineTo(s.x,s.y):x.moveTo(s.x,s.y); on=true }); if(close) x.closePath() }
/* a wire sphere: three parallels and four turning meridians, sampled in 3D */
function wire(cx,cy,cz,rad,col,spin,alpha){
  x.strokeStyle='rgba('+col+','+alpha+')'; x.lineWidth=1;
  [-0.5,0,0.5].forEach(function(la){ var pts=[], rr=Math.cos(la*1.2)*rad, yy=Math.sin(la*1.2)*rad; for(var i=0;i<=24;i++){ var a=i/24*Math.PI*2; pts.push([cx+Math.cos(a)*rr,cy+yy,cz+Math.sin(a)*rr]) } line(pts); x.stroke() });
  for(var m=0;m<4;m++){ var a0=spin+m*Math.PI/4, pts=[]; for(var i=0;i<=20;i++){ var b=-Math.PI/2+i/20*Math.PI; pts.push([cx+Math.cos(b)*Math.cos(a0)*rad,cy+Math.sin(b)*rad,cz+Math.cos(b)*Math.sin(a0)*rad]) } line(pts); x.stroke() }
  var s=C.project([cx,cy,cz]); if(s){ var pr=rad*C.pxPer(s.w); x.beginPath(); x.arc(s.x,s.y,pr,0,7); x.strokeStyle='rgba('+col+','+Math.min(1,alpha*1.6)+')'; x.lineWidth=1.3; x.stroke(); return {x:s.x,y:s.y,r:pr,w:s.w} } }
function rgb(h){ return parseInt(h.slice(1,3),16)+','+parseInt(h.slice(3,5),16)+','+parseInt(h.slice(5,7),16) }
function draw(now){ C.step(now); var W=innerWidth, H=innerHeight; C.update(W,H); var t=now/1000;
  x.setTransform(dpr,0,0,dpr,0,0); x.fillStyle='#070706'; x.fillRect(0,0,W,H);
  // the floor: hexes that brighten in a wave out of Earth, like the Helm's pulse
  x.lineWidth=1; HX.forEach(function(h){ var wave=Math.max(0,Math.cos((h[2]-t*90)/60))*.10, a=(.05+wave)*Math.max(0,1-h[2]/(C.OUTER+160));
    if(a<.01) return; var pts=[]; for(var i=0;i<6;i++){ var aa=Math.PI/3*i+Math.PI/6; pts.push([h[0]+Math.cos(aa)*R*.92,0,h[1]+Math.sin(aa)*R*.92]) } line(pts,true); x.strokeStyle='rgba('+Y+','+a.toFixed(3)+')'; x.stroke() });
  M.sectors.forEach(function(sc){ var pts=[]; for(var i=0;i<=120;i++){ var a=i/120*Math.PI*2; pts.push([Math.cos(a)*sc.r,0,Math.sin(a)*sc.r]) } x.setLineDash([2,5]); line(pts); x.strokeStyle='rgba('+Y+',.38)'; x.stroke(); x.setLineDash([]);
    var th=cam.yaw*Math.PI/180, q=C.project([Math.sin(th)*sc.r,0,Math.cos(th)*sc.r]); if(q){ x.font='9px "Geist Mono",monospace'; x.textAlign='center'; x.fillStyle='rgba('+Y+',.55)'; x.fillText(sc.name,q.x,q.y+12) } });
  for(var i=0;i<6;i++){ var a=-2.0944+i*1.0472; x.setLineDash([1.5,5]); line([[Math.cos(a)*34,0,Math.sin(a)*34],[Math.cos(a)*(C.OUTER+44),0,Math.sin(a)*(C.OUTER+44)]]); x.strokeStyle='rgba('+Y+',.22)'; x.stroke(); x.setLineDash([]) }
  // lines: a beam of energy with pulses running along it, in the trade's colour
  C.routes.forEach(function(r){ var a=C.nodePos(r.a), b=C.nodePos(r.b), pts=[]; for(var i=0;i<=30;i++){ var u=i/30; pts.push([a[0]+(b[0]-a[0])*u,0,a[2]+(b[2]-a[2])*u]) }
    var col=rgb(C.KCOL[r.kind]); line(pts); x.strokeStyle='rgba('+col+',.35)'; x.lineWidth=1.2; x.stroke();
    for(var k=0;k<3;k++){ var u=((t*0.12+k/3+C.hash(r.b))%1), p=C.project([a[0]+(b[0]-a[0])*u,0,a[2]+(b[2]-a[2])*u]); if(p){ x.fillStyle='rgba('+col+',.9)'; x.fillRect(p.x-1.2,p.y-1.2,2.4,2.4) } } });
  M.ships.forEach(function(s){ var a=C.nodePos(s.from), b=C.nodePos(s.to); if(!a||!b) return; var u=C.shipAt(s,t), u2=Math.min(1,u+0.01),
    p=C.project([a[0]+(b[0]-a[0])*u,0,a[2]+(b[2]-a[2])*u]), q=C.project([a[0]+(b[0]-a[0])*u2,0,a[2]+(b[2]-a[2])*u2]); if(!p||!q) return;
    var n=s.cls==='courier'?3:(s.cls==='hauler'?4:6), ang=Math.atan2(q.y-p.y,q.x-p.x); x.beginPath();
    for(var i=0;i<n;i++){ var aa=ang+Math.PI*2*i/n+(n===4?Math.PI/4:0), rr=i===0&&n===3?7.5:5.5; var px=p.x+Math.cos(aa)*rr, py=p.y+Math.sin(aa)*rr; i?x.lineTo(px,py):x.moveTo(px,py) } x.closePath();
    x.strokeStyle=C.CLSCOL[s.cls]; x.lineWidth=1.4; x.stroke(); x.fillStyle='#FFD23F'; x.fillRect(p.x+Math.cos(ang)*7-1.5,p.y+Math.sin(ang)*7-1.5,3,3) });
  // worlds, far first
  var sel=C.sel(), list=M.worlds.map(function(w){ var s=C.project([w.px,10,w.pz]); return s?{w:w,s:s}:null }).filter(Boolean).sort(function(a,b){ return b.s.w-a.s.w });
  var e=wire(0,22,0,22,'79,163,255',t*0.3,.7); if(e){ x.beginPath(); x.arc(e.x,e.y,e.r*1.45,0,7); x.strokeStyle='rgba('+Y+',.5)'; x.setLineDash([2,4]); x.stroke(); x.setLineDash([]);
    x.font='600 11px "Geist Mono",monospace'; x.textAlign='center'; x.fillStyle='#4FA3FF'; x.fillText('EARTH',e.x,e.y+e.r*1.45+20); if(sel==='earth'){ x.beginPath(); x.arc(e.x,e.y,e.r*1.45+5,0,7); x.strokeStyle='#FFD23F'; x.lineWidth=2; x.stroke() } }
  x.font='10.5px "Geist Mono",monospace'; x.textAlign='left';
  list.forEach(function(o){ var w=o.w, rad=Math.max(8/C.pxPer(o.s.w),w.on?12:9), col=w.on?rgb(C.KCOL[w.kind]):(w.ghost?'94,93,88':'156,155,149');
    var s=wire(w.px,rad,w.pz,rad,col,t*0.5+w.seed*6,w.on?.75:(w.ghost?.2:.4)); if(!s) return;
    var g=C.project([w.px,0,w.pz]); if(g){ x.beginPath(); x.moveTo(s.x,s.y+s.r); x.lineTo(g.x,g.y); x.strokeStyle='rgba('+col+',.3)'; x.lineWidth=1; x.stroke() }
    if(sel===w){ x.beginPath(); x.arc(s.x,s.y,s.r+7,0,7); x.strokeStyle='#FFD23F'; x.lineWidth=2; x.stroke() }
    x.globalAlpha=w.ghost?.4:1; x.fillStyle=w.on?'#F2F1EC':'#9C9B95'; x.fillText(w.name.toUpperCase(),s.x+s.r+5,s.y-4); x.globalAlpha=1 });
  requestAnimationFrame(draw) }
/* the worlds of D float a radius over the plane: picking looks at their centres */
M.worlds.forEach(function(w){ w.h=w.on?12:9 });
C.bind(cv,{pick:function(px,py){ C.select(C.pick(px,py,10)) }});
requestAnimationFrame(draw);
})();
</script></body></html>
