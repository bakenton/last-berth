/* ---- layout: circles, pushed apart ---- */

/* ---- input: drag = turn, right drag / shift / two fingers = move, wheel / pinch = zoom, a tap = pick ---- */

}
var pinch0=null, anim=null;
function turn(dx,dy){ cam.yaw-=dx*0.25; cam.pitch=Math.max(cam.minPitch,Math.min(cam.maxPitch,cam.pitch+dy*0.25)); onChange() }

function pick(x,y,rad){ var best=null, bd=1e9;
  M.worlds.forEach(function(w){ var s=project([w.px,w.h,w.pz]); if(!s) return; var d=Math.hypot(s.x-x,s.y-y), lim=Math.max(16,(rad||10)*pxPer(s.w)+8);

  if(!best){ var e=project([0,0,0]); if(e&&Math.hypot(e.x-x,e.y-y)<Math.max(20,22*pxPer(e.w))) best='earth' }

<script>
/* E v3 · C×D (Nikita 06.11, third round):

   - spheres: wire or solid (toggle, not chosen yet); HEIGHT = PEOPLE (a proposal), lines on the floor, foot to foot. Data: bank bot, seed 5, year 2800; ?run=2 — ark bot, seed 7, year 3200 (feeders of mixed trades). */
(function(){

var bt=document.querySelector('.btns');
bt.insertAdjacentHTML('afterbegin','<button class="tg" data-t="sph">SPHERES: WIRE</button><button class="tg" data-t="run">'+(RUN2?'RUN 2 · ARK 7':'RUN 1 · BANK 5')+'</button>');
function labels(){ bt.querySelector('[data-t=sph]').textContent='SPHERES: '+(solid?'SOLID':'WIRE') }
bt.addEventListener('click',function(e){ var t=e.target.closest('[data-t]'); if(!t) return; if(t.dataset.t==='run'){ location.search=RUN2?'':'?run=2'; return } solid=!solid; labels() }); labels();
cam.minPitch=14;
var portrait=innerWidth/innerHeight<0.8; if(portrait){ cam.pitch=70; cam.tz=0 }
/* the whole chart in the frame with room for the names: back off until every world sits LABEL px inside the sides */
function fitAll(){ var W=innerWidth, H=innerHeight, side=W<600?70:120, top=90, bot=W<600?200:110;
  for(var it=0;it<80;it++){ C.update(W,H); var ok=true;
    M.worlds.forEach(function(w){ var s=C.project([w.px,w.h,w.pz]); if(!s||s.x<side||s.x>W-side||s.y<top||s.y>H-bot) ok=false });
    if(ok) break; cam.dist*=1.05 } }
(function(){ var xs=M.worlds.map(function(w){ return w.px }), zs=M.worlds.map(function(w){ return w.pz });   // aim at the middle of the chart, not at Earth: the chart is lopsided
  cam.tx=(Math.min.apply(null,xs)+Math.max.apply(null,xs))/2; cam.tz=(Math.min.apply(null,zs)+Math.max.apply(null,zs))/2 })();
cam.dist=500; fitAll();
function size(){ dpr=Math.min(devicePixelRatio||1,2); cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; floorKey=''; if(NEB) space() } size(); addEventListener('resize',size);
function rgb(h){ return parseInt(h.slice(1,3),16)+','+parseInt(h.slice(3,5),16)+','+parseInt(h.slice(5,7),16) }
function line(pts,close){ x.beginPath(); var on=false; pts.forEach(function(p){ var s=C.project(p); if(!s){ on=false; return } on?x.lineTo(s.x,s.y):x.moveTo(s.x,s.y); on=true }); if(close) x.closePath() }
function ring(cx,cy,cz,rad,n,a0,a1){ var p=[]; a0=a0||0; a1=a1===undefined?Math.PI*2:a1; for(var i=0;i<=n;i++){ var a=a0+(a1-a0)*i/n; p.push([cx+Math.cos(a)*rad,cy,cz+Math.sin(a)*rad]) } return p }
function glow(col,b){ x.shadowColor='rgba('+col+',.9)'; x.shadowBlur=b } function noglow(){ x.shadowBlur=0 }

/* ---- the floor (C's): filled dark cells with thin edges, drawn once per camera onto its own canvas ---- */
var fl=document.createElement('canvas'), fx=fl.getContext('2d'), floorKey='', HX=[], R=46, FR=C.OUTER+420;   // v3: plates 46 (were 26.5)
for(var r=-30;r<=30;r++) for(var q=-30;q<=30;q++){ var hx=Math.sqrt(3)*R*(q+r/2), hz=1.5*R*r, d=Math.hypot(hx,hz); if(d<FR) HX.push([hx,hz,d]) }
function floor(W,H){ var k=[cam.tx,cam.tz,cam.yaw,cam.pitch,cam.dist,W,H].map(function(v){ return v.toFixed(2) }).join(); if(k===floorKey) return; floorKey=k;
  fl.width=cv.width; fl.height=cv.height; fx.setTransform(dpr,0,0,dpr,0,0); fx.clearRect(0,0,W,H);

/* ---- space: three star layers and a nebula, rendered once; drawn each frame with a little parallax ---- */
var LAY=[], NEB=document.createElement('canvas');

  n.fillStyle='#050506'; n.fillRect(0,0,NEB.width,NEB.height);
  [['70,40,120',.13],['40,70,130',.10],['90,40,110',.08],['30,50,90',.10],['60,30,100',.07]].forEach(function(c){ var cx=r()*NEB.width, cy=r()*NEB.height*.8, rad=(.25+r()*.35)*Math.max(NEB.width,NEB.height);
    var g=n.createRadialGradient(cx,cy,0,cx,cy,rad); g.addColorStop(0,'rgba('+c[0]+','+c[1]+')'); g.addColorStop(.5,'rgba('+c[0]+','+(c[1]*.4)+')'); g.addColorStop(1,'rgba('+c[0]+',0)'); n.fillStyle=g; n.fillRect(0,0,NEB.width,NEB.height) }) }

function sky(W,H){ var yaw=cam.yaw, pit=cam.pitch, span=W*0.4;

function sphere(w,cx,cy,cz,rad,col,spin,alpha,bl,body){ body=body||col; var s=C.project([cx,cy,cz]); if(!s) return null; var pr=rad*C.pxPer(s.w);
