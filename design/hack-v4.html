<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HELM — взлом, змей и рой (прототип)</title>
<!-- Прототип мини-игры «сбой Пульта», v4 (02.11.2026, по слову Никиты: из девяти вариантов остаются змей и рой; змею нужен рельеф, сам он идёт сквозь стены; в змея — мелочь из роя; сложность прогрессивная).
     Черновик вне игры: work/, лист текстов и Notion не тронуты.
     Змей: 6 уровней, на каждом одна новая вещь. Рой: как в v3, 3 уровня. ?m=worm&lv=4 — сразу открыть. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0B0C;--pan:#141417;--ln:#2E2E33;--ink:#F2F1EC;--mid:#9C9B95;--dim:#5E5D58;--red:#FF2A1A;--food:#3DDC84;--ppl:#FFD23F;--fuel:#FF8A1F;--h:'Jost',system-ui,sans-serif;--n:'Geist Mono',ui-monospace,Consolas,monospace}
html,body{margin:0;height:100%;background:#050506;color:var(--ink);font-family:var(--n);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.ctl{position:fixed;right:12px;bottom:10px;display:flex;gap:6px;font-size:12px;align-items:center;color:var(--dim);z-index:5}
.ctl button{background:none;border:1px solid var(--ln);color:var(--mid);font:inherit;min-width:30px;height:30px;padding:0 8px;cursor:pointer}
.ctl button.on{border-color:var(--ppl);color:var(--ppl)}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(11,11,12,.92);text-align:center;padding:24px 16px 56px;box-sizing:border-box;overflow-y:auto;touch-action:pan-y}
.ov.hide{display:none}
h1{font-family:var(--h);font-weight:700;letter-spacing:.22em;font-size:20px;margin:0;line-height:1.35}
.fresh{color:var(--ppl);font-size:14px;line-height:1.5;max-width:520px}
.fresh:empty{display:none}
.lost h1{color:var(--red)}
.sub{color:var(--mid);font-size:13px}
.rules{color:var(--mid);font-size:13px;line-height:1.9;max-width:520px}
.rules .o{color:var(--fuel)}.rules .r{color:var(--red)}.rules .y{color:var(--ink)}
.go{background:none;border:1px solid var(--ink);color:var(--ink);font-family:var(--h);font-weight:600;font-size:14px;letter-spacing:.22em;padding:11px 30px;cursor:pointer;margin-top:4px}
.go:hover{background:var(--ink);color:var(--bg)}
.go.q{border-color:var(--ln);color:var(--mid);font-size:12px;padding:8px 20px}
.lost .go.m{border-color:var(--red);color:var(--red)}.lost .go.m:hover{background:var(--red);color:var(--bg)}
.lore{max-width:360px;width:100%;text-align:left;font-size:13px;line-height:1.7;min-height:5em;white-space:pre-wrap}
.lore .y{color:var(--ppl)}.lore .m{color:var(--mid)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%;max-width:640px}
@media (max-width:720px){.grid{grid-template-columns:1fr}.ov{justify-content:flex-start}}
.card{background:var(--pan);border:1px solid var(--ln);color:var(--ink);font:inherit;text-align:left;padding:10px 12px;cursor:pointer;min-height:84px}
.card:hover{border-color:var(--ppl)}
.card b{display:block;font-family:var(--h);font-weight:700;letter-spacing:.16em;font-size:14px;margin-bottom:4px}
.card b i{font-style:normal;color:var(--dim);margin-right:8px}
.card span{color:var(--mid);font-size:12px;line-height:1.45;display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ctl"><span data-k="lvl"></span><button data-lv="1">1</button><button data-lv="2">2</button><button data-lv="3">3</button><button data-lv="4">4</button><button data-lv="5">5</button><button data-lv="6">6</button><button id="lang">EN</button></div>

<div class="ov" id="ovMenu">
  <h1 data-k="menu"></h1>
  <div class="sub" data-k="menuSub"></div>
  <div class="grid" id="grid"></div>
</div>
<div class="ov hide" id="ovIntro">
  <h1 id="inName"></h1>
  <div class="fresh" id="inNew"></div>
  <div class="rules"><div class="y" id="inD"></div><div data-k="r1"></div><div id="inR"></div><div class="o" data-k="r3"></div><div class="r" data-k="r4"></div></div>
  <button class="go" id="bGo" data-k="go"></button>
  <button class="go q" data-act="menu" data-k="toMenu"></button>
</div>
<div class="ov lost hide" id="ovLost">
  <h1 data-k="lost"></h1>
  <div class="sub" data-k="lostSub"></div>
  <button class="go m" id="bRetry" data-k="retry"></button>
  <button class="go q" data-act="menu" data-k="toMenu"></button>
</div>
<div class="ov hide" id="ovWon">
  <div class="lore" id="lore"></div>
  <button class="go" id="bNext" data-k="next" style="visibility:hidden"></button>
  <button class="go q" id="bBack" data-k="back" style="visibility:hidden"></button>
</div>

<script>
(function(){
'use strict';
// Тексты прототипа. В игре они уйдут в лист (texts-add); здесь — только чтобы смотреть.
var T={
 ru:{lvl:'ур.',menu:'СБОЙ',menuSub:'Два варианта. Цифра на клавиатуре или щелчок.',toMenu:'К ВАРИАНТАМ',
  r1:'WASD — ход · мышь — прицел · огонь сам',r1t:'веди пальцем · прицел и огонь сами',r3:'оранжевое можно сбить',r4:'красное — только уйти',
  go:'ВОЙТИ',lost:'СВЯЗЬ ПОТЕРЯНА',lostSub:'Сбой держит команду.',retry:'ЕЩЁ РАЗ',back:'К ВАРИАНТАМ',next:'ДАЛЬШЕ',
  won:['КОМАНДА ПРОСНУЛАСЬ: КОРПУС.ПОК.II','Восстановлено: 1 блок памяти.','','«Файл чертежа. Автор: этот модуль.\nДата: раньше моей первой записи.»','','Суда второго поколения можно заказывать.'],
  step:['ОТРЕЗОК {a} ИЗ {b} ВОССТАНОВЛЕН','Дальше сбой сложнее.'],
  worm:{n:'ЗМЕЙ',d:'Цепь гонится за тобой напрямик, сквозь стены. Заходи ей в хвост.',r:'ранит только жёлтый хвост · голова уязвима последней · телом цепь бьёт · стены держат тебя и пули, но не змея',st:'ЗМЕЙ',
   fresh:['Новое: стены. Змей идёт сквозь них, ты — нет.','Новое: звенья стреляют. Стена закрывает от пуль, звено в стене молчит.','Новое: мелочь. Она ищет обход, а оборванное звено выпускает ещё.','Новое: рывки и вязкие полосы, в которых ты теряешь скорость.','Новое: большие распадаются на малых, голова бьёт красным.','Новое: голова срезает путь, мелочи больше, появляются стрелки.']},
  swarm:{n:'РОЙ',d:'Босса нет. Волны лезут со всех сторон.',r:'заполни шкалу сбитыми · шестигранники стреляют · стрелки делают рывок',st:'РОЙ'}},
 en:{lvl:'lvl',menu:'FAULT',menuSub:'Two variants. Press a number or click.',toMenu:'TO VARIANTS',
  r1:'WASD — move · mouse — aim · fire is automatic',r1t:'drag to move · aim and fire are automatic',r3:'orange can be shot down',r4:'red — only dodge',
  go:'ENTER',lost:'SIGNAL LOST',lostSub:'The fault holds the command.',retry:'RETRY',back:'TO VARIANTS',next:'NEXT',
  won:['COMMAND WOKE: HULL.GEN.II','Recovered: 1 memory block.','','"Design file. Author: this unit.\nDate: earlier than my first record."','','Generation II hulls can be ordered.'],
  step:['SEGMENT {a} OF {b} RECOVERED','The fault gets harder from here.'],
  worm:{n:'SERPENT',d:'A chain hunts you straight through the walls. Get behind it.',r:'only the yellow tail takes damage · the head is last · the body hurts · walls stop you and all fire, not the serpent',st:'SERPENT',
   fresh:['New: walls. The serpent goes through them, you do not.','New: links fire. A wall gives cover, a link inside a wall stays silent.','New: small ones. They path around walls, and a broken link releases more.','New: dashes and thick strips that cost you speed.','New: big ones split into small ones, the head fires red.','New: the head cuts you off, more small ones, shooters appear.']},
  swarm:{n:'SWARM',d:'No boss. Waves from every side.',r:'fill the bar with kills · hexagons shoot · arrows dash',st:'SWARM'}}
};
var ORDER=['worm','swarm'];
var lang='ru';
var COARSE=!!(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
function applyLang(){
  document.documentElement.lang=lang;
  [].forEach.call(document.querySelectorAll('[data-k]'),function(e){ var k=e.getAttribute('data-k'); e.textContent=T[lang][k==='r1'&&COARSE?'r1t':k] });
  document.getElementById('lang').textContent=lang==='ru'?'EN':'RU';
  var g=document.getElementById('grid'); g.innerHTML='';
  ORDER.forEach(function(id,i){ var b=document.createElement('button'); b.className='card'; b.setAttribute('data-m',id);
    var h=document.createElement('b'), n=document.createElement('i'), s=document.createElement('span');
    n.textContent=i+1; h.appendChild(n); h.appendChild(document.createTextNode(T[lang][id].n)); s.textContent=T[lang][id].d;
    b.appendChild(h); b.appendChild(s); b.onclick=function(){ pick(id) }; g.appendChild(b) });
  document.getElementById('inName').textContent=T[lang][mode].n; document.getElementById('inD').textContent=T[lang][mode].d; document.getElementById('inR').textContent=T[lang][mode].r;
  var fr=T[lang][mode].fresh; document.getElementById('inNew').textContent=fr?fr[lv-1]:'';
}

var HP=3, SPEED=300, FIRE=.09, SHOT=900, INV=1.2, R_ME=5, TAU=Math.PI*2;
function rng(seed){ var s=(seed>>>0)||1; return function(){ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296 } }
function clamp(v,a,b){ return v<a?a:v>b?b:v }
function dist(a,b,c,d){ return Math.hypot(a-c,b-d) }
function angDiff(a,b){ return ((a-b+Math.PI)%TAU+TAU)%TAU-Math.PI }
var AW=960, AH=600, G=null, attempt=0;
var Q=new URLSearchParams(location.search), lv=+Q.get('lv')||1, mode=ORDER.indexOf(Q.get('m'))>=0?Q.get('m'):'worm';
function lvCount(){ return Object.keys(MODES[mode].lv).length }
var input={mx:0,my:0,ax:480,ay:300,auto:COARSE,world:false};

function newRun(seed){
  var M=MODES[mode]; attempt++; orient();
  G={id:mode,M:M,P:M.lv[lv],t:0,state:'play',rnd:rng(seed||(104729*lv+attempt*2731+ORDER.indexOf(mode)*7919)),hitstop:0,shake:0,glitch:0,
     WW:AW,WH:AH,cam:{x:0,y:0},bnd:null,me:{x:AW/2,y:AH-70,hp:HP,inv:1,fire:0,ang:-Math.PI/2},
     shots:[],bul:[],en:[],walls:[],zones:[],fx:[],spark:0,dieT:0,dx:0,dy:0};
  M.init(G,G.P); camera();
}
function orient(){ var p=innerHeight>innerWidth; AW=p?600:960; AH=p?960:600 }
function bullet(x,y,a,sp,k){ G.bul.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,k:k}) }
function aimed(x,y,tx,ty,n,spr,sp,k){ var a=Math.atan2(ty-y,tx-x), side=G.rnd()<.5?-1:1; for(var q=0;q<n;q++){ var o=n%2?(q-(n-1)/2):(q-(n/2-1))*side; bullet(x,y,a+o*spr,sp,k) } } // чётный залп: одна пуля точно в цель, иначе стоять на месте безопасно
function ring(x,y,n,gap,gw,sp,k){ for(var j=0;j<n;j++){ var a=j/n*TAU; if(Math.abs(angDiff(a,gap))>gw) bullet(x,y,a,sp,k) } }
function burst(x,y,col,n,sp){ for(var i=0;i<n;i++){ var a=G.rnd()*TAU, s=sp*(.3+G.rnd()*.7); G.fx.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0,life:.3+G.rnd()*.4,col:col}) } }
function wallAt(x,y,pad){ pad=pad||0; for(var i=0;i<G.walls.length;i++){ var w=G.walls[i]; if(x>w.x-pad&&x<w.x+w.w+pad&&y>w.y-pad&&y<w.y+w.h+pad) return w } return null }
function los(x0,y0,x1,y1){ var d=dist(x0,y0,x1,y1), n=Math.ceil(d/12); for(var i=1;i<n;i++){ if(wallAt(x0+(x1-x0)*i/n,y0+(y1-y0)*i/n)) return false } return true }
function hurt(){
  var m=G.me; if(m.inv>0||G.state!=='play') return;
  m.hp--; m.inv=INV; G.hitstop=.09; G.shake=14; G.glitch=.3; beep(90,.25,.07,'sawtooth');
  burst(m.x,m.y,'#F2F1EC',16,260);
  G.bul=G.bul.filter(function(b){ return dist(b.x,b.y,m.x,m.y)>130 });
  if(m.hp<=0) lose();
}
function lose(){ G.state='lost'; burst(G.me.x,G.me.y,'#FF2A1A',40,380); onEnd('lost') }
function win(x,y){ G.dx=x; G.dy=y; G.dieT=1.2; G.state='dying'; G.bul.forEach(function(b){ burst(b.x,b.y,b.k==='r'?'#FF2A1A':'#FF8A1F',1,90) }); G.bul=[]; G.en=[]; G.zones=[]; G.shake=22; G.glitch=.6; beep(60,.9,.09,'sawtooth') }
function kill(e){ var i=G.en.indexOf(e); if(i>=0) G.en.splice(i,1); burst(e.x,e.y,e.goal?'#F2F1EC':'#C9CFD6',e.goal?26:12,e.goal?340:240); if(e.goal){ G.hitstop=.05; G.shake=8; beep(150,.2,.06,'sawtooth') } else beep(240,.08,.04); if(G.M.onKill) G.M.onKill(G,e) }
function hitEnemy(e){ e.hp--; e.flash=.07; G.spark++; if(G.spark%3===0) beep(320+200*(1-e.hp/(e.max||e.hp||1)),.03,.018); if(G.M.onHit) G.M.onHit(G,e); if(G.state==='play'&&e.hp<=0) kill(e) }
function goals(){ return G.en.filter(function(e){ return e.goal }) }
function goalPart(){ var a=0,b=0; G.en.forEach(function(e){ if(e.goal) a+=e.hp }); return a/G.goalHp }

function enemy(o){ o.flash=0; o.max=o.hp; o.tell=0; o.seen=0; o.rot=0; G.en.push(o); return o }
function turret(x,y,hp,every,n,sp,o){ o=o||{}; o.kind='turret'; o.x=x; o.y=y; o.r=o.r||16; o.hp=hp; o.every=every; o.n=n; o.sp=sp; o.fire=o.fire||(.8+G.rnd()*every); return enemy(o) }
function chaser(x,y,sp,o){ o=o||{}; o.kind=o.kind||'chaser'; if(G.grid&&wallAt(x,y,8)){ var fc=nearFree(G,x,y); x=cellX(fc); y=cellY(fc) } o.x=x; o.y=y; o.r=o.r||10; o.hp=o.hp||3; o.sp=sp; o.touch=1; o.die1=1; return enemy(o) }

function step1(e,dx,dy){ var p=e.r*.4; if(!wallAt(e.x+dx,e.y,p)) e.x+=dx; if(!wallAt(e.x,e.y+dy,p)) e.y+=dy } // шаг с обтеканием стен
// Поведение врагов. Цель — корабль.
var AI={
 turret:function(e,dt){ var t=G.me; e.fire-=dt; e.tell=clamp(1-e.fire/.35,0,1);
   if(e.dr){ e.x=clamp(e.x+e.dr[0]*dt,40,G.WW-40); e.y=clamp(e.y+e.dr[1]*dt,40,G.WH-40); if(e.x<=40||e.x>=G.WW-40) e.dr[0]=-e.dr[0]; if(e.y<=40||e.y>=G.WH-40) e.dr[1]=-e.dr[1] }
   if(e.fire<=0){ if((e.range&&dist(e.x,e.y,t.x,t.y)>e.range)||(G.walls.length&&!los(e.x,e.y,t.x,t.y))){ e.fire=.45; return }
     e.fire=e.every*(.85+G.rnd()*.3); aimed(e.x,e.y,t.x,t.y,e.n,.22,e.sp,'o') } },
 chaser:function(e,dt){ var t=G.me, a=Math.atan2(t.y-e.y,t.x-e.x);
   if(G.flow&&!los(e.x,e.y,t.x,t.y)){ var n=G.flow[cellAt(e.x,e.y)]; if(n>=0) a=Math.atan2(cellY(n)-e.y,cellX(n)-e.x) }
   step1(e,Math.cos(a)*e.sp*dt,Math.sin(a)*e.sp*dt); e.rot+=dt*5 },
 dasher:function(e,dt){ e.st=e.st||0; e.tm=(e.tm===undefined?.6+G.rnd():e.tm)-dt; var m=G.me;
   if(e.st===0){ var a0=Math.atan2(m.y-e.y,m.x-e.x); e.a=a0; step1(e,Math.cos(a0)*50*dt,Math.sin(a0)*50*dt); if(e.tm<=0){ e.st=1; e.tm=.55; beep(500,.06,.015) } }
   else if(e.st===1){ if(e.tm<=0){ e.st=2; e.tm=.42 } }
   else { var px=e.x, py=e.y; step1(e,Math.cos(e.a)*e.sp*dt,Math.sin(e.a)*e.sp*dt); e.x=clamp(e.x,10,G.WW-10); e.y=clamp(e.y,10,G.WH-10); if(e.tm<=0||(e.x===px&&e.y===py)){ e.st=0; e.tm=.9+G.rnd() } } },
 splitter:function(e,dt){ AI.chaser(e,dt) },
 small:function(e,dt){ AI.chaser(e,dt) }
};

// Мелочь, общая для роя и змея: метка на поле → враг; большой распадается на три малых.
function hatch(z,sp,bs,drift){
  if(z.sp==='chaser') chaser(z.x,z.y,sp+G.rnd()*22,{hp:2,cnt:1});
  else if(z.sp==='dasher') enemy({kind:'dasher',x:z.x,y:z.y,r:11,hp:3,sp:540,touch:1,cnt:1});
  else if(z.sp==='splitter') chaser(z.x,z.y,sp*.62,{kind:'splitter',r:15,hp:6,cnt:2});
  else turret(z.x,z.y,4,1.9,1,bs,{cnt:2,r:15,dr:drift?[(G.rnd()-.5)*90,(G.rnd()-.5)*90]:null,fire:1}) }
function broke(e,sp){ for(var i=0;i<3;i++){ var a=i/3*TAU+G.rnd(); chaser(e.x+Math.cos(a)*16,e.y+Math.sin(a)*16,sp*1.15,{kind:'small',r:7,hp:1,cnt:0}) } }

// ——— Варианты: init (раскладка), step (правила), part/label (шкала), targets/way (для прицела на телефоне и ботов) ———
var MODES={};

// Рельеф змея: стены и помехи стоят на сетке 60×60, крайний ряд всегда свободен, карта всегда связна.
var GS=60;
var SHAPES={post:[[[0,0,2,2]],[[0,0,1,1]]],bar:[[[0,0,4,1]],[[0,0,1,4]]],long:[[[0,0,7,1]],[[0,0,1,6]]],
 ell:[[[0,0,4,1],[0,0,1,3]],[[0,0,4,1],[3,0,1,3]],[[0,2,4,1],[0,0,1,3]],[[0,2,4,1],[3,0,1,3]]],
 tee:[[[0,0,5,1],[2,0,1,3]],[[0,2,5,1],[2,0,1,3]],[[0,0,1,5],[0,2,3,1]],[[2,0,1,5],[0,2,3,1]]]};
function cellAt(x,y){ return clamp(Math.floor(x/GS),0,G.GC-1)+clamp(Math.floor(y/GS),0,G.GR-1)*G.GC }
function cellX(c){ return (c%G.GC+.5)*GS }
function cellY(c){ return (((c/G.GC)|0)+.5)*GS }
function linked(grid,GC,GR){ var from=-1, n=0, i, seen=[]; for(i=0;i<GC*GR;i++){ seen.push(0); if(!grid[i]){ n++; if(from<0) from=i } }
  var q=[from], got=1; seen[from]=1; while(q.length){ var c=q.pop(), nb=[]; if(c%GC>0) nb.push(c-1); if(c%GC<GC-1) nb.push(c+1); if(c>=GC) nb.push(c-GC); if(c+GC<GC*GR) nb.push(c+GC);
    nb.forEach(function(k){ if(!seen[k]&&!grid[k]){ seen[k]=1; got++; q.push(k) } }) } return got===n }
function terrain(G,P){ var GC=Math.round(AW/GS), GR=Math.round(AH/GS), grid=[], i, sx=Math.floor(G.me.x/GS), sy=Math.floor(G.me.y/GS);
  G.GC=GC; G.GR=GR; for(i=0;i<GC*GR;i++) grid.push(0);
  (P.ter||[]).forEach(function(kind){ for(var tr=0;tr<40;tr++){ var vs=SHAPES[kind], v=vs[(G.rnd()*vs.length)|0], w=0, h=0; v.forEach(function(r){ w=Math.max(w,r[0]+r[2]); h=Math.max(h,r[1]+r[3]) });
      if(w>GC-2||h>GR-2) continue; var x0=1+((G.rnd()*(GC-1-w))|0), y0=1+((G.rnd()*(GR-1-h))|0), ok=true, cs=[];
      v.forEach(function(r){ for(var y=y0+r[1];y<y0+r[1]+r[3];y++) for(var x=x0+r[0];x<x0+r[0]+r[2];x++) cs.push([x,y]) });

  if(G.state!=='play') return;
  if(G.hitstop>0){ G.hitstop-=dt; return }
  G.t+=dt;

  var mag=Math.hypot(input.mx,input.my)||1, k=Math.min(1,Math.hypot(input.mx,input.my)), sl=M.slow?M.slow(G):1, dx=input.mx/mag*k*SPEED*sl*dt, dy=input.my/mag*k*SPEED*sl*dt;

  var nx=clamp(m.x+dx,B.x0,B.x1); if(!wallAt(nx,m.y,6)) m.x=nx;

      G.shots.splice(i,1); if(b.k==='o'){ burst(b.x,b.y,'#FF8A1F',5,170); G.bul.splice(j,1) } else burst(s.x,s.y,'#FF2A1A',2,90); continue shots } }

   ngon(6,3+(e.r-6)*(e.hp/e.max),e.rot); cx.fillStyle=e.tell>0?'rgb(255,'+Math.round(210-72*e.tell)+','+Math.round(63-32*e.tell)+')':(big?'#FFD23F':'#F2F1EC'); cx.fill() },
 chaser:function(e){ cx.translate(e.x,e.y); cx.rotate(e.rot); cx.fillStyle=e.flash>0?'#F2F1EC':'#C9CFD6'; cx.fillRect(-8,-8,16,16); cx.fillStyle='#0B0B0C'; cx.fillRect(-3,-3,6,6) },
 small:function(e){ cx.translate(e.x,e.y); cx.rotate(e.rot); cx.fillStyle=e.flash>0?'#F2F1EC':'#C9CFD6'; cx.fillRect(-5,-5,10,10) },
 splitter:function(e){ cx.translate(e.x,e.y); cx.rotate(e.rot*.4); cx.strokeStyle=e.flash>0?'#F2F1EC':'#C9CFD6'; cx.lineWidth=2.5; cx.strokeRect(-12,-12,24,24); cx.fillStyle='#C9CFD6'; cx.fillRect(-4,-4,8,8) },
 dasher:function(e,now){ if(e.st===1){ var la=e.a; cx.strokeStyle='rgba(255,42,26,.6)'; cx.lineWidth=1; cx.setLineDash([6,5]); cx.beginPath(); cx.moveTo(e.x,e.y); cx.lineTo(e.x+Math.cos(la)*230,e.y+Math.sin(la)*230); cx.stroke(); cx.setLineDash([]) }
   cx.translate(e.x,e.y); cx.rotate(e.a||0); cx.beginPath(); cx.moveTo(14,0); cx.lineTo(-10,-10); cx.lineTo(-10,10); cx.closePath(); cx.fillStyle=e.flash>0?'#F2F1EC':(e.st?'#FF8A1F':'#C9CFD6'); cx.fill() },
 head:function(e){ cx.translate(e.x,e.y); cx.rotate(e.a); ngon(3,e.r+3,0); cx.fillStyle=e.flash>0?'#F2F1EC':(e.arm?'#0B0B0C':'#FFD23F'); cx.fill(); cx.strokeStyle=e.arm?'#F2F1EC':'#FFD23F'; cx.lineWidth=2.5; cx.stroke() },
 seg:function(e){ cx.translate(e.x,e.y); ngon(8,e.r,Math.PI/8); cx.fillStyle=e.flash>0?'#F2F1EC':(e.arm?'#141417':'#FFD23F'); cx.fill(); cx.strokeStyle=e.arm?'#9C9B95':'#FFD23F'; cx.lineWidth=2; cx.stroke() }
};

function draw(now){
  cx.setTransform(DPR,0,0,DPR,0,0); cx.fillStyle='#050506'; cx.fillRect(0,0,W,H);
  if(!G) return;
  var sx=G.shake?(Math.random()-.5)*G.shake:0, sy=G.shake?(Math.random()-.5)*G.shake:0, m=G.me, i;
  cx.translate(OX+sx,OY+sy); cx.scale(K,K);
  cx.fillStyle='#0B0B0C'; cx.fillRect(0,0,AW,AH);
  cx.save(); cx.beginPath(); cx.rect(0,0,AW,AH); cx.clip();
  cx.translate(-G.cam.x,-G.cam.y);
  // фон: точки
  cx.fillStyle='rgba(156,155,149,.22)'; for(var gx=0;gx<AW+60;gx+=60) for(var gy=0;gy<AH+60;gy+=60) cx.fillRect(gx,gy,1.5,1.5);
  // помехи: косая штриховка, корабль здесь вязнет
  (G.mud||[]).forEach(function(q){ cx.fillStyle='rgba(79,163,255,.07)'; cx.fillRect(q.x,q.y,q.w,q.h); cx.save(); cx.beginPath(); cx.rect(q.x,q.y,q.w,q.h); cx.clip(); cx.strokeStyle='rgba(79,163,255,.32)'; cx.lineWidth=1; cx.beginPath(); for(var hh=-q.h;hh<q.w;hh+=14){ cx.moveTo(q.x+hh,q.y+q.h); cx.lineTo(q.x+hh+q.h,q.y) } cx.stroke(); cx.restore() });
  // зоны
  G.zones.forEach(function(z){ if(z.k==='mark'){ cx.strokeStyle='rgba(255,42,26,'+(.3+.5*Math.abs(Math.sin(now/90)))+')'; cx.lineWidth=2; cx.beginPath(); cx.moveTo(z.x-8,z.y-8); cx.lineTo(z.x+8,z.y+8); cx.moveTo(z.x+8,z.y-8); cx.lineTo(z.x-8,z.y+8); cx.stroke() }
    else if(z.k==='red'){ cx.strokeStyle='#FF2A1A'; cx.lineWidth=2; if(z.t>0){ cx.setLineDash([5,6]); cx.beginPath(); cx.arc(z.x,z.y,z.r*(1-z.t*.25),0,7); cx.stroke(); cx.setLineDash([]) } else { cx.fillStyle='rgba(255,42,26,.28)'; cx.beginPath(); cx.arc(z.x,z.y,z.r,0,7); cx.fill(); cx.stroke() } } });
  // стены: заливка и общий контур, фигуры из нескольких прямоугольников читаются одной
  cx.fillStyle='#17171B'; G.walls.forEach(function(w){ cx.fillRect(w.x,w.y,w.w,w.h) });
  if(G.grid){ cx.strokeStyle='#5E5D58'; cx.lineWidth=1.5; cx.beginPath(); for(i=0;i<G.grid.length;i++){ if(!G.grid[i]) continue; var gcx=i%G.GC, gcy=(i/G.GC)|0, a0=gcx*GS, b0=gcy*GS;
      if(gcx===0||!G.grid[i-1]){ cx.moveTo(a0,b0); cx.lineTo(a0,b0+GS) } if(gcx===G.GC-1||!G.grid[i+1]){ cx.moveTo(a0+GS,b0); cx.lineTo(a0+GS,b0+GS) } if(gcy===0||!G.grid[i-G.GC]){ cx.moveTo(a0,b0); cx.lineTo(a0+GS,b0) } if(gcy===G.GR-1||!G.grid[i+G.GC]){ cx.moveTo(a0,b0+GS); cx.lineTo(a0+GS,b0+GS) } } cx.stroke() }
  // змей: связка
  if(G.id==='worm'&&G.head&&G.state==='play'){ cx.strokeStyle='rgba(156,155,149,.5)'; cx.lineWidth=2; cx.beginPath(); cx.moveTo(G.head.x,G.head.y); G.segs.forEach(function(s){ cx.lineTo(s.x,s.y) }); cx.stroke() }
  // враги
  G.en.forEach(function(e){ if(!DR[e.kind]) return; cx.save(); if((e.kind==='seg'||e.kind==='head')&&wallAt(e.x,e.y)) cx.globalAlpha=.4; DR[e.kind](e,now); cx.restore() }); // в стене змей приглушён: туда не попасть
  // пули: оранжевое — круг, красное — ромб
  G.bul.forEach(function(b){
    if(b.k==='o'){ cx.fillStyle='#FF8A1F'; cx.beginPath(); cx.arc(b.x,b.y,6,0,7); cx.fill(); cx.fillStyle='#FFD9A8'; cx.beginPath(); cx.arc(b.x,b.y,2.5,0,7); cx.fill() }
    else { cx.save(); cx.translate(b.x,b.y); cx.rotate(Math.PI/4); cx.fillStyle='#FF2A1A'; cx.fillRect(-5.5,-5.5,11,11); cx.fillStyle='#0B0B0C'; cx.fillRect(-1.8,-1.8,3.6,3.6); cx.restore() } });
  // выстрелы
  cx.lineWidth=2.5; cx.lineCap='round';
  cx.strokeStyle='#FFF6D0'; cx.beginPath(); G.shots.forEach(function(s){ cx.moveTo(s.x,s.y); cx.lineTo(s.x-s.vx*.016,s.y-s.vy*.016) }); cx.stroke();
  cx.lineCap='butt';
  // корабль
  if(G.state==='play'&&!(m.inv>0&&Math.floor(now/70)%2)){ ship(m.x,m.y,m.ang,'#F2F1EC'); cx.fillStyle='#FF2A1A'; cx.fillRect(m.x-1.5,m.y-1.5,3,3) }
  // искры
  G.fx.forEach(function(f){ cx.globalAlpha=1-f.t/f.life; cx.fillStyle=f.col; cx.fillRect(f.x-2,f.y-2,4,4) }); cx.globalAlpha=1;
  cx.restore();
  cx.strokeStyle='#2E2E33'; cx.lineWidth=1/K; cx.strokeRect(0,0,AW,AH);
  // сводка: этап, шкала, жизни
  cx.setTransform(DPR,0,0,DPR,0,0);
  var bw=AW*K, tx=OX, ty=OY-22;
  cx.font='700 12px Jost,system-ui,sans-serif'; cx.textBaseline='middle'; cx.textAlign='left'; cx.fillStyle='#F2F1EC';
  var lbl=G.M.label(G); cx.fillText(lbl,tx,ty);
  var hbx=tx+78, hbw=Math.max(40,bw-78-70), part=G.state==='play'?G.M.part(G):0;
  cx.fillStyle='#202024'; cx.fillRect(hbx,ty-2,hbw,4); cx.fillStyle='#FFD23F'; cx.fillRect(hbx,ty-2,hbw*Math.max(0,part),4);
  for(i=0;i<HP;i++){ var px=tx+bw-52+i*20; cx.beginPath(); cx.moveTo(px+7,ty); cx.lineTo(px-5,ty-6); cx.lineTo(px-5,ty+6); cx.closePath(); if(i<m.hp){ cx.fillStyle='#F2F1EC'; cx.fill() } else { cx.strokeStyle='#5E5D58'; cx.lineWidth=1; cx.stroke() } }
  // срыв изображения при попадании
  if(G.glitch>0){ for(var s=0;s<5;s++){ var y2=Math.random()*H*DPR, gh2=(6+Math.random()*26)*DPR, dx2=(Math.random()-.5)*44*DPR; try{ cx.setTransform(1,0,0,1,0,0); cx.drawImage(cv,0,y2,W*DPR,gh2,dx2,y2,W*DPR,gh2) }catch(e){} } cx.setTransform(DPR,0,0,DPR,0,0) }
}

// ——— окна ———
function show(id){ ['ovMenu','ovIntro','ovLost','ovWon'].forEach(function(o){ document.getElementById(o).classList.toggle('hide',o!==id) }) }
var endT=0;
function onEnd(kind){ if(SIM) return; clearTimeout(endT); endT=setTimeout(function(){ if(kind==='lost') show('ovLost'); else { show('ovWon'); typeLore() } },kind==='lost'?420:500) }
var loreTimer=0;
function typeLore(){
  var box=document.getElementById('lore'), more=lv<lvCount(), lines=more?T[lang].step.map(function(l){ return l.replace('{a}',lv).replace('{b}',lvCount()) }):T[lang].won, text=lines.join('\n'), n=0, back=document.getElementById('bBack'), nx=document.getElementById('bNext');
  back.style.visibility='hidden'; nx.style.visibility='hidden'; nx.style.display=more?'':'none'; clearInterval(loreTimer);
  loreTimer=setInterval(function(){
    n+=2; var s=text.slice(0,n), out=s.split('\n').map(function(l,ix){ var cl=ix===0?'y':ix===1||ix===6?'m':''; return '<span class="'+cl+'">'+l.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</span>' }).join('\n');
    box.innerHTML=out+(n<text.length?'<span class="y">▌</span>':'');
    if(n>=text.length){ clearInterval(loreTimer); back.style.visibility='visible'; nx.style.visibility='visible' }
  },24);
}
function go(){ audio(); newRun(); show(null) }
function idle(){ clearInterval(loreTimer); clearTimeout(endT); newRun(); G.state='intro' }
function menu(){ idle(); show('ovMenu'); hudLv() }
function intro(){ idle(); applyLang(); show('ovIntro'); hudLv() }
function pick(id){ mode=id; lv=clamp(lv,1,lvCount()); intro() }
function hudLv(){ [].forEach.call(document.querySelectorAll('[data-lv]'),function(b){ var n=+b.getAttribute('data-lv'); b.classList.toggle('on',n===lv); b.style.display=n<=lvCount()?'':'none' }) }
document.getElementById('bGo').onclick=go;
document.getElementById('bRetry').onclick=go;
document.getElementById('bBack').onclick=menu;
document.getElementById('bNext').onclick=function(){ lv=clamp(lv+1,1,lvCount()); intro() };
[].forEach.call(document.querySelectorAll('[data-act="menu"]'),function(b){ b.onclick=menu });
document.getElementById('lang').onclick=function(){ lang=lang==='ru'?'en':'ru'; applyLang(); if(G&&G.state==='won') typeLore() };
[].forEach.call(document.querySelectorAll('[data-lv]'),function(b){ b.onclick=function(){ lv=+b.getAttribute('data-lv'); b.blur(); var inMenu=!document.getElementById('ovMenu').classList.contains('hide'); if(inMenu){ hudLv() } else intro() } });

// ——— управление ———
var keys={}, KEYMAP={KeyW:[0,-1],ArrowUp:[0,-1],KeyS:[0,1],ArrowDown:[0,1],KeyA:[-1,0],ArrowLeft:[-1,0],KeyD:[1,0],ArrowRight:[1,0]};
function readKeys(){ var x=0,y=0; for(var k in keys) if(keys[k]&&KEYMAP[k]){ x+=KEYMAP[k][0]; y+=KEYMAP[k][1] } input.mx=x; input.my=y }
addEventListener('keydown',function(e){
  if(KEYMAP[e.code]){ keys[e.code]=1; readKeys(); e.preventDefault() }
  var menuOn=!document.getElementById('ovMenu').classList.contains('hide');
  if(menuOn&&/^Digit[1-9]$/.test(e.code)&&ORDER[+e.code.slice(5)-1]){ pick(ORDER[+e.code.slice(5)-1]); return }
  if(e.code==='Escape'&&G){ menu(); return }
  if((e.code==='Enter'||e.code==='Space')&&G&&!menuOn){ if(G.state==='intro'||G.state==='lost') go(); e.preventDefault() }
});
addEventListener('keyup',function(e){ if(KEYMAP[e.code]){ keys[e.code]=0; readKeys() } });
function toView(e){ return [(e.clientX-OX)/K,(e.clientY-OY)/K] }
var touch=null;
cv.addEventListener('pointerdown',function(e){ audio(); if(e.pointerType==='touch'){ input.auto=true; touch={x:e.clientX,y:e.clientY}; try{ cv.setPointerCapture(e.pointerId) }catch(_){} } });
cv.addEventListener('pointermove',function(e){
  if(e.pointerType==='touch'){ if(touch&&G&&G.state==='play'){ var m=G.me, B=G.bnd||{x0:10,x1:G.WW-10,y0:10,y1:G.WH-10}, sl=G.M.slow?G.M.slow(G):1, nx=clamp(m.x+(e.clientX-touch.x)/K*1.5*sl,B.x0,B.x1), ny=clamp(m.y+(e.clientY-touch.y)/K*1.5*sl,B.y0,B.y1); if(!wallAt(nx,m.y,6)) m.x=nx; if(!wallAt(m.x,ny,6)) m.y=ny; touch.x=e.clientX; touch.y=e.clientY } return }
  input.auto=false; var p=toView(e); input.ax=p[0]; input.ay=p[1];
});
cv.addEventListener('pointerup',function(){ touch=null }); cv.addEventListener('pointercancel',function(){ touch=null });

// Прогон без рисунка, для ботов: шаг 1/60, бот сам ставит input (прицел — в координатах мира).
var SIM=false;
function sim(id,level,seed,bot,maxT){
  var keepM=mode, keepLv=lv, keepG=G, keepIn=input; SIM=true; MUTE=true; mode=id; lv=level; input={mx:0,my:0,ax:AW/2,ay:AH/2,auto:false,world:true};
  newRun(seed); var steps=0;
  while((G.state==='play'||G.state==='dying')&&G.t<maxT&&steps<maxT*60+400){ bot(G,input); update(1/60); steps++ }
  var pt=0; if(G.state!=='won') { try{ pt=G.M.part(G) }catch(e){} }
  var out={r:G.state==='won'?'won':G.state==='lost'?'lost':'timeout',t:+G.t.toFixed(1),hp:G.me.hp,left:+pt.toFixed(2)};
  G=keepG; mode=keepM; lv=keepLv; input=keepIn; SIM=false; MUTE=false; return out;
}

addEventListener('resize',resize);
lv=clamp(lv,1,lvCount()); applyLang(); resize();
if(Q.get('m')) intro(); else menu();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(resize);
window.HACK={get G(){return G},get input(){return input},sim:sim,targets:targets,way:function(g){ return g.M.way?g.M.way(g):null },aim:function(){ return null },ORDER:ORDER,MODES:MODES,get K(){return K},get OX(){return OX},get OY(){return OY},pick:pick};
var last=0;
(function frame(now){ var dt=Math.min(.04,(now-(last||now))/1000); last=now; if(G) update(dt); draw(now); requestAnimationFrame(frame) })(0);
})();
</script>
