<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HELM — взлом, варианты (прототип)</title>
<!-- Прототип мини-игры «сбой Пульта», v3 (01.11.2026, по слову Никиты: стрелялка лучше платы, но нужны разные вариации, а не «штука в центре», и ровнее сложность).
     Черновик вне игры: work/, лист текстов и Notion не тронуты. Девять разных сбоев на одном управлении и одной стрельбе:
     1 ядро · 2 лабиринт · 3 змей · 4 рой · 5 зеркало · 6 радар · 7 рикошет · 8 конвой · 9 прорыв.
     ?m=worm&lv=2 — сразу открыть вариант. Раскладка меняется с каждой попыткой. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0B0C;--pan:#141417;--ln:#2E2E33;--ink:#F2F1EC;--mid:#9C9B95;--dim:#5E5D58;--red:#FF2A1A;--food:#3DDC84;--ppl:#FFD23F;--fuel:#FF8A1F;--h:'Jost',system-ui,sans-serif;--n:'Geist Mono',ui-monospace,Consolas,monospace}
html,body{margin:0;height:100%;background:#050506;color:var(--ink);font-family:var(--n);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.ctl{position:fixed;right:12px;bottom:10px;display:flex;gap:6px;font-size:12px;align-items:center;color:var(--dim);z-index:5}
.ctl button{background:none;border:1px solid var(--ln);color:var(--mid);font:inherit;min-width:30px;height:30px;padding:0 8px;cursor:pointer}
.ctl button.on{border-color:var(--ppl);color:var(--ppl)}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(11,11,12,.92);text-align:center;padding:24px 16px 56px;box-sizing:border-box;overflow-y:auto;touch-action:pan-y}
.ov.hide{display:none}
h1{font-family:var(--h);font-weight:700;letter-spacing:.22em;font-size:20px;margin:0;line-height:1.35}
.lost h1{color:var(--red)}
.sub{color:var(--mid);font-size:13px}
.rules{color:var(--mid);font-size:13px;line-height:1.9;max-width:520px}
.rules .o{color:var(--fuel)}.rules .r{color:var(--red)}.rules .y{color:var(--ink)}
.go{background:none;border:1px solid var(--ink);color:var(--ink);font-family:var(--h);font-weight:600;font-size:14px;letter-spacing:.22em;padding:11px 30px;cursor:pointer;margin-top:4px}
.go:hover{background:var(--ink);color:var(--bg)}
.go.q{border-color:var(--ln);color:var(--mid);font-size:12px;padding:8px 20px}
.lost .go.m{border-color:var(--red);color:var(--red)}.lost .go.m:hover{background:var(--red);color:var(--bg)}
.lore{max-width:360px;width:100%;text-align:left;font-size:13px;line-height:1.7;min-height:9.5em;white-space:pre-wrap}
.lore .y{color:var(--ppl)}.lore .m{color:var(--mid)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;max-width:880px}
@media (max-width:720px){.grid{grid-template-columns:1fr}.ov{justify-content:flex-start}}
.card{background:var(--pan);border:1px solid var(--ln);color:var(--ink);font:inherit;text-align:left;padding:10px 12px;cursor:pointer;min-height:84px}
.card:hover{border-color:var(--ppl)}
.card b{display:block;font-family:var(--h);font-weight:700;letter-spacing:.16em;font-size:14px;margin-bottom:4px}
.card b i{font-style:normal;color:var(--dim);margin-right:8px}
.card span{color:var(--mid);font-size:12px;line-height:1.45;display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ctl"><span data-k="lvl"></span><button data-lv="1">1</button><button data-lv="2">2</button><button data-lv="3">3</button><button id="lang">EN</button></div>

<div class="ov" id="ovMenu">
  <h1 data-k="menu"></h1>
  <div class="sub" data-k="menuSub"></div>
  <div class="grid" id="grid"></div>
</div>
<div class="ov hide" id="ovIntro">
  <h1 id="inName"></h1>
  <div class="rules"><div class="y" id="inD"></div><div data-k="r1"></div><div id="inR"></div><div class="o" data-k="r3"></div><div class="r" data-k="r4"></div></div>
  <button class="go" id="bGo" data-k="go"></button>
  <button class="go q" data-act="menu" data-k="toMenu"></button>
</div>
<div class="ov lost hide" id="ovLost">
  <h1 data-k="lost"></h1>
  <div class="sub" data-k="lostSub"></div>
  <button class="go m" id="bRetry" data-k="retry"></button>
  <button class="go q" data-act="menu" data-k="toMenu"></button>
</div>
<div class="ov hide" id="ovWon">
  <div class="lore" id="lore"></div>
  <button class="go" id="bBack" data-k="back" style="visibility:hidden"></button>
</div>

<script>
(function(){
'use strict';
// Тексты прототипа. В игре они уйдут в лист (texts-add); здесь — только чтобы смотреть.
var T={
 ru:{lvl:'ур.',menu:'СБОЙ',menuSub:'Девять вариантов. Цифра на клавиатуре или щелчок.',toMenu:'К ВАРИАНТАМ',
  r1:'WASD — ход · мышь — прицел · огонь сам',r1t:'веди пальцем · прицел и огонь сами',r3:'оранжевое можно сбить',r4:'красное — только уйти',
  go:'ВОЙТИ',lost:'СВЯЗЬ ПОТЕРЯНА',lostSub:'Сбой держит команду.',retry:'ЕЩЁ РАЗ',back:'К ПУЛЬТУ',
  won:['КОМАНДА ПРОСНУЛАСЬ: КОРПУС.ПОК.II','Восстановлено: 1 блок памяти.','','«Файл чертежа. Автор: этот модуль.\nДата: раньше моей первой записи.»','','Суда второго поколения можно заказывать.'],
  core:{n:'ЯДРО',d:'Основа из прошлого черновика. Босс на месте, три этапа.',r:'сбей узлы · стреляй сквозь разрывы щита · добей ядро',st:['УЗЛЫ','ЩИТ','ЯДРО']},
  maze:{n:'ЛАБИРИНТ',d:'Карта больше экрана. Узлы спрятаны в коридорах.',r:'стрелки у края показывают узлы · стены держат пули, твои и чужие',st:'УЗЛЫ'},
  worm:{n:'ЗМЕЙ',d:'Цепь гоняется за тобой. Заходи ей в хвост.',r:'ранит только жёлтый хвост · голова уязвима последней · телом цепь бьёт',st:'ЗМЕЙ'},
  swarm:{n:'РОЙ',d:'Босса нет. Волны лезут со всех сторон.',r:'заполни шкалу сбитыми · шестигранники стреляют · стрелки делают рывок',st:'РОЙ'},
  mirror:{n:'ЗЕРКАЛО',d:'Копия повторяет твой ход зеркально.',r:'щит копии падает на жёлтой площадке · веди её туда своим ходом · красные круги на твоей стороне жгут',st:'КОПИЯ'},
  radar:{n:'РАДАР',d:'Темно. Импульс на миг показывает, что вокруг.',r:'узлы выдают себя вспышкой выстрела · мины не видны, пока их не коснётся импульс',st:'УЗЛЫ'},
  rico:{n:'РИКОШЕТ',d:'Ядро ранит только отскочивший выстрел.',r:'целься в стены: пунктир показывает отскок · лучи ядра вращаются, тонкая линия — предупреждение',st:'ЯДРО'},
  convoy:{n:'КОНВОЙ',d:'Доведи жёлтый пакет до конца линии.',r:'сбивай пули, летящие в пакет · пакет стоит перед затором, пока его не сломаешь',st:'ПАКЕТ'},
  breach:{n:'ПРОРЫВ',d:'Экран сам едет вперёд. Ищи проходы.',r:'стена прижмёт к краю — минус жизнь · перед замком экран ждёт: сломай замок',st:'ПУТЬ'}},
 en:{lvl:'lvl',menu:'FAULT',menuSub:'Nine variants. Press a number or click.',toMenu:'TO VARIANTS',
  r1:'WASD — move · mouse — aim · fire is automatic',r1t:'drag to move · aim and fire are automatic',r3:'orange can be shot down',r4:'red — only dodge',
  go:'ENTER',lost:'SIGNAL LOST',lostSub:'The fault holds the command.',retry:'RETRY',back:'BACK TO HELM',
  won:['COMMAND WOKE: HULL.GEN.II','Recovered: 1 memory block.','','"Design file. Author: this unit.\nDate: earlier than my first record."','','Generation II hulls can be ordered.'],
  core:{n:'CORE',d:'The base from the last draft. A boss in place, three stages.',r:'shoot the nodes · fire through the shield gaps · finish the core',st:['NODES','SHIELD','CORE']},
  maze:{n:'MAZE',d:'The map is bigger than the screen. Nodes hide in corridors.',r:'edge arrows point to nodes · walls stop all fire',st:'NODES'},
  worm:{n:'SERPENT',d:'A chain hunts you. Get behind it.',r:'only the yellow tail takes damage · the head is last · the body hurts',st:'SERPENT'},
  swarm:{n:'SWARM',d:'No boss. Waves from every side.',r:'fill the bar with kills · hexagons shoot · arrows dash',st:'SWARM'},
  mirror:{n:'MIRROR',d:'A copy mirrors your every move.',r:'its shield drops on the yellow pad · steer it there by moving · red circles on your side burn',st:'COPY'},
  radar:{n:'RADAR',d:'Dark. A pulse shows what is around for a moment.',r:'nodes give themselves away when firing · mines stay hidden until the pulse touches them',st:'NODES'},
  rico:{n:'RICOCHET',d:'Only a bounced shot hurts the core.',r:'aim at walls: the dotted line shows the bounce · beams rotate, a thin line is the warning',st:'CORE'},
  convoy:{n:'CONVOY',d:'Bring the yellow packet to the end of the line.',r:'shoot down what flies at it · it waits at a jam until you break it',st:'PACKET'},
  breach:{n:'BREACH',d:'The screen moves on its own. Find the way through.',r:'a wall that pins you to the edge costs a life · the screen waits at a lock: break it',st:'PATH'}}
};
var ORDER=['core','maze','worm','swarm','mirror','radar','rico','convoy','breach'];
var lang='ru';
var COARSE=!!(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
function applyLang(){
  document.documentElement.lang=lang;
  [].forEach.call(document.querySelectorAll('[data-k]'),function(e){ var k=e.getAttribute('data-k'); e.textContent=T[lang][k==='r1'&&COARSE?'r1t':k] });
  document.getElementById('lang').textContent=lang==='ru'?'EN':'RU';
  var g=document.getElementById('grid'); g.innerHTML='';
  ORDER.forEach(function(id,i){ var b=document.createElement('button'); b.className='card'; b.setAttribute('data-m',id);
    var h=document.createElement('b'), n=document.createElement('i'), s=document.createElement('span');
    n.textContent=i+1; h.appendChild(n); h.appendChild(document.createTextNode(T[lang][id].n)); s.textContent=T[lang][id].d;
    b.appendChild(h); b.appendChild(s); b.onclick=function(){ pick(id) }; g.appendChild(b) });
  document.getElementById('inName').textContent=T[lang][mode].n; document.getElementById('inD').textContent=T[lang][mode].d; document.getElementById('inR').textContent=T[lang][mode].r;
}

var HP=3, SPEED=300, FIRE=.09, SHOT=900, INV=1.2, R_ME=5, TAU=Math.PI*2;
function rng(seed){ var s=(seed>>>0)||1; return function(){ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296 } }
function clamp(v,a,b){ return v<a?a:v>b?b:v }
function dist(a,b,c,d){ return Math.hypot(a-c,b-d) }
function angDiff(a,b){ return ((a-b+Math.PI)%TAU+TAU)%TAU-Math.PI }
var AW=960, AH=600, G=null, attempt=0;
var Q=new URLSearchParams(location.search), lv=+Q.get('lv')||1, mode=ORDER.indexOf(Q.get('m'))>=0?Q.get('m'):'core';
if(lv<1||lv>3) lv=1;
var input={mx:0,my:0,ax:480,ay:300,auto:COARSE,world:false};

function newRun(seed){
  var M=MODES[mode]; attempt++; orient();
  G={id:mode,M:M,P:M.lv[lv],t:0,state:'play',rnd:rng(seed||(104729*lv+attempt*2731+ORDER.indexOf(mode)*7919)),hitstop:0,shake:0,glitch:0,
     WW:AW,WH:AH,cam:{x:0,y:0},bnd:null,me:{x:AW/2,y:AH-70,hp:HP,inv:1,fire:0,ang:-Math.PI/2},
     shots:[],bul:[],en:[],walls:[],beams:[],zones:[],fx:[],pulses:[],spark:0,bounce:0,dark:false,dieT:0,dx:0,dy:0};
  M.init(G,G.P); camera();
}
function orient(){ var p=innerHeight>innerWidth; AW=p?600:960; AH=p?960:600 }
function bullet(x,y,a,sp,k){ G.bul.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,k:k}) }
function aimed(x,y,tx,ty,n,spr,sp,k){ var a=Math.atan2(ty-y,tx-x), side=G.rnd()<.5?-1:1; for(var q=0;q<n;q++){ var o=n%2?(q-(n-1)/2):(q-(n/2-1))*side; bullet(x,y,a+o*spr,sp,k) } } // чётный залп: одна пуля точно в цель, иначе стоять на месте безопасно
function ring(x,y,n,gap,gw,sp,k){ for(var j=0;j<n;j++){ var a=j/n*TAU; if(Math.abs(angDiff(a,gap))>gw) bullet(x,y,a,sp,k) } }
function burst(x,y,col,n,sp){ for(var i=0;i<n;i++){ var a=G.rnd()*TAU, s=sp*(.3+G.rnd()*.7); G.fx.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0,life:.3+G.rnd()*.4,col:col}) } }
function wallAt(x,y,pad){ pad=pad||0; for(var i=0;i<G.walls.length;i++){ var w=G.walls[i]; if(x>w.x-pad&&x<w.x+w.w+pad&&y>w.y-pad&&y<w.y+w.h+pad) return w } return null }
function los(x0,y0,x1,y1){ var d=dist(x0,y0,x1,y1), n=Math.ceil(d/12); for(var i=1;i<n;i++){ if(wallAt(x0+(x1-x0)*i/n,y0+(y1-y0)*i/n)) return false } return true }
function hurt(){
  var m=G.me; if(m.inv>0||G.state!=='play') return;
  m.hp--; m.inv=INV; G.hitstop=.09; G.shake=14; G.glitch=.3; beep(90,.25,.07,'sawtooth');
  burst(m.x,m.y,'#F2F1EC',16,260);
  G.bul=G.bul.filter(function(b){ return dist(b.x,b.y,m.x,m.y)>130 });
  if(m.hp<=0) lose();
}
function lose(){ G.state='lost'; burst(G.me.x,G.me.y,'#FF2A1A',40,380); onEnd('lost') }
function win(x,y){ G.dx=x; G.dy=y; G.dieT=1.2; G.state='dying'; G.bul.forEach(function(b){ burst(b.x,b.y,b.k==='r'?'#FF2A1A':'#FF8A1F',1,90) }); G.bul=[]; G.en=[]; G.beams=[]; G.zones=[]; G.shake=22; G.glitch=.6; beep(60,.9,.09,'sawtooth') }
function kill(e){ var i=G.en.indexOf(e); if(i>=0) G.en.splice(i,1); burst(e.x,e.y,e.goal?'#F2F1EC':'#C9CFD6',e.goal?26:12,e.goal?340:240); if(e.goal){ G.hitstop=.05; G.shake=8; beep(150,.2,.06,'sawtooth') } else beep(240,.08,.04); if(G.M.onKill) G.M.onKill(G,e) }
function hitEnemy(e){ e.hp--; e.flash=.07; G.spark++; if(G.spark%3===0) beep(320+200*(1-e.hp/(e.max||e.hp||1)),.03,.018); if(G.M.onHit) G.M.onHit(G,e); if(G.state==='play'&&e.hp<=0) kill(e) }
function goals(){ return G.en.filter(function(e){ return e.goal }) }
function goalPart(){ var a=0,b=0; G.en.forEach(function(e){ if(e.goal) a+=e.hp }); return a/G.goalHp }

function enemy(o){ o.flash=0; o.max=o.hp; o.tell=0; o.seen=0; o.rot=0; G.en.push(o); return o }
function turret(x,y,hp,every,n,sp,o){ o=o||{}; o.kind='turret'; o.x=x; o.y=y; o.r=o.r||16; o.hp=hp; o.every=every; o.n=n; o.sp=sp; o.fire=o.fire||(.8+G.rnd()*every); return enemy(o) }
function chaser(x,y,sp,o){ o=o||{}; o.kind=o.kind||'chaser'; o.x=x; o.y=y; o.r=o.r||10; o.hp=o.hp||3; o.sp=sp; o.touch=1; o.die1=1; return enemy(o) }

// Поведение врагов. Цель — корабль или пакет конвоя (e.tgt).
var AI={
 turret:function(e,dt){ var t=e.tgt?G.pack:G.me; e.fire-=dt; e.tell=clamp(1-e.fire/.35,0,1);
   if(e.dr){ e.x=clamp(e.x+e.dr[0]*dt,40,G.WW-40); e.y=clamp(e.y+e.dr[1]*dt,40,G.WH-40); if(e.x<=40||e.x>=G.WW-40) e.dr[0]=-e.dr[0]; if(e.y<=40||e.y>=G.WH-40) e.dr[1]=-e.dr[1] }
   if(e.fire<=0){ if((e.range&&dist(e.x,e.y,t.x,t.y)>e.range)||(G.walls.length&&!los(e.x,e.y,t.x,t.y))){ e.fire=.45; return }
     e.fire=e.every*(.85+G.rnd()*.3); aimed(e.x,e.y,t.x,t.y,e.n,.22,e.sp,'o'); if(G.dark) e.seen=Math.max(e.seen,.7) } },
 chaser:function(e,dt){ var t=e.tgt?G.pack:G.me, a=Math.atan2(t.y-e.y,t.x-e.x); e.x+=Math.cos(a)*e.sp*dt; e.y+=Math.sin(a)*e.sp*dt; e.rot+=dt*5 },
 mine:function(e,dt){ var d=dist(e.x,e.y,G.me.x,G.me.y); if(d<340){ var a=Math.atan2(G.me.y-e.y,G.me.x-e.x); e.x+=Math.cos(a)*e.sp*dt; e.y+=Math.sin(a)*e.sp*dt } e.rot+=dt*2 },
 dasher:function(e,dt){ e.st=e.st||0; e.tm=(e.tm===undefined?.6+G.rnd():e.tm)-dt; var m=G.me;
   if(e.st===0){ var a0=Math.atan2(m.y-e.y,m.x-e.x); e.a=a0; e.x+=Math.cos(a0)*50*dt; e.y+=Math.sin(a0)*50*dt; if(e.tm<=0){ e.st=1; e.tm=.55; beep(500,.06,.015) } }
   else if(e.st===1){ if(e.tm<=0){ e.st=2; e.tm=.42 } }
   else { e.x+=Math.cos(e.a)*e.sp*dt; e.y+=Math.sin(e.a)*e.sp*dt; e.x=clamp(e.x,10,G.WW-10); e.y=clamp(e.y,10,G.WH-10); if(e.tm<=0){ e.st=0; e.tm=.9+G.rnd() } } },
 splitter:function(e,dt){ AI.chaser(e,dt) },
 small:function(e,dt){ AI.chaser(e,dt) }
};

// ——— Варианты: init (раскладка), step (правила), part/label (шкала), targets/way (для прицела на телефоне и ботов) ———
var MODES={};

// 1. ЯДРО. Прошлый черновик: узлы → щит → ядро без щита.
MODES.core={lv:{1:{orbs:3,oHp:5,oEvery:1.9,oN:1,hp:44,spiral:3.5,arms:2,ring:3.6,ringN:20,ch:0,bs:.9},
                2:{orbs:3,oHp:6,oEvery:1.7,oN:2,hp:52,spiral:4.2,arms:2,ring:3.2,ringN:22,ch:8,bs:.95},
                3:{orbs:4,oHp:6,oEvery:1.6,oN:2,hp:60,spiral:5,arms:2,ring:2.9,ringN:26,ch:6,bs:1}},
 init:function(G,P){ G.st=0; G.cx=AW/2; G.cy=AH/2; G.shA=0; G.spA=0; G.spT=0; G.rT=P.ring*.6; G.chT=P.ch;
   G.core=enemy({kind:'core',x:G.cx,y:G.cy,r:30,hp:P.hp,arm:1,goal:1});
   for(var i=0;i<P.orbs;i++) enemy({kind:'orb',a:i/P.orbs*TAU-Math.PI/2,x:0,y:0,r:17,hp:P.oHp,fire:.9+i*.3,orb:1}) },
 step:function(G,P,dt){ var m=G.me, c=G.core, o=Math.min(AW,AH)*.31;
   G.shA+=dt*(G.st===1?1.1:.3);
   G.en.forEach(function(n){ if(!n.orb) return; n.a+=dt*.38; n.x=G.cx+Math.cos(n.a)*o*1.25; n.y=G.cy+Math.sin(n.a)*o; n.fire-=dt; n.tell=clamp(1-n.fire/.35,0,1);
     if(n.fire<=0){ n.fire=P.oEvery*(.85+G.rnd()*.3); aimed(n.x,n.y,m.x,m.y,P.oN,.22,205*P.bs,'o') } });
   if(G.st>=1){ G.spA+=dt*1.7; G.spT-=dt; if(G.spT<=0){ G.spT=1/(P.spiral*(G.st===2?.6:1)); for(var j=0;j<P.arms;j++) bullet(c.x,c.y,G.spA+j/P.arms*TAU,165*P.bs,'o') } }
   if(G.st===2){ G.rT-=dt; if(G.rT<=0){ G.rT=P.ring; ring(c.x,c.y,P.ringN,Math.atan2(m.y-c.y,m.x-c.x)+(G.rnd()-.5)*1.6,TAU/P.ringN*2.8,150*P.bs,'r'); beep(180,.18,.04,'triangle') } }

     op[n[0]].seen=true; st.push(n[0]) }
   for(i=0;i<C*R;i++){ if(G.rnd()<.25&&i%C<C-1) op[i].r=true; if(G.rnd()<.25&&i+C<C*R) op[i].d=true } // петли, чтобы было куда уйти

   G.goalHp=0; gc.forEach(function(c){ used.push(c); turret((c%C+.5)*CELL,(((c/C)|0)+.5)*CELL,P.gHp,P.gEvery,P.gN,P.bs,{goal:1,r:20,range:460}); G.goalHp+=P.gHp });
   var rest=cells.filter(function(c){ return used.indexOf(c)<0&&c!==1&&c!==C }); for(i=0;i<P.tur&&rest.length;i++){ var k=(G.rnd()*rest.length)|0, cc=rest.splice(k,1)[0]; turret((cc%C+.3+G.rnd()*.4)*CELL,(((cc/C)|0)+.3+G.rnd()*.4)*CELL,P.tHp,P.tEvery,1,P.bs,{range:430}) }
   G.chT=P.ch },

function trace(x,y,a,len,maxB){ var vx=Math.cos(a), vy=Math.sin(a), pts=[[x,y]], b=0, st=8, at=0;

function autoAim(){ // телефон: оранжевая пуля рядом важнее, потом ближайшая цель
  var m=G.me, best=null, bd=1e9, M=G.M;
  if(M.aim){ var q=M.aim(G); return Math.atan2(q[1]-m.y,q[0]-m.x) }
  G.bul.forEach(function(b){ if(b.k!=='o') return; var d=dist(b.x,b.y,m.x,m.y); if(d<130&&d<bd){ bd=d; best=[b.x,b.y] } });
  if(best) return Math.atan2(best[1]-m.y,best[0]-m.x);
  var ts=targets(); ts.forEach(function(e){ var d=dist(e.x,e.y,m.x,m.y); if(d<bd){ bd=d; best=[e.x,e.y] } });
  return best?Math.atan2(best[1]-m.y,best[0]-m.x):m.ang;
}
function targets(){ return G.M.targets?G.M.targets(G):G.en.filter(function(e){ return !e.arm }) }

function camera(){ var m=G.me; if(G.scroll) { G.cam.y=0; return } G.cam.x=clamp(m.x-AW/2,0,Math.max(0,G.WW-AW)); G.cam.y=clamp(m.y-AH/2,0,Math.max(0,G.WH-AH)) }

function update(dt){
  var P=G.P, m=G.me, M=G.M, i, j, b, s, e;
  fxStep(dt);
  if(G.shake>0) G.shake=Math.max(0,G.shake-dt*40);
  if(G.glitch>0) G.glitch-=dt;
  if(G.state==='dying'){ G.dieT-=dt; if(G.rnd()<.4) burst(G.dx+(G.rnd()-.5)*50,G.dy+(G.rnd()-.5)*50,G.rnd()<.5?'#FFD23F':'#F2F1EC',8,300);
    if(G.dieT<=0){ G.state='won'; burst(G.dx,G.dy,'#FFD23F',90,600); onEnd('won') } return }
  if(G.state!=='play') return;
  if(G.hitstop>0){ G.hitstop-=dt; return }
  G.t+=dt;

  // ход: по осям отдельно, чтобы скользить вдоль стен
  var mag=Math.hypot(input.mx,input.my)||1, k=Math.min(1,Math.hypot(input.mx,input.my)), dx=input.mx/mag*k*SPEED*dt, dy=input.my/mag*k*SPEED*dt;
  var B=G.bnd||{x0:10,x1:G.WW-10,y0:10,y1:G.WH-10};
  var nx=clamp(m.x+dx,B.x0,B.x1); if(!wallAt(nx,m.y,6)) m.x=nx;
  var ny=clamp(m.y+dy,B.y0,B.y1); if(!wallAt(m.x,ny,6)) m.y=ny;
  if(m.inv>0) m.inv-=dt;
  var aim=input.auto?autoAim():Math.atan2(input.ay+(input.world?0:G.cam.y)-m.y,input.ax+(input.world?0:G.cam.x)-m.x); m.ang=aim;
  m.fire-=dt;
  if(m.fire<=0){ m.fire=FIRE; G.shots.push({x:m.x+Math.cos(aim)*10,y:m.y+Math.sin(aim)*10,vx:Math.cos(aim)*SHOT,vy:Math.sin(aim)*SHOT,b:0}); if(Math.floor(G.t/FIRE)%2===0) beep(1400,.012,.006) }

  M.step(G,P,dt); if(G.state!=='play') return;
  camera();

  // враги
  for(i=G.en.length-1;i>=0;i--){ e=G.en[i]; if(e.flash>0) e.flash-=dt; if(AI[e.kind]&&!e.dormant) AI[e.kind](e,dt);
    if(e.touch&&m.inv<=0&&dist(e.x,e.y,m.x,m.y)<R_ME+e.r*.8){ if(e.die1){ burst(e.x,e.y,'#C9CFD6',12,240); G.en.splice(i,1) } hurt(); if(G.state!=='play') return } }

  // лучи: тонкая линия — предупреждение, толстая — бьёт; стены их режут
  G.beams.forEach(function(q){ q.a+=q.w*dt; q.ph+=dt; var c=q.warn+q.on+q.off, f=q.ph%c; q.state=f<q.warn?1:f<q.warn+q.on?2:0; if(!q.state) { q.L=0; return }
    var ca=Math.cos(q.a), sa=Math.sin(q.a), L=q.len; for(var l=8;l<q.len;l+=8){ if(wallAt(q.x+ca*l,q.y+sa*l)){ L=l; break } } q.L=L;
    if(q.state===2&&m.inv<=0){ var t=clamp((m.x-q.x)*ca+(m.y-q.y)*sa,0,L); if(dist(q.x+ca*t,q.y+sa*t,m.x,m.y)<R_ME+4) hurt() } });
  if(G.state!=='play') return;

  // пули
  var vx0=G.scroll?G.cam.x-40:-20, vx1=G.scroll?G.cam.x+AW+40:G.WW+20;
  for(i=G.bul.length-1;i>=0;i--){ b=G.bul[i]; b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(b.x<vx0||b.y<-20||b.x>vx1||b.y>G.WH+20||wallAt(b.x,b.y)){ G.bul.splice(i,1); continue }
    if(M.bulHook&&M.bulHook(G,b)){ G.bul.splice(i,1); if(G.state!=='play') return; continue }
    if(m.inv<=0&&dist(b.x,b.y,m.x,m.y)<R_ME+(b.k==='r'?6:5)){ hurt(); if(G.state!=='play') return; break } } // hurt сам снимает пули вокруг

  // выстрелы
  shots: for(i=G.shots.length-1;i>=0;i--){ s=G.shots[i]; var px=s.x, py=s.y; s.x+=s.vx*dt; s.y+=s.vy*dt;
    if(G.bounce){ var bn=false; if(s.x<0||s.x>G.WW){ s.vx=-s.vx; s.x=clamp(s.x,0,G.WW); bn=true } if(s.y<0||s.y>G.WH){ s.vy=-s.vy; s.y=clamp(s.y,0,G.WH); bn=true }
      if(wallAt(s.x,s.y)){ if(wallAt(s.x,py)) s.vx=-s.vx; else s.vy=-s.vy; s.x=px; s.y=py; bn=true }
      if(bn){ s.b++; burst(s.x,s.y,'#FFD23F',2,120); if(s.b>G.bounce){ G.shots.splice(i,1); continue } } }
    else if(s.x<(G.scroll?G.cam.x:0)||s.y<0||s.x>(G.scroll?G.cam.x+AW:G.WW)||s.y>G.WH||wallAt(s.x,s.y)){ if(wallAt(s.x,s.y)) burst(s.x,s.y,'#5E5D58',1,80); G.shots.splice(i,1); continue }
    for(j=G.bul.length-1;j>=0;j--){ b=G.bul[j]; if(dist(b.x,b.y,s.x,s.y)<9){
      G.shots.splice(i,1); if(b.k==='o'){ burst(b.x,b.y,'#FF8A1F',5,170); G.bul.splice(j,1) } else burst(s.x,s.y,'#FF2A1A',2,90); continue shots } }
    if(M.shotHook&&M.shotHook(G,s)){ G.shots.splice(i,1); continue }
    for(j=G.en.length-1;j>=0;j--){ e=G.en[j]; if(dist(e.x,e.y,s.x,s.y)<e.r+2){
      G.shots.splice(i,1);
      if(e.arm||(e.needB&&!s.b)) burst(s.x,s.y,'#5E5D58',2,90); else { hitEnemy(e); if(G.state!=='play') return }
      continue shots } }
  }
}
function fxStep(dt){ for(var i=G.fx.length-1;i>=0;i--){ var f=G.fx[i]; f.t+=dt; if(f.t>=f.life){ G.fx.splice(i,1); continue } f.x+=f.vx*dt; f.y+=f.vy*dt; f.vx*=.95; f.vy*=.95 } }

var AC=null, MUTE=false;
function audio(){ if(AC) return; try{ AC=new (window.AudioContext||window.webkitAudioContext)() }catch(e){} }
function beep(f,d,g,type){
  if(!AC||MUTE) return; var o=AC.createOscillator(), a=AC.createGain(), t=AC.currentTime;
  o.type=type||'square'; o.frequency.value=f; a.gain.setValueAtTime(g,t); a.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(a); a.connect(AC.destination); o.start(t); o.stop(t+d);
}

// ——— рисунок ———
var cv=document.getElementById('c'), cx=cv.getContext('2d'), DPR=1, W=0, H=0, K=1, OX=0, OY=0;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1); W=innerWidth; H=innerHeight;
  cv.width=W*DPR; cv.height=H*DPR;
  var was=AW; orient();
  K=Math.min((W-24)/AW,(H-96)/AH); OX=(W-AW*K)/2; OY=(H-AH*K)/2+6;
  if(G&&was!==AW&&G.state==='play') newRun();
}
function ngon(n,r,rot){ cx.beginPath(); for(var i=0;i<n;i++){ var a=rot+i*TAU/n; cx[i?'lineTo':'moveTo'](r*Math.cos(a),r*Math.sin(a)) } cx.closePath() }
function ship(x,y,a,fill,stroke){ cx.save(); cx.translate(x,y); cx.rotate(a); cx.beginPath(); cx.moveTo(13,0); cx.lineTo(-9,-8); cx.lineTo(-5,0); cx.lineTo(-9,8); cx.closePath(); if(fill){ cx.fillStyle=fill; cx.fill() } if(stroke){ cx.strokeStyle=stroke; cx.lineWidth=2; cx.stroke() } cx.restore() }
// Рисунок врагов: белый контур — бьёт, серое — броня, жёлтое — сюда стрелять.
var DR={
 turret:function(e){ cx.translate(e.x,e.y); var big=e.goal; ngon(6,e.r,e.rot); cx.fillStyle=e.flash>0?'#F2F1EC':'#0B0B0C'; cx.fill(); cx.strokeStyle=big?'#FFD23F':'#F2F1EC'; cx.lineWidth=2; cx.stroke();
   ngon(6,3+(e.r-6)*(e.hp/e.max),e.rot); cx.fillStyle=e.tell>0?'rgb(255,'+Math.round(210-72*e.tell)+','+Math.round(63-32*e.tell)+')':(big?'#FFD23F':'#F2F1EC'); cx.fill() },
 orb:function(e){ cx.translate(e.x,e.y); ngon(6,16,e.a); cx.fillStyle=e.flash>0?'#F2F1EC':'#0B0B0C'; cx.fill(); cx.strokeStyle='#F2F1EC'; cx.lineWidth=2; cx.stroke();
   ngon(6,4+8*(e.hp/e.max),e.a); cx.fillStyle=e.tell>0?'rgb(255,'+Math.round(210-72*e.tell)+','+Math.round(63-32*e.tell)+')':'#F2F1EC'; cx.fill() },
 core:function(e,now){ cx.translate(e.x,e.y); var st=G.st, low=1-e.hp/e.max, tr=st===2?1.2:0; cx.translate((Math.random()-.5)*tr,(Math.random()-.5)*tr);
   if(st>=1){ var g=cx.createRadialGradient(0,0,8,0,0,120); g.addColorStop(0,'rgba(255,210,63,'+(.12+.28*low)+')'); g.addColorStop(1,'rgba(255,210,63,0)'); cx.fillStyle=g; cx.beginPath(); cx.arc(0,0,120,0,7); cx.fill() }
   coreGlyph(e,now,st>=1,st===2);
   if(st<2){ cx.strokeStyle='#F2F1EC'; cx.lineWidth=st===0?2:5; if(st===0){ cx.setLineDash([10,6]); cx.beginPath(); cx.arc(0,0,72,now/1800,now/1800+7); cx.stroke(); cx.setLineDash([]) } else for(var q=0;q<3;q++){ cx.beginPath(); cx.arc(0,0,72,G.shA+q*TAU/3,G.shA+q*TAU/3+1.3); cx.stroke() } } },

 dasher:function(e,now){ if(e.st===1){ var la=e.a; cx.strokeStyle='rgba(255,42,26,.6)'; cx.lineWidth=1; cx.setLineDash([6,5]); cx.beginPath(); cx.moveTo(e.x,e.y); cx.lineTo(e.x+Math.cos(la)*230,e.y+Math.sin(la)*230); cx.stroke(); cx.setLineDash([]) }
   cx.translate(e.x,e.y); cx.rotate(e.a||0); cx.beginPath(); cx.moveTo(14,0); cx.lineTo(-10,-10); cx.lineTo(-10,10); cx.closePath(); cx.fillStyle=e.flash>0?'#F2F1EC':(e.st?'#FF8A1F':'#C9CFD6'); cx.fill() },
 mine:function(e){ cx.translate(e.x,e.y); cx.rotate(e.rot); cx.fillStyle=e.flash>0?'#F2F1EC':'#FF2A1A'; ngon(4,11,0); cx.fill(); cx.fillStyle='#0B0B0C'; ngon(4,4,0); cx.fill() },

};
function coreGlyph(e,now,live,fast){ var col=live?'#FFD23F':'#5E5D58'; ngon(8,e.r,Math.PI/8); cx.fillStyle=e.flash>0?'#F2F1EC':'#0B0B0C'; cx.fill(); cx.strokeStyle=col; cx.lineWidth=2.5; cx.stroke();
  cx.save(); cx.rotate(now/(fast?260:700)); cx.strokeStyle=col; cx.lineWidth=3; cx.beginPath(); cx.arc(0,0,e.r*.56,.6,TAU-.6); cx.stroke(); cx.restore(); cx.fillStyle=col; cx.fillRect(-4,-4,8,8) }

function draw(now){
  cx.setTransform(DPR,0,0,DPR,0,0); cx.fillStyle='#050506'; cx.fillRect(0,0,W,H);
  if(!G) return;
  var sx=G.shake?(Math.random()-.5)*G.shake:0, sy=G.shake?(Math.random()-.5)*G.shake:0, m=G.me, i;
  cx.translate(OX+sx,OY+sy); cx.scale(K,K);
  cx.fillStyle='#0B0B0C'; cx.fillRect(0,0,AW,AH);
  cx.save(); cx.beginPath(); cx.rect(0,0,AW,AH); cx.clip();
  cx.translate(-G.cam.x,-G.cam.y);
  // фон: кольца у ядра, точки на больших картах (видно, что едешь)
  if(G.id==='core'){ cx.strokeStyle='rgba(156,155,149,.18)'; cx.lineWidth=1; cx.setLineDash([1,7]); for(var r=1;r<=6;r++){ cx.beginPath(); cx.arc(AW/2,AH/2,r*95,0,7); cx.stroke() } cx.setLineDash([]) }
  else if(!G.dark){ cx.fillStyle='rgba(156,155,149,.22)'; var dx0=Math.floor(G.cam.x/60)*60, dy0=Math.floor(G.cam.y/60)*60; for(var gx=dx0;gx<G.cam.x+AW+60;gx+=60) for(var gy=dy0;gy<G.cam.y+AH+60;gy+=60) cx.fillRect(gx,gy,1.5,1.5) }
  if(G.dark){ var lg=cx.createRadialGradient(m.x,m.y,10,m.x,m.y,G.P.light); lg.addColorStop(0,'rgba(242,241,236,.09)'); lg.addColorStop(1,'rgba(242,241,236,0)'); cx.fillStyle=lg; cx.beginPath(); cx.arc(m.x,m.y,G.P.light,0,7); cx.fill();
    G.pulses.forEach(function(p){ cx.strokeStyle='rgba(79,163,255,'+Math.max(0,.5-p.r/1600)+')'; cx.lineWidth=2; cx.beginPath(); cx.arc(p.x,p.y,p.r,0,7); cx.stroke() }) }
  // зеркало: черта, площадка, подсказка на первом уровне
  if(G.id==='mirror'&&G.state==='play'){ cx.strokeStyle='#2E2E33'; cx.lineWidth=2; cx.setLineDash([10,8]); cx.beginPath(); if(G.vert){ cx.moveTo(0,AH/2); cx.lineTo(AW,AH/2) } else { cx.moveTo(AW/2,0); cx.lineTo(AW/2,AH) } cx.stroke(); cx.setLineDash([]);
    var pd=G.pad; cx.fillStyle='rgba(255,210,63,'+(G.copy.arm?.08:.22)+')'; cx.beginPath(); cx.arc(pd.x,pd.y,pd.r,0,7); cx.fill(); cx.strokeStyle='#FFD23F'; cx.lineWidth=2; cx.stroke();
    if(G.P.hint){ var gh=MODES.mirror.mir(G,pd.x,pd.y); cx.strokeStyle='rgba(255,210,63,.3)'; cx.lineWidth=1; cx.setLineDash([3,6]); cx.beginPath(); cx.arc(gh[0],gh[1],pd.r,0,7); cx.stroke(); cx.setLineDash([]) } }
  // конвой: линия
  if(G.id==='convoy'&&G.pack){ cx.strokeStyle='rgba(255,210,63,.35)'; cx.lineWidth=2; cx.setLineDash([6,8]); cx.beginPath(); G.path.forEach(function(p,ix){ cx[ix?'lineTo':'moveTo'](p.x,p.y) }); cx.stroke(); cx.setLineDash([]);
    var e0=G.path[G.path.length-1]; cx.strokeStyle='#FFD23F'; cx.lineWidth=2; cx.strokeRect(e0.x-13,e0.y-13,26,26) }
  // зоны
  G.zones.forEach(function(z){ if(z.k==='mark'){ cx.strokeStyle='rgba(255,42,26,'+(.3+.5*Math.abs(Math.sin(now/90)))+')'; cx.lineWidth=2; cx.beginPath(); cx.moveTo(z.x-8,z.y-8); cx.lineTo(z.x+8,z.y+8); cx.moveTo(z.x+8,z.y-8); cx.lineTo(z.x-8,z.y+8); cx.stroke() }
    else if(z.k==='red'){ cx.strokeStyle='#FF2A1A'; cx.lineWidth=2; if(z.t>0){ cx.setLineDash([5,6]); cx.beginPath(); cx.arc(z.x,z.y,z.r*(1-z.t*.25),0,7); cx.stroke(); cx.setLineDash([]) } else { cx.fillStyle='rgba(255,42,26,.28)'; cx.beginPath(); cx.arc(z.x,z.y,z.r,0,7); cx.fill(); cx.stroke() } } });
  // стены
  G.walls.forEach(function(w){ if(w.x>G.cam.x+AW+20||w.x+w.w<G.cam.x-20||w.y>G.cam.y+AH+20||w.y+w.h<G.cam.y-20) return; cx.fillStyle=G.bounce?'#1B1B20':'#141417'; cx.fillRect(w.x,w.y,w.w,w.h); cx.strokeStyle=G.bounce?'#F2F1EC':'#5E5D58'; cx.lineWidth=G.bounce?1.5:1; cx.strokeRect(w.x,w.y,w.w,w.h) });
  // змей: связка
  if(G.id==='worm'&&G.head&&G.state==='play'){ cx.strokeStyle='rgba(156,155,149,.5)'; cx.lineWidth=2; cx.beginPath(); cx.moveTo(G.head.x,G.head.y); G.segs.forEach(function(s){ cx.lineTo(s.x,s.y) }); cx.stroke() }
  // рикошет: пунктир отскока
  if(G.id==='rico'&&G.state==='play'){ var tr=trace(m.x,m.y,m.ang,900,1); cx.strokeStyle='rgba(255,210,63,.3)'; cx.lineWidth=1; cx.setLineDash([2,8]); cx.beginPath(); tr.pts.forEach(function(p,ix){ cx[ix?'lineTo':'moveTo'](p[0],p[1]) }); cx.stroke(); cx.setLineDash([]) }
  // лучи
  G.beams.forEach(function(q){ if(!q.state||!q.L) return; cx.strokeStyle='#FF2A1A'; cx.lineWidth=q.state===2?5:1; cx.globalAlpha=q.state===2?1:.5+.3*Math.sin(now/60); cx.beginPath(); cx.moveTo(q.x,q.y); cx.lineTo(q.x+Math.cos(q.a)*q.L,q.y+Math.sin(q.a)*q.L); cx.stroke(); cx.globalAlpha=1 });
  // враги
  G.en.forEach(function(e){ if(!DR[e.kind]) return; var a=1; if(G.dark){ var d=dist(e.x,e.y,m.x,m.y); a=d<G.P.light?1:clamp(e.seen,0,1) } if(a<=0) return; cx.save(); cx.globalAlpha=a; DR[e.kind](e,now); cx.restore() });
  // пакет
  if(G.pack&&G.state!=='won'){ var pk=G.pack; cx.save(); cx.translate(pk.x,pk.y); cx.rotate(Math.PI/4); cx.fillStyle=pk.flash>0?'#FF2A1A':'#FFD23F'; cx.fillRect(-11,-11,22,22); cx.fillStyle='#0B0B0C'; cx.fillRect(-4,-4,8,8); cx.restore();
    cx.fillStyle='#F2F1EC'; cx.font='11px Geist Mono,monospace'; cx.textAlign='center'; cx.fillText(pk.hp+'/'+G.P.hp,pk.x,pk.y-20); cx.textAlign='left' }
  // пули: оранжевое — круг, красное — ромб
  G.bul.forEach(function(b){
    if(b.k==='o'){ cx.fillStyle='#FF8A1F'; cx.beginPath(); cx.arc(b.x,b.y,6,0,7); cx.fill(); cx.fillStyle='#FFD9A8'; cx.beginPath(); cx.arc(b.x,b.y,2.5,0,7); cx.fill() }
    else { cx.save(); cx.translate(b.x,b.y); cx.rotate(Math.PI/4); cx.fillStyle='#FF2A1A'; cx.fillRect(-5.5,-5.5,11,11); cx.fillStyle='#0B0B0C'; cx.fillRect(-1.8,-1.8,3.6,3.6); cx.restore() } });
  // выстрелы: после отскока жёлтые
  cx.lineWidth=2.5; cx.lineCap='round';
  [0,1].forEach(function(gold){ cx.strokeStyle=gold?'#FFD23F':'#FFF6D0'; cx.beginPath(); G.shots.forEach(function(s){ if(!!s.b===!!gold){ cx.moveTo(s.x,s.y); cx.lineTo(s.x-s.vx*.016,s.y-s.vy*.016) } }); cx.stroke() });
  cx.lineCap='butt';
  // корабль
  if(G.state==='play'&&!(m.inv>0&&Math.floor(now/70)%2)){ ship(m.x,m.y,m.ang,'#F2F1EC'); cx.fillStyle='#FF2A1A'; cx.fillRect(m.x-1.5,m.y-1.5,3,3) }
  // искры
  G.fx.forEach(function(f){ cx.globalAlpha=1-f.t/f.life; cx.fillStyle=f.col; cx.fillRect(f.x-2,f.y-2,4,4) }); cx.globalAlpha=1;
  cx.restore();
  cx.strokeStyle='#2E2E33'; cx.lineWidth=1/K; cx.strokeRect(0,0,AW,AH);
  // стрелки на узлы за краем экрана
  if(G.M.arrows&&G.state==='play'){ goals().forEach(function(e){ var vx=e.x-G.cam.x, vy=e.y-G.cam.y; if(vx>0&&vx<AW&&vy>0&&vy<AH) return; var a=Math.atan2(vy-AH/2,vx-AW/2), rx=AW/2-22, ry=AH/2-22, s=Math.min(rx/Math.abs(Math.cos(a)||1e-6),ry/Math.abs(Math.sin(a)||1e-6)); cx.save(); cx.translate(AW/2+Math.cos(a)*s,AH/2+Math.sin(a)*s); cx.rotate(a); cx.beginPath(); cx.moveTo(10,0); cx.lineTo(-7,-7); cx.lineTo(-7,7); cx.closePath(); cx.fillStyle='#FFD23F'; cx.fill(); cx.restore() }) }
  // сводка: этап, шкала, жизни
  cx.setTransform(DPR,0,0,DPR,0,0);
  var bw=AW*K, tx=OX, ty=OY-22;
  cx.font='700 12px Jost,system-ui,sans-serif'; cx.textBaseline='middle'; cx.textAlign='left'; cx.fillStyle='#F2F1EC';
  var lbl=G.M.label(G); cx.fillText(lbl,tx,ty);
  var hbx=tx+78, hbw=Math.max(40,bw-78-70), part=G.state==='play'?G.M.part(G):0;
  cx.fillStyle='#202024'; cx.fillRect(hbx,ty-2,hbw,4); cx.fillStyle='#FFD23F'; cx.fillRect(hbx,ty-2,hbw*Math.max(0,part),4);
  for(i=0;i<HP;i++){ var px=tx+bw-52+i*20; cx.beginPath(); cx.moveTo(px+7,ty); cx.lineTo(px-5,ty-6); cx.lineTo(px-5,ty+6); cx.closePath(); if(i<m.hp){ cx.fillStyle='#F2F1EC'; cx.fill() } else { cx.strokeStyle='#5E5D58'; cx.lineWidth=1; cx.stroke() } }

}

// ——— окна ———
function show(id){ ['ovMenu','ovIntro','ovLost','ovWon'].forEach(function(o){ document.getElementById(o).classList.toggle('hide',o!==id) }) }
var endT=0;
function onEnd(kind){ if(SIM) return; clearTimeout(endT); endT=setTimeout(function(){ if(kind==='lost') show('ovLost'); else { show('ovWon'); typeLore() } },kind==='lost'?420:500) }
var loreTimer=0;
function typeLore(){
  var box=document.getElementById('lore'), text=T[lang].won.join('\n'), n=0, back=document.getElementById('bBack');
  back.style.visibility='hidden'; clearInterval(loreTimer);
  loreTimer=setInterval(function(){
    n+=2; var s=text.slice(0,n), out=s.split('\n').map(function(l,ix){ var cl=ix===0?'y':ix===1||ix===6?'m':''; return '<span class="'+cl+'">'+l.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</span>' }).join('\n');
    box.innerHTML=out+(n<text.length?'<span class="y">▌</span>':'');
    if(n>=text.length){ clearInterval(loreTimer); back.style.visibility='visible' }
  },24);
}
function go(){ audio(); newRun(); show(null) }
function idle(){ clearInterval(loreTimer); clearTimeout(endT); newRun(); G.state='intro' }
function menu(){ idle(); show('ovMenu'); hudLv() }
function intro(){ idle(); applyLang(); show('ovIntro'); hudLv() }
function pick(id){ mode=id; intro() }
function hudLv(){ [].forEach.call(document.querySelectorAll('[data-lv]'),function(b){ b.classList.toggle('on',+b.getAttribute('data-lv')===lv) }) }
document.getElementById('bGo').onclick=go;
document.getElementById('bRetry').onclick=go;
document.getElementById('bBack').onclick=menu;
[].forEach.call(document.querySelectorAll('[data-act="menu"]'),function(b){ b.onclick=menu });
document.getElementById('lang').onclick=function(){ lang=lang==='ru'?'en':'ru'; applyLang(); if(G&&G.state==='won') typeLore() };
[].forEach.call(document.querySelectorAll('[data-lv]'),function(b){ b.onclick=function(){ lv=+b.getAttribute('data-lv'); b.blur(); var inMenu=!document.getElementById('ovMenu').classList.contains('hide'); if(inMenu){ hudLv() } else intro() } });

// ——— управление ———
var keys={}, KEYMAP={KeyW:[0,-1],ArrowUp:[0,-1],KeyS:[0,1],ArrowDown:[0,1],KeyA:[-1,0],ArrowLeft:[-1,0],KeyD:[1,0],ArrowRight:[1,0]};
function readKeys(){ var x=0,y=0; for(var k in keys) if(keys[k]&&KEYMAP[k]){ x+=KEYMAP[k][0]; y+=KEYMAP[k][1] } input.mx=x; input.my=y }
addEventListener('keydown',function(e){
  if(KEYMAP[e.code]){ keys[e.code]=1; readKeys(); e.preventDefault() }
  var menuOn=!document.getElementById('ovMenu').classList.contains('hide');
  if(menuOn&&/^Digit[1-9]$/.test(e.code)){ pick(ORDER[+e.code.slice(5)-1]); return }
  if(e.code==='Escape'&&G){ menu(); return }
  if((e.code==='Enter'||e.code==='Space')&&G&&!menuOn){ if(G.state==='intro'||G.state==='lost') go(); e.preventDefault() }
});
addEventListener('keyup',function(e){ if(KEYMAP[e.code]){ keys[e.code]=0; readKeys() } });
function toView(e){ return [(e.clientX-OX)/K,(e.clientY-OY)/K] }
var touch=null;
cv.addEventListener('pointerdown',function(e){ audio(); if(e.pointerType==='touch'){ input.auto=true; touch={x:e.clientX,y:e.clientY}; try{ cv.setPointerCapture(e.pointerId) }catch(_){} } });
cv.addEventListener('pointermove',function(e){
  if(e.pointerType==='touch'){ if(touch&&G&&G.state==='play'){ var m=G.me, B=G.bnd||{x0:10,x1:G.WW-10,y0:10,y1:G.WH-10}, nx=clamp(m.x+(e.clientX-touch.x)/K*1.5,B.x0,B.x1), ny=clamp(m.y+(e.clientY-touch.y)/K*1.5,B.y0,B.y1); if(!wallAt(nx,m.y,6)) m.x=nx; if(!wallAt(m.x,ny,6)) m.y=ny; touch.x=e.clientX; touch.y=e.clientY } return }
  input.auto=false; var p=toView(e); input.ax=p[0]; input.ay=p[1];
});
cv.addEventListener('pointerup',function(){ touch=null }); cv.addEventListener('pointercancel',function(){ touch=null });

// Прогон без рисунка, для ботов: шаг 1/60, бот сам ставит input (прицел — в координатах мира).
var SIM=false;
function sim(id,level,seed,bot,maxT){
  var keepM=mode, keepLv=lv, keepG=G, keepIn=input; SIM=true; MUTE=true; mode=id; lv=level; input={mx:0,my:0,ax:AW/2,ay:AH/2,auto:false,world:true};
  newRun(seed); var steps=0;
  while((G.state==='play'||G.state==='dying')&&G.t<maxT&&steps<maxT*60+400){ bot(G,input); update(1/60); steps++ }
  var pt=0; if(G.state!=='won') { try{ pt=G.M.part(G) }catch(e){} }
  var out={r:G.state==='won'?'won':G.state==='lost'?'lost':'timeout',t:+G.t.toFixed(1),hp:G.me.hp,left:+pt.toFixed(2)};
  G=keepG; mode=keepM; lv=keepLv; input=keepIn; SIM=false; MUTE=false; return out;
}

var last=0;
(function frame(now){ var dt=Math.min(.04,(now-(last||now))/1000); last=now; if(G) update(dt); draw(now); requestAnimationFrame(frame) })(0);
