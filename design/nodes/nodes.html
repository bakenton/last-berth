function tick(G){
  if(G.over) return;
  G.day++;
  if(G.day%50===0){ G.snaps=G.snaps||[]; G.snaps.push(snap(G)); }
  G.inRate=G.inRate||{}; G._dl=G._dl||{};                 // v4.20: EMA of what arrives home per year, per resource
  ['metal','food','fuel','parts'].forEach(function(k){ var cur=(G.delivered&&G.delivered[k])||0, dd=cur-(G._dl[k]||0); G._dl[k]=cur; G.inRate[k]=(G.inRate[k]||0)*0.98+dd*0.02 });
  G.fuelRate=(G.fuelRate||0)*0.95+(G.fuelSpent||0)*0.05; G.fuelSpent=0;   // v4.4: EMA of fuel the fleet burns per year
  var E=G.earth, R=G.rnd;

  var ef=earthOutput(G)*(G.cold?0.7:1);        // no metal at home, the yards run slow
  E.crewF=ef;
  E.pMetal=K.EARTH_METAL*ef; E.pFood=K.EARTH_FOOD*ef; E.pFuel=K.EARTH_FUEL*ef;
  E.metal+=E.pMetal; E.food+=E.pFood; E.fuel+=E.pFuel;
  if(!G.hungry) E.people+=handsRate(G);        // v4.7: a fed home world keeps turning out colonists, fewer every century

  upgradeSave(G);   // v4.34: a pre-manual-lines save loses its standing orders on the first tick
  // ---- ships ----
  for(var i=0;i<G.ships.length;i++){
    var s=G.ships[i];
    if(s.mode==='building'){s.t--;if(s.t<=0){s.mode='idle';s.at='earth';log(G,'ship_ready',{n:s.id});
        if(s.pend&&G.colonies[s.pend.from]){ var pf=s.pend.from, pt_=s.pend.to; s.pend=null; var pr=setLine(G,s.id,pf,pt_); s.lineFor=null; if(pr!=='ok'){ s.waiting=true; G.pauseNow=true; log(G,'awaiting',{n:s.id}) } continue }
      }continue}
    if(s.mode==='missing'){
      s.missDays++;
      var p1=R();
      if(p1<0.025){ s.bearing=Math.round(R()*100); log(G,'fragment',{n:s.id,b:s.bearing}); }
      else if(p1<0.050){ s.mode='transit'; s.dir='in'; s.t=Math.max(3,Math.round(s.total*0.7)); s.total=s.t; G.pauseNow=true; log(G,'ship_returns',{n:s.id,d:s.missDays}); }
      else if(p1<0.054||s.missDays>300){ var cl=s.crew||0; s.mode='dead'; s.crew=0; G.stats.lost++;
        G.earth.lostCrew=(G.earth.lostCrew||0)+cl; log(G,'ship_written_off',{n:s.id,c:cl});
        if(s.cargo&&s.cargo.kit){ for(var kc in G.colonies) if(G.colonies[kc].kitShip===s.id){ G.colonies[kc].kitShip=null; log(G,'kit_lost',{p:kc,t:s.cargo.kit.tier}) } } }
      continue;
    }
    if(s.mode==='idle'){ if(s.from&&s.to) sail(G,s); else if(s.at&&s.at!=='earth'){ goHome(G,s) } continue }
    if(s.mode!=='transit') continue;

    if(s.t===s.total){
      var pd = s.dest==='earth' ? null : planet(s.dest);
      if(s.dest!=='earth'&&!pd){ s.dest='earth'; s.dir='in'; pd=null }   // lost its destination: limp home
      var hz = (pd ? pd.haz : 0.02) * Math.pow(0.7, hullGen(s));
      if(!G.safe&&R()<hz*0.085){ s.mode='missing'; s.missDays=0; G.pauseNow=true; log(G,'ship_missing',{n:s.id,p:s.dest==='earth'?s.origin:s.dest}); continue; }
    }
    var sp=shipSpeed(G,s);                                    // v4.21: folded or thickened space
    if(sp===1&&!s.acc) s.t--;
    else { s.acc=(s.acc||0)+sp; var stp=Math.floor(s.acc); s.acc-=stp; if(stp<1) continue; s.t-=stp }
    if(s.t>0) continue;
    if(s.dest!=='earth'&&stormAt(G,s.dest)){ s.t=1; s.held=(s.held||0)+1; continue }   // v4.21: a storm — no landing, hold in orbit

    // arrived
    var node=s.dest;
    s.at=node; s.mode='idle'; s.dir=null;
    if(s.job==='colonize'){
      var p=planet(node);
      if(!G.safe&&R()<p.haz*0.5){ var cf=s.crew||0; s.mode='dead'; s.crew=0; G.stats.lost++;
        G.earth.lostCrew=(G.earth.lostCrew||0)+cf; log(G,'colony_failed',{n:s.id,p:node}); continue }
      G.colonies[node]={pid:node,pop:s.cargo.people,
        store:{metal:0,food:0,fuel:0,parts:0},founded:G.day};
      G.stats.founded++; (G.settled=G.settled||{})[node]=G.day;
      log(G,'colony_founded',{p:node,pop:Math.round(s.cargo.people)});
      if(G.stats.founded===1) log(G,'first_landfall',{p:node});
      s.cargo={metal:0,food:0,fuel:0,parts:0,people:0};
      s.job=null; s.from=null; s.to=null; s.origin=node; s.dest='earth';
      s.mode='transit'; s.dir='in'; s.t=legDays(G,node,'earth',s); s.total=s.t;
      continue;
    }
    if(s.job==='evac'){
      var ce=G.colonies[node];
      if(ce){
        var lift=Math.min(Math.floor(ce.pop),s.cap);
        s.cargo={metal:0,food:0,fuel:0,parts:0,people:lift};
        // whatever was on the surface goes with them, as far as the hold allows
        var roomE=Math.max(0,s.cap-lift);
        ['metal','food','fuel','parts'].forEach(function(kk){ var g=Math.min(roomE,Math.floor(ce.store[kk]||0)); if(g>0){ s.cargo[kk]=g; roomE-=g } });
        delete G.colonies[node];
        if(G.reserves[node]!==Infinity&&G.reserves[node]<=0){ G.ghost[node]=G.day }
        for(var q=0;q<G.ships.length;q++){ var o=G.ships[q]; if(o.from===node||o.to===node){ o.from=null; o.to=null } if(o.pend&&o.pend.from===node) o.pend=null; if(o.lineFor===node) o.lineFor=null; if(o.moveTo===node) o.moveTo=null }
        if(G.drive===node){ G.drive=null; log(G,'drive_lost',{p:node}) }
        log(G,lift<ce.pop-0.5?'evac_partial':'evacuated',{p:node,pop:lift});
        var ho=ce.hauledOut||{}, pe=planet(node), qd=pe.kind==='works'?'parts':pe.dep;
        log(G,'epitaph',{p:node,f:ce.founded||0,y:G.day,n:G.day-(ce.founded||0),q:Math.round(ho[qd]||0),dep:qd,pop:lift});
      }
      s.job=null; s.origin=node; s.dest='earth'; s.mode='transit'; s.dir='in'; s.t=legDays(G,node,'earth',s); s.total=s.t;
      continue;
    }
    if(s.job==='search'){
      var found=null;
      for(var q2=0;q2<G.ships.length;q2++){ var m2=G.ships[q2]; if(m2.id===s.searchFor&&m2.mode==='missing') found=m2 }
      if(found&&R()<0.55){ found.mode='transit'; found.dir='in'; found.origin=node; found.dest='earth'; found.t=legDays(G,node,'earth',found); found.total=found.t; log(G,'search_found',{n:found.id}) }
      else log(G,'search_empty2',{p:node});
      s.job=null; s.searchFor=null; s.origin=node; s.dest='earth'; s.mode='transit'; s.dir='in'; s.t=legDays(G,node,'earth',s); s.total=s.t;
      continue;
    }
    unload(G,s,node);
    if(node!=='earth'&&s.from&&s.to&&!s.mutiny&&mutinyDue(G,s,legDays(G,node,'earth',s)*2)){
      // v4.2: the crew loads, sails home, and will not come back. The word goes out from the far end.
      s.mutiny=true; s.pend=null; s.lineFor=null; s.moveTo=null; G.stats.mutinies=(G.stats.mutinies||0)+1;
      log(G,'mutiny',{n:s.id,p:node,at:'far'});
      loadAt(G,s,node);                       // they take what is on the ground; the line is still set here
      s.from=null; s.to=null; s.origin=node; s.dest='earth'; s.mode='transit'; s.dir='in'; s.t=legDays(G,node,'earth',s); s.total=s.t;
      continue;
    }
    /* v4.34 (reviewer): a hull from a spent world stands down at Earth — unless the player has already given her another line */
    if(s.homeOnly){ var hp=s.homeOnly; s.homeOnly=null; s.from=null; s.to=null;
      if(node!=='earth'){ s.origin=node; s.dest='earth'; s.mode='transit'; s.dir='in'; s.t=legDays(G,node,'earth',s); s.total=s.t; continue }
      if(!s.pend&&!s.moveTo){ s.waiting=true; log(G,'nothing_left',{n:s.id,p:hp}); continue } }
    /* v4.34 (reviewer: a hull docking at the far end flew world→world past Earth, and one from a spent world was left idle at a
       foreign pier for good): a new line is taken only at Earth — at the far end she loads and comes home on the old one first.
       A line is always world ↔ Earth. */
    if(node!=='earth'&&s.pend&&G.colonies[s.pend.from]){ s.from=s.pend.from; s.to=s.pend.to; s.pend=null; s.auto=true }
    if(node==='earth'){
      if(s.moveTo){ var mt=s.moveTo, mp=planet(mt); s.moveTo=null;   // v4.32: the move ordered in flight — she is at the pier now
        if(mp&&G.colonies[mt]&&s.from!==mt&&!s.mutiny&&canReachSector(s,mp.sec)&&!(G.reserves[mt]<=0&&mp.kind!=='works'&&pileLeft(G,mt)<1)) s.pend={from:mt,to:'earth'} }
      if(s.pend){ if(G.colonies[s.pend.from]){ s.from=s.pend.from; s.to=s.pend.to; s.auto=true; s.policy=null; log(G,'reassigned',{n:s.id,a:s.from,b:s.to}) } s.pend=null }
    }
    if(s.from&&s.to) sail(G,s);
    else if(node!=='earth'){ s.origin=node; s.dest='earth'; s.mode='transit'; s.dir='in'; s.t=legDays(G,node,'earth',s); s.total=s.t }   // v4.14: a hull released in flight lands with no line — it heads home; the yards only see hulls at Earth
    else { s.waiting=true; G.pauseNow=true; log(G,'awaiting',{n:s.id}) }
  }

  // ---- colonies ----
  var partsMade=0;   // v4.0: the pace the ark-drive forecast reads
  for(var k in G.colonies){
    var c=G.colonies[k], p=planet(k);

    // works worlds convert; everyone else digs or grows from a finite seam
    // v4.10: hazard takes its share; the line brings the replacements
    if(c.pop>K.MIN_FOUND){ c.lossDebt=(c.lossDebt||0)+c.pop*p.haz*K.COLONY_LOSS; var cl=Math.floor(c.lossDebt); if(cl>0){ c.lossDebt-=cl; c.pop=Math.max(K.MIN_FOUND,c.pop-cl); G.stats.colonyLoss=(G.stats.colonyLoss||0)+cl } }
    // v4.4: the machines drink first; dry for KIT_GRACE years and they stand
    if(kitTier(c)>0){ var burn=kitBurn(c);
      if((c.store.fuel||0)>=burn){ c.store.fuel-=burn; if(c.fuelOut>=K.KIT_GRACE) log(G,'kit_running',{p:k,t:c.tier}); c.fuelOut=0 }
      else { c.store.fuel=0; c.fuelOut=(c.fuelOut||0)+1; if(c.fuelOut===K.KIT_GRACE) log(G,'kit_starved',{p:k,t:c.tier}) } }
    var mult=rateMult(c);
    if(p.kind==='works'){
      c.store.metal=(c.store.metal||0)+c.pop*K.WORKS_LOCAL;
      c.store.food=(c.store.food||0)+c.pop*K.WORKS_LOCAL*0.6;
      var want=c.pop*p.rich*K.REFINE*mult;
      var canM=(c.store.metal||0)/K.REFINE_METAL, canF=(c.store.food||0)/K.REFINE_FOOD;
      var made=Math.min(want,canM,canF);
      if(made>0.0001){
        c.store.metal-=made*K.REFINE_METAL; c.store.food-=made*K.REFINE_FOOD; c.idleWorks=0; partsMade+=made;
        if(G.drive){
          G.driveWork+=made;
          if(G.driveWork>=driveWorkFor(G)) driveDone(G,G.drive);
        } else c.store.parts=(c.store.parts||0)+made;
      } else { c.idleWorks=(c.idleWorks||0)+1; if(c.idleWorks===120){ log(G,'works_idle',{p:k}) } }
    } else {
      var out=Math.min(c.pop*p.rich*K.PROD*mult, G.reserves[k]);
      G.reserves[k]-=out;
      c.store[p.dep]=(c.store[p.dep]||0)+out;
      if(G.reserves[k]<=0&&!c.dry){c.dry=true;G.pauseNow=true;log(G,'depleted',{p:k})}
      /* v4.11 (Nikita, 28.09: 'судно снимается с линии, хотя на складе ещё что-то лежит'): the seam is dead but the
         pile is carried out to the last ton; a hull stands down only when it lands and finds nothing (loadAt) */
    }
    // colonies do not breed. Hands arrive on ships or they do not arrive at all.
  }

  G.partsRate=(G.partsRate||0)+(partsMade-(G.partsRate||0))/K.PARTS_EMA;

  // ---- Earth burns to stay alive ----
  directorStep(G);
  var nd=earthNeed(G);
  G.need=nd;
  var pa=activeCrisis(G);
  if(pa){                                                      // v4.20: the crisis drain, any of the four
    var dr=pulseDrain(G,pa.res);
    if(E[pa.res]>=dr){ E[pa.res]-=dr; G.pulseShort=false }
    else { E[pa.res]=0; var d2=Math.max(0.2,E.people*K.STARVE_KILL*0.5); E.people=Math.max(0,E.people-d2); E.lost=(E.lost||0)+d2;
      if(!G.pulseShort){ G.pulseShort=true; G.pauseNow=true; log(G,'pulse_short',{dep:pa.res}) } }
  }
  var hungry=false, cold=false;
  if(E.food>=nd.food) E.food-=nd.food; else { E.food=0; hungry=true }
  if(E.metal>=nd.metal) E.metal-=nd.metal; else { E.metal=0; cold=true }
  G.hungry=hungry; G.cold=cold;
  if(hungry){                                   // no rations: the home world buries people
    var died=Math.max(0.4,E.people*K.STARVE_KILL);
    E.people=Math.max(0,E.people-died); E.lost=(E.lost||0)+died;
    if(!G.lacking){G.lacking=true;G.pauseNow=true;log(G,'earth_short',{})}
  } else {
    G.lacking=false;
    if(E.lost>0.5){ var back=Math.min(E.lost,E.people*K.MEND+0.2); E.lost-=back }  // recovery is slow
  }

  // ---- something happens out there ----
  if(R()<K.EVENT_CHANCE){
    var keys=Object.keys(G.colonies).filter(function(k){return G.reserves[k]>0});   // v4.11: a dead seam has no pockets and no surprises
    if(keys.length){
      var k=keys[Math.floor(R()*keys.length)], c=G.colonies[k], p=planet(k), roll=R();
      if(roll<0.42){
        var b=Math.round(c.pop*p.rich*K.PROD*40*(0.6+R()));
        c.store[p.dep]=(c.store[p.dep]||0)+b;
        log(G,'ev_rich',{p:k,q:b,dep:p.dep}); G.pauseNow=true;
      } else if(roll<0.58&&G.reserves[k]!==Infinity&&G.reserves[k]>0){
        /* v4.1 (Nikita, 24.09: "жила оказалась больше или меньше, чем планировали"): the mirror of ev_seam */
        var cut=Math.round(G.reserves[k]*(0.25+R()*0.3));
        G.reserves[k]=Math.max(1,G.reserves[k]-cut);
        log(G,'ev_short',{p:k,q:cut,dep:p.dep}); G.pauseNow=true;
      } else if(roll<0.74){
        var lost=Math.round((c.store[p.dep]||0)*(0.25+R()*0.4));
        c.store[p.dep]=Math.max(0,(c.store[p.dep]||0)-lost);
        log(G,'ev_wreck',{p:k,q:lost,dep:p.dep}); G.pauseNow=true;
      } else if(roll<0.88){
        var died=Math.round(c.pop*(0.10+R()*0.15));
        c.pop=Math.max(4,c.pop-died);
        log(G,'ev_disaster',{p:k,q:died}); G.pauseNow=true;
      } else {
        var seam=Math.round(K.RESERVE_BASE*Math.pow(K.RESERVE_GROW,p.sec)*p.rich*(0.15+R()*0.25));
        if(G.reserves[k]!==Infinity){ G.reserves[k]+=seam; c.dry=false; log(G,'ev_seam',{p:k,q:seam,dep:p.dep}); G.pauseNow=true }
      }
    }
  }

  var settled=0; for(var k in G.colonies) settled++;
  if(settled>G.stats.peak) G.stats.peak=settled;
  if(G.day%K.SHIFT_YEARS===0) chronShift(G,settled);

  // ---- the larder forecast (v4.28, F-11) ----
  if(G.day>=200){ var ff=foodForecast(G); G.foodFc=ff;
    if(foodShort(G)){ if(!G.foodWarned&&G.day>=K.FOOD_PAUSE_FROM){ G.foodWarned=true; G.pauseNow=true; log(G,'food_horizon',{y:ff.y,n:ff.n,h:Math.round(E.food),k:ff.farms}) } }
    else if(G.foodWarned&&(!ff||ff.n>K.FOOD_HORIZON*1.5)) G.foodWarned=false; }   // re-armed once the horizon clears, so a second slide is told again
  // ---- the Long Night ----
  if(!G.night&&(SECTORS.length>=K.NIGHT_TRIGGER_SECTORS||G.day>=K.NIGHT_TRIGGER_YEAR)) revealNight(G);
  if(G.night){
    var left=G.night-G.day;
    if(left===K.NIGHT_NEAR||left===100||left===25){ G.pauseNow=true; log(G,'night_near',{n:left,s:arkSouls(G)}) }
    if(!G.mutinyWarned){ var mf=mutinyForecast(G); if(mf&&mf.n<=K.MUTINY_WARN){ G.mutinyWarned=true; G.pauseNow=true; log(G,'mutiny_warn',{n:mf.n,p:mf.pid,f:mf.f,h:Math.round(E.food)}) } }
    for(var ck in G.colonies){ var cc=G.colonies[ck]; var ll=lastLift(G,ck); if(!ll) continue; if(ll.st==='cut'){ if(!cc.cut){ cc.cut=true; log(G,'world_cut',{p:ck,n:ll.pop}) } } else if(ll.st==='open'&&cc.cut) cc.cut=false }   // v4.33: said once, the year the last lift is missed; a faster drive can open the world again
    if(left===K.DOOMSDAY_AT) log(G,'doomsday',{n:left,b:arkSouls(G),h:Math.round(E.people)});
    if(left<=0){
      G.left=leftBehind(G); G.over='night';
      var cv=arkConvoy(G);
      if(!arkReady(G)||!cv.ok){
        // v4.0: an ark without a drive is a monument, not a boat; v4.24: no level paid and no drive is just 'no ark';
        // v4.29: no convoy at the pier — the same monument
        G.boarded=0; G.souls=0; G.grounded=arkLevel(G)>=1; G.groundedWhy=!arkReady(G)?'drive':'convoy'; G.cargo=null;
        log(G,'night',{s:0});
        if(G.grounded&&G.groundedWhy==='drive') log(G,'ark_grounded',{b:arkSouls(G),g:G.arkMark});
        else if(G.grounded) log(G,'ark_noconvoy',{b:arkSouls(G),n:cv.have.courier,h:cv.have.hauler,c:cv.have.freighter,g:cv.gen});
        return;
      }
      G.boarded=arkSouls(G); G.wake=arkWake(G); G.souls=Math.floor(G.boarded*G.wake); G.cargo=G.boarded>0?arkCargo(G):null;
      log(G,'night',{s:G.boarded});
      /* v4.14 (run 398763448 review): with no ark or nobody at home there is no departure to chronicle */
      if(G.boarded>0){ log(G,'ark_sailed',{s:G.boarded,b:G.left.home+G.left.hulls+G.left.colonies+G.left.transit});
        log(G,'ark_woke',{w:G.souls,s:G.boarded,g:G.driveLvl||0}) }
      return;
    }
  }
  // there is no victory screen any more — the chart runs as far as you can push it.
  // The only ending is the home world going quiet, and it has to actually arrive.
  if(hungry){
    G.famine=(G.famine||0)+1;
    if(G.famine===1||G.famine===Math.round(K.DEAD_DAYS*0.6)){ G.pauseNow=true; log(G,'earth_dead',{n:K.DEAD_DAYS-G.famine}) }
    if(G.famine>=K.DEAD_DAYS){ G.over='lose'; log(G,'lose',{}); log(G,'desk_silent',{n:K.DEAD_DAYS}) }
  } else if(G.famine) G.famine=Math.max(0,G.famine-1);   // fed days pay famine back one for one, no faster
}

/* ---------- the advisor: the game does the arithmetic and says what wants a decision ----------
   Pure. Returns [{code, sev, pid?, sid?, hull?, n?}] ordered worst-first. */
function advice(G){
  var out=[], E=G.earth, i, k;
  var nd=G.need||earthNeed(G);

  var fd=Math.floor(E.food/Math.max(0.1,nd.food)), md=Math.floor(E.metal/Math.max(0.1,nd.metal));
  if(G.hungry) out.push({code:'a_starving',sev:'bad',n:Math.round(E.people)});
  else if(fd<25) out.push({code:'a_food',sev:fd<10?'bad':'warn',n:fd});
  else if(foodShort(G)) out.push({code:'a_foodhor',sev:G.foodFc.n<=120?'bad':'warn',n:G.foodFc.n,y:G.foodFc.y,h:G.foodFc.farms});   // v4.28 F-11
  if(G.cold) out.push({code:'a_cold',sev:'bad'});
  else if(md<25) out.push({code:'a_metal',sev:md<10?'bad':'warn',n:md});
  var hasWell=false; for(k in G.colonies){ var pw=planet(k); if(pw&&pw.kind==='well'&&G.reserves[k]>0) hasWell=true }
  if(!hasWell&&E.fuel<260&&Object.keys(G.colonies).length>=2) out.push({code:'a_nowell',sev:E.fuel<60?'bad':'warn',n:Math.round(E.fuel)});
  else if(E.fuel<30) out.push({code:'a_fuel',sev:E.fuel<12?'bad':'warn',n:Math.round(E.fuel)});
  // hulls of a retired generation sitting idle are metal on the slipway
  var oldIdle=G.ships.filter(function(s){return s.mode==='idle'&&s.at==='earth'&&!(s.from&&s.to)&&!s.reserve&&hullGen(s)<(G.gen||0)}).length;   // v4.29: the ark reserve is not idle metal
  if(oldIdle>=4) out.push({code:'a_scrap',sev:'ok',n:oldIdle,g:(G.gen||0)});

  for(k in G.colonies){
    var c=G.colonies[k], p=planet(k);
    if(!p) continue;
    var lines=G.ships.filter(function(s){return s.mode!=='dead'&&s.from&&s.to&&(s.from===k||s.to===k)});
    var lr=lineRate(G,k);
    var dep = p.kind==='works'?'parts':p.dep;
    var sitting = Math.round(c.store[dep]||0);
    var dry = G.reserves[k]!==Infinity && G.reserves[k]<=0;

    var cap=popCap(p), miss=Math.floor(cap-c.pop);

    // a worked-out seam with a full warehouse still has something to haul.
    // never tell the player there is nothing to take while the store is full.
    if(dry&&sitting>20){ out.push({code:'a_lastload',sev:'warn',pid:k,n:sitting}); continue }
    if(dry){ if(lines.length) out.push({code:'a_dry',sev:'bad',pid:k,n:lines.length}); continue }

    // v4.4: kits
    if(c.kit&&lines.length&&lineHold(G,k)<c.kit.w) out.push({code:'a_kithold',sev:'warn',pid:k,n:c.kit.w,t:c.kit.tier});
    if(c.kit&&!lines.length) out.push({code:'a_kithold',sev:'warn',pid:k,n:c.kit.w,t:c.kit.tier});
    if(kitTier(c)>0&&(c.fuelOut||0)>=K.KIT_GRACE) out.push({code:'a_kitfuel',sev:'warn',pid:k,t:c.tier});
    if(!lines.length){
      // one message, not three: no line means nothing leaves and no hands arrive
      out.push({code: miss>cap*0.3?'a_nolineShort':'a_noline', sev:'warn', pid:k, n:miss});
    } else {
      if(lr&&lr.piling&&sitting>120) out.push({code:'a_pile',sev:'warn',pid:k,n:sitting});
      // a factory with a line is being fed; only speak up if it has sat idle a long while
      if(p.kind==='works'&&(c.idleWorks||0)>90) out.push({code:'a_feedslow',sev:'warn',pid:k,n:c.idleWorks});
    }
    if(p.kind==='works'&&!lines.length&&(c.store.metal<2||c.store.food<2)) out.push({code:'a_feed',sev:'bad',pid:k});
  }

  var idle=G.ships.filter(function(s){return s.mode==='idle'&&s.at==='earth'&&!(s.from&&s.to)&&!s.reserve});   // v4.29: reserved hulls wait on purpose
  if(idle.length&&idle.length-oldIdle>0) out.push({code:'a_idle',sev:'warn',n:idle.length,sid:idle[0].id});

  var free=null, fleetLim=sectorLimit(G.gen||0);
  for(i=0;i<PLANETS.length;i++){ var pp=PLANETS[i];
    if(!G.colonies[pp.id]&&!G.ghost[pp.id]&&sectorOpen(G,pp.sec)&&pp.sec<=fleetLim){ free=pp.id; break } }
  if(free&&idle.length&&E.people>=K.MIN_FOUND+K.EARTH_KEEP) out.push({code:'a_settle',sev:'ok',pid:free,sid:idle[0].id});

  for(i=HULLS.length-1;i>=0;i--){ var h=HULLS[i];
    if(h.gen!==(G.gen||0)) continue;
    if(reach(G)>=h.reach&&E.metal>=h.metal&&E.fuel>=h.fuel&&E.parts>=(h.parts||0)&&E.people-K.EARTH_KEEP>=(h.crew||0)){ out.push({code:'a_build',sev:'ok',hull:i}); break } }
  // v4.4: one kit suggestion at a time — the richest world with a line that can carry it and a seam worth it
  if(kitOpen(G)){ var bk=null, bv=0;
    for(k in G.colonies){ var ck=G.colonies[k], pk=planet(k); if(!pk) continue; if(canKit(G,k)!=='ok') continue;
      var kk2=kitCost(ck); if(lineHold(G,k)<kk2.w) continue;
      if(G.reserves[k]!==Infinity&&G.reserves[k]<ck.pop*pk.rich*K.PROD*Math.pow(K.KIT_OUT,kk2.tier)*150) continue;   // seam would be gone inside 150 years
      var v=ck.pop*pk.rich; if(v>bv){ bv=v; bk={pid:k,t:kk2.tier} } }
    if(bk){ var kg=kitGain(G,bk.pid); out.push({code:'a_kit',sev:'ok',pid:bk.pid,t:bk.t,kx:Math.round(kg.now),ky:Math.round(kg.with)}) } }
  // v4.4: rations pile up for the ark — say so, or the player reads it as waste
  if(G.night&&fd>60) out.push({code:'a_foodpile',sev:'ok',n:fd});
  // v4.10 (Nikita, 27.09): a flock of couriers where one hauler would do
  for(k in G.colonies){ var nc=lineCount(G,k,'courier'); if(nc<3) continue;
    var hi=currentHull(G,'hauler'); if(hi===null||!canReachSector({hull:hi},planet(k).sec)||reach(G)<HULLS[hi].reach) continue;
    out.push({code:'a_bigger',sev:'ok',pid:k,n:nc}); break }
  // v4.7: hulls on the pier with no hands to sign
  var cw=0; for(i=0;i<G.ships.length;i++){ if(G.ships[i].crewWait&&G.ships[i].mode==='idle') cw++ }
  if(cw) out.push({code:'a_crew',sev:'bad',n:cw});
  // hands with nothing to do: the v3.3 problem, said out loud
  if(E.people-K.EARTH_KEEP>420) out.push({code:'a_idlehands',sev:'ok',n:Math.round(E.people)});
  // the Long Night
  if(G.night){
    var nl=nightLeft(G), souls=arkSouls(G), lb=leftBehind(G);
    if(nl<=K.NIGHT_NEAR){
      if(lb.hulls+lb.colonies>souls*0.25) out.push({code:'a_nightrecall',sev:'bad',n:nl,h:lb.hulls,c:lb.colonies});
    }
    if(!arkReady(G)){
      /* two thousand years of a red line nobody can act on yet is noise: it turns bad inside 2×NIGHT_NEAR */
      var fc=driveForecast(G,G.arkMark), gm=G.arkMark, sv2=nl<=K.NIGHT_NEAR*2?'bad':'warn';
      if(fc.st==='ok'&&fc.y>G.night) out.push({code:'a_arkd_late',sev:sv2,gr:gm,y:fc.y,l:fc.y-G.night});
      else if(fc.st==='ok'&&fc.y>G.night-K.NIGHT_NEAR/2) out.push({code:'a_arkd_tight',sev:'warn',gr:gm,y:fc.y,l:G.night-fc.y});
      else if(fc.st==='settled') out.push({code:'a_arkd_reach',sev:sv2,gr:gm,n:fc.n,r:fc.r});
      else if(fc.st==='host') out.push({code:'a_arkd_host',sev:sv2,gr:gm,n:K.DRIVE_POP});
      else if(fc.st==='stalled') out.push({code:'a_arkd_stall',sev:sv2,gr:gm});
    }
    /* v4.5 (run 768210301: nine Generation V couriers bought in the last 300 years never sailed once — every
       crew refused). Say it before the metal is spent: the shortest line still open already refuses. */

  return '<svg width="'+sz+'" height="'+sz+'" aria-hidden="true"><polygon points="'+pts.join(' ')+'" fill="'+CC[cls]+'"/><circle cx="'+(c+r*0.72)+'" cy="'+c+'" r="'+(sz*0.1)+'" fill="#F5C518"/></svg>' }

/* ---------- старт ---------- */
function start(sc){ scen=sc||scen; var S=JSON.parse(JSON.stringify(SNAP));
  G=C.newGame(S.seed); while(C.SECTORS.length<S.nSec) C.openSector(G); C.ensureGen(S.gen);
  var rnd=G.rnd, full={}; for(var k in G.reserves) full[k]=G.reserves[k];
  for(var k2 in S) if(k2!=='nSec') G[k2]=S[k2]; G.rnd=rnd;
  for(var r in G.reserves) G.reserves[r]=G.reserves[r]<0?Infinity:G.reserves[r];
  C.K.NIGHT_TRIGGER_SECTORS=1e9; C.K.NIGHT_TRIGGER_YEAR=1e9; C.K.COLONY_LOSS=0;   // урезано: без Ночи и без убыли на мирах (людей по цепочке пока не возим)
  if(scen==='clean'){ var E=G.earth; G.ships.forEach(function(s){ if(s.mode==='dead') return; var hd=C.HULLS[s.hull]; E.people+=s.crew||0; E.metal+=hd.metal; E.parts+=hd.parts||0; E.fuel+=hd.fuel }); for(var c in G.colonies) E.people+=G.colonies[c].pop;
    G.colonies={}; G.ships=[]; G.ghost={}; G.settled={}; G.stats.founded=0; for(var x in full) G.reserves[x]=full[x] }
  for(var w in G.reserves) if(G.reserves[w]!==Infinity) G.reserves[w]=Math.round(G.reserves[w]*seam);
  links={}; G.ships.forEach(function(s){ if(s.mode!=='dead'&&s.from&&s.to) links[s.from]=s.to });
  sel=null; picking=null; target=null; queue=[]; hist=[]; note=''; lastSeq=G.logSeq||0; setSpeed(0); layout(); render() }
function hubIn(id){ return Object.keys(links).filter(function(k){ return links[k]===id }) }
function linkWhy(a,b){ if(a===b) return 'samenode'; if(b==='earth') return ''; var pa=C.planet(a), pb=C.planet(b); if(pa.kind==='works'||pb.kind==='works') return 'works'; if(pb.sec>pa.sec) return 'outward';
  var n=b, guard=0; while(n&&n!=='earth'&&guard++<99){ if(n===a) return 'loop'; n=links[n] } return '' }
/* линия появляется сразу. Потянули наружу — разворачиваем: груз всегда идёт к Земле. */
function makeLink(a,b){ if(a==='earth'){ a=b; b='earth' } else if(b!=='earth'&&C.planet(b).sec>C.planet(a).sec){ var t=a; a=b; b=t }
  var why=linkWhy(a,b); if(why){ note='Линия не проведена: '+WHY[why]; noteY=G.day; return false }
  links[a]=b; G.ships.forEach(function(s){ if(s.mode==='dead'||(s.pend?s.pend.from:s.from)!==a) return; var r=C.setLine(G,s.id,a,b); if(r!=='ok'&&r!=='queued'&&r!=='batch'&&r!=='hubfull'){ C.clearLine(G,s.id); note='Судно снято с линии: '+(WHY[r]||r); noteY=G.day } });
  sel=a; tab='world'; picking=null; target=null; return true }
function unlink(a){ delete links[a]; G.ships.forEach(function(s){ if(s.mode!=='dead'&&(s.from===a||(s.pend&&s.pend.from===a))) C.clearLine(G,s.id) }) }

/* ---------- время ---------- */
function setSpeed(v){ speed=v; clearInterval(timer); timer=v?setInterval(step,1000/v):null;
  document.querySelectorAll('[data-a=speed]').forEach(function(b){ b.classList.toggle('on',+b.dataset.v===v) }) }
var note='', noteY=0, lastSeq=0;
function readLog(){ G.log.forEach(function(l){ if((l.seq||0)<=lastSeq) return; lastSeq=l.seq;
    var pn=l.d&&l.d.p&&C.planet(l.d.p)?C.planet(l.d.p).name:'';
    var t=l.code==='colony_failed'?'Поселенцы погибли при высадке: '+pn:l.code==='ship_missing'?'Судно пропало по пути: '+pn:l.code==='depleted'?'Жила выработана: '+pn:'';
    if(t){ note=t; noteY=G.day } }) }
var lastStep=0;
function step(){ if(G.over){ setSpeed(0); return } C.tick(G); G.pauseNow=false; lastStep=performance.now(); readLog(); drainQueue();
  G.ships.forEach(function(s){ if(s.kicked&&!s.kickSeen){ s.kickSeen=true; note='Правило сняло судно с линии ('+(WHY[s.kicked]||s.kicked)+'), оно идёт домой'; noteY=G.day } });
  G.ships.forEach(function(s){ if(s.mode==='idle'&&s.at==='earth'&&!(s.from&&s.to)) s.waiting=false });
  var E=G.earth; hist.push({metal:E.metal,food:E.food,fuel:E.fuel,parts:E.parts,d:Object.assign({},G.delivered)}); if(hist.length>41) hist.shift();
  render() }
function drainQueue(){ queue=queue.filter(function(q){ var s=C.shipById(G,q.ship); if(!s||s.mode==='dead') return false; if(G.colonies[q.pid]||C.enRoute(G,q.pid)) return false; if(s.mode!=='idle') return true;
    var r=C.colonize(G,s.id,q.pid); return r!=='ok'&&r!=='taken'&&r!=='enroute' }) }

/* ---------- подсчёт ---------- */
function rate(key){ if(hist.length<2) return null; var a=hist[0], b=hist[hist.length-1]; return (b[key]-a[key])/(hist.length-1) }
function inRate(key){ if(hist.length<2) return 0; var a=hist[0].d, b=hist[hist.length-1].d; return (b[key]-a[key])/(hist.length-1) }
function liveShips(){ return G.ships.filter(function(s){ return s.mode!=='dead' }) }
function shipKey(s){ return C.HULLS[s.hull].key }
function nameOf(id){ return id==='earth'?'Земля':C.planet(id).name }
function stateOf(s){ if(s.mode==='building') return 'на верфи, '+s.t+' лет'; if(s.mode==='missing') return 'пропало'; if(s.hubWait) return 'склад узла полон, ждёт'; if(s.batchWait){ var pw=C.planet(s.at); return 'ждёт партию: '+f(C.pileLeft(G,s.at))+' из '+f(C.batchM(G,pw)) } if(s.crewWait) return 'нет экипажа'; if(s.mode==='idle'&&s.at==='earth'&&!(s.from&&s.to)) return 'свободно'; if(s.mode==='idle'&&s.at==='earth') return 'стоит: нет топлива на Земле'; if(s.job==='colonize') return 'заселяет'; if(!(s.from&&s.to)) return 'домой'; if(s.mode==='transit') return 'к '+nameOf(s.dest)+', '+s.t+' лет'; return 'на стоянке' }
function hullFor(key){ var id=C.currentHull(G,key); return id==null?null:id }
function haulYr(s){ return s.cap/Math.max(1,C.legDays(G,s.from,s.to,s)*2) }
function worldFlow(pid){ var p=C.planet(pid), lr=C.lineRate(G,pid), out=0, inn=0; G.ships.forEach(function(s){ if(s.mode==='dead'||!s.from) return; if(s.from===pid) out+=haulYr(s); if(s.to===pid) inn+=haulYr(s) }); return {makes:lr?lr.makes:0,out:out,inn:inn} }

/* ---------- панель ---------- */
function setH(el,h){ if(el._h!==h){ el._h=h; el.innerHTML=h } }

  var nd=G.need||{}, h='<table><tr><th></th><th>Склад</th><th>Привоз/г</th><th>Расход/г</th><th>Итог/г</th></tr>';
  ['food','metal','fuel','parts'].forEach(function(k){ var r=rate(k), cs=r==null?'mid':(r<-0.05?'down':'up');
    h+='<tr><td style="color:'+RC[k]+'">'+RN[k]+'</td><td>'+f(G.earth[k])+'</td><td>'+inRate(k).toFixed(1)+'</td><td>'+(nd[k]!=null?(+nd[k]).toFixed(1):'–')+'</td><td class="'+cs+'">'+(r==null?'–':(r>0?'+':'')+r.toFixed(1))+'</td></tr>' });
  h+='</table><div class="sub">Людей на Земле: '+Math.round(G.earth.people)+(G.hungry?' · <span class="bad">голод '+(G.famine||0)+' из '+C.K.DEAD_DAYS+'</span>':'')+'</div>';
  setH($('earth'),h);
  document.querySelectorAll('[data-a=tab]').forEach(function(b){ b.classList.toggle('on',b.dataset.v===tab) });

  $('hint').textContent=picking?'Куда везти из '+C.planet(picking).name+'? Нажмите мир или Землю':(Object.keys(links).length?'':'Потяните от мира к миру или к Земле, чтобы соединить');
  $('over').textContent=G.over?'Земля замолчала. Партия окончена, начните заново в «Правилах».':(G.day-noteY<30?note:'');
}
function worldPanel(){ if(!sel) return '<div class="sub">Нажмите мир на карте.</div>';
  var p=C.planet(sel), c=G.colonies[sel], h='<div><h2>'+p.name+'</h2><div class="sub">Кольцо '+ring(p)+' · <span style="color:'+KC[p.kind]+'">'+KN[p.kind]+'</span> · богатство '+p.rich+'</div></div>';

    h+='<div class="sub">Заселить судном:</div>'; CL.forEach(function(key){ var id=hullFor(key); if(id==null) return; var hd=C.HULLS[id], fr=freeHull(key,sel), why=fr?'':(p.sec>C.shipRange({hull:id})?'range':C.buildShip.length&&costWhy(hd));

      h+='<div class="ln">'+icon(key)+'<span>'+dir+'<br><span class="mid">'+stateOf(s)+'</span></span><span class="mid">'+(s.fillE!=null?Math.round(s.fillE*100)+'%':'')+'</span><button class="btn" data-a="drop" data-v="'+s.id+'">Снять</button></div>' }); h+='</div>' }
  return h }
function costWhy(hd){ if(G.earth.metal<hd.metal||G.earth.fuel<hd.fuel||G.earth.parts<(hd.parts||0)) return 'cost'; if(G.earth.people-C.K.EARTH_KEEP<(hd.crew||0)) return 'crew'; return '' }

function shipAdd(){ var to=links[sel]; if(!to) return ''; if(to!=='earth'&&!G.colonies[to]) return '<div class="warn">Заселите '+nameOf(to)+', тогда сюда можно поставить суда</div>';

  CL.forEach(function(key){ var id=hullFor(key); if(id==null) return; var hd=C.HULLS[id], why=C.lineCheck(G,{hull:id},sel,to), fr=freeHull(key,sel,to), probe=fr||{hull:id,cap:hd.cap}; if(why==='ok') why=fr?'':costWhy(hd);

function seg(label,key,opts){ var h='<div><div class="lbl">'+label+'</div><div class="seg">'; opts.forEach(function(o){ h+='<button class="btn'+(C.NP[key]===o[0]?' on':'')+'" data-a="np" data-k="'+key+'" data-v="'+o[0]+'">'+o[1]+'</button>' }); return h+'</div></div>' }

/* ---------- действия ---------- */
function act(a,b){ var v=b.dataset.v;
  if(a==='speed'){ setSpeed(+v); return }
  if(a==='tab'){ tab=v } else if(a==='pick'){ picking=sel; target=null }
  else if(a==='cancelPick'){ picking=null; target=null }
  else if(a==='unlink'){ unlink(sel) }
  else if(a==='place'){ placeLine(v) }
  else if(a==='settle'){ settle(v) }
  else if(a==='drop'){ C.clearLine(G,+v); var s=C.shipById(G,+v); if(s) s.kicked=null }
  else if(a==='scrap'){ C.scrap(G,+v) }
  else if(a==='np'){ C.NP[b.dataset.k]=+v }
  else if(a==='seam'){ seam=+v }
  else if(a==='restart'){ start(v); return }
  render() }
function placeLine(key){ var to=links[sel], fr=freeHull(key,sel,to), id, r;
  if(fr) id=fr.id; else { var r0=C.buildShip(G,hullFor(key)); if(r0!=='ok'){ note='Судно не построено: '+(WHY[r0]||r0); noteY=G.day; return } id=G.ships[G.ships.length-1].id }
  r=C.setLine(G,id,sel,to); if(r!=='ok'&&r!=='queued'&&r!=='crew'&&r!=='fuel'){ note='Судно не встало на линию: '+(WHY[r]||r); noteY=G.day } }
function settle(key){ var fr=freeHull(key,sel), id; if(fr) id=fr.id; else { var r0=C.buildShip(G,hullFor(key)); if(r0!=='ok') return; id=G.ships[G.ships.length-1].id } queue.push({ship:id,pid:sel}); drainQueue() }
document.addEventListener('click',function(e){ var b=e.target.closest('[data-a]'); if(!b||b.disabled) return; act(b.dataset.a,b) });
$('aside').addEventListener('pointerdown',function(){ held=true });
window.addEventListener('pointerup',function(){ setTimeout(function(){ held=false; if(G) render() },0) });
window.addEventListener('pointercancel',function(){ held=false });

/* ---------- карта ---------- */
var cv=$('c'), ctx=cv.getContext('2d'), W=0,H=0,DPR=1,pos={};
function scale(d){ var maxD=C.PLANETS.reduce(function(a,p){ return Math.max(a,p.dist) },1), R=Math.min(W,H)/2-26; return R*Math.sqrt(d/maxD) }
function layout(){ var r=cv.getBoundingClientRect(); DPR=window.devicePixelRatio||1; W=r.width; H=r.height; cv.width=W*DPR; cv.height=H*DPR; pos={earth:{x:W/2,y:H/2}};
  C.PLANETS.forEach(function(p){ var d=scale(p.dist); pos[p.id]={x:W/2+Math.cos(p.ang)*d,y:H/2+Math.sin(p.ang)*d} }) }
function hit(x,y){ var best=null,bd=26*26; for(var k in pos){ var q=pos[k],d=(q.x-x)*(q.x-x)+(q.y-y)*(q.y-y); if(d<bd){ bd=d; best=k } } return best }
function poly(x,y,n,r,a,c){ ctx.beginPath(); for(var i=0;i<n;i++){ var t=a+2*Math.PI*i/n; ctx.lineTo(x+r*Math.cos(t),y+r*Math.sin(t)) } ctx.closePath(); ctx.fillStyle=c; ctx.fill() }
function draw(){ requestAnimationFrame(draw); if(!G||!W) return; ctx.setTransform(DPR,0,0,DPR,0,0); ctx.clearRect(0,0,W,H);
  ctx.strokeStyle=col('ln'); ctx.lineWidth=1; C.SECTORS.forEach(function(s,i){ var ds=C.PLANETS.filter(function(p){ return p.sec===i }); if(!ds.length) return; var m=Math.max.apply(null,ds.map(function(p){ return p.dist })); ctx.beginPath(); ctx.arc(W/2,H/2,scale(m)+3,0,7); ctx.stroke() });
  // линии: толщина от проходимости
  // схема: линия есть сразу. Пока на ней нет судна — штрих; идут суда — сплошная, толщина от проходимости, бегущая штриховка показывает ход груза к Земле
  var path={}, pn=sel, guard=0; while(pn&&pn!=='earth'&&guard++<99){ path[pn]=1; pn=links[pn] }
  var flow={}; liveShips().forEach(function(s){ if(s.from&&s.to&&s.mode!=='building') flow[s.from]=(flow[s.from]||0)+haulYr(s) });
  var clock=performance.now();
  Object.keys(links).forEach(function(k){ var a=pos[k], b=pos[links[k]]; if(!a||!b) return; var y=flow[k]||0, on=path[k], base=links[k]==='earth'?'#C9C8C2':col('ppl');
    ctx.globalAlpha=y?1:(on?1:0.75); ctx.strokeStyle=base; ctx.lineWidth=y?Math.min(9,3+Math.sqrt(y)/2):2.5; ctx.setLineDash(y?[]:[7,6]); ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); ctx.setLineDash([]);
    if(y){ ctx.strokeStyle='#0B0B0C'; ctx.lineWidth=1.5; ctx.setLineDash([5,13]); ctx.lineDashOffset=speed?-(clock/60)%18:0; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); ctx.setLineDash([]); ctx.lineDashOffset=0 }
    ctx.globalAlpha=1 });
  if(drag){ ctx.strokeStyle=col('ppl'); ctx.lineWidth=2; ctx.setLineDash([5,5]); ctx.beginPath(); ctx.moveTo(pos[drag.from].x,pos[drag.from].y); ctx.lineTo(drag.x,drag.y); ctx.stroke(); ctx.setLineDash([]) }
  // миры
  C.PLANETS.forEach(function(p){ var q=pos[p.id], c=G.colonies[p.id], dry=c&&G.reserves[p.id]<=0, inn=hubIn(p.id).length, inChain=inn||links[p.id], r=c?7:5;
    if(inn){ // хаб: жёлтый шестигранник, вокруг него заполнение перевалки
      poly(q.x,q.y,6,15,0,'#0B0B0C'); ctx.strokeStyle=col('ppl'); ctx.lineWidth=2.5; ctx.stroke();
      if(c){ var cp=C.hubCap(G), pc=cp===Infinity?0:Math.min(1,C.hubSum(c)/cp); if(pc>0){ ctx.lineWidth=4; ctx.beginPath(); ctx.arc(q.x,q.y,20,-1.57,-1.57+6.283*pc); ctx.stroke() } } }
    ctx.beginPath(); ctx.arc(q.x,q.y,r,0,7);
    if(c&&!dry){ ctx.fillStyle=KC[p.kind]; ctx.fill() } else { ctx.fillStyle='#0B0B0C'; ctx.fill(); ctx.strokeStyle=dry?col('dim'):KC[p.kind]; ctx.lineWidth=1.5; ctx.stroke() }
    if(p.id===sel){ ctx.strokeStyle=col('ink'); ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(q.x,q.y,inn?25:r+8,0,7); ctx.stroke() }
    if(c||inChain||p.id===sel){ ctx.textAlign='center'; ctx.font=inn?'600 12px sans-serif':'11px sans-serif'; var lab=(inn?'ХАБ ':'')+p.name, ly=q.y-(inn?24:r+8); ctx.strokeStyle='#0B0B0C'; ctx.lineWidth=4; ctx.lineJoin='round'; ctx.strokeText(lab,q.x,ly); ctx.fillStyle=inn?col('ppl'):(c?col('ink'):col('mid')); ctx.fillText(lab,q.x,ly) } });
  ctx.beginPath(); ctx.arc(W/2,H/2,9,0,7); ctx.fillStyle=col('ink'); ctx.fill();
  // суда
  var frac=speed?Math.min(1,(performance.now()-lastStep)*speed/1000):0;
  liveShips().forEach(function(s){ var key=shipKey(s), a,b,t,ang=0,x,y,ghost=false; ctx.globalAlpha=1; if(s.mode==='transit'&&s.total>0){ a=pos[s.origin]; b=pos[s.dest]; if(!a||!b) return; t=Math.min(1,Math.max(0,1-(s.t-frac)/s.total)); ang=Math.atan2(b.y-a.y,b.x-a.x);
      // встречные расходятся по своим сторонам линии; перегон вне своей линии (с верфи, домой, с поселенцами) — бледнее
      var onLine=s.from&&s.to&&((s.origin===s.from&&s.dest===s.to)||(s.origin===s.to&&s.dest===s.from)); ghost=!onLine;
      x=a.x+(b.x-a.x)*t-Math.sin(ang)*5; y=a.y+(b.y-a.y)*t+Math.cos(ang)*5 }
    else if(s.mode==='idle'&&s.at&&(s.at!=='earth'||(s.from&&s.to))){ a=pos[s.at]; if(!a) return; x=a.x+12; y=a.y+12+(s.id%4)*5 } else return;
    if(ghost) ctx.globalAlpha=0.4;
    var r={courier:6,hauler:8,freighter:10}[key], c=s.cargo||{}, full=(c.metal+c.food+c.fuel+c.parts+(c.people||0))>0;
    // с грузом — залитая, порожняя — контур
    if(full) poly(x,y,FACE[key],r,ang,CC[key]); else { poly(x,y,FACE[key],r,ang,'#0B0B0C'); ctx.strokeStyle=CC[key]; ctx.lineWidth=1.5; ctx.stroke() }
    ctx.beginPath(); ctx.arc(x+Math.cos(ang)*r*.7,y+Math.sin(ang)*r*.7,1.8,0,7); ctx.fillStyle='#F5C518'; ctx.fill();
    if(s.batchWait||s.hubWait){ ctx.strokeStyle=s.hubWait?col('red'):col('ppl'); ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(x,y,r+3,0,7); ctx.stroke();
      ctx.fillStyle=s.hubWait?col('red'):col('ppl'); ctx.font='11px sans-serif'; ctx.textAlign='center'; ctx.fillText(s.hubWait?'склад полон':'партия '+f(C.pileLeft(G,s.at))+'/'+f(C.batchM(G,C.planet(s.at))),a.x,a.y+r+26) } }); ctx.globalAlpha=1 }
var drag=null, downAt=null;
function xy(e){ var r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top} }
cv.addEventListener('pointerdown',function(e){ var q=xy(e), k=hit(q.x,q.y); downAt={x:q.x,y:q.y,k:k}; if(k&&!picking) drag={from:k,x:q.x,y:q.y,moved:false}; cv.setPointerCapture(e.pointerId) });
cv.addEventListener('pointermove',function(e){ if(!drag) return; var q=xy(e); drag.x=q.x; drag.y=q.y; if(Math.abs(q.x-downAt.x)+Math.abs(q.y-downAt.y)>14) drag.moved=true });

  if(drag&&drag.moved){ var fr=drag.from; drag=null; if(k&&k!==fr) makeLink(fr,k); render(); return }
  drag=null; if(picking){ if(k&&k!==picking) makeLink(picking,k); render(); return }
  if(k&&k!=='earth'){ sel=k; tab='world' } render() });
window.addEventListener('resize',layout);
window.NS={C:C,get G(){ return G },get links(){ return links },start:start,step:step,setSpeed:setSpeed,pos:function(){ return pos }};
start('clean'); tab='rules'; render(); draw();
})();
