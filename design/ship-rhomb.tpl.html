<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Суда-ромбы</title>
<style>
:root{--bg:#0B0B0C;--pan:#141417;--pan2:#202024;--ln:#2E2E33;--ink:#F2F1EC;--mid:#9C9B95;--dim:#5E5D58;--ppl:#FFD23F}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 'Jost',system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:18px;letter-spacing:.2em;color:var(--ppl);margin:0 0 6px}
p{color:var(--mid);margin:4px 0 12px}
.map{position:relative;border:1px solid var(--ln);background:#0B0B0C url(%%bg%%) 52.78% 50%/200% auto no-repeat;width:720px;max-width:100%;aspect-ratio:720/300;overflow:hidden}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0;align-items:center}
.tabs span{font-size:11px;color:var(--dim);letter-spacing:.14em;width:100%}
.tabs button{font:inherit;font-size:12px;letter-spacing:.12em;background:var(--pan2);color:var(--ink);border:1px solid var(--ln);padding:6px 10px;cursor:pointer}
.tabs button.on{border-color:var(--ppl);color:var(--ppl)}
.key{display:flex;flex-direction:column;gap:6px;margin-top:16px;background:var(--pan);border:1px solid var(--ln);padding:12px}
.key div{display:flex;align-items:center;gap:10px}
</style></head><body><main>
<h1>СУДА-РОМБЫ</h1>
<p>Вытянутый ромб в цвете класса, нос жёлтый и смотрит по маршруту. Миры на карте залиты, как у заселённых.</p>
<div class="map" id="map"></div>
<div class="tabs" id="size"></div>
<div class="key" id="key"></div>
</main>
<script>
var NOSE='#FFD23F', COL={c:'#45D4E8',h:'#FF6FB5',f:'#F2F1EC'}, NAME={c:'Курьер «Гермес»',h:'Тягач «Сизиф»',f:'Грузовоз «Атлант»'};
var SIZES={cls:{label:'по классу',r:{c:6,h:8,f:11}},same:{label:'один',r:{c:8,h:8,f:8}}}, mode='cls';
function ship(k){ var r=SIZES[mode].r[k], a=r*1.5, b=r*.85, c=a*.4, y=b*(1-c/a);
  return '<polygon points="'+a+',0 0,'+b+' '+(-a)+',0 0,'+(-b)+'" fill="'+COL[k]+'"/><polygon points="'+a+',0 '+c+','+y+' '+c+','+(-y)+'" fill="'+NOSE+'"/>' }
var E=[380,200], WL={KILN:[78,83],VESPER:[215,92],MARROW:[365,43],CINDER:[599,154],TALLOW:[596,252]};
// the worlds as settled ones look in the game (ui.js drawMap): shape and colour of the kind
var KIND={KILN:'well',VESPER:'well',MARROW:'works',CINDER:'mine',TALLOW:'mine'}, KCOL={mine:'#C9CFD6',well:'#FF8A1F',works:'#F2F1EC'};
var SHAPE={mine:'<circle r="7"/>',well:'<path d="M0-8L8 0L0 8L-8 0Z"/>',works:'<path d="M0-8L8 6.5H-8Z"/>'};
var WORLDS=Object.keys(WL).map(function(n){ var P=WL[n], c=KCOL[KIND[n]];
  return '<line x1="'+E[0]+'" y1="'+E[1]+'" x2="'+P[0]+'" y2="'+P[1]+'" stroke="'+c+'" stroke-opacity=".45" stroke-width="1.6"/><g transform="translate('+P[0]+' '+P[1]+')" fill="'+c+'">'+SHAPE[KIND[n]]+'</g>' }).join('');
var RUNS=[['h','KILN',0],['f','CINDER',.3],['c','TALLOW',.6],['h','MARROW',.15],['f','VESPER',.75],['c','KILN',.45]];
var t0=performance.now(), G=[];
function tabs(id,title,set,cur,attr){ document.getElementById(id).innerHTML='<span>'+title+'</span>'+Object.keys(set).map(function(k){ return '<button data-'+attr+'="'+k+'" class="'+(cur===k?'on':'')+'">'+set[k].label+'</button>' }).join('') }
function build(){
  document.getElementById('map').innerHTML='<svg viewBox="0 0 720 300">'+WORLDS+RUNS.map(function(r){ return '<g class="sh">'+ship(r[0])+'</g>' }).join('')+'</svg>';
  G=[].slice.call(document.querySelectorAll('#map .sh'));
  tabs('size','РАЗМЕР',SIZES,mode,'s');
  document.getElementById('key').innerHTML=['c','h','f'].map(function(k){ return '<div><svg width="40" height="28" viewBox="-20 -14 40 28">'+ship(k)+'</svg>'+NAME[k]+'</div>' }).join('') }
document.getElementById('size').onclick=function(e){ if(e.target.dataset.s){ mode=e.target.dataset.s; build() } };
function frame(now){ var t=(now-t0)/1000;
  RUNS.forEach(function(r,i){ var P=WL[r[1]], ph=((t/8)+r[2])%1, back=ph>=.5, f=back?(ph-.5)*2:ph*2, A=back?P:E, B=back?E:P;
    G[i].setAttribute('transform','translate('+(A[0]+(B[0]-A[0])*f).toFixed(1)+' '+(A[1]+(B[1]-A[1])*f).toFixed(1)+') rotate('+(Math.atan2(B[1]-A[1],B[0]-A[0])*180/Math.PI).toFixed(1)+')') });
  requestAnimationFrame(frame) }
build(); requestAnimationFrame(frame);
</script></body></html>
