<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Карточка мира — вкладки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Черновики карточки мира с вкладками (Никита 11.11: «лучше сделать вкладки или чот такое»). Не код игры: отдельная страница,
     числа взяты из кузницы KILN партии макета v5.12 (design/world-card/state.js), значки упрощены. Варианты A–D переключаются сверху. -->
<style>
:root{--bg:#0B0B0C;--pan:#141417;--pan2:#202024;--ln:#2E2E33;--ink:#F2F1EC;--mid:#9C9B95;--dim:#5E5D58;--red:#FF2A1A;--warn:#FF4D4D;
  --metal:#C9CFD6;--food:#3DDC84;--fuel:#FF8A1F;--parts:#5B82F0;--people:#FFD23F;--up:#FFD23F;
  --h:'Jost',system-ui,sans-serif;--n:'Geist Mono',ui-monospace,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.35 var(--h)}
body{padding:20px 16px 60px}
.page{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font:600 15px var(--h);letter-spacing:.18em;text-transform:uppercase;margin:0}
.lead{color:var(--mid);font-size:13px;max-width:720px;margin:0}
.vs{display:flex;flex-wrap:wrap;gap:6px}
.vs button{font:600 12px var(--h);letter-spacing:.14em;text-transform:uppercase;background:var(--pan);color:var(--mid);border:1px solid var(--ln);padding:9px 12px;cursor:pointer}
.vs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stage{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:24px;align-items:start}
.note{border-left:2px solid var(--ln);padding:2px 0 2px 14px;color:var(--mid);font-size:13px}
.note b{color:var(--ink);font-weight:500}
.note .pro,.note .con{display:block;margin-top:8px}.note .pro{color:#9FE3B8}.note .con{color:#FFB0A8}
@media (max-width:860px){.stage{grid-template-columns:1fr}}

/* ---------- the card (game look) ---------- */
.win{background:var(--pan);border:1px solid var(--ln);position:relative;min-width:0}
.wh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--ln)}
.wh b{font:600 17px var(--h);letter-spacing:.16em;text-transform:uppercase;flex:1}
.wh span{font:500 10.5px var(--h);letter-spacing:.16em;color:var(--mid);text-transform:uppercase}
.bd{padding:14px 18px 18px;display:flex;flex-direction:column;gap:4px}
.sec{display:flex;justify-content:space-between;font:500 10.5px var(--h);letter-spacing:.16em;color:var(--mid);text-transform:uppercase;padding:12px 0 6px;border-bottom:1px solid var(--ln);margin-bottom:2px}
.sec:first-child{padding-top:2px}
.r{display:grid;grid-template-columns:1fr auto auto;column-gap:14px;align-items:baseline;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.r>span:first-child{display:flex;align-items:center;gap:7px;min-width:0}
.r b{font:500 14px var(--n);text-align:right}
.r i{font:normal 12.5px var(--n);color:var(--mid);text-align:right;min-width:74px}
.r .short{color:var(--warn)}
.alert{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--red);padding:9px 11px;color:var(--warn);font-size:13px;margin:8px 0 2px}
.btn{font:600 11.5px var(--h);letter-spacing:.14em;text-transform:uppercase;background:var(--ink);color:var(--bg);border:0;padding:9px 13px;display:inline-flex;gap:7px;align-items:center;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ln)}
.btn.redb{background:transparent;color:var(--warn);border:1px solid var(--red);width:100%;justify-content:center;padding:11px}
.btn.wide{width:100%;justify-content:center;padding:11px}
.pr{display:inline-flex;align-items:center;gap:4px;font:500 13px var(--n);margin-right:10px}
.dim{color:var(--dim)}
.hint{color:var(--mid);font-size:12.5px;padding:6px 0}
.ic{display:inline-block;vertical-align:-2px;flex:none}

.hr{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.hr .gn{font:500 11px var(--n);border:1px solid var(--mid);padding:0 4px;color:var(--ink)}
.hr b{font-weight:500;flex:1;min-width:0}
.hr .hs{font:12.5px var(--n);color:var(--mid);display:inline-flex;align-items:center;gap:4px}
.ord{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.oc{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;border:1px solid var(--ln);padding:9px 10px;background:#101012}
.oc b{font:600 12px var(--h);letter-spacing:.12em;text-transform:uppercase}
.oc .os{font:12.5px var(--n);color:var(--mid);grid-column:2}
.oc .btn{grid-row:1 / span 2;grid-column:3}
.shp{width:22px;height:14px}

.pk{border:1px solid var(--ln);border-left:3px solid var(--up);background:rgba(255,210,63,.05);padding:13px 14px;display:flex;flex-direction:column;gap:9px;margin-top:6px}
.pk-h{display:flex;align-items:center;gap:10px}
.pk-h .pi{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:1px solid var(--up)}
.pk-h b{font:600 12px var(--h);letter-spacing:.16em;text-transform:uppercase;flex:1}
.pips{display:flex;gap:3px}.pips u{width:14px;height:6px;border:1px solid var(--up);text-decoration:none}.pips u.on{background:var(--up)}
.pk-g{font:500 26px/1.1 var(--n);display:flex;align-items:center;gap:8px}.pk-g small{font:normal 13px var(--h);color:var(--mid)}
.pk-x{display:flex;flex-wrap:wrap;gap:4px 12px;font:12.5px var(--n);color:#FF8A80;align-items:center}
.pk-x .l{font:500 10px var(--h);letter-spacing:.14em;color:var(--mid);text-transform:uppercase}
.pk-x span{display:inline-flex;align-items:center;gap:4px}
.pk-f{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pk-n{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--warn);border-top:1px dashed rgba(255,77,77,.35);padding-top:8px}

/* tab bars */
.tabs{display:flex;border-bottom:1px solid var(--ln);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1;min-width:max-content;background:none;border:0;border-bottom:2px solid transparent;color:var(--mid);font:600 11.5px var(--h);letter-spacing:.14em;text-transform:uppercase;padding:12px 12px 10px;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.bdg{min-width:7px;height:7px;border-radius:50%;display:inline-block}
.bdg.red{background:var(--red)}.bdg.up{background:var(--up)}
.cnt{font:500 11px var(--n);color:var(--mid)}

/* B: summary strip */
.sum{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--ln);border-bottom:1px solid var(--ln)}
.sum>div{background:var(--pan);padding:10px 14px;display:flex;flex-direction:column;gap:5px}
.sum small{font:500 10px var(--h);letter-spacing:.16em;color:var(--mid);text-transform:uppercase}
.chip{display:flex;align-items:center;gap:6px;font:500 13px var(--n)}
.chip i{font-style:normal;color:var(--mid);font-size:12px}
.chip i.short{color:var(--warn)}

/* C: icon rail */
.cwrap{display:grid;grid-template-columns:64px 1fr}
.rail{border-right:1px solid var(--ln);display:flex;flex-direction:column}
.rail button{background:none;border:0;border-bottom:1px solid var(--ln);color:var(--mid);padding:12px 0 9px;display:flex;flex-direction:column;align-items:center;gap:5px;font:600 9px var(--h);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;position:relative}
.rail button.on{color:var(--ink);background:var(--pan2)}
.rail button.on::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--ink)}
.rail .bdg{position:absolute;top:8px;right:12px}
@media (max-width:520px){
  .cwrap{grid-template-columns:1fr}
  .rail{flex-direction:row;border-right:0;border-top:1px solid var(--ln);order:2;background:var(--pan)}
  .rail button{flex:1;border-bottom:0;border-right:1px solid var(--ln)}
  .rail button.on::before{left:0;right:0;top:0;bottom:auto;width:auto;height:2px}
}

/* D: accordion */
.acc{border-bottom:1px solid var(--ln)}
.acc>button{width:100%;background:none;border:0;color:var(--ink);display:flex;align-items:center;gap:9px;padding:13px 18px;cursor:pointer;text-align:left}
.acc>button b{font:600 11.5px var(--h);letter-spacing:.14em;text-transform:uppercase;flex:1}
.acc>button .k{font:500 12.5px var(--n);color:var(--mid)}
.acc>button .k.short{color:var(--warn)}
.acc>button .ch{color:var(--mid);transition:transform .15s}
.acc.open>button .ch{transform:rotate(90deg)}
.acc>.in{display:none;padding:0 18px 14px}
.acc.open>.in{display:block}

@media (max-width:420px){ body{padding:14px 12px 40px} .bd{padding:12px 14px 16px} .wh{padding:12px 14px} .r i{min-width:64px} .acc>button{padding:12px 14px} .acc>.in{padding:0 14px 12px} }
</style>
</head>
<body>
<div class="page">
  <h1>Карточка мира · вкладки</h1>
  <p class="lead">Черновики, не игра. Кузница KILN из партии макета v5.12: линия недовозит металл и рационы, пакет I ещё не куплен. Вкладки кликаются. Значки упрощены — в игре будут её собственные.</p>
  <div class="vs" id="vs"></div>
  <div class="stage"><div id="card"></div><div class="note" id="note"></div></div>
</div>
<script>
(function(){
/* ---------- the numbers (KILN, v5.12 mock party) ---------- */
var W={name:'Kiln',kind:'Works · ring 2',people:49,
  eats:[{k:'metal',n:5.8,b:4.0},{k:'food',n:2.3,b:0.0}],
  makes:{k:'parts',n:5.8,b:4.0,pile:1},
  pkg:{name:'Forge package I',tier:0,max:4,gain:3.5,extra:[{k:'metal',n:3.5},{k:'food',n:1.4},{k:'fuel',n:2.2}],metal:100,parts:90,hold:190,biggest:158},
  online:[{n:5,g:'III',cls:'courier',hold:158}],
  free:[{n:3,g:'III',hold:158},{n:4,g:'III',hold:158},{n:1,g:'I',hold:70},{n:2,g:'I',hold:70}],
  order:[{cls:'courier',g:'III',hold:158,adds:4.0,yrs:15},{cls:'hauler',g:'III',hold:540,adds:8.2,yrs:21},{cls:'freighter',g:'III',hold:1710,adds:20,yrs:29}],
  hub:{n:0,m:1,metal:5000,parts:750}};
var NAME={metal:'Metal',food:'Rations',fuel:'Fuel',parts:'Parts',people:'People'};
var short=function(e){ return e.b<e.n*0.95 };
var lineShort=W.eats.some(short), carryShort=W.makes.b<W.makes.n*0.8;
var d=function(x){ return (Math.round(x*10)/10).toFixed(1) };
var num=function(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ') };

/* ---------- simplified icons ---------- */
function ic(k,s){ s=s||13; var c={metal:'#C9CFD6',food:'#3DDC84',fuel:'#FF8A1F',parts:'#5B82F0',people:'#FFD23F',up:'#FFD23F',red:'#FF4D4D',mid:'#9C9B95',ink:'#F2F1EC'}, P={
  metal:'<path d="M3 11h10l-2-6H5z" fill="C"/>',
  food:'<path d="M8 14V6M8 9c-3 0-4-2-4-4 2 0 4 1 4 4zm0-1c3 0 4-2 4-4-2 0-4 1-4 4z" stroke="C" stroke-width="1.6" fill="none"/>',
  fuel:'<path d="M8 2c2.5 3.5 4 5.5 4 7.5a4 4 0 0 1-8 0C4 7.5 5.5 5.5 8 2z" fill="C"/>',
  parts:'<path d="M8 2l5 3v6l-5 3-5-3V5z" fill="none" stroke="C" stroke-width="2"/><circle cx="8" cy="8" r="1.6" fill="C"/>',
  people:'<circle cx="8" cy="5" r="2.4" fill="C"/><path d="M3.5 14c0-3 2-4.5 4.5-4.5s4.5 1.5 4.5 4.5z" fill="C"/>',
  up:'<path d="M8 2l5 3v6l-5 3-5-3V5z" fill="none" stroke="C" stroke-width="1.4"/><path d="M8 11V6M5.8 8L8 5.7 10.2 8" stroke="C" stroke-width="1.6" fill="none"/>',
  hold:'<rect x="2.5" y="4.5" width="11" height="7" fill="none" stroke="C" stroke-width="1.4"/><path d="M5.5 4.5v7M8 4.5v7M10.5 4.5v7" stroke="C" stroke-width="1"/>',
  line:'<circle cx="3.5" cy="8" r="2" fill="C"/><circle cx="12.5" cy="8" r="2" fill="none" stroke="C" stroke-width="1.4"/><path d="M5.5 8h5" stroke="C" stroke-width="1.4" stroke-dasharray="1.6 1.4"/>',
  world:'<circle cx="8" cy="8" r="5.5" fill="none" stroke="C" stroke-width="1.4"/><path d="M2.5 8h11M8 2.5c2 2 2 9 0 11M8 2.5c-2 2-2 9 0 11" stroke="C" stroke-width="1" fill="none"/>',
  hub:'<path d="M8 1.5l5.6 3.2v6.6L8 14.5l-5.6-3.2V4.7z" fill="none" stroke="C" stroke-width="1.4"/><circle cx="8" cy="8" r="2" fill="C"/>',
  evac:'<path d="M8 2v12M5 5l3-3 3 3M5 11l3 3 3-3" stroke="C" stroke-width="1.5" fill="none"/>',
  chev:'<path d="M6 3.5L10.5 8 6 12.5" stroke="C" stroke-width="1.6" fill="none"/>'}[k]||'';
  var col=c[k]||c.ink; if(arguments[2]) col=c[arguments[2]]||arguments[2];
  return '<svg class="ic" width="'+s+'" height="'+s+'" viewBox="0 0 16 16">'+P.replace(/C/g,col)+'</svg>' }
function ship(cls){ var col={courier:'#4FD1E8',hauler:'#FF5FB4',freighter:'#F2F1EC'}[cls], sh={courier:'<path d="M2 3l18 4-18 4 4-4z" fill="'+col+'"/>',
  hauler:'<path d="M2 7l6-5h8l5 5-5 5H8z" fill="'+col+'"/><path d="M16 2l5 5-5 5z" fill="#FFD23F"/>',
  freighter:'<path d="M2 4l3-3h10l3 3v6l-3 3H5l-3-3z" fill="'+col+'"/><path d="M15 1l6 6-6 6z" fill="#FFD23F"/>'}[cls];
  return '<svg class="shp" viewBox="0 0 22 14">'+sh+'</svg>' }

/* ---------- blocks (one look for all variants) ---------- */
function sec(l,r){ return '<div class="sec"><span>'+l+'</span>'+(r?'<span>'+r+'</span>':'')+'</div>' }
function row(k,label,val,sub,valShort,subShort){ return '<div class="r"><span>'+(k?ic(k):'')+label+'</span><b'+(valShort?' class="short"':'')+(k==='people'?' style="color:var(--people)"':'')+'>'+val+'</b><i class="'+(subShort?'short':'')+'">'+(sub||'')+'</i></div>' }
function alarm(){ return lineShort?'<div class="alert">'+ic('fuel',15,'red')+'<span>The line brings too little metal and rations — the works will stop.</span></div>':'' }
var B={
  people:function(){ return row('people','People',W.people,'') },
  eats:function(h){ return (h===false?'':sec('Eats'))+W.eats.map(function(e){ var s=short(e); return row(e.k,NAME[e.k],d(e.n)+'/yr','line '+d(e.b),s,s) }).join('')+alarm() },
  makes:function(h){ var m=W.makes; return (h===false?'':sec('Makes'))+row(m.k,NAME[m.k],d(m.n)+'/yr','line '+d(m.b),false,carryShort)+row('', 'On the surface',m.pile,'') },
  world:function(){ return sec('World')+B.people()+B.eats()+B.makes() },
  online:function(){ return sec('On this line',W.online.length+' hull')+W.online.map(function(s){ return '<div class="hr">'+ship(s.cls)+'<span class="gn">'+s.g+'</span><b>Courier no. '+s.n+'</b><span class="hs">'+ic('hold',13,'mid')+s.hold+'</span><button class="btn ghost">Take off</button></div>' }).join('') },
  add:function(){ return sec('Add a hull','free · '+W.free.length)+W.free.map(function(s){ return '<div class="hr">'+ship('courier')+'<span class="gn">'+s.g+'</span><b>Courier no. '+s.n+'</b><span class="hs">'+ic('hold',13,'mid')+s.hold+'</span><button class="btn">Assign</button></div>' }).join('') },
  order:function(){ return sec('Order a new one','yard · gen III')+'<div class="ord">'+W.order.map(function(o){ return '<div class="oc">'+ship(o.cls)+'<b>'+o.cls+' '+o.g+'</b><button class="btn">Build · '+o.yrs+' yrs</button><span class="os">'+ic('hold',12,'mid')+' '+num(o.hold)+' · +'+d(o.adds)+'/yr on this line</span></div>' }).join('')+'</div>' },
  line:function(){ return B.online()+B.add()+B.order() },
  pips:function(){ var h=''; for(var i=0;i<W.pkg.max;i++) h+='<u class="'+(i<W.pkg.tier?'on':'')+'"></u>'; return '<span class="pips">'+h+'</span>' },
  pkg:function(){ var p=W.pkg; return '<div class="pk"><div class="pk-h"><span class="pi">'+ic('up',18)+'</span><b>'+p.name+'</b>'+B.pips()+'</div>'+
    '<div class="pk-g">'+ic('parts',20)+'<span style="color:var(--parts)">+'+d(p.gain)+'</span><small>parts a year</small></div>'+
    '<div class="pk-x"><span class="l">and eats</span>'+p.extra.map(function(x){ return '<span>'+ic(x.k,12)+'+'+d(x.n)+'</span>' }).join('')+'<span class="l">a year</span></div>'+
    '<div class="pk-f"><span><span class="pr">'+ic('metal',12)+p.metal+'</span><span class="pr">'+ic('parts',12)+p.parts+'</span></span><button class="btn">'+ic('up',14,'#0B0B0C')+'Order</button></div>'+
    (p.biggest<p.hold?'<div class="pk-n">'+ic('hold',14,'red')+'Needs a hull with a hold of '+p.hold+'+ on this line · biggest '+p.biggest+'</div>':'')+'</div>' },
  upgrade:function(){ return sec('Machines','none')+B.pkg() },
  hub:function(){ var h=W.hub; return sec('Hub',h.n+' / '+h.m)+'<div class="hint">Other worlds send their goods here; one line takes it all to Earth.</div>'+
    '<div class="r"><span>Price</span><b><span class="pr">'+ic('metal',12)+num(h.metal)+'</span><span class="pr" style="margin:0">'+ic('parts',12)+h.parts+'</span></b><i></i></div><div style="padding-top:8px"><button class="btn wide">'+ic('hub',14,'#0B0B0C')+'Build a hub</button></div>' },
  evac:function(){ return '<div style="padding-top:12px"><button class="btn redb">'+ic('evac',14,'red')+'Evacuate</button></div><div class="hint" style="text-align:center">Courier no. 3 · all 49</div>' }
};
function head(){ return '<div class="wh">'+ic('parts',14,'#5B82F0')+'<b>'+W.name+'</b><span>'+W.kind+'</span></div>' }
var TABS={
  world:{l:'World',ic:'world',bd:function(){ return lineShort?'<span class="bdg red"></span>':'' }},
  line:{l:'Line',ic:'line',bd:function(){ return '<span class="cnt">'+W.online.length+'</span>'+(lineShort?'<span class="bdg red"></span>':'') }},
  upgrade:{l:'Upgrade',ic:'up',bd:function(){ return '<span class="bdg up"></span>' }},
  hub:{l:'Hub',ic:'hub',bd:function(){ return '' }},
  evac:{l:'Evacuate',ic:'evac',bd:function(){ return '' }}};
function tabBar(list,cur,v){ return '<div class="tabs">'+list.map(function(t){ return '<button data-tab="'+t+'" data-v="'+v+'" class="'+(t===cur?'on':'')+'">'+TABS[t].l+TABS[t].bd()+'</button>' }).join('')+'</div>' }

/* ---------- variants ---------- */
var S={A:'world',B:'line',C:'world',D:{world:true,upgrade:true}};
var V={
 A:{t:'A · Вкладки сверху',
  note:'<b>Четыре вкладки поверх карточки: WORLD · LINE · UPGRADE · HUB.</b> Эвакуация — внизу WORLD. На вкладке точка: красная — линия недовозит, жёлтая — есть пакет. Как вкладки здания в Anno 1800 / планеты в Stellaris (по памяти).'+
   '<span class="pro">+ Карточка в одну колонку и вдвое уже: на телефоне читается без уменьшения. Каждая вкладка — один вопрос.</span>'+
   '<span class="con">− Открыв мир, игрок видит одну вкладку; решение «линия недовозит → поставлю судно» требует перехода WORLD → LINE. Риск: пакет снова «не бросается в глаза» — держится на жёлтой точке.</span>',
  draw:function(){ var t=S.A, body={world:B.world()+B.evac(),line:B.line(),upgrade:B.upgrade(),hub:B.hub()}[t];
   return '<div class="win">'+head()+tabBar(['world','line','upgrade','hub'],t,'A')+'<div class="bd">'+body+'</div></div>' }},
 B:{t:'B · Сводка + вкладки',
  note:'<b>Сводка мира всегда сверху</b> (ест / даёт с линией, тревога), <b>вкладки ниже — только действия</b>: LINE · UPGRADE · HUB · EVACUATE.'+
   '<span class="pro">+ Главное — что не так с миром — видно сразу, без клика; вкладки отвечают «что с этим делать». Открывается на LINE, если линия недовозит, иначе на UPGRADE.</span>'+
   '<span class="con">− Сводка — это ещё цифры над вкладками; на телефоне вкладка начинается ниже середины экрана. Числа в сводке мельче, чем в A.</span>',
  draw:function(){ var t=S.B, body={line:B.line(),upgrade:B.upgrade(),hub:B.hub(),evac:B.evac()}[t];
   var sum='<div class="sum"><div><small>Eats · line</small>'+W.eats.map(function(e){ var s=short(e); return '<span class="chip">'+ic(e.k)+d(e.n)+' <i class="'+(s?'short':'')+'">· '+d(e.b)+'</i></span>' }).join('')+'</div>'+
     '<div><small>Makes · line</small><span class="chip">'+ic('parts')+d(W.makes.n)+' <i class="'+(carryShort?'short':'')+'">· '+d(W.makes.b)+'</i></span><span class="chip">'+ic('people')+W.people+'</span></div></div>';
   return '<div class="win">'+head()+sum+(lineShort?'<div style="padding:0 18px">'+alarm()+'</div>':'')+tabBar(['line','upgrade','hub','evac'],t,'B')+'<div class="bd">'+body+'</div></div>' }},
 C:{t:'C · Значки сбоку',
  note:'<b>Вертикальная полоса значков слева</b>, как левая панель самой игры (EARTH · WORLDS · TECH…). На телефоне полоса уезжает вниз, как нижнее меню приложения.'+
   '<span class="pro">+ Тот же язык, что у главной панели игры: значок + подпись + точка-тревога. Места под содержимое больше всего.</span>'+
   '<span class="con">− Два одинаковых ряда значков рядом (панель игры и карточка) — легко спутать. Подписи мелкие (9 px).</span>',
  draw:function(){ var t=S.C, body={world:B.world()+B.evac(),line:B.line(),upgrade:B.upgrade(),hub:B.hub()}[t];
   var rail='<div class="rail">'+['world','line','upgrade','hub'].map(function(k){ return '<button data-tab="'+k+'" data-v="C" class="'+(k===t?'on':'')+'">'+ic(TABS[k].ic,20,k===t?'ink':'mid')+TABS[k].l+(k==='upgrade'?'<span class="bdg up"></span>':(k!=='hub'&&lineShort?'<span class="bdg red"></span>':''))+'</button>' }).join('')+'</div>';
   return '<div class="win">'+head()+'<div class="cwrap">'+rail+'<div class="bd">'+body+'</div></div></div>' }},
 D:{t:'D · Раскрывающиеся блоки',
  note:'<b>Не вкладки, а свёрнутые блоки</b>: у каждого в заголовке главное число (LINE · 1 hull · 4.0/yr красным). Открытые блоки игра помнит.'+
   '<span class="pro">+ Всё на одной странице, ничего не спрятано за переходом; свёрнутый блок всё равно говорит главное. Можно открыть WORLD и UPGRADE вместе — видно и нехватку, и что даст пакет.</span>'+
   '<span class="con">− Если открыть всё — вернулась нынешняя длинная простыня. Заголовки с числами — тоже текст.</span>',
  draw:function(){ var o=S.D, part=function(k,title,key,keyShort,body){ return '<div class="acc'+(o[k]?' open':'')+'"><button data-acc="'+k+'">'+ic(TABS[k].ic,15,'mid')+'<b>'+title+'</b><span class="k'+(keyShort?' short':'')+'">'+key+'</span>'+ic('chev',13,'mid').replace('class="ic"','class="ic ch"')+'</button><div class="in">'+body+'</div></div>' };
   return '<div class="win">'+head()+
    part('world','World','eats '+d(W.eats[0].n+W.eats[1].n)+' · line '+d(W.eats[0].b+W.eats[1].b),lineShort,B.people()+B.eats()+B.makes())+
    part('line','Line','1 hull · '+d(W.makes.b)+'/yr',carryShort,B.line())+
    part('upgrade','Upgrade','<span style="color:var(--parts)">+'+d(W.pkg.gain)+' parts</span>',false,B.pkg())+
    part('hub','Hub',W.hub.n+' / '+W.hub.m,false,B.hub())+
    part('evac','Evacuate','49 people',false,B.evac())+'</div>' }}
};
var cur='A';
try{ cur=localStorage.getItem('wc.v')||'A' }catch(e){}
if(!V[cur]) cur='A';
function draw(){
  document.getElementById('vs').innerHTML=Object.keys(V).map(function(k){ return '<button data-v="'+k+'" class="'+(k===cur?'on':'')+'">'+V[k].t+'</button>' }).join('');
  document.getElementById('card').innerHTML=V[cur].draw();
  document.getElementById('note').innerHTML=V[cur].note }
document.addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return;
  if(b.parentNode.id==='vs'){ cur=b.dataset.v; try{ localStorage.setItem('wc.v',cur) }catch(x){} draw(); return }
  if(b.dataset.tab){ S[b.dataset.v]=b.dataset.tab; draw(); return }
  if(b.dataset.acc){ S.D[b.dataset.acc]=!S.D[b.dataset.acc]; draw(); return } });
draw();
})();
</script>
</body>
</html>
