<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LAST BERTH — знаки v1</title>
<style>
:root{--bg:#0B0B0C;--pan:#141417;--ln:#2E2E33;--ink:#F2F1EC;--mid:#9C9B95;--red:#FF2A1A;--cy:#45D4E8;--pk:#FF6FB5}
body{margin:0;background:#050506;color:var(--ink);font:14px/1.4 system-ui,sans-serif;padding:24px 16px}
h1{font-size:14px;letter-spacing:.22em;margin:0 0 4px}p{color:var(--mid);margin:0 0 20px;max-width:640px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;max-width:1000px}
.c{background:var(--bg);border:1px solid var(--ln);padding:16px;display:flex;flex-direction:column;gap:10px}
.c svg{width:100%;height:auto;display:block}.c b{font-size:12px;letter-spacing:.14em}.c small{color:var(--mid)}
.row{display:flex;align-items:center;gap:12px;border-top:1px solid var(--ln);padding-top:10px}.row svg{width:28px;flex:none}
.row span{font-weight:700;letter-spacing:.22em;font-size:14px}
</style>
<h1>M7 — ИТОГ: ЗНАК, МАЛЫЙ ЗНАК, ГЕРБ</h1><p>Три файла: mark-m7.svg, mark-m7-small.svg, crest-m7.svg.</p>

.strip{display:flex;align-items:center;gap:14px;margin:10px 0;background:#0B0B0C;border:1px solid #2E2E33;padding:10px 14px;max-width:700px}.strip span{font-weight:700;letter-spacing:.22em;font-size:14px}.strip small{color:#9C9B95;margin-left:auto}</style>
