/* ---------- actions ---------- */

function buildShip(G,hullId){
  var h=HULLS[hullId]; if(!h) return 'locked';
  if(h.gen>(G.gen||0)) return 'locked';
  if(h.gen<(G.gen||0)-K.GEN_OVERLAP) return 'retired';
  if(reach(G)<h.reach) return 'locked';
  if(G.earth.metal<h.metal||G.earth.fuel<h.fuel||G.earth.parts<(h.parts||0)) return 'cost';
  if(G.earth.people-K.EARTH_KEEP<(h.crew||0)) return 'crew';
  G.earth.metal-=h.metal; G.earth.fuel-=h.fuel; G.earth.parts-=(h.parts||0); openPaid(G,{metal:h.metal,fuel:h.fuel,parts:h.parts||0});
  G.earth.people-=(h.crew||0);                     // she signs on for the life of the hull
  G.ledger.metalYards+=h.metal;
  var s={id:G.nextShip++, hull:hullId, cap:h.cap, gen:h.gen, crew:(h.crew||0), mode:'building', t:h.days, at:'earth',
         target:null, route:null, auto:true, cargo:{metal:0,food:0,fuel:0,parts:0,people:0}, out:{metal:0,food:0,parts:0,people:0}, take:{metal:0,food:0,fuel:0,parts:0}, missDays:0, bearing:null, job:null};
  G.ships.push(s); log(G,'ship_ordered',{n:s.id});
  return 'ok';
}

/* scrapping: an idle hull at Earth comes apart for part of what it cost.
   Old generations pile up (Nikita hit 21 idle couriers by day 600) and
   need a way out that is not "let them rot in the list". */
function scrapValue(h){ return {metal:Math.round(h.metal*K.SCRAP_METAL), parts:Math.round((h.parts||0)*K.SCRAP_PARTS)} }
function scrap(G,shipId){
  var s=shipById(G,shipId); if(!s) return 'noship';
  if(s.mode==='dead') return 'noship';
  if(!(s.mode==='idle'&&s.at==='earth')) return 'busy';
  var v=scrapValue(HULLS[s.hull]);
  G.earth.metal+=v.metal; G.earth.parts+=v.parts; openPaid(G,v);
  G.earth.people+=(s.crew||0);                     // the crew walks off and goes home
  G.ledger.metalScrap=(G.ledger.metalScrap||0)+v.metal;
  var cw=s.crew||0;
  s.mode='dead'; s.crew=0; s.from=null; s.to=null; s.pend=null; s.scrapped=G.day;
  log(G,'scrapped',{n:s.id,m:v.metal,t:v.parts,c:cw});
  return 'ok';
}
function shipById(G,id){for(var i=0;i<G.ships.length;i++)if(G.ships[i].id===id)return G.ships[i];return null}

function canDepart(G,s,pid){
  var p=planet(pid);
  if(!p) return 'noplanet';
  if(!sectorOpen(G,p.sec)) return 'sector';
  if(G.ghost&&G.ghost[pid]) return 'ghost';
  if(!canReachSector(s,p.sec)) return 'range';
  if(s.mutiny) return 'mutiny';
  if(s.mode!=='idle'||s.at!=='earth') return 'busy';
  var f=Math.round(p.dist*K.FUEL_PER_DIST/Math.sqrt(driveSpeed(G)));
  if(G.earth.fuel<f) return 'fuel';
  return 'ok';
}

function launch(G,s,pid,job,cargo){
  var p=planet(pid);
  var f=Math.round(p.dist*K.FUEL_PER_DIST/Math.sqrt(driveSpeed(G)));
  G.earth.fuel-=f; if(f>0) openRes(G,'fuel');
  s.cargo={metal:0,food:0,fuel:0,parts:0,people:0};
  for(var k in cargo){s.cargo[k]=cargo[k]; G.earth[k==='people'?'people':k]-=cargo[k];}
  G.ledger.metalOut+=(cargo.metal||0);
  s.waiting=false; s.from=null; s.to=null; s.pend=null;
  s.origin='earth'; s.dest=pid; s.target=pid;
  s.mode='transit'; s.at=null; s.dir='out'; s.t=legDays(G,'earth',pid,s); s.total=s.t; s.job=job; s.reserve=false;
}

/* v4.14: when no free hull at Earth can lift a world — the nearest rated hull on its way home, or null */
function nextHome(G,pid,cls){ var p=planet(pid), best=null; if(!p) return null;
  for(var i=0;i<G.ships.length;i++){ var s=G.ships[i]; if(s.mode==='dead'||s.mode==='missing'||s.mutiny) continue; if(!canReachSector(s,p.sec)) continue; if(cls&&HULLS[s.hull].key!==cls) continue;
    var t = s.mode==='building' ? s.t : (s.mode==='transit' ? (s.dest==='earth' ? s.t : s.t+legDays(G,s.dest,'earth',s)) : (s.at==='earth' ? 0 : legDays(G,s.at,'earth',s)));
    if(best===null||t<best.t) best={id:s.id,t:t} }
  return best }
function enRoute(G,pid){ for(var i=0;i<G.ships.length;i++){ var o=G.ships[i]; if(o.mode==='transit'&&o.job==='colonize'&&o.dest===pid) return o } return null }
function foundParty(G,s,pid){ return Math.max(0,Math.floor(Math.min(popCap(planet(pid)), s.cap, G.earth.people-K.EARTH_KEEP-K.FOUND_KEEP))) }
function colonize(G,shipId,pid,people,food){
  var s=shipById(G,shipId); if(!s) return 'noship';
  var chk=canDepart(G,s,pid); if(chk!=='ok') return chk;
  if(G.colonies[pid]) return 'taken';
  if(enRoute(G,pid)) return 'enroute';   // v4.8 (Nikita, 27.09: prologue soft-lock — two founding hulls to the same farm)
  /* v4.4 (Nikita, 25.09: "зачем мне выбирать, сколько посадить — ненужное действие"): the founding party
     is as many as the world can use, the hold can carry and Earth can spare. The old arguments are ignored. */
  people=foundParty(G,s,pid);
  if(people<K.MIN_FOUND) return 'people';
  var f=Math.max(1,Math.round(planet(pid).dist*K.FUEL_PER_DIST/Math.sqrt(driveSpeed(G))));
  G.earth.fuel-=f; G.earth.people-=people; openRes(G,'fuel');   // v4.34: fuel opens with the first settlers' price
  s.cargo={metal:0,food:0,fuel:0,parts:0,people:people};
  s.job='colonize'; s.origin='earth'; s.dest=pid; s.at=null; s.waiting=false;
  s.mode='transit'; s.dir='out'; s.t=legDays(G,'earth',pid,s); s.total=s.t;
  log(G,'launch_colony',{n:s.id,p:pid,people:people});
  return 'ok';
}

/* A line is always world <-> Earth. Only Earth consumes, so a leg between two
   colonies was a second way to do the same thing and doubled the UI for nothing
   (Nikita, 22.09). `to` is accepted and ignored so old calls still work. */
function setLine(G,shipId,from,to){
  var s=shipById(G,shipId); if(!s) return 'noship';
  if(from==='earth') from=to;                  // tolerate either argument order
  to='earth';
  if(!from||from==='earth') return 'samenode';
  if(from!=='earth'&&!G.colonies[from]) return 'nocolony';
  if(to!=='earth'&&!G.colonies[to]) return 'nocolony';
  if(s.mode==='dead') return 'noship';
  if(s.mode==='missing') return 'lost';
  if(s.mutiny) return 'mutiny';
  if(!canReachSector(s,planet(from).sec)) return 'range';
  if(s.mode==='building'||s.mode==='transit'){ s.pend={from:from,to:to}; s.lineFor=null; s.moveTo=null; return 'queued' }   // v4.34: one line at a time
  if(from!=='earth'&&G.reserves[from]<=0&&planet(from)&&planet(from).kind!=='works'&&pileLeft(G,from)<1) return 'depleted';   // v4.9/v4.11
  s.pend=null; s.from=from; s.to=to; s.auto=true; s.policy=null; s.homeOnly=null; s.reserve=false;
  if(s.mode==='idle'){ if(!s.at) s.at='earth'; var r=sail(G,s); if(r!=='ok') return r }
  return 'ok';
}
/* v3.8.1 (log 57539013, tester: "нельзя было снять судно"): a line ordered while the hull was in transit
   sat in s.pend, and Release only cleared from/to — the hull came home and took the queued line anyway.
   v4.34: a hull still in the yards for a line comes out free. */
function clearLine(G,shipId){var s=shipById(G,shipId);if(s){ s.from=null;s.to=null;s.pend=null;s.moveTo=null;s.lineFor=null }return 'ok'}
/* v4.31 (Nikita, 13.10, F-36): 'move to → world' under a hull of the line panel — off its line and onto the other world's line.
   A refusal leaves the hull where it was: the cheap checks run first, a refusal from sail() is rolled back. */
function moveLine(G,shipId,pid){
  var s=shipById(G,shipId); if(!s||s.mode==='dead') return 'noship';
  if(s.mode==='missing') return 'lost';
  if(s.mutiny) return 'mutiny';
  var p=planet(pid); if(!p||!G.colonies[pid]) return 'nocolony';
  if((s.from||(s.pend&&s.pend.from))===pid) return 'samenode';
  if(!canReachSector(s,p.sec)) return 'range';
  if(G.reserves[pid]<=0&&p.kind!=='works'&&pileLeft(G,pid)<1) return 'depleted';
  /* v4.32 (Nikita, 13.10: 'перевод по готовности, никаких очередей или наслоений'): a hull in flight only remembers the order
     (s.moveTo) and changes line when she docks — see the docking step in tick. */
  if(s.mode==='transit'){ s.moveTo=pid; return 'queued' }
  s.moveTo=null;
  var snap={from:s.from,to:s.to,pend:s.pend,lineFor:s.lineFor,auto:s.auto,policy:s.policy,homeOnly:s.homeOnly,reserve:s.reserve,waiting:s.waiting};
  clearLine(G,shipId); var r=setLine(G,shipId,pid,'earth');
  if(r!=='ok'&&r!=='queued'){ if(!s.mutiny){ for(var f in snap) s[f]=snap[f] } return r }   // sail refused (fuel, crew…): the hull goes back where it was
  return r }
/* ---------- v4.34: lines are manned by hand (Nikita, 14–15.10) ----------
   The v4.6 standing order ('two haulers on Mire', the yards filling it, renewal, retiring the extra hulls) is gone.
   A line is the hulls on it: the player puts a free hull on it, moves one from another line, or orders a new hull for it.
   A hull that is lost, refuses the Night or comes home from a spent world is not replaced by anyone. */
var CLASSES=['courier','hauler','freighter'];
function pileLeft(G,pid){ var c=G.colonies[pid], p=planet(pid); if(!c||!p) return 0; return Math.floor(c.store[p.kind==='works'?'parts':p.dep]||0) }   // v4.11: what is still on the surface
function shipClass(s){ return HULLS[s.hull]?HULLS[s.hull].key:'courier' }
function onLine(G,pid){ var out=[]; for(var i=0;i<G.ships.length;i++){ var o=G.ships[i]; if(o.mode==='dead') continue;
  if((o.from===pid&&o.to==='earth')||(o.pend&&o.pend.from===pid)||(o.lineFor===pid&&o.mode==='building')) out.push(o) } return out }
function lineCount(G,pid,cls){ var n=0, ships=onLine(G,pid); for(var i=0;i<ships.length;i++){ if(shipClass(ships[i])===cls) n++ } return n }
/* the hull of a given generation. v4.31 (Nikita, 13.10, F-36): an order always takes the current generation */
function hullAt(cls,gen){ for(var i=0;i<HULLS.length;i++){ if(HULLS[i].key===cls&&HULLS[i].gen===gen) return i } return null }
function currentHull(G,cls){ var best=null; for(var i=0;i<HULLS.length;i++){ var h=HULLS[i]; if(h.key!==cls) continue; if(h.gen>(G.gen||0)) continue; if(best===null||h.gen>HULLS[best].gen) best=i } return best }
/* why a new hull of this class cannot be ordered for this line right now; 'ok' when it can */
function orderCheck(G,pid,cls){
  if(!G.colonies[pid]) return 'nocolony';
  if(CLASSES.indexOf(cls)<0) return 'noclass';
  var hi=currentHull(G,cls); if(hi===null) return 'locked';
  var h=HULLS[hi], p=planet(pid);
  if(reach(G)<h.reach) return 'locked';
  if(!canReachSector({hull:hi},p.sec)) return 'range';
  if(G.reserves[pid]<=0&&p.kind!=='works'&&pileLeft(G,pid)<1) return 'depleted';   // nothing to carry: the seam is dead and the pile is gone
  for(var i=0;i<G.ships.length;i++){ var o=G.ships[i]; if(o.job==='evac'&&o.dest===pid&&o.mode==='transit') return 'evacuating' }   // the world is being lifted
  if(G.night&&nightLeft(G)<h.days+K.MUTINY_MIN*legDays(G,pid,'earth',{hull:hi})*2) return 'orderNight';   // no crew would sign — the yard time counts too (v4.14)
  if(G.earth.metal<h.metal||G.earth.fuel<h.fuel||G.earth.parts<(h.parts||0)) return 'cost';
  if(G.earth.people-K.EARTH_KEEP<(h.crew||0)) return 'crew';
  return 'ok';
}
/* order a new hull of the current generation for this line: paid now, she takes the line when she leaves the yards */
function orderFor(G,pid,cls){
  var r=orderCheck(G,pid,cls); if(r!=='ok') return r;
  r=buildShip(G,currentHull(G,cls)); if(r!=='ok') return r;
  var ns=G.ships[G.ships.length-1]; ns.lineFor=pid; ns.pend={from:pid,to:'earth'};
  log(G,'yard_line',{n:ns.id,p:pid,g:hullGen(ns)}); G.stats.yardBuilt=(G.stats.yardBuilt||0)+1;
  return 'ok';
}
/* v4.34: a save from before manual lines — the standing orders are dropped, the hulls on the lines stay where they are */
function upgradeSave(G){
  if(!G.opened) G.opened={food:0,metal:0,fuel:0,parts:0};   // v4.34: an older save burns as it did — every resource open from day 0
  if(G.lines===undefined) return;   // every save since v4.6 carries G.lines; a v4.34 game never does
  delete G.lines;
  for(var i=0;i<G.ships.length;i++){ var s=G.ships[i]; if(s.retire!==undefined) delete s.retire; if(s.replaces!==undefined) delete s.replaces; if(s.successor!==undefined) delete s.successor }
}
function setAuto(G,shipId,pid){ return setLine(G,shipId,'earth',pid) }
function setAutoOld(G,shipId,pid){
  var s=shipById(G,shipId); if(!s) return 'noship';
  if(!G.colonies[pid]) return 'nocolony';
  s.route=pid; s.auto=true; s.policy=null;
  if(s.mode==='idle'&&s.at==='earth'){ var r=runRoute(G,s); if(r!=='ok') return r }
  return 'ok';
}
function setPolicy(G,shipId,pid,deliver,collect){
  var s=shipById(G,shipId); if(!s) return 'noship';
  if(!G.colonies[pid]) return 'nocolony';
  s.route=pid; s.auto=false;
  s.policy={ deliver:{metal:(deliver&&deliver.metal)|0, food:(deliver&&deliver.food)|0,
                      parts:(deliver&&deliver.parts)|0, people:(deliver&&deliver.people)|0},
             collect:{metal:(collect&&collect.metal)|0, food:(collect&&collect.food)|0,
                      fuel:(collect&&collect.fuel)|0, parts:(collect&&collect.parts)|0} };
  if(s.mode==='idle'&&s.at==='earth'){ var r=runRoute(G,s); if(r!=='ok') return r }
  return 'ok';
}
function setRoute(G,shipId,pid,out,take){
  var s=shipById(G,shipId); if(!s) return 'noship';
  if(!G.colonies[pid]) return 'nocolony';
  s.route=pid;
  s.out={metal:(out&&out.metal)|0, food:(out&&out.food)|0, parts:(out&&out.parts)|0, people:(out&&out.people)|0};
  var d={metal:0,food:0,fuel:0,parts:0};
  if(take){ for(var tk in d) d[tk]=Math.max(0,(take[tk]|0)) }
  else { d[planet(pid).dep]=s.cap }
  s.take=d;
  
  if(s.mode==='idle'&&s.at==='earth'){var r=runRoute(G,s); if(r!=='ok'){return r}}
  return 'ok';
}
function dispatch(G,shipId,pid,out,take){
  var s=shipById(G,shipId); if(!s) return 'noship';
  if(s.mode!=='idle'||s.at!=='earth') return 'busy';
  var r=setRoute(G,shipId,pid,out,take);
  return r;
}
function repeatRun(G,shipId){
  var s=shipById(G,shipId); if(!s) return 'noship';
  if(!s.route) return 'noroute';
  if(s.mode!=='idle'||s.at!=='earth') return 'busy';
  return runRoute(G,s);
}
function clearRoute(G,shipId){var s=shipById(G,shipId);if(s)s.route=null;return 'ok'}

function runRoute(G,s){
  var pid=s.route; if(!pid) return 'noroute';
  var chk=canDepart(G,s,pid); if(chk!=='ok') return chk;
  launch(G,s,pid,'haul',{});
  return 'ok';
}



function abandon(G,shipId,pid){
  var s=shipById(G,shipId); if(!s) return 'noship';
  if(!HULLS[s.hull]||HULLS[s.hull].key!=='courier') return 'evacCourier';   // v4.18 (Nikita, 04.10): only a courier lifts a settlement
  var c=G.colonies[pid]; if(!c) return 'nocolony';
  for(var i=0;i<G.ships.length;i++){ var o=G.ships[i]; if(o.job==='evac'&&o.dest===pid&&o.mode==='transit') return 'evacuating' }
  var chk=canDepart(G,s,pid); if(chk!=='ok') return chk;
  if(G.night&&nightLeft(G)<legDays(G,'earth',pid,s)*2) return 'evacLate';   // v4.33: she would not be home before the Night
  if(c.kit){ G.earth.metal+=c.kit.metal; G.earth.parts+=c.kit.parts; c.kit=null }   // v4.4: a kit not yet shipped goes back to the yards
  launch(G,s,pid,'evac',{});
  log(G,'launch_evac',{n:s.id,p:pid});
  return 'ok';
}


function search(G,shipId,missId){
  var s=shipById(G,shipId); if(!s) return 'noship';
  var m=null;for(var i=0;i<G.ships.length;i++)if(G.ships[i].id===missId&&G.ships[i].mode==='missing')m=G.ships[i];
  if(!m) return 'nomissing';
  var where = m.dest&&m.dest!=='earth' ? m.dest : (m.origin&&m.origin!=='earth' ? m.origin : m.target);
  if(!where||!planet(where)) return 'noplanet';
  var chk=canDepart(G,s,where); if(chk!=='ok') return chk;
  launch(G,s,where,'search',{});
  s.searchFor=missId;
  log(G,'launch_search',{n:s.id,m:missId});
  return 'ok';
}

/* the drive programme is repeatable: every mark cuts crossings and signal lag
   again, costs more parts than the last, and demands more reach. There is no
   final mark, which is where the endless half of the progression lives. */
function startDrive(G,pid){
  if(G.drive) return 'running';
  if(settledCount(G)<driveReachFor(G)) return 'settled';
  var c=G.colonies[pid], p=planet(pid);
  if(!c) return 'nocolony';
  if(!p||p.kind!=='works') return 'notworks';
  if(c.pop<K.DRIVE_POP) return 'pop';
  G.drive=pid; G.driveWork=0;
  for(var wk in G.colonies){ if(planet(wk).kind==='works'){
    G.driveWork+=(G.colonies[wk].store.parts||0); G.colonies[wk].store.parts=0 } }
  var fromHome=Math.min(G.earth.parts, driveWorkFor(G));   // the yards ship their stock to the programme
  G.earth.parts-=fromHome; G.driveWork+=fromHome; if(fromHome>0) openRes(G,'parts');
  log(G,'drive_started',{p:pid,n:G.driveLvl+1});
  if(G.driveWork>=driveWorkFor(G)) driveDone(G,pid);
  return 'ok';
}
function driveDone(G,pid){
  G.driveWork=0; G.drive=null; G.driveLvl=(G.driveLvl||0)+1;
  G.gen=G.driveLvl; ensureGen(G.gen);
  G.pauseNow=true; log(G,'drive_mark',{p:pid,n:G.driveLvl+1,s:sectorLimit(G.gen)});
  if(G.arkMark!==null&&G.arkMark!==undefined&&G.driveLvl>=G.arkMark)
    log(G,'ark_drive',{g:G.driveLvl,w:Math.round(arkWake(G)*100),y:G.night});
}
function researchHyper(G){ return 'notworks' }

/* ---------- the Long Night and the ark ---------- */
function revealNight(G){
  if(G.night) return;
  G.night=G.day+K.NIGHT_YEARS; G.pauseNow=true;
  G.arkMark=Math.max(K.ARK_DRIVE_MIN,(G.driveLvl||0)+K.ARK_ABOVE);   // v4.4: two marks above, not one
  log(G,'night_dated',{y:G.night,n:K.NIGHT_YEARS});
}
/* ---------- v4.0: the second date ---------- */
function workAt(l){ return Math.round(K.DRIVE_WORK*Math.pow(K.DRIVE_WORK_GROW,l)) }
function reachAt(l){ return K.DRIVE_REACH+K.DRIVE_REACH_GROW*l }
function arkReady(G){ return G.arkMark!==null&&G.arkMark!==undefined&&(G.driveLvl||0)>=G.arkMark }
/* share of the sleepers who wake at the other end, on the drive you have now (0 = the ark cannot sail) */
function arkWake(G){ if(!arkReady(G)) return 0; var i=Math.min(K.ARK_WAKE.length-1,(G.driveLvl||0)-G.arkMark); return K.ARK_WAKE[i] }
function wakeAt(G,l){ if(G.arkMark===null||l<G.arkMark) return 0; return K.ARK_WAKE[Math.min(K.ARK_WAKE.length-1,l-G.arkMark)] }
/* when the drive reaches generation index `target` at the pace the works keep now.
   st: done | ok (y = year) | reach (the next mark wants more worlds) | host (no works world can host) | stalled (no parts coming in).
   rn = the reach the last mark on the way will want; the date assumes you get there. */
function driveForecast(G,target){
  var lvl=G.driveLvl||0;
  if(lvl>=target) return {st:'done'};
  var r=settledCount(G), rn=reachAt(target-1);
  if(!G.drive){
    if(r<reachAt(lvl)) return {st:'settled',n:reachAt(lvl),r:r,rn:rn};
    var host=false; for(var k in G.colonies){ var c=G.colonies[k]; if(planet(k).kind==='works'&&c.pop>=K.DRIVE_POP) host=true }
    if(!host) return {st:'host',rn:rn};
  }
  var have=G.drive? G.driveWork : G.earth.parts;
  if(!G.drive) for(var k2 in G.colonies){ if(planet(k2).kind==='works') have+=(G.colonies[k2].store.parts||0) }
  var left=Math.max(0,workAt(lvl)-have);
  for(var l=lvl+1;l<target;l++) left+=workAt(l);
  var rate=G.partsRate||0;
  if(rate<0.05) return {st:'stalled',rn:rn};
  return {st:'ok',y:G.day+Math.ceil(left/rate),left:Math.round(left),rate:rate,rn:rn};
}
function nightLeft(G){ return G.night? Math.max(0,G.night-G.day) : null }
var ARK_RES=['metal','parts','food','fuel'];
function arkPrice(l){ var L=K.ARK_LEVELS[l-1]; return L?{metal:L.metal,parts:L.parts,food:L.food,fuel:L.fuel}:null }
/* the highest level whose whole price has been paid in (credit, at full price) */
function arkLevel(G){ var lv=0;
  for(var l=1;l<=K.ARK_LEVELS.length;l++){ var c=arkPrice(l), ok=true;
    for(var i=0;i<4;i++){ if(G.ark.paid[ARK_RES[i]]+1e-6<c[ARK_RES[i]]) ok=false }
    if(!ok) break; lv=l }
  return lv }
/* what is still owed on the way to level l, at full price */
function arkOwed(G,l){ var c=arkPrice(l), o={}; for(var i=0;i<4;i++){ var r=ARK_RES[i]; o[r]=Math.max(0,c[r]-G.ark.paid[r]) } return o }
function arkCap(l){ var L=K.ARK_LEVELS[l-1]; return L?L.cap:{metal:0,parts:0,food:0,fuel:0} }
/* v4.29: a level is bought in one go (what is still owed on the way to it, at full price). 'ok' or why */
function arkCheck(G,l){
  if(!G.night) return 'night';
  if(!arkPrice(l)) return 'arklevel';
  if(l<=arkLevel(G)) return 'arkhave';
  return 'ok' }
function arkBuy(G,l){
  var w=arkCheck(G,l); if(w!=='ok') return w;
  var o=arkOwed(G,l), E=G.earth, cost={}, i, r;
  for(i=0;i<4;i++){ r=ARK_RES[i]; cost[r]=Math.ceil(o[r]); if(E[r]<cost[r]) return r }
  var c=arkPrice(l); for(i=0;i<4;i++){ r=ARK_RES[i]; E[r]-=cost[r]; if(cost[r]>0) openRes(G,r); G.ark.paid[r]=Math.max(G.ark.paid[r],c[r]) }
  G.ark.lv=l;
  log(G,'ark_bought',{l:l}); return 'ok' }
/* v4.29: the convoy — hulls docked at Earth, of the ark drive's generation or ARK_CONVOY_BELOW under it. The ark does
   not sail without it. `gen` is the lowest generation that counts; have/need per class; ok when every class is met. */
function convoyGen(G){ return Math.max(0,(G.arkMark===null||G.arkMark===undefined?K.ARK_DRIVE_MIN:G.arkMark)-K.ARK_CONVOY_BELOW) }
function convoyHull(G,s){ return s.mode==='idle'&&s.at==='earth'&&!(s.from&&s.to)&&hullGen(s)>=convoyGen(G) }   // v4.31 (F-35): a mutinied crew refuses to fly, not to board — the hull counts
function arkConvoy(G){
  var need=K.ARK_CONVOY, have={courier:0,hauler:0,freighter:0}, ok=true, k;
  for(var i=0;i<G.ships.length;i++){ var s=G.ships[i]; if(convoyHull(G,s)) have[shipClass(s)]++ }
  for(k in need){ if((have[k]||0)<need[k]) ok=false }
  return {need:need, have:have, ok:ok, gen:convoyGen(G)} }
/* v4.29: a hull set aside for the ark — the yards neither break it up for idling nor take it for a line; a line or
   a flight ordered by hand releases it. Setting it aside pulls the hull off its line (it comes home and waits). */
function setReserve(G,shipId,on){
  var s=shipById(G,shipId); if(!s||s.mode==='dead') return 'noship';
  if(s.mode==='missing') return 'lost';
  if(on){ if(s.from||s.pend) clearLine(G,shipId); s.reserve=true } else s.reserve=false;
  return 'ok' }
/* who would sail if the ark left today: everyone at home and at the pier, if a level has been paid in */
function arkSouls(G){ return arkLevel(G)>=1 ? Math.max(0,Math.floor(G.earth.people)+crewDocked(G)) : 0 }
/* what rides along: what is left on Earth, up to the cap of the level */
function arkCargo(G){ var cap=arkCap(arkLevel(G)), out={}; for(var i=0;i<4;i++){ var r=ARK_RES[i]; out[r]=Math.max(0,Math.min(Math.floor(G.earth[r]),cap[r])) } return out }
function leftBehind(G){
  var col=0; for(var k in G.colonies) col+=G.colonies[k].pop;
  var tr=0; for(var i=0;i<G.ships.length;i++) tr+=(G.ships[i].cargo.people||0);
  return { home:Math.max(0,Math.floor(G.earth.people)+crewDocked(G)-arkSouls(G)), hulls:crewAway(G), colonies:Math.round(col), transit:Math.round(tr) };
}

/* ---------- the chronicle ----------
   One line per shift. The mood is picked by what the new shift walks into, worst first. */
function chronShift(G,cols){
  var E=G.earth, idle=0;
  for(var i=0;i<G.ships.length;i++){ var s=G.ships[i]; if(s.mode==='idle'&&s.at==='earth'&&!(s.from&&s.to)) idle++ }
  var no=Math.round(G.day/K.SHIFT_YEARS)+1, left=nightLeft(G), k;
  /* v4.1: the world lives by the date. The first shift after the date, then every other shift, writes
     about the era rather than the chart: 'dated' once, 'long' while the Night is far, 'dusk' inside the
     last thousand years. The other shifts keep reporting worlds, so the chronicle still carries facts. */
  var era=null;
  if(left!==null&&left>K.NIGHT_NEAR){
    if(!G.datedShift){ G.datedShift=no; era='dated' }
    else if((no-G.datedShift)%2===1) era= left<=K.DUSK_YEARS ? 'dusk' : 'long';
  }
  if(G.hungry) k='hungry';
  else if(left!==null&&left<=K.NIGHT_NEAR) k='night';
  else if(era) k=era;
  else if(!cols) k='empty';
  else if(idle>=4) k='idle';
  else if(cols>(G.lastShiftCols||0)) k='grow';
  else if(cols<(G.lastShiftCols||0)) k='shrink';
  else k='calm';
  G.lastShiftCols=cols;
  log(G,'shift',{n:no,k:k,c:cols,h:Math.round(E.people),i:idle,n2:left||0,b:arkSouls(G)});
  /* v4.5 (Nikita, 26.09: 'менеджмент, но не такой быстрый'): the shift is the unit of the game. Every
     SHIFT_YEARS the desk stops and hands the new shift a report of the eighty years just gone; the UI
     decides whether to actually pause (never inside the prologue, never for bots). */
  var m=G.shiftMark||{delivered:{metal:0,food:0,fuel:0,parts:0,people:0},founded:0,lost:0,mutinies:0,kits:0,sectors:2,drive:0,cols:0,evac:0,berths:0,arkLv:0,day:0};
  var ev=0; for(var q in G.ghost) ev++; for(var q2 in G.reserves){ } 
  G.shiftReport={no:no,k:k,day:G.day,years:G.day-(m.day||0),
    d:{metal:Math.round(G.delivered.metal-m.delivered.metal),food:Math.round(G.delivered.food-m.delivered.food),fuel:Math.round(G.delivered.fuel-m.delivered.fuel),parts:Math.round(G.delivered.parts-m.delivered.parts),people:Math.round(G.delivered.people-m.delivered.people)},
    founded:G.stats.founded-m.founded, lost:G.stats.lost-m.lost, mutinies:(G.stats.mutinies||0)-m.mutinies, kits:(G.stats.kits||0)-m.kits,
    sectors:SECTORS.length-m.sectors, drive:(G.driveLvl||0)-m.drive, cols:cols, colsWas:m.cols, idle:idle, hands:Math.round(E.people),
    berths:arkSouls(G), berthsWas:m.berths, arkLv:arkLevel(G), left:left, hungry:!!G.hungry,
    built:(G.stats.yardBuilt||0)-(m.built||0),
    attrition:(G.stats.attrition||0)-(m.attrition||0), handsRate:+handsRate(G).toFixed(2)};
  G.shiftMark={delivered:{metal:G.delivered.metal,food:G.delivered.food,fuel:G.delivered.fuel,parts:G.delivered.parts,people:G.delivered.people},
    founded:G.stats.founded,lost:G.stats.lost,mutinies:G.stats.mutinies||0,kits:G.stats.kits||0,sectors:SECTORS.length,drive:G.driveLvl||0,cols:cols,berths:arkSouls(G),arkLv:arkLevel(G),day:G.day,built:G.stats.yardBuilt||0,attrition:G.stats.attrition||0};
  G.shiftOpen=true;
}

/* ---------- tick ---------- */

function lineRate(G,pid){
  var p=planet(pid), c=G.colonies[pid]; if(!c) return null;
  var makes = (p.kind==='works' ? c.pop*p.rich*K.REFINE
            : (G.reserves[pid]>0 ? c.pop*p.rich*K.PROD : 0))*rateMult(c);   // v4.4: kits
  // count the hulls actually standing on a line that touches this world.
  // (this used to test s.route, which lines have not set since v0.9 — every
  //  running line reported "carries nothing", so the panel, the map marker and
  //  the advisor all claimed the ships were idle while they were hauling.)
  var hulls=0, carries=0, trip=0;
  for(var i=0;i<G.ships.length;i++){ var s=G.ships[i];
    if(s.mode==='dead'||s.mode==='missing') continue;
    if(!(s.from&&s.to)) continue;
    if(s.from!==pid&&s.to!==pid) continue;
    var rt=Math.max(1,legDays(G,s.from,s.to,s)*2);
    hulls++; carries+=s.cap/rt;
    if(!trip||rt<trip) trip=rt;
  }
  var dep = p.kind==='works'?'parts':p.dep;
  var sitting = c.store[dep]||0;
  return {makes:makes, carries:carries, hulls:hulls, trip:trip, dep:dep,
          sitting:sitting, dry:(G.reserves[pid]!==Infinity&&G.reserves[pid]<=0),
          short: makes-carries, piling: makes>carries+0.01};
}

/* ---------- v4.38 (Nikita, 19.10): the line's fit — which hull to add, which one runs half empty ----------
   «игра предлагает, какое судно построить, если линия не справляется; предупреждает, что судов больше, чем вывоз;
   предлагает перенести с другой линии или взять судно, которое стоит без дела». Option A: one action, in this order —
   a free hull at Earth, a spare hull off another line, the smallest new hull that closes the gap. Pure; the advisor reads it. */
var FIT_PILE=120,   // a surface pile this big is the line falling behind, and spare hulls are still clearing it
    FIT_SPARE=1.2;  // a hull is spare when the line carries this many times what it must without her
/* what one hull carries a year on this world's line, at her speed; a hull number or {hull:i} for one not yet built */
function hullYield(G,pid,s){ var h=HULLS[s.hull]; return (s.cap!=null?s.cap:(h?h.cap:0))/Math.max(1,legDays(G,pid,'earth',s)*2) }
/* what the line must carry a year (the world's output, or what a works or a kit burns if that is more) against what its
   hulls carry — the ones in the yards or on their way to the line counted, they are coming; a hull told to move (s.moveTo,
   she changes line when she docks) counts for the line she is going to */
function lineFit(G,pid){
  var lr=lineRate(G,pid); if(!lr) return null;
  var fr=feedRates(G,pid), need=Math.max(lr.makes,(fr.metal||0)+(fr.food||0)+(fr.fuel||0));
  var hs=onLine(G,pid).filter(function(s){ return s.mode!=='missing'&&(!s.moveTo||s.moveTo===pid) }), carries=0;   // a missing hull carries nothing (reviewer v4.38)
  G.ships.forEach(function(s){ if(s.moveTo===pid&&s.mode!=='dead'&&s.mode!=='missing'&&hs.indexOf(s)<0) hs.push(s) });
  for(var i=0;i<hs.length;i++) carries+=hullYield(G,pid,hs[i]);
  return {need:need, carries:carries, gap:need-carries, hulls:hs, sitting:lr.sitting, dep:lr.dep};
}
/* the hulls this line can lose and still carry FIT_SPARE times what it must, the biggest first. None while the world still
   takes settlers, waits for a kit, has a pile to clear or a dead seam — the extra hold is working there */
function lineSpare(G,pid){
  var c=G.colonies[pid], p=planet(pid), f=lineFit(G,pid); if(!c||!f) return [];
  if(c.kit||c.pop<popWant(p)*0.95||f.sitting>FIT_PILE) return [];
  if(p.kind!=='works'&&G.reserves[pid]!==Infinity&&G.reserves[pid]<=0) return [];
  var left=f.carries, out=[];
  f.hulls.filter(function(s){ return s.mode!=='building'&&s.mode!=='missing'&&!s.mutiny&&!s.job&&!s.moveTo })
    .sort(function(a,b){ return hullYield(G,pid,b)-hullYield(G,pid,a)||hullGen(a)-hullGen(b) })
    .forEach(function(s){ var y=hullYield(G,pid,s); if(left-y>=f.need*FIT_SPARE){ left-=y; out.push(s) } });
  return out;
}
/* what to do about a line that falls behind: {kind:'free'|'move'|'build', sid|cls, add, gap}, or null when the hulls
   coming close it. opt.noMove — the player cannot move hulls yet; opt.cls(cls) — the classes the player can order;
   opt.used — hull ids already named for another line. In the Night no hull whose crew would refuse the round trip */
function lineHelp(G,pid,opt){
  opt=opt||{};
  var f=lineFit(G,pid), p=planet(pid); if(!f||f.gap<=0.01) return null;
  var gap=f.gap, y=function(s){ return hullYield(G,pid,s) }, used=opt.used||[];
  var sails=function(s){ return used.indexOf(s.id)<0&&!(G.night&&nightLeft(G)<K.MUTINY_MIN*legDays(G,pid,'earth',s)*2) };
  // the smallest that closes the gap, else the biggest there is
  function best(list){ var fit=list.filter(function(o){ return y(o)>=gap }).sort(function(a,b){ return y(a)-y(b) });
    return fit[0]||list.sort(function(a,b){ return y(b)-y(a) })[0]||null }
  var b=best(G.ships.filter(function(s){ return s.mode==='idle'&&s.at==='earth'&&!(s.from&&s.to)&&!s.pend&&!s.job&&!s.mutiny&&!s.crewWait&&!s.reserve&&canReachSector(s,p.sec)&&sails(s) }));
  if(b) return {kind:'free', sid:b.id, add:y(b), gap:gap};
  if(!opt.noMove){ var spare=[];
    for(var k in G.colonies){ if(k!==pid) lineSpare(G,k).forEach(function(s){ if(canReachSector(s,p.sec)&&sails(s)) spare.push(s) }) }
    b=best(spare); if(b) return {kind:'move', sid:b.id, from:b.from||(b.pend&&b.pend.from), add:y(b), gap:gap} }
  var hs=[]; CLASSES.forEach(function(cls){ var hi=currentHull(G,cls); if(hi===null||(opt.cls&&!opt.cls(cls))) return;
    if(reach(G)<HULLS[hi].reach||!canReachSector({hull:hi},p.sec)||orderCheck(G,pid,cls)==='orderNight') return; hs.push({hull:hi,cls:cls}) });
  b=best(hs); if(b) return {kind:'build', cls:b.cls, hull:b.hull, add:y(b), gap:gap};
  return null;

function tick(G){
  if(G.over) return;
  G.day++;
  if(G.day%50===0){ G.snaps=G.snaps||[]; G.snaps.push(snap(G)); }
  G.inRate=G.inRate||{}; G._dl=G._dl||{};                 // v4.20: EMA of what arrives home per year, per resource
  ['metal','food','fuel','parts'].forEach(function(k){ var cur=(G.delivered&&G.delivered[k])||0, dd=cur-(G._dl[k]||0); G._dl[k]=cur; G.inRate[k]=(G.inRate[k]||0)*0.98+dd*0.02 });
  G.fuelRate=(G.fuelRate||0)*0.95+(G.fuelSpent||0)*0.05; G.fuelSpent=0;   // v4.4: EMA of fuel the fleet burns per year
  var E=G.earth, R=G.rnd;

  var ef=earthOutput(G)*(G.cold?0.7:1);        // no metal at home, the yards run slow
  E.crewF=ef;
  E.pMetal=K.EARTH_METAL*ef; E.pFood=K.EARTH_FOOD*ef; E.pFuel=K.EARTH_FUEL*ef;
  E.metal+=E.pMetal; E.food+=E.pFood; E.fuel+=E.pFuel;
  if(!G.hungry) E.people+=handsRate(G);        // v4.7: a fed home world keeps turning out colonists, fewer every century

  upgradeSave(G);   // v4.34: a pre-manual-lines save loses its standing orders on the first tick
  // ---- ships ----
  for(var i=0;i<G.ships.length;i++){
    var s=G.ships[i];
    if(s.mode==='building'){s.t--;if(s.t<=0){s.mode='idle';s.at='earth';log(G,'ship_ready',{n:s.id});
        if(s.pend&&G.colonies[s.pend.from]){ var pf=s.pend.from; s.pend=null; var pr=setLine(G,s.id,pf,'earth'); s.lineFor=null; if(pr!=='ok'){ s.waiting=true; G.pauseNow=true; log(G,'awaiting',{n:s.id}) } continue }
      }continue}
    if(s.mode==='missing'){
      s.missDays++;
      var p1=R();
      if(p1<0.025){ s.bearing=Math.round(R()*100); log(G,'fragment',{n:s.id,b:s.bearing}); }
      else if(p1<0.050){ s.mode='transit'; s.dir='in'; s.t=Math.max(3,Math.round(s.total*0.7)); s.total=s.t; G.pauseNow=true; log(G,'ship_returns',{n:s.id,d:s.missDays}); }
      else if(p1<0.054||s.missDays>300){ var cl=s.crew||0; s.mode='dead'; s.crew=0; G.stats.lost++;
        G.earth.lostCrew=(G.earth.lostCrew||0)+cl; log(G,'ship_written_off',{n:s.id,c:cl});
        if(s.cargo&&s.cargo.kit){ for(var kc in G.colonies) if(G.colonies[kc].kitShip===s.id){ G.colonies[kc].kitShip=null; log(G,'kit_lost',{p:kc,t:s.cargo.kit.tier}) } } }
      continue;
    }
    if(s.mode==='idle'){ if(s.from&&s.to) sail(G,s); continue }
    if(s.mode!=='transit') continue;

    if(s.t===s.total){
      var pd = s.dest==='earth' ? null : planet(s.dest);
      if(s.dest!=='earth'&&!pd){ s.dest='earth'; s.dir='in'; pd=null }   // lost its destination: limp home
      var hz = (pd ? pd.haz : 0.02) * Math.pow(0.7, hullGen(s));
      if(!G.safe&&R()<hz*0.085){ s.mode='missing'; s.missDays=0; G.pauseNow=true; log(G,'ship_missing',{n:s.id,p:s.dest==='earth'?s.origin:s.dest}); continue; }
    }
    var sp=shipSpeed(G,s);                                    // v4.21: folded or thickened space
    if(sp===1&&!s.acc) s.t--;
    else { s.acc=(s.acc||0)+sp; var stp=Math.floor(s.acc); s.acc-=stp; if(stp<1) continue; s.t-=stp }
    if(s.t>0) continue;
    if(s.dest!=='earth'&&stormAt(G,s.dest)){ s.t=1; s.held=(s.held||0)+1; continue }   // v4.21: a storm — no landing, hold in orbit

    // arrived
    var node=s.dest;
    s.at=node; s.mode='idle'; s.dir=null;
    if(s.job==='colonize'){
      var p=planet(node);
      if(!G.safe&&R()<p.haz*0.5){ var cf=s.crew||0; s.mode='dead'; s.crew=0; G.stats.lost++;
        G.earth.lostCrew=(G.earth.lostCrew||0)+cf; log(G,'colony_failed',{n:s.id,p:node}); continue }
      G.colonies[node]={pid:node,pop:s.cargo.people,
        store:{metal:0,food:0,fuel:0,parts:0},founded:G.day};
      G.stats.founded++; (G.settled=G.settled||{})[node]=G.day;
      log(G,'colony_founded',{p:node,pop:Math.round(s.cargo.people)});
      if(G.stats.founded===1) log(G,'first_landfall',{p:node});
      s.cargo={metal:0,food:0,fuel:0,parts:0,people:0};
      s.job=null; s.from=null; s.to=null; s.origin=node; s.dest='earth';
      s.mode='transit'; s.dir='in'; s.t=legDays(G,node,'earth',s); s.total=s.t;
      continue;
    }
    if(s.job==='evac'){
      var ce=G.colonies[node];
      if(ce){
        var lift=Math.min(Math.floor(ce.pop),s.cap);
        s.cargo={metal:0,food:0,fuel:0,parts:0,people:lift};
        // whatever was on the surface goes with them, as far as the hold allows
        var roomE=Math.max(0,s.cap-lift);
        ['metal','food','fuel','parts'].forEach(function(kk){ var g=Math.min(roomE,Math.floor(ce.store[kk]||0)); if(g>0){ s.cargo[kk]=g; roomE-=g } });
        delete G.colonies[node];
        if(G.reserves[node]!==Infinity&&G.reserves[node]<=0){ G.ghost[node]=G.day }
        for(var q=0;q<G.ships.length;q++){ var o=G.ships[q]; if(o.from===node){ o.from=null; o.to=null } if(o.pend&&o.pend.from===node) o.pend=null; if(o.lineFor===node) o.lineFor=null; if(o.moveTo===node) o.moveTo=null }
        if(G.drive===node){ G.drive=null; log(G,'drive_lost',{p:node}) }
        log(G,lift<ce.pop-0.5?'evac_partial':'evacuated',{p:node,pop:lift});
        var ho=ce.hauledOut||{}, pe=planet(node), qd=pe.kind==='works'?'parts':pe.dep;
        log(G,'epitaph',{p:node,f:ce.founded||0,y:G.day,n:G.day-(ce.founded||0),q:Math.round(ho[qd]||0),dep:qd,pop:lift});
      }
      s.job=null; s.origin=node; s.dest='earth'; s.mode='transit'; s.dir='in'; s.t=legDays(G,node,'earth',s); s.total=s.t;
      continue;
    }
    if(s.job==='search'){
      var found=null;
      for(var q2=0;q2<G.ships.length;q2++){ var m2=G.ships[q2]; if(m2.id===s.searchFor&&m2.mode==='missing') found=m2 }
      if(found&&R()<0.55){ found.mode='transit'; found.dir='in'; found.origin=node; found.dest='earth'; found.t=legDays(G,node,'earth',found); found.total=found.t; log(G,'search_found',{n:found.id}) }
      else log(G,'search_empty2',{p:node});
      s.job=null; s.searchFor=null; s.origin=node; s.dest='earth'; s.mode='transit'; s.dir='in'; s.t=legDays(G,node,'earth',s); s.total=s.t;
      continue;
    }
    unload(G,s,node);
    if(node!=='earth'&&s.from&&s.to&&!s.mutiny&&mutinyDue(G,s,legDays(G,node,'earth',s)*2)){
      // v4.2: the crew loads, sails home, and will not come back. The word goes out from the far end.
      s.mutiny=true; s.pend=null; s.lineFor=null; s.moveTo=null; G.stats.mutinies=(G.stats.mutinies||0)+1;
      log(G,'mutiny',{n:s.id,p:node,at:'far'});
      loadAt(G,s,node);                       // they take what is on the ground; the line is still set here
      s.from=null; s.to=null; s.origin=node; s.dest='earth'; s.mode='transit'; s.dir='in'; s.t=legDays(G,node,'earth',s); s.total=s.t;
      continue;
    }
    /* v4.34 (reviewer): a hull from a spent world stands down at Earth — unless the player has already given her another line */
    if(s.homeOnly){ var hp=s.homeOnly; s.homeOnly=null; s.from=null; s.to=null;
      if(node!=='earth'){ s.origin=node; s.dest='earth'; s.mode='transit'; s.dir='in'; s.t=legDays(G,node,'earth',s); s.total=s.t; continue }
      if(!s.pend&&!s.moveTo){ s.waiting=true; log(G,'nothing_left',{n:s.id,p:hp}); continue } }
    /* v4.34 (reviewer: a hull docking at the far end flew world→world past Earth, and one from a spent world was left idle at a
       foreign pier for good): a new line is taken only at Earth — at the far end she loads and comes home on the old one first.
       A line is always world ↔ Earth. */
    if(node==='earth'){
      if(s.moveTo){ var mt=s.moveTo, mp=planet(mt); s.moveTo=null;   // v4.32: the move ordered in flight — she is at the pier now
        if(mp&&G.colonies[mt]&&s.from!==mt&&!s.mutiny&&canReachSector(s,mp.sec)&&!(G.reserves[mt]<=0&&mp.kind!=='works'&&pileLeft(G,mt)<1)) s.pend={from:mt,to:'earth'} }
      if(s.pend){ if(G.colonies[s.pend.from]){ s.from=s.pend.from; s.to=s.pend.to; s.auto=true; s.policy=null; log(G,'reassigned',{n:s.id,a:s.from,b:s.to}) } s.pend=null }
    }
    if(s.from&&s.to) sail(G,s);
    else if(node!=='earth'){ s.origin=node; s.dest='earth'; s.mode='transit'; s.dir='in'; s.t=legDays(G,node,'earth',s); s.total=s.t }   // v4.14: a hull released in flight lands with no line — it heads home; the yards only see hulls at Earth
    else { s.waiting=true; G.pauseNow=true; log(G,'awaiting',{n:s.id}) }
  }

  // ---- colonies ----
  var partsMade=0;   // v4.0: the pace the ark-drive forecast reads
  for(var k in G.colonies){
    var c=G.colonies[k], p=planet(k);

    // works worlds convert; everyone else digs or grows from a finite seam
    // v4.10: hazard takes its share; the line brings the replacements
    if(c.pop>K.MIN_FOUND){ c.lossDebt=(c.lossDebt||0)+c.pop*p.haz*K.COLONY_LOSS; var cl=Math.floor(c.lossDebt); if(cl>0){ c.lossDebt-=cl; c.pop=Math.max(K.MIN_FOUND,c.pop-cl); G.stats.colonyLoss=(G.stats.colonyLoss||0)+cl } }
    // v4.4: the machines drink first; dry for KIT_GRACE years and they stand
    if(kitTier(c)>0){ var burn=kitBurn(c);
      if((c.store.fuel||0)>=burn){ c.store.fuel-=burn; if(c.fuelOut>=K.KIT_GRACE) log(G,'kit_running',{p:k,t:c.tier}); c.fuelOut=0 }
      else { c.store.fuel=0; c.fuelOut=(c.fuelOut||0)+1; if(c.fuelOut===K.KIT_GRACE) log(G,'kit_starved',{p:k,t:c.tier}) } }
    var mult=rateMult(c);
    if(p.kind==='works'){
      c.store.metal=(c.store.metal||0)+c.pop*K.WORKS_LOCAL;
      c.store.food=(c.store.food||0)+c.pop*K.WORKS_LOCAL*0.6;
      var want=c.pop*p.rich*K.REFINE*mult;
      var canM=(c.store.metal||0)/K.REFINE_METAL, canF=(c.store.food||0)/K.REFINE_FOOD;
      var made=Math.min(want,canM,canF);
      if(made>0.0001){
        c.store.metal-=made*K.REFINE_METAL; c.store.food-=made*K.REFINE_FOOD; c.idleWorks=0; partsMade+=made;
        if(G.drive){
          G.driveWork+=made;
          if(G.driveWork>=driveWorkFor(G)) driveDone(G,G.drive);
        } else c.store.parts=(c.store.parts||0)+made;
      } else { c.idleWorks=(c.idleWorks||0)+1; if(c.idleWorks===120){ log(G,'works_idle',{p:k}) } }
    } else {
      var out=Math.min(c.pop*p.rich*K.PROD*mult, G.reserves[k]);
      G.reserves[k]-=out;
      c.store[p.dep]=(c.store[p.dep]||0)+out;
      if(G.reserves[k]<=0&&!c.dry){c.dry=true;G.pauseNow=true;log(G,'depleted',{p:k})}
      /* v4.11 (Nikita, 28.09: 'судно снимается с линии, хотя на складе ещё что-то лежит'): the seam is dead but the
         pile is carried out to the last ton; a hull stands down only when it lands and finds nothing (loadAt) */
    }
    // colonies do not breed. Hands arrive on ships or they do not arrive at all.
  }

  G.partsRate=(G.partsRate||0)+(partsMade-(G.partsRate||0))/K.PARTS_EMA;

  // ---- Earth burns to stay alive ----
  directorStep(G);
  var nd=earthNeed(G);
  G.need=nd;
  var pa=activeCrisis(G);
  if(pa){                                                      // v4.20: the crisis drain, any of the four
    var dr=pulseDrain(G,pa.res);
    if(E[pa.res]>=dr){ E[pa.res]-=dr; G.pulseShort=false }
    else { E[pa.res]=0; var d2=Math.max(0.2,E.people*K.STARVE_KILL*0.5); E.people=Math.max(0,E.people-d2); E.lost=(E.lost||0)+d2;
      if(!G.pulseShort){ G.pulseShort=true; G.pauseNow=true; log(G,'pulse_short',{dep:pa.res}) } }
  }
  var hungry=false, cold=false;
  if(E.food>=nd.food) E.food-=nd.food; else { E.food=0; hungry=true }
  if(E.metal>=nd.metal) E.metal-=nd.metal; else { E.metal=0; cold=true }
  G.hungry=hungry; G.cold=cold;
  if(hungry){                                   // no rations: the home world buries people
    var died=Math.max(0.4,E.people*K.STARVE_KILL);
    E.people=Math.max(0,E.people-died); E.lost=(E.lost||0)+died;
    if(!G.lacking){G.lacking=true;G.pauseNow=true;log(G,'earth_short',{})}
  } else {
    G.lacking=false;
    if(E.lost>0.5){ var back=Math.min(E.lost,E.people*K.MEND+0.2); E.lost-=back }  // recovery is slow
  }

  // ---- something happens out there ----
  if(R()<K.EVENT_CHANCE){
    var keys=Object.keys(G.colonies).filter(function(k){return G.reserves[k]>0});   // v4.11: a dead seam has no pockets and no surprises
    if(keys.length){
      var k=keys[Math.floor(R()*keys.length)], c=G.colonies[k], p=planet(k), roll=R();
      if(roll<0.42){
        var b=Math.round(c.pop*p.rich*K.PROD*40*(0.6+R()));
        c.store[p.dep]=(c.store[p.dep]||0)+b;
        log(G,'ev_rich',{p:k,q:b,dep:p.dep}); G.pauseNow=true;
      } else if(roll<0.58&&G.reserves[k]!==Infinity&&G.reserves[k]>0){
        /* v4.1 (Nikita, 24.09: "жила оказалась больше или меньше, чем планировали"): the mirror of ev_seam */
        var cut=Math.round(G.reserves[k]*(0.25+R()*0.3));
        G.reserves[k]=Math.max(1,G.reserves[k]-cut);
        log(G,'ev_short',{p:k,q:cut,dep:p.dep}); G.pauseNow=true;
      } else if(roll<0.74){
        var lost=Math.round((c.store[p.dep]||0)*(0.25+R()*0.4));
        c.store[p.dep]=Math.max(0,(c.store[p.dep]||0)-lost);
        log(G,'ev_wreck',{p:k,q:lost,dep:p.dep}); G.pauseNow=true;
      } else if(roll<0.88){
        var died=Math.round(c.pop*(0.10+R()*0.15));
        c.pop=Math.max(4,c.pop-died);
        log(G,'ev_disaster',{p:k,q:died}); G.pauseNow=true;
      } else {
        var seam=Math.round(K.RESERVE_BASE*Math.pow(K.RESERVE_GROW,p.sec)*p.rich*(0.15+R()*0.25));
        if(G.reserves[k]!==Infinity){ G.reserves[k]+=seam; c.dry=false; log(G,'ev_seam',{p:k,q:seam,dep:p.dep}); G.pauseNow=true }
      }
    }
  }

  var settled=0; for(var k in G.colonies) settled++;
  if(settled>G.stats.peak) G.stats.peak=settled;
  if(G.day%K.SHIFT_YEARS===0) chronShift(G,settled);

  // ---- the larder forecast (v4.28, F-11) ----
  if(G.day>=200){ var ff=foodForecast(G); G.foodFc=ff;
    if(foodShort(G)){ if(!G.foodWarned&&G.day>=K.FOOD_PAUSE_FROM){ G.foodWarned=true; G.pauseNow=true; log(G,'food_horizon',{y:ff.y,n:ff.n,h:Math.round(E.food),k:ff.farms}) } }
    else if(G.foodWarned&&(!ff||ff.n>K.FOOD_HORIZON*1.5)) G.foodWarned=false; }   // re-armed once the horizon clears, so a second slide is told again
  // ---- the Long Night ----
  if(!G.night&&(SECTORS.length>=K.NIGHT_TRIGGER_SECTORS||G.day>=K.NIGHT_TRIGGER_YEAR)) revealNight(G);
  if(G.night){
    var left=G.night-G.day;
    if(left===K.NIGHT_NEAR||left===100||left===25){ G.pauseNow=true; log(G,'night_near',{n:left,s:arkSouls(G)}) }
    if(!G.mutinyWarned){ var mf=mutinyForecast(G); if(mf&&mf.n<=K.MUTINY_WARN){ G.mutinyWarned=true; G.pauseNow=true; log(G,'mutiny_warn',{n:mf.n,p:mf.pid,f:mf.f,h:Math.round(E.food)}) } }
    for(var ck in G.colonies){ var cc=G.colonies[ck]; var ll=lastLift(G,ck); if(!ll) continue; if(ll.st==='cut'){ if(!cc.cut){ cc.cut=true; log(G,'world_cut',{p:ck,n:ll.pop}) } } else if(ll.st==='open'&&cc.cut) cc.cut=false }   // v4.33: said once, the year the last lift is missed; a faster drive can open the world again
    if(left===K.DOOMSDAY_AT) log(G,'doomsday',{n:left,b:arkSouls(G),h:Math.round(E.people)});
    if(left<=0){
      G.left=leftBehind(G); G.over='night';
      var cv=arkConvoy(G);
      if(!arkReady(G)||!cv.ok){
        // v4.0: an ark without a drive is a monument, not a boat; v4.24: no level paid and no drive is just 'no ark';
        // v4.29: no convoy at the pier — the same monument
        G.boarded=0; G.souls=0; G.grounded=arkLevel(G)>=1; G.groundedWhy=!arkReady(G)?'drive':'convoy'; G.cargo=null;
        log(G,'night',{s:0});
        if(G.grounded&&G.groundedWhy==='drive') log(G,'ark_grounded',{b:arkSouls(G),g:G.arkMark});
        else if(G.grounded) log(G,'ark_noconvoy',{b:arkSouls(G),n:cv.have.courier,h:cv.have.hauler,c:cv.have.freighter,g:cv.gen});
        return;
      }
      G.boarded=arkSouls(G); G.wake=arkWake(G); G.souls=Math.floor(G.boarded*G.wake); G.cargo=G.boarded>0?arkCargo(G):null;
      log(G,'night',{s:G.boarded});
      /* v4.14 (run 398763448 review): with no ark or nobody at home there is no departure to chronicle */
      if(G.boarded>0){ log(G,'ark_sailed',{s:G.boarded,b:G.left.home+G.left.hulls+G.left.colonies+G.left.transit});
        log(G,'ark_woke',{w:G.souls,s:G.boarded,g:G.driveLvl||0}) }
      return;
    }
  }
  // there is no victory screen any more — the chart runs as far as you can push it.
  // The only ending is the home world going quiet, and it has to actually arrive.
  if(hungry){
    G.famine=(G.famine||0)+1;
    if(G.famine===1||G.famine===Math.round(K.DEAD_DAYS*0.6)){ G.pauseNow=true; log(G,'earth_dead',{n:K.DEAD_DAYS-G.famine}) }
    if(G.famine>=K.DEAD_DAYS){ G.over='lose'; log(G,'lose',{}); log(G,'desk_silent',{n:K.DEAD_DAYS}) }
  } else if(G.famine) G.famine=Math.max(0,G.famine-1);   // fed days pay famine back one for one, no faster
}

/* ---------- the advisor: the game does the arithmetic and says what wants a decision ----------
   Pure. Returns [{code, sev, pid?, sid?, hull?, n?}] ordered worst-first. */
function advice(G){
  var out=[], E=G.earth, i, k;
  var nd=G.need||earthNeed(G);

  var fd=Math.floor(E.food/Math.max(0.1,nd.food)), md=Math.floor(E.metal/Math.max(0.1,nd.metal));
  if(G.hungry) out.push({code:'a_starving',sev:'bad',n:Math.round(E.people)});
  else if(fd<25) out.push({code:'a_food',sev:fd<10?'bad':'warn',n:fd});
  else if(foodShort(G)) out.push({code:'a_foodhor',sev:G.foodFc.n<=120?'bad':'warn',n:G.foodFc.n,y:G.foodFc.y,h:G.foodFc.farms});   // v4.28 F-11
  if(G.cold) out.push({code:'a_cold',sev:'bad'});
  else if(md<25) out.push({code:'a_metal',sev:md<10?'bad':'warn',n:md});
  var hasWell=false; for(k in G.colonies){ var pw=planet(k); if(pw&&pw.kind==='well'&&G.reserves[k]>0) hasWell=true }
  if(!hasWell&&E.fuel<260&&Object.keys(G.colonies).length>=2) out.push({code:'a_nowell',sev:E.fuel<60?'bad':'warn',n:Math.round(E.fuel)});
  else if(E.fuel<30) out.push({code:'a_fuel',sev:E.fuel<12?'bad':'warn',n:Math.round(E.fuel)});
  // hulls of a retired generation sitting idle are metal on the slipway
  var oldIdle=G.ships.filter(function(s){return s.mode==='idle'&&s.at==='earth'&&!(s.from&&s.to)&&!s.reserve&&hullGen(s)<(G.gen||0)}).length;   // v4.29: the ark reserve is not idle metal
  if(oldIdle>=4) out.push({code:'a_scrap',sev:'ok',n:oldIdle,g:(G.gen||0)});

  for(k in G.colonies){
    var c=G.colonies[k], p=planet(k);
    if(!p) continue;
    var lines=G.ships.filter(function(s){return s.mode!=='dead'&&s.from&&s.to&&(s.from===k||s.to===k)});
    var lr=lineRate(G,k);
    var dep = p.kind==='works'?'parts':p.dep;
    var sitting = Math.round(c.store[dep]||0);
    var dry = G.reserves[k]!==Infinity && G.reserves[k]<=0;

    var cap=popCap(p), miss=Math.floor(cap-c.pop);

    // a worked-out seam with a full warehouse still has something to haul.
    // never tell the player there is nothing to take while the store is full.
    if(dry&&sitting>20){ out.push({code:'a_lastload',sev:'warn',pid:k,n:sitting}); continue }
    if(dry){ if(lines.length) out.push({code:'a_dry',sev:'bad',pid:k,n:lines.length}); continue }

    // v4.4: kits
    if(c.kit&&lines.length&&lineHold(G,k)<c.kit.w) out.push({code:'a_kithold',sev:'warn',pid:k,n:c.kit.w,t:c.kit.tier});
    if(c.kit&&!lines.length) out.push({code:'a_kithold',sev:'warn',pid:k,n:c.kit.w,t:c.kit.tier});
    if(kitTier(c)>0&&(c.fuelOut||0)>=K.KIT_GRACE) out.push({code:'a_kitfuel',sev:'warn',pid:k,t:c.tier});
    if(!lines.length){
      // one message, not three: no line means nothing leaves and no hands arrive
      out.push({code: miss>cap*0.3?'a_nolineShort':'a_noline', sev:'warn', pid:k, n:miss});
    } else {
      if(lr&&lr.piling&&sitting>120) out.push({code:'a_pile',sev:'warn',pid:k,n:sitting});
      // a factory with a line is being fed; only speak up if it has sat idle a long while
      if(p.kind==='works'&&(c.idleWorks||0)>90) out.push({code:'a_feedslow',sev:'warn',pid:k,n:c.idleWorks});
    }
    if(p.kind==='works'&&!lines.length&&(c.store.metal<2||c.store.food<2)) out.push({code:'a_feed',sev:'bad',pid:k});
  }

  var idle=G.ships.filter(function(s){return s.mode==='idle'&&s.at==='earth'&&!(s.from&&s.to)&&!s.reserve});   // v4.29: reserved hulls wait on purpose
  if(idle.length&&idle.length-oldIdle>0) out.push({code:'a_idle',sev:'warn',n:idle.length,sid:idle[0].id});

  var free=null, fleetLim=sectorLimit(G.gen||0);
  for(i=0;i<PLANETS.length;i++){ var pp=PLANETS[i];
    if(!G.colonies[pp.id]&&!G.ghost[pp.id]&&sectorOpen(G,pp.sec)&&pp.sec<=fleetLim){ free=pp.id; break } }
  if(free&&idle.length&&E.people>=K.MIN_FOUND+K.EARTH_KEEP) out.push({code:'a_settle',sev:'ok',pid:free,sid:idle[0].id});

  for(i=HULLS.length-1;i>=0;i--){ var h=HULLS[i];
    if(h.gen!==(G.gen||0)) continue;
    if(reach(G)>=h.reach&&E.metal>=h.metal&&E.fuel>=h.fuel&&E.parts>=(h.parts||0)&&E.people-K.EARTH_KEEP>=(h.crew||0)){ out.push({code:'a_build',sev:'ok',hull:i}); break } }
  // v4.4: one kit suggestion at a time — the richest world with a line that can carry it and a seam worth it
  if(kitOpen(G)){ var bk=null, bv=0;
    for(k in G.colonies){ var ck=G.colonies[k], pk=planet(k); if(!pk) continue; if(canKit(G,k)!=='ok') continue;
      var kk2=kitCost(ck); if(lineHold(G,k)<kk2.w) continue;
      if(G.reserves[k]!==Infinity&&G.reserves[k]<ck.pop*pk.rich*K.PROD*Math.pow(K.KIT_OUT,kk2.tier)*150) continue;   // seam would be gone inside 150 years
      var v=ck.pop*pk.rich; if(v>bv){ bv=v; bk={pid:k,t:kk2.tier} } }
    if(bk){ var kg=kitGain(G,bk.pid); out.push({code:'a_kit',sev:'ok',pid:bk.pid,t:bk.t,kx:Math.round(kg.now),ky:Math.round(kg.with)}) } }
  // v4.4: rations pile up for the ark — say so, or the player reads it as waste
  if(G.night&&fd>60) out.push({code:'a_foodpile',sev:'ok',n:fd});
  // v4.10 (Nikita, 27.09): a flock of couriers where one hauler would do
  for(k in G.colonies){ var nc=lineCount(G,k,'courier'); if(nc<3) continue;

/* v4.9 / v4.12 (Nikita, 30.09: 'когда я нажал кнопку, я хочу видеть подтверждение'): every order answers — a toast at the
   foot of the map, green with what happened, red with why not. Nothing here stops the clock. */
function toast(html,cls,ms,snd){ var box=el('toasts'); if(!box) return;
  var t=document.createElement('div'); t.className='toast'+(cls?' '+cls:''); t.innerHTML=html; box.insertBefore(t,box.firstChild);
  if(snd!==false) SFX.play(snd||(cls==='bad'?'warn':'info'));
  while(box.children.length>5) box.removeChild(box.lastChild);
  setTimeout(function(){ t.classList.add('gone'); setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t) },400) }, ms||6000) }

  if(e.code==='voice'){ var v=voiceLine(e); return v.who+' '+v.name+': '+v.line }

var SFX=(function(){
  var ctx=null, master=null, on=true, lastAt={};
  try{ on=localStorage.getItem('lb.sfx')!=='0' }catch(e){}
  function ac(){ if(ctx) return ctx; var C=window.AudioContext||window.webkitAudioContext; if(!C) return null;
    ctx=new C(); master=ctx.createGain(); master.gain.value=0.5; master.connect(ctx.destination); return ctx }
  function unlock(){ var c=ac(); if(c&&c.state==='suspended') c.resume() }
  function tone(f,t0,dur,type,vol,f2){ var c=ac(); if(!c) return; var o=c.createOscillator(), g=c.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(f,t0); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
    g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol||0.2,t0+0.006); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+0.02) }
  function noise(t0,dur,vol){ var c=ac(); if(!c) return; var n=Math.floor(c.sampleRate*dur), b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
    for(var i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    var src=c.createBufferSource(); src.buffer=b; var hp=c.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=2500;
    var g=c.createGain(); g.gain.value=vol||0.15; src.connect(hp); hp.connect(g); g.connect(master); src.start(t0) }
  var P={
    click:function(t){ noise(t,0.018,0.14); tone(1900,t,0.025,'square',0.05) },
    tab:  function(t){ tone(1000,t,0.035,'square',0.06) },
    ok:   function(t){ tone(660,t,0.06,'square',0.11); tone(990,t+0.07,0.1,'square',0.11) },
    deny: function(t){ tone(170,t,0.09,'square',0.15); tone(120,t+0.1,0.13,'square',0.13) },
    info: function(t){ tone(880,t,0.09,'sine',0.14) },
    warn: function(t){ tone(560,t,0.09,'square',0.13); tone(440,t+0.12,0.16,'square',0.13) },
    bad:  function(t){ for(var i=0;i<3;i++) tone(220,t+i*0.17,0.11,'sawtooth',0.17) },
    crit: function(t){ for(var i=0;i<4;i++) tone(360,t+i*0.24,0.16,'sawtooth',0.2,200) },
    voice:function(t){ tone(1320,t,0.05,'sine',0.1); tone(1760,t+0.06,0.14,'sine',0.1) },
    evgood:function(t){ tone(523,t,0.12,'triangle',0.15); tone(659,t+0.11,0.12,'triangle',0.15); tone(784,t+0.22,0.2,'triangle',0.15) },   // v4.21: an event for the better — three rising notes
    evbad: function(t){ tone(330,t,0.2,'triangle',0.17); tone(247,t+0.22,0.28,'triangle',0.17,196) }   // …and for the worse — two falling ones
  };
  function play(k){ if(!on) return; var c=ac(); if(!c||c.state!=='running') return;
    var now=performance.now(); if(lastAt[k]&&now-lastAt[k]<45) return; lastAt[k]=now; var f=P[k]; if(f) f(c.currentTime) }
  function set(v){ on=!!v; try{ localStorage.setItem('lb.sfx',on?'1':'0') }catch(e){} }
  document.addEventListener('pointerdown',unlock,true); document.addEventListener('keydown',unlock,true);
  return {play:play,set:set,isOn:function(){return on}};
})();

/* ---------- personal files ----------
   v3.9 (Nikita, 23.09: "симулятор безликого логиста", "люди сменяются чаще, чем корабли приходят,
   личности ничто, винтики"). Roles and hulls persist; people do not. At a few moments the desk gets a
   face: a procedural portrait, a role, a name, a service number, one line from the VOICE table. The line
   goes to the journal always; the window opens at most once per VOICE_GAP years, except the moments
   that matter (the date, a last flight, the pier). Nothing here touches the core. */
var VOICE_GAP=50, CAPT_TENURE=30;
function hash32(a,b){ var h=(a|0)^0x9E3779B9; h=Math.imul(h^(b|0),0x85EBCA6B); h^=h>>>13; h=Math.imul(h,0xC2B2AE35); return (h^(h>>>16))|0 }
function personName(seed){ var pool=(T('names')||'').split(/\s+/).filter(Boolean); if(!pool.length) return '—'; return pool[Math.abs(seed)%pool.length].toUpperCase() }
function serviceNo(seed){ return 1000+(Math.abs(hash32(seed,77))%9000) }
function voiceKeys(trigger){ return Object.keys(VOICE.en||{}).filter(function(k){ return k.indexOf(trigger+'.')===0 }) }
function voice(trigger,role,d,o){
  o=o||{}; var keys=voiceKeys(trigger); if(!keys.length) return;
  var seed=hash32(G.seed^(o.day!==undefined?o.day:G.day), (o.seed||0)^((o.seq||0)*7919));
  var k=keys[Math.abs(hash32(seed,3))%keys.length];
  var name=personName(seed), no=serviceNo(seed);
  log(G,'voice',{k:k,role:role,name:name,no:no,d:d||{}});
  if(o.quiet) return;   // v4.1: most of the world speaks in the journal only; the window is for the moments that matter
  if(o.force || G.day-(U.voiceLast||0)>=VOICE_GAP){
    /* v4.30 (Nikita, 11.10: 'уведомления от экипажей норм, но пусть они не перекрывают весь экран, внизу вылазят'):
       a crew's word is a card at the foot of the chart and the clock runs on; only the Night, the ark drive and
       the last flights (force) still take the whole screen. */
    if(!o.force&&U.pf&&!U.pf.low) return;
    U.voiceLast=G.day;
    U.pf={k:k,role:role,name:name,no:no,d:d||{},seed:seed,sub:o.sub||'',low:!o.force,day:G.day};
    SFX.play('voice');
  }
}
['fold','drag','storm','crisis','spoil'].forEach(function(t){ var g=t==='fold'; TONE[t+'_warn']=g?'gd':'bd'; TONE[t+'_start']=g?'gd':'bd'; TONE[t+'_end']='gd' }); TONE.pulse_short='bd';   // v4.21: the director's events
function voiceLine(e){ var v=VOICE[U.lang]||{}; var d={}; for(var q in e.d.d) d[q]=e.d.d[q]; if(d.p&&planet(d.p)) d.p=pname(d.p); if(d.dep) d.dep=DEP[U.lang][d.dep]||d.dep; if(d.lobe!==undefined) d.lobe=T('lobe'+d.lobe); return {who:v[e.d.role]||e.d.role,name:e.d.name,line:fill(v[e.d.k]||e.d.k,d)} }
/* what the log said since last time, and who answers it */
function voiceWatch(){
  if(!G) return;
  U.voiceSeq=U.voiceSeq||0; U.voy=U.voy||{}; U.capt=U.capt||{}; U.founded=U.founded||0;
  var i, e, maxSeq=U.voiceSeq;
  /* v4.2 fix: voice() pushes to G.log, and a full log (400) drops its oldest entry on every push — so
     iterating G.log itself skipped every second new entry once the log was full. Snapshot first. */
  var fresh=[]; for(i=0;i<G.log.length;i++){ if((G.log[i].seq||0)>U.voiceSeq) fresh.push(G.log[i]) }
  for(i=0;i<fresh.length;i++){ e=fresh[i]; if(e.seq>maxSeq) maxSeq=e.seq;
    var d=e.d||{};
    /* v4.1 (Nikita, 24.09: "хочу больше сообщений с лором и переживаниями"): the Institute physicist
       brings the date and the drive; the shift chief reports what Earth becomes; captains and heads
       speak on losses and on the seams. Windows only for the date, the ark drive, the square and a lost
       hull; everything else is a journal line. */
    if(e.code==='night_dated'){ var f0=driveForecast(G,G.arkMark);
      /* v4.14: {fy} is a whole sentence — a year at this pace, or why there is no year yet */
      var fy0= f0.st==='ok' ? fill(T('fyOk'),{y:f0.y}) : fill(T('fyNone'),{w: f0.st==='settled'?fill(T('arkdReach'),{n:f0.n,r:f0.r}):(f0.st==='host'?fill(T('arkdHost'),{n:K.DRIVE_POP}):T('arkdStall'))});
      voice('night_dated','role_sci',{y:d.y,g:roman(G.arkMark),fy:fy0},{force:true,day:e.day,seq:e.seq}) }
    else if(e.code==='ark_drive') voice('ark_drive','role_sci',{g:roman(d.g),w:d.w,y:d.y},{force:true,day:e.day,seq:e.seq});
    else if(e.code==='doomsday') voice('doomsday','role_chief',{n:d.n,b:d.b,h:d.h},{force:true,day:e.day,seq:e.seq});
    else if(e.code==='shift'&&d.k==='dated') voice('date_shift','role_chief',{y:G.night},{quiet:true,day:e.day,seq:e.seq});
    else if(e.code==='mutiny') voice('mutiny','role_captain',{hull:d.n,p:d.p},{seed:hash32(0x5c,d.n),day:e.day,seq:e.seq,sub:fill(T('pfHull'),{n:d.n,k:U.capt[d.n]||1})});
    else if(e.code==='colony_failed') voice('crash','role_captain',{hull:d.n,p:d.p},{seed:hash32(0x56,d.n),day:e.day,seq:e.seq,sub:fill(T('pfHull'),{n:d.n,k:U.capt[d.n]||1})});
    else if(e.code==='ship_written_off') voice('written_off','role_duty',{hull:d.n,crew:d.c},{quiet:true,day:e.day,seq:e.seq});
    else if(e.code==='ev_seam') voice('seam_more','role_head',{p:d.p,q:d.q,dep:d.dep},{quiet:true,seed:hash32(0x57,(+String(d.p).slice(1)||0)),day:e.day,seq:e.seq});
    else if(e.code==='ev_short') voice('seam_less','role_head',{p:d.p,q:d.q,dep:d.dep},{quiet:true,seed:hash32(0x58,(+String(d.p).slice(1)||0)),day:e.day,seq:e.seq});
    else if(e.code==='ev_rich') voice('seam_rich','role_head',{p:d.p,q:d.q,dep:d.dep},{quiet:true,seed:hash32(0x59,(+String(d.p).slice(1)||0)),day:e.day,seq:e.seq});
    else if(e.code==='ev_wreck') voice('wreck','role_head',{p:d.p,q:d.q,dep:d.dep},{quiet:true,seed:hash32(0x5a,(+String(d.p).slice(1)||0)),day:e.day,seq:e.seq});
    else if(e.code==='ev_disaster') voice('disaster','role_head',{p:d.p,q:d.q},{quiet:true,seed:hash32(0x5b,(+String(d.p).slice(1)||0)),day:e.day,seq:e.seq});
    else if(/^(fold|drag|storm|crisis|spoil)_(warn|start)$/.test(e.code)){ var dd={}; for(var qq in d) dd[qq]=d[qq]; if(dd.dep) dd.dep=DEP[U.lang][dd.dep]||dd.dep; if(dd.lobe!==undefined) dd.lobe=T('lobe'+dd.lobe);
      var evt=e.code.split('_')[0], evg=evt==='fold', evtxt=fill(LOG[U.lang][e.code],dd);
      /* v4.30 (Nikita, 11.10): the warning stops the desk on the whole screen; while the event runs, the bar on the chart blinks */

/* the face: 64×64, bone on black, ordered dither — nobody drew it, and it is different every time */
function drawPortrait(cv,seed){
  var r=mulberry32(seed), W=64, H=64, ctx=cv.getContext('2d');
  cv.width=W; cv.height=H;
  var fw=20+Math.floor(r()*9), fh=27+Math.floor(r()*9), cx=32+Math.floor(r()*5)-2, cy=34+Math.floor(r()*4)-2;
  var eyeY=cy-Math.floor(fh*0.12)-Math.floor(r()*3), gap=Math.floor(fw*0.36)+Math.floor(r()*3), eyeS=1+Math.floor(r()*2);
  var browT=Math.floor(r()*5)-2, noseL=Math.floor(fh*0.28)+Math.floor(r()*4), mouthW=Math.floor(fw*0.45)+Math.floor(r()*5), mouthY=cy+Math.floor(fh*0.32)+Math.floor(r()*3);
  var hair=Math.floor(r()*5), glasses=r()<0.22, beard=r()<0.25, light=r()<0.5?-1:1, sag=r()*0.35;
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  // head: a lit ellipse with a shadow on one side
  var g=ctx.createLinearGradient(cx-fw,0,cx+fw,0);
  if(light<0){ g.addColorStop(0,'#f0f0f0'); g.addColorStop(0.6,'#b0b0b0'); g.addColorStop(1,'#505050') }
  else { g.addColorStop(0,'#505050'); g.addColorStop(0.4,'#b0b0b0'); g.addColorStop(1,'#f0f0f0') }
  ctx.fillStyle='#202020'; ctx.fillRect(0,0,W,H);                       // a dim wall behind the head, so the hair reads
  ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(cx,cy,fw,fh,0,0,Math.PI*2); ctx.fill();
  // neck and shoulders
  ctx.fillStyle='#6a6a6a'; ctx.fillRect(cx-Math.floor(fw*0.35),cy+fh-4,Math.floor(fw*0.7),12);
  ctx.fillStyle='#4a4a4a'; ctx.beginPath(); ctx.ellipse(cx,H+6,fw+18,16,0,Math.PI,Math.PI*2); ctx.fill();
  // hair
  ctx.fillStyle='#606060';
  if(hair===1){ ctx.beginPath(); ctx.ellipse(cx,cy-fh*0.55,fw+1,fh*0.55,0,Math.PI,Math.PI*2); ctx.fill() }
  else if(hair===2){ ctx.beginPath(); ctx.ellipse(cx,cy-fh*0.5,fw+2,fh*0.62,0,Math.PI,Math.PI*2); ctx.fill(); ctx.fillRect(cx-fw-2,cy-fh*0.5,6,fh*0.9); ctx.fillRect(cx+fw-4,cy-fh*0.5,6,fh*0.9) }
  else if(hair===3){ ctx.beginPath(); ctx.ellipse(cx+light*3,cy-fh*0.6,fw-2,fh*0.45,0,Math.PI,Math.PI*2); ctx.fill() }
  else if(hair===4){ ctx.fillStyle='#707070'; ctx.beginPath(); ctx.ellipse(cx,cy-fh*0.62,fw+3,fh*0.42,0,Math.PI,Math.PI*2); ctx.fill(); ctx.fillRect(cx-fw-3,cy-fh*0.62,2*fw+6,3) }
  // brows, eyes
  ctx.fillStyle='#101010';
  ctx.fillRect(cx-gap-3,eyeY-4-browT,7,2); ctx.fillRect(cx+gap-4,eyeY-4+browT,7,2);
  ctx.fillStyle='#f0f0f0'; ctx.fillRect(cx-gap-2,eyeY-1,5,3); ctx.fillRect(cx+gap-3,eyeY-1,5,3);
  ctx.fillStyle='#000'; ctx.fillRect(cx-gap-1+Math.floor(sag*2),eyeY,eyeS+1,2); ctx.fillRect(cx+gap-2+Math.floor(sag*2),eyeY,eyeS+1,2);
  if(glasses){ ctx.strokeStyle='#e8e8e8'; ctx.lineWidth=1; ctx.strokeRect(cx-gap-4.5,eyeY-3.5,9,7); ctx.strokeRect(cx+gap-4.5,eyeY-3.5,9,7); ctx.beginPath(); ctx.moveTo(cx-gap+4.5,eyeY); ctx.lineTo(cx+gap-4.5,eyeY); ctx.stroke() }
  // nose, mouth
  ctx.fillStyle='#2a2a2a'; ctx.fillRect(cx+light,eyeY+3,1,noseL); ctx.fillRect(cx-1,eyeY+3+noseL,3,1);
  ctx.fillStyle='#181818'; ctx.fillRect(cx-Math.floor(mouthW/2),mouthY,mouthW,2);
  if(beard){ ctx.fillStyle='rgba(20,20,20,.75)'; ctx.beginPath(); ctx.ellipse(cx,cy+fh*0.6,fw*0.8,fh*0.38,0,0,Math.PI); ctx.fill() }
  // ordered dither to two colours: black and bone
  var img=ctx.getImageData(0,0,W,H), p=img.data, B=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
  for(var y=0;y<H;y++) for(var x=0;x<W;x++){ var i=(y*W+x)*4; var v=(p[i]*0.299+p[i+1]*0.587+p[i+2]*0.114)/255;
    var on = v > (B[y&3][x&3]+0.5)/16;
    p[i]=on?0xF2:0; p[i+1]=on?0xF1:0; p[i+2]=on?0xEC:0; p[i+3]=255 }
  ctx.putImageData(img,0,0);
}

/* ---------- map geometry ---------- */
var STARS=null;
function starfield(){
  if(STARS) return STARS;
  var r=mulberry32(9137), o='';
  for(var i=0;i<190;i++){
    var x=(r()*1000).toFixed(1), y=(r()*700).toFixed(1), q=r();
    o+='<rect x="'+x+'" y="'+y+'" width="'+(q>0.93?1.6:1)+'" height="'+(q>0.93?1.6:1)+'" fill="#F2F1EC" opacity="'+(0.08+q*0.22).toFixed(2)+'"/>';
  }
  STARS=o; return o;
}
var CX=500, CY=350;
function nodeXY(n){ if(!n) return null; if(n==='earth') return {x:CX,y:CY}; var pp=planet(n); return pp?pos(pp):null }
/* v4.35 (regress, seed 309573272: BRINE sat under SOLACE — a world stands on its ring at its angle, and two worlds of one ring
   can share an angle): worlds closer than POS_GAP are pushed apart, once per chart */
var POSC={}, POSN=-1, POS_GAP=28;
function pos(p){ if(POSN!==PLANETS.length||!POSC[p.id]) layoutPos(); return POSC[p.id] }
function layoutPos(){ var Ls=PLANETS.map(function(q){ var R=SECTORS[q.sec].r; return {id:q.id,x:CX+Math.cos(q.ang)*R*1.32,y:CY+Math.sin(q.ang)*R*0.90} });
  for(var it=0;it<40;it++){ var moved=false;
    for(var i=0;i<Ls.length;i++) for(var j=i+1;j<Ls.length;j++){ var a=Ls[i], b=Ls[j], dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||0.01;
      if(d<POS_GAP){ var k=(POS_GAP-d)/2/d; a.x-=dx*k; a.y-=dy*k; b.x+=dx*k; b.y+=dy*k; moved=true } }
    if(!moved) break }
  POSC={}; Ls.forEach(function(o){ POSC[o.id]={x:o.x,y:o.y} }); POSN=PLANETS.length }

/* ---------- the viewport ----------
   The chart grows without end but the viewBox used to be a fixed 1000x700, so
   everything past sector 2 (ring radius 346, half-height 350) was drawn outside
   it and simply clipped — Nikita, 22.09: "on ring 4 you cannot see any of the
   following ones". The view now fits the whole chart by itself, and the wheel
   and a drag are there for when it is crowded. Marks are scaled by Z so text
   stays the same size on screen however far out the chart runs. */
var VIEW={x:0,y:0,w:1000,h:700}, VFIT=true, VSECS=-1, MAPDRAGGED=false;
function viewFit(){
  var R=secRadius(Math.max(0,visRings()-1))+58;
  var W0=visRings()<SECTORS.length?640:1000;   // v4.36: while the tutorial shows one ring, the chart comes closer (ui-v7)
  var w=Math.max(W0, R*1.32*2, R*0.90*2*(1000/700));
  for(var it=0;it<4;it++){            // the pad is screen-sized, so it scales with the fit: iterate
    var Z=w/1000;
    var w2=Math.max(W0, (R*1.32+128*Z)*2, (R*0.90+44*Z)*2*(1000/700));
    if(Math.abs(w2-w)<1){ w=w2; break } w=w2;
  }
  VIEW={x:CX-w/2, y:CY-w*0.35, w:w, h:w*0.7};
  VSECS=visRings();
}
function viewZoom(f,ax,ay){
  var w=Math.max(280,Math.min(9000,VIEW.w*f));
  f=w/VIEW.w;
  if(ax===undefined){ax=VIEW.x+VIEW.w/2; ay=VIEW.y+VIEW.h/2}
  VIEW={x:ax-(ax-VIEW.x)*f, y:ay-(ay-VIEW.y)*f, w:w, h:w*0.7};
  VFIT=false;
}
function viewPt(ev){
  var m=el('map'), r=m.getBoundingClientRect();
  // the viewBox is letterboxed by preserveAspectRatio=meet: find the real scale
  var sc=Math.min(r.width/VIEW.w, r.height/VIEW.h);
  var ox=(r.width-VIEW.w*sc)/2, oy=(r.height-VIEW.h*sc)/2;
  return {x:VIEW.x+(ev.clientX-r.left-ox)/sc, y:VIEW.y+(ev.clientY-r.top-oy)/sc, sc:sc};
}

/* ---------- the state of a world, as the map, the list and the advisor see it ---------- */

var BAD_ST={dead:1,cut:1,starve:1};

/* ---------- the map ---------- */

      var b={x0:bx-2*Z,x1:bx+w+2*Z,y0:ly-10*Z,y1:ly+3*Z,L:{x:lx,y:ly,a:v[0]<0?1:0}}, n=nHit(b);

 {t:'fleet',opens:['fleet'],q:['m10'],soft:1,when:function(){ return builtHulls()>=4||G.day>=300 }},

/* ---------- Worlds: the list, worst first ---------- */
var SEV={dead:0,cut:1,starve:2,noline:3,half:4,dry:5,ok:6,settling:7,free:8};
function sideWorlds(){ var list=PLANETS.filter(function(p){ return secVis(p.sec)&&!(G.ghost&&G.ghost[p.id]) }).map(function(p){ return {p:p,st:wst(p.id)} });
  list.sort(function(a,b){ return SEV[a.st]-SEV[b.st]||a.p.sec-b.p.sec||a.p.ang-b.p.ang });
  var live=Object.keys(G.colonies).length, fr=list.filter(function(x){ return x.st==='free' }).length;
  var rows=list.map(function(x){ var p=x.p, c=G.colonies[p.id], n=c?onLine(G,p.id).length:0, st=x.st, red=SEV[st]<=2, col=red?C.red:((st==='noline'||st==='half'||st==='settling')?C.people:C.mid);
    var icn={dead:'workedout',cut:'cutoff',starve:'starving',noline:'warn',half:'warn',dry:'workedout',settling:'settlers',free:'free'}[st];
    var left=!c?'—':(p.kind==='works'?'—':(isDry(p.id)?'0':seamShort(p.id)));
    return '<button type="button" class="tr'+(red?' red':'')+(st==='free'?' free':'')+'" data-act="world" data-v="'+p.id+'"><span>'+wmark(p.kind,!!c)+'<b>'+esc(pname(p.id))+'</b></span><span>'+(p.sec+1)+'</span><span>'+esc(left)+'</span><span style="color:'+(!c||n?'':C.red)+'">'+(c?n:'—')+'</span><span style="color:'+C.people+'">'+(c?num(c.pop):'—')+'</span><span style="color:'+col+'">'+(icn?ic(icn,14,col):'')+esc(T('u_ws_'+st))+'</span></button>' }).join('');
  return '<div class="side">'+head(esc(T('u_tabWorlds').toUpperCase()),esc(fill(T('u_liveFree'),{l:live,f:fr})).toUpperCase(),ic('tWorlds',18,C.metal))+'<div class="tbl"><div class="th"><span>'+esc(T('u_thWorld'))+'</span><span>'+esc(T('u_thRing'))+'</span><span>'+esc(T('u_thLeft'))+'</span><span>'+esc(T('u_thHulls'))+'</span><span>'+esc(T('people'))+'</span><span>'+esc(T('u_thState'))+'</span></div>'+rows+'</div></div>' }

/* ---------- Tech: the hull generation (the drive programme), the next generation's specs, the rings ---------- */
/* BRIEF: the rule of the drive does not change — the gate is worlds ever settled (4 + 4·l), the programme runs at a works,
   it is fed with the parts of the works (110·2.4^l). A strip of cells is never longer than 12: one cell may stand for several worlds. */
function steps(n,of,col){ var per=Math.max(1,Math.ceil(of/12)), cells=Math.ceil(of/per), full=Math.floor(n/per), part=(n%per)/per, h='<div class="steps">';
  for(var i=0;i<cells;i++){ var bg=i<full?'background:'+col+';border-color:'+col:(i===full&&part?'background:linear-gradient(90deg,'+col+' '+(part*100)+'%,transparent '+(part*100)+'%);border-color:'+col:''); h+='<div class="st" style="'+bg+'"></div>' }
  return h+'</div>'+(per>1?hint(esc(fill(T('u_cellIs'),{k:per,n:Math.min(n,of),m:of}))):'') }
function worksList(){ return Object.keys(G.colonies).filter(function(k){ return planet(k).kind==='works' }) }
function driveHost(){ var ws=worksList(), u=U.driveAt;
  if(u&&ws.indexOf(u)>=0&&G.colonies[u].pop>=K.DRIVE_POP) return u;
  var best=null; ws.forEach(function(k){ if(G.colonies[k].pop>=K.DRIVE_POP&&(!best||G.colonies[k].pop>G.colonies[best].pop)) best=k }); return best }
function startDriveWhy(pid){ if(G.drive) return 'running';
  if(settledCount(G)<driveReachFor(G)) return ['needsettled',{n:driveReachFor(G),r:settledCount(G)}];
  if(!pid) return worksList().length?['nohost',{n:K.DRIVE_POP}]:['nohost',{n:K.DRIVE_POP}];
  return 'ok' }
function sideTech(){ var g=G.gen||0, lvl=G.driveLvl||0, s=settledCount(G), need=driveReachFor(G), work=driveWorkFor(G), h='';
  h+=sec(esc(T('u_hullGen')),roman(g)+' → '+roman(g+1));
  h+='<div class="gnow"><span class="gen big">'+roman(g)+'</span>'+ic('tTech',18,C.mid)+'<span class="gen big nx">'+roman(g+1)+'</span>'+(G.drive?'<span class="gtx">'+esc(fill(T('u_driveAt'),{p:pname(G.drive)}))+'</span>':'')+'</div>';
  h+='<div class="lab">'+esc(fill(T('u_step1'),{n:Math.min(s,need),m:need}))+'</div>'+steps(s,need,C.food);
  var ws=worksList(), have=G.drive?G.driveWork:G.earth.parts+ws.reduce(function(a,k){ return a+(G.colonies[k].store.parts||0) },0);
  h+='<div class="lab">'+esc(fill(T('u_step2'),{n:num(Math.min(have,work)),m:num(work)}))+'</div><div class="bar"><u style="width:'+Math.min(100,Math.round(have/work*100))+'%;background:'+C.parts+'"></u></div>';
  if(ws.length) h+=hint(ws.map(function(k){ var c=G.colonies[k], p=planet(k), wh=worksHungry(k), r=wh.idle>5?0:c.pop*p.rich*K.REFINE*rateMult(c); return ic('works',13,C.parts)+' '+esc(pname(k))+' '+dec(r)+esc(T('u_perYr')) }).join(' · '));
  else h+=hint(esc(T('u_noWorks')));
  if(!G.drive){ var host=driveHost();
    if(ws.length) h+='<div class="lab">'+esc(T('u_runAt'))+'</div><div class="chips">'+ws.map(function(k){ var ok=G.colonies[k].pop>=K.DRIVE_POP, on=k===host;
      return '<button type="button" data-act="driveat" data-v="'+k+'" class="'+(on?'on':'')+'"'+(ok?'':off('pop'))+'>'+ic('works',15,on?'#000':C.parts)+esc(pname(k))+'</button>' }).join('')+'</div>';
    var w=startDriveWhy(host), lbl=(typeof w!=='string'&&w[0]==='needsettled')?fill(T('u_startMore'),{n:need-s}):T('u_start');
    h+=btn(esc(lbl),'drive',{p:host||''},'pri full','tTech',offW(w)) }
  // the next generation
  h+='<div class="lab">'+esc(fill(T('u_genGives'),{g:roman(g+1)}))+'</div><div class="spec"><div class="sh"><span></span><span>'+ic('hold',13,C.mid)+esc(T('u_hold'))+'</span><span>'+ic('speed',13,C.mid)+esc(T('u_speedH'))+'</span><span>'+ic('range',13,C.mid)+esc(T('u_reachH'))+'</span></div>';
  CLASSES.forEach(function(cls,j){ var a=HULLS[currentHull(G,cls)], b=genHull(g+1,j);
    h+='<div class="sr"><span>'+shipIc(cls,30)+'<b>'+esc(T(cls))+'</b></span><span><i>'+num(a.cap)+'</i>'+num(b.cap)+'</span><span><i>'+a.speed.toFixed(2)+'</i>'+b.speed.toFixed(2)+'</span><span><i>'+(hullRange(a)+1)+'</i>'+esc(fill(T('u_ringN'),{n:hullRange(b)+1}))+'</span></div><div class="sp">'+price(hullCost(b),null,12)+'</div>' });
  h+='</div>';
  if(G.night&&can('ark')&&G.arkMark!==null){ var wn=Math.round(wakeAt(G,lvl)*100), wx=Math.round(wakeAt(G,lvl+1)*100); if(wx>wn) h+=hint('<span style="color:'+C.ark+'">'+ic('ark',14,C.ark)+' '+esc(fill(T('u_arkWakeNext'),{a:wn,b:wx}))+'</span>') }
  // rings
  var sn=K.SURVEY_REACH*SECTORS.length, sc=surveyCost(SECTORS.length), sv=canSurvey(G);
  h+=sec(esc(T('u_rings')),esc(fill(T('u_charted'),{n:SECTORS.length})).toUpperCase());
  h+='<div class="gnow"><span class="rnum">'+ic('ring',22,C.food)+esc(fill(T('u_ringNext'),{s:secName(SECTORS.length)}))+'</span><span class="gtx">'+esc(fill(T('u_settledOf'),{n:Math.min(s,sn),m:sn}))+'</span></div>'+steps(s,sn,C.food);
  h+='<div class="prow">'+price(sc,G.earth)+'</div>';
  var sw=sv==='settled'?['needsettled',{n:sn,r:s}]:(sv==='ok'?'ok':shortWhy(sc,G.earth));
  h+=btn(esc(sv==='settled'?fill(T('u_surveyMore'),{n:sn-s}):T('u_survey')),'survey',null,'pri full','survey',offW(sw));
  var lim=sectorLimit(g), beyond=freeWorlds().filter(function(p){ return p.sec>lim }).length;
  if(beyond) h+=hint(esc(fill(T('u_beyond'),{k:beyond,n:lim+1,g:roman(g+1)})));
  return '<div class="side">'+head(esc(T('u_tech').toUpperCase()),'',ic('tTech',18))+'<div class="tbl">'+h+'</div></div>' }

/* ---------- Ark: the Night, the levels, the convoy, the verdict ---------- */
function arkDriveTxt(){ if(arkReady(G)) return [fill(T('u_arkReady'),{g:roman(G.arkMark)}),C.food];
  var f=driveForecast(G,G.arkMark);
  if(f.st==='ok') return [fill(T('u_arkBy'),{g:roman(G.arkMark),y:f.y}),f.y>G.night?C.red:(f.y>G.night-K.NIGHT_NEAR/2?C.people:C.food)];
  if(f.st==='settled') return [fill(T('u_arkNeedW'),{g:roman(G.arkMark),n:f.n,r:f.r}),C.red];
  if(f.st==='host') return [fill(T('u_arkNoHost'),{g:roman(G.arkMark)}),C.red];
  return [fill(T('u_arkStall'),{g:roman(G.arkMark)}),C.red] }
function winArk(){
  if(!G.night) return '<div class="win sm">'+head(esc(T('u_tabArk').toUpperCase()),esc(T('u_timePaused')),ic('ark',18,C.ark))+'<div class="bd"><div class="big mid">'+ic('night',22,C.mid)+esc(T('u_noDate'))+'</div>'+hint(esc(fill(T('u_noDateHint'),{n:K.NIGHT_TRIGGER_SECTORS,y:K.NIGHT_TRIGGER_YEAR})))+'</div></div>';
  var lv=arkLevel(G), top=K.ARK_LEVELS.length, ad=arkDriveTxt(), lvl=G.driveLvl||0, h='';
