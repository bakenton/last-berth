ock gone. Nothing built.", "{p}: приказ дошёл, металла на складе уже нет. Не построено."], ["LOG", "depleted", "{p}: the deposit is worked out.", "{p}: залежь выработана."], ["LOG", "ship_missing", "HULL {n} OVERDUE ON THE {p} RUN. No carrier.", "КОРПУС {n} НЕ ВЫШЕЛ НА СВЯЗЬ НА ЛИНИИ {p}. Несущей нет."], ["LOG", "fragment", "Signal fragment, hull {n}. Bearing {b}. Nothing more.", "Обрывок сигнала, корпус {n}. Пеленг {b}. Больше ничего."], ["LOG", "ship_returns", "HULL {n} IS BACK ON THE AIR after {d} years.", "КОРПУС {n} СНОВА В ЭФИРЕ спустя {d} лет."], ["LOG", "ship_written_off", "Hull {n} written off. {c} hands lost with her.", "Корпус {n} списан. Вместе с ним {c} рук."], ["LOG", "search_found", "Search made contact. Hull {n} under way home.", "Поиск вышел на связь. Корпус {n} идёт домой."], ["LOG", "search_empty2", "Nothing at {p}. Empty sky.", "У {p} ничего. Пустое небо."], ["LOG", "launch_search", "Hull {n} away to search for hull {m}.", "Корпус {n} ушёл искать корпус {m}."], ["LOG", "launch_punitive", "Hull {n} away to {p} with an enforcement party.", "Корпус {n} ушёл к {p} с карательной партией."], ["LOG", "launch_evac", "Hull {n} away to lift {p}.", "Корпус {n} ушёл снимать {p}."], ["LOG", "evacuated", "{p} evacuated. {pop} lifted off. The site is abandoned.", "{p} эвакуирован. Снято {pop}. Площадка брошена."], ["LOG", "evac_partial", "{p}: {pop} lifted. Not everyone fit.", "{p}: снято {pop}. Влезли не все."], ["LOG", "works_idle", "{p} has been idle 30 years. No metal on site to work.", "{p} простаивает 30 лет. Металла на месте нет."], ["LOG", "drive_started", "DRIVE PROGRAMME OPENED AT {p}. Every works world now builds toward it.", "ПРОГРАММА ГИПЕРДРАЙВА ОТКРЫТА НА {p}. Теперь на неё работают все заводские миры."], ["LOG", "night_dated", "THE OUTER SURVEY BRINGS BACK THE READINGS. The collapse reaches the sun in year {y} and takes every charted world with it. {n} years to build an ark — and a drive that can outrun it.", "ДАЛЬНЯЯ РАЗВЕДКА ПРИВОЗИТ ПОКАЗАНИЯ. Коллапс достигает солнца в год {y} и забирает с собой каждый нанесённый мир. {n} лет на ковчег — и на двигатель, который от него уйдёт."], ["LOG", "night_near", "{n} YEARS TO THE NIGHT. {s} would sail today.", "{n} ЛЕТ ДО НОЧИ. Сегодня улетело бы {s}."], ["LOG", "ark_block", "Ark berths now {n}.", "Мест в ковчеге: {n}."], ["LOG", "night", "—", "—"], ["LOG", "drive_lost", "{p} has fallen and the drive programme went with it.", "{p} пал, и программа гипердрайва пала вместе с ним."], ["LOG", "shift_calm", "SHIFT {n} TAKES THE DESK. {c} worlds answering, {h} hands at home. The previous shift left the lines running and nothing else.", "СМЕНА {n} ПРИНИМАЕТ ПУЛЬТ. Отвечают миров: {c}, дома {h} рук. Прошлая смена оставила линии и больше ничего."], ["LOG", "shift_grow", "SHIFT {n} TAKES THE DESK. {c} worlds answering — more than the last shift inherited. Their note says: keep going out.", "СМЕНА {n} ПРИНИМАЕТ ПУЛЬТ. Отвечают миров: {c} — больше, чем досталось прошлой. В записке: идти дальше."], ["LOG", "shift_shrink", "SHIFT {n} TAKES THE DESK. {c} worlds answering, fewer than before. The chart has more grave markers than it had.", "СМЕНА {n} ПРИНИМАЕТ ПУЛЬТ. Отвечают миров: {c}, меньше, чем было. На карте прибавилось могильных отметок."], ["LOG", "shift_hungry", "SHIFT {n} TAKES THE DESK with the larders empty. The last operator's note is one line: rations first.", "СМЕНА {n} ПРИНИМАЕТ ПУЛЬТ при пустых складах. Записка прошлого оператора в одну строку: сначала провизия."], ["LOG", "shift_idle", "SHIFT {n} TAKES THE DESK. {i} hulls sitting at Earth with nothing to do. Somebody built them; nobody gave them orders.", "СМЕНА {n} ПРИНИМАЕТ ПУЛЬТ. {i} корпусов стоят у Земли без дела. Кто-то их построил, никто не дал приказа."], ["LOG", "shift_empty", "SHIFT {n} TAKES THE DESK. Nothing answers. The chart is a list of names.", "СМЕНА {n} ПРИНИМАЕТ ПУЛЬТ. Никто не отвечает. Карта — список имён."], ["LOG", "shift_night", "SHIFT {n} TAKES THE DESK. {n2} years to the Night. Berths for {b}; {h} standing at home. The note says: stop building. Start bringing them in.", "СМЕНА {n} ПРИНИМАЕТ ПУЛЬТ. {n2} лет до Ночи. Мест {b}, дома {h}. В записке: хватит строить. Возвращай их."], ["LOG", "shift_grow2", "SHIFT {n} TAKES THE DESK. {c} worlds answering. The handover note is a list of names nobody here has seen.", "СМЕНА {n} ПРИНИМАЕТ ПУЛЬТ. Отвечают миров: {c}. В записке список имён, которых здесь никто не видел."], ["LOG", "shift_grow3", "SHIFT {n} TAKES THE DESK. {c} worlds answering, {h} hands at home. The chart has grown past the edge of the old screens.", "СМЕНА {n} ПРИНИМАЕТ ПУЛЬТ. Отвечают миров: {c}, дома {h} рук. Карта переросла края старых экранов."], ["LOG", "shift_calm2", "SHIFT {n} TAKES THE DESK. {c} worlds answering. Nothing changed since the last handover; the note says so in one word.", "СМЕНА {n} ПРИНИМАЕТ ПУЛЬТ. Отвечают миров: {c}. С прошлой передачи ничего не изменилось; в записке одно слово."], ["LOG", "shift_calm3", "SHIFT {n} TAKES THE DESK. {c} worlds answering. The previous shift asked to be remembered for keeping it that way.", "СМЕНА {n} ПРИНИМАЕТ ПУЛЬТ. Отвечают миров: {c}. Прошлая смена просила запомнить, что всё так и держалось."], ["LOG", "shift_idle2", "SHIFT {n} TAKES THE DESK. {i} hulls idle at the yards. The previous shift meant to find them work.", "СМЕНА {n} ПРИНИМАЕТ ПУЛЬТ. {i} корпусов стоят у верфей. Прошлая смена собиралась найти им работу."], ["LOG", "shift_idle3", "SHIFT {n} TAKES THE DESK. {i} hulls at Earth without orders, crews still aboard, waiting.", "СМЕНА {n} ПРИНИМАЕТ ПУЛЬТ. {i} корпусов у Земли без приказа, экипажи на борту, ждут."], ["LOG", "shift_shrink2", "SHIFT {n} TAKES THE DESK. {c} worlds answering. The previous shift spent its years lifting settlements.", "СМЕНА {n} ПРИНИМАЕТ ПУЛЬТ. Отвечают миров: {c}. Прошлая смена провела свои годы, снимая поселения."], ["LOG", "shift_shrink3", "SHIFT {n} TAKES THE DESK. {c} worlds answering. The handover note lists the ones that stopped.", "СМЕНА {n} ПРИНИМАЕТ ПУЛЬТ. Отвечают миров: {c}. В записке — список тех, кто замолчал."], ["LOG", "first_landfall", "{p}: the first landing this desk has ever confirmed. The operator wrote the time down twice.", "{p}: первая посадка, которую подтвердил этот пульт. Оператор записал время дважды."], ["LOG", "epitaph", "{p}, settled year {f}, lifted year {y}. {q} {dep} shipped in {n} {yr}. {pop} came home. Struck from the chart.", "{p}: заселён в {f}, снят в {y}. За {n} {yr} вывезено {q} ({dep}). Вернулось {pop}. Вычеркнут с карты."], ["LOG", "old_night", "The charts call the new ring OLD NIGHT. Nobody at the desk remembers who named it.", "На картах новое кольцо зовётся OLD NIGHT. На пульте никто не помнит, кто его так назвал."], ["LOG", "ark_sailed", "THE ARK LEFT ON SCHEDULE. {s} aboard. {b} behind — on hulls, on worlds, on the pier. The desk logged the departure and then logged nothing.", "КОВЧЕГ УШЁЛ ПО РАСПИСАНИЮ. На борту {s}. Осталось {b} — на корпусах, на мирах, на пирсе. Пульт записал отход и больше не записал ничего."], ["LOG", "desk_silent", "FINAL ENTRY. The larders have been empty {n} years. The lines will keep running until the hulls wear out. Nobody will be here to read this.", "ПОСЛЕДНЯЯ ЗАПИСЬ. Склады пусты {n} лет. Линии будут ходить, пока корпуса не износятся. Читать это будет некому."], ["LOG", "lose", "—", "—"], ["MSG", "ok", "Order sent.", "Приказ отправлен."], ["MSG", "halted", "Clock held — a hull is waiting, or something changed.", "Время остановлено — корпус ждёт или что-то изменилось."], ["MSG", "locked", "That hull is not unlocked yet.", "Этот корпус ещё не открыт."], ["MSG", "cost", "Not enough at Earth to pay for it.", "На Земле нечем за это заплатить."], ["MSG", "noship", "No hull selected.", "Корпус не выбран."], ["MSG", "noplanet", "No such body.", "Такого тела нет."], ["MSG", "sector", "That ring is beyond your hulls' range.", "Это кольцо вне досягаемости твоих корпусов."], ["MSG", "busy", "That hull is not at Earth.", "Этот корпус не у Земли."], ["MSG", "fuel", "Not enough fuel at Earth for the crossing.", "На Земле не хватает топлива на переход."], ["MSG", "taken", "There is already a settlement there.", "Там уже есть поселение."], ["MSG", "people", "Not enough people at Earth.", "На Земле не хватает людей."], ["MSG", "cap", "That will not fit in the hold.", "В трюм это не влезет."], ["MSG", "nocolony", "No settlement there.", "Поселения там нет."], ["MSG", "have", "Already built.", "Уже построено."], ["MSG", "dark", "That settlement is in revolt and takes no orders.", "Поселение в мятеже и приказов не принимает."], ["MSG", "pop", "Population too small.", "Населения слишком мало."], ["MSG", "metal", "Not enough metal ON SITE. Ship metal there first.", "Не хватает металла НА МЕСТЕ. Сначала привези туда металл."], ["MSG", "parts", "Not enough parts at Earth. Parts come from industrial worlds.", "На Земле не хватает деталей. Детали делают промышленные миры."], ["MSG", "pending", "An order to them is already in transit.", "Приказ им уже в пути."], ["MSG", "nodark", "That settlement is not in revolt.", "Это поселение не в мятеже."], ["MSG", "nomissing", "That hull is not missing.", "Этот корпус не числится пропавшим."], ["MSG", "running", "The drive programme is already under way.", "Программа гипердрайва уже идёт."], ["MSG", "notworks", "Only an industrial world can host it.", "Её может принять только промышленный мир."], ["MSG", "relay", "That world needs a relay station first.", "Этому миру сначала нужен ретранслятор."], ["MSG", "reach", "Not enough live worlds.", "Живых миров слишком мало."], ["MSG", "food", "Not enough rations at Earth.", "На Земле не хватает провизии."], ["MSG", "none", "Nothing to scrap.", "Списывать нечего."], ["MSG", "crew", "Not enough hands at Earth to man her.", "На Земле не хватает рук, чтобы её укомплектовать."], ["MSG", "evacuating", "A hull is already on its way to lift that world.", "Корпус уже идёт снимать этот мир."], ["MSG", "range", "That hull is short-legged for a ring that far out. A bigger class, or a newer generation, can make it.", "Этому корпусу не хватает дальности до этого кольца. Нужен класс побольше или новое поколение."], ["MSG", "ghost", "That world is dead. Nothing there to settle.", "Этот мир мёртв. Заселять нечего."], ["MSG", "retired", "The yards no longer build that generation.", "Верфи это поколение больше не строят."], ["MSG", "copied", "Run log copied.", "Лог скопирован."], ["MSG", "copyfail", "Could not copy — select the text and copy by hand.", "Не скопировалось — выдели текст и скопируй руками."], ["MSG", "off", "That system is switched off in this build.", "Эта система пока отключена в сборке."], ["MSG", "noroute", "No line set.", "Линия не задана."], ["MSG", "lineSet", "Line set — the hauler leaves now.", "Линия задана — тягач уходит."], ["MSG", "policySet", "Line running — it will keep itself going.", "Линия работает — дальше она сама."], ["MSG", "queued", "Orders sent — it changes line when it next docks.", "Приказ ушёл — сменит линию, когда причалит."], ["MSG", "noPick", "Pick a hull first.", "Сначала выбери корпус."], ["MSG", "lost", "That hull is missing.", "Этот корпус пропал."], ["MSG", "samenode", "Both ends are the same place.", "Оба конца — одно и то же место."], ["MSG", "textsOk", "Texts reloaded from the sheet.", "Тексты подтянуты из таблицы."], ["MSG", "textsNoUrl", "No sheet link in this build.", "В этой сборке нет ссылки на таблицу."], ["MSG", "textsFail", "Could not reach the sheet — keeping the built-in texts.", "Таблица недоступна — остаются встроенные тексты."], ["RES", "metal", "metal", "металл"], ["RES", "food", "rations", "провизия"], ["RES", "fuel", "fuel", "топливо"], ["RES", "parts", "parts", "детали"], ["GUIDE", "p1.title", "You are the relay desk", "Ты — пульт связи"], ["GUIDE", "p1.kicker", "Earth is dying and you never leave it. Everything you see is a report, and reports are old.", "Земля умирает, и ты с неё никогда не улетаешь. Всё, что ты видишь, — доклады, а доклады всегда старые."], ["GUIDE", "p1.b1", "Earth burns <b>rations<\/b> and <b>metal<\/b> every year, and burns a little more every year. Nothing you do stops that.", "Земля каждый год сжигает <b>провизию<\/b> и <b>металл<\/b>, и с каждым годом чуть больше. Остановить это нельзя."], ["GUIDE", "p1.b2", "You sit at the desk on Earth. You order hulls built, worlds settled and lines opened. You never fly.", "Ты сидишь за пультом на Земле. Заказываешь корпуса, заселяешь миры, открываешь линии. Сам никуда не летишь."], ["GUIDE", "p1.b3", "The desk is an institution, not a person. It outlives everyone who ever sat at it.", "Пульт — ведомство, а не человек. Оно переживает всех, кто за ним сидел."], ["GUIDE", "p1.b4", "Earth starves if the holds run empty for <b>260 years straight<\/b>. And at some point the outer survey will bring back a date: the year the collapse reaches the sun and every charted world with it. From then on you are building an <b>ark<\/b> and the <b>drive<\/b> that can outrun it, and the score is how many of the people aboard wake at the other end.", "Земля гибнет, если склады пусты <b>260 лет подряд<\/b>. А однажды дальняя разведка привезёт дату — год, когда коллапс достигнет солнца и каждого нанесённого мира. С этого дня ты строишь <b>ковчег<\/b> и <b>двигатель<\/b>, который от коллапса уйдёт, а счёт — сколько посаженных на ковчег проснутся на месте."], ["GUIDE", "p2.title", "The loop", "Петля"], ["GUIDE", "p2.kicker", "Settle a world, open a line, let it run. That is the whole game in one sentence.", "Засели мир, открой линию, дальше она сама. Вся игра в одном предложении."], ["GUIDE", "p2.b1", "Click a world on the chart. In the <b>Target<\/b> panel pick a free hull and press <b>Found<\/b>. The party is as many as the world takes and the hold carries.", "Нажми на мир на карте. В панели <b>Объект<\/b> выбери свободный корпус и нажми <b>Основать<\/b>. Партия — столько, сколько мир вмещает и трюм увозит."], ["GUIDE", "p2.b2", "Once it is settled, put a hull on its line: <b>Send here<\/b> under a free hull at Earth, or <b>+<\/b> next to a hull class to order a new one for this line. It runs world &#8596; Earth by itself, forever.", "Когда мир заселён, поставь корпус на его линию: <b>Отправить сюда<\/b> у свободного корпуса у Земли или <b>+<\/b> у класса — заказать новый под эту линию. Он ходит мир &#8596; Земля сам, вечно."], ["GUIDE", "p2.b3", "Outbound it carries settlers (and metal and rations to industrial worlds). Inbound it carries whatever that world produces.", "Туда он везёт поселенцев (а на промышленные миры — металл и провизию). Обратно — то, что этот мир производит."], ["GUIDE", "p2.b4", "You never load a ship by hand. If a line cannot keep up, put another hull on it. Nobody replaces a hull that is lost or refuses — that is your call.", "Ты никогда не грузишь корабль руками. Если линия не справляется — поставь на неё ещё корпус. Потерянный или отказавшийся корпус никто не заменит — это решаешь ты."], ["GUIDE", "p3.title", "Four resources, four kinds of world", "Четыре ресурса, четыре типа миров"], ["GUIDE", "p3.kicker", "Every world does exactly one job. Earth consumes; the colonies produce.", "Каждый мир делает ровно одно дело. Земля потребляет, колонии производят."], ["GUIDE", "p3.b1", "<b>Mining worlds<\/b> dig metal. <b>Agricultural worlds<\/b> grow rations. <b>Fuel worlds<\/b> pump fuel. All three sit on a <b>finite seam<\/b>.", "<b>Рудные миры<\/b> дают металл. <b>Аграрные<\/b> — провизию. <b>Топливные<\/b> — топливо. У всех трёх <b>конечная жила<\/b>."], ["GUIDE", "p3.b2", "<b>Industrial worlds<\/b> make <b>parts<\/b> — but only out of metal and rations you haul in to them. Nothing arrives, nothing is made.", "<b>Промышленные миры<\/b> делают <b>детали<\/b>, но только из привезённых туда металла и провизии. Ничего не привёз — ничего не сделано."], ["GUIDE", "p3.b3", "Metal and rations keep Earth alive. Fuel is spent on every departure — and, later, by the machines on your worlds. Parts buy hulls, surveys, the drive programme and every kit of machines.", "Металл и провизия держат Землю живой. Топливо тратится на каждый вылет — а позже его жжёт техника на твоих мирах. Детали идут на корпуса, разведку, двигатель и на каждый комплект техники."], ["GUIDE", "p3.b4", "Colonies feed themselves and never breed. Every settler on a world was carried there by you.", "Колонии кормят себя сами и не размножаются. Каждый поселенец на планете привезён тобой."], ["GUIDE", "p3.b5", "<b>Hands<\/b> are the fourth. Earth turns out 1.5 a year and they never eat, but they are spent: every hull holds its crew for its whole service life, a survey burns a party outright, and a settlement takes 26. Hands left at home raise Earth’s own output with diminishing returns. Hands at home or hulls in the dark — that is the trade.", "<b>Руки<\/b> — четвёртый. Земля даёт 1.5 в год, они ничего не едят, но их тратят: каждый корпус держит экипаж всю службу, разведка сжигает партию безвозвратно, поселение стоит 26. Руки, оставшиеся дома, поднимают выработку Земли с затухающей отдачей. Руки дома или корпуса во тьме — вот размен."], ["GUIDE", "p4.title", "Hulls: class and range", "Корпуса: класс и дальность"], ["GUIDE", "p4.kicker", "Three classes, and the class decides how far out it can work.", "Три класса, и класс решает, как далеко корпус способен работать."], ["GUIDE", "p4.b1", "<b>Courier<\/b> — small, fast, cheap. <b>Hauler<\/b> — middling. <b>Freighter<\/b> — huge, slow, dear.", "<b>Курьер<\/b> — маленький, быстрый, дешёвый. <b>Тягач<\/b> — средний. <b>Грузовоз<\/b> — огромный, медленный, дорогой."], ["GUIDE", "p4.b2", "Range is <b>class plus generation<\/b>. At generation 0 a courier reaches ring 2, a hauler ring 3, a freighter ring 4. Every drive mark pushes all three out by one ring.", "Дальность = <b>класс плюс поколение<\/b>. На поколении 0 курьер достаёт до кольца 2, тягач до 3, грузовоз до 4. Каждая отметка двигателя двигает все три на одно кольцо дальше."], ["GUIDE", "p4.b3", "So the near rings are courier work — short round trips, where speed pays. The frontier is freighter country, and nothing else will get there.", "Поэтому ближние кольца — работа курьеров: короткий круг, где окупается скорость. Фронтир — территория грузовозов, больше туда никто не дойдёт."], ["GUIDE", "p4.b4", "A hull rated too short simply refuses the order. The chart marks every ring with the class it needs.", "Корпус, которому не хватает дальности, просто не примет приказ. На карте у каждого кольца написано, какой класс нужен."], ["GUIDE", "p4.b5", "Every hull is also <b>crew<\/b>, taken off Earth the day she is laid down: courier 8, hauler 20, freighter 45, and more for each generation. Scrap her and they come home. Lose her and they are gone.", "Каждый корпус — это ещё и <b>экипаж<\/b>, снятый с Земли в день закладки: курьер 8, тягач 20, грузовоз 45, и больше с каждым поколением. Спишешь — вернутся. Потеряешь — нет."], ["GUIDE", "p5.title", "Growth, and why it never ends", "Рост, и почему он не кончается"], ["GUIDE", "p5.kicker", "Further out means richer, more dangerous and dearer. There is no last ring.", "Дальше — значит богаче, опаснее и дороже. Последнего кольца не существует."], ["GUIDE", "p5.b1", "Seams run out. A worked-out world is lifted and leaves a grave marker on the chart.", "Жилы кончаются. Выработанный мир снимают, на карте остаётся могильная отметка."], ["GUIDE", "p5.b2", "<b>Survey<\/b> (Earth tab) charts the next ring. It costs rations, fuel, metal and parts, and needs enough <b>settled worlds<\/b> — every world you have ever settled counts, even a spent one.", "<b>Разведка<\/b> (вкладка Земля) наносит следующее кольцо. Стоит провизии, топлива, металла и деталей, и требует достаточно <b>заселённых миров<\/b> — считаются все, что ты когда-либо заселял, даже выработанные."], ["GUIDE", "p5.b3", "You may chart a ring no hull of yours can reach yet. You will see it and not be able to touch it.", "Нанести на карту кольцо, куда твои корпуса ещё не долетают, теперь можно. Ты будешь его видеть и не сможешь тронуть."], ["GUIDE", "p5.b4", "The <b>drive programme<\/b>, hosted by an industrial world, is what closes that gap: it opens the next generation of hulls, pushes every range out by one ring and makes every crossing faster. With Generation III yards it also opens the <b>engineering programme<\/b>: kits of machines for your worlds.", "<b>Программа двигателя<\/b> на промышленном мире — то, что закрывает этот разрыв: открывает следующее поколение корпусов, двигает все дальности на кольцо дальше и ускоряет все перелёты. С верфями поколения III она открывает и <b>инженерную программу<\/b>: комплекты техники для твоих миров."], ["GUIDE", "p6.title", "The desk", "Пульт"], ["GUIDE", "p6.kicker", "The game does the arithmetic. You make the decisions.", "Арифметику считает игра. Решения принимаешь ты."], ["GUIDE", "p6.b1", "The panel in the map’s top-left lists everything that wants a decision, worst first. <b>Open<\/b> jumps to it, <b>×<\/b> silences it.", "Панель слева сверху на карте перечисляет всё, что требует решения, худшее первым. <b>Открыть<\/b> — перейти, <b>×<\/b> — убрать."], ["GUIDE", "p6.b2", "<b>Space<\/b> pauses. <b>1 / 2 / 3 / 4<\/b> set speed: a year every 1.5 seconds at 1×; 10× is for the empty stretches. <b>HOLD<\/b> stops the clock whenever a hull comes home or something changes. The journal shows the desk by default — voices, the chronicle, decisions; <b>Desk<\/b> switches to all traffic.", "<b>Пробел<\/b> — пауза. <b>1 / 2 / 3 / 4<\/b> — скорость: на 1× год идёт полторы секунды, 10× — для пустых отрезков. <b>СТОП<\/b> останавливает время, когда корпус вернулся или что-то изменилось. Журнал по умолчанию показывает пульт — голоса, летопись, решения; кнопка <b>Пульт<\/b> переключает на весь трафик."], ["GUIDE", "p6.b3", "The map fits itself to the chart. <b>Wheel<\/b> zooms, <b>drag<\/b> moves, <b>FIT<\/b> puts it all back on screen.", "Карта сама подгоняется под чертёж. <b>Колесо<\/b> — зум, <b>перетаскивание<\/b> — сдвиг, <b>ВСЯ КАРТА<\/b> — вернуть всё на экран."], ["GUIDE", "p6.b4", "The <b>journal<\/b> is also the desk’s chronicle: every shift of operators writes one line about what it inherited, every lifted world gets an epitaph. <b>Chronicle<\/b> filters it down to those.", "<b>Журнал<\/b> — ещё и летопись пульта: каждая смена операторов пишет строку о том, что ей досталось, каждый снятый мир получает эпитафию. <b>Летопись<\/b> оставляет только их."], ["GUIDE", "p6.b5", "<b>Copy run log<\/b> on the Earth tab dumps every order you gave and a snapshot every 50 years. That is what the designer reads.", "<b>Скопировать лог прогона<\/b> на вкладке Земля выгружает все твои приказы и снимок состояния каждые 50 лет. Это то, что читает дизайнер."], ["UI", "startT", "How do you want to begin?", "С чего начнём?"], ["UI", "startB", "Never played? The prologue takes ten minutes and shows one thing at a time.", "Впервые? Пролог занимает десять минут и показывает по одной вещи за раз."], ["UI", "startPro", "First time — the prologue", "Впервые — пролог"], ["UI", "startSkip", "I have played — open the desk", "Уже играл — открыть пульт"], ["UI", "startGuide", "Read the guide", "Прочитать руководство"], ["UI", "taskTitle", "Task", "Задача"], ["UI", "taskStep", "{a} / {b}", "{a} / {b}"], ["UI", "t0", "Send a hull to {p}: click the world, press Found.", "Отправь корпус на {p}: нажми на мир, нажми «Основать»."], ["UI", "t0b", "Hull {n} is away — {y} years out. Press ▶: time moves only when you let it.", "Корпус {n} ушёл — лететь {y} лет. Нажми ▶: время идёт, только когда ты разрешаешь."], ["UI", "t0c", "Landfall. Hull {n} is coming home — {y} years.", "Посадка есть. Корпус {n} возвращается — {y} лет."], ["UI", "t1", "Open a line from {p}: press Send here under the free hull. It takes the line and hauls metal home by itself, forever.", "Открой линию с {p}: нажми «Отправить сюда» у свободного корпуса. Он встанет на линию и будет возить металл домой вечно."], ["UI", "t1b", "The line is running. Wait for the first delivery — about {y} years for the round trip.", "Линия работает. Дождись первой доставки — круг около {y} лет."], ["UI", "t2", "Earth eats rations too. Settle {p} — a farm — with hull {n}, then send a free hull to it with Send here on its card.", "Земля ест и провизию. Засели {p} — ферму — корпусом {n}, потом отправь туда свободный корпус кнопкой «Отправить сюда» на его карточке."], ["UI", "t2w", "Wait for a free hull at Earth.", "Дождись свободного корпуса у Земли."], ["UI", "t3", "Every departure burns fuel. Build a courier in the yards below, then settle {p} — a well.", "Каждый вылет сжигает топливо. Заложи курьер на верфях внизу, потом засели {p} — скважину."], ["UI", "t3b", "The courier is being built — {y} years.", "Курьер строится — {y} лет."], ["UI", "t3c", "Settle {p} — a well — and put a courier on its line.", "Засели {p} — скважину — и поставь курьера на его линию."], ["UI", "t4", "Parts are made only on an industrial world. Settle {p} and put a courier on its line: it carries metal and rations out and parts back.", "Детали делают только на промышленном мире. Засели {p} и поставь курьера на линию: он повезёт туда металл и провизию, а назад — детали."], ["UI", "t5", "That is the whole game. The chart is open, and everything that wants a decision now appears in this corner, worst first.", "Это вся игра. Карта открыта, а всё, что требует решения, теперь появляется в этом углу, худшее первым."], ["UI", "t5go", "Take the desk", "Принять пульт"], ["UI", "prevFound", "{n} settlers → {r}/year {dep}. The world holds {cap}; the line tops it up.", "{n} поселенцев → {r}/год ({dep}). Мир вмещает {cap}; линия доложит остальных."], ["UI", "prevLine", "Round trip {t} {yrt} · hold {cap} {dep} per run.", "Круг {t} {yrt} · за рейс до {cap} ({dep})."], ["UI", "calloutOk", "Got it", "Понятно"], ["UI", "cPeople", "Hands. Settlers and crews come from here, and only from here.", "Люди. Поселенцы и экипажи берутся отсюда, и только отсюда."], ["UI", "cMetal", "Earth burns metal every year. The arrow says whether the stockpile grows or shrinks.", "Земля сжигает металл каждый год. Стрелка показывает, растёт склад или тает."], ["UI", "cFood", "Earth burns rations too. Hunger kills faster than anything else.", "Провизию Земля тоже сжигает. Голод убивает быстрее всего."], ["UI", "cFuel", "Fuel is spent on every departure. Without it nothing leaves.", "Топливо тратится на каждый вылет. Без него никто не улетит."], ["UI", "cParts", "Parts come from the industrial world. Bigger hulls, surveys and the drive cost parts.", "Детали приходят с промышленного мира. Большие корпуса, разведка и двигатель стоят деталей."], ["UI", "cDock", "The yards. New hulls come from here; each takes its crew off Earth.", "Верфи. Новые корпуса заказывают здесь; каждый забирает экипаж с Земли."], ["UI", "cAdvisor", "From now on this panel lists what wants a decision, worst first. Open jumps to it, × silences it.", "С этого момента здесь список того, что требует решения, худшее первым. «Открыть» — перейти, × — убрать."], ["UI", "cSurvey", "Charting the next ring needs enough settled worlds — every world you have ever settled counts, even a spent one. Settle more, then survey.", "Нанести следующее кольцо можно, когда заселено достаточно миров — считаются все, что ты когда-либо заселял, даже выработанные. Засели больше, потом разведывай."], ["VOICE", "role_chief", "Shift chief", "Начальник смены"], ["VOICE", "role_captain", "Hull captain", "Капитан корпуса"], ["VOICE", "role_head", "Settlement head", "Глава поселения"], ["VOICE", "role_duty", "Duty operator", "Дежурный связи"], ["VOICE", "night_dated.1", "The outer survey came back with the readings, and I have checked them until there was nothing left to check. Past the last charted ring, space is falling in on itself. It reaches the sun in year {y}. Everything you have charted goes with it. No drive we own can outrun it; a Generation {g} drive can. {fy} I am told to say nothing else.", "Дальняя разведка вернулась с показаниями, и я проверял их, пока проверять стало нечего. За последним нанесённым кольцом пространство падает само в себя. Солнца оно достигает в год {y}. Всё, что вы нанесли на карту, уйдёт вместе с ним. Ни один наш двигатель от этого не уйдёт; двигатель поколения {g} уйдёт. {fy} Больше мне говорить не велено."], ["VOICE", "colony_founded.1", "Down. {pop} of us, one dome. Send more people while you still have them.", "Сели. Нас {pop}, один купол. Присылайте людей, пока они у вас есть."], ["VOICE", "captain_new.1", "Hull {hull}. Captain no. {k} on this hull. Never met the ones before.", "Корпус {hull}. Капитан №{k} на этом корпусе. Предыдущих не застал."], ["VOICE", "ship_missing.1", "Hull {hull} missed its call. Crew of {crew}. Holding the channel open, per regulation.", "Корпус {hull} не вышел на связь. Экипаж {crew}. Держу канал открытым, по инструкции."], ["VOICE", "last_flight.1", "Order received. We will not make it back — the table says so. Proceeding.", "Приказ принят. Обратно не успеваем — это видно по таблице. Выполняем."], ["VOICE", "evacuated.1", "Lifting off. {pop} aboard. We left the dome lights on. I do not know why.", "Снимаемся. На борту {pop}. Свет в куполе оставили. Не знаю зачем."], ["VOICE", "left_behind.1", "We can hear the countdown. Do not answer. Keep the channel for the ones who will make it.", "Слышим отсчёт. Не отвечайте. Берегите канал для тех, кто успеет."], ["VOICE", "ark_closed.1", "Boarding closed. {left} stay on the pier. The desk runs to the end.", "Посадка закрыта. {left} остаются на пирсе. Пульт работает до конца."], ["UI", "pfTitle", "Personal file", "Личное дело"], ["UI", "pfNo", "service no. {n}", "служебный № {n}"], ["UI", "pfHull", "hull {n} · captain no. {k}", "корпус {n} · капитан № {k}"], ["UI", "pfOk", "Acknowledged", "Принято"], ["UI", "names", "Adeyemi Okafor Varga Novak Lindqvist Sato Ferreira Haddad Petrov Nakamura Oyelaran Kowalski Brandt Moreau Iyer Castellanos Nygaard Dlamini Haugen Tanaka Marchetti Sorensen Abara Kimura Delacroix Ivashko Bekele Fontaine Ruiz Yilmaz Halvorsen Mbeki Andrade Sokolov Quintero Nakashima Weiss Osei Lindgren Taggart Murakami Vasquez Achebe Holm Rahimi Duarte Karlsen Obi Renaud Zielinski", "Adeyemi Okafor Varga Novak Lindqvist Sato Ferreira Haddad Petrov Nakamura Oyelaran Kowalski Brandt Moreau Iyer Castellanos Nygaard Dlamini Haugen Tanaka Marchetti Sorensen Abara Kimura Delacroix Ivashko Bekele Fontaine Ruiz Yilmaz Halvorsen Mbeki Andrade Sokolov Quintero Nakashima Weiss Osei Lindgren Taggart Murakami Vasquez Achebe Holm Rahimi Duarte Karlsen Obi Renaud Zielinski"], ["LOG", "voice", "{who} {name}: {line}", "{who} {name}: {line}"], ["VOICE", "colony_founded.2", "Landed. {pop}. The dome holds pressure. Nobody here has seen Earth; nobody here will.", "Сели. {pop} человек. Купол держит давление. Землю здесь никто не видел; никто и не увидит."], ["VOICE", "evacuated.2", "{pop} aboard. Twelve stayed to shut the reactor down. They knew the hold was full when they volunteered.", "На борту {pop}. Двенадцать остались глушить реактор. Знали, что трюм полон, когда вызвались."], ["VOICE", "captain_new.2", "Hull {hull}. I took the bridge in the dark between stars; the last captain is in the aft locker. Cargo intact.", "Корпус {hull}. Принял мостик между звёзд; прежний капитан в кормовом отсеке. Груз цел."], ["VOICE", "ship_missing.2", "Hull {hull}, {crew} aboard, no carrier for six months. Logging it as overdue, not lost. Regulation says lost.", "Корпус {hull}, {crew} на борту, полгода без несущей. Записываю как задержку, не как потерю. По инструкции — потеря."], ["VOICE", "night_dated.2", "Year {y}. The number is not mine; the machine gave it, and the machine has been right about everything smaller. The collapse takes the sun and every world on your chart. Between now and then there is one problem, not many: a Generation {g} drive. {fy} Something will change. That is your desk, not mine.", "Год {y}. Число не моё — его выдала машина, а машина не ошибалась ни в чём меньшем. Коллапс забирает солнце и каждый мир на вашей карте. До этого дня есть одна задача, а не много: двигатель поколения {g}. {fy} Что-то изменится. Это ваш пульт, не мой."], ["UI", "hArkDrive", "Ark drive", "Двигатель ковчега"], ["UI", "arkdReady", "READY", "ГОТОВ"], ["UI", "arkdWake", "{w}% wake", "проснутся {w}%"], ["UI", "arkdNext", "Generation {g} ≈ {y} → {w}%", "поколение {g} ≈ {y} → {w}%"], ["UI", "arkdLate", "{n} {yr} after the Night", "на {n} {yr} позже Ночи"], ["UI", "arkdSpare", "{n} {yr} to spare", "запас {n} {yr}"], ["UI", "arkdReach", "needs {n} worlds settled, you have {r}", "нужно заселить миров: {n}, заселено: {r}"], ["UI", "arkdHost", "no industrial world with {n} hands to host it", "нет промышленного мира с {n} людьми"], ["UI", "arkdStall", "no parts coming in", "детали не поступают"], ["UI", "arkWakeRow", "Would wake at the other end", "Проснулось бы на месте"], ["UI", "arkNoDrive", "no drive — the ark cannot sail", "нет двигателя — ковчег не уйдёт"], ["UI", "arkDriveHint", "The ark sails on a Generation {g} drive or better: {a}% of the sleepers wake on the minimum, {b}% one mark above, {c}% two above, {d}% three and beyond. The minimum is a cushion for the lazy — and it is paid for in souls.", "Ковчег уходит на двигателе поколения {g} или лучше: на минимальном просыпается {a}% спящих, на одну метку выше — {b}%, на две — {c}%, на три и дальше — {d}%. Минимум — подушка для ленивых, и платят за неё душами."], ["UI", "nightDrive", "And one thing the readings make plain: no drive we have can outrun the collapse. An ark needs a <b>Generation {g}<\/b> drive. The header now carries two years — the Night, and the year that drive is ready at the pace your works keep. Make the second come first.", "И одно показания говорят прямо: ни один наш двигатель от коллапса не уйдёт. Ковчегу нужен двигатель <b>поколения {g}<\/b>. В шапке теперь два года — Ночь и год, когда этот двигатель будет готов при нынешнем темпе заводов. Сделай так, чтобы второй наступил раньше."], ["UI", "endNightDrive", "The ark stood on the pier. The Generation {g} drive to push it past the collapse was never finished. The dark closed over a full ark that could not leave.", "Ковчег стоял у причала. Двигатель поколения {g}, чтобы вытолкнуть его за обрушение, так и не закончили. Тьма сомкнулась над полным ковчегом, который не смог уйти."], ["UI", "statWoke", "Woke at the other end", "Проснулись на месте"], ["UI", "a_arkd_late", "The ark drive (Generation {g}) is due in year {y} at this pace — {l} {yrl} after the Night. Feed the drive programme.", "Двигатель ковчега (поколение {g}) при этом темпе будет к году {y} — на {l} {yrl} позже Ночи. Корми программу двигателя."], ["UI", "a_arkd_tight", "The ark drive (Generation {g}) is due in year {y} — only {l} {yrl} before the Night.", "Двигатель ковчега (поколение {g}) будет к году {y} — всего за {l} {yrl} до Ночи."], ["UI", "a_arkd_reach", "The ark drive (Generation {g}) needs the next drive mark, and that needs {n} worlds settled. You have settled {r}.", "Двигателю ковчега (поколение {g}) нужна следующая отметка, а ей — {n} заселённых миров. Заселено: {r}."], ["UI", "a_arkd_host", "The ark drive (Generation {g}) needs a drive programme, and no industrial world has {n} hands to host it.", "Двигателю ковчега (поколение {g}) нужна программа двигателя, а ни на одном промышленном мире нет {n} людей, чтобы её принять."], ["UI", "a_arkd_stall", "No parts are coming in. The ark drive (Generation {g}) will never be ready at this pace.", "Детали не поступают. При таком темпе двигатель ковчега (поколение {g}) не будет готов никогда."], ["LOG", "ark_drive", "GENERATION {g} DRIVE CAN PUSH THE ARK. {w}% of the sleepers would wake at the other end. The Night is still year {y}.", "ДВИГАТЕЛЬ ПОКОЛЕНИЯ {g} СДВИНЕТ КОВЧЕГ. На месте проснулись бы {w}% спящих. Ночь по-прежнему в год {y}."], ["LOG", "ark_grounded", "THE NIGHT CAME AND THE ARK STAYED ON THE PIER. {b} berths, and no Generation {g} drive to push them.", "НОЧЬ НАСТУПИЛА, А КОВЧЕГ ОСТАЛСЯ У ПРИЧАЛА. {b} мест — и нет двигателя поколения {g}, чтобы их сдвинуть."], ["LOG", "ark_woke", "Generation {g} drive. {w} of {s} woke at the other end.", "Двигатель поколения {g}. На месте проснулись {w} из {s}."], ["UI", "arkdReachLater", "{n} worlds settled on the way", "по пути нужно заселить миров: {n}"], ["VOICE", "role_sci", "Institute physicist", "Физик Института"], ["VOICE", "date_shift.1", "First shift to take the desk with the year already on the wall. Nobody here will see it. We are asked to work as if we will.", "Первая смена, принявшая пульт, когда год уже написан на стене. Никто из нас его не увидит. Нас просят работать так, будто увидим."], ["VOICE", "date_shift.2", "Year {y} is on the wall above the desk in the previous shift's hand. I have not painted over it. I have added the number of worlds.", "Год {y} написан на стене над пультом рукой прошлой смены. Я не закрасил. Я дописал число миров."], ["VOICE", "ark_drive.1", "Generation {g}. It will carry an ark past the collapse. It will not carry everyone through the crossing: {w} of every hundred wake at the other end, by the model, and the model has not been wrong yet. Every generation after this one wakes more. That is the whole of what I have to offer you.", "Поколение {g}. Оно вынесет ковчег за пределы коллапса. Не всех, кто на борту: по расчёту, на месте просыпаются {w} из каждой сотни, а расчёт пока не ошибался. Каждое следующее поколение будит больше. Это всё, что я могу вам предложить."], ["VOICE", "ark_drive.2", "The Generation {g} drive is done and it is enough. Enough is a word I used to hate. {w} out of a hundred wake at the far end; the rest do not. You can stop here and build berths, or feed the programme another generation and lose the years. I have written both columns on the same page and I am not choosing.", "Двигатель поколения {g} готов, и его достаточно. «Достаточно» — слово, которое я раньше ненавидел. Из сотни на месте просыпаются {w}; остальные нет. Можно остановиться здесь и строить места. Можно кормить программу ещё поколение и терять годы. Я записал оба столбца на одной странице и не выбираю."], ["VOICE", "doomsday.1", "{n} years to the Night and the square in front of the Institute is full every morning. Some of them say the date is a lie the desk tells to keep them digging. Some say the ark is for us and not for them, and they are not wrong about the arithmetic: berths for {b}, {h} standing at home. I have stopped reading what they paint on the doors. The lines still run.", "До Ночи {n} лет, и площадь перед Институтом полна каждое утро. Одни говорят, что дата — ложь, которую пульт рассказывает, чтобы они копали. Другие — что ковчег для нас, а не для них, и в арифметике они не ошибаются: мест на {b}, дома стоят {h}. Я перестал читать, что они пишут на дверях. Линии ходят."], ["VOICE", "doomsday.2", "There is a congregation on the pier now. They hold a service at every launch and a wake at every landing. They do not want a berth; they say the Night is owed. The yards work around them. I have {h} at home, berths for {b}, and {n} years. I do not have time to argue with the ones who have decided.", "На пирсе теперь община. Служба на каждый вылет, поминки на каждую посадку. Место им не нужно — говорят, Ночь заслужена. Верфи работают, обходя их. У меня {h} дома, мест на {b} и {n} лет. Спорить с теми, кто уже решил, времени нет."], ["VOICE", "crash.1", "Hull {hull}, on final to {p}. Lost the port cluster at two thousand metres. We are not going to make the plain. I am putting the log on the carrier so someone has it. Cargo was people.", "Корпус {hull}, заход на {p}. Потеряли левую группу на двух тысячах. До равнины не дотянем. Ставлю журнал на несущую, чтобы он у кого-то остался. Груз — люди."], ["VOICE", "crash.2", "Hull {hull}. Atmosphere on {p} is thicker than the survey said and the survey is older than I am. Structure is going. Nobody in the hold is awake for this, which is the one mercy. Closing the channel.", "Корпус {hull}. Атмосфера на {p} плотнее, чем в разведке, а разведка старше меня. Корпус расходится. В трюме никто не проснулся, и это единственная милость. Закрываю канал."], ["VOICE", "written_off.1", "Hull {hull} struck off. {crew} aboard. The regulation gives a form for this; I have filled it in and I do not know where it goes.", "Корпус {hull} списан. {crew} на борту. По инструкции для этого есть форма; я её заполнил и не знаю, куда её отдать."], ["VOICE", "written_off.2", "Closing the channel for hull {hull} after three hundred years of silence. {crew} people. I kept it open longer than the rules allow. The rules do not sit at this desk.", "Закрываю канал корпуса {hull} после трёхсот лет тишины. {crew} человек. Держал дольше, чем позволено. Правила за этим пультом не сидят."], ["VOICE", "seam_more.1", "The core samples were wrong, in our favour for once. The seam under {p} runs deeper than the chart says — {q} more {dep} in the ground. The children here will not have to move.", "Керны ошиблись, в кои-то веки в нашу пользу. Жила под {p} идёт глубже, чем на карте: в земле ещё {q} ({dep}). Здешним детям не придётся переезжать."], ["VOICE", "seam_more.2", "{p}: we went past the depth the survey called the floor and there was no floor. {q} more {dep}, by the new bores. Send another hull, not more people.", "{p}: прошли глубину, которую разведка называла дном, а дна нет. По новым скважинам ещё {q} ({dep}). Пришлите ещё корпус, а не людей."], ["VOICE", "seam_less.1", "{p}: the seam pinched out {q} short of the survey. The prospector who signed the chart has been dead for a century. We are digging the walls now and counting the years, not the tonnes.", "{p}: жила сошла на нет, недодав {q} против разведки. Тот, кто подписал карту, умер сто лет назад. Копаем стенки и считаем годы, не тонны."], ["VOICE", "seam_less.2", "We opened the lower gallery on {p} and found rock. {q} {dep} that the chart promised are not there and never were. Tell the desk to plan the lift early. We would rather leave than starve here.", "Открыли нижний штрек на {p} и нашли породу. {q} ({dep}), обещанных картой, там нет и не было. Передайте пульту: планируйте снятие заранее. Лучше уйти, чем голодать здесь."], ["VOICE", "seam_rich.1", "{p}: a pocket opened under the main gallery, {q} {dep} sitting loose. It will not fit on the next hull. It will not fit on the next three.", "{p}: под главным штреком открылся карман, {q} ({dep}) лежит россыпью. На следующий корпус не влезет. На следующие три тоже."], ["VOICE", "wreck.1", "{p}: the stack collapsed in the storm and took {q} {dep} with it. A year's work on the ground in an hour. Nobody hurt; nobody will say that is enough.", "{p}: штабель рухнул в бурю и унёс с собой {q} ({dep}). Год работы на землю за час. Никто не пострадал; никто не скажет, что этого достаточно."], ["VOICE", "disaster.1", "{p}: dome two lost pressure in the night. {q} did not wake. We have moved into dome one and it is enough room, which is the worst thing I have written to you.", "{p}: второй купол ночью потерял давление. {q} не проснулись. Перешли в первый, и места хватает — это худшее, что я вам писал."], ["VOICE", "disaster.2", "{p}: seismic. {q} dead under the gallery. We will dig again when the ground stops. Please do not send condolences on the carrier; send people.", "{p}: сейсмика. {q} погибших под штреком. Начнём копать, когда земля успокоится. Не шлите соболезнования по несущей; шлите людей."], ["LOG", "ev_short", "{p}: the seam is thinner than the survey said — {q} {dep} that were never there.", "{p}: жила тоньше, чем в разведке — {q} {dep}, которых там никогда не было."], ["LOG", "doomsday", "{n} YEARS TO THE NIGHT. Earth has learned to live by the date: congregations on the pier, the Institute guarded, children taught the year before they are taught to read. Berths for {b}; {h} standing at home.", "{n} ЛЕТ ДО НОЧИ. Земля научилась жить по дате: общины на пирсе, Институт под охраной, детей учат году раньше, чем читать. Мест на {b}; дома стоят {h}."], ["LOG", "shift_dated", "SHIFT {n} TAKES THE DESK. The first to inherit a year instead of a chart: {n2} to the Night. {c} worlds answering. The note says: they will not be here for it; work anyway.", "СМЕНА {n} ПРИНИМАЕТ ПУЛЬТ. Первая, кому досталась не карта, а год: до Ночи {n2}. Отвечают миров: {c}. В записке: нас тогда уже не будет; работайте всё равно."], ["LOG", "shift_long", "SHIFT {n} TAKES THE DESK. {n2} years to the Night. Nobody at this desk was born before the date. {c} worlds answering; the drive programme is the only line on the board anyone asks about.", "СМЕНА {n} ПРИНИМАЕТ ПУЛЬТ. До Ночи {n2}. За этим пультом нет никого, кто родился до даты. Отвечают миров: {c}; программа двигателя — единственная строка на доске, о которой спрашивают."], ["LOG", "shift_long2", "SHIFT {n} TAKES THE DESK. {n2} years to the Night. The Institute has stopped taking students for anything but the drive. {c} worlds answering. The handover note is a drawing of the ark; the yards have not started it.", "СМЕНА {n} ПРИНИМАЕТ ПУЛЬТ. До Ночи {n2}. Институт больше не берёт учеников ни на что, кроме двигателя. Отвечают миров: {c}. В записке — рисунок ковчега; верфи его ещё не начали."], ["LOG", "shift_long3", "SHIFT {n} TAKES THE DESK. {n2} years to the Night. The date is taught in schools now as a fact about the world, like the tides. {c} worlds answering, {h} hands at home, and every one of them knows the year.", "СМЕНА {n} ПРИНИМАЕТ ПУЛЬТ. До Ночи {n2}. Дату теперь учат в школах как факт о мире, как приливы. Отвечают миров: {c}, дома {h} рук, и каждый из них знает год."], ["LOG", "shift_dusk", "SHIFT {n} TAKES THE DESK. {n2} years to the Night. There is a congregation on the pier that holds a service at every launch. Berths for {b}; {h} standing at home. The note says: do not argue with them; count them.", "СМЕНА {n} ПРИНИМАЕТ ПУЛЬТ. До Ночи {n2}. На пирсе община, служба на каждый вылет. Мест на {b}; дома стоят {h}. В записке: не спорьте с ними; считайте их."], ["LOG", "shift_dusk2", "SHIFT {n} TAKES THE DESK. {n2} years to the Night. Three of this shift asked to be struck from the berth list. The previous shift granted it and wrote nothing else. Berths for {b}; {h} standing at home.", "СМЕНА {n} ПРИНИМАЕТ ПУЛЬТ. До Ночи {n2}. Трое из этой смены попросили вычеркнуть их из списка на места. Прошлая смена разрешила и больше ничего не написала. Мест на {b}; дома стоят {h}."], ["LOG", "shift_dusk3", "SHIFT {n} TAKES THE DESK. {n2} years to the Night. The yards run three shifts; the pier runs a fourth that builds nothing and sings. {c} worlds answering. The note says: bring them in while the lines still hold.", "СМЕНА {n} ПРИНИМАЕТ ПУЛЬТ. До Ночи {n2}. Верфи работают в три смены; на пирсе четвёртая, которая ничего не строит и поёт. Отвечают миров: {c}. В записке: возвращайте их, пока линии ещё держат."], ["UI", "logDesk", "Desk", "Пульт"], ["UI", "mutinyHdr", "Refusing orders", "Отказываются от приказов"], ["UI", "mutinied", "MUTINIED", "БУНТ"], ["UI", "mutinyHint", "These crews will not go out again. They stand on the pier and board if there is a berth. The hulls take no orders, but they count for the ark's convoy.", "Эти экипажи больше не выйдут. Они стоят на пирсе и сядут, если будет место. Корпуса приказов не принимают, но в конвой ковчега засчитываются."], ["UI", "a_mutiny", "{n} hull(s) refuse orders. Their crews are home; the hulls still count for the convoy — scrap them for the metal or leave them.", "Корпусов, отказавшихся от приказов: {n}. Экипажи дома; корпуса всё ещё идут в конвой — спиши на металл или оставь."], ["UI", "statMutiny", "Mutinies", "Бунтов"], ["MSG", "mutiny", "That crew has refused the Night. The hull takes no orders.", "Этот экипаж отказался от Ночи. Корпус приказов не принимает."], ["LOG", "mutiny", "HULL {n} REFUSES ORDERS at {p}. The crew is bringing her home and will not go out again.", "КОРПУС {n} ОТКАЗЫВАЕТСЯ ОТ ПРИКАЗОВ у {p}. Экипаж ведёт его домой и больше не выйдет."], ["VOICE", "mutiny.1", "Hull {hull}. We have done the arithmetic on the bridge and it does not come out. We are loading what is on the ground at {p} and coming home. Log it as mutiny if the regulation needs a word.", "Корпус {hull}. Мы посчитали на мостике, и не сходится. Грузим то, что лежит на {p}, и идём домой. Запишите как бунт, если инструкции нужно слово."], ["VOICE", "mutiny.2", "Hull {hull}. The crew voted. I did not stop them, and I would not have won. We are not going back out to {p}. Whatever you do with the hull when we dock, do it after we have walked off.", "Корпус {hull}. Экипаж проголосовал. Я не мешал, и не выиграл бы. Обратно к {p} мы не идём. Что бы вы ни сделали с корпусом, когда причалим, — сделайте после того, как мы сойдём."], ["UI", "scrapAllMut", "Scrap all {n} refusing hulls", "Списать все отказавшиеся корпуса ({n})"], ["UI", "kitMine", "Mine works", "Карьерная техника"], ["UI", "kitFarm", "Combines", "Комбайны"], ["UI", "kitWell", "Drilling rigs", "Буровые установки"], ["UI", "kitWorks", "Plant", "Завод"], ["UI", "kitTier", "Tier", "Ярус"], ["UI", "kitNone", "no machines — hands and shovels", "техники нет — руки и лопаты"], ["UI", "kitFuel", "Burns", "Жжёт"], ["UI", "kitStarved", "No fuel on site. The machines stand; the world digs by hand.", "На месте нет топлива. Техника стоит, мир копает руками."], ["UI", "kitLost", "Lost to a full stockyard", "Потеряно — склад полон"], ["UI", "kitWaiting", "Tier {t} kit ({w}) is on the pier, waiting for the next hull on this line.", "Комплект яруса {t} ({w}) стоит на пирсе и ждёт следующего корпуса на линии."], ["UI", "kitTooBig", "Tier {t} kit weighs {w}. The biggest hold on this line is {h} — it will never fit. Put a bigger hull on the line.", "Комплект яруса {t} весит {w}. Самый большой трюм на линии — {h}: не влезет. Поставь на линию корпус побольше."], ["UI", "kitAboard", "Kit aboard hull {n}, {y} years out.", "Комплект на корпусе {n}, лететь {y} лет."], ["UI", "kitGate", "The engineering programme opens with Generation {g} yards. Until then the worlds work with what they landed with.", "Инженерная программа откроется с верфями поколения {g}. До тех пор миры работают тем, с чем сели."], ["UI", "kitMax", "Top tier. Nothing bigger fits on this world.", "Высший ярус. Больше сюда не поставить."], ["UI", "kitHint", "Pay the kit and this world's output goes ×{x} for good (it burns {f} fuel a year, the line brings it). The kit is cargo: the next hull on this line big enough to hold it carries it out and installs it — nothing else to do.", "Заплати за комплект — добыча этого мира навсегда ×{x} (жжёт {f} топлива в год, линия привезёт). Комплект — груз: его увезёт и поставит следующий корпус этой линии с достаточным трюмом, больше ничего делать не надо."], ["UI", "kitOrder", "Order tier {t} kit", "Заказать комплект яруса {t}"], ["UI", "kitWeight", "Needs a hold of {w} · biggest hull on this line holds {h}", "Нужен трюм {w} · самый большой корпус на линии — {h}"], ["UI", "a_kit", "{p} can afford a tier {t} kit: {kx} → {ky} a year, and the seam will outlast it.", "{p}: комплект яруса {t} по карману — {kx} → {ky} в год, жилы хватит."], ["UI", "a_kithold", "{p}: the tier {t} kit ({w}) is stuck on the pier — no hull on that line can carry it.", "{p}: комплект яруса {t} ({w}) застрял на пирсе — на линии нет корпуса, который его увезёт."], ["UI", "a_kitfuel", "{p}: the machines stand — no fuel on site. The line should be bringing it.", "{p}: техника стоит — на месте нет топлива. Линия должна его привозить."], ["UI", "a_lost", "{p} has thrown away {n} — the stockyard is full and the line cannot keep up.", "{p} выбросил {n} — склад полон, линия не справляется."], ["UI", "a_foodpile", "Rations for {n} years in store. Not waste: the ark eats rations by the block.", "Провизии на {n} лет вперёд. Это не мусор: ковчег ест провизию блоками."], ["MSG", "kitgate", "The engineering programme is not open yet.", "Инженерная программа ещё не открыта."], ["MSG", "tiermax", "That world is at the top tier already.", "Этот мир уже на высшем ярусе."], ["MSG", "kitpending", "A kit is already on its way there.", "Комплект туда уже идёт."], ["LOG", "kit_ordered", "Tier {t} kit for {p} laid out on the pier — {w} of hold, first hull that fits takes it.", "Комплект яруса {t} для {p} выложен на пирс — {w} трюма, заберёт первый подходящий корпус."], ["LOG", "kit_loaded", "Hull {n} takes the tier {t} kit for {p}.", "Корпус {n} взял комплект яруса {t} для {p}."], ["LOG", "kit_built", "{p}: TIER {t} MACHINES RUNNING. Output ×{x}.", "{p}: ТЕХНИКА ЯРУСА {t} ЗАПУЩЕНА. Добыча ×{x}."], ["LOG", "kit_lost", "The tier {t} kit for {p} went down with the hull.", "Комплект яруса {t} для {p} пропал вместе с корпусом."], ["LOG", "kit_starved", "{p}: no fuel. The tier {t} machines have stopped.", "{p}: топливо кончилось. Техника яруса {t} встала."], ["LOG", "kit_running", "{p}: fuel arrived. The tier {t} machines are running again.", "{p}: топливо пришло. Техника яруса {t} снова работает."], ["VOICE", "kit_built.1", "The rig is up on {p}. Forty years in a hold and every bolt is where the drawing says. It drinks. Keep the fuel coming and I will send you a number you have not seen before.", "Установка на {p} стоит. Сорок лет в трюме, и каждый болт там, где на чертеже. Она пьёт. Возите топливо — и я пришлю вам цифру, какой вы ещё не видели."], ["VOICE", "kit_built.2", "{p}, tier {t}. The children came out to watch it move. Nobody here had seen a machine bigger than a dome. Output ×{x}, and I have written that on the wall.", "{p}, ярус {t}. Дети вышли смотреть, как она едет. Никто здесь не видел машины больше купола. Добыча ×{x}, и я написал это на стене."], ["VOICE", "kit_starved.1", "{p}: the tanks are dry and the tier {t} rig is a monument. We are back on shovels. Tell the desk the line is too thin.", "{p}: баки пусты, установка яруса {t} стоит памятником. Мы снова на лопатах. Передайте пульту, что линия слишком тонкая."], ["GUIDE", "p5.b5", "A <b>kit<\/b> is ordered on the world's card and paid for in metal and parts. It is cargo: the next hull on that line with a hold big enough carries it out. Each tier multiplies what the world makes and what its stockyard holds, and burns fuel every year — the line brings that too. Tier III and IV kits do not fit in a courier.", "<b>Комплект<\/b> заказывается на карточке мира за металл и детали. Это груз: его увезёт следующий корпус этой линии с достаточно большим трюмом. Каждый ярус умножает добычу и склад мира и жжёт топливо каждый год — его тоже привозит линия. Комплекты ярусов III и IV в курьера не влезают."], ["UI", "open.c1", "EARTH, YEAR 0. The mines are empty. The soil is spent. The sea is still there, and nothing lives in it.", "ЗЕМЛЯ, ГОД 0. Рудники пусты. Почва выработана. Море на месте, и в нём ничего не живёт."], ["UI", "open.c2", "Earth burns a little more every year than the year before. Nobody argues about the number any more. They argue about the ships.", "Каждый год Земля сжигает немного больше, чем в прошлом. О цифре давно не спорят. Спорят о кораблях."], ["UI", "open.c3", "A hundred nations would race each other to the same rocks. So there is one Institute, and at its centre one desk. It answers to no government, and it never sleeps.", "Сто стран гонялись бы за одними и теми же камнями. Поэтому Институт один, и в его центре — один пульт. Он не подчиняется ни одному правительству и никогда не спит."], ["UI", "open.c4", "The desk orders hulls built. It names the worlds and sends people out to settle them. It opens the lines that carry back whatever those worlds dig, grow and pump. Nothing else on Earth does any of this.", "Пульт заказывает корпуса. Он даёт имена мирам и отправляет туда людей. Он открывает линии, которые везут назад всё, что эти миры добывают, растят и качают. Больше на Земле этого не делает никто."], ["UI", "open.c5", "A shift at the desk is eighty years. The first shift sits down today. It is you. You will not see the end of anything you begin.", "Смена за пультом — восемьдесят лет. Первая смена садится сегодня. Это ты. Ты не увидишь конца ничего из того, что начнёшь."], ["UI", "open.c6", "Keep the holds full. That is the whole job. For now.", "Держи трюмы полными. Вот и вся работа. Пока что."], ["UI", "openNext", "Next", "Дальше"], ["UI", "openSkip", "Skip", "Пропустить"], ["UI", "openBegin", "Sit down at the desk", "Сесть за пульт"], ["UI", "startOpen", "The opening again", "Вступление ещё раз"], ["UI", "shiftT", "Shift {n} hands over the desk", "Смена {n} сдаёт пульт"], ["UI", "shiftGo", "Take the desk", "Принять пульт"], ["UI", "shiftStop", "Stop at every shift", "Останавливаться на каждой смене"], ["UI", "shDelivered", "Brought home these eighty years", "Привезено домой за эти восемьдесят лет"], ["UI", "shPeople", "Hands come home", "Люди вернулись"], ["UI", "shWorlds", "Live worlds", "Живых миров"], ["UI", "shFounded", "({n} founded)", "({n} основано)"], ["UI", "shSectors", "Chart", "Карта"], ["UI", "shSectorsN", "{n} new ring(s)", "новых колец: {n}"], ["UI", "shDrive", "Drive programme", "Программа двигателя"], ["UI", "shDriveN", "{n} mark(s) earned", "отметок получено: {n}"], ["UI", "shKits", "Kits of machines delivered", "Комплектов техники доставлено"], ["UI", "shLost", "Hulls written off", "Корпусов списано"], ["UI", "shMutiny", "Mutinies", "Бунтов"], ["UI", "shHands", "Hands at home", "Людей дома"], ["UI", "shIdle", "({n} hulls idle)", "(корпусов без дела: {n})"], ["UI", "shLeft", "To the Night", "До Ночи"], ["UI", "shLeftN", "{n} years · room for {b}", "{n} лет · мест {b}"], ["UI", "kitNone.mine", "no machines — hands and shovels", "техники нет — руки и лопаты"], ["UI", "kitNone.farm", "no combines — hands and hoes", "комбайнов нет — руки и мотыги"], ["UI", "kitNone.well", "no rigs — hand pumps", "буровых нет — ручные насосы"], ["UI", "kitNone.works", "first-generation plant — no upgrades yet", "завод первого поколения — без апгрейдов"], ["UI", "a_lastbuild", "A hull built now will not sail: the shortest line open is {n} years round and {l} years are left. Crews refuse. Spend the metal on the ark.", "Корпус, построенный сейчас, не выйдет: самая короткая линия — {n} лет круг, а осталось {l}. Экипажи откажутся. Трать металл на ковчег."], ["UI", "lineT", "Planet work fleet", "Рабочий флот планеты"], ["UI", "lineOn", "line", "линия"], ["UI", "lineHint", "Say how many hulls of each class run this line. The yards build what is missing when they can pay for it, a finished hull takes the line itself, a new generation replaces the old one hull by hull, and a hull no longer wanted comes home to scrap.", "Скажи, сколько корпусов каждого класса ходят по этой линии. Верфи строят недостающее, когда есть чем платить, готовый корпус сам встаёт на линию, новое поколение меняет старое по одному, лишний корпус возвращается и идёт на разбор."], ["UI", "lineMeta", "hold {c} · {y} yrs round · {m} metal", "трюм {c} · круг {y} лет · {m} металла"], ["UI", "lineRange", "out of range for this class", "этот класс сюда не долетает"], ["UI", "lineLocked", "class not open yet", "класс ещё не открыт"], ["UI", "lineFlying", "{n} on the line", "на линии: {n}"], ["UI", "lineYard", "{n} in the yards", "на верфи: {n}"], ["UI", "lineRetiring", "{n} coming home to scrap", "{n} идёт домой на разбор"], ["UI", "lineNone", "none", "нет"], ["UI", "lineWait_metal", "yards wait: not enough metal", "верфи ждут: не хватает металла"], ["UI", "lineWait_parts", "yards wait: not enough parts", "верфи ждут: не хватает деталей"], ["UI", "lineWait_fuel", "yards wait: not enough fuel", "верфи ждут: не хватает топлива"], ["UI", "lineWait_crew", "yards wait: no crew to sign on", "верфи ждут: некому идти в экипаж"], ["UI", "lineWait_mutiny", "no crew will sign for this line so close to the Night", "ни один экипаж не подпишется на эту линию так близко к Ночи"], ["UI", "lineWait_range", "this class cannot reach the world", "этот класс сюда не долетает"], ["UI", "lineWait_locked", "class not open yet", "класс ещё не открыт"], ["UI", "lineRenewOn", "Auto- й рейс жжёт топливо."], ["UI", "tut_m3", "Time is stopped. Start it. {p} takes no orders until the settlers land.", "Время стоит. Запустите его. Пока поселенцы не сели, {p} приказов не принимает."], ["UI", "tut_m4", "They've landed. Put a hull on the line — it brings {p}'s rations home.", "Сели. Поставьте судно на линию — оно повезёт рационы {p} домой."], ["UI", "tut_m8", "No free hull at the pier. Order one here — it goes straight to this line.", "Свободных судов у причала нет. Закажите здесь — судно сразу пойдёт на эту линию."], ["UI", "tut_mM", "Hulls are built from metal. {p} mines it.", "Суда строят из металла. Его добывает {p}."], ["UI", "tut_m9", "Being built — here, and all of it in the YARD.", "Что строится — здесь, а всё целиком — во вкладке ВЕРФЬ."], ["UI", "tut_m10", "Every hull and where it is. A hull you move changes lines when it docks.", "Все суда и где они. Переведённое судно меняет линию, когда причалит."], ["UI", "tut_m11", "{p} gives {m} a year, its line carries {c}. The rest waits on the surface — another hull carries more.", "{p} даёт {m} в год, линия увозит {c}. Остальное ждёт на поверхности — ещё одно судно увезёт больше."], ["UI", "tut_m12", "Parts are home. Works make them from metal and rations — without rations they stop.", "Детали дома. Заводы делают их из металла и рационов — без рационов встают."], ["UI", "tut_m14", "Each hull generation reaches one ring farther. The next needs settled worlds and parts from a works.", "Каждое поколение судов летит на кольцо дальше. Следующему нужны заселённые миры и детали с завода."], ["UI", "tut_m15", "When a world needs you, it shows here, worst first. The button takes you straight to the fix.", "Когда миру нужно ваше решение, он здесь, худшее сверху. Кнопка ведёт прямо к делу."], ["UI", "tut_m17", "Space shifts by sector. What is on, and for how long — in this bar.", "Пространство меняется по долям. Что идёт и сколько ещё — на этой полосе."], ["UI", "tut_m16", "Ring 2 is charted. Generation I couriers reach it; each generation flies one ring farther.", "Кольцо 2 нанесено. Курьеры I поколения туда долетают; каждое поколение летит на кольцо дальше."], ["UI", "tut_m18", "The year of the Night stays up here. Big news stops time and comes one window at a time.", "Год Ночи — здесь, наверху. Большие новости останавливают время и приходят по одному окну."], ["UI", "tut_m19", "The ark leaves on the Night with whoever is aboard. It needs paid levels and a convoy: generation {g} or newer, at the pier that day.", "Ковчег уходит в Ночь с теми, кто на борту. Нужны оплаченные уровни и конвой — суда {g} поколения и новее у причала в тот день."], ["UI", "tut_m7", "Time stops while this tab is open.", "Пока открыта эта вкладка, время стоит."], ["UI", "tut_m13", "Machines make a world give more. They burn its fuel and ride out on the line's next hull.", "Техника поднимает выработку мира. Жжёт его топливо и уходит со следующим судном линии."], ["UI", "tut_m20", "Hold hulls for the convoy with RESERVE FOR ARK in the Yard.", "Суда для конвоя придерживайте кнопкой «В резерв ковчега» во вкладке ВЕРФЬ."], ["UI", "tut_m21", "Last lift: the year a courier must leave to bring everyone home before the Night.", "Последний рейс: год, когда курьер должен вылететь, чтобы привезти всех домой до Ночи."], ["UI", "tut_m22", "The seam is dead. Only evacuation is left — a courier takes everyone.", "Жила мертва. Осталась только эвакуация — курьер забирает всех."], ["UI", "tut_m24", "A hull is overdue. If it is lost, nothing replaces it — you order the next one.", "Судно опаздывает. Если пропадёт, замены не будет — следующее заказываете вы."], ["UI", "tut_m23", "Near the end, crews refuse runs. A hull that refused still sails with the convoy.", "Под конец экипажи отказываются от рейсов. Отказавшее судно в конвой всё равно идёт."], ["UI", "nar_N01_1", "Earth is worked out: no ore, dead soil, poisoned seas.", "Земля выработана: руды нет, почва мертва, моря отравлены."], ["UI", "nar_N01_2", "The nation е. За краем карты стало темнее — или мне кажется."], ["UI", "nar_N09_1", "The physicists have named the date: in {year} our galaxy collapses.", "Физики назвали дату: в {year} наша галактика схлопнется."], ["UI", "nar_N09_2", "The Institute's task changes: build an ark and take people to another galaxy.", "Задача Института меняется: построить ковчег и увести людей в другую галактику."], ["UI", "nar_N09_3", "Until then Earth must live: whoever starves will not fly.", "До отлёта Земля должна жить: кто умрёт от голода, не полетит."], ["UI", "nar_N10_1", "{world}: the last lift has left. {n} people will stay.", "{world}: последний рейс ушёл. {n} человек останутся."], ["UI", "nar_N10_2", "The Institute doesn't count them. I'll remember their names.", "Институт их не считает. Я запомню их имена."], ["UI", "nar_N11", "The crew of {ship} refused the run. People are afraid and want a place on the ark.", "Экипаж судна {ship} отказался от рейса. Люди боятся и хотят на ковчег."], ["UI", "nar_N12a", "Four hundred years. People start counting.", "Четыреста лет. Люди начинают считать."], ["UI", "nar_N12b", "One hundred years. Earth queues for the ark — the line is longer than the berths.", "Сто лет. На Земле очередь на ковчег — длиннее, чем мест."], ["UI", "nar_N12c", "Twenty-five years. The ark is packed, and people keep coming.", "Двадцать пять лет. Ковчег забит под завязку, а люди всё идут."], ["UI", "nar_N13a", "The ark has sailed with {n} aboard. The rest stay behind, without honours or names.", "Ковчег ушёл. На борту {n} человек. Остальные остались без почестей и имён."], ["UI", "nar_N13a_a", "Except the ones I remember.", "Кроме тех, что помню я."], ["UI", "nar_N13b", "The ark did not sail: {reason}.", "Ковчег не ушёл: {reason}."], ["UI", "nar_N13b_a", "Was it the Institute's mistake? Or did people not want to be saved?", "Это просчёт Института? Или люди не хотели спасаться?"], ["UI", "nar_N13c", "Earth did not live to see the Night: hunger came first.", "Земля не дожила до Ночи: голод пришёл раньше."], ["UI", "nar_N13c_a", "We rushed so hard toward the ark that we forgot to feed the ones meant to fly.", "Мы так спешили к ковчегу, что забыли накормить тех, кто должен был на нём лететь."], ["UI", "nar_rsConvoy", "the convoy of generation {g} is short of {s}", "конвою поколения {g} не хватает: {s}"], ["UI", "nar_rsDrive", "the generation {g} ark drive is not ready", "двигатель ковчега поколения {g} не готов"], ["UI", "nar_rsLevel", "not one ark level was paid", "ни один уровень ковчега не оплачен"], ["UI", "nar_aboard", "Aboard", "На борту"], ["UI", "nar_N13d", "The rations ran out. Earth fell silent before the work was done.", "Рационы кончились. Земля замолчала, не дождавшись конца работы."], ["UI", "nar_N13d_a", "I will remember this shift. To wait, Earth has to eat.", "Эту смену я запомню. Чтобы ждать, Земле нужно есть."], ["UI", "u_lineAdds", "+{n}/yr on this line", "+{n}/год на этой линии"], ["UI", "u_aFixFree", "{h} stands idle at Earth: +{a} a year, the line is {g} short", "{h} стоит у Земли без дела: +{a} в год, линии не хватает {g}"], ["UI", "u_aFixMove", "{h} runs half empty on {p}: +{a} a year here, the line is {g} short", "{h} ходит полупустым на {p}: здесь +{a} в год, линии не хватает {g}"], ["UI", "u_aFixBuild", "Order a {h}: +{a} a year, the line is {g} short", "Закажите {h}: +{a} в год, линии не хватает {g}"], ["UI", "u_aSpare", "{w}: the line can carry {c} {r} a year, it needs {m}", "{w}: линия может увезти {c} ({r}) в год, нужно {m}"], ["UI", "u_aSpareC", "{h} runs half empty — move her where a line falls behind, or take her off", "{h} ходит полупустым — переведите туда, где линия не справляется, или снимите"], ["UI", "u_aSpareN", "{n} hulls too many. First: {h} — move her, or take her off", "Лишних судов: {n}. Первое — {h}: переведите или снимите"], ["UI", "u_fixHull", "Show the hull", "Показать судно"]]</script>
<script>
/* LONG NIGHT — core simulation. No DOM. Pure state + pure-ish mutators. */

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- the chart builds itself ----------
   Sectors are generated on demand and never run out. Each one sits further
   out, digs richer and kills more often than the last. Sector 0 is gentle
   on purpose: it is where the player learns the loop. */
var SECTORS=[];
var PLANETS=[];
/* v4.21 (F-21): the chart is cut into six lobes of 60 degrees, the sides of the world. Lobe 0 is centred on twelve o'clock; ang grows clockwise on screen. */
var LOBES=6, LOBE_ARC=Math.PI*2/6;
function lobeOf(ang){ var a=((ang+LOBE_ARC*2)%(Math.PI*2)+Math.PI*2)%(Math.PI*2); return Math.floor(a/LOBE_ARC)%LOBES }
function lobeEdge(i){ return -LOBE_ARC*2+i*LOBE_ARC }
function lobeMid(i){ return -Math.PI/2+i*LOBE_ARC }

/* v4.21 (Nikita, 06.10): rings carry a number and the name of an Italian figure — generals, artists, politicians, Romans. The pool is long;
   past its end the names come round again with a numeral, so the chart never runs out. */
var RING_NAMES=['Caesar', 'Augustus', 'Scipio', 'Cicero', 'Cato', 'Brutus', 'Sulla', 'Marius', 'Pompey', 'Agrippa', 'Trajan', 'Hadrian', 'Vespasian', 'Constantine', 'Seneca', 'Virgil', 'Ovid', 'Horace', 'Livy', 'Tacitus', 'Pliny', 'Aurelius', 'Gracchus', 'Cincinnatus', 'Fabius', 'Camillus', 'Crassus', 'Lepidus', 'Tiberius', 'Claudius', 'Dante', 'Petrarch', 'Boccaccio', 'Giotto', 'Leonardo', 'Michelangelo', 'Raphael', 'Botticelli', 'Titian', 'Donatello', 'Brunelleschi', 'Caravaggio', 'Bernini', 'Tintoretto', 'Veronese', 'Canaletto', 'Machiavelli', 'Medici', 'Borgia', 'Sforza', 'Galileo', 'Columbus', 'Vespucci', 'Polo', 'Garibaldi', 'Cavour', 'Mazzini', 'Crispi', 'Giolitti', 'Gasperi', 'Verdi', 'Vivaldi', 'Puccini', 'Rossini', 'Paganini', 'Monteverdi', 'Fermi', 'Marconi', 'Volta', 'Galvani', 'Colleoni', 'Gattamelata', 'Montefeltro', 'Malatesta', 'Doria', 'Cadorna', 'Savoy', 'Mantegna', 'Bellini', 'Giorgione', 'Masaccio', 'Cimabue', 'Correggio', 'Parmigianino', 'Tiepolo', 'Modigliani', 'Canova', 'Cellini', 'Gramsci', 'Moro', 'Berlinguer', 'Alberti', 'Palladio', 'Bramante', 'Vasari', 'Cabot', 'Torricelli', 'Cassini', 'Cesalpino', 'Ariosto', 'Tasso', 'Goldoni', 'Manzoni', 'Leopardi', 'Carducci', 'Pirandello', 'Fellini'];
var W_NAMES=['Tallow','Brine','Cinder','Marrow','Solace','Vesper','Gallows','Ferrous','Hollow','Threnody','Kiln','Lantern',
 'Tinder','Ossuary','Harrow','Wick','Pale','Grist','Anvil','Vigil','Loam','Sallow','Cairn','Ember',
 'Mire','Tallowfen','Rook','Quarrel','Dross','Scupper','Bracken','Gannet','Sump','Fallow','Reave','Clinker',
 'Winnow','Barrow','Skein','Tarn','Flense','Culvert','Nettle','Scrim','Lees','Chaff','Coom','Slake'];
var DESIGS=['LV','HD','NR','KX','QT','ZD','BC','GR','TS','WN','PX','MV','AR','EL','SH','UM'];

function secName(i){ var n=RING_NAMES.length, cyc=Math.floor(i/n), nm=RING_NAMES[i%n].toUpperCase(); return (i+1)+' · '+nm+(cyc?' '+(['','II','III','IV','V','VI','VII','VIII','IX','X'][cyc]||(cyc+1)):'') }
function secRadius(i){ return 170+i*88 }

/* every sector gets one of each trade, so the player is never starved of fuel
   the way the hand-built chart starved them (one well in twelve worlds). */
function genSector(rnd, i){
  var kinds = ['mine','mine','farm','well','works'];
  if(rnd()<0.62) kinds.push(rnd()<0.62?'mine':'farm');
  var inner = 16+i*46, outer = 46+i*62;
  var worlds=[], used=[];
  for(var j=0;j<kinds.length;j++){
    var t=(j+rnd()*0.7)/kinds.length;
    var ang=(t*Math.PI*2+rnd()*0.4)%(Math.PI*2);
    var dist=Math.round(inner+(outer-inner)*(0.25+rnd()*0.75));
    var kind=kinds[j];
    var rich = (0.75+i*0.62)*(0.80+rnd()*0.55);
    var hab  = kind==='farm' ? 0.65+rnd()*0.32 : (kind==='works'? 0.12+rnd()*0.22 : 0.18+rnd()*0.45);
    var haz  = Math.min(0.42, 0.04+i*0.031+rnd()*0.07);
    worlds.push({sec:i, dist:dist, kind:kind, rich:+rich.toFixed(2),
                 hab:+hab.toFixed(2), haz:+haz.toFixed(2), ang:+ang.toFixed(3),
                 dep: kind==='mine'?'metal':(kind==='farm'?'food':(kind==='well'?'fuel':'parts'))});
  }
  worlds.sort(function(a,b){return a.dist-b.dist});
  return worlds;
}

/* Appends one more sector to the chart. Called at world-gen and on every survey. */
function openSector(G){
  var i=SECTORS.length;
  var rnd=mulberry32((G.seed^0x9E3779B9)+i*7919);
  SECTORS.push({name:secName(i), r:secRadius(i)});
  var ws=genSector(rnd,i);
  for(var j=0;j<ws.length;j++){
    var w=ws[j], n=PLANETS.length;
    w.id='w'+n;
    w.name=W_NAMES[n%W_NAMES.length]+(n>=W_NAMES.length?' '+(Math.floor(n/W_NAMES.length)+1):'');
    w.desig=DESIGS[(n*5+i)%DESIGS.length]+'-'+(1+(n*7)%97);
    PLANETS.push(w);
    if(G.reserves) G.reserves[w.id]= w.kind==='works' ? Infinity
      : Math.round(w.rich*K.RESERVE_BASE*Math.pow(K.RESERVE_GROW,i)*(w.kind==='farm'?1.5:1));
  }
  G.sectors=SECTORS.length;
  return i;
}

/* what it costs to push the chart one sector further out */
function surveyCost(n){
  return { metal: Math.round(140*Math.pow(1.40,n)),
           food:  Math.round(400*Math.pow(1.52,n)),
           fuel:  Math.round(210*Math.pow(1.48,n)),
           parts: Math.round(40*Math.pow(1.50,n)),   // v3.2: parts were the one gate on every survey
           people: Math.round(K.SURVEY_PEOPLE*Math.pow(K.SURVEY_PEOPLE_GROW,n)) };
}
/* v3.2: the chart is no longer bounded by what the fleet can reach. You may
   chart a sector you cannot yet fly to — seeing the prize before you can take
   it is the pressure the drive programme is supposed to relieve. */
function canSurvey(G){
  var n=SECTORS.length, c=surveyCost(n), E=G.earth;
  if(settledCount(G)<K.SURVEY_REACH*n) return 'settled';
  if(E.metal<c.metal) return 'metal';
  if(E.food<c.food) return 'food';
  if(E.fuel<c.fuel) return 'fuel';
  if(E.parts<c.parts) return 'parts';
  if(E.people-K.EARTH_KEEP<c.people) return 'people';
  return 'ok';
}
function survey(G){
  var chk=canSurvey(G); if(chk!=='ok') return chk;
  var c=surveyCost(SECTORS.length);
  G.earth.metal-=c.metal; G.earth.food-=c.food; G.earth.fuel-=c.fuel; G.earth.parts-=c.parts; openPaid(G,c);
  G.earth.people-=c.people;                       // the survey party stays out there
  G.ledger.metalSurvey=(G.ledger.metalSurvey||0)+c.metal;
  G.ledger.peopleSurvey=(G.ledger.peopleSurvey||0)+c.people;
  var i=openSector(G);
  G.pauseNow=true;
  log(G,'surveyed',{s:secName(i)});
  if(i===5) log(G,'old_night',{});
  return 'ok';
}

/* ---------- hull generations ----------
   Three hulls per generation: small/fast/cheap, middle, big/slow/dear. Each
   generation costs about x5 the last, carries x2.6, and is the ONLY way to
   reach the sectors beyond the previous generation's range. Old hulls keep
   flying where they always flew, but the yards stop building them — that is
   the OpenTTD rule, and it is what makes the game feel like it has eras. */
/* v4.5 (Nikita, 26.09, run 768210301: 'курьеры 5–6 поколений имбовые, тягачи и грузовозы бессмысленны'):
   every class used to grow its hold ×2.4 a generation, so a Generation V courier was a Generation II hauler
   with a courier's speed. Now the classes grow apart — grow: hold per generation; burn: fuel per departure
   relative to a courier (a freighter drinks more per trip, far less per ton). */
var HULL_BASE=[
  {key:'courier',  cap:70,  speed:1.70, metal:40,  fuel:14,  parts:0,  days:7,  reach:0, crew:8,  grow:1.9, burn:1.0},
  {key:'hauler',   cap:240, speed:1.05, metal:130, fuel:45,  parts:26, days:13, reach:3, crew:20, grow:2.4, burn:1.6},
  {key:'freighter',cap:760, speed:0.80, metal:320, fuel:120, parts:85, days:21, reach:6, crew:45, grow:2.8, burn:2.2}
];
var HULLS=[];
function genHull(gen,j){
  var b=HULL_BASE[j], g=gen;
  return {id:HULLS.length, key:b.key, gen:g,
    cap:Math.round(b.cap*Math.pow(b.grow||K.GEN_CAP,g)),   // v4.5: per class
    burn:b.burn||1,
    speed:+(b.speed*Math.pow(K.GEN_SPEED,g)).toFixed(2),
    metal:Math.round(b.metal*Math.pow(K.GEN_COST,g)),
    fuel:Math.round(b.fuel*Math.pow(K.GEN_FUEL,g)),
    parts:Math.round((b.parts||(g?12:0))*Math.pow(K.GEN_PARTS,g)),
    crew:Math.round(b.crew*Math.pow(K.GEN_CREW,g)),
    days:b.days+g*4, reach:g?0:b.reach};
}
function ensureGen(gen){ while(HULLS.length<(gen+1)*3){ var g=Math.floor(HULLS.length/3); for(var j=0;j<3;j++) HULLS.push(genHull(g,j)); } }
/* ---------- range ----------
   v3.2 (Nikita, 22.09): range used to depend on generation alone, with a step of
   +3 sectors per mark. Drive marks arrive faster than the chart grows — mark II
   landed on day 350 of his run with two sectors on the board — so the limit was
   never once reached in 1843 days. It was dead code, and with it the courier was
   strictly the best hull per metal (968 hold / 1310 metal against the hauler's
   3318 / 4260), so 28 of his 36 hulls were couriers.
   Now the CLASS carries the range and the generation shifts it: a small fast
   courier is a short-legged hull, a freighter is the one with the tankage.
   The frontier belongs to the big hulls; the inner rings are courier work. */
var CLASS_RANGE={courier:1, hauler:2, freighter:3};
function classRange(key,gen){ return (CLASS_RANGE[key]||1)+gen }
function hullRange(h){ return h? classRange(h.key,h.gen||0) : 0 }
/* the furthest sector ANY hull of this generation can fly to (the freighter) */
function sectorLimit(gen){ return classRange('freighter',gen) }
function hullGen(s){ return (HULLS[s.hull]&&HULLS[s.hull].gen)||0 }
function shipRange(s){ return hullRange(HULLS[s.hull]) }
function canReachSector(s,sec){ return sec<=shipRange(s) }
/* cheapest class that can serve a sector at this generation; null = nothing can */
function classFor(sec,gen){
  var order=['courier','hauler','freighter'];
  for(var i=0;i<order.length;i++) if(classRange(order[i],gen)>=sec) return order[i];

  return {day:G.day, people:Math.round(E.people), metal:Math.round(E.metal), food:Math.round(E.food),
    fuel:Math.round(E.fuel), parts:Math.round(E.parts), needF:+(G.need?G.need.food:0).toFixed(1),
    needM:+(G.need?G.need.metal:0).toFixed(1), cols:cols, pop:Math.round(pop), dry:dry,
    ships:fleet.length, idle:idle, crew:crewOut(G), out:+earthOutput(G).toFixed(2), hands:+handsRate(G).toFixed(2), attrition:G.stats.attrition||0,
    night:G.night||0, berths:arkSouls(G), arkLv:arkLevel(G), arkMark:G.arkMark, pace:+(G.partsRate||0).toFixed(2),
    arkY:(G.night&&!arkReady(G))?(function(f){return f.st==='ok'?f.y:f.st})(driveForecast(G,G.arkMark)):null,
    sectors:SECTORS.length, drive:G.driveLvl||0, reach:reach(G), settled:settledCount(G),
    hungry:!!G.hungry, famine:G.famine||0};
}
/* v4.4 (Nikita, 25.09): the run log is JSON — the designer reads it with a script, not with his eyes */
function exportLog(G){

function exportLogText(G){
