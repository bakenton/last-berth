function planet(id){for(var i=0;i<PLANETS.length;i++)if(PLANETS[i].id===id)return PLANETS[i];return null}

/* how many people a world can hold, and how many it wants before it digs at full rate */
function popCap(p){ return Math.round(K.POP_BASE+K.POP_HAB*p.hab) }
function popWant(p){ return popCap(p) }
/* ---------- v4.4: extraction kits ---------- */
function kitTier(c){ return (c&&c.tier)||0 }
function kitLive(c){ return kitTier(c)>0 && !(c.fuelOut>=K.KIT_GRACE) }          // machines standing = no multiplier
function rateMult(c){ return kitLive(c)? Math.pow(K.KIT_OUT,kitTier(c)) : 1 }
/* v4.5 (Nikita, 26.09: 'не хочу, чтобы ресурсы сгорали'): a world's stockyard has no ceiling. What the
   line does not carry waits; the pace of the world is its tier, not its yard. */
function storeCap(c){ return Infinity }
function kitBurn(c){ return K.KIT_FUEL*kitTier(c) }
function kitCost(c){ var t=kitTier(c)+1, m=Math.round(K.KIT_METAL*Math.pow(K.KIT_GROW,t-1)), p=Math.round(K.KIT_PARTS*Math.pow(K.KIT_GROW,t-1));
  return {tier:t, metal:m, parts:p, w:m+p} }
function kitOpen(G){ return (G.driveLvl||0)>=K.KIT_GATE_DRIVE }
/* the biggest hold on this world's line; 0 if nothing runs there */
function lineHold(G,pid){ var best=0; for(var i=0;i<G.ships.length;i++){ var s=G.ships[i]; if(s.mode==='dead'||s.mode==='missing') continue;
  if((s.from===pid&&s.to==='earth')||(s.to===pid&&s.from==='earth')) best=Math.max(best,s.cap) } return best }
function canKit(G,pid){
  var c=G.colonies[pid]; if(!c) return 'nocolony';
  if(c.dark) return 'dark';
  if(!kitOpen(G)) return 'kitgate';
  if(kitTier(c)>=K.KIT_MAX) return 'tiermax';
  if(c.kit||c.kitShip) return 'kitpending';
  var k=kitCost(c);
  if(G.earth.metal<k.metal) return 'metal';
  if(G.earth.parts<k.parts) return 'parts';
  return 'ok';
}
function orderKit(G,pid){
  var r=canKit(G,pid); if(r!=='ok') return r;
  var c=G.colonies[pid], k=kitCost(c);
  G.earth.metal-=k.metal; G.earth.parts-=k.parts; G.ledger.metalYards+=k.metal;
  c.kit={tier:k.tier,metal:k.metal,parts:k.parts,w:k.w,day:G.day};
  log(G,'kit_ordered',{p:pid,t:k.tier,w:k.w});
  return 'ok';
}
/* what a world burns per year that Earth has to send it: works eat metal and rations, kits eat fuel */
function feedRates(G,node){
  var c=G.colonies[node], p=planet(node), r={}; if(!c||!p) return r;
  if(p.kind==='works'){ var want=c.pop*p.rich*K.REFINE*rateMult(c); r.metal=want*K.REFINE_METAL; r.food=want*K.REFINE_FOOD }
  if(kitTier(c)>0) r.fuel=kitBurn(c);
  return r;
}
/* Earth's own output rides on the people left at home — but only so far.
   Past about 170 hands the extra mouths cost more than the extra work,
   which is the pressure that keeps the player settling worlds forever. */
function fedMult(G){ var nd=G.need||earthNeed(G); var yrs=G.earth.food/Math.max(0.1,nd.food||1); return Math.max(K.FED_MIN,Math.min(K.FED_MAX,K.FED_MIN+yrs/K.FED_YEARS)) }   // v4.10: a fed Earth raises more
function handsRate(G){ return K.EARTH_PEOPLE/(1+G.day/K.HANDS_HALF)*fedMult(G) }   // v4.7: Earth empties
function earthOutput(G){
  var h=Math.max(0,G.earth.people-K.EARTH_CREW);
  return 1 + K.OUT_MAX*(1-Math.exp(-h/K.OUT_K));
}
/* hands currently riding hulls rather than working at home */
function crewOut(G){ var n=0; for(var i=0;i<G.ships.length;i++){ var s=G.ships[i]; if(s.mode!=='dead') n+=(s.crew||0) } return n }
/* v3.9.1 (log 519788167: 1562 hands sat on hulls idle at Earth and were counted as left behind): a crew
   whose hull is docked at Earth is standing on the pier. Only hulls away from Earth keep their crews out. */
function crewAway(G){ var n=0; for(var i=0;i<G.ships.length;i++){ var s=G.ships[i]; if(s.mode==='dead') continue; if(s.mode==='idle'&&s.at==='earth') continue; n+=(s.crew||0) } return n }
function crewDocked(G){ return crewOut(G)-crewAway(G) }
/* G.earth.people is the pool of hands Earth can still put on a ship, not the
   billions living there — so it must NOT drive Earth's appetite, or feeding the
   home world well makes it hungrier and every good run eats itself.
   Appetite rises with the calendar alone, faster than linear, so a chart that
   stops growing eventually starves however rich it got. */
function earthNeed(G){
  var d=G.day;
  var age=1 + d/K.APPETITE + (d/K.DECAY_KNEE)*(d/K.DECAY_KNEE);
  return { food:K.EARTH_EAT*age, metal:K.EARTH_BURN*age };
}
/* v4.20: what Earth takes a year while a crisis runs — at least the doubled burn, and PULSE_SHARE of what the empire
   has been bringing home of that resource, so the crisis grows with the empire (a fixed number is nothing to a big one) */
function pulseDrain(G,res){
  var nd=earthNeed(G), base= res==='food'?nd.food : res==='metal'?nd.metal : nd.metal*(res==='fuel'?0.5:0.25);
  return Math.max(base*(K.PULSE_MULT-1), K.PULSE_SHARE*((G.inRate&&G.inRate[res])||0));
}
/* v4.20: the schedule of Earth's crises — warn, then run, then a gap */
function pulseStep(G){
  var P=G.pulse; if(!P) P=G.pulse={next:K.PULSE_FIRST,warn:null,active:null,n:0};
  var R=G.rnd;
  if(!P.warn&&!P.active&&G.day>=P.next-K.PULSE_WARN&&!(G.night&&G.night-G.day<K.NIGHT_NEAR+K.PULSE_LEN+K.PULSE_WARN)){
    var opts=['food','metal'];
    if(Object.keys(G.colonies).some(function(k){ return !G.colonies[k].dark&&planet(k).kind==='well'&&G.reserves[k]>0 })) opts.push('fuel');
    if((G.partsRate||0)>0.05) opts.push('parts');
    var res=opts[Math.floor(R()*opts.length)];
    P.warn={res:res,start:Math.max(G.day+1,P.next),end:Math.max(G.day+1,P.next)+K.PULSE_LEN};
    G.pauseNow=true; log(G,'pulse_warn',{dep:res,y:P.warn.start,n:K.PULSE_LEN,l:P.warn.start-G.day});
  }
  if(P.warn&&G.day>=P.warn.start){ P.active=P.warn; P.warn=null; G.pauseNow=true; log(G,'pulse_start',{dep:P.active.res,n:P.active.end-G.day}) }
  if(P.active&&G.day>=P.active.end){
    log(G,'pulse_end',{dep:P.active.res}); P.active=null; P.n++; G.pulseShort=false;
    P.next=G.day+K.PULSE_GAP_MIN+Math.floor(R()*(K.PULSE_GAP_MAX-K.PULSE_GAP_MIN+1));
  }
}
/* crossings and signal lag both shrink with every drive mark earned */
function driveSpeed(G){ return 1+ (G.driveLvl||0)*(K.DRIVE_STEP-1) }
function driveWorkFor(G){ return Math.round(K.DRIVE_WORK*Math.pow(K.DRIVE_WORK_GROW,G.driveLvl||0)) }
function driveReachFor(G){ return K.DRIVE_REACH+K.DRIVE_REACH_GROW*(G.driveLvl||0) }

function newGame(seed){
  seed = seed||((Math.random()*1e9)|0);
  var G={
    seed:seed, rnd:mulberry32(seed), day:0, over:null,
    earth:{metal:430, food:230, fuel:240, parts:0, people:128, lost:0, lostCrew:0,
           pMetal:K.EARTH_METAL, pFood:K.EARTH_FOOD, pFuel:K.EARTH_FUEL},
    colonies:{}, ships:[], orders:[], log:[], nextShip:1, nextMissing:1, lines:{},   // v4.6: standing orders per world
    driveLvl:0, gen:0, drive:null, driveWork:0, sectors:0, dismissed:{}, actions:[], ghost:{}, settled:{},
    night:null, nightSeen:false, ark:{blocks:0,berths:0}, souls:0, arkMark:null, partsRate:0, boarded:0, grounded:false,
    pauseNow:false, ledger:{metalOut:0,metalYards:0,metalIn:0,metalSurvey:0}, reserves:{}, delivered:{metal:0,food:0,fuel:0,parts:0,people:0},
    stats:{founded:0,lost:0,revolts:0,recovered:0,peak:0,mutinies:0}
  };
  SECTORS.length=0; PLANETS.length=0; HULLS.length=0; ensureGen(0);
  openSector(G); openSector(G);              // two sectors to start; the rest are surveyed
  G.earth.people-=HULLS[0].crew*2;             // the two hulls you start with are already manned
  for(var i=0;i<2;i++){G.ships.push({id:G.nextShip++,hull:0,cap:HULLS[0].cap,crew:HULLS[0].crew,mode:'idle',t:0,at:'earth',
    target:null,route:null,auto:true, cargo:{metal:0,food:0,fuel:0,parts:0,people:0},out:{metal:0,food:0,parts:0,people:0}, take:{metal:0,food:0,fuel:0,parts:0},missDays:0,bearing:null,job:null});}
  return G;
}

/* reach = live settlements. The relay used to add +2; it is gone (Nikita, 23.09: orders no longer carry anything, so halving lag bought nothing). */
function reach(G){var r=0;for(var k in G.colonies){var c=G.colonies[k];if(c.dark)continue;r+=1}return r}
/* v4.15 (Nikita, 04.10): the gates on PROGRESS — charting a sector, each drive mark — count worlds EVER settled, not worlds held.
   reach() only falls (seams run dry, the colony is evacuated, a ghost cannot be resettled), so a gate on it closes for good:
   in the v4.14 log (seed 966268745) charting needed 6 live colonies, the run peaked at 6 and never stood there again.
   Hull classes keep reach(). A set, not stats.founded: that counts every founding, so a resettled world would count twice. */
function settledCount(G){ var seen=G.settled||{}, n=0, k; for(k in seen) n++; for(k in G.colonies) if(!seen[k]) n++; return n }
function sectorOpen(G,s){return s<SECTORS.length}
function travelDays(G,dist,ship){
  var sp=(ship&&HULLS[ship.hull]&&HULLS[ship.hull].speed)||1;
  return Math.max(1,Math.round(dist/(sp*driveSpeed(G))));
}
function legDays(G,a,b,ship){ return travelDays(G,legDist(a,b),ship) }
function legDist(a,b){
  if(a===b) return 0;
  if(a==='earth') return planet(b).dist;
  if(b==='earth') return planet(a).dist;
  var pa=planet(a), pb=planet(b);
  var ax=Math.cos(pa.ang)*pa.dist, ay=Math.sin(pa.ang)*pa.dist;
  var bx=Math.cos(pb.ang)*pb.dist, by=Math.sin(pb.ang)*pb.dist;
  return Math.max(6, Math.round(Math.sqrt((ax-bx)*(ax-bx)+(ay-by)*(ay-by))));
}
function lagDays(G,pid){
  var p=planet(pid), base=p.dist*K.LAG_K;
  var c=G.colonies[pid];
  base/=driveSpeed(G);
  return Math.max(1,Math.round(base));
}

function needsOf(G,node){
  if(node==='earth') return null;
  var p=planet(node), c=G.colonies[node], out=[];
  if(p.kind==='works') out.push('metal','food');
  if(c&&kitTier(c)>0) out.push('fuel');               // v4.4: machines run on fuel
  return out.length?out:null;
}
function exportsOf(G,node){
  if(node==='earth') return ['metal','food'];
  return [planet(node).dep];
}
function loadAt(G,s,node){
  s.cargo={metal:0,food:0,fuel:0,parts:0,people:0};   // v4.4: cargo.kit rides alongside
  var other = node===s.from ? s.to : s.from;
  var wants = needsOf(G,other);
  var room=s.cap;
  if(node==='earth'){
    var cc0=other!=='earth'&&G.colonies[other];
    /* v4.4: the kit rides out first, and only if the whole thing fits */
    if(cc0&&cc0.kit&&!cc0.dark&&room>=cc0.kit.w){ s.cargo.kit=cc0.kit; room-=cc0.kit.w; cc0.kitShip=s.id; cc0.kit=null; log(G,'kit_loaded',{p:other,n:s.id,t:s.cargo.kit.tier}) }
    if(wants&&cc0){
      /* v4.4 (Nikita, run 381774366: works stockyards full of metal that nobody burns): the hold carries what
         the far end will burn until the next hull calls, times FEED_BUFFER, minus what is already there.
         Before this the metal share was a fixed 37.5% of the hold regardless of need (v3.9.1). */
      var rates=feedRates(G,other), nd=G.need||earthNeed(G);
      var hulls=0, rt=Math.max(1,legDays(G,other,'earth',s)*2);
      for(var q=0;q<G.ships.length;q++){ var o=G.ships[q]; if(o.mode==='dead'||o.mode==='missing') continue; if((o.from===other&&o.to==='earth')||(o.to===other&&o.from==='earth')) hulls++ }
      var interval=rt/Math.max(1,hulls);
      for(var i=0;i<wants.length;i++){ var kk=wants[i];
        var need=Math.ceil(Math.max(0,(rates[kk]||0)*interval*K.FEED_BUFFER-(cc0.store[kk]||0)));

function unload(G,s,node){

/* chronicle lines never roll off the cap: the log forgets traffic, not history */
var CHRON={shift:1,first_landfall:1,epitaph:1,old_night:1,ark_sailed:1,desk_silent:1,night_dated:1,ark_drive:1,ark_grounded:1,ark_woke:1,doomsday:1};

  if(G.log.length>400){ for(var i=0;i<G.log.length;i++){ if(!CHRON[G.log[i].code]){ G.log.splice(i,1); break } } }}

function act(G,kind,d,res){ G.actions.push({day:G.day,k:kind,d:d||{},r:res||'ok'}) }

  var fleet=G.ships.filter(function(s){return s.mode!=='dead'});
  var idle=fleet.filter(function(s){return s.mode==='idle'&&s.at==='earth'&&!(s.from&&s.to)}).length;
  return {day:G.day, people:Math.round(E.people), metal:Math.round(E.metal), food:Math.round(E.food),
    fuel:Math.round(E.fuel), parts:Math.round(E.parts), needF:+(G.need?G.need.food:0).toFixed(1),
    needM:+(G.need?G.need.metal:0).toFixed(1), cols:cols, pop:Math.round(pop), dry:dry,
    ships:fleet.length, idle:idle, crew:crewOut(G), out:+earthOutput(G).toFixed(2), hands:+handsRate(G).toFixed(2), attrition:G.stats.attrition||0,
    night:G.night||0, berths:G.ark.berths, arkMark:G.arkMark, pace:+(G.partsRate||0).toFixed(2),
    arkY:(G.night&&!arkReady(G))?(function(f){return f.st==='ok'?f.y:f.st})(driveForecast(G,G.arkMark)):null,

/* v4.4 (Nikita, 25.09): the run log is JSON — the designer reads it with a script, not with his eyes */

function buildShip(G,hullId){
  var h=HULLS[hullId]; if(!h) return 'locked';

  if(G.earth.people-K.EARTH_KEEP<(h.crew||0)) return 'crew';

  G.earth.people-=(h.crew||0);                     // she signs on for the life of the hull
  G.ledger.metalYards+=h.metal;
  var s={id:G.nextShip++, hull:hullId, cap:h.cap, gen:h.gen, crew:(h.crew||0), mode:'building', t:h.days, at:'earth',

  G.ships.push(s); log(G,'ship_ordered',{n:s.id});

}

/* scrapping: an idle hull at Earth comes apart for part of what it cost.
   Old generations pile up (Nikita hit 21 idle couriers by day 600) and
   need a way out that is not "let them rot in the list". */
function scrapValue(h){ return {metal:Math.round(h.metal*K.SCRAP_METAL), parts:Math.round((h.parts||0)*K.SCRAP_PARTS)} }
function scrap(G,shipId){

function scrapIdle(G,gen){

    if(s.mode==='idle'&&s.at==='earth'&&!(s.from&&s.to)&&hullGen(s)===gen){
      var v=scrapValue(HULLS[s.hull]); if(scrap(G,s.id)==='ok'){ n++; m+=v.metal; p+=v.parts } } }

}
function shipById(G,id){for(var i=0;i<G.ships.length;i++)if(G.ships[i].id===id)return G.ships[i];return null}

function canDepart(G,s,pid){

  var f=Math.round(p.dist*K.FUEL_PER_DIST/Math.sqrt(driveSpeed(G)));

function launch(G,s,pid,job,cargo){
  var p=planet(pid);

/* v4.14: when no free hull at Earth can lift a world — the nearest rated hull on its way home, or null */
function nextHome(G,pid,cls){ var p=planet(pid), best=null; if(!p) return null;
  for(var i=0;i<G.ships.length;i++){ var s=G.ships[i]; if(s.mode==='dead'||s.mode==='missing'||s.mutiny) continue; if(!canReachSector(s,p.sec)) continue; if(cls&&HULLS[s.hull].key!==cls) continue;

/* A line is always world <-> Earth. Only Earth consumes, so a leg between two

  if(to!=='earth'&&!G.colonies[to]) return 'nocolony';
  if(s.mode==='dead') return 'noship';
  if(s.mode==='missing') return 'lost';
  if(s.mutiny) return 'mutiny';
  if(!canReachSector(s,planet(from).sec)) return 'range';
  if(s.mode==='building'||s.mode==='transit'){ s.pend={from:from,to:to}; return 'queued' }
  if(from!=='earth'&&G.reserves[from]<=0&&planet(from)&&planet(from).kind!=='works'&&pileLeft(G,from)<1) return 'depleted';   // v4.9/v4.11

function setRenew(G,pid,on){ var L=lineOf(G,pid); if(!L) return 'noline'; L.renew=!!on; return 'ok' }

/* the yards, once a year */

/* the drive programme is repeatable: every mark cuts crossings and signal lag

function startDrive(G,pid){

function driveDone(G,pid){

/* ---------- v4.0: the second date ---------- */

/* ---------- the chronicle ----------

function chronShift(G,cols){
  var E=G.earth, idle=0;
  for(var i=0;i<G.ships.length;i++){ var s=G.ships[i]; if(s.mode==='idle'&&s.at==='earth'&&!(s.from&&s.to)) idle++ }
  var no=Math.round(G.day/K.SHIFT_YEARS)+1, left=nightLeft(G), k;
  /* v4.1: the world lives by the date. The first shift after the date, then every other shift, writes
     about the era rather than the chart: 'dated' once, 'long' while the Night is far, 'dusk' inside the
     last thousand years. The other shifts keep reporting worlds, so the chronicle still carries facts. */
  var era=null;
  if(left!==null&&left>K.NIGHT_NEAR){
    if(!G.datedShift){ G.datedShift=no; era='dated' }
    else if((no-G.datedShift)%2===1) era= left<=K.DUSK_YEARS ? 'dusk' : 'long';
  }
  if(G.hungry) k='hungry';
  else if(left!==null&&left<=K.NIGHT_NEAR) k='night';
  else if(era) k=era;
  else if(!cols) k='empty';
  else if(idle>=4) k='idle';
  else if(cols>(G.lastShiftCols||0)) k='grow';
  else if(cols<(G.lastShiftCols||0)) k='shrink';
  else k='calm';
  G.lastShiftCols=cols;
  log(G,'shift',{n:no,k:k,c:cols,h:Math.round(E.people),i:idle,n2:left||0,b:G.ark.berths});

     decides whether to actually pause (never inside the prologue, never for bots). */

  var ev=0; for(var q in G.ghost) ev++; for(var q2 in G.reserves){ }

    d:{metal:Math.round(G.delivered.metal-m.delivered.metal),food:Math.round(G.delivered.food-m.delivered.food),fuel:Math.round(G.delivered.fuel-m.delivered.fuel),parts:Math.round(G.delivered.parts-m.delivered.parts),people:Math.round(G.delivered.people-m.delivered.people)},
    founded:G.stats.founded-m.founded, lost:G.stats.lost-m.lost, mutinies:(G.stats.mutinies||0)-m.mutinies, kits:(G.stats.kits||0)-m.kits,
    sectors:SECTORS.length-m.sectors, drive:(G.driveLvl||0)-m.drive, cols:cols, colsWas:m.cols, idle:idle, hands:Math.round(E.people),
    berths:G.ark.berths, berthsWas:m.berths, left:left, hungry:!!G.hungry,
    built:(G.stats.yardBuilt||0)-(m.built||0), renewed:(G.stats.renewed||0)-(m.renewed||0), renewMetal:(G.stats.renewMetal||0)-(m.renewMetal||0),
    attrition:(G.stats.attrition||0)-(m.attrition||0), handsRate:+handsRate(G).toFixed(2)};
  G.shiftMark={delivered:{metal:G.delivered.metal,food:G.delivered.food,fuel:G.delivered.fuel,parts:G.delivered.parts,people:G.delivered.people},
    founded:G.stats.founded,lost:G.stats.lost,mutinies:G.stats.mutinies||0,kits:G.stats.kits||0,sectors:SECTORS.length,drive:G.driveLvl||0,cols:cols,berths:G.ark.berths,day:G.day,built:G.stats.yardBuilt||0,renewed:G.stats.renewed||0,renewMetal:G.stats.renewMetal||0,attrition:G.stats.attrition||0};
  G.shiftOpen=true;
}

/* ---------- tick ---------- */

function snapshot(G,c){
  c.hist.push({day:G.day,pop:Math.round(c.pop),unrest:Math.round(c.unrest),
    store:{metal:Math.round(c.store.metal||0),food:Math.round(c.store.food||0),fuel:Math.round(c.store.fuel||0),parts:Math.round(c.store.parts||0)},
    neglect:c.neglect||0, idleWorks:c.idleWorks||0, starved:c.starved||0, upkeep:c.pop*K.UPKEEP,
    eatRate:c.pop*K.EAT*(1-planet(c.pid).hab*0.5), hungry:c.hungry||0, lastHaul:c.lastHaul||null, lastHaulDay:c.lastHaulDay||0, hauledOut:c.hauledOut||null,
    demand:c.demand?{by:c.demand.by}:null, relay:c.relay, dark:c.dark});

function lineRate(G,pid){
  var p=planet(pid), c=G.colonies[pid]; if(!c) return null;
  var makes = (p.kind==='works' ? c.pop*p.rich*K.REFINE
            : (G.reserves[pid]>0 ? c.pop*p.rich*K.PROD : 0))*rateMult(c);   // v4.4: kits
  // count the hulls actually standing on a line that touches this world.
  // (this used to test s.route, which lines have not set since v0.9 — every
  //  running line reported "carries nothing", so the panel, the map marker and
  //  the advisor all claimed the ships were idle while they were hauling.)
  var hulls=0, carries=0, trip=0;
  for(var i=0;i<G.ships.length;i++){ var s=G.ships[i];
    if(s.mode==='dead'||s.mode==='missing') continue;
    if(!(s.from&&s.to)) continue;
    if(s.from!==pid&&s.to!==pid) continue;
    var rt=Math.max(1,legDays(G,s.from,s.to,s)*2);
    hulls++; carries+=s.cap/rt;
    if(!trip||rt<trip) trip=rt;
  }
  var dep = p.kind==='works'?'parts':p.dep;

function reported(G,pid){
  var c=G.colonies[pid]; if(!c) return null;

  var l=lagDays(G,pid);

  var best=c.hist[0];

  return {r:best, lag:l, age:best?G.day-best.day:0};
}

function tick(G){
  if(G.over) return;
  G.day++;
  if(G.day%50===0){ G.snaps=G.snaps||[]; G.snaps.push(snap(G)); }
  G.inRate=G.inRate||{}; G._dl=G._dl||{};                 // v4.20: EMA of what arrives home per year, per resource
  ['metal','food','fuel','parts'].forEach(function(k){ var cur=(G.delivered&&G.delivered[k])||0, dd=cur-(G._dl[k]||0); G._dl[k]=cur; G.inRate[k]=(G.inRate[k]||0)*0.98+dd*0.02 });
  G.fuelRate=(G.fuelRate||0)*0.95+(G.fuelSpent||0)*0.05; G.fuelSpent=0;   // v4.4: EMA of fuel the fleet burns per year
  var E=G.earth, R=G.rnd;

  var ef=earthOutput(G)*(G.cold?0.7:1);        // no metal at home, the yards run slow
  E.crewF=ef;
  E.pMetal=K.EARTH_METAL*ef; E.pFood=K.EARTH_FOOD*ef; E.pFuel=K.EARTH_FUEL*ef;
  E.metal+=E.pMetal; E.food+=E.pFood; E.fuel+=E.pFuel;
  if(!G.hungry) E.people+=handsRate(G);        // v4.7: a fed home world keeps turning out colonists, fewer every century

        var c=G.colonies[o.pid];
        if(c&&!c.dark&&c.store.metal>=K.RELAY_METAL){c.store.metal-=K.RELAY_METAL;c.relay=true;c.pending=null;c.unrest=Math.max(0,c.unrest-10);log(G,'relay_up',{p:o.pid})}
        else if(c){c.pending=null;log(G,'relay_fail',{p:o.pid})}
      } else if(o.kind==='relief'){
        var c2=G.colonies[o.pid];
        if(c2&&!c2.dark){c2.unrest=Math.max(0,c2.unrest-28);c2.demand=null;c2.pending=null;log(G,'relief_done',{p:o.pid})}
        else if(c2){c2.pending=null}
      }
    }
  }

  // ---- the yards (v4.6) ----
  yardsTick(G);
  // ---- ships ----
  for(var i=0;i<G.ships.length;i++){
    var s=G.ships[i];
    if(s.mode==='building'){s.t--;if(s.t<=0){s.mode='idle';s.at='earth';log(G,'ship_ready',{n:s.id});
        if(s.retire){ var rv=scrapValue(HULLS[s.hull]); s.pend=null; s.from=null; s.to=null; if(scrap(G,s.id)==='ok'){ G.stats.renewed=(G.stats.renewed||0)+1; G.stats.renewMetal=(G.stats.renewMetal||0)+rv.metal; log(G,'line_retired',{n:s.id,why:s.retire,m:rv.metal}) } continue }

      }continue}
    if(s.mode==='missing'){

      var p1=R();
      if(p1<0.025){ s.bearing=Math.round(R()*100); log(G,'fragment',{n:s.id,b:s.bearing}); }
      else if(p1<0.050){ s.mode='transit'; s.dir='in'; s.t=Math.max(3,Math.round(s.total*0.7)); s.total=s.t; G.pauseNow=true; log(G,'ship_returns',{n:s.id,d:s.missDays}); }

      if(!G.safe&&R()<hz*0.085){ s.mode='missing'; s.missDays=0; G.pauseNow=true; log(G,'ship_missing',{n:s.id,p:s.dest==='earth'?s.origin:s.dest}); continue; }
    }

    if(s.job==='colonize'){

      if(!G.safe&&R()<p.haz*0.5){ var cf=s.crew||0; s.mode='dead'; s.crew=0; G.stats.lost++;
        G.earth.lostCrew=(G.earth.lostCrew||0)+cf; log(G,'colony_failed',{n:s.id,p:node}); continue }

    }

      if(found&&R()<0.55){ found.mode='transit'; found.dir='in'; found.origin=node; found.dest='earth'; found.t=legDays(G,node,'earth',found); found.total=found.t; log(G,'search_found',{n:found.id}) }
      else log(G,'search_empty2',{p:node});
      s.job=null; s.searchFor=null; s.origin=node; s.dest='earth'; s.mode='transit'; s.dir='in'; s.t=legDays(G,node,'earth',s); s.total=s.t;
      continue;
    }

      // v4.2: the crew loads, sails home, and will not come back. The word goes out from the far end.

      log(G,'mutiny',{n:s.id,p:node,at:'far'});

      s.from=null; s.to=null; s.origin=node; s.dest='earth'; s.mode='transit'; s.dir='in'; s.t=legDays(G,node,'earth',s); s.total=s.t;

    }

      log(G,'reassigned',{n:s.id,a:s.from,b:s.to}); }
    if(s.homeOnly){ var hp=s.homeOnly; s.homeOnly=null; s.from=null; s.to=null; s.pend=null; s.waiting=true; log(G,'nothing_left',{n:s.id,p:hp}); continue }
    if(s.retire){ var v0=scrapValue(HULLS[s.hull]); s.from=null; s.to=null; s.pend=null; if(scrap(G,s.id)==='ok'){ G.stats.renewed=(G.stats.renewed||0)+1; G.stats.renewMetal=(G.stats.renewMetal||0)+v0.metal; log(G,'line_retired',{n:s.id,why:s.retire,m:v0.metal}) } continue }

    if(c.pop>K.MIN_FOUND){ c.lossDebt=(c.lossDebt||0)+c.pop*p.haz*K.COLONY_LOSS; var cl=Math.floor(c.lossDebt); if(cl>0){ c.lossDebt-=cl; c.pop=Math.max(K.MIN_FOUND,c.pop-cl); G.stats.colonyLoss=(G.stats.colonyLoss||0)+cl } }
    // v4.4: the machines drink first; dry for KIT_GRACE years and they stand

      else { c.store.fuel=0; c.fuelOut=(c.fuelOut||0)+1; if(c.fuelOut===K.KIT_GRACE) log(G,'kit_starved',{p:k,t:c.tier}) } }

      c.store.food=(c.store.food||0)+c.pop*K.WORKS_LOCAL*0.6;

      /* v4.11 (Nikita, 28.09: 'судно снимается с линии, хотя на складе ещё что-то лежит'): the seam is dead but the
         pile is carried out to the last ton; a hull stands down only when it lands and finds nothing (loadAt) */
    }

    c.neglect=(c.neglect||0)+1;

    if(K.UNREST_ON){

      if(c.neglect>K.NEGLECT_DAYS) c.unrest += K.NEGLECT_RATE; // nobody has come
      c.unrest = Math.max(0, c.unrest - K.CALM - (G.drive===k?0.25:0));

    if(E[pa.res]>=dr){ E[pa.res]-=dr; G.pulseShort=false }
    else { E[pa.res]=0; var d2=Math.max(0.2,E.people*K.STARVE_KILL*0.5); E.people=Math.max(0,E.people-d2); E.lost=(E.lost||0)+d2;
      if(!G.pulseShort){ G.pulseShort=true; G.pauseNow=true; log(G,'pulse_short',{dep:pa.res}) } }
  }
  var hungry=false, cold=false;
  if(E.food>=nd.food) E.food-=nd.food; else { E.food=0; hungry=true }
  if(E.metal>=nd.metal) E.metal-=nd.metal; else { E.metal=0; cold=true }
  G.hungry=hungry; G.cold=cold;
  if(hungry){                                   // no rations: the home world buries people
    var died=Math.max(0.4,E.people*K.STARVE_KILL);
    E.people=Math.max(0,E.people-died); E.lost=(E.lost||0)+died;
    if(!G.lacking){G.lacking=true;G.pauseNow=true;log(G,'earth_short',{})}
  } else {
    G.lacking=false;
    if(E.lost>0.5){ var back=Math.min(E.lost,E.people*K.MEND+0.2); E.lost-=back }  // recovery is slow
  }

  // ---- something happens out there ----
  if(R()<K.EVENT_CHANCE){
    var keys=Object.keys(G.colonies).filter(function(k){return !G.colonies[k].dark&&G.reserves[k]>0});   // v4.11: a dead seam has no pockets and no surprises
    if(keys.length){
      var k=keys[Math.floor(R()*keys.length)], c=G.colonies[k], p=planet(k), roll=R();
      if(roll<0.42){
        var b=Math.round(c.pop*p.rich*K.PROD*40*(0.6+R()));
        c.store[p.dep]=(c.store[p.dep]||0)+b;
        log(G,'ev_rich',{p:k,q:b,dep:p.dep}); G.pauseNow=true;
      } else if(roll<0.58&&G.reserves[k]!==Infinity&&G.reserves[k]>0){
        /* v4.1 (Nikita, 24.09: "жила оказалась больше или меньше, чем планировали"): the mirror of ev_seam */
        var cut=Math.round(G.reserves[k]*(0.25+R()*0.3));
        G.reserves[k]=Math.max(1,G.reserves[k]-cut);
        log(G,'ev_short',{p:k,q:cut,dep:p.dep}); G.pauseNow=true;
      } else if(roll<0.74){
        var lost=Math.round((c.store[p.dep]||0)*(0.25+R()*0.4));
        c.store[p.dep]=Math.max(0,(c.store[p.dep]||0)-lost);
        log(G,'ev_wreck',{p:k,q:lost,dep:p.dep}); G.pauseNow=true;
      } else if(roll<0.88){
        var died=Math.round(c.pop*(0.10+R()*0.15));
        c.pop=Math.max(4,c.pop-died);
        log(G,'ev_disaster',{p:k,q:died}); G.pauseNow=true;
      } else {
        var seam=Math.round(K.RESERVE_BASE*Math.pow(K.RESERVE_GROW,p.sec)*p.rich*(0.15+R()*0.25));
        if(G.reserves[k]!==Infinity){ G.reserves[k]+=seam; c.dry=false; log(G,'ev_seam',{p:k,q:seam,dep:p.dep}); G.pauseNow=true }
      }
    }
  }

  var settled=0; for(var k in G.colonies) if(!G.colonies[k].dark) settled++;
  if(settled>G.stats.peak) G.stats.peak=settled;
  if(G.day%K.SHIFT_YEARS===0) chronShift(G,settled);

  // ---- the Long Night ----
  if(!G.night&&(SECTORS.length>=K.NIGHT_TRIGGER_SECTORS||G.day>=K.NIGHT_TRIGGER_YEAR)) revealNight(G);
  if(G.night){
    var left=G.night-G.day;
    if(left===K.NIGHT_NEAR||left===100||left===25){ G.pauseNow=true; log(G,'night_near',{n:left,s:arkSouls(G)}) }
    if(left===K.DOOMSDAY_AT) log(G,'doomsday',{n:left,b:G.ark.berths,h:Math.round(E.people)});
    if(left<=0){
      G.left=leftBehind(G); G.over='night';
      if(!arkReady(G)){
        // v4.0: berths without a drive are a monument, not a boat
        G.boarded=0; G.souls=0; G.grounded=true;
        log(G,'night',{s:0});
        log(G,'ark_grounded',{b:G.ark.berths,g:G.arkMark}); return;
      }
      G.boarded=arkSouls(G); G.wake=arkWake(G); G.souls=Math.floor(G.boarded*G.wake);
      log(G,'night',{s:G.boarded});
      /* v4.14 (run 398763448 review): with no berths or nobody at home there is no departure to chronicle */
      if(G.boarded>0){ log(G,'ark_sailed',{s:G.boarded,b:G.left.home+G.left.hulls+G.left.colonies+G.left.transit});
        log(G,'ark_woke',{w:G.souls,s:G.boarded,g:G.driveLvl||0}) }
      return;
    }
  }
  // there is no victory screen any more — the chart runs as far as you can push it.
  // The only ending is the home world going quiet, and it has to actually arrive.
  if(hungry){
    G.famine=(G.famine||0)+1;
    if(G.famine===1||G.famine===Math.round(K.DEAD_DAYS*0.6)){ G.pauseNow=true; log(G,'earth_dead',{n:K.DEAD_DAYS-G.famine}) }
    if(G.famine>=K.DEAD_DAYS){ G.over='lose'; log(G,'lose',{}); log(G,'desk_silent',{n:K.DEAD_DAYS}) }
  } else if(G.famine) G.famine=Math.max(0,G.famine-1);   // fed days pay famine back one for one, no faster
}

/* ---------- the advisor: the game does the arithmetic and says what wants a decision ----------
   Pure. Returns [{code, sev, pid?, sid?, hull?, n?}] ordered worst-first. */
function advice(G){
  var out=[], E=G.earth, i, k;
  var nd=G.need||earthNeed(G);

  var fd=Math.floor(E.food/Math.max(0.1,nd.food)), md=Math.floor(E.metal/Math.max(0.1,nd.metal));
  if(G.hungry) out.push({code:'a_starving',sev:'bad',n:Math.round(E.people)});
  else if(fd<25) out.push({code:'a_food',sev:fd<10?'bad':'warn',n:fd});
  if(G.cold) out.push({code:'a_cold',sev:'bad'});
  else if(md<25) out.push({code:'a_metal',sev:md<10?'bad':'warn',n:md});
  var hasWell=false; for(k in G.colonies){ var pw=planet(k); if(pw&&pw.kind==='well'&&!G.colonies[k].dark&&G.reserves[k]>0) hasWell=true }
  if(!hasWell&&E.fuel<260&&Object.keys(G.colonies).length>=2) out.push({code:'a_nowell',sev:E.fuel<60?'bad':'warn',n:Math.round(E.fuel)});
  else if(E.fuel<30) out.push({code:'a_fuel',sev:E.fuel<12?'bad':'warn',n:Math.round(E.fuel)});
  // hulls of a retired generation sitting idle are metal on the slipway
  var oldIdle=G.ships.filter(function(s){return s.mode==='idle'&&s.at==='earth'&&!(s.from&&s.to)&&hullGen(s)<(G.gen||0)}).length;
  if(oldIdle>=4) out.push({code:'a_scrap',sev:'ok',n:oldIdle,g:(G.gen||0)});

  for(k in G.colonies){
    var c=G.colonies[k], p=planet(k);
    if(!p) continue;
    if(c.dark){ out.push({code:'a_dark',sev:'bad',pid:k}); continue }
    var lines=G.ships.filter(function(s){return s.mode!=='dead'&&s.from&&s.to&&(s.from===k||s.to===k)});
    var lr=lineRate(G,k);
    var dep = p.kind==='works'?'parts':p.dep;
    var sitting = Math.round(c.store[dep]||0);
    var dry = G.reserves[k]!==Infinity && G.reserves[k]<=0;

    var cap=popCap(p), miss=Math.floor(cap-c.pop);

    // a worked-out seam with a full warehouse still has something to haul.
    // never tell the player there is nothing to take while the store is full.
    if(dry&&sitting>20){ out.push({code:'a_lastload',sev:'warn',pid:k,n:sitting}); continue }
    if(dry){ if(lines.length) out.push({code:'a_dry',sev:'bad',pid:k,n:lines.length}); continue }

    // v4.6: the standing order waits on the yards
    var Lk=lineOf(G,k); if(Lk&&Lk.wait){ for(var wc in Lk.wait){ var wr=Lk.wait[wc]; if(wr&&(Lk.want[wc]||0)>lineCount(G,k,wc)){ out.push({code:(wr==='metal'||wr==='parts'||wr==='fuel'||wr==='crew')?'a_yard_cost':(wr==='mutiny'?'a_yard_mutiny':'a_yard_range'),sev:'warn',pid:k,c:wc,r:wr}); break } } }
    // v4.4: kits
    if(c.kit&&lines.length&&lineHold(G,k)<c.kit.w) out.push({code:'a_kithold',sev:'warn',pid:k,n:c.kit.w,t:c.kit.tier});
    if(c.kit&&!lines.length) out.push({code:'a_kithold',sev:'warn',pid:k,n:c.kit.w,t:c.kit.tier});
    if(kitTier(c)>0&&(c.fuelOut||0)>=K.KIT_GRACE) out.push({code:'a_kitfuel',sev:'warn',pid:k,t:c.tier});
    if(!lines.length){
      // one message, not three: no line means nothing leaves and no hands arrive
      out.push({code: miss>cap*0.3?'a_nolineShort':'a_noline', sev:'warn', pid:k, n:miss});
    } else {
      if(lr&&lr.piling&&sitting>120) out.push({code:'a_pile',sev:'warn',pid:k,n:sitting});
      // a factory with a line is being fed; only speak up if it has sat idle a long while
      if(p.kind==='works'&&(c.idleWorks||0)>90) out.push({code:'a_feedslow',sev:'warn',pid:k,n:c.idleWorks});
    }
    if(p.kind==='works'&&!lines.length&&(c.store.metal<2||c.store.food<2)) out.push({code:'a_feed',sev:'bad',pid:k});
  }

  var idle=G.ships.filter(function(s){return s.mode==='idle'&&s.at==='earth'&&!(s.from&&s.to)});
  if(idle.length&&idle.length-oldIdle>0) out.push({code:'a_idle',sev:'warn',n:idle.length,sid:idle[0].id});

  var free=null, fleetLim=sectorLimit(G.gen||0);
  for(i=0;i<PLANETS.length;i++){ var pp=PLANETS[i];
    if(!G.colonies[pp.id]&&!G.ghost[pp.id]&&sectorOpen(G,pp.sec)&&pp.sec<=fleetLim){ free=pp.id; break } }
  if(free&&idle.length&&E.people>=K.MIN_FOUND+K.EARTH_KEEP) out.push({code:'a_settle',sev:'ok',pid:free,sid:idle[0].id});

  for(i=HULLS.length-1;i>=0;i--){ var h=HULLS[i];
    if(h.gen!==(G.gen||0)) continue;
    if(reach(G)>=h.reach&&E.metal>=h.metal&&E.fuel>=h.fuel&&E.parts>=(h.parts||0)&&E.people-K.EARTH_KEEP>=(h.crew||0)){ out.push({code:'a_build',sev:'ok',hull:i}); break } }
  // v4.4: one kit suggestion at a time — the richest world with a line that can carry it and a seam worth it
  if(kitOpen(G)){ var bk=null, bv=0;
    for(k in G.colonies){ var ck=G.colonies[k], pk=planet(k); if(!pk||ck.dark) continue; if(canKit(G,k)!=='ok') continue;
      var kk2=kitCost(ck); if(lineHold(G,k)<kk2.w) continue;
      if(G.reserves[k]!==Infinity&&G.reserves[k]<ck.pop*pk.rich*K.PROD*Math.pow(K.KIT_OUT,kk2.tier)*150) continue;   // seam would be gone inside 150 years
      var v=ck.pop*pk.rich; if(v>bv){ bv=v; bk={pid:k,t:kk2.tier} } }
    if(bk) out.push({code:'a_kit',sev:'ok',pid:bk.pid,t:bk.t}) }
  // v4.4: rations pile up for the ark — say so, or the player reads it as waste
  if(G.night&&fd>60) out.push({code:'a_foodpile',sev:'ok',n:fd});
  // v4.10 (Nikita, 27.09): a flock of couriers where one hauler would do
  for(k in G.colonies){ var Lb=lineOf(G,k); if(!Lb) continue; var nc=lineCount(G,k,'courier'); if(nc<3) continue;
    var hi=currentHull(G,'hauler'); if(hi===null||!canReachSector({hull:hi},planet(k).sec)||reach(G)<HULLS[hi].reach) continue;
    out.push({code:'a_bigger',sev:'ok',pid:k,n:nc}); break }
  // v4.7: hulls on the pier with no hands to sign
  var cw=0; for(i=0;i<G.ships.length;i++){ if(G.ships[i].crewWait&&G.ships[i].mode==='idle') cw++ }
  if(cw) out.push({code:'a_crew',sev:'bad',n:cw});
  // hands with nothing to do: the v3.3 problem, said out loud
  if(E.people-K.EARTH_KEEP>420) out.push({code:'a_idlehands',sev:'ok',n:Math.round(E.people)});
  // the Long Night
  if(G.night){
    var nl=nightLeft(G), souls=arkSouls(G), lb=leftBehind(G);
    if(nl<=K.NIGHT_NEAR){
      if(lb.hulls+lb.colonies>souls*0.25) out.push({code:'a_nightrecall',sev:'bad',n:nl,h:lb.hulls,c:lb.colonies});
      if(G.ark.berths>E.people+crewDocked(G)) out.push({code:'a_nighthands',sev:'warn',n:Math.round(G.ark.berths-E.people-crewDocked(G))});
    }
    if(!arkReady(G)){
      /* two thousand years of a red line nobody can act on yet is noise: it turns bad inside 2×NIGHT_NEAR */
      var fc=driveForecast(G,G.arkMark), gm=G.arkMark, sv2=nl<=K.NIGHT_NEAR*2?'bad':'warn';
      if(fc.st==='ok'&&fc.y>G.night) out.push({code:'a_arkd_late',sev:sv2,gr:gm,y:fc.y,l:fc.y-G.night});
      else if(fc.st==='ok'&&fc.y>G.night-K.NIGHT_NEAR/2) out.push({code:'a_arkd_tight',sev:'warn',gr:gm,y:fc.y,l:G.night-fc.y});
      else if(fc.st==='settled') out.push({code:'a_arkd_reach',sev:sv2,gr:gm,n:fc.n,r:fc.r});
      else if(fc.st==='host') out.push({code:'a_arkd_host',sev:sv2,gr:gm,n:K.DRIVE_POP});
      else if(fc.st==='stalled') out.push({code:'a_arkd_stall',sev:sv2,gr:gm});
    }
    /* v4.5 (run 768210301: nine Generation V couriers bought in the last 300 years never sailed once — every
       crew refused). Say it before the metal is spent: the shortest line still open already refuses. */
    var minRt=null; for(k in G.colonies){ if(G.colonies[k].dark) continue; var probe={hull:HULLS.length-3};
      var rt=legDays(G,k,'earth',probe)*2; if(minRt===null||rt<minRt) minRt=rt }
    if(minRt!==null&&nl<K.MUTINY_MIN*minRt) out.push({code:'a_lastbuild',sev:'warn',n:Math.round(minRt),l:nl});
    var mut=0; for(i=0;i<G.ships.length;i++){ if(G.ships[i].mutiny&&G.ships[i].mode==='idle') mut++ }
    if(mut) out.push({code:'a_mutiny',sev:'warn',n:mut});
    if(canArk(G)==='ok') out.push({code:'a_ark',sev:nl<=K.NIGHT_NEAR?'warn':'ok',n:G.ark.berths});
    else if(G.ark.berths<E.people+crewDocked(G)&&nl>K.NIGHT_NEAR) out.push({code:'a_arkshort',sev:'ok',n:Math.round(E.people+crewDocked(G)-G.ark.berths)});
  }

  if(!G.drive&&settledCount(G)>=driveReachFor(G)){
    for(k in G.colonies){ if(planet(k)&&planet(k).kind==='works'&&G.colonies[k].pop>=K.DRIVE_POP&&!G.colonies[k].dark){
      out.push({code:'a_drive',sev:'ok',pid:k,n:(G.driveLvl||0)+1}); break } }
  }
  var sv=canSurvey(G);
  if(sv==='ok') out.push({code:'a_survey',sev:'ok',n:SECTORS.length+1});

  /* v3.2: the chart may now run past the fleet. Two different messages:
     nothing left within range (build the next generation) and nothing left
     at all (chart further out). */
  var freeNear=0, freeFar=0;
  for(i=0;i<PLANETS.length;i++){ var pz=PLANETS[i];
    if(G.colonies[pz.id]||G.ghost[pz.id]) continue;
    if(pz.sec<=fleetLim) freeNear++; else freeFar++; }
  if(!freeNear&&freeFar) out.push({code:'a_genwall',sev:'warn',n:(G.gen||0)+2});
  if(!freeNear&&!freeFar&&sv!=='ok') out.push({code:'a_chartfull',sev:'ok'});

  var rank={bad:0,warn:1,ok:2};
  out.forEach(function(x,n){ x.key=x.code+':'+(x.pid||x.hull||''); });
  /* v3.8.1 (log 57539013): a_metal was dismissed in year 108 and never seen again; Earth ran dry for the
     last 1100 years of the run with the warning silenced. A dismissal now lasts K.DISMISS_YEARS, and a
     warning that has turned bad ignores it. */
  out=out.filter(function(x){ var d=G.dismissed[x.key]; if(d===undefined) return true; if(x.sev==='bad') return true; return G.day-d>K.DISMISS_YEARS });
  out.sort(function(a,b){return rank[a.sev]-rank[b.sev]});
  return out;
}

function dismiss(G,key){ G.dismissed[key]=G.day; return 'ok' }
function undismissAll(G){ G.dismissed={}; return 'ok' }
</script>
<script>
/* LONG NIGHT — interface layer. Depends on core.js globals. */
(function(){
"use strict";

/* ---------- texts ----------
   v3.6.2 (Nikita, 23.09: "таблица в гугле, в которую будешь грузить все диалоги и реплики"):
   every string the player reads lives in the Google Sheet "LAST BERTH — тексты игры".
   The build bakes it into <script id="lb-texts">; the Earth tab can pull a fresh copy from the
   published CSV when the build carries its link. Code never holds a sentence again. */
var L,LOG,MSG,DEP,GUIDE,VOICE;
var TXT={src:'baked',n:0,at:null};
var TXT_EL=document.getElementById('lb-texts');
var TXT_BAKED=JSON.parse(TXT_EL.textContent);
var TXT_URL=TXT_EL.getAttribute('data-url')||'';
function applyTexts(rows,src){
  var T2={UI:{en:{},ru:{}},LOG:{en:{},ru:{}},MSG:{en:{},ru:{}},RES:{en:{},ru:{}},VOICE:{en:{},ru:{}}};
  var G2={en:[],ru:[]}, n=0;
  rows.forEach(function(r){
    var t=r[0], k=r[1], v={en:r[2],ru:r[3]};
    if(t==='GUIDE'){
      var m=/^p(\d+)\.(title|kicker|b(\d+))$/.exec(k); if(!m) return;
      ['en','ru'].forEach(function(lg){ if(!v[lg]) return;
        var pg=G2[lg][+m[1]-1]=G2[lg][+m[1]-1]||{t:'',k:'',b:[]};
        if(m[2]==='title') pg.t=v[lg]; else if(m[2]==='kicker') pg.k=v[lg]; else pg.b[+m[3]-1]=v[lg]; });
      n++; return;
    }
    if(!T2[t]) return;
    if(v.en) T2[t].en[k]=v.en;
    if(v.ru) T2[t].ru[k]=v.ru;
    n++;
  });
  for(var t in T2){ for(var k in T2[t].en) if(T2[t].ru[k]===undefined) T2[t].ru[k]=T2[t].en[k] }
  function pages(a){ return a.filter(Boolean).map(function(p){ return {t:p.t,k:p.k,b:p.b.filter(function(x){return x!==undefined})} }) }
  L=T2.UI; LOG=T2.LOG; MSG=T2.MSG; DEP=T2.RES; VOICE=T2.VOICE;
  GUIDE={en:pages(G2.en), ru:pages(G2.ru)};
  if(!GUIDE.ru.length) GUIDE.ru=GUIDE.en;
  TXT={src:src, n:n, at:new Date()};
}
applyTexts(TXT_BAKED,'baked');
/* RFC 4180 CSV, enough for a Google Sheets export: quoted cells, doubled quotes, newlines in cells */
function parseCSV(txt){
  var out=[], row=[], cell='', q=false, i=0, c;
  txt=txt.replace(/^﻿/,'');
  for(;i<txt.length;i++){ c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){ cell+='"'; i++ } else q=false } else cell+=c; continue }
    if(c==='"') q=true;
    else if(c===','){ row.push(cell); cell='' }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&txt[i+1]==='\n') i++; row.push(cell); out.push(row); row=[]; cell='' }
    else cell+=c;
  }
  if(cell!==''||row.length){ row.push(cell); out.push(row) }
  return out;
}
/* Google publishes TSV as plain tab-separated lines (no quoting) — the link Nikita shared is ?output=tsv */
function parseTSV(txt){ return txt.replace(/^\ufeff/,'').split(/\r?\n/).filter(function(l){return l.length}).map(function(l){return l.split('\t')}) }
function sheetRows(txt){
  var first=txt.split(/\r?\n/,1)[0]||'';
  var a=first.indexOf('\t')>=0?parseTSV(txt):parseCSV(txt); if(!a.length) return [];
  var h=a[0].map(function(x){return x.trim().toLowerCase()}), ix={};
  ['table','key','en','ru','status'].forEach(function(c){ ix[c]=h.indexOf(c) });
  if(ix.table<0||ix.key<0||ix.en<0) return [];
  var ph=function(s){ return (String(s||'').match(/\{\w+\}/g)||[]).sort().join() };
  var base={}; TXT_BAKED.forEach(function(r){ base[r[0]+'.'+r[1]]=r });
  return a.slice(1).filter(function(r){ var st=ix.status>=0?(r[ix.status]||'').trim():'live'; return r[ix.key]&&(st===''||st==='live') })
    .map(function(r){ var row=[r[ix.table].trim(),r[ix.key].trim(),r[ix.en]||'',ix.ru>=0?(r[ix.ru]||''):''], b=base[row[0]+'.'+row[1]];
      // a cell that lost or gained a placeholder would print {n} to the player: keep the built-in one
      if(b){ if(row[2]&&ph(row[2])!==ph(b[2])) row[2]=''; if(row[3]&&ph(row[3])!==ph(b[3])) row[3]='' }
      return row });
}
function reloadTexts(){
  if(!TXT_URL){ say('textsNoUrl'); return }
  var done=false, timer=setTimeout(function(){ if(!done){ done=true; say('textsFail') } },8000);
  fetch(TXT_URL+(TXT_URL.indexOf('?')<0?'?':'&')+'t='+Date.now(),{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.text() })
    .then(function(txt){ if(done) return; done=true; clearTimeout(timer);
      var rows=sheetRows(txt); if(!rows.length) throw new Error('empty');
      applyTexts(TXT_BAKED.concat(rows),'sheet'); TXT.n=rows.length; draw(); say('textsOk') })
    .catch(function(){ if(done) return; done=true; clearTimeout(timer); say('textsFail') });

   face: a procedural portrait, a role, a name, a service number, one line from the VOICE table. The line
   goes to the journal always; the window opens at most once per VOICE_GAP years, except the moments
   that matter (the date, a last flight, the pier). Nothing here touches the core. */

  if(o.quiet) return;   // v4.1: most of the world speaks in the journal only; the window is for the moments that matter
  if(o.force || G.day-(U.voiceLast||0)>=VOICE_GAP){
    U.voiceLast=G.day;
    U.pf={k:k,role:role,name:name,no:no,d:d||{},seed:seed,sub:o.sub||''};
    U.paused=true; SFX.play('voice');

/* the face: 64×64, bone on black, ordered dither — nobody drew it, and it is different every time */
function drawPortrait(cv,seed){
  var r=mulberry32(seed), W=64, H=64, ctx=cv.getContext('2d');
  cv.width=W; cv.height=H;
  var fw=20+Math.floor(r()*9), fh=27+Math.floor(r()*9), cx=32+Math.floor(r()*5)-2, cy=34+Math.floor(r()*4)-2;
  var eyeY=cy-Math.floor(fh*0.12)-Math.floor(r()*3), gap=Math.floor(fw*0.36)+Math.floor(r()*3), eyeS=1+Math.floor(r()*2);
  var browT=Math.floor(r()*5)-2, noseL=Math.floor(fh*0.28)+Math.floor(r()*4), mouthW=Math.floor(fw*0.45)+Math.floor(r()*5), mouthY=cy+Math.floor(fh*0.32)+Math.floor(r()*3);
  var hair=Math.floor(r()*5), glasses=r()<0.22, beard=r()<0.25, light=r()<0.5?-1:1, sag=r()*0.35;
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  // head: a lit ellipse with a shadow on one side
  var g=ctx.createLinearGradient(cx-fw,0,cx+fw,0);
  if(light<0){ g.addColorStop(0,'#f0f0f0'); g.addColorStop(0.6,'#b0b0b0'); g.addColorStop(1,'#505050') }
  else { g.addColorStop(0,'#505050'); g.addColorStop(0.4,'#b0b0b0'); g.addColorStop(1,'#f0f0f0') }
  ctx.fillStyle='#202020'; ctx.fillRect(0,0,W,H);                       // a dim wall behind the head, so the hair reads
  ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(cx,cy,fw,fh,0,0,Math.PI*2); ctx.fill();
  // neck and shoulders
  ctx.fillStyle='#6a6a6a'; ctx.fillRect(cx-Math.floor(fw*0.35),cy+fh-4,Math.floor(fw*0.7),12);
  ctx.fillStyle='#4a4a4a'; ctx.beginPath(); ctx.ellipse(cx,H+6,fw+18,16,0,Math.PI,Math.PI*2); ctx.fill();
  // hair
  ctx.fillStyle='#606060';
  if(hair===1){ ctx.beginPath(); ctx.ellipse(cx,cy-fh*0.55,fw+1,fh*0.55,0,Math.PI,Math.PI*2); ctx.fill() }
  else if(hair===2){ ctx.beginPath(); ctx.ellipse(cx,cy-fh*0.5,fw+2,fh*0.62,0,Math.PI,Math.PI*2); ctx.fill(); ctx.fillRect(cx-fw-2,cy-fh*0.5,6,fh*0.9); ctx.fillRect(cx+fw-4,cy-fh*0.5,6,fh*0.9) }
  else if(hair===3){ ctx.beginPath(); ctx.ellipse(cx+light*3,cy-fh*0.6,fw-2,fh*0.45,0,Math.PI,Math.PI*2); ctx.fill() }
  else if(hair===4){ ctx.fillStyle='#707070'; ctx.beginPath(); ctx.ellipse(cx,cy-fh*0.62,fw+3,fh*0.42,0,Math.PI,Math.PI*2); ctx.fill(); ctx.fillRect(cx-fw-3,cy-fh*0.62,2*fw+6,3) }
  // brows, eyes
  ctx.fillStyle='#101010';
  ctx.fillRect(cx-gap-3,eyeY-4-browT,7,2); ctx.fillRect(cx+gap-4,eyeY-4+browT,7,2);
  ctx.fillStyle='#f0f0f0'; ctx.fillRect(cx-gap-2,eyeY-1,5,3); ctx.fillRect(cx+gap-3,eyeY-1,5,3);
  ctx.fillStyle='#000'; ctx.fillRect(cx-gap-1+Math.floor(sag*2),eyeY,eyeS+1,2); ctx.fillRect(cx+gap-2+Math.floor(sag*2),eyeY,eyeS+1,2);
  if(glasses){ ctx.strokeStyle='#e8e8e8'; ctx.lineWidth=1; ctx.strokeRect(cx-gap-4.5,eyeY-3.5,9,7); ctx.strokeRect(cx+gap-4.5,eyeY-3.5,9,7); ctx.beginPath(); ctx.moveTo(cx-gap+4.5,eyeY); ctx.lineTo(cx+gap-4.5,eyeY); ctx.stroke() }
  // nose, mouth
  ctx.fillStyle='#2a2a2a'; ctx.fillRect(cx+light,eyeY+3,1,noseL); ctx.fillRect(cx-1,eyeY+3+noseL,3,1);
  ctx.fillStyle='#181818'; ctx.fillRect(cx-Math.floor(mouthW/2),mouthY,mouthW,2);
  if(beard){ ctx.fillStyle='rgba(20,20,20,.75)'; ctx.beginPath(); ctx.ellipse(cx,cy+fh*0.6,fw*0.8,fh*0.38,0,0,Math.PI); ctx.fill() }
  // ordered dither to two colours: black and bone
  var img=ctx.getImageData(0,0,W,H), p=img.data, B=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
  for(var y=0;y<H;y++) for(var x=0;x<W;x++){ var i=(y*W+x)*4; var v=(p[i]*0.299+p[i+1]*0.587+p[i+2]*0.114)/255;
    var on = v > (B[y&3][x&3]+0.5)/16;
    p[i]=on?0xF2:0; p[i+1]=on?0xF1:0; p[i+2]=on?0xEC:0; p[i+3]=255 }
  ctx.putImageData(img,0,0);
}

/* ---------- the viewport ----------
   The chart grows without end but the viewBox used to be a fixed 1000x700, so
   everything past sector 2 (ring radius 346, half-height 350) was drawn outside
   it and simply clipped — Nikita, 22.09: "on ring 4 you cannot see any of the
   following ones". The view now fits the whole chart by itself, and the wheel
   and a drag are there for when it is crowded. Marks are scaled by Z so text
   stays the same size on screen however far out the chart runs. */
var VIEW={x:0,y:0,w:1000,h:700}, VFIT=true, VSECS=-1, MAPDRAGGED=false;
function viewFit(){
  var R=secRadius(Math.max(0,SECTORS.length-1))+58;
  var w=Math.max(1000, R*1.32*2, R*0.90*2*(1000/700));
  for(var it=0;it<4;it++){            // the pad is screen-sized, so it scales with the fit: iterate
    var Z=w/1000;
    var w2=Math.max(1000, (R*1.32+128*Z)*2, (R*0.90+44*Z)*2*(1000/700));
    if(Math.abs(w2-w)<1){ w=w2; break } w=w2;
  }
  VIEW={x:CX-w/2, y:CY-w*0.35, w:w, h:w*0.7};
  VSECS=SECTORS.length;
}
function viewZoom(f,ax,ay){
  var w=Math.max(280,Math.min(9000,VIEW.w*f));
  f=w/VIEW.w;
  if(ax===undefined){ax=VIEW.x+VIEW.w/2; ay=VIEW.y+VIEW.h/2}
  VIEW={x:ax-(ax-VIEW.x)*f, y:ay-(ay-VIEW.y)*f, w:w, h:w*0.7};
  VFIT=false;
}
function viewPt(ev){
  var m=el('map'), r=m.getBoundingClientRect();
  // the viewBox is letterboxed by preserveAspectRatio=meet: find the real scale
  var sc=Math.min(r.width/VIEW.w, r.height/VIEW.h);
  var ox=(r.width-VIEW.w*sc)/2, oy=(r.height-VIEW.h*sc)/2;
  return {x:VIEW.x+(ev.clientX-r.left-ox)/sc, y:VIEW.y+(ev.clientY-r.top-oy)/sc, sc:sc};
}

function drawMap(){
  var s='', i, p, xy;
  if(VFIT&&VSECS!==SECTORS.length) viewFit();
  var Z=VIEW.w/1000;                       // world units per screen unit: keep marks constant on screen
  var F=function(n){return (n*Z).toFixed(2)};
  el('map').setAttribute('viewBox',VIEW.x.toFixed(1)+' '+VIEW.y.toFixed(1)+' '+VIEW.w.toFixed(1)+' '+VIEW.h.toFixed(1));
  s+='<rect x="'+VIEW.x.toFixed(1)+'" y="'+VIEW.y.toFixed(1)+'" width="'+VIEW.w.toFixed(1)+'" height="'+VIEW.h.toFixed(1)+'" fill="none" pointer-events="all"/>';
  s+=starfield();
  
  var gnow=G.gen||0;
  for(i=0;i<SECTORS.length;i++){
    if(i>0&&!proSee('sectors')) continue;
    var open=sectorOpen(G,i);
    var cls=classFor(i,gnow);                       // cheapest hull class that can serve this sector
    s+='<ellipse cx="'+CX+'" cy="'+CY+'" rx="'+(SECTORS[i].r*1.32)+'" ry="'+(SECTORS[i].r*0.90)+'" fill="none" stroke="'+(open?'#1B2husk':'#141C25')+'" stroke-width="'+F(1)+'" opacity="'+(open?1:0.5)+'"/>';
    var note='', ncol=(open?INK2:INK3);
    if(!cls){ note=T('needsGen').replace('{g}',roman(genForSector(i))); ncol=RED2 }
    else if(cls!=='courier'){ note=T(cls).toUpperCase()+'+'; ncol=INK2 }
    var lx0=CX+SECTORS[i].r*1.32+8*Z, ly0=CY+((i%3)-1)*20*Z;   // stagger: six names on one line is a smear
    s+='<text x="'+lx0+'" y="'+ly0+'" fill="'+ncol+'" font-size="'+F(10)+'" letter-spacing="'+F(2)+'" class="nm">'+esc(SECTORS[i].name)+'</text>';
    if(note) s+='<text x="'+lx0+'" y="'+(ly0+10*Z)+'" fill="'+ncol+'" font-size="'+F(8.5)+'" letter-spacing="'+F(1)+'">'+esc(note)+'</text>';
  }
  s=s.replace(/#1B2husk/g,'rgba(242,241,236,.16)').replace(/#141C25/g,'rgba(242,241,236,.08)');

  // v4.21 (F-21): the six lobes, the sides of the world — a dotted edge each, a name at the rim
  if(proSee('sectors')){
    var rO=secRadius(SECTORS.length-1)+44, e, me, ca, sa;
    for(i=0;i<LOBES;i++){
      e=lobeEdge(i); ca=Math.cos(e); sa=Math.sin(e);
      s+='<line x1="'+(CX+ca*34*Z)+'" y1="'+(CY+sa*34*Z)+'" x2="'+(CX+ca*rO*1.32)+'" y2="'+(CY+sa*rO*0.90)+'" stroke="rgba(242,241,236,.26)" stroke-width="'+F(1)+'" stroke-dasharray="'+F(2)+' '+F(6)+'" pointer-events="none"/>';
      me=lobeMid(i); ca=Math.cos(me); sa=Math.sin(me);
      s+='<text x="'+(CX+ca*rO*1.32+ca*30*Z)+'" y="'+(CY+sa*rO*0.90+sa*30*Z+(sa>0.9?6*Z:0))+'" fill="'+INK3+'" font-size="'+F(11)+'" letter-spacing="'+F(3)+'" text-anchor="'+(ca>0.1?'start':(ca<-0.1?'end':'middle'))+'" class="nm" pointer-events="none">'+esc(T('lobe'+i).toUpperCase())+'</text>';
    }
  }
  // two rings: where the couriers stop, and where the whole fleet stops
  function ring(lim,col,op,label,up){
    var rr = lim>=SECTORS.length-1 ? secRadius(SECTORS.length-1)+44 : (secRadius(lim)+secRadius(lim+1))/2;
    s+='<ellipse cx="'+CX+'" cy="'+CY+'" rx="'+(rr*1.32)+'" ry="'+(rr*0.90)+'" fill="none" stroke="'+col+'" stroke-width="'+F(1.2)+'" stroke-dasharray="'+F(9)+' '+F(6)+'" opacity="'+op+'"/>';
    var ty=CY+(up?-(rr*0.90+9*Z):(rr*0.90+15*Z));
    s+='<text x="'+CX+'" y="'+ty+'" fill="'+col+'" font-size="'+F(10)+'" letter-spacing="'+F(2)+'" text-anchor="middle">'+esc(label)+'</text>';
  }
  if(proSee('rings')) ring(classRange('courier',gnow),INK3,0.9,fill(T('ringCourier'),{n:classRange('courier',gnow)+1}),false);
  if(proSee('rings')) ring(classRange('freighter',gnow),RED,0.8,fill(T('ringFleet'),{g:roman(gnow),n:classRange('freighter',gnow)+1}),true);
  // links
  for(var k in G.colonies){
    p=planet(k); xy=pos(p); var c=G.colonies[k];
    s+='<line x1="'+CX+'" y1="'+CY+'" x2="'+xy.x+'" y2="'+xy.y+'" stroke="'+(c.dark?RED:KCOL[p.kind])+'" stroke-width="'+F(1)+'" opacity="'+(c.dark?0.85:0.5)+'" '+(c.dark?'stroke-dasharray="'+F(5)+' '+F(4)+'"':'')+'/>';
  }

  // planets
  var terse = Z>1.75;                    // zoomed right out: names only, or the chart is a wall of text
  for(i=0;i<PLANETS.length;i++){
    p=PLANETS[i]; xy=pos(p);
    if(!proWorldVisible(p.id)) continue;
    var open=sectorOpen(G,p.sec), col=G.colonies[p.id], selq=(U.sel===p.id), ghost=!!(G.ghost&&G.ghost[p.id]);
    var railed = U.pro.on && proTask().pulse.indexOf('world:'+p.id)>=0;
    if(ghost){
      s+='<g class="ghost"><text x="'+xy.x+'" y="'+(xy.y+1*Z)+'" fill="'+INK3+'" font-size="'+F(13)+'" text-anchor="middle">×</text>'+
         '<text x="'+(xy.x+12*Z)+'" y="'+(xy.y-2*Z)+'" fill="'+INK3+'" font-size="'+F(10)+'" letter-spacing="'+F(1)+'" class="nm">'+esc(p.name.toUpperCase())+'</text></g>';
      continue;
    }
    var kc=KCOL[p.kind];
    var fillc = col ? (col.dark?RED:kc) : 'none';
    var strokec = col ? (col.dark?RED:kc) : (open?kc:INK3);
    var r = (col?6.5:5)*Z;
    var dead=col&&!col.dark&&G.reserves[p.id]<=0, waitHulls=col&&!col.dark&&!dead&&!onLine(G,p.id).length;
    s+='<g class="pnode'+(dead?' dead':(waitHulls?' waithulls':''))+'" data-p="'+p.id+'" tabindex="0" role="button" aria-label="'+esc(p.desig+' '+p.name)+'">';
    if(dead||waitHulls) s+='<circle class="blinkring" cx="'+xy.x+'" cy="'+xy.y+'" r="'+(r+11*Z)+'" fill="none" stroke="'+(dead?RED:'#4aa3ff')+'" stroke-width="'+F(2)+'"/>';
    if(selq) s+='<circle cx="'+xy.x+'" cy="'+xy.y+'" r="'+(r+8*Z)+'" fill="none" stroke="'+RED+'" stroke-width="'+F(1.5)+'"/>';
    if(railed) s+='<circle class="railring" cx="'+xy.x+'" cy="'+xy.y+'" r="'+(r+14*Z)+'" fill="none" stroke="'+RED+'" stroke-width="'+F(2)+'"/>';
    if(col&&!col.dark){ var lrm=lineRate(G,p.id);
      if(lrm&&(lrm.piling||lrm.makes<=0.001)) s+='<text x="'+(xy.x-1*Z)+'" y="'+(xy.y-r-9*Z)+'" fill="'+(lrm.makes<=0.001?RED:RED2)+'" font-size="'+F(12)+'" text-anchor="middle" class="nm">!</text>';
    }
    s+=(col||!open)?mark(p.kind,xy.x,xy.y,r,fillc,strokec,F(1.2)):'<g opacity="0.6">'+mark(p.kind,xy.x,xy.y,r,fillc,strokec,F(1.2))+'</g>';
    if(open){
      var lx=xy.x+r+7*Z, ly=xy.y-12*Z;
      var detail = !terse || !!col || selq;
      s+='<text x="'+lx+'" y="'+ly+'" fill="'+(col?INK:INK2)+'" font-size="'+F(11)+'" letter-spacing="'+F(1)+'" class="nm">'+esc(p.name.toUpperCase())+'</text>';
      if(detail){
        var kw=T({mine:'mapMine',farm:'mapFarm',well:'mapFuel',works:'mapWorks'}[p.kind]);
        s+='<text x="'+lx+'" y="'+(ly+12*Z)+'" fill="'+(col?INK2:INK3)+'" font-size="'+F(9)+'" letter-spacing="'+F(1)+'">'+kw+' · '+p.dist+'</text>';
        if(col&&!col.dark){
          // live metrics, always on screen: hands, what it makes, what is sitting there
          var cap=popCap(p), hands=Math.round(col.pop);
          var lr2=lineRate(G,p.id);
          var rate = p.kind==='works'
            ? ((col.store.metal>1&&col.store.food>1)? (col.pop*p.rich*K.REFINE) : 0)
            : (lr2? lr2.makes : 0);
          var dep = p.kind==='works'?'parts':p.dep;
          var pile = Math.round(col.store[dep]||0);
          var hcol = hands>=cap*0.8?INK:(hands>=cap*0.4?INK2:RED2);
          var rcol = rate>0.001?INK2:RED;
          /* v4.10 (Nikita, 27.09): only people and the pile, each with its icon */
          var pc=pile>300?RED2:RCOL[dep];
          s+='<use href="#i-people" x="'+lx+'" y="'+(ly+17*Z)+'" width="'+F(9)+'" height="'+F(9)+'" style="color:'+hcol+'"/>'+
             '<text x="'+(lx+11*Z)+'" y="'+(ly+25*Z)+'" font-size="'+F(9)+'" fill="'+hcol+'" letter-spacing="'+F(0.5)+'">'+hands+'</text>'+
             '<use href="#i-'+dep+'" x="'+lx+'" y="'+(ly+29*Z)+'" width="'+F(9)+'" height="'+F(9)+'" style="color:'+pc+'"/>'+
             '<text x="'+(lx+11*Z)+'" y="'+(ly+37*Z)+'" font-size="'+F(9)+'" fill="'+pc+'" letter-spacing="'+F(0.5)+'">'+pile+'</text>';
        } else if(col&&col.dark){
          s+='<text x="'+lx+'" y="'+(ly+24*Z)+'" font-size="'+F(9)+'" fill="'+RED+'" letter-spacing="'+F(1)+'">'+T('mapDark')+'</text>';
        } else {
          /* v4.11 (Nikita, 28.09: '×0.7 и проценты — бесполезно'): an unsettled world says only how many it can hold */
          s+='<use href="#i-people" x="'+lx+'" y="'+(ly+17*Z)+'" width="'+F(9)+'" height="'+F(9)+'" style="color:'+INK3+'"/>'+
             '<text x="'+(lx+11*Z)+'" y="'+(ly+25*Z)+'" font-size="'+F(9)+'" fill="'+INK3+'" letter-spacing="'+F(0.5)+'">'+popCap(p)+'</text>';
        }
      }
    }
    s+='<circle class="hit" cx="'+xy.x+'" cy="'+xy.y+'" r="'+F(20)+'"/></g>';
  }

  // earth
  var nearNight = G.night && nightLeft(G)<=K.NIGHT_NEAR;
  s+='<circle cx="'+CX+'" cy="'+CY+'" r="'+F(26)+'" fill="none" stroke="'+(nearNight?RED:INK)+'" stroke-width="'+F(1)+'" opacity="0.7"/>';
  s+='<circle cx="'+CX+'" cy="'+CY+'" r="'+F(12)+'" fill="'+(nearNight?RED:INK)+'"/>';
  s+='<text x="'+CX+'" y="'+(CY+38*Z)+'" fill="'+INK+'" font-size="'+F(10)+'" letter-spacing="'+F(3)+'" text-anchor="middle" class="nm">'+T('mapEarth')+'</text>';

  // ships
  for(i=0;i<G.ships.length;i++){
    var sh=G.ships[i]; if(sh.mode!=='transit'&&sh.mode!=='missing') continue;
    var A=nodeXY(sh.origin), B=nodeXY(sh.dest||sh.target);
    if(!A||!B) continue;
    var f = sh.total? (1-sh.t/sh.total) : 0;
    if(sh.mode==='missing') f = sh.lastT!==undefined?sh.lastT:0.55; else sh.lastT=f;
    var x=A.x+(B.x-A.x)*f, y=A.y+(B.y-A.y)*f;
    s+='<line x1="'+A.x+'" y1="'+A.y+'" x2="'+B.x+'" y2="'+B.y+'" stroke="'+INK2+'" stroke-width="'+F(0.6)+'" stroke-dasharray="'+F(2)+' '+F(5)+'" opacity="0.35" pointer-events="none"/>';
    if(sh.mode==='missing'){
      s+='<circle cx="'+x+'" cy="'+y+'" r="'+F(8)+'" fill="none" stroke="'+RED+'" stroke-width="'+F(1)+'" stroke-dasharray="'+F(2)+' '+F(3)+'"/>';
      s+='<text x="'+x+'" y="'+y+'" fill="'+RED+'" font-size="'+F(10)+'" text-anchor="middle" class="nm">?</text>';
    } else {
      var scls=shipClass(sh), sw=(scls==='freighter'?28:(scls==='hauler'?20:14)), swz=sw*Z, shz=swz*0.625, flip=(B.x<A.x)?-1:1;
      s+='<use href="#i-'+scls+'" x="'+(-swz/2)+'" y="'+(-shz/2)+'" width="'+swz+'" height="'+shz+'" fill="'+INK+'" pointer-events="none" transform="translate('+x+' '+y+') scale('+flip+' 1)"/>';   // v4.19: a hull parked on a world sat over its centre and ate the click (prologue stage 2)
    }
  }
  el('map').innerHTML=s;
}

/* ---------- header / resources / log ---------- */
function drawHeader(){
  var E=G.earth;
  el('h-day').textContent=G.day;
  ['h-stab','h-reach','h-sectors','h-night'].forEach(function(id){ var c=el(id).parentElement; c.hidden=!proSee('stats') });   // v4.13: Output and Drive cells are gone
  var wt=document.querySelector('.tab[data-tab="worlds"]'); if(wt) wt.hidden=!proSee('worlds');
  el('h-stab').textContent=n0(E.people);
  el('h-stab').className='v'+(G.hungry?' bad':(E.people>120?' good':''));
  var sb=el('h-stabbar'); sb.style.width=Math.max(0,Math.min(100,E.people/3))+'%';
  sb.style.background = G.hungry?'var(--red)':'var(--ink)';
  el('h-sectors').textContent=SECTORS.length;
  el('h-reach').textContent=reach(G);
  var nl=nightLeft(G);
  /* v4.0 — two dates: the year the sun fails, and the year the ark drive is ready at this pace */
  el('h-night').textContent= nl===null? T('nightUnknown') : G.night;
  el('h-night').className='v'+(nl===null?' dim':(nl<=K.NIGHT_NEAR?' bad':' warn'));
  el('h-nightsub').textContent= nl===null? '' : (nl<=0?T('nightNow'):fill(T('nightIn'),{n:nl}));
  var ac=arkHead(); el('h-arkcell').hidden=!ac||!proSee('stats');
  if(ac){ el('h-arkk').textContent=T('hArkDrive')+' '+roman(G.arkMark); el('h-arkd').textContent=ac.v; el('h-arkd').className='v '+ac.c; el('h-arkdsub').textContent=ac.rest; el('h-arkcell').title=ac.sub }
  el('b-pause').textContent=U.paused?'▶':'❚❚';
  el('b-pause').classList.toggle('on',U.paused);
  var b=document.querySelectorAll('[data-spd]');
  for(var i=0;i<b.length;i++) b[i].classList.toggle('on',+b[i].dataset.spd===U.speed&&!U.paused);
  var ap=el('b-auto'); if(ap){ ap.textContent=T('ffBtn'); ap.classList.toggle('on',U.ff); ap.title=T('ffHint') }
  el('b-lang').textContent=U.lang==='en'?'RU':'EN';
  var sb=el('b-sfx'); if(sb){ sb.classList.toggle('mute',!SFX.isOn()); sb.title=T(SFX.isOn()?'sfxOn':'sfxOff'); sb.setAttribute('aria-pressed',SFX.isOn()?'true':'false') }
    var tt=document.querySelectorAll('[data-t]');
  for(i=0;i<tt.length;i++) tt[i].textContent=T(tt[i].dataset.t);
}

/* v4.0: what the second date says. null before the Night has a date. */
function arkHead(){
  if(!G.night) return null;
  var gm=roman(G.arkMark), lvl=G.driveLvl||0, gen=fill(T('genSep'),{g:gm});
  function out(v,c,rest){ return {v:v,c:c,rest:rest,sub:gen+' \u00b7 '+rest} }
  if(arkReady(G)){
    var w=arkWake(G), rest=fill(T('arkdWake'),{w:Math.round(w*100)});
    if(w<1){ var f2=driveForecast(G,lvl+1);
      if(f2.st==='ok'&&f2.y<G.night) rest+=' \u00b7 '+fill(T('arkdNext'),{g:roman(lvl+1),y:f2.y,w:Math.round(wakeAt(G,lvl+1)*100)}); }
    return out(T('arkdReady'),'good',rest);
  }
  var f=driveForecast(G,G.arkMark);
  if(f.st==='ok'){
    var late=f.y-G.night;
    return out('\u2248'+f.y, late>0?'bad':(late>-K.NIGHT_NEAR/2?'warn':'good'),
      fill(T(late>0?'arkdLate':'arkdSpare'),{n:Math.abs(late)})+(settledCount(G)<f.rn?' \u00b7 '+fill(T('arkdReachLater'),{n:f.rn}):''));
  }
  if(f.st==='settled') return out('\u2014','bad',fill(T('arkdReach'),{n:f.n,r:f.r}));
  if(f.st==='host') return out('\u2014','bad',fill(T('arkdHost'),{n:K.DRIVE_POP}));
  return out('\u2014','bad',T('arkdStall'));
}

/* v3.7 (Nikita, 23.09): a resource that is being spent faster than it comes in must say so.
   Earth's own output minus its burn is not the truth — the lines bring most of what arrives — so the
   trend is the real change of the stockpile over the last TREND_YEARS, deliveries included. */
var TREND_YEARS=60;
function trendTick(){
  var E=G.earth, h=U.hist;
  if(h.length&&h[h.length-1].day===G.day) return;
  if(h.length&&h[h.length-1].day>G.day) U.hist=h=[];          // new run
  h.push({day:G.day,metal:E.metal,food:E.food,fuel:E.fuel,parts:E.parts,people:E.people});
  if(h.length>TREND_YEARS+5) h.splice(0,h.length-(TREND_YEARS+5));
}
function trend(k){
  var h=U.hist; if(h.length<6) return null;
  var a=h[Math.max(0,h.length-1-TREND_YEARS)], b=h[h.length-1];
  var yrs=b.day-a.day; if(yrs<5) return null;
  return (b[k]-a[k])/yrs;
}
function trendHtml(k,extra){
  var t=trend(k);
  if(t===null) return '<span class="dim">'+(extra||'')+'</span>';
  var up=t>=0.05, down=t<=-0.05; if(!up&&!down) t=0;
  var arrow=up?'▲':(down?'▼':'—'), cls=up?'up':(down?'down':'flat');
  return '<span class="'+cls+'">'+arrow+' '+(t>0?'+':'')+t.toFixed(1)+T('perYear')+'</span>'+(extra?' <span class="dim">'+extra+'</span>':'');
}
function drawRes(){
  var E=G.earth;
  trendTick();
  function cell(k,v,d,cls){return '<div class="rcell r-'+k+'"><div class="k">'+ico(k)+T(k)+'</div><div class="v'+(cls?' '+cls:'')+'">'+v+'</div><div class="d">'+d+'</div></div>'}
  var nd=G.need||{food:K.EARTH_EAT,metal:K.EARTH_BURN};
  var fd=Math.floor(E.food/Math.max(0.1,nd.food)), md=Math.floor(E.metal/Math.max(0.1,nd.metal));
  el('res').innerHTML=
    (proSee('metal')?cell('metal',n0(E.metal),trendHtml('metal','+'+E.pMetal.toFixed(1)+' −'+nd.metal.toFixed(1)), md<25?'bad':''):'')+
    (proSee('food')?cell('food',n0(E.food),trendHtml('food','+'+E.pFood.toFixed(1)+' −'+nd.food.toFixed(1)), fd<25?'bad':''):'')+
    (proSee('fuel')?cell('fuel',n0(E.fuel),trendHtml('fuel','+'+E.pFuel.toFixed(1)), E.fuel<25?'warn':''):'')+
    (proSee('parts')?cell('parts',n0(E.parts),trendHtml('parts',T('kWorks').toLowerCase()),''):'')+
    cell('people',n0(E.people),trendHtml('people',T('onEarth').toLowerCase()),'');
}

var TRAFFIC={kit_loaded:1,pickup:1,delivered:1,launch_colony:1,launch_evac:1,launch_search:1,launch_punitive:1,order_sent:1,reassigned:1,ship_ordered:1,ship_ready:1,scrapped:1,scrapped_many:1,dropped:1,relay_up:1,relief_done:1};
function drawLog(){
  var out='', n=0, unread=0, unreadBad=false;
  // G.log is capped at 400 and shifts; track "seen" by a running count of entries ever logged
  G.logTotal = G.logTotal||0;
  for(var i=G.log.length-1;i>=0&&n<120;i--){
    var e=G.log[i], tpl=LOG[U.lang][logKey(e)];
    if(!tpl||tpl==='—') continue;
    /* v4.2: three views. 'desk' (default) hides the freight receipts — pickups, deliveries, launches,
       order acknowledgements — that were 45 of the last 60 lines in Nikita's run and buried every voice. */
    var hide = U.logMode==='chron' ? TONE[e.code]!=='ch' : (U.logMode==='desk' ? !!TRAFFIC[e.code] : false);
    if(hide){ if((e.seq||0)>U.logSeen){ unread++; if(TONE[e.code]==='bd') unreadBad=true } continue }
    var d={}; for(var k in e.d) d[k]=e.d[k];
    if(d.p&&planet(d.p)) d.p=pname(d.p);
    if(d.dep) d.dep=DEP[U.lang][d.dep]||d.dep;
    if(d.g!==undefined) d.g=roman(d.g);   // v4.0: generations read as roman numerals, like the header
    if(d.t!==undefined&&String(e.code).slice(0,4)==='kit_') d.t=roman(d.t-1);   // v4.4: kit tiers too
    if(e.code==='voice') d=voiceLine(e);
    var isNew = (e.seq||0) > U.logSeen;
    if(isNew){ unread++; if(TONE[e.code]==='bd') unreadBad=true }
    out+=logLine(e,tpl,d,isNew); n++;
  }
  setHTML('log',out||('<div class="le dim"><span class="d">----</span><span>'+T('logEmpty')+'</span></div>'));
  var bd=el('logbadge'); if(bd){ bd.hidden=!unread; bd.textContent=fill(T('newEntries'),{n:unread}); bd.className=unreadBad?'bad':'' }
  var bx=el('b-logx'); if(bx) bx.textContent=T(U.logBig?'collapse':'expand');
  var bf=el('b-logf'); if(bf){ bf.textContent=T(U.logMode==='chron'?'logChron':(U.logMode==='all'?'logAll':'logDesk')); bf.classList.toggle('on2',U.logMode!=='all') }
  el('btm').classList.toggle('big',!!U.logBig);
}
/* shift lines rotate between variants so a long calm run does not read as one sentence pasted ten times */
function logKey(e){ if(e.code!=='shift') return e.code; var b='shift_'+e.d.k, v=(e.d.n||0)%3; return (v&&LOG[U.lang][b+(v+1)])?b+(v+1):b }
function logLine(e,tpl,d,isNew){
  var ch=TONE[e.code]==='ch';
  if(e.code==='voice') return '<div class="le vo'+(isNew?' new':'')+'"><span class="d">'+String(e.day).padStart(4,'0')+'</span><span><b class="vn">'+esc(d.who)+' '+esc(d.name)+'</b>'+esc(d.line)+'</span></div>';
  return '<div class="le '+(TONE[e.code]||'')+(isNew?' new':'')+'"><span class="d">'+String(e.day).padStart(4,'0')+'</span><span>'+(ch?'<b class="ct">'+T('chronTag')+'</b>':'')+esc(fill(tpl,d))+'</span></div>';
}
/* the last k chronicle lines, for the epilogue */
function chronLines(k){
  var out='', n=0;
  for(var i=G.log.length-1;i>=0&&n<k;i--){ var e=G.log[i]; if(TONE[e.code]!=='ch') continue;
    var tpl=LOG[U.lang][logKey(e)]; if(!tpl) continue;
    var d={}; for(var q in e.d) d[q]=e.d[q]; if(d.p&&planet(d.p)) d.p=pname(d.p); if(d.dep) d.dep=DEP[U.lang][d.dep]||d.dep; if(d.g!==undefined) d.g=roman(d.g); if(d.t!==undefined&&String(e.code).slice(0,4)==='kit_') d.t=roman(d.t-1);
    out=logLine(e,tpl,d,false)+out; n++ }
  return out?'<div class="mhead" style="margin-bottom:6px">'+T('endChron')+'</div><div class="chron">'+out+'</div>':'';
}
function logSeen(){ var m=0; for(var i=0;i<G.log.length;i++) if((G.log[i].seq||0)>m) m=G.log[i].seq; U.logSeen=m; drawLog() }

/* clickable pickers that survive a redraw, unlike a native <select> */
function shipChips(list){
  if(!list.length) return '<div class="dim">'+T('noShips')+'</div>';
  if(U.pickShip!==null&&!list.some(function(s){return s.id===U.pickShip})) U.pickShip=null;
  if(U.pickShip===null) U.pickShip=list[0].id;
  // newest generation first, big hulls first inside it, then by number
  var sorted=list.slice().sort(function(a,b){ return (hullGen(b)-hullGen(a)) || (HULLS[b.hull].cap-HULLS[a.hull].cap) || (a.id-b.id) });
  var out='', lastG=null;
  sorted.forEach(function(s){
    var g=hullGen(s);
    if(g!==lastG){ out+='<div class="chipsep">'+fill(T('genSep'),{g:roman(g)})+'</div>'; lastG=g }
    var free = s.mode==='idle'&&s.at==='earth'&&!(s.from&&s.to);
    var far = U.sel&&planet(U.sel)&&!canReachSector(s,planet(U.sel).sec);
    var here=U.sel&&planet(U.sel)&&!far&&free ? fill(T('legDays'),{n:legDays(G,U.sel,'earth',s)}) : null;
    var sub=far?fill(T('outOfRange'),{n:shipRange(s)+1}):((s.from&&s.to)?fill(T('lineTo'),{a:nodeName(s.from),b:nodeName(s.to)}):(here||(free?T('freeNow'):shipState(s))));
    out+='<button type="button" class="chip'+(U.pickShip===s.id?' on':'')+(free?' free':'')+(far?' far':'')+'" data-ship="'+s.id+'">'+
      '<b>'+sico(HULLS[s.hull].key)+esc(hullName(HULLS[s.hull]))+'<span class="no">'+esc(fill(T('hullNo'),{n:s.id}))+'</span></b>'+
      '<i>'+esc(fill(T('capacity'),{n:s.cap})+' · '+speedTxt(HULLS[s.hull])+' · '+sub)+'</i></button>';
  });
  return '<div class="chips">'+out+'</div>';
}
/* the hulls a world can actually be given: free at Earth and rated for its sector */
function assignable(pid){
  var p=planet(pid);
  return freeHulls().filter(function(s){return !(s.from&&s.to)&&p&&canReachSector(s,p.sec)});

function busyFarLine(pid){
  var p=planet(pid); if(!p) return '';
  var busy=0, far=0;

  // the ark, once the Night has a date

/* v4.10 (Nikita, 27.09: 'слишком много непонятных цифр'): the seam is told in years at the current pace, not units */
function seamYears(pid){ var res=G.reserves[pid], c=G.colonies[pid], p=planet(pid); if(!c) return n0(res)+' '+(DEP[U.lang][p.dep]||p.dep);
  var rate=c.pop*p.rich*K.PROD*rateMult(c); if(rate<=0.001) return n0(res)+' '+(DEP[U.lang][p.dep]||p.dep); return fill(T('seamYears'),{n:n0(Math.round(res/rate))}) }
/* v4.11 (Nikita, 28.09): a bar for the pile, and the slice one hull takes per trip — the picked hull if one is
   picked, else the biggest hull on the line */
function pileBar(p,c,dep){
  var pile=Math.max(0,c.store[dep]||0);
  var pk=U.pickShip!==null?shipById(G,U.pickShip):null, hull=(pk&&pk.mode==='idle'&&!(pk.from&&pk.to))?pk:null;
  if(!hull){ var best=null; onLine(G,p.id).forEach(function(o){ if(!o.retire&&(!best||o.cap>best.cap)) best=o }); hull=best }
  var cap=hull?hull.cap:0, scale=Math.max(pile,cap,1), pw=Math.round(pile/scale*100), cw=Math.round(Math.min(cap,pile)/scale*100);
  var lbl= cap ? (pile<1 ? T('pileEmpty') : (cap>=pile ? fill(T('pileAll'),{s:n0(pile),c:n0(cap)}) : fill(T('pileShare'),{s:n0(pile),c:n0(cap),n:n0(cap),p:Math.round(cap/pile*100)}))) : T('pileNoHull');   // v4.18 (Nikita: 'не понятно что означает этот слайдер красный'): numbers, no red   // v4.13: pileNoHull no longer says 'pick one'
  return '<div class="pile"><div class="pile-bar"><i class="pile-fill" style="width:'+pw+'%"></i>'+(cap?'<i class="pile-take" style="width:'+cw+'%"></i>':'')+'</div><div class="pile-lbl dim">'+lbl+'</div></div>';
}
/* v4.18 (Nikita, 04.10: 'при эвакуации снимал население только курьер. Любой свободный по нажатию назначается'):
   the free courier that can lift everyone and gets there first; else the biggest one */
function pickCourier(pid){ var p=planet(pid), c=G.colonies[pid], pop=c?Math.floor(c.pop):0;
  var list=freeHulls().filter(function(s){ return !(s.from&&s.to)&&!s.pend&&!s.job&&!s.retire&&HULLS[s.hull].key==='courier'&&p&&canReachSector(s,p.sec) });
  if(!list.length) return null;
  var fit=list.filter(function(s){return s.cap>=pop}).sort(function(a,b){ return legDays(G,pid,'earth',a)-legDays(G,pid,'earth',b) || a.cap-b.cap });
  if(fit.length) return fit[0];
  return list.sort(function(a,b){return b.cap-a.cap})[0] }
function evacInfo(p,c){
  var evg=G.ships.some(function(o){return o.job==='evac'&&o.dest===p.id&&o.mode==='transit'}); if(evg) return '';
  var s=pickCourier(p.id), pop=Math.floor(c.pop);
  if(!s){ var nh=nextHome(G,p.id,'courier'); return '<div class="warn" style="font-size:12px;line-height:1.45;margin-top:6px">'+esc(fill(T('evacNoCourierHint'),{w:nh?fill(T('evacW_wait'),{n:nh.id,l:nh.t}):T('evacW_orderC')}))+'</div>' }
  return '<div class="'+(s.cap<pop?'warn':'dim')+'" style="font-size:12px;line-height:1.45;margin-top:6px">'+esc(fill(T(s.cap<pop?'evacShort':'evacWho'),{n:s.id,h:hullName(HULLS[s.hull]),c:s.cap,k:pop,l:pop-s.cap,y:legDays(G,p.id,'earth',s)}))+'</div>';
}

  h+='<div class="blk bigstat wc wc-body" style="--acc:'+KCOL[p.kind]+'"><div class="bs-row">'+

    '</div>'+(bigVerdict?'<div class="bs-verdict '+bigCls+'">'+bigVerdict+'</div>':'')+(lrB&&lrB.hulls?'<div class="bs-rates dim">'+fill(T('rateLine'),{m:lrB.makes.toFixed(1),h:lrB.carries.toFixed(1)})+'</div>':'')+pileBar(p,c,depB)+

/* v4.6: the line as a standing order — 'two haulers here'; the yards do the rest */
function lineBlock(p,c){

    var yard=all.filter(function(o){return shipClass(o)===cls&&o.mode==='building'}).length;
    var retiring=all.filter(function(o){return o.retire&&shipClass(o)===cls&&o.mode!=='building'}).length;

    if(flying) st+=(st?' · ':'')+fill(T('lineFlying'),{n:flying});
    if(yard) st+=(st?' · ':'')+fill(T('lineYard'),{n:yard});

    if(gtxt) st+=(st?' \u00b7 ':'')+fill(T('lineGens'),{g:gtxt});

    rows+='<div class="so-row"><span class="so-name"><b>'+sico(cls)+(hh?hullName(hh):T(cls))+'</b><small>'+meta+'</small></span>'+   // v4.13: .so-row is big now (CSS)
      '<span class="so-cnt"><button class="btn sm" type="button" data-act="want" data-p="'+p.id+'" data-c="'+cls+'" data-n="'+(want-1)+'"'+off(want<=0?'why_zero':'ok')+'>&minus;</button>'+
      '<b>'+want+'</b><button class="btn sm plus" type="button" data-act="want" data-p="'+p.id+'" data-c="'+cls+'" data-g="'+selG+'" data-n="'+(want+1)+'"'+off(!reachOk?'range':(want>=12?'why_max':(G.reserves[p.id]<=0&&pileLeft(G,p.id)<1?'depleted':((!buildable&&!idleSel)?'gen_retired':'ok'))))+'>+</button></span>'+
      '<span class="so-st dim">'+(st||T('lineNone'))+'</span></div>';
  }
  /* v4.8 (Nikita, 27.09: 'хочу знать, чего и сколько на планете и какие суда там работают') */
  var hl='';
  all.slice().sort(function(a,b){return a.id-b.id}).forEach(function(o){
    var where= o.mode==='building' ? fill(T('lhYard'),{y:o.t}) : (o.mode==='idle' ? T('lhPier') : (o.dir==='out'? fill(T('lhOut'),{y:o.t}) : fill(T('lhBack'),{y:o.t})));
    var note= o.retire ? ' · <span class="warn">'+T('lhRetire')+'</span>' : (o.replaces?' · '+T('lhSuccessor'):'');
    hl+='<div class="lh"><b>'+sico(shipClass(o))+fill(T('lhName'),{n:o.id})+' · '+hullName(HULLS[o.hull])+'</b><span class="dim">'+where+note+(o.mode==='building'?'':' <button class="chip x" type="button" data-act="unroute" data-s="'+o.id+'" title="'+T('clear')+'">×</button>')+'</span></div>';   // v4.13: release lives here, the separate block is gone

function saveLog(){

  var api=(window.claude&&window.claude.use)?window.claude.use('downloads'):Promise.resolve(null);

    if(dl&&dl.save){ return dl.save({filename:name,data:data}).then(function(){ say('saved') },function(e){ if(!(e&&e.code==='declined')) say('savefail') }) }
    try{ var b=new Blob([data],{type:'application/json'}), u=URL.createObjectURL(b), a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(u) },500); say('saved') }catch(e){ say('savefail') }

}

function hullProgress(s){ var h=HULLS[s.hull], tot=Math.max(1,h?h.days:1); return Math.max(0,Math.min(1,1-(s.t||0)/tot)) }

function fleetRow(s){
  var h=HULLS[s.hull], cls=h.key, free=s.mode==='idle'&&s.at==='earth'&&!(s.from&&s.to), st, sub=[];
  var dest = s.pend&&s.pend.from?pname(s.pend.from):(s.lineFor?pname(s.lineFor):((s.from&&s.from!=='earth')?pname(s.from):''));
  if(s.mode==='building') st=fill(T('flYards'),{y:s.t});

  if(s.crew) sub.push(esc(n0(s.crew)+' '+T('people').toLowerCase()));
  var cg=(s.mode!=='building')?cargoTxt(s):''; if(cg) sub.push(cg);

  return '<div class="fl-row'+(free?' free':'')+(s.mode==='building'?' bld':'')+'"><div class="fl-top"><b>'+sico(cls)+esc(hullName(h))+' '+esc(fill(T('hullNo'),{n:s.id}))+'</b>'+

function fleetBody(){
  var ships=G.ships.filter(function(s){return s.mode!=='dead'});
  if(!ships.length) return '<div class="advbody"><div class="arow dim">'+T('flEmpty')+'</div></div>';
  var bld=[],free=[],work=[],other=[];
  ships.forEach(function(s){
    if(s.mode==='building') bld.push(s);

  function end(){ if(!drag) return; if(drag.moved) MAPDRAGGED=true; drag=null; m.classList.remove('drag') }
  window.addEventListener('pointerup',end);
  window.addEventListener('pointercancel',end);
})();

/* ---------- loop ---------- */
/* v4.2 (Nikita, 24.09: "игра слишком быстрая — сообщения не читаются"): the old clock ran a whole
   2900-year game in 11 real minutes at 3x. 1x is now a year every 1.5 s (a game is about an hour),
   10x is for the empty stretches. */
var MS={1:1500,2:750,4:375,10:150};
function frame(ts){
  if(!U.last) U.last=ts;
  var dt=ts-U.last; U.last=ts;
  if(!U.paused&&!G.over){
    U.acc+=dt;
    var step=MS[U.speed]||300, did=false;
    try{
      while(U.acc>=step){U.acc-=step;tick(G);did=true;
        /* v4.9 (Nikita, 27.09: 'остановка только на смене и при Ночи — железно'): nothing else stops the clock */
        if(G.shiftOpen){ if(U.pro.on||!U.shiftStop||U.ff) G.shiftOpen=false; else { U.paused=true; SFX.play('info'); break } }
        if(G.night&&!G.nightSeen&&!U.pro.on){ U.paused=true; SFX.play('crit'); break }
        if(G.pauseNow){ G.pauseNow=false; toastLast() }
        foodWatch();
        if(G.over)break}
      if(did) draw();
    }catch(e){
      // never let one bad tick kill the clock: pause, tell the player, keep the loop alive
      U.paused=true; U.acc=0;
      try{ log(G,'crash',{msg:String(e&&e.message||e),day:G.day}); act(G,'CRASH',{msg:String(e&&e.message||e)}); }catch(_){}
      try{ var tt=el('toast'); tt.textContent=fill(T('crashToast'),{msg:String(e&&e.message||e)}); tt.className='show bad'; }catch(_){}
      try{ draw() }catch(_){}
    }
  }
  requestAnimationFrame(frame);
}

function start(seed){
  G=newGame(seed||undefined);
  U.sel=null;U.tab='earth';U.paused=true;U.acc=0;U.intro=false;U.introStep=0;U.start=true;U.pro={on:false,stage:0,w:null,calls:[],seen:{}};U.hist=[];U.pf=null;U.voiceSeq=0;U.voiceLast=0;U.voy={};U.capt={};U.founded=0;
  VFIT=true; VSECS=-1; viewFit();
  window.LN=G; window.LNU=U; window.LNdraw=draw;   // dev hooks for the Playwright scenarios
  draw();
}
start();
requestAnimationFrame(frame);
})();
