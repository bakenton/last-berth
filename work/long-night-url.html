





<title>Last Berth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* LONG NIGHT — mission control, brutalist (v3.4, Nikita 23.09: "слишком ИИ").
   Three colours: black, bone white, one signal red. No fills, no gradients,
   no rounded corners, no glow. Hierarchy by size and weight, not by colour.
   Big numerals are the decoration. */
:root{
  --bg:#000000; --panel:#000000; --panel2:#070707; --panel3:#101010;
  --ink:#F2F1EC; --ink2:#9C9B95; --ink3:#5E5D58;
  --line:rgba(242,241,236,.18); --line2:rgba(242,241,236,.38);
  --red:#FF2A1A; --red2:#FFB1A8; --red3:#6E1A12;
  /* v3.5 (Nikita, 23.09): a free hull is green, and every resource has its own colour and icon */
  --green:#3DDC84; --green3:#14472B; --yellow:#FFD23F; --orange:#FF8A1F; --silver:#C9CFD6;
  /* legacy names the UI still refers to */
  --void:#000000; --text:var(--ink); --dim:var(--ink2); --faint:var(--ink3);
  --amber:var(--red); --amber-d:var(--red3); --teal:var(--ink); --rust:var(--red); --earth:var(--ink);
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --sans:'Inter Tight','Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;border-radius:0!important}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
input,textarea{-webkit-user-select:text;user-select:text}
button{font-family:var(--sans);color:inherit}
h1,h2,h3{margin:0;font-weight:800;text-wrap:balance;letter-spacing:-.01em}
::selection{background:var(--ink);color:var(--bg)}

#app{display:flex;flex-direction:column;height:100%;min-height:0}

/* ---- header: the year is the biggest thing on screen ---- */
#hdr{display:flex;align-items:stretch;border-bottom:1px solid var(--ink);background:var(--bg);flex:0 0 auto;flex-wrap:wrap}
.hcell{padding:8px 14px 7px;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-end;gap:1px;min-width:0}
.hcell .k{font-family:var(--sans);font-size:10px;letter-spacing:.16em;color:var(--ink2);text-transform:uppercase;white-space:nowrap;font-weight:600}
.hcell .v{font-family:var(--sans);font-size:26px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.02em}
#hdr .grow{flex:1 1 auto;border-right:0}
.hcell .hs{font-family:var(--mono);font-size:10.5px;color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums;margin-top:3px;overflow:hidden;text-overflow:ellipsis}
#hdr #h-arkcell{flex:1 1 0;min-width:110px}
#brand{display:flex;align-items:center;gap:10px;padding:8px 16px;border-right:1px solid var(--line)}
#brand b{font-size:15px;letter-spacing:.24em;font-weight:800}
#brand .dot{width:9px;height:9px;background:var(--red)}
.stabbar{width:110px;height:3px;background:var(--panel3);margin-top:4px}
.stabbar i{display:block;height:100%;background:var(--ink)}
.ctrls{display:flex;align-items:center;gap:0;padding:0 8px 0 0;margin-left:auto}
.sp{font-family:var(--sans);font-size:12px;font-weight:600;padding:0 9px;height:100%;min-height:44px;background:transparent;border:0;border-left:1px solid var(--line);cursor:pointer;letter-spacing:.08em;text-transform:uppercase}
.sp:hover{background:var(--panel3)}
.sp.on{background:var(--ink);color:var(--bg)}
.sp:focus-visible{outline:2px solid var(--red);outline-offset:-2px}

/* ---- resources: a strip of big numerals ---- */
#res{display:flex;flex:0 0 auto;border-bottom:1px solid var(--ink);background:var(--bg);flex-wrap:wrap}
.rcell{padding:8px 14px 7px;border-right:1px solid var(--line);min-width:120px;flex:1 1 auto}
.rcell:last-child{border-right:0}
.rcell .k{font-family:var(--sans);font-size:10px;letter-spacing:.16em;color:var(--ink2);text-transform:uppercase;font-weight:600}
.rcell .v{font-family:var(--sans);font-size:30px;line-height:1.05;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.rcell .d{font-family:var(--mono);font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums;margin-top:2px}
.rcell .d .up{color:var(--green);font-weight:600} .rcell .d .down{color:var(--red2);font-weight:600} .rcell .d .flat{color:var(--ink2)}

/* ---- body ---- */
#main{display:flex;flex:1 1 auto;min-height:0}
#mapwrap{flex:1 1 auto;min-width:0;position:relative;background:var(--bg)}
#ringsign{position:absolute;top:10px;right:10px;z-index:13;display:flex;flex-direction:column;align-items:flex-end;gap:6px;max-width:min(360px,58%);pointer-events:none}
#ringsign>*{pointer-events:auto}
#ringsign .rs,#ringsign .ng{display:block;text-align:left;cursor:pointer;background:var(--bg);color:var(--ink);border:1px solid var(--ink3);padding:8px 12px;font:inherit;max-width:100%}
#ringsign .rs b,#ringsign .ng b{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
#ringsign .rs span,#ringsign .ng span{display:block;margin-top:3px;font-size:12px;line-height:1.4;color:var(--ink2)}
#ringsign .rs.ok{border-color:var(--teal)}
#ringsign .rs.ok b{color:var(--teal)}
#ringsign .rs.urgent{border:2px solid var(--red);animation:lbblink 1.1s ease-in-out infinite}
#ringsign .rs.urgent b{color:var(--red)}
#ringsign .rs-range{font-size:11.5px;line-height:1.4;background:var(--bg);border:1px solid #e0b000;color:#e0b000;padding:6px 10px}
#ringsign .ng{border:2px solid var(--teal)}
#ringsign .ng b{color:var(--teal)}
.advtabs{display:flex;align-items:stretch;border-bottom:1px solid var(--line2)}
.advtab{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:7px;padding:8px 10px;background:var(--bg);border:0;border-right:1px solid var(--line);cursor:pointer;font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);text-align:left}
.advtab span{white-space:nowrap}
.advtab.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.advtab b{font-size:11px;padding:1px 7px;border:1px solid var(--ink3);font-weight:800}
.advtab.bad b{background:var(--red);border-color:var(--red);color:var(--bg)}
.advtab small{font-weight:400;letter-spacing:0;text-transform:none;color:var(--teal);font-size:10.5px;white-space:nowrap}
.advtog{flex:0 0 auto;width:34px;background:var(--bg);border:0;color:var(--ink);cursor:pointer}
.advtog em{font-style:normal}
.fl-grp{display:flex;gap:6px;align-items:center;margin:10px 0 2px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.fl-grp b{color:var(--ink)}
.fl-row{padding:6px 0 6px 8px;border-left:3px solid var(--ink3);border-bottom:1px solid var(--line);margin-top:3px}
.fl-row.free{border-left-color:var(--green)}
.fl-row.bld{border-left-color:var(--teal)}
.fl-top{display:flex;align-items:center;gap:8px;font-size:12.5px;flex-wrap:wrap}
.fl-top b{display:flex;align-items:center;font-size:12.5px}
.fl-to{color:var(--ink2);font-size:11.5px}
.fl-st{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink2);white-space:nowrap}
.fl-sub{font-family:var(--mono);font-size:10.5px;margin-top:2px;line-height:1.4}
.pbar{height:7px;margin:5px 0 2px;background:var(--panel3);border:1px solid var(--line2)}
.pbar>i{display:block;height:100%;background:var(--teal)}
.lg-box{margin:2px 0 8px}
.lg-hd{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.lg-hd b{color:var(--ink)}
.lg-row{display:flex;align-items:center;gap:6px;margin-top:4px}
.gtrack{flex:1 1 auto;display:flex;height:32px;border:1px solid var(--line2);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.gseg{flex:1 1 0;display:flex;align-items:center;justify-content:center;font-style:normal;border-right:1px solid var(--line)}
.gseg:last-child{border-right:0}
.gseg.fill{background:rgba(242,241,236,.12)}
.gseg.on{background:var(--ink);color:var(--bg)}
.gseg.old u{opacity:.55}
.gseg u{text-decoration:none;font-family:var(--mono);font-size:11px;pointer-events:none}
.lg-row .btn{width:auto;flex:0 0 auto;padding:0 12px;min-height:32px;margin:0}
#nofree{position:fixed;left:0;top:0;right:0;bottom:0;z-index:30;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;padding:20px}
#nofree .nf-box{max-width:560px;border:2px solid var(--red);background:var(--bg);padding:26px 28px}
#nofree h2{color:var(--red);letter-spacing:.14em;margin:0 0 12px;font-size:20px}
#nofree p{line-height:1.55;margin:0 0 18px}
#nofree .nf-row{display:flex;gap:10px;flex-wrap:wrap}
@media (max-width:640px){#ringsign{left:10px;right:10px;max-width:none;align-items:stretch}#mapwrap:has(#ringsign .rs) #advisor{top:104px}}
#map{width:100%;height:100%;display:block;touch-action:manipulation;cursor:grab}
#map.drag{cursor:grabbing}
#mapctl{position:absolute;right:14px;bottom:12px;z-index:12;display:flex;border:1px solid var(--line2)}
#mapctl .sp{min-width:36px;min-height:32px;text-align:center;border-left:1px solid var(--line2)}
#mapctl .sp:first-child{border-left:0}

#rail{flex:0 0 352px;border-left:1px solid var(--ink);background:var(--bg);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--ink);flex:0 0 auto}
.tab{flex:1;padding:11px 4px;background:transparent;border:0;border-right:1px solid var(--line);font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--ink2);cursor:pointer;text-transform:uppercase}
.tab:last-child{border-right:0}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--bg);background:var(--ink)}
.tab:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
#railbody{flex:1 1 auto;overflow-y:auto;min-height:0;padding:12px;display:flex;flex-direction:column;gap:12px}

.blk{border:1px solid var(--line2);background:var(--bg)}
.blk>h3{font-size:10px;font-family:var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink);padding:8px 10px;border-bottom:1px solid var(--line2);font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:center}
.blk>.bd{padding:10px;display:flex;flex-direction:column;gap:8px}
.rows{display:flex;flex-direction:column;gap:4px}
.row{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;padding:2px 0;border-bottom:1px solid rgba(242,241,236,.09)}
.row:last-child{border-bottom:0}
.q{font-style:normal;white-space:nowrap}
.q .ico{width:14px;height:14px;vertical-align:-3px}
.row span:first-child{color:var(--ink2)}
.row b{font-weight:600}
.good{color:var(--green)} .bad{color:var(--red)} .warn{color:var(--red2)} .dim{color:var(--ink2)}
/* resources: icon + colour, always together */
.ico{width:13px;height:13px;vertical-align:-2px;display:inline-block;margin-right:3px}
.c-metal{color:var(--silver)} .c-food{color:var(--green)} .c-fuel{color:var(--orange)} .c-parts{color:var(--ink)} .c-people{color:var(--yellow)}
.cost{display:inline-flex;flex-wrap:wrap;gap:0 9px;font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums;text-transform:none;letter-spacing:0;font-weight:500}
.cost i{font-style:normal;white-space:nowrap}
.cost i.short{color:var(--red)!important}
.rcell.r-metal .v{color:var(--silver)} .rcell.r-food .v{color:var(--green)} .rcell.r-fuel .v{color:var(--orange)} .rcell.r-people .v{color:var(--yellow)}
.rcell .v.bad{color:var(--red)} .rcell .v.warn{color:var(--red2)}
.rcell .k .ico{width:12px;height:12px;vertical-align:-2px}
/* ship chips: grouped by generation, free ones green */
.chipsep{flex:1 1 100%;font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);padding:5px 0 1px;border-bottom:1px solid var(--line);margin-bottom:2px}
.chip b{font-family:var(--sans);font-weight:700;font-size:11.5px;letter-spacing:.02em}
.chip .no{color:var(--ink2);font-weight:400;font-size:10px;margin-left:4px}
.chip.on .no{color:rgba(0,0,0,.6)}
.busyfar{font-family:var(--mono);font-size:10.5px;color:var(--ink2);padding:2px 0 4px}
/* the yard dock: build without leaving the map */
/* v3.7.1 (Nikita, 23.09: "окна перекрывают друг друга"): the dock and the advisor can be resized by hand
   (native handle, bottom-right corner), fold to their header, and layoutPanels() keeps the advisor
   from running into the dock. */
#dock{position:absolute;left:14px;bottom:12px;z-index:12;width:min(560px,calc(100% - 200px));border:1px solid var(--ink);background:rgba(0,0,0,.94);
  display:flex;flex-direction:column;max-height:calc(55% - 12px);min-width:260px;overflow:hidden;resize:both}
#dock.shut{resize:none;max-height:none}
#dock .dockbody{overflow-y:auto;min-height:0}
#dock.shut .dockbody{display:none}
.dockhd{cursor:pointer;user-select:none}
.dockhd em{font-style:normal;font-size:14px;line-height:1;width:12px;text-align:center;color:var(--ink2);flex:0 0 auto}
.dockhd{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line2);font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
.dockhd span{flex:1}
.dockrow{display:flex}
.dockrow+.dockrow{border-top:1px solid var(--line2)}
.dbtn{flex:1 1 0;min-width:0;padding:7px 9px;background:transparent;border:0;border-right:1px solid var(--line2);cursor:pointer;text-align:left;font-family:var(--sans);display:flex;flex-direction:column;gap:3px}
.dbtn:last-child{border-right:0}
.dbtn b{font-size:11.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 6px;align-items:baseline}
.dbtn b small{font-family:var(--mono);font-size:9.5px;font-weight:400;color:var(--ink2);letter-spacing:0;text-transform:none}
.dbtn .dsub{font-family:var(--mono);font-size:9.5px;color:var(--ink2)}
.dbtn:hover:not(:disabled){background:var(--panel3)}
.dbtn:disabled{cursor:not-allowed}
.dbtn b .hn{display:inline-flex;align-items:center;min-width:0}
.dbtn:disabled b,.dbtn:disabled .dsub{opacity:.45}
.dbtn.wide{flex-direction:row;align-items:center;justify-content:space-between}
.dbtn.ark b{color:var(--red2)}
/* journal: it has to be noticed */
#btm{flex:0 0 auto;border-top:1px solid var(--ink);background:var(--bg);display:flex;flex-direction:column;min-height:0;transition:none}
.loghd{display:flex;align-items:center;gap:8px;padding:0 0 0 14px;border-bottom:1px solid var(--line);flex:0 0 auto}
.loght{flex:1;font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);display:flex;align-items:center;gap:8px;padding:8px 0}
.loght b{font-family:var(--sans);font-size:10px;padding:1px 7px;background:var(--ink);color:var(--bg)}
.loght b.bad{background:var(--red)}
#logwrap{flex:1 1 auto;min-width:0;height:132px;overflow-y:auto;padding:6px 14px;display:block}
#btm.big #logwrap{height:46vh}
.le{font-family:var(--mono);font-size:12.5px;line-height:1.55;display:flex;gap:10px;color:var(--ink2);border-left:3px solid transparent;padding:2px 0 2px 8px}
.le:first-child{color:var(--ink)}
.le .d{color:var(--ink3);flex:0 0 auto;font-variant-numeric:tabular-nums}
.le.hi{color:var(--ink);border-left-color:var(--ink)} .le.gd{color:var(--green);border-left-color:var(--green)} .le.bd{color:var(--red);border-left-color:var(--red)}
.le.new{background:var(--panel3)}
/* the chronicle: the desk writing about itself */
.le.ch{color:var(--ink);border-left-color:var(--ink);background:var(--panel2);padding-top:5px;padding-bottom:5px}
.le.ch .d{color:var(--ink2)}
.ct{font-family:var(--sans);font-size:9px;letter-spacing:.16em;color:var(--ink2);margin-right:8px;font-weight:700;text-transform:uppercase}
.sp.on2{color:var(--ink);border-bottom:2px solid var(--ink)}
#ovbox .chron{border:1px solid var(--line2);margin:0 0 16px}
#ovbox .chron .le{padding-left:10px}

.btn{display:block;width:100%;text-align:left;padding:8px 10px;background:transparent;border:1px solid var(--line2);cursor:pointer;font-size:12px;font-weight:600;line-height:1.3;letter-spacing:.04em;text-transform:uppercase}
.btn:hover:not(:disabled){background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:hover:not(:disabled) .c{color:inherit}
.btn:disabled{opacity:.32;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.btn .c{float:right;font-family:var(--mono);font-size:11px;color:var(--ink2);text-transform:none;letter-spacing:0;font-weight:400}
.btn.prim{background:var(--red);border-color:var(--red);color:var(--bg)}
.btn.prim .c{color:rgba(0,0,0,.65)}
.btn.prim:hover:not(:disabled){background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.danger{border-color:var(--red3);color:var(--red2)}
.btn.danger:hover:not(:disabled){background:var(--red);border-color:var(--red);color:var(--bg)}
.btn.go{border-color:var(--green);color:var(--green)}
.btn.go:hover:not(:disabled){background:var(--green);border-color:var(--green);color:var(--bg)}
.btnrow{display:flex;gap:6px}.btnrow .btn{flex:1 1 auto;width:auto;text-align:left}.btnrow .btn+.btn{flex:0 0 auto;white-space:nowrap}

.meter{height:3px;background:var(--panel3)}
.meter i{display:block;height:100%;background:var(--ink)}
.tag{font-family:var(--mono);font-size:9px;letter-spacing:.1em;padding:2px 6px;border:1px solid var(--line2);color:var(--ink2);text-transform:uppercase}
.tag.a{color:var(--red2);border-color:var(--red3)}
.tag.t{color:var(--green);border-color:var(--green)}
.tag.r{color:var(--bg);background:var(--red);border-color:var(--red)}

.fld{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--ink2)}
.fld input{flex:1;background:var(--bg);border:1px solid var(--line2);color:var(--ink);font-family:var(--mono);font-size:12px;padding:5px 7px;min-width:0}
.fld input:focus{outline:1px solid var(--ink)}
select{width:100%;background:var(--bg);border:1px solid var(--line2);color:var(--ink);font-family:var(--mono);font-size:12px;padding:5px 6px}
.mhead{font-family:var(--sans);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin-top:2px;font-weight:700}

/* advisor: a black box with a hard edge, severity by a red bar */
#advisor{position:absolute;left:14px;top:12px;z-index:12;width:min(400px,calc(100% - 28px));
  border:1px solid var(--ink);background:rgba(0,0,0,.94);
  display:flex;flex-direction:column;max-height:min(46%,calc(100% - 24px));min-width:240px;overflow:hidden;resize:both}
#advisor.shut{resize:none}
.advhead{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;background:var(--bg);
  border:0;border-bottom:1px solid var(--line2);cursor:pointer;font-family:var(--sans);font-size:10px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink);text-align:left}
#advisor.shut .advhead{border-bottom:0}
.advhead span{flex:1}
.advhead b{font-family:var(--sans);font-size:11px;padding:1px 7px;border:1px solid var(--ink);font-weight:800}
.advhead.bad b{background:var(--red);border-color:var(--red);color:var(--bg)}
.advhead.warn b{color:var(--red2);border-color:var(--red2)}
.advhead.ok b,.advhead.clear b{color:var(--ink)}
.advhead em{font-style:normal;font-size:14px;line-height:1;width:12px;text-align:center;color:var(--ink2)}
.advbody{padding:0 10px 6px;overflow-y:auto;min-height:0}
.arow{display:flex;align-items:center;gap:8px;padding:6px 0 6px 8px;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.35;border-left:3px solid var(--ink3);margin-top:4px}
.arow:last-child{border-bottom:0}
.arow span{flex:1}
.dotm{display:none}
.arow:has(.dotm.bad){border-left-color:var(--red)}
.arow:has(.dotm.warn){border-left-color:var(--red2)}

не влезет."], ["MSG", "nocolony", "No settlement there.", "Поселения там нет."], ["MSG", "have", "Already built.", "Уже построено."], ["MSG", "dark", "That settlement is in revolt and takes no orders.", "Поселение в мятеже и приказов не принимает."], ["MSG", "pop", "Population too small.", "Населения слишком мало."], ["MSG", "metal", "Not enough metal ON SITE. Ship metal there first.", "Не хватает металла НА МЕСТЕ. Сначала привези туда металл."], ["MSG", "parts", "Not enough parts at Earth. Parts come from industrial worlds.", "На Земле не хватает деталей. Детали делают промышленные миры."], ["MSG", "pending", "An order to them is already in transit.", "Приказ им уже в пути."], ["MSG", "nodark", "That settlement is not in revolt.", "Это поселение не в мятеже."], ["MSG", "nomissing", "That hull is not missing.", "Этот корпус не числится пропавшим."], ["MSG", "running", "The drive programme is already under way.", "Программа гипердрайва уже идёт."], ["MSG", "notworks", "Only an industrial world can host it.", "Её может принять только промышленный мир."], ["MSG", "relay", "That world needs a relay station first.", "Этому миру сначала нужен ретранслятор."], ["MSG", "reach", "Not enough live worlds.", "Живых миров слишком мало."], ["MSG", "food", "Not enough rations at Earth.", "На Земле не хватает провизии."], ["MSG", "none", "Nothing to scrap.", "Списывать нечего."], ["MSG", "crew", "Not enough hands at Earth to man her.", "На Земле не хватает рук, чтобы её укомплектовать."], ["MSG", "evacuating", "A hull is already on its way to lift that world.", "Корпус уже идёт снимать этот мир."], ["MSG", "range", "That hull is short-legged for a ring that far out. A bigger class, or a newer generation, can make it.", "Этому корпусу не хватает дальности до этого кольца. Нужен класс побольше или новое поколение."], ["MSG", "ghost", "That world is dead. Nothing there to settle.", "Этот мир мёртв. Заселять нечего."], ["MSG", "retired", "The yards no longer build that generation.", "Верфи это поколение больше не строят."], ["MSG", "copied", "Run log copied.", "Лог скопирован."], ["MSG", "copyfail", "Could not copy — select the text and copy by hand.", "Не скопировалось — выдели текст и скопируй руками."], ["MSG", "off", "That system is switched off in this build.", "Эта система пока отключена в сборке."], ["MSG", "noroute", "No line set.", "Линия не задана."], ["MSG", "lineSet", "Line set — the hauler leaves now.", "Линия задана — тягач уходит."], ["MSG", "policySet", "Line running — it will keep itself going.", "Линия работает — дальше она сама."], ["MSG", "queued", "Orders sent — it changes line when it next docks.", "Приказ ушёл — сменит линию, когда причалит."], ["MSG", "noPick", "Pick a hull first.", "Сначала выбери корпус."], ["MSG", "lost", "That hull is missing.", "Этот корпус пропал."], ["MSG", "samenode", "Both ends are the same place.", "Оба конца — одно и то же место."], ["MSG", "textsOk", "Texts reloaded from the sheet.", "Тексты подтянуты из таблицы."], ["MSG", "textsNoUrl", "No sheet link in this build.", "В этой сборке нет ссылки на таблицу."], ["MSG", "textsFail", "Could not reach the sheet — keeping the built-in texts.", "Таблица недоступна — остаются встроенные тексты."], ["RES", "metal", "metal", "металл"], ["RES", "food", "rations", "провизия"], ["RES", "fuel", "fuel", "топливо"], ["RES", "parts", "parts", "детали"], ["GUIDE", "p1.title", "You are the relay desk", "Ты — пульт связи"], ["GUIDE", "p1.kicker", "Earth is dying and you never leave it. Everything you see is a report, and reports are old.", "Земля умирает, и ты с неё никогда не улетаешь. Всё, что ты видишь, — доклады, а доклады всегда старые."], ["GUIDE", "p1.b1", "Earth burns <b>rations<\/b> and <b>metal<\/b> every year, and burns a little more every year. Nothing you do stops that.", "Земля каждый год сжигает <b>провизию<\/b> и <b>металл<\/b>, и с каждым годом чуть больше. Остановить это нельзя."], ["GUIDE", "p1.b2", "You sit at the desk on Earth. You order hulls built, worlds settled and lines opened. You never fly.", "Ты сидишь за пультом на Земле. Заказываешь корпуса, заселяешь миры, открываешь линии. Сам никуда не летишь."], ["GUIDE", "p1.b3", "The desk is an institution, not a person. It outlives everyone who ever sat at it.", "Пульт — ведомство, а не человек. Оно переживает всех, кто за ним сидел."], ["GUIDE", "p1.b4", "Earth starves if the holds run empty for <b>260 years straight<\/b>. And at some point the outer survey will bring back a date: the year the collapse reaches the sun and every charted world with it. From then on you are building an <b>ark<\/b> and the <b>drive<\/b> that can outrun it, and the score is how many of the people aboard wake at the other end.", "Земля гибнет, если склады пусты <b>260 лет подряд<\/b>. А однажды дальняя разведка привезёт дату — год, когда коллапс достигнет солнца и каждого нанесённого мира. С этого дня ты строишь <b>ковчег<\/b> и <b>двигатель<\/b>, который от коллапса уйдёт, а счёт — сколько посаженных на ковчег проснутся на месте."], ["GUIDE", "p2.title", "The loop", "Петля"], ["GUIDE", "p2.kicker", "Settle a world, open a line, let it run. That is the whole game in one sentence.", "Засели мир, открой линию, дальше она сама. Вся игра в одном предложении."], ["GUIDE", "p2.b1", "Click a world on the chart. In the <b>Target<\/b> panel pick a free hull and press <b>Found<\/b>. The party is as many as the world takes and the hold carries.", "Нажми на мир на карте. В панели <b>Объект<\/b> выбери свободный корпус и нажми <b>Основать<\/b>. Партия — столько, сколько мир вмещает и трюм увозит."], ["GUIDE", "p2.b2", "Once it is settled, press <b>+<\/b> next to a hull class on the world's card. The yards build the hull if none is idle, and it runs world &#8596; Earth by itself, forever.", "Когда мир заселён, нажми <b>+<\/b> у класса корпуса на его карточке. Верфи построят корпус, если свободного нет, и он сам будет ходить мир &#8596; Земля вечно."], ["GUIDE", "p2.b3", "Outbound it carries settlers (and metal and rations to industrial worlds). Inbound it carries whatever that world produces.", "Туда он везёт поселенцев (а на промышленные миры — металл и провизию). Обратно — то, что этот мир производит."], ["GUIDE", "p2.b4", "You never load a ship by hand. If a line cannot keep up, raise the order by one. A new generation replaces the old hulls by itself.", "Ты никогда не грузишь корабль руками. Если линия не справляется — подними приказ на один. Новое поколение само сменит старые корпуса."], ["GUIDE", "p3.title", "Four resources, four kinds of world", "Четыре ресурса, четыре типа миров"], ["GUIDE", "p3.kicker", "Every world does exactly one job. Earth consumes; the colonies produce.", "Каждый мир делает ровно одно дело. Земля потребляет, колонии производят."], ["GUIDE", "p3.b1", "<b>Mining worlds<\/b> dig metal. <b>Agricultural worlds<\/b> grow rations. <b>Fuel worlds<\/b> pump fuel. All three sit on a <b>finite seam<\/b>.", "<b>Рудные миры<\/b> дают металл. <b>Аграрные<\/b> — провизию. <b>Топливные<\/b> — топливо. У всех трёх <b>конечная жила<\/b>."], ["GUIDE", "p3.b2", "<b>Industrial worlds<\/b> make <b>parts<\/b> — but only out of metal and rations you haul in to them. Nothing arrives, nothing is made.", "<b>Промышленные миры<\/b> делают <b>детали<\/b>, но только из привезённых туда металла и провизии. Ничего не привёз — ничего не сделано."], ["GUIDE", "p3.b3", "Metal and rations keep Earth alive. Fuel is spent on every departure — and, later, by the machines on your worlds. Parts buy hulls, surveys, the drive programme and every kit of machines.", "Металл и провизия держат Землю живой. Топливо тратится на каждый вылет — а позже его жжёт техника на твоих мирах. Детали идут на корпуса, разведку, двигатель и на каждый комплект техники."], ["GUIDE", "p3.b4", "Colonies feed themselves and never breed. Every settler on a world was carried there by you.", "Колонии кормят себя сами и не размножаются. Каждый поселенец на планете привезён тобой."], ["GUIDE", "p3.b5", "<b>Hands<\/b> are the fourth. Earth turns out 1.5 a year and they never eat, but they are spent: every hull holds its crew for its whole service life, a survey burns a party outright, and a settlement takes 26. Hands left at home raise Earth’s own output with diminishing returns. Hands at home or hulls in the dark — that is the trade.", "<b>Руки<\/b> — четвёртый. Земля даёт 1.5 в год, они ничего не едят, но их тратят: каждый корпус держит экипаж всю службу, разведка сжигает партию безвозвратно, поселение стоит 26. Руки, оставшиеся дома, поднимают выработку Земли с затухающей отдачей. Руки дома или корпуса во тьме — вот размен."], ["GUIDE", "p4.title", "Hulls: class and range", "Корпуса: класс и дальность"], ["GUIDE", "p4.kicker", "Three classes, and the class decides how far out it can work.", "Три класса, и класс решает, как далеко корпус способен работать."], ["GUIDE", "p4.b1", "<b>Courier<\/b> — small, fast, cheap. <b>Hauler<\/b> — middling. <b>Freighter<\/b> — huge, slow, dear.", "<b>Курьер<\/b> — маленький, быстрый, дешёвый. <b>Тягач<\/b> — средний. <b>Грузовоз<\/b> — огромный, медленный, дорогой."], ["GUIDE", "p4.b2", "Range is <b>class plus generation<\/b>. At generation 0 a courier reaches ring 2, a hauler ring 3, a freighter ring 4. Every drive mark pushes all three out by one ring.", "Дальность = <b>класс плюс поколение<\/b>. На поколении 0 курьер достаёт до кольца 2, тягач до 3, грузовоз до 4. Каждая отметка двигателя двигает все три на одно кольцо дальше."], ["GUIDE", "p4.b3", "So the near rings are courier work — short round trips, where speed pays. The frontier is freighter country, and nothing else will get there.", "Поэтому ближние кольца — работа курьеров: короткий круг, где окупается скорость. Фронтир — территория грузовозов, больше туда никто не дойдёт."], ["GUIDE", "p4.b4", "A hull rated too short simply refuses the order. The chart marks every ring with the class it needs.", "Корпус, которому не хватает дальности, просто не примет приказ. На карте у каждого кольца написано, какой класс нужен."], ["GUIDE", "p4.b5", "Every hull is also <b>crew<\/b>, taken off Earth the day she is laid down: courier 8, hauler 20, freighter 45, and more for each generation. Scrap her and they come home. Lose her and they are gone.", "Каждый корпус — это ещё и <b>экипаж<\/b>, снятый с Земли в день закладки: курьер 8, тягач 20, грузовоз 45, и больше с каждым поколением. Спишешь — вернутся. Потеряешь — нет."], ["GUIDE", "p5.title", "Growth, and why it never ends", "Рост, и почему он не кончается"], ["GUIDE", "p5.kicker", "Further out means richer, more dangerous and dearer. There is no last ring.", "Дальше — значит богаче, опаснее и дороже. Последнего кольца не существует."], ["GUIDE", "p5.b1", "Seams run out. A worked-out world is lifted and leaves a grave marker on the chart.", "Жилы кончаются. Выработанный мир снимают, на карте остаётся могильная отметка."], ["GUIDE", "p5.b2", "<b>Survey<\/b> (Earth tab) charts the next ring. It costs rations, fuel, metal and parts, and needs enough <b>settled worlds<\/b> — every world you have ever settled counts, even a spent one.", "<b>Разведка<\/b> (вкладка Земля) наносит следующее кольцо. Стоит провизии, топлива, металла и деталей, и требует достаточно <b>заселённых миров<\/b> — считаются все, что ты когда-либо заселял, даже выработанные."], ["GUIDE", "p5.b3", "You may chart a ring no hull of yours can reach yet. You will see it and not be able to touch it.", "Нанести на карту кольцо, куда твои корпуса ещё не долетают, теперь можно. Ты будешь его видеть и не сможешь тронуть."], ["GUIDE", "p5.b4", "The <b>drive programme<\/b>, hosted by an industrial world, is what closes that gap: it opens the next generation of hulls, pushes every range out by one ring and makes every crossing faster. With Generation III yards it also opens the <b>engineering programme<\/b>: kits of machines for your worlds.", "<b>Программа двигателя<\/b> на промышленном мире — то, что закрывает этот разрыв: открывает следующее поколение корпусов, двигает все дальности на кольцо дальше и ускоряет все перелёты. С верфями поколения III она открывает и <b>инженерную программу<\/b>: комплекты техники для твоих миров."], ["GUIDE", "p6.title", "The desk", "Пульт"], ["GUIDE", "p6.kicker", "The game does the arithmetic. You make the decisions.", "Арифметику считает игра. Решения принимаешь ты."], ["GUIDE", "p6.b1", "The panel in the map’s top-left lists everything that wants a decision, worst first. <b>Open<\/b> jumps to it, <b>×<\/b> silences it.", "Панель слева сверху на карте перечисляет всё, что требует решения, худшее первым. <b>Открыть<\/b> — перейти, <b>×<\/b> — убрать."], ["GUIDE", "p6.b2", "<b>Space<\/b> pauses. <b>1 / 2 / 3 / 4<\/b> set speed: a year every 1.5 seconds at 1×; 10× is for the empty stretches. <b>HOLD<\/b> stops the clock whenever a hull comes home or something changes. The journal shows the desk by default — voices, the chronicle, decisions; <b>Desk<\/b> switches to all traffic.", "<b>Пробел<\/b> — пауза. <b>1 / 2 / 3 / 4<\/b> — скорость: на 1× год идёт полторы секунды, 10× — для пустых отрезков. <b>СТОП<\/b> останавливает время, когда корпус вернулся или что-то изменилось. Журнал по умолчанию показывает пульт — голоса, летопись, решения; кнопка <b>Пульт<\/b> переключает на весь трафик."], ["GUIDE", "p6.b3", "The map fits itself to the chart. <b>Wheel<\/b> zooms, <b>drag<\/b> moves, <b>FIT<\/b> puts it all back on screen.", "Карта сама подгоняется под чертёж. <b>Колесо<\/b> — зум, <b>перетаскивание<\/b> — сдвиг, <b>ВСЯ КАРТА<\/b> — вернуть всё на экран."], ["GUIDE", "p6.b4", "The <b>journal<\/b> is also the desk’s chronicle: every shift of operators writes one line about what it inherited, every lifted world gets an epitaph. <b>Chronicle<\/b> filters it down to those.", "<b>Журнал<\/b> — ещё и летопись пульта: каждая смена операторов пишет строку о том, что ей досталось, каждый снятый мир получает эпитафию. <b>Летопись<\/b> оставляет только их."], ["GUIDE", "p6.b5", "<b>Copy run log<\/b> on the Earth tab dumps every order you gave and a snapshot every 50 years. That is what the designer reads.", "<b>Скопировать лог прогона<\/b> на вкладке Земля выгружает все твои приказы и снимок состояния каждые 50 лет. Это то, что читает дизайнер."], ["UI", "startT", "How do you want to begin?", "С чего начнём?"], ["UI", "startB", "Never played? The prologue takes ten minutes and shows one thing at a time.", "Впервые? Пролог занимает десять минут и показывает по одной вещи за раз."], ["UI", "startPro", "First time — the prologue", "Впервые — пролог"], ["UI", "startSkip", "I have played — open the desk", "Уже играл — открыть пульт"], ["UI", "startGuide", "Read the guide", "Прочитать руководство"], ["UI", "taskTitle", "Task", "Задача"], ["UI", "taskStep", "{a} / {b}", "{a} / {b}"], ["UI", "t0", "Send a hull to {p}: click the world, press Found.", "Отправь корпус на {p}: нажми на мир, нажми «Основать»."], ["UI", "t0b", "Hull {n} is away — {y} years out. Press ▶: time moves only when you let it.", "Корпус {n} ушёл — лететь {y} лет. Нажми ▶: время идёт, только когда ты разрешаешь."], ["UI", "t0c", "Landfall. Hull {n} is coming home — {y} years.", "Посадка есть. Корпус {n} возвращается — {y} лет."], ["UI", "t1", "Open a line from {p}: press + next to Courier. The hull takes the line and hauls metal home by itself, forever.", "Открой линию с {p}: нажми + у курьера. Корпус сам встанет на линию и будет возить металл домой вечно."], ["UI", "t1b", "The line is running. Wait for the first delivery — about {y} years for the round trip.", "Линия работает. Дождись первой доставки — круг около {y} лет."], ["UI", "t2", "Earth eats rations too. Settle {p} — a farm — with hull {n}, then press + next to Courier on its card.", "Земля ест и провизию. Засели {p} — ферму — корпусом {n}, потом нажми + у курьера на его карточке."], ["UI", "t2w", "Wait for a free hull at Earth.", "Дождись свободного корпуса у Земли."], ["UI", "t3", "Every departure burns fuel. Build a courier in the yards below, then settle {p} — a well.", "Каждый вылет сжигает топливо. Заложи курьер на верфях внизу, потом засели {p} — скважину."], ["UI", "t3b", "The courier is being built — {y} years.", "Курьер строится — {y} лет."], ["UI", "t3c", "Settle {p} — a well — and put a courier on its line.", "Засели {p} — скважину — и поставь курьера на его линию."], ["UI", "t4", "Parts are made only on an industrial world. Settle {p} and put a courier on its line: it carries metal and rations out and parts back.", "Детали делают только на промышленном мире. Засели {p} и поставь курьера на линию: он повезёт туда металл и провизию, а назад — детали."], ["UI", "t5", "That is the whole game. The chart is open, and everything that wants a decision now appears in this corner, worst first.", "Это вся игра. Карта открыта, а всё, что требует решения, теперь появляется в этом углу, худшее первым."], ["UI", "t5go", "Take the desk", "Принять пульт"], ["UI", "prevFound", "{n} settlers → {r}/year {dep}. The world holds {cap}; the line tops it up.", "{n} поселенцев → {r}/год ({dep}). Мир вмещает {cap}; линия доложит остальных."], ["UI", "prevLine", "Round trip {t} {yrt} · hold {cap} {dep} per run.", "Круг {t} {yrt} · за рейс до {cap} ({dep})."], ["UI", "calloutOk", "Got it", "Понятно"], ["UI", "cPeople", "Hands. Settlers and crews come from here, and only from here.", "Люди. Поселенцы и экипажи берутся отсюда, и только отсюда."], ["UI", "cMetal", "Earth burns metal every year. The arrow says whether the stockpile grows or shrinks.", "Земля сжигает металл каждый год. Стрелка показывает, растёт склад или тает."], ["UI", "cFood", "Earth burns rations too. Hunger kills faster than anything else.", "Провизию Земля тоже сжигает. Голод убивает быстрее всего."], ["UI", "cFuel", "Fuel is spent on every departure. Without it nothing leaves.", "Топливо тратится на каждый вылет. Без него никто не улетит."], ["UI", "cParts", "Parts come from the industrial world. Bigger hulls, surveys and the drive cost parts.", "Детали приходят с промышленного мира. Большие корпуса, разведка и двигатель стоят деталей."], ["UI", "cDock", "The yards. New hulls come from here; each takes its crew off Earth.", "Верфи. Новые корпуса заказывают здесь; каждый забирает экипаж с Земли."], ["UI", "cAdvisor", "From now on this panel lists what wants a decision, worst first. Open jumps to it, × silences it.", "С этого момента здесь список того, что требует решения, худшее первым. «Открыть» — перейти, × — убрать."], ["UI", "cSurvey", "Charting the next ring needs enough settled worlds — every world you have ever settled counts, even a spent one. Settle more, then survey.", "Нанести следующее кольцо можно, когда заселено достаточно миров — считаются все, что ты когда-либо заселял, даже выработанные. Засели больше, потом разведывай."], ["VOICE", "role_chief", "Shift chief", "Начальник смены"], ["VOICE", "role_captain", "Hull captain", "Капитан корпуса"], ["VOICE", "role_head", "Settlement head", "Глава поселения"], ["VOICE", "role_duty", "Duty operator", "Дежурный связи"], ["VOICE", "night_dated.1", "The outer survey came back with the readings, and I have checked them until there was nothing left to check. Past the last charted ring, space is falling in on itself. It reaches the sun in year {y}. Everything you have charted goes with it. No drive we own can outrun it; a Generation {g} drive can. {fy} I am told to say nothing else.", "Дальняя разведка вернулась с показаниями, и я проверял их, пока проверять стало нечего. За последним нанесённым кольцом пространство падает само в себя. Солнца оно достигает в год {y}. Всё, что вы нанесли на карту, уйдёт вместе с ним. Ни один наш двигатель от этого не уйдёт; двигатель поколения {g} уйдёт. {fy} Больше мне говорить не велено."], ["VOICE", "colony_founded.1", "Down. {pop} of us, one dome. Send more people while you still have them.", "Сели. Нас {pop}, один купол. Присылайте людей, пока они у вас есть."], ["VOICE", "captain_new.1", "Hull {hull}. Captain no. {k} on this hull. Never met the ones before.", "Корпус {hull}. Капитан №{k} на этом корпусе. Предыдущих не застал."], ["VOICE", "ship_missing.1", "Hull {hull} missed its call. Crew of {crew}. Holding the channel open, per regulation.", "Корпус {hull} не вышел на связь. Экипаж {crew}. Держу канал открытым, по инструкции."], ["VOICE", "last_flight.1", "Order received. We will not make it back — the table says so. Proceeding.", "Приказ принят. Обратно не успеваем — это видно по таблице. Выполняем."], ["VOICE", "evacuated.1", "Lifting off. {pop} aboard. We left the dome lights on. I do not know why.", "Снимаемся. На борту {pop}. Свет в куполе оставили. Не знаю зачем."], ["VOICE", "left_behind.1", "We can hear the countdown. Do not answer. Keep the channel for the ones who will make it.", "Слышим отсчёт. Не отвечайте. Берегите канал для тех, кто успеет."], ["VOICE", "ark_closed.1", "Boarding closed. {left} stay on the pier. The desk runs to the end.", "Посадка закрыта. {left} остаются на пирсе. Пульт работает до конца."], ["UI", "pfTitle", "Personal file", "Личное дело"], ["UI", "pfNo", "service no. {n}", "служебный № {n}"], ["UI", "pfHull", "hull {n} · captain no. {k}", "корпус {n} · капитан № {k}"], ["UI", "pfOk", "Acknowledged", "Принято"], ["UI", "names", "Adeyemi Okafor Varga Novak Lindqvist Sato Ferreira Haddad Petrov Nakamura Oyelaran Kowalski Brandt Moreau Iyer Castellanos Nygaard Dlamini Haugen Tanaka Marchetti Sorensen Abara Kimura Delacroix Ivashko Bekele Fontaine Ruiz Yilmaz Halvorsen Mbeki Andrade Sokolov Quintero Nakashima Weiss Osei Lindgren Taggart Murakami Vasquez Achebe Holm Rahimi Duarte Karlsen Obi Renaud Zielinski", "Adeyemi Okafor Varga Novak Lindqvist Sato Ferreira Haddad Petrov Nakamura Oyelaran Kowalski Brandt Moreau Iyer Castellanos Nygaard Dlamini Haugen Tanaka Marchetti Sorensen Abara Kimura Delacroix Ivashko Bekele Fontaine Ruiz Yilmaz Halvorsen Mbeki Andrade Sokolov Quintero Nakashima Weiss Osei Lindgren Taggart Murakami Vasquez Achebe Holm Rahimi Duarte Karlsen Obi Renaud Zielinski"], ["LOG", "voice", "{who} {name}: {line}", "{who} {name}: {line}"], ["VOICE", "colony_founded.2", "Landed. {pop}. The dome holds pressure. Nobody here has seen Earth; nobody here will.", "Сели. {pop} человек. Купол держит давление. Землю здесь никто не видел; никто и не увидит."], ["VOICE", "evacuated.2", "{pop} aboard. Twelve stayed to shut the reactor down. They knew the hold was full when they volunteered.", "На борту {pop}. Двенадцать остались глушить реактор. Знали, что трюм полон, когда вызвались."], ["VOICE", "captain_new.2", "Hull {hull}. I took the bridge in the dark between stars; the last captain is in the aft locker. Cargo intact.", "Корпус {hull}. Принял мостик между звёзд; прежний капитан в кормовом отсеке. Груз цел."], ["VOICE", "ship_missing.2", "Hull {hull}, {crew} aboard, no carrier for six months. Logging it as overdue, not lost. Regulation says lost.", "Корпус {hull}, {crew} на борту, полгода без несущей. Записываю как задержку, не как потерю. По инструкции — потеря."], ["VOICE", "night_dated.2", "Year {y}. The number is not mine; the machine gave it, and the machine has been right about everything smaller. The collapse takes the sun and every world on your chart. Between now and then there is one problem, not many: a Generation {g} drive. {fy} Something will change. That is your desk, not mine.", "Год {y}. Число не моё — его выдала машина, а машина не ошибалась ни в чём меньшем. Коллапс забирает солнце и каждый мир на вашей карте. До этого дня есть одна задача, а не много: двигатель поколения {g}. {fy} Что-то изменится. Это ваш пульт, не мой."], ["UI", "hArkDrive", "Ark drive", "Двигатель ковчега"], ["UI", "arkdReady", "READY", "ГОТОВ"], ["UI", "arkdWake", "{w}% wake", "проснутся {w}%"], ["UI", "arkdNext", "Generation {g} ≈ {y} → {w}%", "поколение {g} ≈ {y} → {w}%"], ["UI", "arkdLate", "{n} {yr} after the Night", "на {n} {yr} позже Ночи"], ["UI", "arkdSpare", "{n} {yr} to spare", "запас {n} {yr}"], ["UI", "arkdReach", "needs {n} worlds settled, you have {r}", "нужно заселить миров: {n}, заселено: {r}"], ["UI", "arkdHost", "no industrial world with {n} hands to host it", "нет промышленного мира с {n} людьми"], ["UI", "arkdStall", "no parts coming in", "детали не поступают"], ["UI", "arkWakeRow", "Would wake at the other end", "Проснулось бы на месте"], ["UI", "arkNoDrive", "no drive — the ark cannot sail", "нет двигателя — ковчег не уйдёт"], ["UI", "arkDriveHint", "The ark sails only on a Generation {g} drive or better, and the drive programme is what builds it. On Generation {g}, {a}% of the sleepers wake at the other end; one generation better, {b}%; two, {c}%.", "Ковчег уходит только на двигателе поколения {g} или лучше, а строит его программа двигателя. На поколении {g} на месте просыпаются {a}% спящих; на поколение лучше — {b}%; на два — {c}%."], ["UI", "nightDrive", "And one thing the readings make plain: no drive we have can outrun the collapse. An ark needs a <b>Generation {g}<\/b> drive. The header now carries two years — the Night, and the year that drive is ready at the pace your works keep. Make the second come first.", "И одно показания говорят прямо: ни один наш двигатель от коллапса не уйдёт. Ковчегу нужен двигатель <b>поколения {g}<\/b>. В шапке теперь два года — Ночь и год, когда этот двигатель будет готов при нынешнем темпе заводов. Сделай так, чтобы второй наступил раньше."], ["UI", "endNightDrive", "{b} berths stood on the pier. The Generation {g} drive to push them past the collapse was never finished. The dark closed over a full ark that could not leave.", "{b} мест стояли у причала. Двигатель поколения {g}, который должен был вынести их за коллапс, так и не достроили. Тьма сомкнулась над полным ковчегом, которому некуда было уйти."], ["UI", "statWoke", "Woke at the other end", "Проснулись на месте"], ["UI", "a_arkd_late", "The ark drive (Generation {g}) is due in year {y} at this pace — {l} {yrl} after the Night. Feed the drive programme.", "Двигатель ковчега (поколение {g}) при этом темпе будет к году {y} — на {l} {yrl} позже Ночи. Корми программу двигателя."], ["UI", "a_arkd_tight", "The ark drive (Generation {g}) is due in year {y} — only {l} {yrl} before the Night.", "Двигатель ковчега (поколение {g}) будет к году {y} — всего за {l} {yrl} до Ночи."], ["UI", "a_arkd_reach", "The ark drive (Generation {g}) needs the next drive mark, and that needs {n} worlds settled. You have settled {r}.", "Двигателю ковчега (поколение {g}) нужна следующая отметка, а ей — {n} заселённых миров. Заселено: {r}."], ["UI", "a_arkd_host", "The ark drive (Generation {g}) needs a drive programme, and no industrial world has {n} hands to host it.", "Двигателю ковчега (поколение {g}) нужна программа двигателя, а ни на одном промышленном мире нет {n} людей, чтобы её принять."], ["UI", "a_arkd_stall", "No parts are coming in. The ark drive (Generation {g}) will never be ready at this pace.", "Детали не поступают. При таком темпе двигатель ковчега (поколение {g}) не будет готов никогда."], ["LOG", "ark_drive", "GENERATION {g} DRIVE CAN PUSH THE ARK. {w}% of the sleepers would wake at the other end. The Night is still year {y}.", "ДВИГАТЕЛЬ ПОКОЛЕНИЯ {g} СДВИНЕТ КОВЧЕГ. На месте проснулись бы {w}% спящих. Ночь по-прежнему в год {y}."], ["LOG", "ark_grounded", "THE NIGHT CAME AND THE ARK STAYED ON THE PIER. {b} berths, and no Generation {g} drive to push them.", "НОЧЬ НАСТУПИЛА, А КОВЧЕГ ОСТАЛСЯ У ПРИЧАЛА. {b} мест — и нет двигателя поколения {g}, чтобы их сдвинуть."], ["LOG", "ark_woke", "Generation {g} drive. {w} of {s} woke at the other end.", "Двигатель поколения {g}. На месте проснулись {w} из {s}."], ["UI", "arkdReachLater", "{n} worlds settled on the way", "по пути нужно заселить миров: {n}"], ["VOICE", "role_sci", "Institute physicist", "Физик Института"], ["VOICE", "date_shift.1", "First shift to take the desk with the year already on the wall. Nobody here will see it. We are asked to work as if we will.", "Первая смена, принявшая пульт, когда год уже написан на стене. Никто из нас его не увидит. Нас просят работать так, будто увидим."], ["VOICE", "date_shift.2", "Year {y} is on the wall above the desk in the previous shift's hand. I have not painted over it. I have added the number of worlds.", "Год {y} написан на стене над пультом рукой прошлой смены. Я не закрасил. Я дописал число миров."], ["VOICE", "ark_drive.1", "Generation {g}. It will carry an ark past the collapse. It will not carry everyone through the crossing: {w} of every hundred wake at the other end, by the model, and the model has not been wrong yet. Every generation after this one wakes more. That is the whole of what I have to offer you.", "Поколение {g}. Оно вынесет ковчег за пределы коллапса. Не всех, кто на борту: по расчёту, на месте просыпаются {w} из каждой сотни, а расчёт пока не ошибался. Каждое следующее поколение будит больше. Это всё, что я могу вам предложить."], ["VOICE", "ark_drive.2", "The Generation {g} drive is done and it is enough. Enough is a word I used to hate. {w} out of a hundred wake at the far end; the rest do not. You can stop here and build berths, or feed the programme another generation and lose the years. I have written both columns on the same page and I am not choosing.", "Двигатель поколения {g} готов, и его достаточно. «Достаточно» — слово, которое я раньше ненавидел. Из сотни на месте просыпаются {w}; остальные нет. Можно остановиться здесь и строить места. Можно кормить программу ещё поколение и терять годы. Я записал оба столбца на одной странице и не выбираю."], ["VOICE", "doomsday.1", "{n} years to the Night and the square in front of the Institute is full every morning. Some of them say the date is a lie the desk tells to keep them digging. Some say the ark is for us and not for them, and they are not wrong about the arithmetic: berths for {b}, {h} standing at home. I have stopped reading what they paint on the doors. The lines still run.", "До Ночи {n} лет, и площадь перед Институтом полна каждое утро. Одни говорят, что дата — ложь, которую пульт рассказывает, чтобы они копали. Другие — что ковчег для нас, а не для них, и в арифметике они не ошибаются: мест на {b}, дома стоят {h}. Я перестал читать, что они пишут на дверях. Линии ходят."], ["VOICE", "doomsday.2", "There is a congregation on the pier now. They hold a service at every launch and a wake at every landing. They do not want a berth; they say the Night is owed. The yards work around them. I have {h} at home, berths for {b}, and {n} years. I do not have time to argue with the ones who have decided.", "На пирсе теперь община. Служба на каждый вылет, поминки на каждую посадку. Место им не нужно — говорят, Ночь заслужена. Верфи работают, обходя их. У меня {h} дома, мест на {b} и {n} лет. Спорить с теми, кто уже решил, времени нет."], ["VOICE", "crash.1", "Hull {hull}, on final to {p}. Lost the port cluster at two thousand metres. We are not going to make the plain. I am putting the log on the carrier so someone has it. Cargo was people.", "Корпус {hull}, заход на {p}. Потеряли левую группу на двух тысячах. До равнины не дотянем. Ставлю журнал на несущую, чтобы он у кого-то остался. Груз — люди."], ["VOICE", "crash.2", "Hull {hull}. Atmosphere on {p} is thicker than the survey said and the survey is older than I am. Structure is going. Nobody in the hold is awake for this, which is the one mercy. Closing the channel.", "Корпус {hull}. Атмосфера на {p} плотнее, чем в разведке, а разведка старше меня. Корпус расходится. В трюме никто не проснулся, и это единственная милость. Закрываю канал."], ["VOICE", "written_off.1", "Hull {hull} struck off. {crew} aboard. The regulation gives a form for this; I have filled it in and I do not know where it goes.", "Корпус {hull} списан. {crew} на борту. По инструкции для этого есть форма; я её заполнил и не знаю, куда её отдать."], ["VOICE", "written_off.2", "Closing the channel for hull {hull} after three hundred years of silence. {crew} people. I kept it open longer than the rules allow. The rules do not sit at this desk.", "Закрываю канал корпуса {hull} после трёхсот лет тишины. {crew} человек. Держал дольше, чем позволено. Правила за этим пультом не сидят."], ["VOICE", "seam_more.1", "The core samples were wrong, in our favour for once. The seam under {p} runs deeper than the chart says — {q} more {dep} in the ground. The children here will not have to move.", "Керны ошиблись, в кои-то веки в нашу пользу. Жила под {p} идёт глубже, чем на карте: в земле ещё {q} ({dep}). Здешним детям не придётся переезжать."], ["VOICE", "seam_more.2", "{p}: we went past the depth the survey called the floor and there was no floor. {q} more {dep}, by the new bores. Send another hull, not more people.", "{p}: прошли глубину, которую разведка называла дном, а дна нет. По новым скважинам ещё {q} ({dep}). Пришлите ещё корпус, а не людей."], ["VOICE", "seam_less.1", "{p}: the seam pinched out {q} short of the survey. The prospector who signed the chart has been dead for a century. We are digging the walls now and counting the years, not the tonnes.", "{p}: жила сошла на нет, недодав {q} против разведки. Тот, кто подписал карту, умер сто лет назад. Копаем стенки и считаем годы, не тонны."], ["VOICE", "seam_less.2", "We opened the lower gallery on {p} and found rock. {q} {dep} that the chart promised are not there and never were. Tell the desk to plan the lift early. We would rather leave than starve here.", "Открыли нижний штрек на {p} и нашли породу. {q} ({dep}), обещанных картой, там нет и не было. Передайте пульту: планируйте снятие заранее. Лучше уйти, чем голодать здесь."], ["VOICE", "seam_rich.1", "{p}: a pocket opened under the main gallery, {q} {dep} sitting loose. It will not fit on the next hull. It will not fit on the next three.", "{p}: под главным штреком открылся карман, {q} ({dep}) лежит россыпью. На следующий корпус не влезет. На следующие три тоже."], ["VOICE", "wreck.1", "{p}: the stack collapsed in the storm and took {q} {dep} with it. A year's work on the ground in an hour. Nobody hurt; nobody will say that is enough.", "{p}: штабель рухнул в бурю и унёс с собой {q} ({dep}). Год работы на землю за час. Никто не пострадал; никто не скажет, что этого достаточно."], ["VOICE", "disaster.1", "{p}: dome two lost pressure in the night. {q} did not wake. We have moved into dome one and it is enough room, which is the worst thing I have written to you.", "{p}: второй купол ночью потерял давление. {q} не проснулись. Перешли в первый, и места хватает — это худшее, что я вам писал."], ["VOICE", "disaster.2", "{p}: seismic. {q} dead under the gallery. We will dig again when the ground stops. Please do not send condolences on the carrier; send people.", "{p}: сейсмика. {q} погибших под штреком. Начнём копать, когда земля успокоится. Не шлите соболезнования по несущей; шлите людей."], ["LOG", "ev_short", "{p}: the seam is thinner than the survey said — {q} {dep} that were never there.", "{p}: жила тоньше, чем в разведке — {q} {dep}, которых там никогда не было."], ["LOG", "doomsday", "{n} YEARS TO THE NIGHT. Earth has learned to live by the date: congregations on the pier, the Institute guarded, children taught the year before they are taught to read. Berths for {b}; {h} standing at home.", "{n} ЛЕТ ДО НОЧИ. Земля научилась жить по дате: общины на пирсе, Институт под охраной, детей учат году раньше, чем читать. Мест на {b}; дома стоят {h}."], ["LOG", "shift_dated", "SHIFT {n} TAKES THE DESK. The first to inherit a year instead of a chart: {n2} to the Night. {c} worlds answering. The note says: they will not be here for it; work anyway.", "СМЕНА {n} ПРИНИМАЕТ ПУЛЬТ. Первая, кому досталась не карта, а год: до Ночи {n2}. Отвечают миров: {c}. В записке: нас тогда уже не будет; работайте всё равно."], ["LOG", "shift_long", "SHIFT {n} TAKES THE DESK. {n2} years to the Night. Nobody at this desk was born before the date. {c} worlds answering; the drive programme is the only line on the board anyone asks about.", "СМЕНА {n} ПРИНИМАЕТ ПУЛЬТ. До Ночи {n2}. За этим пультом нет никого, кто родился до даты. Отвечают миров: {c}; программа двигателя — единственная строка на доске, о которой спрашивают."], ["LOG", "shift_long2", "SHIFT {n} TAKES THE DESK. {n2} years to the Night. The Institute has stopped taking students for anything but the drive. {c} worlds answering. The handover note is a drawing of the ark; the yards have not started it.", "СМЕНА {n} ПРИНИМАЕТ ПУЛЬТ. До Ночи {n2}. Институт больше не берёт учеников ни на что, кроме двигателя. Отвечают миров: {c}. В записке — рисунок ковчега; верфи его ещё не начали."], ["LOG", "shift_long3", "SHIFT {n} TAKES THE DESK. {n2} years to the Night. The date is taught in schools now as a fact about the world, like the tides. {c} worlds answering, {h} hands at home, and every one of them knows the year.", "СМЕНА {n} ПРИНИМАЕТ ПУЛЬТ. До Ночи {n2}. Дату теперь учат в школах как факт о мире, как приливы. Отвечают миров: {c}, дома {h} рук, и каждый из них знает год."], ["LOG", "shift_dusk", "SHIFT {n} TAKES THE DESK. {n2} years to the Night. There is a congregation on the pier that holds a service at every launch. Berths for {b}; {h} standing at home. The note says: do not argue with them; count them.", "СМЕНА {n} ПРИНИМАЕТ ПУЛЬТ. До Ночи {n2}. На пирсе община, служба на каждый вылет. Мест на {b}; дома стоят {h}. В записке: не спорьте с ними; считайте их."], ["LOG", "shift_dusk2", "SHIFT {n} TAKES THE DESK. {n2} years to the Night. Three of this shift asked to be struck from the berth list. The previous shift granted it and wrote nothing else. Berths for {b}; {h} standing at home.", "СМЕНА {n} ПРИНИМАЕТ ПУЛЬТ. До Ночи {n2}. Трое из этой смены попросили вычеркнуть их из списка на места. Прошлая смена разрешила и больше ничего не написала. Мест на {b}; дома стоят {h}."], ["LOG", "shift_dusk3", "SHIFT {n} TAKES THE DESK. {n2} years to the Night. The yards run three shifts; the pier runs a fourth that builds nothing and sings. {c} worlds answering. The note says: bring them in while the lines still hold.", "СМЕНА {n} ПРИНИМАЕТ ПУЛЬТ. До Ночи {n2}. Верфи работают в три смены; на пирсе четвёртая, которая ничего не строит и поёт. Отвечают миров: {c}. В записке: возвращайте их, пока линии ещё держат."], ["UI", "logDesk", "Desk", "Пульт"], ["UI", "mutinyHdr", "Refusing orders", "Отказываются от приказов"], ["UI", "mutinied", "MUTINIED", "БУНТ"], ["UI", "mutinyHint", "These crews will not go out again. They stand on the pier and board if there is a berth. The hulls take no orders; the breakers will have them.", "Эти экипажи больше не выйдут. Они стоят на пирсе и сядут, если будет место. Корпуса приказов не принимают; списать можно."], ["UI", "a_mutiny", "{n} hull(s) refuse orders. Their crews are home; scrap the hulls for the metal or leave them.", "Корпусов, отказавшихся от приказов: {n}. Экипажи дома; спиши корпуса на металл или оставь."], ["UI", "statMutiny", "Mutinies", "Бунтов"], ["MSG", "mutiny", "That crew has refused the Night. The hull takes no orders.", "Этот экипаж отказался от Ночи. Корпус приказов не принимает."], ["LOG", "mutiny", "HULL {n} REFUSES ORDERS at {p}. The crew is bringing her home and will not go out again.", "КОРПУС {n} ОТКАЗЫВАЕТСЯ ОТ ПРИКАЗОВ у {p}. Экипаж ведёт его домой и больше не выйдет."], ["VOICE", "mutiny.1", "Hull {hull}. We have done the arithmetic on the bridge and it does not come out. We are loading what is on the ground at {p} and coming home. Log it as mutiny if the regulation needs a word.", "Корпус {hull}. Мы посчитали на мостике, и не сходится. Грузим то, что лежит на {p}, и идём домой. Запишите как бунт, если инструкции нужно слово."], ["VOICE", "mutiny.2", "Hull {hull}. The crew voted. I did not stop them, and I would not have won. We are not going back out to {p}. Whatever you do with the hull when we dock, do it after we have walked off.", "Корпус {hull}. Экипаж проголосовал. Я не мешал, и не выиграл бы. Обратно к {p} мы не идём. Что бы вы ни сделали с корпусом, когда причалим, — сделайте после того, как мы сойдём."], ["UI", "scrapAllMut", "Scrap all {n} refusing hulls", "Списать все отказавшиеся корпуса ({n})"], ["UI", "kitMine", "Mine works", "Карьерная техника"], ["UI", "kitFarm", "Combines", "Комбайны"], ["UI", "kitWell", "Drilling rigs", "Буровые установки"], ["UI", "kitWorks", "Plant", "Завод"], ["UI", "kitTier", "Tier", "Ярус"], ["UI", "kitNone", "no machines — hands and shovels", "техники нет — руки и лопаты"], ["UI", "kitFuel", "Burns", "Жжёт"], ["UI", "kitStarved", "No fuel on site. The machines stand; the world digs by hand.", "На месте нет топлива. Техника стоит, мир копает руками."], ["UI", "kitLost", "Lost to a full stockyard", "Потеряно — склад полон"], ["UI", "kitWaiting", "Tier {t} kit ({w}) is on the pier, waiting for the next hull on this line.", "Комплект яруса {t} ({w}) стоит на пирсе и ждёт следующего корпуса на линии."], ["UI", "kitTooBig", "Tier {t} kit weighs {w}. The biggest hold on this line is {h} — it will never fit. Put a bigger hull on the line.", "Комплект яруса {t} весит {w}. Самый большой трюм на линии — {h}: не влезет. Поставь на линию корпус побольше."], ["UI", "kitAboard", "Kit aboard hull {n}, {y} years out.", "Комплект на корпусе {n}, лететь {y} лет."], ["UI", "kitGate", "The engineering programme opens with Generation {g} yards. Until then the worlds work with what they landed with.", "Инженерная программа откроется с верфями поколения {g}. До тех пор миры работают тем, с чем сели."], ["UI", "kitMax", "Top tier. Nothing bigger fits on this world.", "Высший ярус. Больше сюда не поставить."], ["UI", "kitHint", "Pay the kit and this world's output goes ×{x} for good (it burns {f} fuel a year, the line brings it). The kit is cargo: the next hull on this line big enough to hold it carries it out and installs it — nothing else to do.", "Заплати за комплект — добыча этого мира навсегда ×{x} (жжёт {f} топлива в год, линия привезёт). Комплект — груз: его увезёт и поставит следующий корпус этой линии с достаточным трюмом, больше ничего делать не надо."], ["UI", "kitOrder", "Order tier {t} kit", "Заказать комплект яруса {t}"], ["UI", "kitWeight", "Needs a hold of {w} · biggest hull on this line holds {h}", "Нужен трюм {w} · самый большой корпус на линии — {h}"], ["UI", "a_kit", "{p} can take a tier {t} kit — the seam will outlast it.", "{p} может принять комплект яруса {t} — жилы хватит."], ["UI", "a_kithold", "{p}: the tier {t} kit ({w}) is stuck on the pier — no hull on that line can carry it.", "{p}: комплект яруса {t} ({w}) застрял на пирсе — на линии нет корпуса, который его увезёт."], ["UI", "a_kitfuel", "{p}: the machines stand — no fuel on site. The line should be bringing it.", "{p}: техника стоит — на месте нет топлива. Линия должна его привозить."], ["UI", "a_lost", "{p} has thrown away {n} — the stockyard is full and the line cannot keep up.", "{p} выбросил {n} — склад полон, линия не справляется."], ["UI", "a_foodpile", "Rations for {n} years in store. Not waste: the ark eats rations by the block.", "Провизии на {n} лет вперёд. Это не мусор: ковчег ест провизию блоками."], ["MSG", "kitgate", "The engineering programme is not open yet.", "Инженерная программа ещё не открыта."], ["MSG", "tiermax", "That world is at the top tier already.", "Этот мир уже на высшем ярусе."], ["MSG", "kitpending", "A kit is already on its way there.", "Комплект туда уже идёт."], ["LOG", "kit_ordered", "Tier {t} kit for {p} laid out on the pier — {w} of hold, first hull that fits takes it.", "Комплект яруса {t} для {p} выложен на пирс — {w} трюма, заберёт первый подходящий корпус."], ["LOG", "kit_loaded", "Hull {n} takes the tier {t} kit for {p}.", "Корпус {n} взял комплект яруса {t} для {p}."], ["LOG", "kit_built", "{p}: TIER {t} MACHINES RUNNING. Output ×{x}.", "{p}: ТЕХНИКА ЯРУСА {t} ЗАПУЩЕНА. Добыча ×{x}."], ["LOG", "kit_lost", "The tier {t} kit for {p} went down with the hull.", "Комплект яруса {t} для {p} пропал вместе с корпусом."], ["LOG", "kit_starved", "{p}: no fuel. The tier {t} machines have stopped.", "{p}: топливо кончилось. Техника яруса {t} встала."], ["LOG", "kit_running", "{p}: fuel arrived. The tier {t} machines are running again.", "{p}: топливо пришло. Техника яруса {t} снова работает."], ["VOICE", "kit_built.1", "The rig is up on {p}. Forty years in a hold and every bolt is where the drawing says. It drinks. Keep the fuel coming and I will send you a number you have not seen before.", "Установка на {p} стоит. Сорок лет в трюме, и каждый болт там, где на чертеже. Она пьёт. Возите топливо — и я пришлю вам цифру, какой вы ещё не видели."], ["VOICE", "kit_built.2", "{p}, tier {t}. The children came out to watch it move. Nobody here had seen a machine bigger than a dome. Output ×{x}, and I have written that on the wall.", "{p}, ярус {t}. Дети вышли смотреть, как она едет. Никто здесь не видел машины больше купола. Добыча ×{x}, и я написал это на стене."], ["VOICE", "kit_starved.1", "{p}: the tanks are dry and the tier {t} rig is a monument. We are back on shovels. Tell the desk the line is too thin.", "{p}: баки пусты, установка яруса {t} стоит памятником. Мы снова на лопатах. Передайте пульту, что линия слишком тонкая."], ["GUIDE", "p5.b5", "A <b>kit<\/b> is ordered on the world's card and paid for in metal and parts. It is cargo: the next hull on that line with a hold big enough carries it out. Each tier multiplies what the world makes and what its stockyard holds, and burns fuel every year — the line brings that too. Tier III and IV kits do not fit in a courier.", "<b>Комплект<\/b> заказывается на карточке мира за металл и детали. Это груз: его увезёт следующий корпус этой линии с достаточно большим трюмом. Каждый ярус умножает добычу и склад мира и жжёт топливо каждый год — его тоже привозит линия. Комплекты ярусов III и IV в курьера не влезают."], ["UI", "open.c1", "EARTH, YEAR 0. The mines are empty. The soil is spent. The sea is still there, and nothing lives in it.", "ЗЕМЛЯ, ГОД 0. Рудники пусты. Почва выработана. Море на месте, и в нём ничего не живёт."], ["UI", "open.c2", "Earth burns a little more every year than the year before. Nobody argues about the number any more. They argue about the ships.", "Каждый год Земля сжигает немного больше, чем в прошлом. О цифре давно не спорят. Спорят о кораблях."], ["UI", "open.c3", "A hundred nations would race each other to the same rocks. So there is one Institute, and at its centre one desk. It answers to no government, and it never sleeps.", "Сто стран гонялись бы за одними и теми же камнями. Поэтому Институт один, и в его центре — один пульт. Он не подчиняется ни одному правительству и никогда не спит."], ["UI", "open.c4", "The desk orders hulls built. It names the worlds and sends people out to settle them. It opens the lines that carry back whatever those worlds dig, grow and pump. Nothing else on Earth does any of this.", "Пульт заказывает корпуса. Он даёт имена мирам и отправляет туда людей. Он открывает линии, которые везут назад всё, что эти миры добывают, растят и качают. Больше на Земле этого не делает никто."], ["UI", "open.c5", "A shift at the desk is eighty years. The first shift sits down today. It is you. You will not see the end of anything you begin.", "Смена за пультом — восемьдесят лет. Первая смена садится сегодня. Это ты. Ты не увидишь конца ничего из того, что начнёшь."], ["UI", "open.c6", "Keep the holds full. That is the whole job. For now.", "Держи трюмы полными. Вот и вся работа. Пока что."], ["UI", "openNext", "Next", "Дальше"], ["UI", "openSkip", "Skip", "Пропустить"], ["UI", "openBegin", "Sit down at the desk", "Сесть за пульт"], ["UI", "startOpen", "The opening again", "Вступление ещё раз"], ["UI", "shiftT", "Shift {n} hands over the desk", "Смена {n} сдаёт пульт"], ["UI", "shiftGo", "Take the desk", "Принять пульт"], ["UI", "shiftStop", "Stop at every shift", "Останавливаться на каждой смене"], ["UI", "shDelivered", "Brought home these "Only a courier can lift a settlement.", "Снимать поселение может только курьер."], ["MSG", "ok_evac_short", "Courier {n} is on its way to lift {p} — it holds {c}; {l} people will stay behind.", "Курьер {n} пошёл снимать {p} — трюм {c}; {l} человек останутся."], ["UI", "hullFmt", "{t} “{n}” {g}", "{t} «{n}» {g}"], ["UI", "hullNm_courier", "Hermes", "Гермес"], ["UI", "hullNm_hauler", "Sisyphus", "Сизиф"], ["UI", "hullNm_freighter", "Atlas", "Атлант"], ["UI", "lineUpkeepHint", "Set how many hulls of each class stay on this line. The yards send an idle hull from Earth first, then build a new one.", "Задай, сколько судов каждого класса держать на линии. Верфи сначала шлют свободное с Земли, потом строят новое."], ["UI", "lobe0", "Margherita", "Маргарита"], ["UI", "lobe1", "Antonio", "Антонио"], ["UI", "lobe2", "Lucia", "Лючия"], ["UI", "lobe3", "Dario", "Дарио"], ["UI", "lobe4", "Beatrice", "Беатриче"], ["UI", "lobe5", "Enzo", "Энцо"], ["LOG", "pulse_warn", "Earth announces a crisis: from year {y} it will burn twice as much “{dep}” for {n} years. Stock up.", "Земля объявляет кризис: с {y} года она будет тратить «{dep}» вдвое больше в течение {n} лет. Подготовь запас."], ["LOG", "pulse_start", "The crisis has begun: Earth burns twice as much “{dep}” for the next {n} years.", "Кризис начался: Земля тратит «{dep}» вдвое больше следующие {n} лет."], ["LOG", "pulse_end", "The crisis is over: Earth’s “{dep}” burn is back to normal.", "Кризис прошёл: расход Земли на «{dep}» вернулся к норме."], ["LOG", "pulse_short", "Earth cannot cover the extra “{dep}” demand — people are dying.", "Земля не покрывает повышенный спрос на «{dep}» — гибнут люди."], ["UI", "alertPulseT", "Earth’s demand is rising", "Спрос Земли растёт"]]</script>
<script>
/* LONG NIGHT — core simulation. No DOM. Pure state + pure-ish mutators. */

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- the chart builds itself ----------
   Sectors are generated on demand and never run out. Each one sits further
   out, digs richer and kills more often than the last. Sector 0 is gentle
   on purpose: it is where the player learns the loop. */
var SECTORS=[];
var PLANETS=[];
/* v4.21 (F-21): the chart is cut into six lobes of 60 degrees, the sides of the world. Lobe 0 is centred on twelve o'clock; ang grows clockwise on screen. */
var LOBES=6, LOBE_ARC=Math.PI*2/6;
function lobeOf(ang){ var a=((ang+LOBE_ARC*2)%(Math.PI*2)+Math.PI*2)%(Math.PI*2); return Math.floor(a/LOBE_ARC)%LOBES }
function lobeEdge(i){ return -LOBE_ARC*2+i*LOBE_ARC }
function lobeMid(i){ return -Math.PI/2+i*LOBE_ARC }

var SEC_NAMES=['NEAR DRIFT','THE SHOAL','OUTER DARK','THE WASTE','LONG SILENCE','OLD NIGHT','THE THRESHING','FAR REACH','THE UNDERTOW','LAST LIGHT'];
var W_NAMES=['Tallow','Brine','Cinder','Marrow','Solace','Vesper','Gallows','Ferrous','Hollow','Threnody','Kiln','Lantern',
 'Tinder','Ossuary','Harrow','Wick','Pale','Grist','Anvil','Vigil','Loam','Sallow','Cairn','Ember',
 'Mire','Tallowfen','Rook','Quarrel','Dross','Scupper','Bracken','Gannet','Sump','Fallow','Reave','Clinker',
 'Winnow','Barrow','Skein','Tarn','Flense','Culvert','Nettle','Scrim','Lees','Chaff','Coom','Slake'];
var DESIGS=['LV','HD','NR','KX','QT','ZD','BC','GR','TS','WN','PX','MV','AR','EL','SH','UM'];

function secName(i){ return i<SEC_NAMES.length ? SEC_NAMES[i] : 'SECTOR '+(i+1) }
function secRadius(i){ return 170+i*88 }

/* every sector gets one of each trade, so the player is never starved of fuel
   the way the hand-built chart starved them (one well in twelve worlds). */
function genSector(rnd, i){
  var kinds = ['mine','mine','farm','well','works'];
  if(rnd()<0.62) kinds.push(rnd()<0.62?'mine':'farm');
  var inner = 16+i*46, outer = 46+i*62;
  var worlds=[], used=[];
  for(var j=0;j<kinds.length;j++){
    var t=(j+rnd()*0.7)/kinds.length;
    var ang=(t*Math.PI*2+rnd()*0.4)%(Math.PI*2);
    var dist=Math.round(inner+(outer-inner)*(0.25+rnd()*0.75));
    var kind=kinds[j];
    var rich = (0.75+i*0.62)*(0.80+rnd()*0.55);
    var hab  = kind==='farm' ? 0.65+rnd()*0.32 : (kind==='works'? 0.12+rnd()*0.22 : 0.18+rnd()*0.45);
    var haz  = Math.min(0.42, 0.04+i*0.031+rnd()*0.07);
    worlds.push({sec:i, dist:dist, kind:kind, rich:+rich.toFixed(2),
                 hab:+hab.toFixed(2), haz:+haz.toFixed(2), ang:+ang.toFixed(3),
                 dep: kind==='mine'?'metal':(kind==='farm'?'food':(kind==='well'?'fuel':'parts'))});
  }
  worlds.sort(function(a,b){return a.dist-b.dist});
  return worlds;
}

/* Appends one more sector to the chart. Called at world-gen and on every survey. */
function openSector(G){
  var i=SECTORS.length;
  var rnd=mulberry32((G.seed^0x9E3779B9)+i*7919);
  SECTORS.push({name:secName(i), r:secRadius(i)});
  var ws=genSector(rnd,i);
  for(var j=0;j<ws.length;j++){
    var w=ws[j], n=PLANETS.length;
    w.id='w'+n;
    w.name=W_NAMES[n%W_NAMES.length]+(n>=W_NAMES.length?' '+(Math.floor(n/W_NAMES.length)+1):'');
    w.desig=DESIGS[(n*5+i)%DESIGS.length]+'-'+(1+(n*7)%97);
    PLANETS.push(w);
    if(G.reserves) G.reserves[w.id]= w.kind==='works' ? Infinity
      : Math.round(w.rich*K.RESERVE_BASE*Math.pow(K.RESERVE_GROW,i)*(w.kind==='farm'?1.5:1));
  }
  G.sectors=SECTORS.length;
  return i;
}

/* what it costs to push the chart one sector further out */
function surveyCost(n){
  return { metal: Math.round(140*Math.pow(1.40,n)),
           food:  Math.round(400*Math.pow(1.52,n)),
           fuel:  Math.round(210*Math.pow(1.48,n)),
           parts: Math.round(40*Math.pow(1.50,n)),   // v3.2: parts were the one gate on every survey
           people: Math.round(K.SURVEY_PEOPLE*Math.pow(K.SURVEY_PEOPLE_GROW,n)) };
}
/* v3.2: the chart is no longer bounded by what the fleet can reach. You may
   chart a sector you cannot yet fly to — seeing the prize before you can take
   it is the pressure the drive programme is supposed to relieve. */
function canSurvey(G){
  var n=SECTORS.length, c=surveyCost(n), E=G.earth;
  if(settledCount(G)<K.SURVEY_REACH*n) return 'settled';
  if(E.metal<c.metal) return 'metal';
  if(E.food<c.food) return 'food';
  if(E.fuel<c.fuel) return 'fuel';
  if(E.parts<c.parts) return 'parts';
  if(E.people-K.EARTH_KEEP<c.people) return 'people';
  return 'ok';
}
function survey(G){
  var chk=canSurvey(G); if(chk!=='ok') return chk;
  var c=surveyCost(SECTORS.length);
  G.earth.metal-=c.metal; G.earth.food-=c.food; G.earth.fuel-=c.fuel; G.earth.parts-=c.parts;
  G.earth.people-=c.people;                       // the survey party stays out there
  G.ledger.metalSurvey=(G.ledger.metalSurvey||0)+c.metal;
  G.ledger.peopleSurvey=(G.ledger.peopleSurvey||0)+c.people;
  var i=openSector(G);
  G.pauseNow=true;
  log(G,'surveyed',{s:secName(i)});
  if(secName(i)==='OLD NIGHT') log(G,'old_night',{});
  return 'ok';
}

/* ---------- hull generations ----------
   Three hulls per generation: small/fast/cheap, middle, big/slow/dear. Each
   generation costs about x5 the last, carries x2.6, and is the ONLY way to
   reach the sectors beyond the previous generation's range. Old hulls keep
   flying where they always flew, but the yards stop building them — that is
   the OpenTTD rule, and it is what makes the game feel like it has eras. */
/* v4.5 (Nikita, 26.09, run 768210301: 'курьеры 5–6 поколений имбовые, тягачи и грузовозы бессмысленны'):
   every class used to grow its hold ×2.4 a generation, so a Generation V courier was a Generation II hauler
   with a courier's speed. Now the classes grow apart — grow: hold per generation; burn: fuel per departure
   relative to a courier (a freighter drinks more per trip, far less per ton). */
var HULL_BASE=[
  {key:'courier',  cap:70,  speed:1.70, metal:40,  fuel:14,  parts:0,  days:7,  reach:0, crew:8,  grow:1.9, burn:1.0},
  {key:'hauler',   cap:240, speed:1.05, metal:130, fuel:45,  parts:26, days:13, reach:3, crew:20, grow:2.4, burn:1.6},
  {key:'freighter',cap:760, speed:0.80, metal:320, fuel:120, parts:85, days:21, reach:6, crew:45, grow:2.8, burn:2.2}
];
var HULLS=[];
function genHull(gen,j){
  var b=HULL_BASE[j], g=gen;
  return {id:HULLS.length, key:b.key, gen:g,
    cap:Math.round(b.cap*Math.pow(b.grow||K.GEN_CAP,g)),   // v4.5: per class
    burn:b.burn||1,
    speed:+(b.speed*Math.pow(K.GEN_SPEED,g)).toFixed(2),
    metal:Math.round(b.metal*Math.pow(K.GEN_COST,g)),
    fuel:Math.round(b.fuel*Math.pow(K.GEN_FUEL,g)),
    parts:Math.round((b.parts||(g?12:0))*Math.pow(K.GEN_PARTS,g)),
    crew:Math.round(b.crew*Math.pow(K.GEN_CREW,g)),
    days:b.days+g*4, reach:g?0:b.reach};
}
function ensureGen(gen){ while(HULLS.length<(gen+1)*3){ var g=Math.floor(HULLS.length/3); for(var j=0;j<3;j++) HULLS.push(genHull(g,j)); } }
/* ---------- range ----------
   v3.2 (Nikita, 22.09): range used to depend on generation alone, with a step of
   +3 sectors per mark. Drive marks arrive faster than the chart grows — mark II
   landed on day 350 of his run with two sectors on the board — so the limit was
   never once reached in 1843 days. It was dead code, and with it the courier was
   strictly the best hull per metal (968 hold / 1310 metal against the hauler's
   3318 / 4260), so 28 of his 36 hulls were couriers.
   Now the CLASS carries the range and the generation shifts it: a small fast
   courier is a short-legged hull, a freighter is the one with the tankage.
   The frontier belongs to the big hulls; the inner rings are courier work. */
var CLASS_RANGE={courier:1, hauler:2, freighter:3};
function classRange(key,gen){ return (CLASS_RANGE[key]||1)+gen }
function hullRange(h){ return h? classRange(h.key,h.gen||0) : 0 }
/* the furthest sector ANY hull of this generation can fly to (the freighter) */
function sectorLimit(gen){ return classRange('freighter',gen) }
function hullGen(s){ return (HULLS[s.hull]&&HULLS[s.hull].gen)||0 }
function shipRange(s){ return hullRange(HULLS[s.hull]) }
function canReachSector(s,sec){ return sec<=shipRange(s) }
/* cheapest class that can serve a sector at this generation; null = nothing can */
function classFor(sec,gen){
  var order=['courier','hauler','freighter'];
  for(var i=0;i<order.length;i++) if(classRange(order[i],gen)>=sec) return order[i];
  return null;
}
/* generation needed before any hull can reach this sector */
function genForSector(sec){ return Math.max(0, sec-CLASS_RANGE.freighter) }

var K={
  UNREST_ON:0,         // 0 = colonies never resent anything (Nikita, 21.09: too fast, parked)
  APPETITE:520,        // Earth's daily burn grows with the calendar
  DECAY_KNEE:2400,     // ...and then faster than linear, so no plateau is ever safe
  EVENT_CHANCE:0.006,  // roughly one event every 170 days per run
  EARTH_EAT:3.4,       // rations Earth burns every day per baseline crew
  EARTH_BURN:2.6,      // metal Earth burns every day per baseline crew
  STARVE_KILL:0.045,   // share of Earth's people lost per day with empty larders
  MEND:0.004,          // share of the dead made good per day once fed again
  QUOTA_PERIOD:40,
  Q_METAL:55, Q_FOOD:45, Q_PARTS:26, Q_PARTS_FROM:5, Q_GROW_M:1.105, Q_GROW_F:1.115, Q_GROW_P:1.12,
  EARTH_DECAY:0.96,
  EARTH_METAL:3.2, EARTH_FOOD:4.3, EARTH_FUEL:1.6, EARTH_PEOPLE:2.0,   // v4.8 (Nikita, 27.09, run 468256117: people stuck at ~80 from year 1400, 14 worlds, cannot expand) 1.5 → 2.0
  EARTH_CREW:70,       // hands at home that give Earth its baseline output
  /* v3.3 (Nikita, 22.09: "людей как-то копится много, будто бы они нафиг не нужны").
     Earth's output used to cap at x1.55, which is reached at 260 hands; his run
     sat at 1377 for the last 1200 days with every extra hand doing nothing, and
     nothing ever spent them. Now hands are the third currency: a hull holds its
     crew for its whole service life, a survey burns a party outright, and the
     output curve keeps paying, with diminishing returns and no ceiling worth
     hitting. Hands at home or hulls in the dark - that is the decision. */
  GEN_CREW:1.6,        // crew per hull scales with the generation, like everything else
