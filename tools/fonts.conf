<?xml version="1.0"?><!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
 <alias binding="strong"><family>Noto Sans JP</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
 <match target="pattern"><test name="family"><string>Noto Sans CJK SC</string></test><edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK JP</string></edit></match>
 <match target="pattern"><test name="family"><string>Noto Sans Mono CJK SC</string></test><edit name="family" mode="assign" binding="strong"><string>Noto Sans Mono CJK JP</string></edit></match>
</fontconfig>
